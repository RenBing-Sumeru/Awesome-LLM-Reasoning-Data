# Replacement Chinese text for `header_zh.json`.
#
# A bare string sets `one_line_summary_ch`; a mapping sets the named fields.
#
# 69 published cards shipped a `one_line_summary_ch` that still carried English:
# either a half-filled template ("X 将 <english phrase> 做成可审计的评测面"), a
# generic placeholder that summarised nothing ("本 Card 记录《English Title》…"), or
# the English sentence verbatim. Each entry below is translated from that card's
# `one_line_summary`, so the Chinese page holds Chinese only.
#
# Six more carried a long English run in `paper_type_ch` or `best_for_ch`; those are
# at the end of the file. Author names and short inline terms such as `Best-of-N`
# stay in Latin script on purpose: a reader searches for those.
#
# `scripts/normalize_library.py` writes these into `header_zh.json`. Keeping the
# file after application makes the change reviewable and re-runnable.

