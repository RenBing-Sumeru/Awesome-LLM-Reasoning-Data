# Curated routes through the collection.
#
# A path is a query rather than a hand-listed set of papers, so it stays in sync as
# batches arrive. Keys inside `match` are ANDed; values inside a key are ORed. Results
# are ordered by reading priority, then by how many artifacts the card pins, then by
# year, so the entries a newcomer meets first are the ones they can actually open.

paths:
  - id: beginner
    title: [Start here, 从这里开始]
    goal:
      - Build the vocabulary before opening dense primary papers.
      - 在钻进一手论文之前，先建立这个领域的基本词汇和心智模型。
    limit: 20
    match:
      tracks: [foundations_and_primers]
      priority: 必读

  - id: builder
    title: [Build a dataset, 构造一份数据集]
    goal:
      - Follow how reasoning datasets are sourced, generated, filtered, and released.
      - 跟着走一遍推理数据的选题、生成、过滤与发布流程。
    limit: 20
    match:
      source_role: [construction_recipe, data_release]
      construction_layer: [prompt_sourcing, trace_writing, filtering_curation, release_audit]
      priority: 必读

  - id: verifier
    title: [Design a verifier, 设计验证器与奖励]
    goal:
      - Compare programmatic checkers, process reward models, rubrics, and judges.
      - 对比程序化检查器、过程奖励模型、评分标准与大模型评审。
    limit: 20
    match:
      source_role: [verifier_reward, process_supervision]
      priority: 必读

  - id: agent
    title: [Agent trajectories, 智能体轨迹数据]
    goal:
      - Understand how interactive environments become training data and feedback.
      - 理解交互式环境如何变成训练数据与反馈信号。
    limit: 20
    match:
      source_role: [agent_environment]
      supervision_granularity: [full_episode, state_action_level]

  - id: scaling
    title: [Scaling and test-time compute, 规模化与推理时计算]
    goal:
      - Separate data scale, verifier strength, optimizer, and inference budget.
      - 把数据规模、验证器强度、优化器与推理预算这几个因素分开看。
    limit: 20
    match:
      source_role: [scaling_study]
      training_use: [rlvr, test_time_compute]

  - id: audit
    title: [Audit a claim, 审计一个结论]
    goal:
      - Learn how reasoning-data claims fail before reusing one.
      - 在复用一份推理数据之前，先知道这类结论会怎么失效。
    limit: 20
    match:
      source_role: [audit_failure]
      priority: 必读
