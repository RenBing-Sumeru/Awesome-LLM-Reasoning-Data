data_object:
  prompt_source: FLAN tasks and Orca task mixtures, with 817K newly generated Orca 2 instances tailored to task-specific reasoning
    strategies.
  trace_author: GPT-4 and the teacher-model data from Orca 1; authors choose task-strategy prompts.
  answer_format: A user task paired with a teacher response that may contain a direct answer, step-by-step reasoning, recall,
    extraction, or another task-appropriate strategy.
  process_fields:
  - generic system instruction
  - user task
  - teacher response
  - hidden generation strategy
  environment_or_substrate: Static teacher demonstrations consumed by progressive supervised fine-tuning of LLaMA-2-7B and
    LLaMA-2-13B.
  verifier_or_reward: Task-specific strategy selection and teacher quality checks; many targets rely on teacher judgment rather
    than executable correctness.
  terminal_predicate: Generate a teacher answer under a tailored strategy prompt, erase that strategy from the student input,
    and retain the task-answer training record.
recipe_metadata:
  base_model: LLaMA-2-7B and LLaMA-2-13B.
  teacher: GPT-4 for the new Orca 2 strategy-conditioned demonstrations, plus GPT-3.5 and GPT-4 data from Orca 1.
  generator: Choose a suitable reasoning strategy for each task, elicit it with a detailed teacher prompt, then erase that
    prompt before student training.
  filtering_rule: Authors map task groups to strategies intended to be useful for the smaller student; no universal programmatic
    verifier is provided.
  sampling_protocol: Progressive training on FLAN, 5M GPT-3.5 Orca 1 records, then about 1M GPT-4 Orca 1 plus 817K Orca 2
    records.
  rollout_count: null
  temperature: null
  inference_budget: The paper reports 32 A100-80GB GPUs and about 17, 40, and 23 hours for the three progressive stages of
    the 13B model.
  optimizer_or_scaffold: Progressive supervised fine-tuning with Prompt Erasing.
audit:
  source_mixture: FLAN-v2, 5M GPT-3.5 records from Orca 1, 1M GPT-4 records from Orca 1, and 817K new Orca 2 records.
  split: Training data are described in the paper, but the new 817K records are not released as an open dataset.
  decontamination: The paper does not establish complete non-overlap between all task mixtures and downstream evaluations.
  license: Model-weight terms must be checked at the official release; no open training-dataset license is available for the
    817K records.
  lineage: teacher explanation distillation lineage; extends Orca 1 by task-specific strategy selection and Prompt Erasing.
  known_failure_modes:
  - Teacher errors, hidden strategy prompts, unreleased training records, and benchmark overlap limit independent audit and
    reproduction.
  citation_status: verified
  confidence: high
  notes: Paper, full author list, Microsoft Research affiliation, training mixture, Prompt Erasing, compute, and official
    model-weight entry checked.
inclusion_reason: Orca 2 turns task-specific teacher reasoning strategies into student-visible answer traces while withholding
  the strategy prompt, so strategy choice must be learned from the task.
