one_line_summary: Orca 2 elicits task-specific reasoning strategies from GPT-4 and erases the strategy prompt during SFT so
  a smaller model learns both how and when to reason.
why_it_matters: It changes teacher imitation from copying one response style to training on strategy-tailored answer traces.
