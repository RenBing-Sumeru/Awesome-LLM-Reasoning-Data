one_line_summary: Olmo 3 is an AI2 frontier model-flow release that discloses stage-wise Dolma and Dolci data artifacts, construction
  recipes, reward contracts, code, checkpoints, and decontamination procedures.
why_it_matters: 'It makes the Track 12 distinction concrete: broad official disclosure improves auditability, but it does
  not eliminate unresolved questions about per-source rights, exact source-level provenance, judge bias, or residual contamination.'
