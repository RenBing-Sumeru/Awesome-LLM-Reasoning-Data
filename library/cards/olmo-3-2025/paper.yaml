data_object:
  prompt_source: Stage-specific Dolma 3 pools and mixes for pretraining, midtraining, and long-context extension; Dolci Think/Instruct/RL
    and RL-Zero prompt pools for post-training.
  trace_author: 'Mixed provenance: source datasets plus synthetic traces, completions, preference pairs, and tool trajectories.
    The report names GPT-4.1, o4-mini, QwQ-32B, DeepSeek-R1, Qwen 3, GPT-4o, GPT-3.5, and GPT-5 in specific construction stages;
    no single generator applies to all subsets.'
  answer_format: Pretraining documents; supervised responses and Think traces; pairwise chosen/rejected DPO responses; verifiable
    math/code/instruction outputs; scalar-reward RL rollouts; and multi-turn tool-call trajectories.
  process_fields:
  - intermediate_thinking_traces
  - reference_answers
  - preference_pairs
  - code_test_cases
  - verifier_outcomes
  - tool_calls
  - environment_outputs
  - stage_checkpoints
  - manifests
  environment_or_substrate: OlmoCore for base-model and supervised/preference training; OlmoRL with vLLM actors and DeepSpeed
    learners for RL; AWS Lambda for code-test execution; MCP-served ASC and Serper environments for portions of tool-use data.
  verifier_or_reward: Math uses normalized reference-answer comparison with SymPy; code uses test cases; precise instruction
    following uses constraint functions; chat uses a Qwen3 32B LLM judge with a 0-1 score, with or without a reference answer.
  terminal_predicate: Exact equivalence for math, passing test cases for code, satisfying every stated constraint for precise
    instruction following, LLM-judge score for chat, and adherence/correctness filters for released tool trajectories.
recipe_metadata:
  base_model: Olmo 3 Base 7B and 32B; RL-Zero starts directly from Olmo 3 Base 7B.
  teacher: Mixed disclosed generators and judges; examples include GPT-4.1, o4-mini, QwQ-32B, DeepSeek-R1, Qwen 3 32B/0.6B,
    GPT-4o, GPT-3.5, and GPT-5 in specified construction stages.
  generator: Source mixtures plus synthetic rewriting, trace/completion generation, programmatic task generation, preference
    construction, and tool-trajectory synthesis as specified per Dolma/Dolci subset.
  filtering_rule: Pretraining uses heuristic, language, quality/topic, PII, exact/MinHash/suffix-array deduplication and mixing
    filters. Post-training filters unclear or non-commercial licenses, incomplete traces, failed constraints/tests, model-identity
    artifacts, repetition, and unsuitable topics; it also applies decontamination.
  sampling_protocol: Base training uses a 5.93T-token pretraining mix, a 100B-token midtraining mix, and 50B/100B long-context
    extension. RL uses stage-specific prompt mixes, offline difficulty filtering for Think 7B, active sampling, and domain-balanced
    mixing with additional math and instruction-following emphasis.
  rollout_count: 8
  temperature: 1.0
  inference_budget: Think RL uses up to 32K response tokens; Instruct RL uses shorter budgets. The report gives RL group size
    8 and uses eight rollouts per prompt for Think 7B offline difficulty filtering.
  optimizer_or_scaffold: SFT followed by DPO and a GRPO-derived RLVR procedure with zero-gradient filtering, active sampling,
    token-level loss, asymmetric clipping, truncated importance sampling in selected runs, and no KL loss.
audit:
  source_mixture: The paper tabulates a 9.31T-token pretraining pool and 5.93T-token final mix, a 2.19T-token midtraining
    pool and 99.95B-token final mix, plus stage-specific Dolci SFT/DPO/RL counts. Official Hugging Face collections expose
    the corresponding pools, mixes, and post-training datasets.
  split: Stage- and model-specific releases exist for 7B and 32B; the official post-training collection states that datasets
    follow the model resulting from their use. A single universal train/validation/test split contract is unknown for the
    complete model flow.
  decontamination: Midtraining and long-context data are filtered with AI2 decon against the evaluation harness; all post-training
    stages use the Tülu 3 procedure with 8-gram matching and 0.5 overlap threshold plus task-specific false-positive handling.
    RL-Zero is additionally decontaminated from pretraining and midtraining data.
  license: Dolma 3 reconstruction code is Apache-2.0 and the official Olmo 3 7B Instruct model card is Apache-2.0. The license
    and reuse compatibility of every upstream and generated data subset are unknown without reviewing each released data artifact
    and its source chain.
  lineage: AI2 releases a connected model flow from Dolma 3 pools/mixes through intermediate checkpoints and Dolci/RL datasets
    to Think, Instruct, and RL-Zero models. OLMo-core v2.4.0 lists official Olmo 3 scripts, data mixes, manifests, and model
    cards.
  known_failure_modes:
  - LLM-judge rewards for chat are judgment-based and can embed judge bias.
  - Decontamination is a disclosed procedure, not proof of zero leakage.
  - Training mixes are released as reconstructions of sampled training tokens.
  - PII, quality, language, and repetition filters can have false positives or false negatives.
  - Tool trajectories can depend on changing external environments and summarized web outputs.
  - End-to-end licensing remains incomplete until every source and derivative is reviewed.
  citation_status: verified
  confidence: high
  notes: Official arXiv, AI2 project page, AI2 GitHub repositories/releases, and AI2 Hugging Face collections/model cards
    were checked. This is a Track 12 disclosure-ledger record only; it is not classified under Track 8.
inclusion_reason: A frontier model report with unusually broad, official disclosure of stage-wise data pools, training mixes,
  construction procedures, feedback contracts, intermediate checkpoints, code, manifests, and audit mechanisms.
