data_object:
  prompt_source: OpenMathReasoning questions with evaluation on AIME24, AIME25, AMC22-23, MATH500, and OlympiadBench.
  trace_author: The student model supplies four candidate solutions; high-refinement-gap teachers generate direct and candidate-conditioned
    refined targets.
  answer_format: Question, four candidate solutions, augmented candidate-conditioned prompt, teacher refined solution, direct
    teacher solution, and final self-refined answer.
  process_fields:
  - question
  - candidates
  - candidate_count
  - direct_target
  - refinement_target
  - student_solution
  - refined_solution
  - final_answer
  environment_or_substrate: Offline mathematical reasoning supervision followed by generate-then-refine inference.
  verifier_or_reward: Exact benchmark answer accuracy, pass@1, maj@k, selfRef@k, and the Refinement Gap selfRef@k minus maj@k.
  terminal_predicate: The final mathematical answer matches the benchmark reference answer.
recipe_metadata:
  base_model: Qwen2.5-7B-Instruct, with additional 14B and 32B experiments.
  teacher: Large teacher models selected for high Refinement Gap; exact teacher identities and prompts are documented in the
    paper appendices.
  generator: The unified fine-tuned student samples k candidate solutions then generates a refined answer conditioned on all
    candidates.
  filtering_rule: The refinement corpus intentionally retains inconsistent and all-incorrect candidate sets, alongside a direct-solving
    corpus that preserves candidate quality.
  sampling_protocol: Use four candidates for primary matched-budget comparisons; analyze k from 2 through 10 for input scaling.
  rollout_count: Four candidates in main evaluation, with k varied from 2 to 10 in the scaling analysis.
  temperature: See official appendix for generation settings.
  inference_budget: Multiple candidate generations plus one candidate-conditioned refinement pass.
  optimizer_or_scaffold: Equal-weight hybrid negative-log-likelihood objective for direct solving and refinement, followed
    by parallel generate-then-refine inference.
audit:
  source_mixture: Official ACL Anthology paper.
  split: 184k direct-solving and 184k refinement instances are derived from OpenMathReasoning; five mathematics benchmarks
    are held out for evaluation.
  decontamination: The paper does not provide a formal pretraining-contamination audit.
  license: Validate OpenMathReasoning, teacher-output, base-model, and benchmark licenses before reuse.
