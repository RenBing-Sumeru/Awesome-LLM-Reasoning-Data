  changes with task difficulty and model capability.
why_it_matters: It gives Track 5 a concrete, joinable record of candidate rollouts, correctness labels, verifier rationales,
  verdicts, and filtering behavior while exposing where test-time gains can be confounded by pool construction and verifier
  error.
