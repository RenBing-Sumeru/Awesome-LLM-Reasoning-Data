one_line_summary: Absolute Zero turns a growing buffer of self-proposed Python triplets into an online RLVR curriculum, rewarding
  proposer learnability from eight solver attempts and solver correctness by execution, while releasing the recipe and seeds
  but not the complete paper-run trajectories.
why_it_matters: It makes a zero-external-task-data self-play loop operational and auditable, but also exposes the boundary
  that "zero data" still relies on pretrained models, human-designed prompts and verifiers, and can retain shortcut-bearing
  programs whose full lineage is not released.
