one_line_summary: DMAD samples 10 candidates, selects five distinct answers, and trains five-turn homogeneous debate to express
  and use 0-10 confidence with correctness, calibration, engagement, and format rewards, while releasing code but not full
  traces.
why_it_matters: It makes candidate coverage, confidence communication, reward components, and belief updates explicit trace
  fields for auditing multi-agent test-time search.
