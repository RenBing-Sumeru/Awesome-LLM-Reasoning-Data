data_object:
  prompt_source: Recent mathematics contests, arXiv papers, news, code sources, movie synopses, and newly generated or transformed
    tasks.
  trace_author: Benchmark authors and source-specific generators; evaluated model responses are separate records.
  answer_format: A versioned prompt, model response, objective answer or task-specific checker, category, and score.
  process_fields:
  - prompt
  - model response
  - ground truth or checker
  - task and category
  - release version and score
  environment_or_substrate: A dated, periodically refreshed benchmark spanning six categories and 18 tasks in the paper release.
  verifier_or_reward: Deterministic answer checks and task-specific metrics; core scores do not rely on an open-ended LLM
    judge.
  terminal_predicate: Score a response under the pinned task checker and aggregate it within a named benchmark release.
recipe_metadata:
  base_model: Not applicable; LiveBench evaluates submitted models rather than training one base model.
  teacher: Not applicable to the core evaluation record.
  generator: Curate recent or newly generated difficult tasks with objective scoring and replace a portion in later releases.
  filtering_rule: Retain challenging questions that admit objective or task-specific scoring and satisfy task-specific freshness
    rules.
  sampling_protocol: The paper release contains 1,000 questions over 18 tasks and six categories; later releases must be pinned
    separately.
  rollout_count: null
  temperature: null
  inference_budget: Model-specific; comparisons must preserve endpoint and decoding settings.
  optimizer_or_scaffold: Public evaluation harness and leaderboard.
audit:
  source_mixture: Mathematics, coding, reasoning, language, instruction following, and data analysis tasks with dated provenance.
  split: The benchmark is released by version; later refreshes replace approximately one sixth of the questions per update
    in the reported design.
  decontamination: Fresh sources and updates limit exposure to a fixed public test but do not prove zero leakage.
  license: The paper states that the official repository uses Apache-2.0; source-specific data terms still require checking.
  lineage: 'evaluation background lineage; closest comparisons: HELM and Chatbot Arena.'
  known_failure_modes:
  - Source leakage, generator artifacts, scorer bugs, and release drift can all change the meaning of a score.
