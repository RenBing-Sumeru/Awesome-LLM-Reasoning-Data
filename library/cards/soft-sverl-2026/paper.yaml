data_object:
  prompt_source: Controlled IFEval-style instruction-following prompts with decomposable, rule-checkable constraints; exact
    released training set is unavailable
  trace_author: The current shared model generates candidate responses and also samples checklist-item verification judgments
  answer_format: Prompt, atomic checklist, candidate response, repeated yes/no verifier traces per item, empirical yes-rate,
    thresholded item label, partial-credit score, final generator reward, and replay membership
  process_fields:
  - prompt
  - checklist
  - response
  - criterion
  - verifier_votes
  - yes_rate
  - pass_label
  - soft_score
  - generator_reward
  - replay_label
  - partition_penalty
  environment_or_substrate: Online self-verifying RL where one parameter set serves as response policy and checklist verifier
  verifier_or_reward: Repeated LLM yes/no votes per checklist item; item pass threshold tau_positive; response score averages
    item passes; reward combines full-pass bonus with beta-scaled partial credit
  terminal_predicate: Generator receives full reward for satisfying all checklist items and partial reward otherwise; verifier
    examples enter replay only at high-confidence positive or negative thresholds
recipe_metadata:
  base_model: unknown
  teacher: Gold verifier-improvement buffer with known item labels; exact model or label-source composition is not publicly
    released
  generator: Shared online policy/verifier model
  filtering_rule: Aggregate J verifier votes; assign positive replay label when yes-rate >= tau_positive and negative when
    yes-rate <= tau_negative; omit uncertain middle cases; select failed-response items with positive yes votes for anti-inflation
    penalty
  sampling_protocol: Generate checklist -> sample G responses -> sample J verifier votes per response-item -> threshold/average
    into soft rewards -> add confident item cases to replay -> sample gold+replay verifier tuples -> update shared model on
    generator reward + verifier co-training - partition penalty
  rollout_count: null
  temperature: null
  inference_budget: G candidate responses times K checklist items times J verifier votes per prompt; exact G, K distribution,
    J, tau values, and decoding settings require a released run configuration
  optimizer_or_scaffold: Shared-parameter RL objective combining generator optimization, verifier co-training weighted by
    lambda_v, and partition-style Yes-rate penalty weighted by lambda_p
audit:
  source_mixture: IFEval-style controlled instruction-following tasks, fixed gold verifier examples, and on-policy replay
    pseudo-labels
  split: Rule-based ground truth is used for evaluation and analysis while training uses learned checklist rewards; exact
    splits are not released
  decontamination: unknown
  license: ArXiv paper license is linked; no official code or dataset license was identified
  lineage: Prompt -> generated checklist -> on-policy responses -> repeated item-level votes -> thresholded soft reward/replay
    labels -> gold+replay verifier update -> shared policy/verifier checkpoint
  known_failure_modes:
  - Shared policy/verifier parameters can increase measured reward by becoming more permissive rather than improving responses.
  - Checklist omissions make incomplete responses look fully correct.
  - Correlated verifier votes reduce the value of repeated sampling and can produce overconfident pseudo-labels.
  - Replay pseudo-label errors can reinforce themselves across updates despite gold anchoring.
  - Partial credit can reward systematically incomplete responses.
  - No official code, gold/replay buffers, online logs, thresholds, or immutable checkpoints are released.
  citation_status: verified
  confidence: medium
  notes: Official arXiv v1 and Cohere Labs official research listing checked 2026-07-12. No author-linked implementation or
    data release was found.
inclusion_reason: Defines an unusually explicit self-verifier refresh loop with repeated votes, confidence-gated replay, gold
  anchoring, and an anti-inflation penalty.
