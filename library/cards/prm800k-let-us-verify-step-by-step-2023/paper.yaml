data_object:
  prompt_source: MATH problems and OpenAI PRM800K released process-supervision records
  trace_author: OpenAI generator models produce step-by-step solutions; human annotators provide per-step ratings.
  answer_format: JSONL records with problem text, ground truth, generated steps, candidate completions, human ratings, flags,
    final answers, answer-grader results, split metadata, and optional PRM scores
  process_fields:
  - MATH problem and subject metadata
  - generated solution steps
  - per-step candidate completion
  - human rating or flag
  - chosen continuation
  - final answer and answer-grader result
  - split and data-version metadata
  environment_or_substrate: MATH problem-solving traces with human process-supervision labels
  verifier_or_reward: human step labels train or evaluate process reward models; final-answer grader supports outcome comparisons.
  terminal_predicate: final-answer grader determines terminal correctness for outcome-supervision comparisons.
recipe_metadata:
  base_model: Not a fully reproducible public model-training recipe; the paper trains PRMs internally while this Card treats
    the public release as data, reward, and evaluation surface.
  teacher: Human annotators following OpenAI PRM800K annotation instructions.
  generator: OpenAI-generated step-by-step solutions for MATH problems, with active learning used to target plausible mistakes.
  filtering_rule: Use source-backed construction claims; pin label semantics, split, answer grader, Git LFS data version,
    and whether released labels are used for training or evaluation.
  sampling_protocol: Pin PRM800K commit, MATH split, generator provenance, solution sampling count, PRM scoring rule, answer
    grader revision, and evaluation subset before comparing scores.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation budget is model- and harness-specific; do not infer a training-time budget from benchmark scores.
  optimizer_or_scaffold: process_reward_model_best_of_n_selection
audit:
