  split: Pin PRM800K data version, MATH split files, and the nonstandard representative MATH test subset before score reuse.
  decontamination: Public PRM800K labels and generated reasoning traces can leak into future training data; evaluation use
    requires split and training-data audits.
  license: The official GitHub repository includes an MIT license; third-party MATH dataset terms still need separate review.
  lineage: 'Primary lead: https://arxiv.org/abs/2305.20050'
