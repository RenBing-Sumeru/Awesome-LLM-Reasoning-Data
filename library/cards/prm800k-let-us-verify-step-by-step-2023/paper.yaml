  - Human step labels depend on annotation instructions and are not formal proof certificates.
  - Scores can change with split choice, generator model, sampling count, answer grader, PRM scoring rule, or data version.
  - Released labels can be used for training or evaluation, so contamination and protocol boundaries must be explicit.
