one_line_summary: OpenAI's GPT-4.5 system card discloses broad public/partnership/in-house data categories, smaller-model-derived
  alignment data, SFT, RLHF, filtering, and selected safety evaluation protocols, but not reproducible data or feedback contracts.
why_it_matters: 'It is a central Track 12 comparison point: the report offers meaningful stage-level and safety-evaluation
  disclosure, yet makes visible which missing artifacts prevent independent audit of source provenance, post-training feedback,
  reward mechanisms, filtering, and lineage.'
