one_line_summary: WOMD-Reasoning converts 63,000 WOMD scenes into 2.94 million GPT-4 Turbo Q&As, including 409,000 interaction
  and intention records that may depend on future trajectories.
why_it_matters: It is a large driving-language supervision object with explicit scene lineage and released construction prompts,
  but reuse requires separating factual from generated reasoning, marking future-conditioned targets, and auditing the unverified
  majority of records.
