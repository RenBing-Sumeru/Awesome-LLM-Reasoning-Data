one_line: A 50B-token screenshot-native GUI-agent pipeline combining normalized action traces, synthetic thoughts, online
  VM rollouts, human corrections, reflective SFT, and action-level DPO.
one_line_summary: UI-TARS discloses a roughly 50B-token native GUI-agent pipeline spanning screenshot perception, normalized
  demonstrations, synthetic thoughts, online VM rollouts, human corrections, annealed SFT, and action-level DPO, while leaving
  mixture, rights, split, and verifier details incomplete.
why_it_matters: It provides concrete construction lineage for computer-use reasoning traces and preference pairs while showing
  why in-domain benchmarks, opaque filters, terminal contracts, and unreleased environments require audit.
