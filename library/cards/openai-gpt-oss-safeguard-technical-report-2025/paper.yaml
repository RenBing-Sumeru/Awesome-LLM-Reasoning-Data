data_object:
  prompt_source: At inference, a developer supplies a policy and content to classify. The provenance, mixture, and schema
    of policy-labelling training inputs are undisclosed.
  trace_author: The released model generates a full chain of thought. The authorship, supervision, retention, and provenance
    of post-training traces are undisclosed.
  answer_format: A policy decision/conclusion with reasoning; Structured Outputs are supported. Exact output schema and label
    ontology are developer- and policy-dependent.
  process_fields:
  - policy
  - content_to_classify
  - chain_of_thought
  - policy_decision
  environment_or_substrate: The report describes inference-time policy classification and evaluations, but not the post-training
    environment, tool interface, or trajectory substrate.
  verifier_or_reward: OpenAI says its Safety Reasoner approach began with reinforcement fine-tuning on policy-labelling tasks
    that rewarded mirroring correct human-expert judgments. It calls gpt-oss-safeguard an open-weight implementation of that
    approach, but does not disclose the released model's reward implementation, labels, calibration, or acceptance thresholds.
  terminal_predicate: For internal multi-policy evaluation, success is exact matching of golden-set labels for all included
    policies. No post-training termination or acceptance predicate is disclosed.
recipe_metadata:
  base_model: The models are post-trained / fine-tuned from their corresponding gpt-oss models; exact checkpoint lineage is
    unknown.
  teacher: unknown
  generator: unknown
  filtering_rule: unknown
  sampling_protocol: Low, medium, and high reasoning-effort modes are reported; sampling parameters and post-training sampling
    protocol are unknown.
  rollout_count: null
  temperature: null
  inference_budget: Reasoning effort is configurable as low, medium, or high. Numerical budgets and training-time compute
    allocation are unknown.
  optimizer_or_scaffold: The report establishes post-training from gpt-oss. The official release describes the Safety Reasoner
    approach as beginning with reinforcement fine-tuning on policy-labelling tasks, but exact applicability to the release,
    RL algorithm, objective, optimizer, and schedule are undisclosed.
audit:
  source_mixture: No training or post-training source manifests, proportions, item counts, policy corpus, or source rights
    are disclosed. The report only states that no additional biological or cybersecurity data were used.
  split: Internal multi-policy evaluation has golden-set labels, but memberships, split construction, and leakage controls
    are undisclosed.
  decontamination: unknown
  license: The released model weights are Apache 2.0 according to OpenAI. Training, post-training, human-feedback, and evaluation-data
    rights are unknown.
  lineage: Official sources establish gpt-oss-to-gpt-oss-safeguard fine-tuning and no additional biological or cybersecurity
    data. Checkpoint-level lineage, policy examples, human judgments, reward history, and item-level derivation are unknown.
  known_failure_modes:
  - For complex risks, dedicated classifiers trained on tens of thousands of high-quality labelled samples can outperform
    policy-based reasoning.
  - Policy reasoning can be time- and compute-intensive, limiting platform-wide scaling.
  - The safeguard models tend to underperform their gpt-oss counterparts on the reported instruction-hierarchy evaluations.
  - Unrestricted chains of thought can hallucinate content or conflict with the policy being interpreted.
  - The public report does not release training data, policy-labelling records, reward implementation, split/decontamination
    evidence, or reproducible evaluation artifacts.
  citation_status: verified
  confidence: medium
  notes: This is a Track 12 disclosure ledger. It records an open-weight policy-classification model and its official report
    without treating available weights or evaluations as a released post-training dataset or fully reproducible safety recipe.
inclusion_reason: Official OpenAI technical report for open-weight safety-reasoning models that exposes an inference-time
