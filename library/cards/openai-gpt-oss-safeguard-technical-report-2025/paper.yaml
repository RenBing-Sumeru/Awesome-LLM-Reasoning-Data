one_line_summary: OpenAI's gpt-oss-safeguard report describes open-weight models that classify developer-supplied policy/content
  pairs with chain-of-thought and a high-level human-judgment policy-labelling lineage, while withholding training records,
  reward details, and reproducibility artifacts.
why_it_matters: It is a concrete Track 12 case where released weights and transparent inference interfaces coexist with material
  gaps in data provenance, policy-label supervision, reward calibration, and evaluation auditability.
