one_line_summary: SWE-smith builds 50,137 executable Python repair tasks from test-breaking synthetic diffs and distills 5,016
  successful SWE-agent episodes selected from 17,906 attempts.
why_it_matters: It makes the environment, task-construction contract, executable feedback, and trajectory-selection boundary
  inspectable for the data-construction and open-release track.
