one_line_summary: Moral RolePlay evaluates whether safety-aligned LLMs can preserve a fictional persona across a four-level
  moral spectrum.
why_it_matters: It exposes a judgment-required failure where generic chat quality is not a valid substitute for character
  fidelity.
