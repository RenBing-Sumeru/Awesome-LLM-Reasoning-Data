one_line_summary: AndroidControl releases 15,283 human Android demonstrations with paired high-/low-level instructions and
  uses offline next-action matching to show that in-domain SFT scales much faster than out-of-domain high-level control.
why_it_matters: 'It is both a reusable offline mobile-agent trajectory object and a warning about feedback boundaries: reported
  scores measure agreement with one demonstrated next action, while replay state, discarded failures, release versioning,
  and licensing remain incompletely specified.'
