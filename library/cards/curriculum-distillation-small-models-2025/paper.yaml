status: partial
one_line_summary: Curriculum Distillation filters a 6,445-problem matched teacher pool with Math-Verify and changes trace
  style across two difficulty-aware SFT stages, but releases neither the pool nor its construction artifacts.
why_it_matters: It turns teacher mode, answer verification, difficulty, and training order into explicit data-construction
  variables; the unreleased examples, indices, prompts, and lineage keep it at recipe/audit-reference status rather than a
  reusable data release.
