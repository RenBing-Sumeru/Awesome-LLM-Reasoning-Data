one_line_summary: TagPR constructs semantically tagged personalization reasoning traces and uses structural rewards
  plus a user-aware sequence preference model for staged post-training.
why_it_matters: Provides a concrete recipe for reasoning-trace construction, preference-pair labeling, and mixed
  supervision beyond mathematics and code, with an explicit boundary between structural checks and semantic correctness.
