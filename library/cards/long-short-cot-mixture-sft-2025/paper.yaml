status: partial
one_line_summary: LS-Mixture rewrites s1K-1.1 long reasoning traces into constrained shorter variants and randomly mixes both
  for SFT, but it releases neither a rewrite verifier nor the pair-level provenance needed to audit compression fidelity.
why_it_matters: It treats reasoning-trace length as a controllable construction variable rather than only an inference-time
  budget. The accessible 1,984-row release permits inspection of the serialized examples, but missing pair IDs, rewrite settings,
  correctness checks, decontamination, and upstream provenance block direct use as an audited training recipe.
