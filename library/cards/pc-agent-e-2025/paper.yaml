one_line_summary: PC Agent-E turns 312 human Windows demonstrations into action-level screenshot-history-to-thought/action
  SFT data, but its Claude-generated branch actions are never environment-validated.
why_it_matters: It is a compact, released example of trajectory-to-SFT construction whose gains can be tied to a concrete
  data object, while clearly showing why synthetic agent actions should not be mistaken for verified environment episodes.
