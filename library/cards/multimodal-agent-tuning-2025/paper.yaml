one_line_summary: Multi-modal Agent Tuning synthesizes queries and files, executes GPT-4o-mini-controlled ReAct trajectories,
  applies query-file and trajectory judges, and fine-tunes VLM controllers on thought-and-code supervision.
why_it_matters: It documents an unusually inspectable multimodal agent-data pipeline while showing why executable traces and
  two judges are insufficient without independent correctness checks, source-rights inheritance, stable row/file lineage,
  rejected examples, and reproducible release manifests.
