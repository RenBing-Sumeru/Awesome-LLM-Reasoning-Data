data_object:
  prompt_source: GSM8K and MATH questions expanded by rephrasing, alteration, FOBAR, BF-Trans, and expression replacement.
  trace_author: GPT-4 writes prefix natural-language analysis, interleaved Python code, execution feedback, debugging turns,
    and final answers.
  answer_format: JSONL records contain `gt` and a `messages` list with user problem and assistant reasoning/code content.
  process_fields:
  - ground-truth or pseudo-answer
  - user mathematics problem
  - prefix chain of thought
  - Python code and execution/debugging trace
  - final answer
  environment_or_substrate: An external Python interpreter executes generated code and returns outputs or errors for iterative
    correction.
  verifier_or_reward: Known answers filter original-source problems; majority-vote pseudo-answers filter altered questions
    without ground truth.
  terminal_predicate: Retain answer-consistent traces after generation and debugging; inference stops at a final result or
    maximum execution rounds.
recipe_metadata:
  base_model: Llama-2 and CodeLlama at 7B, 13B, 34B, and 70B scales.
  teacher: GPT-4.
  generator: MuMath question augmentation followed by prefix-CoT and code-interleaved solution synthesis with active debugging.
  filtering_rule: Known-answer agreement for source problems and majority-vote pseudo-answer agreement for altered problems.
  sampling_protocol: Request 15 solutions per GSM8K-origin question and 30 per MATH-origin question, then select 30K records
    from each of twenty subsets for 600K total.
  rollout_count: null
  temperature: null
  inference_budget: Multiple teacher calls and Python execution/debugging rounds per candidate; exact API and maximum-round
    budgets are not fully disclosed in the dataset card.
  optimizer_or_scaffold: 'Two-stage SFT: 751K MuMath natural-language records, then 600K MuMath-Code tool-integrated records.'
audit:
  source_mixture: 751K MuMath-Data records for stage 1 and 600K MuMath-Code-Data records for stage 2, derived from GSM8K and
    MATH augmentation families.
  split: Public JSONL files MuMath-Data.jsonl and MuMath-Code-Data.jsonl; no separate validation/test split is declared on
    the dataset page.
  decontamination: The paper evaluates on source test sets and out-of-domain math sets but does not report a semantic decontamination
    pass over the augmented training records.
  license: The official Hugging Face data card does not declare a dataset license; public access is unauthenticated and governed
    by Hugging Face terms, while GPT-4 outputs and upstream sources require separate rights review.
  lineage: source question -> multi-perspective augmentation -> prefix-CoT teacher response -> Python execution and debugging
    -> ground-truth or pseudo-answer filter -> JSONL release -> two-stage SFT.
  known_failure_modes:
  - A majority-vote pseudo-answer can be confidently wrong and admit an incorrect tool trace.
  - The release lacks an explicit dataset license and per-record provenance fields.
  - Generated code can solve by shortcuts or expose unsafe interpreter behavior if replayed without isolation.
  citation_status: verified
  confidence: high
  notes: ACL Anthology paper and BibTeX, official repository, public JSONL file tree, two actual records and schema, access
    terms, source affiliations, and adoption counters checked on 2026-07-14.
inclusion_reason: The paper centrally releases reusable problem-reasoning-code-answer demonstrations whose debugging and execution
  traces are consumed by SFT.
