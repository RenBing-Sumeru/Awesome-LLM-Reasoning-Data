one_line_summary: MLR separates long reasoning into planner-generated cognitive subgoals and executor-generated details, with
  Step-DPO turning outcome feedback into scalable stepwise preferences.
why_it_matters: It releases structured step descriptors rather than only raw CoT, providing a concrete supervision interface
  for planner–executor reasoning.
