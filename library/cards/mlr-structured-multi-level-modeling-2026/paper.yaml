data_object:
  prompt_source: MATH, AIME24, GPQA, and BoardgameQA instances.
  trace_author: Full reasoning trajectories are segmented into structured steps by the release pipeline.
  answer_format: Prompt, full trace, response, correctness flag, and steps with cognitive mode, subgoal, summary, outcome,
    and original text.
  process_fields:
  - cognitive_mode
  - subgoal
  - summary
  - outcome
  - text
  - correct
  environment_or_substrate: A high-level planner alternates with a low-level executor to produce long CoT.
  verifier_or_reward: Iterative Step-DPO uses TSMC to derive process-level preferences from outcome signals.
  terminal_predicate: The trajectory's final response is correct on the underlying benchmark.
recipe_metadata:
  base_model: The paper uses a base model as low-level executor and a lightweight LoRA module as high-level planner.
  teacher: Structured trajectory segmentation and iterative preference construction from model reasoning.
  generator: Full reasoning trajectories released as segmented and annotated steps.
  filtering_rule: Paragraph units are merged into steps and assigned dominant cognitive roles and concise subgoals.
  sampling_protocol: Generate full trajectories, segment them, label step descriptors, and iteratively optimize planner behavior
    with Step-DPO and TSMC.
  inference_budget: See the official ICLR paper for task-specific rollout and preference budgets.
  optimizer_or_scaffold: LoRA high-level policy plus iterative Step-DPO with Twisted Sequential Monte Carlo.
  rollout_count: null
  temperature: null
audit:
  source_mixture: Four reasoning benchmarks and model-generated full trajectories transformed into structured step annotations.
  split: The dataset supplies one train split for each of MATH, AIME24, GPQA, and BoardgameQA.
  decontamination: Keep benchmark evaluation instances separate from training trajectories when reproducing reported measurements.
  license: The official Hugging Face dataset is MIT licensed; source benchmark terms continue to apply.
  lineage: ICLR 2026 OpenReview paper, Georgia Tech/Cisco affiliation record, and the authors' sxiong dataset release.
  known_failure_modes:
  - Automated segmentation can misidentify semantic step boundaries
  - High-level labels can compress or obscure detail
  - Reported behavior is benchmark and base-model dependent
