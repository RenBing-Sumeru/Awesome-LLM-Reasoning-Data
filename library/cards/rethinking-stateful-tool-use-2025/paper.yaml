one_line_summary: DialogTool converts SGD/MultiWOZ into stateful App/API dialogues and evaluates six tool-lifecycle tasks
  in VirtualMobile, but official data/code, full model rollouts, reset/replay details, and artifact licensing remain unavailable.
why_it_matters: It exposes how dialogue history, tool state, missing arguments, API results, and role-conditioned responses
  interact over long horizons, while making release, contamination, recovery, and episode-level verification gaps explicit.
