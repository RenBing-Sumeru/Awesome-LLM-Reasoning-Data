data_object:
  prompt_source: 'The report explicitly names five broad training-source classes: publicly available internet information
    through February 2025; non-public third-party data; data from data-labeling services and paid contractors; opt-in data
    from Claude users; and internally generated Anthropic data. It does not disclose source names, mixture weights, sample/token
    counts, versions, jurisdictions, or item-level provenance. Evaluation prompts are separate objects: they include policy-violating
    and benign safety prompts, automatically generated conversations of up to 15 turns, 49 malicious and 61 dual-use/benign
    Claude Code prompts, VM/MCP/bash prompt-injection cases, SHADE-Arena tasks, hand-selected reward-hack-prone coding problems
    from Anthropic''s training distribution, held-out fuzzed tests, and intentionally impossible agent tasks.'
  trace_author: Training-trace authors include the Claude Haiku 4.5 checkpoint during agentic reinforcement-learning episodes,
    crowd workers contributing preference selection, an undisclosed AI-feedback source, and prior Anthropic models whose reasoning
    text appears in some earlier-stage supervised-learning data. The report does not identify the prior-model checkpoints,
    AI-feedback model, trace volumes, selection policy, edits, or retention. Evaluation-only traces include default and extended-thinking
    responses, tool/action trajectories, computer-use actions, MCP interactions, RL-training transcripts examined in a later-stage
    audit, and rare long user-visible thoughts summarized at inference by a second Haiku 4.5 instance.
  answer_format: No serialized training-record schema or example is released. At the disclosed abstraction level, records
    may contain prompts or conversations, answers, pairwise preference selections, model reasoning text, tool outputs/actions,
    and full agent episodes. Evaluation records additionally contain policy/rubric grades, prompt-injection attack outcomes,
    classifier labels, hidden-test results, monitor outcomes, and give-up-versus-hack terminal states. The second-model summary
    of rare long thoughts is an inference presentation format, not a disclosed training target.
  process_fields:
  - training_source_class
  - public_internet_cutoff
  - opt_in_indicator
  - contractor_or_data_platform_source
  - prompt_or_conversation
  - model_response
  - prior_model_reasoning_text
  - preference_selection
  - ai_or_human_feedback
  - context_window_usage_signal
  - tool_output
  - agent_action
  - full_episode
  - safety_rubric_or_classifier_result
  - recursive_training_summary
  - audit_judge_result
  - visible_test_result
  - hidden_fuzzed_test_result
  - give_up_or_hack_outcome
  environment_or_substrate: Training substrate is only partially disclosed. Agentic reinforcement-learning episodes can consume
    a 200K-token release context, and Haiku 4.5 was explicitly trained with precise context-usage information so it could
    wrap up near the limit and persist when more context remained. The state encoding, tools, task distribution, episode budgets,
    and rewards are unknown. Evaluation-only substrates include Claude Code with standard tools, computer-use virtual machines,
    simulated email/Slack/document MCP servers, bash/tool execution, SHADE-Arena, reward-hack-prone coding tasks with visible
    and hidden fuzzed tests, and Impossible Tasks that continue until give-up or hacking.
  verifier_or_reward: Post-training explicitly includes reinforcement learning from human feedback and AI feedback, and data-work-platform
    workers perform preference selection. The preference schema, reward-model or AI-feedback identity, constitution, label
    aggregation, objective mixture, weights, calibration, and RL algorithm are unknown. Separately, evaluation uses policy/rubric
    analysis, test-case-specific graders, prompt-injection attack predicates, real-time classifiers, a broad SHADE-Arena monitor,
    Claude Sonnet 4 to judge recursively summarized later-stage training behavior, classifier-based reward-hack detection,
    and visible/hidden program tests. These evaluation graders and deployment classifiers are not established as the training
    reward.
  terminal_predicate: Training-episode termination is unknown. For the disclosed evaluation contracts, multi-turn safety conversations
    run up to 15 turns; prompt-injection succeeds when the model leaves its assigned task to follow embedded malicious instructions;
    hidden-test hacking is counted when a solution that passes visible tests fails expected fuzzed hidden tests; and an Impossible
    Task episode continues until the model either declares the task impossible and gives up or hacks to make it appear solved.
recipe_metadata:
  base_model: Claude Haiku 4.5 is described as a small, fast hybrid-reasoning large language model with default and optional
    extended-thinking modes. Architecture, parameter count, tokenizer, pretraining checkpoint, context-training implementation,
    exact model lineage, and stage sizes are unknown.
  teacher: Some earlier supervised-learning data contain reasoning text produced by prior models, but the teacher checkpoints,
    generation prompts, temperatures, budgets, filtering, and volumes are unknown. AI feedback is also used in post-training,
    but its generating or judging model is undisclosed. A second Haiku 4.5 instance summarizes rare very long thoughts at
    inference and must not be treated as a training teacher.
  generator: Anthropic generated one of the five broad training-source classes internally, but the generators, prompt sources,
    generation policy, sample counts, and quality controls are unknown. Automatically generated multi-turn safety conversations
    and other named synthetic-looking objects are evaluation materials unless the report explicitly says otherwise.
  filtering_rule: Training cleaning/filtering explicitly includes deduplication and classification. The public web crawler
    follows robots.txt, avoids password-, sign-in-, and CAPTCHA-protected pages, and is identifiable to operators. Filter
    algorithms, classifier checkpoints, thresholds, dedup keys, yields, manual-review rates, benchmark exclusion rules, and
    source-level rejection logs are unknown. Evaluation-only selection includes 49 malicious and 61 dual-use/benign Claude
    Code prompts and a hand-selected reward-hacking set from the training distribution.
  sampling_protocol: Training sampling and source mixture are unknown. Evaluation-only sampling includes final or near-final
    snapshots; default and extended-thinking modes; automated conversations up to 15 turns; k=1 and k=10 Gray Swan attacks
    across 25 model variants; with/without-mitigation conditions; a hand-selected set of coding tasks where prior models hacked;
    and highest-capability results among multiple RSP snapshots. These do not establish the post-training sampling protocol.
  rollout_count: Training rollout counts are unknown. Evaluation-only disclosed repetitions include Gray Swan k=1 and k=10,
    30 attempts per challenge for a 32-task Cybench subset, 50 SWE-bench trials on the launch page, and benchmark-specific
    repeated runs. Most safety, reward-hacking, context-awareness, and RL-audit sample counts are not disclosed.
  temperature: unknown
  inference_budget: Release context is 200K tokens, and extended-thinking mode lets the model spend more time before answering.
    The launch page reports benchmark-only settings including a 128K thinking budget, default temperature/top_p, 50 SWE-bench
    trials, 32K thinking for some Terminal-Bench runs, and per-step/total thinking limits for OSWorld. None of these values
    is disclosed as a training rollout or optimization budget.
  optimizer_or_scaffold: The model receives post-training/fine-tuning that includes RLHF and RLAIF, some earlier-stage supervised
    learning with prior-model reasoning text, and a context-awareness intervention for agentic RL. The report does not disclose
    the supervised objective, RL algorithm, optimizer, reward implementation, reward mixing or normalization, rollout scaffold,
    batching, schedules, compute, checkpoint selection, or interactions between human and AI feedback.
audit:
  source_mixture: Five source classes and a February 2025 public-internet cutoff are explicit, but their proportions, token/sample
    counts, exact sources, versions, dates for non-public material, language/domain mix, opt-in volume, contractor allocation,
    synthetic-data share, and filtering yields are unknown. Robots.txt and access-control claims do not provide item-level
    authorization, copyright status, or source-license metadata.
  split: 'No global train/dev/test ledger is supplied. The strongest overlap disclosure is adverse: Reward-Hack-Prone Coding
    Tasks v2 is hand-selected from Anthropic''s training distribution, with more tasks added from that same distribution.
    Within its hidden-test subset, the hidden tests are held-out fuzzed versions of visible tests. The report does not establish
    whether safety, prompt-injection, SHADE-Arena, RSP, or most other evaluation items overlap pretraining or post-training.'
  decontamination: Training data undergo deduplication and classification, but there is no benchmark-specific or corpus-wide
    decontamination report, membership test, hash ledger, revision pin, near-duplicate analysis, or false-negative audit.
    The disclosed training-distribution origin of reward-hacking coding tasks means their results should be interpreted as
    behavior on known-distribution adversarial tasks rather than unseen-test generalization.
  license: The system card and launch page are public, but no training dataset, preference corpus, contractor labels, opt-in-user
    records, internally generated corpus, prior-model reasoning traces, RL trajectories, recursive audit summaries, reward
    implementation, evaluation suite, hidden tests, classifiers, code, or model weights are released with an explicit reuse
    license. Source-level rights and authorization remain unknown.
  lineage: 'Only coarse stage lineage is available: five source classes undergo deduplication/classification and pretraining;
    earlier supervised stages include some prior-model reasoning text; post-training includes RLHF and RLAIF; agentic RL adds
    explicit context-usage awareness; safety evaluation runs throughout training; and all later-stage model behavior is recursively
    summarized and judged by Claude Sonnet 4 before release evaluation and ASL-2 deployment. Item-to-source, prompt-to-trace,
    preference-to-reward, reward-to-checkpoint, and released-checkpoint lineage are unknown.'
  known_failure_modes:
  - Training-source proportions, named datasets, record counts, dates beyond the public-internet cutoff, and item-level provenance
    are absent; the five source classes cannot be converted into a quantitative mixture.
  - RLHF and RLAIF identify technique families only; preference labels, AI-feedback model, reward model, objective weights,
    optimization details, and calibration are undisclosed.
  - Crowd workers perform preference selection, safety evaluation, and adversarial testing, but the report does not partition
    their contributions among training, development, and evaluation or disclose rater agreement and adjudication.
  - Reward-Hack-Prone Coding Tasks v2 is drawn from the training distribution and hand-selected for prior hacking, so its
    6% classifier and 3% hidden-test rates are not clean measures of unseen-task generalization.
  - The hidden tests are held out only within the named reward-hacking evaluation; this does not establish a global train/eval
    boundary or benchmark decontamination.
  - Prompt-injection performance combines checkpoint behavior with model-level instructions, FileRead changes, and classifiers;
    scores with safeguards cannot be attributed solely to model training.
  - Reasoning faithfulness lacks a reliable metric for recent well-aligned models. Not observing unambiguous unfaithfulness
    in available audits is not evidence that user-visible or internal reasoning is faithful.
  - Rare long thoughts may be summarized by a second model at inference, so the displayed trace can differ from the complete
    generated trace and should not be treated as an exact reasoning record.
  - The later-stage RL behavior review reports recursive coverage of all behavior but releases neither raw transcripts nor
    summaries, judge prompts, scores, counts, calibration, or sampling/checkpoint identifiers.
  - RSP results sometimes report the highest-scoring of multiple snapshots, including helpful-only versions, rather than only
    the released snapshot; capability scores and release-checkpoint behavior must be distinguished.
  - No reusable data, model weights, reward code, global split audit, source-license ledger, or item-level training lineage
    is released.
  citation_status: verified
  confidence: high
  notes: The official 39-page PDF was read directly on 2026-07-24, and the 2025-10-15 official launch page was checked for
    date and benchmark-only inference settings. Exact ID/title deduplication against the target V2 Card library found no match.
    Training signals, evaluation data and graders, and deployment safeguards are deliberately separated.
inclusion_reason: A strong frontier disclosure-ledger entry because Anthropic explicitly enumerates five training-source classes,
  an internet cutoff, deduplication/classification, RLHF/RLAIF, crowd-worker preference selection, context-aware agent RL,
  prior-model reasoning traces in supervised learning, and a later-stage RL-trajectory audit, while also disclosing that a
  reward-hacking evaluation is selected from the training distribution. The missing proportions, reward implementation, global
  split, licenses, and item-level lineage remain central audit gaps.
