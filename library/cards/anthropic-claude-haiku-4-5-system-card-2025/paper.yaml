one_line_summary: Anthropic's Haiku 4.5 system card discloses five coarse training-source classes, RLHF/RLAIF, context-aware
  agent RL, prior-model reasoning traces, and a recursive later-stage training audit, but releases no source proportions,
  reward contract, global split, or reusable records.
why_it_matters: It is unusually useful for a disclosure ledger because it connects source categories, preference labor, reasoning-trace
  lineage, agentic post-training, and reward-hacking audits in one official artifact, while explicitly revealing that a targeted
  reward-hacking evaluation comes from the training distribution and therefore should not be mistaken for a clean held-out
  test.
