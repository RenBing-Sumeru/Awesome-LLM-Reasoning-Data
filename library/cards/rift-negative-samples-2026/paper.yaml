status: partial
one_line_summary: RIFT retains eight self-generated mathematical candidates per problem, labels them with signed answer-correctness
  rewards, and fine-tunes on the full mixed-reward buffer using a stabilized positive/negative loss.
why_it_matters: It exposes the usually discarded negative side of rejection-sampling data as a first-class training signal,
  while recording that the outcome verifier, reward magnitudes, sampling budget, and loss stabilization jointly determine
  the usable trace distribution.
