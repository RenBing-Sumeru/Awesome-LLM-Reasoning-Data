one_line_summary: Self-Instruct repeatedly asks GPT-3 to invent, filter, and answer new tasks, expanding 175 human seeds into
  82,439 synthetic SFT instances.
why_it_matters: It provides the canonical inspectable loop for bootstrapping instruction data while exposing the quality limits
  of self-generated targets.
