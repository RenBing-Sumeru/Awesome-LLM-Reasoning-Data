one_line_summary: Zipping the Thought varies CoT compression in controlled synthetic data to show how data diversity, repetition,
  and RLVR affect step decomposition and length generalization.
why_it_matters: It separates trace granularity from data volume and optimization, giving concrete rules for designing compressed
  reasoning supervision.
