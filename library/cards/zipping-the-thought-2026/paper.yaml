data_object:
  prompt_source: Synthetic modulo-23 arithmetic dependency chains with random operations, names, and distractors.
  trace_author: Deterministic templates generate Explicit, Composed, and Implicit CoT targets.
  answer_format: A dependency-chain question paired with a CoT at a controlled compression granularity and a final integer
    answer.
  process_fields:
  - operation count and dependency chain
  - distractor parameters
  - CoT type and compression granularity
  - intermediate values or omitted operations
  - final answer modulo 23
  environment_or_substrate: Synthetic sequential arithmetic with executable final-answer verification.
  verifier_or_reward: Exact modulo-23 answer reward; OOD is defined by longer operation chains or unseen residue classes.
  terminal_predicate: SFT consumes generated targets; RLVR receives outcome reward for the final integer.
recipe_metadata:
  base_model: Qwen2.5 0.5B-14B and Llama 3 1B-8B models.
  teacher: Template-based generator; no external teacher model is required.
  generator: Vary operation count, compression type/granularity, order, and data scale to isolate learning behavior.
  filtering_rule: Remove train/evaluation duplicates and evaluate only exact verified answers.
  sampling_protocol: Balanced examples across operation counts; experiments use up to 768K SFT records.
  rollout_count: 8
  temperature: 1.0
  inference_budget: RLVR uses response length 2048 and batch size 256; evaluation gives longer token budgets as operation
    count grows.
  optimizer_or_scaffold: LLaMA-Factory SFT and verl GRPO with KL coefficient 0.001.
audit:
  source_mixture: Fully synthetic arithmetic chains; no natural-domain data are used.
  split: Short chains train SFT/RLVR and longer chains form OOD evaluations; repository provides generators rather than a
    fixed released dataset.
  decontamination: Generator removes exact train/evaluation duplicates.
  license: Repository license was not confirmed from the inspected README.
  lineage: Every target is generated from a known operation graph and a selected CoT compression template.
  known_failure_modes:
  - Findings may be specific to linear modulo arithmetic and length extrapolation.
  - Branching, search, domain shift, and non-Transformer architectures are not tested.
  citation_status: verified
  confidence: high
  notes: arXiv PDF and official GitHub README checked on 2026-07-13. The paper is marked under review and lists The University
    of Tokyo; no acceptance record was found.
inclusion_reason: Provides controlled evidence about when compressed reasoning traces help SFT and when RLVR can recover omitted
  atomic steps.
