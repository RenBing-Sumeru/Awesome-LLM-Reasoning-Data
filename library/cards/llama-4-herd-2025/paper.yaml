one_line_summary: Meta reports multimodal pretraining plus hard-example SFT, online RL, DPO, safety tuning, and Behemoth-to-Maverick
  codistillation for Llama 4, releases Scout/Maverick weights, and withholds the training records and core feedback stack.
why_it_matters: It lets the frontier-report ledger separate released model artifacts from unreleased multimodal data, difficulty
  labels, policy rollouts, preferences, rewards, and teacher targets, while preventing benchmark results from standing in
  for data evidence.
