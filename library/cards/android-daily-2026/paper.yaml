one_line: AndroidDaily evaluates 350 tasks across 94 closed-source Android apps with GRADE, a guideline-grounded VLM judge
  over full visual action trajectories.
one_line_summary: AndroidDaily pairs real-device mobile tasks with obligation, quality, and safety guidelines, then uses a
  two-layer VLM judge to turn screenshot-action trajectories into step diagnostics and a final success label.
why_it_matters: It exposes how judgment-based feedback can replace inaccessible app-state assertions for closed-source agent
  evaluation, while quantifying the judge's false positives, backbone sensitivity, and environment-drift risks.
