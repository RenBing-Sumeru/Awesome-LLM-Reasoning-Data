one_line: CAR records exact agent decision states and branches them under step interventions to estimate failure-causing effects,
  but live-tool state, provider randomness, and release-version drift prevent deterministic end-to-end replay.
one_line_summary: Causal Agent Replay turns a recorded agent episode into paired counterfactual branches with outcome distributions
  and step-level causal attribution, while leaving live-tool rollback and cross-version replay completeness unresolved.
why_it_matters: 'It shows how full agent episodes can supply audit supervision beyond terminal pass/fail: replayed interventions
  attach uncertainty-aware causal effects to decisions, but only when state capture, environment semantics, and the outcome
  function are trustworthy.'
