data_object:
  prompt_source: Offline instruction data spans agent, code, dialogue, instruction following, mathematics, reasoning, long
    text, safety, chemistry, life science, and physics; the vision-language portion inherits InternVL3 data and extends SOPHIA.
    Online RL uses InternBootcamp synthetic tasks, open math and multimodal datasets, internal university/competition problems,
    private multimodal collections, UltraFeedback, HH-RLHF, and anonymized user queries. Complete source inventories and mixture
    counts are unknown.
  trace_author: Offline responses are selected by best-of-N sampling, but the response generators and N are undisclosed. Online
    trajectories are generated by the current Intern-S1 policy. For open-ended preference RL, reference trajectories are produced
    by randomly selected unnamed SOTA LLMs from an undisclosed open/closed model pool.
  answer_format: Text or multimodal prompt-response records for offline training, followed by online prompt-response trajectories
    carrying a unified scalar reward. Verifiable tasks can also carry binary correctness from CompassVerifier, rules, or environmental
    feedback; open-ended dialogue receives a POLAR-7B scalar.
  process_fields:
  - prompt
  - response
  - category_label
  - difficulty_label
  - pass_rate
  - reference_answer_or_trajectory
  - reward_scalar
  - verifier_signal
  environment_or_substrate: InternBootcamp supplies more than 1,000 procedurally generated tasks across algorithms, character
    reasoning, cryptography, graphical puzzles, board games, logic, physics equations, chemistry formulas, and medical reasoning;
    full task implementations and a replayable training environment were not found in the checked Intern-S1 release.
  verifier_or_reward: Mixture-of-Rewards maps heterogeneous feedback to a scalar. InternBootcamp tasks use verifiable rewards;
    instruction-following prompts are difficulty-filtered with passrate@64; multimodal reasoning uses CompassVerifier plus
    rules for binary correctness; open-ended dialogue uses POLAR-7B. The mixture weights, per-task verifier mapping, calibration,
    and error rates are unknown.
  terminal_predicate: For tasks with ground truth, acceptance is answer correctness under CompassVerifier, rules, or environment
    feedback. Open-ended tasks have no disclosed executable terminal predicate and instead use POLAR-7B reward.
recipe_metadata:
  base_model: Qwen3-235B-A22B with InternViT-6B; the paper describes 241B total and 28B activated parameters after adding
    multimodal components.
  teacher: unknown; the paper names Qwen2.5 and other VLM/LLM tools for selected parsing, completeness, labeling, and filtering
    operations but does not identify the offline best-of-N response generator or all judge versions.
  generator: Scientific CPT data comes from archived/web PDFs, open pretraining corpora, Common Crawl, InternVL3 multimodal
    data, and scientific multimodal sources. Page-level hybrid parsing uses MinerU first and routes equation/symbol-heavy
    pages to VLM parsers. Domain-level LLM agents choose discard, rewrite, or retain actions. Offline instruction responses
    use best-of-N generation; InternBootcamp case generators and the online policy create RL records.
  filtering_rule: PDF pages undergo garble detection, page-level graph deduplication, parser-specific cleanup, and education-level
    scoring; about 20% of archived-library tokens are removed and about 50% of web-PDF tokens are retained. Scientific web
    data uses LLM labels distilled into fastText or 1.5B classifiers. Instruction data is filtered for repetition, truncation,
    hallucination, category, and difficulty, then stratified. Online RL applies domain-level mixing plus offline/online pass-rate
    filtering and removes all-correct/all-wrong rollout groups, garbled responses, infinite repetition, and high-gradient-norm
    batches.
  sampling_protocol: CPT reports 5T text tokens with more than 2.5T scientific tokens; the image-text stage reports about
    250B tokens, including 30B scientific tokens. Offline training selects best-of-N responses and tunes domain mixtures by
    atomic and compositional benchmark ablations. Internbootcamp generates more than 100,000 candidates per task and heuristically
    downsamples to more than 20,000 mixed-RL samples. Online RL generates 8 responses per prompt, uses batch size 4096, and
    trains for 600 steps.
  rollout_count: 8
  temperature: unknown
  inference_budget: Training generation limits are unknown. The reported evaluation uses max_tokens 65,536, temperature 0.7,
    top_p 0.95, and top_k 50 for Intern-S1.
  optimizer_or_scaffold: Four training stages culminate in offline then online post-training. The offline stage is conventional
    SFT over rewarded best-of-N responses. Online training adapts OREAL by removing its token-level reward model, combines
    SFT loss on positive samples with policy-gradient loss on negatives, and adds KL-Cov entropy control. It uses AdamW at
    5e-7 with weight decay 0.1, freezes the ViT encoder and MoE router, drops about 3% of samples with a gradient-norm filter,
    and averages selected checkpoints.
audit:
  source_mixture: The report gives aggregate CPT volumes, six scientific domains, named public components, private collections,
    and anonymized user-query sources, but not a complete item inventory, per-source counts, mixture weights, collection dates,
    source URLs, licenses, or record-level provenance.
  split: Offline instruction data, online RL data, and evaluation benchmarks are described separately, but no released split
    manifests or item-level mappings were found.
  decontamination: The pipeline performs page-level deduplication and data filtering, but the checked report and release do
    not provide a benchmark-overlap audit, source-level decontamination results, or memorization analysis.
  license: The official GitHub repository and released Intern-S1 weights are Apache-2.0. Rights and redistribution terms for
    the 5T-token mixture, archived/web PDFs, private collections, anonymized user queries, and generated training records
    are unknown.
  lineage: The report identifies Qwen3-235B-A22B, InternViT-6B, four broad training stages, and many source classes and transformations.
    It does not release item-level source-to-record lineage, exact generator/judge versions, stage manifests, or training
    data.
  known_failure_modes:
  - Mixture-of-Rewards combines heterogeneous reward scales without publishing mixture weights, per-task mappings, calibration,
    or cross-task error analysis.
  - CompassVerifier is intended to reduce rule-verifier false negatives, but its false-positive and false-negative rates on
    Intern-S1 training tasks are not reported.
  - Online filtering deliberately removes all-correct and all-wrong rollout groups, which changes the training distribution;
    retained and rejected records are not released for audit.
  - Private multimodal collections and anonymized user queries lack disclosed governance, consent, provenance, and license
    details.
  - Data-mixture choices are tuned against benchmark performance, but no complete contamination or test-overlap audit is disclosed.
  - Reported benchmark gains measure model behavior under the stated protocol and do not establish accuracy, legality, representativeness,
    or reusability of the unreleased training data.
  citation_status: verified
  confidence: medium
  notes: Checked the official arXiv v2 paper, InternLM GitHub repository/README, and the released Intern-S1 Hugging Face model
    card. Model weights and inference code are available; training data, task manifests, full reward stack, and replayable
    training environments were not found.
inclusion_reason: A frontier model report with unusually concrete disclosure of scientific-data mining, instruction curation,
  Internbootcamp task generation, verifier/reward routing, and online RL settings, while leaving the underlying records and
  essential audit artifacts unreleased.
