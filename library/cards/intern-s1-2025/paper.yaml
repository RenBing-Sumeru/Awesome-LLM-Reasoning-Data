one_line_summary: Intern-S1 reports 5T continual-pretraining tokens, best-of-N instruction curation, and 8-rollout online
  RL across more than 1,000 Internbootcamp tasks using CompassVerifier, rules, environment feedback, and POLAR-7B; weights
  are open, but training records and the full reward stack are not.
why_it_matters: It lets the frontier-disclosure track inspect how scientific sources, instruction records, synthetic tasks,
  verifiers, and open-ended rewards are combined, while keeping the boundary between a released checkpoint and an unreleased
  training pipeline explicit.
