one_line_summary: WebServ releases 726 success-filtered Claude browser traces and the code for resettable Incus-backed GRPO
  training, but not failed traces, record-level outcomes, Qwen RL rollouts, checkpoints, or a pinned environment bundle.
why_it_matters: 'It connects trajectory quality to the full browser-server stack: compact observations, network-aware actions,
  isolated resettable applications, executable WebArena rewards, and rollout throughput. It also demonstrates why reported
  rollout volume must be audited separately from public data retention.'
