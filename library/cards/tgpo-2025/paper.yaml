    are absent. The assigned ID/year preserves first public release (2025) even though the formal venue is ICASSP 2026.
inclusion_reason: 'TGPO turns repeated web-agent episodes into an explicit derived training object: a merged state-transition
  tree whose environmental, programmatic, and VLM-judged process signals produce weighted state-action preference pairs. It
  is valuable for the atlas as a concrete offline agent-trajectory construction recipe, while its missing split, verifier,
  trajectory, environment, and license artifacts make replay and training reuse unsafe without further release.'
