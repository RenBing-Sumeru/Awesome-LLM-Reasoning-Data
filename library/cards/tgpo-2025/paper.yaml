one_line_summary: TGPO merges repeated web-agent episodes into state trees and derives mixed process rewards plus weighted
  action preferences for offline training, but releases no trajectories, trees, verifier decisions, split manifest, environment
  snapshot, code, or license.
why_it_matters: 'It shows how terminal web-task outcomes can be converted into state-action supervision without manual step
  labels, while exposing a central audit boundary: heuristic state merging and an undisclosed VLM judge can silently determine
  the preference data, and current official artifacts do not support replay or safe training reuse.'
