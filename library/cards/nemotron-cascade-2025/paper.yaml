one_line_summary: Nemotron-Cascade documents and partially releases a two-stage SFT plus RLHF -> IF-RL -> Math -> Code ->
  SWE cascade, with stage-specific feedback ranging from a scalar RM to tests and patch-similarity judging, but complete data-to-run
  lineage is unavailable.
why_it_matters: It lets the frontier-report track audit weights, datasets, feedback contracts, intermediate checkpoints, and
  benchmark results as separate evidence layers instead of treating a collection page as proof of full reproducibility.
