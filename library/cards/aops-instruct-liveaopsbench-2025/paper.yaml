one_line_summary: AoPS-Instruct turns pre-2024 forum questions and community answers into 647,255 rewritten SFT pairs, while
  LiveAoPSBench applies stricter answer checks to newer timestamped posts.
why_it_matters: It exposes a scalable forum-distillation and temporal-evaluation recipe while showing why model-ready records
  still need immutable snapshots, source lineage, verifier audits, contributor attribution, and documented reuse rights.
