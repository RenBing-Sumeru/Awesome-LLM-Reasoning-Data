data_object:
  prompt_source: The 326,154-example Tulu V2 SFT mixture assembled from public instruction, dialogue, code, CoT, and science
    sources.
  trace_author: Humans and teacher models from the constituent SFT datasets; UltraFeedback supplies model responses and preferences
    for DPO.
  answer_format: Instruction-response or multi-turn conversation records for SFT; chosen-rejected response pairs for DPO.
  process_fields:
  - input or prompt
  - target, trace, or evaluated output
  - feedback or evaluation result
  environment_or_substrate: Offline post-training of Llama 2 and Code Llama models, followed by a shared benchmark harness.
  verifier_or_reward: Instruction targets supervise SFT, preference pairs supervise DPO, and a multi-benchmark harness measures
    adapted models.
  terminal_predicate: SFT fits target responses; DPO increases the chosen response relative to the rejected response; benchmarks
    report final performance.
recipe_metadata:
  base_model: Llama 2 and Code Llama at 7B, 13B, and 70B.
  teacher: Constituent datasets include human and model-written responses; UltraFeedback uses model outputs judged by GPT-4.
  generator: Builds an improved high-quality instruction mixture, runs supervised fine-tuning, optionally applies DPO, and
    evaluates general and code adaptation across sizes up to 70B.
  filtering_rule: Instruction targets supervise SFT, preference pairs supervise DPO, and a multi-benchmark harness measures
    adapted models.
  sampling_protocol: Full supervised fine-tuning on Tulu V2 mixture, followed optionally by three DPO epochs on UltraFeedback.
  rollout_count: null
  temperature: null
  inference_budget: Paper-specific benchmark decoding; exact per-task limits must be matched from the released evaluation
    configs.
  optimizer_or_scaffold: Builds an improved high-quality instruction mixture, runs supervised fine-tuning, optionally applies
    DPO, and evaluates general and code adaptation across sizes up to 70B.
