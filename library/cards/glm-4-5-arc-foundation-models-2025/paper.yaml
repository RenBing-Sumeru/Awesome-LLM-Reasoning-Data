one_line_summary: GLM-4.5 discloses a broad 23T-token ARC training and post-training pipeline with expert self-distillation,
  verifier/reward/judge feedback, and agent environments, but releases weights and inference materials rather than the source
  data, RM/Judge artifacts, replayable environments, or audit records needed for independent verification.
why_it_matters: 'It makes the distinction Track 12 needs: a detailed frontier-model narrative and MIT model release can reveal
  useful high-level data and feedback interfaces, yet they do not establish access to the original data, reward/judge contract,
  environment state, provenance, licenses, decontamination evidence, or reproducible training process.'
