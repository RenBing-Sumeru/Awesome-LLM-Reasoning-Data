one_line_summary: The method saves verifier calls by gating invalid moves, ranking viable moves, and allocating a local verification
  budget at each reasoning state.
why_it_matters: It moves compute allocation from whole-problem sample counts to the ambiguous intermediate decisions where
  verification has the most marginal value.
