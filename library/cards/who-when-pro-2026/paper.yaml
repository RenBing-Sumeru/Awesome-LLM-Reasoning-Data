  artifact_release_state: The official project page and GitHub repository are public. At the inspected revision, the repository
    contains only README.md and one dataset illustration; README explicitly says evaluation code and benchmark data are not
    public yet, and every release-status checkbox is empty. The project page's Data button is an empty `#` link. Therefore
    zero benchmark trajectory rows, labels, evaluator scripts, environments, prompts, configs, model prediction files, or
    dependency specifications are currently available from official artifacts.
  paper_release_claim_discrepancy: Appendix A.2 states that all traces, labels, and evaluation code are released, but the
    official repository and project page explicitly show those artifacts as unavailable. This draft follows observed official
    release state, not the manuscript's present-tense release claim.
  released_objects:
    paper_reported_failure_trajectories: 12326
    paper_reported_source_benchmarks: 26
    paper_reported_task_categories: 9
    paper_reported_agent_frameworks: 15
    paper_reported_error_modes: 18
    public_benchmark_rows: 0
    public_successful_seed_rows: 0
    public_natural_failure_rows: 0
    public_rejected_injection_rows: 0
    public_evaluation_code: false
    public_construction_code: false
    public_environment_or_cache: false
  successful_and_failed_sample_retention: Successful source trajectories are retained internally as injection seeds. Naturally
    failed source trajectories inform the taxonomy/profile but are not directly benchmark instances. Among injections, only
    continuations judged to fail and passing leakage/salience filters become the 12,326 benchmark rows; successful continuations,
    replay aborts, and filtered cases are omitted. None of the successful seeds, natural failures, retained injected failures,
    or discarded attempts are public, and their non-final counts are unknown.
  privacy_or_consent: Appendix A says source trajectories come from public academic benchmarks, contain no PII, and do not
    involve human subjects. Yet three annotators review 100 traces and PhD-level reviewers create the taxonomy/profiles; recruitment,
    compensation, consent, raw labels, corrections, redaction rules, and a record-level PII audit are not disclosed. The unavailable
    corpus prevents an independent privacy check.
  known_failure_modes:
  - Labels are called golden by construction, but human majority approval is 94% for decisive step and 90% for agent/error
    family, with 2% marked as having no clear decisive error; injected causality is not perfectly aligned with human-readable
    root-cause attribution.
  - The 18-mode taxonomy is explicitly non-exhaustive and is derived from sampled natural failures. Controlled injection may
    underrepresent emergent, multi-error, interaction-driven, recovery, and out-of-taxonomy failures.
  - Retaining only injections that flip the source evaluator selects for evaluator-sensitive failures and drops resilience/self-correction
    evidence. Mixed task evaluators can introduce false positives or false negatives, but their versions and outputs are not
    public.
  - The cache returns static factual tool outputs, but the page-summary model is rerun and allowed to vary, so observation
    context is not fully frozen even when raw page content is stable.
  - Stateful browser/code replay depends on fresh environments and action-level checks. Appendix F reports Bing DOM rotation
    behind 89% of `input_text` replay failures; aborted attempts and environment snapshots are unavailable.
  - Failure-mode classifiers often map planning, verification, and coordination causes to reasoning symptoms. Supplying the
    gold answer can make judges skip the root cause and focus on downstream outcome mismatch.
  - Step accuracy falls from 94% on traces below 3K tokens to 50% above 12K; incremental step-by-step evaluation also commits
    early and underperforms the full-trace protocol.
  - Public benchmark tasks and unpinned frontier APIs create contamination and version-drift risks. Exact task IDs, provider
    snapshots, prompts, temperatures, seeds, tool versions, and budgets are unknown.
  - The paper claims a complete release while official artifacts publish no data/evaluator. This blocks record-level verification
    of every scale, schema, label, split, license, privacy, and replay claim.
  citation_status: verified
  confidence: medium
  notes: arXiv v1 metadata, 36-page PDF and appendices, manuscript license, official project HTML, official GitHub README/tree/history
    and pinned head were checked. PDF Tables 2–4 and Appendix F pages were also visually rendered. No benchmark rows, evaluator,
    construction code, environment, cache, prediction files, or formal venue record were available for independent reproduction.
  remaining_unknowns:
  - Exact schema, media packaging, per-source counts, task IDs, and source-task versions for all 12,326 rows.
  - Counts and records for successful seeds, natural failures, injection attempts, successful continuations, replay aborts,
    and post-hoc rejections.
  - Identity/revision of the frontier injection model and exact API snapshots, prompts, temperatures, seeds, retry policy,
    and construction budget.
  - Complete source-evaluator inventory, versions, thresholds, outputs, and false-positive/false-negative analysis.
  - Train/dev/test or evaluation split manifest; IDs and overlap for the 100 human-review and 1,444 ablation subsets.
  - Deduplication, benchmark-overlap, source-task grouping, and model/data contamination controls.
  - Dataset/code license and compatibility with upstream benchmarks, agent frameworks, web content, and model-output terms.
  - Human taxonomy/review recruitment, compensation, consent, raw labels, adjudication, and correction propagation.
  - Immutable browser/code environments, raw-content cache, page-summary model revision, and per-row replay evidence.
  - Release timing or immutable version binding for the paper-claimed traces, labels, evaluation code, and configs.
inclusion_reason: 'Who&When Pro defines a high-value environment-linked failure-attribution object: a full agent episode is
  paired with responsible-agent, earliest-decisive-step, and error-mode labels created through successful-prefix replay and
  evaluator-confirmed failure. It also exposes core audit questions around intervention fidelity, dropped recoveries, mixed
  evaluators, taxonomy coverage, multimodal context, and paper-versus-release divergence.'
