one_line_summary: Who&When Pro reports 12,326 controlled failed trajectories across 3 modalities and 26 benchmarks with responsible-agent,
  decisive-step, and error-mode labels, while the official data and evaluation code remain unavailable.
why_it_matters: It turns agent debugging into a concrete episode-level evaluation contract and tests whether frontier models
  can localize causal failures, while demonstrating why successful anchors, discarded injections, evaluator versions, replay
  state, label corrections, and actual release artifacts must be audited before a benchmark can support training or reproducible
  evaluation.
