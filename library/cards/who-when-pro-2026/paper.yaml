data_object:
  prompt_source: Tasks are drawn from 26 public academic benchmarks across nine task categories and text, image, and video
    modalities. The benchmark includes QA, mathematical/scientific reasoning, code, data science, web research, GUI/computer
    use, text-grounded embodied interaction, and video QA. Exact source task IDs and a downloadable task manifest are not
    public.
  trace_author: Fifteen single- and multi-agent frameworks produce complete source runs. Primary backbone models are GPT-4.1
    and Gemini 3 Flash, with the paper stating that each configuration's model is stored in trace metadata. A separately described
    but unnamed frontier model generates an adaptive failure-injection prompt; the original base agent then generates the
    corrupted action and all downstream behavior.
  answer_format: An evaluation instance presents a failed agent transcript and asks the attribution model to output Agent
    Name, Step Number, Error Mode, and a short reason. Ground truth is the responsible agent/component, the earliest decisive
    step, and exactly one of 18 failure modes. The task's reference answer can be included in an open-book variant but is
    omitted in the default all-at-once evaluation. No public serialized row schema is available.
  process_fields:
  - source_benchmark
  - task_category
  - task_input
  - reference_answer
  - modality
  - agent_framework
  - base_model
  - agent_topology
  - ordered_step_coordinate
  - acting_agent_or_component
  - agent_message_or_reasoning
  - action_or_tool_call
  - observation
  - intermediate_artifact
  - injected_action
  - decisive_agent_label
  - decisive_step_label
  - error_mode_label
  - terminal_task_outcome
  observation: Complete execution traces include agent messages, tool/environment observations, and intermediate artifacts.
    Static search, page, and image outputs are replayed from a content-addressable cache; browser and code environments are
    re-executed with fidelity checks. Exact public field names, binary artifacts, redactions, and media encodings are unknown
    because no benchmark rows are released.
  action_space: Framework-specific natural-language decisions, structured tool calls, code execution, browser/GUI actions,
    embodied commands, video inspection, and inter-agent handoffs. The paper does not define one normalized executable action
    schema across all 15 frameworks.
  environment_or_substrate: Twenty-six source benchmarks executed through 15 frameworks. Static factual tool responses use
    a synchronous SQLite cache keyed by SHA-256 of canonicalized parameters. Stateful browser/code actions are replayed on
    fresh instances and aborted on detected divergence or exception. No environment image, cache, page snapshot, filesystem
    snapshot, dependency lock, or replay package is public.
  verifier_or_reward: 'Source-task success/failure is decided with each benchmark''s official evaluator when available; the
    full evaluator inventory and fallbacks are not disclosed. Attribution predictions are compared with constructed labels:
    responsible-agent accuracy on multi-agent traces, exact decisive-step accuracy, macro-F1 over error modes, and Joint requiring
    all three correct. This is a mixed environmental/programmatic/judgment contract, not a released scalar training reward.'
  terminal_predicate: A corrupted rollout enters Who&When Pro only if the source task's evaluator changes the outcome from
    successful seed to failure after one injected action. Reverting that action recovers the successful seed under the decisive-error
    construction. The paper does not publish per-benchmark evaluator versions, outputs, thresholds, false-positive audits,
    or retained rows.
  provenance: Public benchmark task -> source agent rollout -> successful/failed partition -> natural failures inform taxonomy/profile
    -> successful trace selected as seed -> failure-mode-conditioned step selection -> frontier-model adaptive injection prompt
    -> base-agent corrupted action -> exact-prefix replay -> post-injection continuation -> source evaluator -> retain only
    task failure -> artifact-leakage and answer-salience filters -> agent/step/error-mode labels. Record-level lineage and
    rejected-attempt logs are not public.
recipe_metadata:
  base_model: A mixture of frontier LLMs powers source agents. Appendix F.2 identifies GPT-4.1 and Gemini 3 Flash as primary
    backbones; the per-agent/benchmark selection is said to appear in trace metadata, which is not public. Exact API snapshots
    are unknown.
  teacher: PhD-level reviewers derive the taxonomy and plausible failure-mode profiles from sampled natural failures. Three
    independent annotators additionally review 100 generated traces for label fidelity. Neither process labels the entire
    benchmark from scratch, and raw annotations/adjudication are not public.
  generator: Fifteen agent frameworks generate source and downstream trajectories. An unnamed frontier model writes an adaptive
    prompt for a chosen failure mode; this prompt is patched into the original base-agent model call so the base agent itself
    emits the erroneous action in its own style.
  prompt_task_source: Twenty-six public benchmark families listed in Appendix G and mapped to frameworks in Table 7, including
    ALFWorld, BigCodeBench, HumanEval, LiveCodeBench-Pro, GPQA, MATH, MMLU-Pro, SciBench, GAIA, SimpleQA-Verified, OSWorld,
    WebVoyager, BrowseComp-VL, MMSearch variants, chart/image QA, and LVBench. Exact versions, task IDs, source licenses,
    and sampling proportions are not released as a manifest.
  filtering_rule: Exclude invalid injection steps or modes that cannot plausibly occur; retain only post-injection rollouts
    that fail the official task evaluator; then remove traces leaking construction artifacts and traces where the correct
    answer is already salient before the injection step. Natural failures are used for taxonomy calibration rather than benchmark
    instances. Exact rules, prompts, thresholds, rejection counts, and reviewer overrides are unknown.
  sampling_protocol: For each successful seed, sample an injection step conditioned on an applicable failure mode with mode-specific
    position preferences, replay the prefix, inject one corrupted action, and resume the original system. The number of seeds,
    modes or steps attempted per seed, retry budget, random seed, and retained rate are not disclosed.
  rollout_count: The final benchmark contains 12,326 retained injected failures. Counts of successful source runs, natural
    failures, total injection attempts, post-injection successes, replay aborts, and filter rejections are unknown.
  temperature: unknown
  inference_budget: Construction API/token/time budgets and maximum injection attempts are not disclosed. Reported retained
    traces average 7.5 steps and 1,139 words, with a maximum of 50 steps. All evaluation traces fit each evaluated model's
    native context window and are presented without truncation or summarization.
  search_or_scaffold: Static external calls use a synchronous SQLite content-addressable cache. Raw page content is cached
    but the secondary page-summary LLM output is not. Stateful Magentic-One browser and code-executor actions are replayed
    through Playwright/fresh executors with per-action fidelity checks; detected failures abort or redirect the injection
    attempt.
  optimizer_or_scaffold: No policy, reward-model, PRM, SFT, or RL optimizer is used in the reported Who&When Pro study. The
    experimental scaffold prompts ten frontier LLMs with all-at-once, step-by-step, or binary-search attribution protocols
    and scores static predictions against constructed labels.
audit:
  source_mixture: Paper-reported 12,326 retained failed trajectories across 26 source benchmarks, nine task categories, 15
    agent frameworks, 18 error modes, and three modalities. Composition is 51% text, 42% image, 7% video and 76% single-agent
    versus 24% multi-agent. Counts by individual source task, successful seed, natural failure, and injection attempt are
    not released.
  split: No train/dev/test split is disclosed. Table 4 appears to evaluate the benchmark under the main all-at-once protocol;
    a stratified 1,444-trace subset supports protocol/cost/ground-truth ablations, and a separate description gives 100 stratified
    traces for human review. Exact IDs, sampling seeds, overlap among these sets, and whether reviewed/corrected labels replace
    main labels are unknown.
  decontamination: unknown
  benchmark_overlap: All source tasks originate from 26 public academic benchmarks. The paper does not report duplicate, near-duplicate,
    model-training contamination, source-task grouping, or downstream overlap checks. Reusing unreleased rows for training
    would contaminate evaluation on the same Who&When Pro instances and potentially the upstream task IDs.
  license: arXiv v1 is CC BY-NC-SA 4.0. The official GitHub repository has no LICENSE file and the benchmark data are not
    released, so code/data rights are unknown. No manifest reconciles redistribution rights for upstream benchmark inputs,
    web/page/image observations, model-generated reasoning, intermediate artifacts, or agent-framework outputs.
  lineage: The paper documents aggregate task-to-seed-to-injection-to-failure lineage and says the per-configuration base
    model is stored in trace metadata. No public row preserves source task ID, successful-seed link, natural-failure profile,
    injected prompt/action, cache key, replay status, evaluator output, filter decision, model revision, or reviewer correction.
  release_version:
    paper: arXiv:2607.09996v1; submitted 2026-07-10; 36-page PDF
    paper_pdf_sha256: 50ee0997c80913b7cd9d7946da9e0d583e0177f3791bfa236aec72673054417a
