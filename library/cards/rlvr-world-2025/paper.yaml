one_line_summary: Releases code, two derived language-transition datasets and RLVR checkpoints for world models whose programmatic
  rewards are exact state/item agreement or frame-level L1 plus LPIPS, while upstream lineage and audit artifacts remain partial.
why_it_matters: It exposes feedback contracts and operational details that are usually obscured in RLVR reports, and it shows
  why a released model/data collection still needs separate provenance, split and verifier-validity auditing before reuse.
