one_line_summary: The paper filters 21,336 SWE-rebench tasks to 7,249, keeps 6,548 test-passing self-generated episodes for
  RFT, then applies synchronous DAPO to 65k/131k repository interactions, but does not release the trajectories, training
  code, or checkpoint.
why_it_matters: It specifies how repository state, tool observations, test-based terminal reward, success-only warm-up data,
  long-context rollout groups, and failure retention interact in SWE-agent post-training, while showing why upstream task
  containers alone do not make the paper's learning data reusable or replayable.
