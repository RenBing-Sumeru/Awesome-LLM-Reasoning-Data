one_line_summary: Claude 3.7 Sonnet's system card discloses broad source categories, classifier-derived appropriate-harmlessness
  preferences, RL-trained extended thinking, and selected monitors, but not the underlying records, rewards, rollout settings,
  or replay artifacts.
why_it_matters: It lets Track 12 readers separate a concrete pairwise-feedback rule and observable inference controls from
  undisclosed trace provenance, RL rewards, classifier calibration, scaffolds, and reproducibility evidence.
