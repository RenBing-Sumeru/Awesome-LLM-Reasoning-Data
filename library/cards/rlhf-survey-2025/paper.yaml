data_object:
  prompt_source: Preference comparisons or ratings, learned reward functions, policy responses, and evaluation outcomes across
    the RLHF pipeline.
  trace_author: Humans provide demonstrations, interventions, corrections, comparisons, ratings, critiques, or language feedback;
    proxies may supply AI feedback.
  answer_format: Demonstrations, pairwise or ranked preferences, scalar ratings, corrections, critiques, and other domain-specific
    feedback records.
  process_fields:
  - input or prompt
  - target, trace, or evaluated output
  - feedback or evaluation result
  environment_or_substrate: Cross-domain RLHF systems in control, robotics, language models, games, and generative applications.
  verifier_or_reward: Humans or preference proxies label outputs, reward models generalize those labels, and policy objectives
    consume the learned signal.
  terminal_predicate: Method-specific held-out preference, reward, policy, safety, or task evaluation; the survey defines
    no universal success predicate.
recipe_metadata:
  base_model: Not applicable; this is a cross-domain survey rather than one model recipe.
  teacher: Humans are the defining feedback source, with AI or proxy feedback covered as related variants.
  generator: Decomposes RLHF into feedback acquisition, reward-model estimation, and policy optimization while comparing assumptions
    and alternatives at each stage.
  filtering_rule: Humans or preference proxies label outputs, reward models generalize those labels, and policy objectives
    consume the learned signal.
  sampling_protocol: Surveyed methods use passive, active, online, offline, and co-generative query schemes; no single protocol
    is prescribed.
  rollout_count: null
  temperature: null
  inference_budget: Not applicable to a survey; query and rollout budgets are properties of each cited RLHF implementation.
