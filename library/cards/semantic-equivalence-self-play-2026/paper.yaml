one_line_summary: Releases 28,253 runnable Haskell references and specifies proof/counterexample self-play, but not the central
  verified interaction corpus or adapters.
why_it_matters: Shows how formal positive evidence and executable negative witnesses can be combined in a data curriculum,
  while making the verification-yield and reproducibility trade-offs measurable.
