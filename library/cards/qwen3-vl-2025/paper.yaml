one_line_summary: Qwen3-VL discloses a 1.2M-sample multimodal SFT mixture and roughly 30K-query, 16-rollout Reasoning-RL recipe
  with separate rule and judge rewards, but releases no post-training corpus, rollout ledger, reward configuration, or item-level
  checkpoint lineage.
why_it_matters: As a frontier disclosure, it distinguishes standard/CoT SFT, long-context curriculum, teacher-response and
  logit distillation, programmatically verified reasoning RL, and judge-based General RL—while keeping hidden sources and
  feedback services visibly unresolved.
