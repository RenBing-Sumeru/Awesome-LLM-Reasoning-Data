data_object:
  prompt_source: 1,516 training queries from the Mind2Web training set and self-instructed queries for websites represented
    in WebVoyager and Mind2Web.
  trace_author: Llama-3.3-70B policy models generate real and synthetic actions and rationales; a co-trained Llama-3.3-70B
    world model generates synthetic accessibility-tree observations.
  answer_format: Two released JSONL SFT corpora, webevolver_policy_sft.jsonl and webevolver_world_model_sft.jsonl, serialize
    chat messages for policy and world-model fine-tuning; they are not a raw-trajectory release.
  process_fields:
  - messages
  - system_instruction
  - task_query
  - accessibility_tree_observation
  - chain_of_thought
  - browser_action
  - world_model_transition_rationale
  - next_accessibility_tree
  environment_or_substrate: Cognitive Kernel drives a Playwright browser over live websites and represents visible page state
    as an accessibility tree.
  verifier_or_reward: Llama-3.3-70B gives binary completion judgments for rejection sampling inside self-improvement. GPT-4o
    supplies end-to-end benchmark judgments and WMLA rollout scores of 0, 0.5, or 1; these are distinct uses.
  terminal_predicate: Real interaction ends at task completion or a step limit. Synthetic training trajectories have at most
    seven steps and may stop earlier when the world model emits a terminal state.
recipe_metadata:
  base_model: Llama-3.3-70B for the policy and world model.
  teacher: The original Llama-3.3-70B base model supplies transition rationales; no stronger closed-source teacher is used
    inside the self-improvement loop.
  generator: Live browser rollouts train the policy and world model; the iteration-2 world model and iteration-1 policy then
    alternate to synthesize trajectories for queries not completed by real self-improvement rollouts.
  filtering_rule: Llama-3.3-70B judges task completion and retains successful real and synthetic trajectories for SFT. The
    paper does not report calibration or human validation of these training labels.
  sampling_protocol: The paper reports three self-improvement iterations. World-model augmentation uses the iteration-1 policy
    and iteration-2 world model; synthetic rollouts are capped at seven steps. WMLA samples up to three candidate actions
    and simulates depths one to three.
  rollout_count: Per-query rollout counts and the number accepted at each iteration are unknown.
  temperature: Training-time sampling temperature is unknown. For WMLA, the first action uses temperature 0 and alternative
    actions use temperature 0.7 plus a diversity instruction.
  inference_budget: WMLA considers up to three actions per state with look-ahead depth one to three; this inference trace
    is not part of the released SFT files.
  optimizer_or_scaffold: Iterative supervised fine-tuning on accumulated accepted trajectories; the paper explicitly distinguishes
    this from end-to-end reinforcement learning.
audit:
  source_mixture: The accepted record reports 13,465 released SFT message rows across policy and world-model data. The official
    Hugging Face viewer currently summarizes one train split with about 13.5k rows and exposes two JSONL files, not raw live
    or synthetic trajectories.
  split: One combined train split is exposed. Row-level source, iteration, query, website, real-versus-synthetic, acceptance,
    timestamp, and train/evaluation-overlap mappings are not provided in a release manifest.
  decontamination: unknown
  license: The Tencent repository and Hugging Face dataset declare MIT, and the ACL paper is CC BY 4.0; rights and consent
    for web content embedded in released message text are not documented.
  lineage: Queries -> live browser trajectories -> Llama-3.3-70B completion judgment -> accepted policy SFT -> world-model
    transition SFT with base-model rationales -> synthetic trajectories for previously unsuccessful queries -> completion
    judgment -> augmented policy SFT. WMLA is a separate inference-time branch scored by GPT-4o.
  known_failure_modes:
  - A policy-derived Llama-3.3-70B completion judge can retain false successes or reject valid alternate paths, and its calibration
    is not reported.
  - The world model can hallucinate or drift from the live website; its reported intrinsic scores fall below 0.50 at generation
    depths greater than two.
  - Live websites change, and the experiments exclude inaccessible or blocked sites, limiting exact replay and coverage.
  - The release omits raw trajectories, rejected rollouts, per-iteration counts, timestamps, source identifiers, replay state,
    and model checkpoints.
  - The released single messages field does not by itself expose the structured provenance needed to separate real from synthetic
    examples or policy from world-model construction stages without parsing content and files.
  - Benchmark success rates evaluate trained agents under the reported setup; they do not establish that every released SFT
    row or self-judgment is correct or reusable.
  citation_status: verified
  confidence: medium
  notes: ACL Anthology metadata and PDF, arXiv v2, the Tencent repository instructions and MIT badge, and the official Hugging
    Face dataset page and two-file manifest were checked.
inclusion_reason: Releases policy and world-model SFT corpora and documents a co-evolution recipe that converts live web interaction
  into accepted real and synthetic training examples, while leaving raw trajectory provenance and replay artifacts unavailable.
