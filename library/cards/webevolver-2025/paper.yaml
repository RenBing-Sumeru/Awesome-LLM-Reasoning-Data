one_line_summary: WebEvolver co-trains Llama-3.3-70B policy and world models, releases policy and world-model SFT message
  data, and uses synthetic rollouts plus world-model look-ahead; raw trajectories and replay metadata are not released.
why_it_matters: It makes a world model both a training-data generator and an inference-time search component, creating a useful
  rollout-data case whose released SFT boundary must be kept separate from the paper's unreleased trajectory pipeline.
