data_object:
  prompt_source: 101,380 retained problems from AQuA-RAT, GSM8K, MATH, NumGLUE, MathQA, TheoremQA, and DeepMind Mathematics.
  trace_author: An LLM such as GPT-4 extracts numbers and writes a reusable function-style program with docstrings and comments;
    deterministic rewriting instantiates the original record.
  answer_format: Each JSONL object stores id, source, original_problem, general_problem, generated_program, variables, ori_answer,
    and gen_answer.
  process_fields:
  - original mathematical problem and source
  - number-independent problem template
  - generated function-style program with comments
  - variable constraints and original/generated answers
  environment_or_substrate: A Python interpreter executes synthesized programs; deterministic rewriting substitutes constants
    and removes no-longer-needed assignments or docstring fragments.
  verifier_or_reward: Execute the synthesized program and compare its result with the source ground-truth answer; failed programs
    receive interpreter feedback for one repair request.
  terminal_predicate: Retain a record when the generated or minimally repaired program executes and its output matches the
    known answer.
recipe_metadata:
  base_model: The paper evaluates 7B CodeLlama, Llama2, and Aquila2 consumers.
  teacher: The method describes GPT-4 as the synthesis LLM.
  generator: A multitask prompt extracts numbers, writes a generic problem, emits a function-style program, declares valid
    variable ranges, and adds docstrings and line comments.
  filtering_rule: Execute against the source answer, issue a second-round minimal bug-fix prompt after failure, and retain
    only executable answer-matching outputs.
  sampling_protocol: Create one retained generic record per successful source problem; later numeric substitutions can expand
    a template without another LLM call.
  rollout_count: null
  temperature: null
  inference_budget: One synthesis request plus at most one repair request is described; numeric expansion is programmatic.
  optimizer_or_scaffold: SFT with global batch size 128; learning rate 2e-5 for CodeLlama/Llama2 and 1e-5 for Aquila2.
audit:
  source_mixture: 101,380 retained records across seven source datasets; the paper reports source-wise generation success
    and one record per successful problem.
  split: The official release exposes one infinitymath.jsonl file; it does not publish a separate validation or test split.
  decontamination: No general benchmark decontamination procedure is documented. Source lineage must be compared with every
    downstream evaluation, especially GSM8K and MATH.
  license: Apache-2.0 in the current official Hugging Face metadata; upstream benchmark terms and generated-output rights
    remain separate review surfaces.
  lineage: source problem and answer -> numeric masking -> generic problem and function program -> execution check -> optional
    minimal repair -> JSONL release -> programmatic numeric expansion -> SFT.
  known_failure_modes:
  - Answer matching on one numeric instance does not prove that the generic program is semantically correct over its full
    variable range.
  - Automatically proposed variable constraints can still admit nonsensical or domain-invalid substitutions.
  - Executing generated Python requires sandboxing and pinned dependencies even when the released sample previously passed.
  citation_status: verified
  confidence: high
  notes: CIKM DOI and paper, arXiv text, Apache-2.0 dataset metadata, full JSONL schema, two actual records, current adoption
    metrics, and the published SPRInT follow-up were checked on 2026-07-14.
inclusion_reason: The central artifact is an open corpus of reusable problem-template-program-answer demonstrations whose
  verifier and expansion contract are explicit.
