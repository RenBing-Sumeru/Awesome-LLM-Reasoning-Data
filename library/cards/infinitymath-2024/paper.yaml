one_line: InfinityMath decouples numbers from math problems to release 101,380 executable generic program demonstrations that
  can be expanded without repeated LLM calls.
one_line_summary: InfinityMath releases 101,380 programmatic math demonstrations with number-independent templates, executable
  checks, and low-cost numeric expansion.
why_it_matters: It makes numeric robustness and reuse a property of the serialized training object rather than relying on
  repeated free-form solution generation.
