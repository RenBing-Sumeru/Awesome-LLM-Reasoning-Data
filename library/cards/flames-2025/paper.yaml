one_line_summary: FLAMES compares 12 math-problem agents and six quality-control strategies, then defines 150K, 1M, and 1.5M
  mixtures that favor coverage and the first teacher solution; the data and construction code are not officially released.
why_it_matters: It exposes a concrete coverage-versus-verification trade-off, exact mixture recipe, teacher sensitivity, lexical
  decontamination rule, and a failure case where an LLM solvability filter rejects valid hard problems.
