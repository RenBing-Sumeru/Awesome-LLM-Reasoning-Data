inclusion_reason: A large official multi-teacher reasoning release that exposes a nested trace object, separate answer and
  process judgments, RV/CD metadata, capacity-conditioned selection, and SFT/DPO/GRPO studies, while leaving important provenance,
  verifier, generation, and snapshot-audit fields unresolved for the Data Construction & Open Release Recipes track.
