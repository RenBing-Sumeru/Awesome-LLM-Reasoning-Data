status: partial
one_line_summary: OmniThought releases nested multi-teacher math, code, and science traces with separate reasoning-validity
  and answer acceptance signals plus RV/CD annotations, while row-level prompt provenance, generation settings, executable
  verifier assets, and exact nested-trace lineage remain incomplete.
why_it_matters: It turns trace length, judged cognitive difficulty, teacher identity, and final-answer validity into inspectable
  construction variables for SFT, preference data, and RL rewards, making it a useful open-recipe case with clear audit boundaries.
