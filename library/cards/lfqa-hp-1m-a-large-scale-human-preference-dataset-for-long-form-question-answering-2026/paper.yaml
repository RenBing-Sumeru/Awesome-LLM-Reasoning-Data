one_line_summary: LFQA-HP-1M filters and unifies 1,326,356 public human preference pairs for English long-form QA, then uses
  nine rubrics to audit interpretable and LLM-based judges.
why_it_matters: It makes long-form QA preference feedback reusable as a traceable data object while demonstrating that a transparent
  rubric model can approach strong LLM judges and that those judges remain vulnerable to consistency, position, length, and
  perturbation failures.
