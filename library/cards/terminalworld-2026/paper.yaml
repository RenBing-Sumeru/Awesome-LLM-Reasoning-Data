one_line_summary: TerminalWorld converts public terminal recordings into 1,530 Docker-backed CLI tasks with reference solutions
  and state-based tests, including a manually reviewed 200-task evaluation subset.
why_it_matters: It provides a concrete environmental feedback contract for terminal agents and shows that successful behavior
  can diverge sharply from a human command trace, while its mutable manifests, legacy images, removed source links, and conflicting
  licenses demonstrate why executable benchmarks still need rigorous release audits.
