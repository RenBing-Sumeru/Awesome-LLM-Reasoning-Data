one_line_summary: SWE-CI evaluates 100 long-horizon repository evolutions from 68 public Python repositories through a 20-epoch
  Architect-Programmer CI loop and now releases tasks, Docker environments, code, and 115 GB of trajectories, with material
  split-version, verifier, completeness, replay, rights, privacy, and secret risks.
why_it_matters: It turns future-test feedback into iterative requirements, repository edits, executable outcomes, and a trajectory-level
  maintainability score rather than a one-shot patch verdict. The official trajectory release makes process analysis possible,
  but users must distinguish paper v1 from the moving v2 release and audit test quality, run health, archive coverage, licensing,
  sanitization, replay, and credential isolation before reuse.
