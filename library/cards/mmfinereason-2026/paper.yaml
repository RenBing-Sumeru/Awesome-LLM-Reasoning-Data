data_object:
  prompt_source: Standardized multimodal tasks pooled from public datasets including FineVision, BMMR, Euclid30K, Zebra-CoT-Physics,
    and GameQA-140K.
  trace_author: Qwen3-VL-235B-A22B-Thinking generates visually grounded long-form reasoning.
  answer_format: Image or diagram, question, think trace, final answer, source metadata, and quality or difficulty signals.
  process_fields:
  - multimodal prompt and source
  - teacher-generated reasoning and final answer
  - duplicate, answer-consistency, and difficulty signals
  environment_or_substrate: Static multimodal question answering with images, diagrams, and text.
  verifier_or_reward: Format and length checks, 50-gram deduplication, answer-consistency filtering, and four-rollout difficulty
    estimation.
  terminal_predicate: Retain a standardized record only after quality filtering; include it in the compact subset when Qwen3-VL-4B-Thinking
    does not solve it reliably across four attempts.
recipe_metadata:
  base_model: Qwen3-VL 2B, 4B, and 8B models are trained; Qwen3-VL-4B-Thinking estimates difficulty.
  teacher: Qwen3-VL-235B-A22B-Thinking.
  generator: Normalize pooled tasks, generate think and answer fields with the teacher, filter quality and duplicates, then
    estimate difficulty.
  filtering_rule: Apply template and length checks, remove 50-gram duplicates, require answer consistency, and rank records
    by four-rollout student success.
  sampling_protocol: The full standardized pool has about 2.3M records; quality filtering yields 1.8M, and difficulty selection
    yields 123K.
  rollout_count: 4
  temperature: null
  inference_budget: One teacher trace per retained example plus four Qwen3-VL-4B-Thinking attempts for difficulty selection.
  optimizer_or_scaffold: SFT on the 1.8M or 123K corpus; the paper also evaluates a GSPO reinforcement-learning stage.
audit:
  source_mixture: Multiple public multimodal datasets spanning mathematics, science, charts, diagrams, games, and general
    visual question answering.
  split: The release provides full 2.3M, filtered 1.8M, and difficult 123K variants; benchmark splits remain task-specific.
  decontamination: 50-gram deduplication reduces internal repetition, but does not establish benchmark-level decontamination
    for every source.
  license: The Hugging Face datasets declare Apache-2.0; source-dataset terms and image rights still require per-source review.
  lineage: Records preserve a pooled-source origin and are transformed by standardization, teacher generation, quality filtering,
    and difficulty selection.
  known_failure_modes:
  - Final-answer agreement can retain fluent but unfaithful reasoning.
  - Difficulty labels depend on Qwen3-VL-4B-Thinking and may not transfer to other students.
  - Mixed source licenses and image provenance require separate redistribution checks.
  citation_status: verified
  confidence: high
  notes: Official arXiv PDF and OpenDataArena Hugging Face collection checked on 2026-07-13. Dataset row counts were checked
    from the published Parquet metadata.
inclusion_reason: MMFineReason provides a reproducible quality-and-difficulty pipeline for turning pooled multimodal tasks
  into long-CoT post-training data.
