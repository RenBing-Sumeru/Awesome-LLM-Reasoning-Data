one_line_summary: MMFineReason distills and filters 1.8M multimodal long-CoT examples, then selects a 123K difficult subset
  that retains most of the training gain.
why_it_matters: It shows how source normalization, answer consistency, deduplication, and student-relative difficulty can
  make multimodal reasoning data more efficient.
