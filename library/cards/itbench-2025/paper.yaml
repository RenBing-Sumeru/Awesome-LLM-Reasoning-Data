one_line_summary: ITBench packages live IT incidents and controls as tool-using agent episodes with explicit stop/success
  contracts, then extends them with versioned offline snapshots and SRE traces.
why_it_matters: It exposes the full reasoning-data interface—scenario provenance, partial observations, executable actions,
  environment feedback, terminal predicates, and failed/incomplete episodes—while also showing why release version, replay,
  judge, and contamination metadata must travel with any trajectory corpus used for training or evaluation.
