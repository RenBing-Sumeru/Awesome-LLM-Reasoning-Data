one_line_summary: Gemma 3 discloses 2T-14T pretraining, 256 teacher logits per token, large-IT-teacher distillation, mixed
  human/code/math RL rewards, QAT, and open weights, but not corpora, preferences, RMs, teachers, rollouts, or verifiers.
why_it_matters: It shows that open weight access is much broader than the underlying data, distillation, reward, and verifier
  disclosure.
