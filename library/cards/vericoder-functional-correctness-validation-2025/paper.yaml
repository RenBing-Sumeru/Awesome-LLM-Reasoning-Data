data_object:
  prompt_source: Existing natural-language RTL specification and implementation pairs.
  trace_author: GPT-4o-mini generates testbenches and repairs implementations from simulator feedback.
  answer_format: Natural-language specification, Verilog RTL implementation, testbench, and functional simulation outcome.
  process_fields:
  - specification
  - rtl
  - testbench
  - compilation_feedback
  - waveform_feedback
  - final_pass
  environment_or_substrate: HDL simulator for Verilog/RTL modules.
  verifier_or_reward: Testbench compilation and simulation pass outcome.
  terminal_predicate: The final RTL implementation passes the final testbench in the simulator.
recipe_metadata:
  base_model: VeriCoder is fine-tuned on accepted functionally validated records.
  teacher: GPT-4o-mini.
  generator: Generate testbench, simulate, repair RTL from logs, revise faulty tests when needed, then accept final passes.
  filtering_rule: Only specification–RTL–testbench triplets whose final implementation passes are accepted.
  sampling_protocol: The expanded_origen_126k release contains approximately 126K records.
  rollout_count: null
  temperature: null
  inference_budget: Simulator, timeout, teacher version, maximum repair iterations, interfaces, and seed-data licences must
    be fixed for reproduction.
  optimizer_or_scaffold: Feedback loop over compilation or waveform logs; standard supervised fine-tuning on accepted triplets.
audit:
  source_mixture: arXiv paper, official VeriCoder repository and project site, and the expanded_origen_126k Hugging Face release.
  split: Consult the release and repository for split details.
  decontamination: Audit seed RTL sources and benchmark overlap before treating results as unseen functional generalization.
  license: Check the dataset and seed-source licences before reuse; the paper does not establish one combined licence in the
    checked sources.
  lineage: https://github.com/Anjiang-Wei/VeriCoder
  known_failure_modes:
  - Tests and RTL repairs driven by the same teacher can share an error.
  - Finite simulation inputs do not establish full temporal or boundary correctness.
  - The scope excludes repository dependencies, synthesis constraints, power/timing, and full FPGA/ASIC backends.
