one_line_summary: VeriCoder turns natural-language RTL seeds into 125,777 simulation-passing specification–RTL–test triplets
  through teacher-guided test-and-repair loops.
why_it_matters: It changes RTL data acceptance from compilation to behavior under an executable testbench while preserving
  the validation evidence in each record.
