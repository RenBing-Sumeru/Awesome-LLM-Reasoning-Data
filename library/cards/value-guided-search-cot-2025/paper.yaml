one_line_summary: VGS releases 2.5M math roll-in/roll-out pairs with correct, incorrect, and incomplete outcome labels, trains
  a 1.5B token-level value model, and uses it to guide 4,096-token beam-search blocks plus weighted voting.
why_it_matters: It connects the full reasoning-data lifecycle—prompt filtering, failed and successful rollouts, token-level
  value targets, selector-guided search, and explicit compute budgets—while making the missing rejection manifests, discarded
  branches, and license gaps visible for audit.
