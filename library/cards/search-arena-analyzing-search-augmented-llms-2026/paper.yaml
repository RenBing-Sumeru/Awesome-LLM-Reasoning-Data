one_line_summary: Search Arena releases real multi-turn search-LLM battles with user votes and full retrieval traces, exposing
  the difference between preferred and well-supported answers.
why_it_matters: It joins observed human preferences to the retrieved evidence needed to audit whether citation-rich answers
  are actually grounded.
