data_object:
  prompt_source: Consented in-the-wild Search Arena conversations collected from 2025-03-18 to 2025-05-08.
  trace_author: Users provide prompts and votes; anonymous search-enabled models supply paired responses and search traces.
  answer_format: Multi-turn conversation with messages_a, messages_b, optional human vote, timestamp, model/search metadata,
    language, and intent annotations.
  process_fields:
  - messages_a
  - messages_b
  - vote
  - timestamp
  - model_metadata
  - search_trace
  - language
  - user_intent
  environment_or_substrate: Side-by-side Search Arena interface for anonymous search-enabled LLMs.
  verifier_or_reward: User choices among A better, B better, tie, and both bad; paper additionally audits citation attribution
    with an LLM pipeline.
  terminal_predicate: A conversation is released after consent, de-identification, and filtering of server-error or inconsistent-configuration
    examples.
recipe_metadata:
  base_model: 13 publicly released search-enabled models in the dataset; models vary by conversation.
  teacher: null
  generator: Production Search Arena deployment rather than synthetic generation.
  filtering_rule: Remove server errors, inconsistent configurations, and quality issues; Google DLP API redacts PII and sensitive
    information.
  sampling_protocol: 24,069 multi-turn conversations, 12,652 human preference votes, about 11K users in 136 countries, and
    around 90 languages.
  rollout_count: null
  temperature: unknown
  inference_budget: unknown
  optimizer_or_scaffold: Pairwise human votes support ranking and preference analysis; repository provides analysis scripts.
audit:
  source_mixture: User prompts, paired model replies, retrieval/search traces, preference votes, timestamps, and post-processed
    annotations.
  split: Release is observational deployment data; a training/test split is not specified on the official dataset card.
  decontamination: Dynamic web retrieval and public model responses can overlap with held-out search tasks; establish an evaluation
    time boundary before training.
  license: Prompts are CC-BY-4.0; model outputs remain subject to the respective model providers' terms.
  lineage: arXiv source, ICLR acceptance statement, official GitHub repository, and official Hugging Face dataset card checked
    on 2026-07-14.
  known_failure_modes:
  - Citation count can affect votes without supporting claims
  - Automated PII removal can miss residual sensitive content
  - Votes reflect Search Arena users rather than a representative population
  citation_status: verified
  confidence: high
  notes: Formal title, UC Berkeley affiliation, release scope, consent/de-identification, record fields, license boundary,
    code, and official data links were checked.
inclusion_reason: Search Arena releases real paired search-LLM conversations, user preference judgments, and retrieval traces
  for preference learning and grounding analysis.
