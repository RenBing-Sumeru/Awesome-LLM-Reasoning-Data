data_object:
  prompt_source: A 2.8-million-question NaturalReasoning pool spanning mathematics and general STEM reasoning.
  trace_author: DeepSeek-R1 is the main reasoning teacher; auxiliary models provide disagreement-based difficulty signals.
  answer_format: A task question paired with a complete teacher reasoning trace and final answer.
  process_fields:
  - question
  - teacher reasoning response
  - final answer
  - selection strategy
  - difficulty or diversity signal
  environment_or_substrate: Static teacher traces consumed by SFT on Llama and Qwen student models.
  verifier_or_reward: Selection uses random sampling, reasoning-strategy diversity, response length, and model disagreement;
    evaluation uses benchmark answer metrics.
  terminal_predicate: Retain a complete teacher response selected under the chosen scale or curation policy.
recipe_metadata:
  base_model: Llama-3.1-8B-Instruct and Qwen2.5-7B-Instruct students; an additional Llama-3.3-70B-Instruct scale study is
    reported.
  teacher: DeepSeek-R1.
  generator: Generate complete reasoning traces for NaturalReasoning questions and select subsets by scale, difficulty, or
    reasoning-strategy diversity.
  filtering_rule: Prefer complete responses; compare random selection with long traces, model disagreement, and diverse reasoning
    strategies.
  sampling_protocol: Train on 1K, 10K, 100K, and 500K subsets under matched student-model recipes.
  rollout_count: null
  temperature: null
  inference_budget: Training uses up to 500K traces in the main scale study; full generation cost is not published as a reusable
    budget.
  optimizer_or_scaffold: Supervised fine-tuning with matched evaluation across selection policies.
audit:
  source_mixture: NaturalReasoning supplies broad questions; DeepSeek-R1 supplies long reasoning responses.
  split: The paper reports selected subsets but no official public NaturalThoughts release was confirmed.
  decontamination: Benchmark and source overlap must be audited before reuse; the Card makes no stronger claim than the paper.
  license: No official NaturalThoughts dataset or code license was confirmed.
  lineage: 'instruction / demonstration / rationale data; closest comparisons: LIMO, s1K, OpenThoughts3, and DeepSeek-R1 distillation.'
  known_failure_modes:
  - Selection signals can favor verbosity, teacher errors propagate into targets, and reported gains depend on teacher-student
    and domain mixtures.
  citation_status: verified
  confidence: high
  notes: Author list and FAIR at Meta affiliation verified from the paper PDF; no official venue beyond arXiv or downloadable
    NaturalThoughts artifact was confirmed. The 2026-07-13 selection audit found no official release, independent adoption,
    reproduction, award, or follow-up evidence sufficient for the 2025 impact threshold.
inclusion_reason: NaturalThoughts systematically compares scale, difficulty, and reasoning-strategy diversity when distilling
