one_line_summary: NaturalThoughts selects DeepSeek-R1 traces by scale, difficulty, and reasoning-strategy diversity to identify
  which demonstrations best transfer general STEM reasoning to smaller students.
why_it_matters: It separates several reasoning-trace selection variables instead of treating all teacher outputs as equally
  useful.
