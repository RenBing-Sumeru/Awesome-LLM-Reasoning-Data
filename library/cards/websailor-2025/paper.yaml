one_line_summary: WebSailor trains web-search agents with just over 2,000 successful reconstructed ReAct trajectories and
  DUPO's mixed format/answer reward, but officially releases only 20 QA examples—not the complete successful or failed trajectories.
why_it_matters: It links task difficulty, expert trajectory reconstruction, observation-masked RFT, and live-environment RL
  in one concrete post-training pipeline, while clearly showing why paper-reported dataset scale, public release scale, judge
  reproducibility, and failed-rollout retention must be tracked separately.
