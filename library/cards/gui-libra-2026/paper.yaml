data_object:
  prompt_source: Existing public web and mobile GUI trajectories, cleaned to 3-50 steps and augmented with action-aligned
    rationales.
  trace_author: GPT-4.1 generates structured reasoning and action fields; original trajectory coordinates are retained and
    subsequently checked.
  answer_format: Screenshot and textual context paired with a reasoning trace and one executable JSON action.
  process_fields:
  - system-level instruction, user instruction, interaction history, current screenshot
  - reasoning trace
  - action type, action description, action target, value or coordinates
  - action re-prediction agreement and bounding-box alignment
  environment_or_substrate: Static web and mobile GUI trajectories; online environments are used only for evaluation.
  verifier_or_reward: Qwen3-VL action agreement, bounding-box containment, and partially verifiable step rewards during RL.
  terminal_predicate: SFT records pass agreement and coordinate filters; RL uses step reward with KL-constrained optimization.
recipe_metadata:
  base_model: Qwen2.5-VL-3B/7B-Instruct and Qwen3-VL-4B/8B-Instruct.
  teacher: GPT-4.1 for rationale/action augmentation; Qwen3-VL models for filtering.
  generator: Augment cleaned public trajectories, retain action-aligned records, apply action-aware SFT, then conservative
    GRPO.
  filtering_rule: Keep steps with action re-prediction accuracy at least 0.3 and coordinates inside a predicted target bounding
    box.
  sampling_protocol: Ten stochastic action re-predictions per input; RL subset downsampled for domain and step-index balance.
  rollout_count: 8
  temperature: null
  inference_budget: RL rollout batch 256; no online interaction is used for training.
  optimizer_or_scaffold: Action-aware SFT followed by GRPO with KL regularization and success-adaptive negative-gradient scaling.
audit:
  source_mixture: Seven public web/mobile trajectory sources; final SFT data are mobile-heavy and only 14.3% web.
  split: 81K SFT steps from 9K trajectories; a balanced 40K-step subset is used for RL.
  decontamination: The paper reports source cleaning but no dedicated benchmark-overlap audit for the released mixture.
  license: Release license was not confirmed from the paper or inspected project page.
  lineage: GUI-Libra-81K is derived from existing public GUI trajectory datasets rather than newly collected online rollouts.
  known_failure_modes:
  - A demonstrated action is only one of several potentially valid actions, so step reward can label alternatives incorrectly.
  - The released mixture is mobile-heavy and does not establish scaling to fully online training.
  citation_status: verified
  confidence: high
  notes: arXiv v2 PDF and the official project page were checked on 2026-07-13. The PDF identifies UIUC, Microsoft, and UNC-Chapel
    Hill; no peer-reviewed venue or acceptance record was found.
inclusion_reason: Releases action-aligned GUI reasoning records and shows how their filtering and consumption affect native
  GUI-agent post-training.
