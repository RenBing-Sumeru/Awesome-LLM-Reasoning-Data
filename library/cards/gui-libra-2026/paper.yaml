one_line_summary: GUI-Libra turns public GUI trajectories into 81K action-aligned reasoning steps and trains native agents
  with action-aware SFT and conservative RL under ambiguous step rewards.
why_it_matters: It exposes the record schema, filters, and reward ambiguity needed to judge whether offline GUI supervision
  will transfer to online task completion.
