one_line_summary: SWE-Mirror constructs 60,671 executable repair tasks by re-instantiating real GitHub issue semantics in
  40 reusable repository Gyms, then reports an SFT mixture of 12,456 successful OpenHands trajectories.
why_it_matters: It separates the costly repository Gym from the issue semantics being mirrored, providing a scalable programmatic
  feedback surface for software-engineering agent training while exposing clear semantic-fidelity, contamination, release,
  and replay risks.
