one_line: BEARCUBS evaluates computer-using agents on 111 live-web questions with private short answers and internally validated
  browsing paths, while its public data ZIP exposes only question text and no replayable episodes.
one_line_summary: BEARCUBS evaluates computer-using agents on 111 live-web questions with private short answers and internally
  validated browsing paths, while its public data ZIP exposes only question text and no replayable episodes.
why_it_matters: It pairs a difficult multimodal web surface with an explicit answer-level judgment rule and rich internal
  failure analysis, while showing the audit gap between “trajectories were recorded” and “trajectory data is actually released
  with replay, lineage, rights, and version metadata.”
