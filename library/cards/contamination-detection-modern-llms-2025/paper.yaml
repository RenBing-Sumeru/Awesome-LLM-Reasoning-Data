status: partial
one_line_summary: Five prompt-, likelihood-, completion-, and order-based probes are compared on public benchmark slices;
  none consistently tracks known added fine-tuning exposure, and cross-method agreement is weak.
why_it_matters: The study turns detector assumptions into auditable interfaces and supplies a rare known-exposure control,
  while showing that artifacts, distribution shifts, missing thresholds, and incompatible statistics can masquerade as evidence
  about memorization.
