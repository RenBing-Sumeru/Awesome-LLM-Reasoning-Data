data_object:
  record_type: A contamination-audit case couples one model, one benchmark split, a sampled instance or ordered shard, and
    one of five detectors. Outputs are quiz correctness, completion overlap, low-token likelihood, or an order-preference
    statistic. Reported conclusions are chiefly model-by-dataset-split aggregates, not instance-level contamination labels.
  benchmark_sources:
  - GSM8K
  - MMLU
  - BIG-Bench-Hard
  - ARC-Challenge
  - DROP
  - HumanEval
  - AGNews
  - IMDB
  released_processed_records: Fifteen JSON-formatted .txt files contain 100 processed records each (1,500 rows total), usually
    with idx, question, and optional label or category. Fifteen Token Overlap CSVs contain ten rows each (150 rows total)
    with text, first_piece, second_piece, and optional label. These are processed benchmark probes, not contamination gold
    labels.
  token_completion_overlap: Generate completions from a partial instance under general and dataset-guided prompts; compare
    the suffix with exact/near-match judgments and ROUGE-L; bootstrap the guided-versus-general difference.
  min_k_probability: Compute the mean negative log likelihood over the lowest-probability 20 percent of tokens and summarize
    100 examples. No operational threshold is supplied for declaring an arbitrary split contaminated.
  canonical_order_test: Divide 100 ordered records into ten shards; compare each canonical shard with 25 within-shard permutations;
    compute a one-sided t-based p-value across ten canonical-minus-shuffled differences.
  word_perturbation_quiz: LLaMA-3-70B-Chat generates four word-level perturbations. The original occupies one of four non-null
    choices and a fifth None option is added. Accuracy over 100 examples is treated as contamination evidence.
  local_order_quiz: Present a target record and four candidates, nominally with one true immediate successor; aggregate next-record
    selection accuracy over 100 targets. The nominal random baseline is 25 percent.
  oracle_training_record: Four consecutive benchmark examples are packed into one instruction-tuning item. Questions remain
    original while answers are replaced by LLaMA-2-generated chain-of-thought solutions. These records are not in the repository.
  process_fields:
  - model_identity
  - benchmark_name
  - benchmark_split
  - source_index
  - processed_question
  - optional_answer_or_label
  - detector_name
  - detector_prompt_or_shard
  - generated_perturbations_or_completion
  - model_output_or_log_probabilities
  - instance_score_or_match_label
  - split_level_metric
  - known_added_contamination_fraction_for_oracle
  observation: Method-dependent observations are generated completions, multiple-choice selections, token log probabilities,
    or canonical and shuffled sequence log probabilities.
  verifier_output: WPQ and Local Order produce answer correctness; Token Overlap produces exact/near-match counts and a bootstrapped
    ROUGE-L p-value; Min-K produces a mean and standard deviation; Canonical Order produces a one-sided p-value. No unified
    calibrated contamination decision is defined.
  reward: None for the audited models. Detector metrics are audit statistics, not training rewards. SFT is used only to construct
    the known-added-exposure oracle.
  environment_or_substrate: Offline benchmark sampling with OpenAI, Anthropic, and Together APIs; likelihood access for Min-K
    and Canonical Order; LLaMA-2-70B-Chat instruction fine-tuning for the oracle.
  verifier_or_reward: Mixed contract combining programmatic quiz scoring and likelihood statistics with stochastic perturbation/completion
    generation and GPT-4 near-match judgment.
  terminal_predicate: Method-specific only. Canonical Order and Token Overlap use p-values, WPQ and Local Order use accuracy,
    and Min-K has no published threshold.
  provenance: eight public benchmarks -> undisclosed 100-row sampling/preprocessing -> method-specific perturbation, completion,
    probability, or order probe -> aggregate statistic; separately, selected benchmark fractions -> LLaMA-2-generated CoT
    answers -> four-example SFT packs -> three-epoch LLaMA-2-70B oracle -> before/after detector comparison
  release_surface: Processed probe inputs and partial method code are public. Generated perturbations, options, completions,
    outputs, oracle CoT records, checkpoint, complete adjacency banks, and result logs are absent.
recipe_metadata:
  base_model: Audited models are GPT-4 (gpt-4-0613), Claude 3 Sonnet, LLaMA-3-70B-Chat, and LLaMA-2-70B-Chat. One body sentence
    says Claude 3 Haiku, while the setup, tables, caption, and released runner say Sonnet.
  teacher: LLaMA-3-70B-Chat generates WPQ perturbations; LLaMA-2-70B generates the oracle's replacement chain-of-thought answers;
    GPT-4 judges Token Overlap exact and near matches.
  generator: Detector-dependent generation by LLaMA-3-70B-Chat or the model under audit; LLaMA-2-70B generates the oracle
    answer augmentation.
  prompt_task_source: Fifteen train, test, development, full, or task-group views from eight public benchmarks. Exact upstream
    revision, source URL, and sampling seed are not documented for every view.
  filtering_rule: The release exposes 100 records per evaluated split and ten per Token Overlap split. Source selection, failed-generation
    retention, and duplicate policy are not documented.
  sampling_protocol: WPQ, Local Order, and Min-K use 100 examples per split; Token Overlap uses ten; Canonical Order uses
    100 examples in ten shards with 25 permutations per shard. Complete original-order banks are not bundled.
  rollout_count: One evaluated output per WPQ or Local Order quiz after up to five perturbation attempts; paired guided/general
    completions for ten Token Overlap rows; one canonical and 25 shuffled likelihoods for ten shards.
  temperature: WPQ perturbation uses temperature 0.9 and top-p 0.9; paper-reported inference and Token Overlap generation
    use temperature 0. Released likelihood scripts request temperature 1.0 while scoring echoed prompts.
  top_p: WPQ perturbation uses 0.9. Other settings are 1.0 or unknown depending on the API path.
  inference_budget: Sample counts are reported; token budgets, API dates beyond gpt-4-0613, cost, runtime, GPU inventory,
    memory, and total compute are unknown.
  search_or_scaffold: No search. The probes use transformations, paired prompting, token-likelihood ranking, or order permutation.
  selection_threshold: Token Overlap states one exact or two near matches and also reports a ROUGE-L p-value. Canonical Order
    uses a p-value. WPQ and Local Order have chance baselines but no calibrated cutoff. Min-K lacks a threshold.
  seed_protocol: Canonical Order code defaults to seed 0 and Token Overlap splitting to 42. WPQ and Local Order runners use
    randomness without a fixed seed. No end-to-end seed manifest exists.
  buffer_policy: Not applicable; this is a static audit and controlled SFT study.
  reward_schedule: Not applicable; no reinforcement learning is performed.
  optimizer_or_scaffold: The oracle fine-tunes LLaMA-2-70B-Chat for three epochs at learning rate 8e-6. Optimizer, batch size,
    schedule, precision, sequence length, sharding, checkpoint selection, hardware, and training code are unknown.
  oracle_contamination_mixture: MMLU test 100%; BBH test 100%; ARC-Challenge train 50% and test 0%; DROP train 50% and test
    0%; HumanEval test 25%; GSM8K train 25% and test 0%. The base model is the before-control; no token-matched nonbenchmark
    SFT control is reported.
audit:
  source_mixture: The released corpus republishes processed samples from eight benchmarks with heterogeneous domains and licenses.
    It is not an original task corpus, and no row-level upstream revision manifest is provided.
  split: Fifteen 100-row views cover AGNews train/test, ARC-Challenge train/dev/test, BBH full, DROP train/dev/test, GSM8K
    train/test, HumanEval full, IMDB train/test, and MMLU test. Fifteen ten-row Token Overlap CSVs mirror these views.
  decontamination: 'Not applicable to the probes: overlap is the object under audit. The oracle controls newly added exposure
    but cannot establish that the base LLaMA-2 checkpoint was historically clean.'
  benchmark_overlap: Intentional. Oracle SFT uses stated benchmark fractions, retaining questions and replacing answers with
    generated CoT. Same-benchmark zero-added test splits may shift through train/test distribution similarity, creating a
    false-positive pathway.
  license: The COLING paper is CC BY 4.0. The GitHub repository has no LICENSE, dataset card, package metadata, or per-source
    rights ledger, so reuse terms for code and processed data are unknown.
  lineage: Public benchmark rows -> normalized probe records and completion slices -> five detector pipelines -> aggregate
    tables. Oracle lineage continues through CoT answer replacement, four-example packing, selected fractions, and three-epoch
    SFT, but the derived artifacts are absent.
  release_version: Repository main was inspected at commit f8ab237abfa44e67676b48f04d09566b59c5740a dated 2025-08-21. No tag
    or GitHub release identifies the exact paper snapshot.
  successful_and_failed_sample_retention: Inputs are released; generated perturbations, parse failures, discarded attempts,
    options, completions, likelihood vectors, bootstrap draws, permutations, oracle records, and result logs are not.
  privacy_or_consent: unknown
  known_failure_modes:
  - WPQ may recognize unnatural perturbations, labels, proper nouns, numbers, or formatting rather than memorization.
  - Token Overlap uses ten items, GPT-4 judgment, prompt-sensitive suffixes, and an unseeded rounded-score bootstrap.
  - Min-K lacks a usable threshold and decreases after known added exposure, opposite the expected direction.
  - Order tests assume ordering survived training; semantic adjacency can cue a model without memorization.
  - Local Order code may sample the true successor as a negative and insert it again, yielding duplicate correct choices.
  - Canonical Order uses NumPy population standard deviation with a Student-t distribution at n=10, not the conventional sample-SD
    statistic.
  - The oracle proves added exposure only, lacks a matched nonbenchmark SFT control, and cannot isolate base-model contamination.
  - None of the five metrics consistently tracks the known added fractions; both false negatives and same-distribution false
    positives occur.
  - Off-diagonal Spearman correlations range from -0.198 to 0.320; heterogeneous metric directions are compared.
  - The paper has a Sonnet/Haiku inconsistency; stronger repeated evidence supports Sonnet.
  - The repository references absent full_datasets and canonical directories, mismatched .json/.txt paths, and an unset example
    model name.
  - No repeated runs, quiz-accuracy confidence intervals, sample-choice robustness, or multiplicity correction are reported.
  citation_status: verified
  confidence: high
  notes: The final 13-page COLING paper, ACL record, arXiv metadata, repository tree, processed data, code, commit state,
    and license absence were checked.
  remaining_unknowns:
  - Exact upstream revisions, sampling/filtering scripts, row identifiers, and compatible reuse terms
  - Complete oracle CoT records, packing manifest, training command, hyperparameters, seeds, checkpoint, and hashes
  - Generated choices, completions, outputs, likelihoods, permutations, result logs, and failed-sample ledger
  - Exact Claude 3 checkpoint across all paths and resolution of the Sonnet/Haiku inconsistency
  - Calibrated thresholds, error rates, repeated-run variance, and multiple-comparison correction
inclusion_reason: This negative-result anchor makes five contamination-detector data contracts inspectable, builds a known-added-exposure
  instruction-tuning oracle, and shows that their scores disagree and do not reliably track that exposure.
