one_line_summary: Reports a 79K implicit-rationale mixture filtered by future-token predictiveness and trains an 8B process
  supervisor, while the linked 15178-row dataset leaves the full release unreconciled.
why_it_matters: It makes a weak, scalable verifier contract concrete and shows why predictive filtering, source lineage, release
  completeness, and rationale validity must be audited separately.
