data_object:
  prompt_source: Curated multimodal instructions from general, academic, robustness, domain-specific, and red-teaming sources.
  trace_author: A pool of 12 LVLMs generates candidates; GPT-4V provides scores and rationales.
  answer_format: Image, instruction, model responses, aspect scores, rationales, and derived preference pairs.
  process_fields:
  - image
  - instruction
  - responses
  - helpfulness
  - visual_faithfulness
  - ethical_considerations
  - rationale
  environment_or_substrate: Image-conditioned vision-language generation.
  verifier_or_reward: GPT-4V ratings on helpfulness, visual faithfulness, and ethical considerations.
  terminal_predicate: A released multimodal instruction with scored candidate responses and rationale.
recipe_metadata:
  base_model: Qwen-VL-Chat 7B is the primary DPO base; 12 LVLMs generate candidates.
  teacher: GPT-4V (gpt-4-vision-preview)
  generator: 12-LVLM response pool
  filtering_rule: At least four sampled model responses per instruction; ties discarded when deriving DPO pairs.
  sampling_protocol: 82.4K instructions, 67K unique images, and 399.4K preference pairs reported in paper.
  rollout_count: 4
  temperature: See original implementations
  inference_budget: unknown
  optimizer_or_scaffold: DPO with average score over three feedback aspects
audit:
  source_mixture: Diverse image-instruction sources, 12-model candidate pool, and GPT-4V AI feedback.
  split: Check official HF revision and files before reuse.
  decontamination: Only source training splits were sampled; audit downstream benchmark overlap independently.
  license: Verify HF card and source-image rights before reuse.
  lineage: EMNLP 2024 paper, Silkie project, official GitHub, and MMInstruction/VLFeedback dataset.
  known_failure_modes:
  - GPT-4V visual misjudgment or conflicting rationale can create wrong labels
  - AI feedback inherits judge bias
  - Source-image rights require separate audit
  citation_status: verified
  confidence: high
  notes: Verified against EMNLP PDF, official project, repository, and dataset page on 2026-07-14.
