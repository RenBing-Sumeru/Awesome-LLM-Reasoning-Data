one_line_summary: TTI scales a web agent’s test-time interaction horizon, then trains that behavior with a horizon curriculum
  so the agent can explore, backtrack, and re-plan.
why_it_matters: It shows that more test-time actions can acquire information unavailable to a longer reasoning trace before
  acting.
