one_line_summary: DeepSeekMath-V2 alternates GRPO-trained proof verification and generation, bootstraps harder proof labels
  through multi-sample verifier and meta-verifier judgments, and scales self-verification at test time, while releasing model
  weights and evaluation artifacts but not the training records or formal correctness certificates.
why_it_matters: It is an unusually concrete frontier disclosure of how proof problems, generated proofs, expert scores, verifier
  analyses, meta-verification, learned rewards, and test-time search form a data flywheel, while exposing the audit gap between
  LLM agreement and formally verified mathematics.
