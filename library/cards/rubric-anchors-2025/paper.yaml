one_line_summary: Rubicon reports rubric-based RL over a proprietary 900K+ corpus and a 10K+ rubric bank for open-ended tasks,
  releasing a model checkpoint but not the data, scorer calibration, code, or full audit ledger.
why_it_matters: It makes a judgment-required reward contract more explicit than many frontier reports, while demonstrating
  why rubric provenance, scoring calibration, failure logs, and data lineage must remain separate from model-release claims.
