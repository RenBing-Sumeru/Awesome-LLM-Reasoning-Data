data_object:
  prompt_source: 'A proprietary 900K+ instance corpus is described only by broad source classes: community Q&A forums, high-quality
    examinations, and general conversational datasets. Source inventory, proportions, rights, versions, and manifests are
    unknown.'
  trace_author: The report says rubrics were generated by human experts, LLMs, or hybrid human–LLM workflows. Per-rubric provenance,
    composition, prompts, annotator protocol, and contributor agreement are unknown.
  answer_format: The reported training loop uses instruction–rubric pairs, a generated response, critic scores, and scalar
    reward aggregation. The exact serialized record schema and retained fields are unknown.
  process_fields:
  - instruction
  - rubric_criteria
  - score_tiers
  - critic_score
  - reward
  environment_or_substrate: Offline critic scoring and multi-stage language-model reinforcement learning; an executable environment
    or replayable rollout interface is not released.
  verifier_or_reward: Rubrics contain criterion descriptions, score tiers mapped to quantitative scores, and weights. The
    paper formalizes a multi-dimensional scorer and discusses aggregation strategies. Actual scorer checkpoints, prompts,
    calibration, aggregation used per task, and error rates are unknown.
  terminal_predicate: Candidates are retained within a calibrated central score quantile after critic scoring; exact quantile
    boundaries and stage-specific acceptance rules are unknown.
recipe_metadata:
  base_model: Qwen3-30B-A3B; the released Rubicon-preview model card is linked by the paper.
  teacher: The report names a self-critique Qwen3-30B-A3B model and Gemini 2.5 Pro API for some rubric generation, plus stronger
    agentic workflows for instance-specific criteria. Assignments, prompts, and output lineage are unknown.
  generator: 'Rubric-first construction: design model-verifiable rubrics, curate or synthesize matching data, and reuse the
    rubrics for supervision, reward shaping, and evaluation.'
  filtering_rule: Generate a base-model response for each candidate instruction–rubric pair, score it with critic models,
    and retain a calibrated central quantile while excluding very high- and very low-scoring candidates. Thresholds, yields,
    and false accept/reject rates are unknown.
  sampling_protocol: 'Two-stage RL: first constraint-following with programmatic checks and static rubrics, then open-ended/social/creative
    tasks with reference-based and instance-specific criteria. Exact sampling, mixture, and stage lengths are unknown.'
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: A multi-stage RL protocol is described, but the optimizer, objective implementation, KL treatment,
    rollout budgets, schedules, and compute are undisclosed.
audit:
  source_mixture: Only broad source classes for a proprietary 900K+ corpus are disclosed; no record-level sources, proportions,
    dates, licences, or revisions are available.
  split: unknown
  decontamination: unknown
  license: The official Rubicon-Preview model card declares Apache-2.0. Corpus, rubric, generated-output, critic, and evaluation-data
    rights are unknown.
  lineage: Broad proprietary corpus to rubric design/task curation to critic-scored instruction–rubric pairs and multi-stage
    RL to Rubicon-preview. Item-level provenance, rejected rollouts, and scoring logs are not released.
  known_failure_modes:
  - The paper reports reward hacking from a small capability set; its defense rubric is an internal mitigation, not a released
    robustness evaluation.
  - Undisclosed rubric provenance, human/LLM mixture, critic prompts, calibration, and agreement prevent independent assessment
    of the judgment-required reward.
  - A proprietary corpus and absent data/code manifests prevent source-rights, split, contamination, and lineage audit.
  - A released model checkpoint does not establish availability of the rubric bank, training records, filtering code, or exact
    RL scaffold.
  citation_status: verified
  confidence: medium
  notes: Official arXiv v1 technical report and the model page explicitly linked from the report were checked. No acceptance
    venue, data release, code release, scorer calibration, or safety evidence is claimed.
inclusion_reason: A Track12 technical-report disclosure case that states a concrete rubric reward object, proprietary corpus
  scale, filtering concept, two-stage RL design, reward-hacking mitigation, and an official model checkpoint while leaving
  the provenance and reproducibility ledger materially incomplete.
