one_line_summary: WebDancer turns 100,000 synthetic web QA pairs into filtered ReAct SFT trajectories and LLM-judged on-policy
  agent rollouts, but publicly releases only 200 QA and 200 trajectory examples rather than the complete corpus.
why_it_matters: It exposes how task synthesis, trajectory teachers, observation masking, rejection filters, dynamic rollout
  selection, and judge-based terminal rewards jointly define web-agent post-training data, while showing why live-web drift
  and sample-only releases block record-level replay and audit.
