  environment_versioning:
    substrate: live web search and page visit
    qwen_agents_commit: unknown
    search_provider_version: unknown
    page_reader_version: unknown
    summarizer_snapshot: Qwen-2.5-72B; exact revision unknown
    crawl_timestamps: unknown
    page_snapshot_hashes: unknown
    deterministic_replay: false
  successful_and_failed_sample_retention: SFT construction explicitly retains correct trajectories and discards invalid outputs;
    DAPO excludes all-correct and all-wrong groups from updates. The public sample contains selected trajectories but no rejected,
    failed, timed-out, malformed, judge-disagreement, or excluded-rollout ledger.
  privacy_or_consent: No human-subject or crowdsourcing study is reported. CRAWLQA and trajectories contain crawled live-web
    material and model-generated summaries, but the paper does not describe PII screening, robots/terms compliance, consent,
    takedown, or retention policy for source pages and tool observations.
  verifier_or_judge_failure_modes:
  - GPT-4o selection and Qwen-72B-Instruct reward can produce false positives or false negatives; no calibration set, inter-judge
    agreement, frozen outputs, or adversarial judge audit is released.
  - The 0.9 answer-reward weight makes a judge shortcut dominate the binary format signal and cannot identify which search
    or reasoning step failed.
  - Dynamic sampling removes all-correct and all-wrong groups from gradient updates, changing the effective prompt distribution
    without a released per-prompt exclusion ledger.
  - Live search and summarizer drift can change observations and therefore both trajectories and judge outcomes even when
    the same question is replayed.
  - Format validity checks syntax and tool-call JSON, not factual grounding, source quality, citation faithfulness, or absence
    of unnecessary actions.
  known_failure_modes:
  - Only search and visit are available; richer browser interaction and code execution are outside the reported environment.
  - Experiments center on short-answer information seeking; document-level synthesis and open-ended long-form reward modeling
    remain unresolved.
  - The authors report high rollout cost and limited RL data utilization, with only a small subset of the collected QA pool
    usable in RL.
  - Long-CoT transfer raises invalid/repetition rates, especially for smaller instruction models.
  - The live web is non-stationary; the paper attributes performance fluctuation partly to environment changes.
  - Tool hallucination and over-action can occur, including calls to nonexistent tools or redundant actions after the answer
    is known.
  - The public artifacts are samples rather than the complete corpus, so reported filtering, counts, and RL membership cannot
    be independently audited record by record.
  citation_status: verified
  confidence: high
  notes: Audited the NeurIPS 2025 proceedings record and 29-page paper including Appendices A, D, and E; arXiv:2505.22648;
    official DeepResearch/WebAgent repository, sample files, subdirectory license, and maintainer release statement; and the
    Alibaba-NLP WebDancer-32B model card on 2026-07-20. The NeurIPS record lists Robert Tang while the proceedings PDF prints
    Xiangru Tang; this draft follows the venue metadata. The arXiv/repository citation has a different, shorter author list
    and should not override the formal proceedings record.
  remaining_unknowns:
  - Complete CRAWLQA/E2HQA and SFT/RL membership manifests, record-level sources, crawl timestamps, and transformations
  - Exact SFT and RL hyperparameters beyond disclosed sampling settings, including steps, batch sizes, learning rates, seeds,
    and episode/token caps
  - Paper-bound modified verl code, reward prompt, judge revision, tool implementations, service versions, and dependency
    commits
  - Rejected, failed, timed-out, malformed, all-correct, and all-wrong trajectory/rollout records with exclusion reasons
  - Decontamination and overlap against GAIA, WebWalkerQA, BrowseComp, public QA sources, and crawled web pages
  - Dataset-specific license and rights lineage for source pages, public QA inputs, summaries, and trajectories
  - Immutable web snapshots and a deterministic replay contract
inclusion_reason: 'WebDancer makes the full data-to-policy boundary unusually concrete for a live-web agent: synthetic short-answer
  tasks become filtered ReAct trajectories for SFT, while unused QA pairs seed on-policy episodes scored by format validity
  and an LLM answer judge. It belongs in the environment-and-agent-trajectory category, but its sample-only release and non-replayable
  web substrate prevent treating the reported corpus as a complete reusable trajectory dataset.'
