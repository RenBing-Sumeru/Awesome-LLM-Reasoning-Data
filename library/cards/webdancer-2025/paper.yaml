data_object:
  unit_of_record: The paper uses two linked objects. A QA record contains a short-answer information-seeking question, its
    reference answer, and a source-family tag. An SFT trajectory is a multi-turn ChatML episode containing task context and
    alternating model Thought, structured search/visit Action, web Observation, and a final Answer. During RL, one QA pair
    conditions a group of 16 on-policy agent executions, each receiving one terminal scalar reward; the complete paper training
    corpus and RL rollout groups are not public.
  prompt_source: CRAWLQA contributes 60,000 QA pairs synthesized by GPT-4o from recursively visited pages rooted at official
    or knowledgeable sites such as arXiv, GitHub, and Wikipedia, with requested types including COUNT, MULTI-HOP, and INTERSECTION.
    E2HQA contributes 40,000 pairs made by repeatedly replacing an entity in a SimpleQA-style question with a web-retrieved
    subproblem while preserving the concise answer. The paper also uses RAG-filtered MuSiQue, Bamboogle, PopQA, 2Wiki, and
    HotpotQA questions as an open-only comparison.
  trace_author: GPT-4o generates Short-CoT ReAct trajectories. QwQ-Plus generates Long-CoT decisions from prior actions and
    observations while previous thoughts are withheld from subsequent calls; its reasoning_content is retained as the current
    Thought. Each QA can undergo up to five rejection-sampling attempts.
  qa_record:
  - question
  - reference_answer
  - source_family_tag
  trajectory_record:
  - type
  - task
  - system_message
  - user_question_and_tool_schema
  - thought
  - tool_call_name
  - tool_call_parameters
  - tool_response
  - final_answer
  - reference_answer
  - source_family_tag
  context_or_state: The history H_t contains all earlier Thought, Action, and Observation tuples. Search accepts query and
    filter_year and returns top-10 titles and snippets; visit accepts goal and URL and returns evidence plus a Qwen-2.5-72B-generated
    summary. The released ChatML sample serializes tool responses as user messages and model thoughts/actions as assistant
    messages.
  trace_or_actions: A ReAct episode interleaves free-form Thought with JSON-formatted search or visit calls. The model can
    repeat these rounds and then emits an answer action. SFT masks observation tokens so the loss attaches to model-generated
    thoughts, actions, and the final answer rather than external web feedback.
  observation: Search observations contain live top-10 result titles and snippets. Visit observations contain evidence and
    a summarizer-model digest of the requested page. Neither immutable page snapshots nor a paper-bound search index is released,
    so the observed state is not deterministically replayable.
  answer_or_artifact: A concise final answer enclosed by answer tags in the paper format. The public QA sample stores question,
    answer, and tag; the public trajectory sample stores full ChatML messages, tool schemas, reference answer, and source-family
    tag.
  process_labels:
  - short_or_long_cot_source
  - source_family_tag
  - format_validity
  - llm_judged_answer_correctness
  - group_relative_terminal_reward
  verifier_output: SFT trajectory selection first discards invalid ReAct output, then uses GPT-4o to retain answers judged
    correct, and finally applies rule- and prompt-based checks for repetition/hallucination, information non-redundancy, goal
    alignment, and logical reasoning/accuracy. RL computes a binary format score and a binary answer score from a Qwen-72B-Instruct
    judge; no step-correctness labels are used.
  reward: The DAPO terminal reward is 0.1 times binary format validity plus 0.9 times binary LLM-judged answer correctness.
    Dynamic sampling drops prompt groups for which all 16 executions are correct or all are incorrect before policy updates.
  terminal_predicate: 'Interaction terminates when the model emits the answer action. Reward success is not an environmental
    ground-truth predicate: it requires valid output/tool JSON and a positive Qwen-72B-Instruct judgment against the reference
    answer.'
  provenance: Web roots or SimpleQA-style seeds -> GPT-4o QA synthesis or iterative E2HQA rewriting -> GPT-4o/QwQ-Plus ReAct
    trajectory sampling -> validity, correctness, and quality filtering -> Short-CoT or Long-CoT SFT -> unused QA pairs sampled
    in live-web DAPO rollouts -> format and LLM-judge terminal reward.
  environment_or_substrate: Qwen-Agents ReAct over two live-web tools, search and visit. Search is backed by web retrieval;
    visit returns page evidence summarized by Qwen-2.5-72B. The official demo scripts require external Serper, Jina, and DashScope
    credentials.
  release_boundary: The official repository releases 200 QA examples, a 3.62 MB trajectory sample described by maintainers
    as 200 cold-start trajectories, demo/inference scripts, and the WebDancer-32B checkpoint. It does not release the full
    100,000 QA pool, all 14,228 reported SFT trajectories, on-policy RL rollouts/rewards, rejected examples, the modified
    verl training implementation, or a frozen web substrate.
recipe_metadata:
  base_model: Reported experiments train Qwen2.5-7B-Instruct and Qwen2.5-32B-Instruct on Short-CoT trajectories and QwQ-32B
    on Long-CoT trajectories. The released WebDancer-32B model card identifies QwQ-32B, itself derived from Qwen2.5-32B, as
    its immediate base lineage.
  teacher: GPT-4o supplies Short-CoT trajectories and SFT correctness judgments; QwQ-Plus supplies Long-CoT thoughts/actions.
    Qwen-2.5-72B summarizes visited pages, and Qwen-72B-Instruct supplies the RL answer reward.
  generator: GPT-4o synthesizes CRAWLQA pairs and participates in E2HQA rewriting, then GPT-4o or QwQ-Plus generates ReAct
    trajectories. The current policy generates 16 candidate executions per QA during on-policy DAPO.
  prompt_or_task_source: 60,000 CRAWLQA and 40,000 E2HQA synthetic short-answer tasks, plus selected open-source QA tasks
    for comparison. Exact root-site manifests, SimpleQA seed corpus revision, and record-level source URLs are not released.
  filtering_rule: Use up to five trajectory samples per QA; discard invalid ReAct records; retain GPT-4o-judged correct answers;
    apply repetition/hallucination rules and prompted quality criteria; constrain repeated 10-grams to at most four occurrences.
    During DAPO, exclude all-correct and all-wrong 16-rollout groups. The paper's prose about filtering trajectories with
    more than two actions conflicts with Table 4 mean action counts above two, so that threshold direction is unknown.
  selection_threshold: Binary correctness is required for retained SFT trajectories; prompted quality criteria must also pass.
    Numeric thresholds for the prompted quality checks are not disclosed.
  sampling_protocol: Rejection-sampling count N is 5. Table 4 reports 7,678 Short-CoT trajectories with 4.56 mean actions
    and 510.03 mean thought tokens, and 6,550 Long-CoT trajectories with 2.31 mean actions and 1,599.39 mean thought tokens.
    RL uses 16 executions per QA; Appendix A says only a small subset, for example 5,000 QA pairs, can be used because of
    compute and stability constraints.
  rollout_count: 16
  temperature: Non-RL inference uses temperature 0.6 and top-p 0.95; repetition penalty is 1.1 for the LRM and 1.0 for the
    LLM. RL rollouts use temperature 1.0 and top-p 1.0.
  inference_budget: All experiments use 32 nodes with eight NVIDIA H20 96GB GPUs per node. The paper discloses no maximum
    episode steps, token cap, search-call budget, random seeds, wall-clock cost, or exact number of RL training QA pairs.
  search_or_scaffold: ReAct implemented on Qwen-Agents with search and visit; the released demo uses SGLang plus Serper search,
    Jina page access, and DashScope. Paper-bound service versions, index state, API responses, and dependency commits are
    not pinned.
  optimizer_or_scaffold: Cold-start SFT uses multi-turn ChatML and masks external observation tokens. Agent RL uses DAPO implemented
    on a modified verl stack, optimizing only model-generated tokens while tool responses remain in the conditioning context.
audit:
  source_mixture: Synthetic CRAWLQA from crawled web pages, synthetic E2HQA from iteratively rewritten SimpleQA-style entity
    questions, and an open-only mixture of MuSiQue, Bamboogle, PopQA, 2Wiki, and HotpotQA. Record-level source proportions,
    domains, root URLs, rejected seeds, and deduplication decisions are not public.
  split: QA pairs absent from the SFT trajectory set are eligible for RL. The exact SFT/RL membership manifest and randomization
    are not released. Evaluation uses 103 text-only GAIA validation questions and 680 WebWalkerQA test questions; no immutable
    train/dev/test ledger linking constructed data to evaluations is public.
  decontamination: unknown. The paper does not report string, semantic, source-page, or template overlap checks between CRAWLQA/E2HQA/open-only
    tasks and GAIA, WebWalkerQA, or BrowseComp. A separate 69-example GAIA memorization stress test does not establish decontamination
    of the main training mixture.
  benchmark_overlap: The open-only comparison explicitly draws from established public QA datasets. Potential overlap of web
    pages, entities, answer strings, or generated templates with GAIA, WebWalkerQA, and BrowseComp is not quantified.
  lineage: Aggregate construction stages, generators, filters, and data counts are documented, and public samples expose source-family
    tags. The full records do not have a released root URL, crawl timestamp, page snapshot, teacher request, judge decision,
    rejection reason, or SFT/RL membership ledger.
  license: The WebAgent subdirectory carries an MIT license and the official WebDancer-32B model card also lists MIT. No dataset-specific
    card or terms clarify rights for copied web content, generated QA/trajectory records, tool observations, or upstream public-QA
    sources, so training and redistribution rights for the samples require separate review.
