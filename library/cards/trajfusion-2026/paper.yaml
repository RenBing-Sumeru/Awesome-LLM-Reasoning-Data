one_line_summary: TrajFusion samples 16 math solutions, selects representative verifier-rejected errors using frequency and
  wrong-answer diversity, and fuses them with generic reflection prompts and one correct trace for standard SFT.
why_it_matters: It gives a concrete alternative to discarding every wrong rollout, while making clear that terminal correctness,
  generic reflection text, and an unreleased candidate pool leave substantial process-quality and lineage risks.
