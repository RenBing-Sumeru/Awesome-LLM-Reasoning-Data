one_line_summary: BPP-Search uses a learned process reward model to prune a mathematical-modeling tree and a pairwise classifier
  to select the final candidate, while the public StructuredOR artifact contains 124 final structured examples rather than
  the raw search trees.
why_it_matters: It makes tree width, intermediate scoring, and final-candidate selection explicit data-construction variables,
  but also demonstrates why a final question and label release cannot support audits of rejected branches, selector behavior,
  verifier outputs, or inference-budget attribution.
