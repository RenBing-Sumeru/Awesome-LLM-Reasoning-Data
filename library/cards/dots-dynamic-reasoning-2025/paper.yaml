inclusion_reason: DOTS is a direct search-generated reasoning-data recipe whose 12-action trajectory space, outcome scoring,
  pruning budget, solver-conditioned selection, and planner SFT targets are explicit. Its public 4.8 GB artifact unusually
  preserves raw successful and failed rollout dialogues and scores, while missing manifests, processed SFT files, checkpoints,
  and paper-exact code settings remain important audit boundaries for this track.
