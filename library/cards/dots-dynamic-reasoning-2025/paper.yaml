one_line_summary: DOTS searches 12 solver-conditioned reasoning-action trajectories with repeated ground-truth scoring, trains
  external or internalized planners on the selected paths, and releases a 4.8 GB MATH file containing raw dialogues, failed
  trials, trajectory IDs, predicted answers, and binary scores.
why_it_matters: The work makes trajectory choice and search budget first-class reasoning-data variables and exposes more raw
  search evidence than a final-only SFT release, while showing why solver/evaluator overfit, missing pruning manifests, and
  paper-code configuration drift must be audited before reuse.
