one_line_summary: Seed-Coder builds a 6T curriculum with external-teacher quality scoring, then adds 3M SFT, 20K sandbox-derived
  preferences, and 250-step LongCoT GRPO while withholding data, scorer, tests, rewards, and lineage.
why_it_matters: It shows how learned filters and executable feedback shape a code model while exposing teacher, language,
  formatting, generated-test, licensing, and leakage risks.
