one_line_summary: Skywork-OR1 releases code, weights, and an RL dataset with named source pools and difficulty filtering,
  but leaves verifier details, item lineage, rights, and a count/version discrepancy unresolved.
why_it_matters: It is a useful disclosure ledger because it contains more reusable artifacts than a report-only release while
  documenting what is still required to audit the rule-based RL pipeline.
