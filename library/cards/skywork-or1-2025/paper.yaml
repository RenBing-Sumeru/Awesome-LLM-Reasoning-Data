data_object:
  prompt_source: The official dataset card names open-source NuminaMath-1.5, DeepScaleR-Preview-Dataset, STILL-3-Preview-RL-Data,
    Omni-Math, pre-2024 AIME problems, LeetCodeDataset, and TACO as sources.
  trace_author: unknown
  answer_format: The release contains math problems and coding questions; the inspected dataset page does not expose a stable
    item schema because its viewer is unavailable.
  process_fields: []
  environment_or_substrate: Large-scale rule-based RL for math and code reasoning.
  verifier_or_reward: Rule-based reinforcement learning is reported; exact reward functions and verifier implementations are
    not fully specified in the inspected sources.
  terminal_predicate: Offline and online difficulty-based filtering and rejection sampling are reported; exact thresholds
    and sample-level decisions are not released.
recipe_metadata:
  base_model: DeepSeek-R1-Distill-Qwen-7B and DeepSeek-R1-Distill-Qwen-32B are listed as bases for the released 7B and 32B
    models.
  teacher: unknown
  generator: Model-aware difficulty estimation plus multi-stage RL with adaptive entropy control.
  filtering_rule: The dataset card reports difficulty estimation per problem/model, human and LLM-as-a-Judge quality assessment,
    within-dataset deduplication, and removal of problems similar to AIME24, AIME25, and LiveCodeBench. Offline and online
    difficulty-based filtering and rejection sampling are reported for training.
  sampling_protocol: Difficulty is scored 0--16 relative to DeepSeek-R1-Distill-Qwen-{1.5,7,32}B; for each variant, difficulty
    0 and 16 problems are excluded. Further stage settings are unknown.
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: Customized GRPO with data-wise/training-wise improvements and adaptive entropy control.
audit:
  source_mixture: The official dataset card reports 105K math problems and 14K coding questions, while the model page says
    110K math and 14K coding questions. This version/count discrepancy is retained as an audit issue.
  split: The dataset card says similar problems from AIME24, AIME25, and LiveCodeBench were removed; a deterministic split/source
    manifest is not reported.
  decontamination: Deduplication within the dataset and removal of similar AIME24/AIME25/LiveCodeBench problems are reported;
    methods, thresholds, and audit artifacts are unknown.
  license: unknown
  lineage: Named open-source pools to cleaning/quality assessment/difficulty estimation to filtered RL data to multi-stage
    GRPO. Item-level source, decision, and rejected-sample lineage is not disclosed.
  known_failure_modes:
  - An early dataset version briefly exposed incorrect difficulty fields; the official card directs users to a newer version
    or a specified commit.
  - Dataset-count statements differ between official pages.
  - Item schema, verifier implementation, source rights, filtering yields, and sample-level provenance are incomplete.
  - Evaluation gains do not verify the reproducibility or correctness of difficulty labels and quality judgments.
  citation_status: verified
  confidence: medium
  notes: Official arXiv report, Skywork GitHub repository, official dataset card, and official 32B model page were checked
    on 2026-07-14.
inclusion_reason: A notably open frontier report that releases code, weights, and an RL dataset while retaining material ledger
  gaps and a disclosed dataset-version issue.
