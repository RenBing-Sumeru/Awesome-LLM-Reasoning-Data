one_line_summary: RLT trains a Qwen2.5-7B-Instruct teacher with dense frozen-student likelihood and explanation-KL feedback
  to generate raw explanations from known question-solution pairs for downstream distillation.
why_it_matters: It makes the teacher-conditioning and feedback contract unusually concrete, while showing that student-specific
  rewards, answer-conditioned explanations, missing trace releases, and missing teacher weights remain central audit boundaries.
