data_object:
  prompt_source: The lifecycle starts from Chinese/English and a reported 1.3T-token component covering 112 other languages
    and dialects. MT continued pretraining uses mC4/OSCAR monolingual text and public parallel corpora such as OPUS and ParaCrawl.
    Stage-one SFT draws about 3M pairs from FLORES-200 dev, past WMT test sets, human Mandarin-minority data, DeepSeek-V3-0324
    synthetic translations, and a reported 20% instruction component; stage two retains about 268K higher-fidelity pairs.
  trace_author: Web and parallel-corpus authors supply pretraining text. Human annotators supply minority-language pairs and
    verification. DeepSeek-V3-0324 generates synthetic translations and serves as a GEMBA-style evaluator. Hunyuan-MT-7B generates
    Chimera candidates, and Chimera fuses them. A separate study trains model-generated chain-of-thought with process and
    final-answer rewards.
  answer_format: Most records map a source segment and target-language instruction to a translation. RL records add reference-conditioned
    learned scores, terminology overlap, and repetition penalties. Chimera records contain one source, multiple candidate
    translations, and a refined output; the public prompt has exactly six numbered candidate slots.
  process_fields:
  - source_dataset_or_corpus
  - source_language
  - target_language
  - source_segment
  - reference_translation
  - synthetic_teacher
  - candidate_translation
  - candidate_index
  - fused_translation
  - quality_model_scores
  - provenance_weighted_score
  - disciplinary_tag
  - industry_tag
  - content_theme_tag
  - fasttext_language_id
  - minlsh_deduplication
  - kenlm_perplexity
