one_line_summary: Hunyuan-MT maps a reported 1.3T multilingual foundation through RegMix-style CPT, a 3M-to-268K SFT funnel,
  judge-based GRPO, and six-candidate Chimera fusion, but releases no training manifests, rewards, rollouts, splits, or paper-run
  lineage.
why_it_matters: It exposes a concrete translation lifecycle while making public-test reuse, correlated teacher/judge feedback,
  minority-language rights, test-time budgets, and restrictive licensing auditable.
