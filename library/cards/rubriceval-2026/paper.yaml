  verifier_or_reward: RAF label produced by base-judge agreement or meta-judge consensus, with sampled human validation; no
    mechanical verifier is provided.
  terminal_predicate: A judge prediction matches the RAF satisfy/not-satisfy label for the single rubric-response pair.
recipe_metadata:
  base_model: Not a training recipe; this Card treats RubricEval as a rubric-level judge meta-evaluation surface.
  teacher: RAF construction pipeline, o3 and DeepSeek-R1 meta-judge consensus for hard cases, and sampled human annotator
    validation.
  generator: Instructions/rubrics are collected from prior IF benchmarks and paired with model responses before rubric-level
    re-evaluation.
  filtering_rule: Easy cases come from unanimous base-judge agreement; Hard cases require o3 and DeepSeek-R1 meta-judge consensus;
    non-consensus cases are discarded.
