data_object:
  prompt_source: 1,989 instructions and 3,486 rubric-level instances from prior instruction-following benchmarks across Constrained,
    Compositional, Multi-turn, and System categories.
  trace_author: RubricEval authors construct RAF labels using base-judge agreement, o3/DeepSeek-R1 meta-judge arbitration,
    and sampled human validation.
  answer_format: Each evaluation item is instruction, response, one rubric criterion, and a binary satisfy/not-satisfy label;
    reported metrics include balanced accuracy and macro-F1.
