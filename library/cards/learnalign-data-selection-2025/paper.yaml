one_line_summary: LearnAlign ranks prompts for one warmed-up RLVR policy by combining p(1-p) learnability with average cosine
  alignment among projected GRPO gradients, then trains on the top-N subset; no selected subset or implementation is released.
why_it_matters: For data construction and open releases, it turns prompt selection into a checkpoint-relative data stage whose
  rollouts, verifier decisions, gradients, projection, ranking, and run bindings must be preserved for audit.
