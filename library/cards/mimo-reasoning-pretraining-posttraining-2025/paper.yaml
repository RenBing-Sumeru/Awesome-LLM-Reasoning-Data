data_object:
  prompt_source: Pretraining draws from web pages, academic papers, books, programming code, and synthetic data, but no source
    manifest or mixture-by-source ledger is published. The original SFT stage uses about 500K open-source and proprietary
    distilled samples; a later MiMo-7B-RL-0530 update reports 6M SFT instances. RL uses 100K mathematics and 30K code problems
    from open-source and proprietary collections. Exact dataset names, records, source revisions, and rights are mostly unknown.
  trace_author: Synthetic pretraining responses are generated by unnamed advanced reasoning models. SFT responses are described
    as distilled, but teacher identities and record-level authorship are unknown. RL trajectories are generated by MiMo policies,
    including direct RL from MiMo-7B-Base and RL from an SFT checkpoint; rollout records are not released.
  answer_format: SFT items contain queries and responses, but their schema is not released. RL items are mathematics or programming
    problems paired with full generated solutions; mathematics requires an extractable rule-checkable answer, while code requires
    executable submissions and tests. Prompt, response, test, metadata, and reward schemas remain unknown.
  process_fields:
  - source document and quality tags for pretraining
  - SFT query and distilled response
  - mathematics or code problem
  - code tests and test-difficulty group
  - policy rollout
  - per-rollout pass rate
  - rule-verifier result
  - scalar reward
  - dynamic-sampling validity state
  environment_or_substrate: Mathematics verification uses Math-Verify. Code verification uses an online judge that executes
    large numbers of unit tests in parallel, with some problems containing hundreds of tests. The exact sandbox image, language/runtime
    versions, resource limits, test visibility, failure handling, and judge snapshots are unknown.
  verifier_or_reward: Final RL feedback is programmatic. Mathematics uses Math-Verify correctness. Code uses pass-rate-derived
    test-difficulty groups and either a strict scheme, which requires all tests at a level and all easier levels, or a soft
    scheme, which divides group score across tests; total reward sums passed-test scores. No format or length reward is reported
    for the principal recipe. Model-based filters are used before RL, so construction verification is mixed rather than purely
    programmatic.
  terminal_predicate: A mathematics rollout terminates with an answer that Math-Verify can assess. A code rollout is run against
    tests and receives the sum of applicable passed-test scores. Exact answer-extraction rules, timeouts, compilation failures,
    nondeterminism handling, test snapshots, and the criterion used to choose strict versus soft code rewards are unknown.
recipe_metadata:
  base_model: MiMo-7B-Base is a decoder-only Transformer trained from scratch on about 25T tokens with GQA, pre-RMSNorm, SwiGLU,
    RoPE, and a single Multi-Token Prediction layer. Posttraining produces MiMo-7B-RL-Zero directly from Base and MiMo-7B-RL
    from MiMo-7B-SFT; MiMo-7B-RL-0530 is a later 6M-SFT and extended-budget variant.
  teacher: Unnamed advanced reasoning models generate synthetic pretraining responses and participate in difficulty filtering.
    The original and expanded SFT sets contain distilled data, but teacher models, checkpoints, prompts, decoding settings,
    and per-record teacher assignments are unknown.
  generator: Pretraining synthesis prompts models to analyze selected high-reasoning-depth STEM material, solve mathematics
    and code problems, and answer general-domain queries including creative writing. SFT distillation generation is undisclosed.
    During RL, the current MiMo policy produces full responses for group-relative updates.
  filtering_rule: Web pages undergo URL and MinHash deduplication, followed by small-model domain and multidimensional quality
    tagging; exact taggers and thresholds are unknown. SFT removes queries with 16-gram overlap against evaluation benchmarks,
    mixed-language or incomplete responses, and caps responses per query at eight. RL math removes proof and multiple-choice
    items with a model, globally deduplicates and decontaminates, rejects problems unsolved by advanced models, and removes
    items with MiMo-SFT pass rate above 90 percent over 16 rollouts, eliminating about half of easy math. Code removes items
    without tests, invalid golden solutions, items with no test solved by advanced models in 16 rollouts, and items solved
    perfectly by MiMo-SFT in 16 rollouts.
  sampling_protocol: 'Pretraining has three mixtures: Stage 1 excludes synthetic responses to reasoning-task queries and rebalances
    low- and high-value domains; Stage 2 raises mathematics and code to 70 percent; Stage 3 adds 10 percent synthetic responses
    and extends context. RL dynamic sampling oversamples candidates and removes prompts with pass rate 0 or 1 from gradient
    batches. A separate easy pool is sampled with 10 percent probability to stabilize later updates.'
  rollout_count: Difficulty filtering uses 16 MiMo-SFT rollouts per retained math problem and 16 rollouts for code easy filtering;
    advanced-model code screening also uses 16 rollouts. The number of models and rollouts used to calibrate test difficulty,
    and the policy-update response-group size, are unknown.
  temperature: RL training uses temperature 1.0 and top-p 1.0. Posttraining evaluation uses temperature 0.6 and top-p 0.95
    and is a separate protocol. Synthetic pretraining and SFT-distillation decoding settings are unknown.
  inference_budget: Original SFT and RL training pack or generate up to 32,768 tokens. The later MiMo-7B-RL-0530 on-policy
    run progressively raises generation length from 32K to 38K and then 48K. Aggregate rollout attempts, generated tokens,
    rejected outputs, and compute are unknown.
  optimizer_or_scaffold: Original RL uses modified GRPO without KL loss, dynamic sampling, and Clip-Higher. It reports batch
    size 512, actor mini-batch 32, 16 gradient updates per iteration, learning rate 1e-6, and 32,768-token maximum length.
    Seamless Rollout Engine runs on verl, Ray, and vLLM with continuous rollout, asynchronous reward computation, and FIFO-aware
    early termination. The later RL-0530 update reports on-policy RL, but its complete objective and optimizer settings are
    unknown.
audit:
  source_mixture: Pretraining reports about 25T tokens but not a source-by-source count ledger. The original SFT report gives
    about 500K samples after filtering; the later RL-0530 update gives 6M instances without releasing them. RL reports exactly
    100K mathematics plus 30K code problems. These counts describe different stages and versions and must not be combined
    into a single downloadable-corpus total.
  split: unknown
  decontamination: SFT removes training queries with 16-gram overlap against evaluation benchmarks. RL mathematics reports
    global n-gram deduplication and benchmark decontamination; code says it follows similar curation but does not publish
    a complete match ledger. Pretraining corpus-wide benchmark decontamination, benchmark revisions, normalization, thresholds,
    matches, and removals are unknown.
  license: The MiMo project repository and XiaomiMiMo vLLM fork are Apache-2.0. Official MiMo-7B model pages are labeled MIT.
    No official dataset artifact or data license is linked for the pretraining corpus, 500K or 6M SFT data, 130K RL problems,
    code tests, policy rollouts, or evaluation inputs. Code and weight licenses do not establish rights to those data.
  lineage: Web, paper, book, code, and synthetic sources -> extraction, webpage deduplication, quality tagging, and three-stage
    pretraining mixture -> MiMo-7B-Base -> open/proprietary distilled SFT with overlap and response filtering -> MiMo-7B-SFT
    -> 100K math and 30K code problem curation, difficulty filtering, rule verification, dynamic sampling, and modified GRPO
    -> MiMo-7B-RL. A parallel Base-to-RL path yields MiMo-7B-RL-Zero; expanded 6M SFT and 32K-to-48K on-policy RL yield MiMo-7B-RL-0530.
    Record-level sources, rejects, checkpoints, and run membership are unavailable.
  known_failure_modes:
  - The pretraining, SFT, RL problem, test, reward, and rollout datasets are described but not released as official data artifacts.
  - The MiMo repository is primarily a report, model registry, and deployment surface; the verified XiaomiMiMo vLLM fork is
    inference code, not the complete pretraining, SFT, RL, verifier, online-judge, or Seamless Rollout Engine implementation.
  - Model-based quality tagging, proof and multiple-choice filtering, difficulty screening, and test calibration can introduce
    judge errors; taggers, prompts, model revisions, and calibration are unknown.
  - Math rule verification can accept an exploitable or malformed path to a correct endpoint; the paper reports reward exploitation
    during later Base-to-RL training.
  - Code tests can be incomplete, biased, leaked, or environment-sensitive; test cases, difficulty clusters, runtime images,
    and false-accept audits are not published.
  - Dynamic sampling removes pass-rate-zero and pass-rate-one prompts from update batches, changing the effective task distribution;
    per-step retained distributions are not released.
  - The language-mixing penalty explored by the authors did not fully solve language mixing and introduced a separate exploitation
    risk; its relationship to released checkpoints is not fully specified.
  - The 500K-to-6M SFT expansion and the RL-0530 training change are later-version disclosures without sample manifests, teacher
    lineage, or a complete configuration crosswalk.
  - SFT and RL decontamination are described at a high level, but exact benchmark snapshots, matches, and removal lists are
    unavailable; pretraining decontamination remains unknown.
  - Evaluation repetition counts, decoding temperature, pass@k curves, model scores, and infrastructure speedups are model
    or systems evidence, not proof of source rights, data correctness, verifier accuracy, or release completeness.
  citation_status: verified
  confidence: high
  notes: Official arXiv report, XiaomiMiMo project repository, MiMo-7B Hugging Face collection and weight pages, and the XiaomiMiMo
    vLLM inference fork were checked on 2026-07-19. Model weights and inference code are real. No official pretraining, SFT,
    RL-task, verifier, test, or rollout dataset was linked by the checked official surfaces.
inclusion_reason: MiMo is a high-value frontier disclosure because it connects reasoning-oriented pretraining, distilled SFT,
  rule-verifiable math and code RL, test-difficulty rewards, dynamic sampling, and rollout infrastructure while leaving the
  underlying data and most replay artifacts unavailable.
