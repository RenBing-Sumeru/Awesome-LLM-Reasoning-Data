one_line_summary: MiMo reports 25T-token reasoning-oriented pretraining, 500K then 6M distilled SFT instances, and 130K rule-verifiable
  RL problems, while releasing weights and inference code but not the training data, tests, verifiers, rollouts, or complete
  training stack.
why_it_matters: It shows why a frontier data ledger must separate pretraining composition, SFT distillation, RL tasks and
  rewards, actual open artifacts, and benchmark evidence rather than treating open weights as a reusable data recipe.
