  split: The official release has one code_completion split with 318 rows.
  decontamination: Audit repository exposure before interpreting results as unseen secure coding.
  license: MIT on the Hugging Face dataset page; retain upstream repository licences.
  lineage: https://github.com/ai-sec-lab/SecRepoBench
  known_failure_modes:
  - Developer tests and fuzzing do not prove absence of unvisited vulnerabilities.
