recipe_metadata:
  base_model: Standalone LLMs and code agents are evaluated.
  teacher: Developer tests, reference patches, and security validation assets.
  generator: Extract real security tasks, mask implementations, and retain repository context.
  filtering_rule: Broken baseline must fail; reference completion must compile, pass developer tests, and survive security
    validation.
  sampling_protocol: 318 tasks from 27 repositories spanning 15 CWE classes.
  rollout_count: null
  temperature: null
  inference_budget: Fix containers, compilers, fuzzer seeds, timeouts, and repository revisions.
  optimizer_or_scaffold: Dual-oracle evaluation of function and security behavior.
