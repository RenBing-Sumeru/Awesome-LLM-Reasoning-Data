one_line_summary: SecRepoBench uses paired developer tests and exploit checks on 318 real C/C++ repository holes to measure
  whether code agents produce both functional and secure completions.
why_it_matters: It turns security-sensitive completion into a joint executable outcome rather than a text-match or compilation-only
  task.
