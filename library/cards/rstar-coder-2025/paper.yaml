status: partial
one_line_summary: rStar-Coder expands reference-bearing competition problems into synthesized problems, executable tests,
  and long-reasoning solutions through LLM generation, program execution, agreement filtering, and decontamination, while
  its public configs and supplemental code do not fully reconstruct the paper run.
why_it_matters: It makes problem synthesis, testcase generation, executable verification, SFT traces, and RL-ready exports
  visible as separate data contracts, and it provides calibrated evidence that agreement is useful but weaker than a trusted
  oracle.
