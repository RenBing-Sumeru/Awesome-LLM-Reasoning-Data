  verifier_or_reward: Native compilation, simulation, and fail-to-pass/pass-to-pass test outcomes.
  terminal_predicate: Candidate patch resolves the failing hardware behavior under the repository's native flow.
recipe_metadata:
  base_model: Seven LLMs evaluated through four hardware-agent frameworks.
  teacher: Historical ground-truth patches, project tests, and native hardware simulators.
  generator: Mine bug-fix PRs, construct reproducers, validate reference patches, and package containers.
  filtering_rule: Retain cases where the buggy revision fails and the ground-truth fix passes native tests.
  sampling_protocol: 417 tasks from six open hardware repositories.
  rollout_count: null
  temperature: null
  inference_budget: Fix images, EDA licences, random seeds, timeouts, submodules, and repository revisions.
  optimizer_or_scaffold: Repository agent edits followed by containerized native simulation.
audit:
