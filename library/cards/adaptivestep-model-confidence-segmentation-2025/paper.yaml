one_line_summary: AdaptiveStep replaces hand-written step delimiters with model-confidence boundaries, producing process-reward
  supervision that targets actual decision points in math and code traces.
why_it_matters: It makes the granularity of process supervision a learned, inspectable construction decision rather than a
  formatting artifact.
