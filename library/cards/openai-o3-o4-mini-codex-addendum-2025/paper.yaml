one_line_summary: OpenAI's Codex addendum reports RL on real-world coding tasks plus synthetic/perturbed safety environments
  for malware, false-completion, and prompt-injection risks, but does not release task manifests, trajectories, the main reward,
  or training artifacts.
why_it_matters: It is a useful frontier disclosure ledger because it names concrete safety data objects and an action-consistency
  reward while showing that strong evaluation scores and sandbox mitigations do not make the underlying coding-agent RL pipeline
  auditable.
