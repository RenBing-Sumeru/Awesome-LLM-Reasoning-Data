one_line_summary: BrowseComp releases 1,266 obfuscated hard factual web questions and short answers scored by an answer-only
  LLM judge, but no browsing trajectories, citations, or replayable web state, and its current official reference scorer has
  a label-parsing defect.
why_it_matters: It is a canonical stress test for persistent live-web search and test-time compute, while its reversible anti-leakage
  layer, single-reference judge, undisclosed paper grader, post-release contamination risk, missing episodes, and scoring-code
  defect show why benchmark availability is not the same as trajectory reuse or reproducible feedback.
