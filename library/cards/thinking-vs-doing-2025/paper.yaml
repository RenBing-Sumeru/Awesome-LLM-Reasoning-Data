one_line_summary: TTI turns terminally successful multimodal web episodes into state/action behavior-cloning data under an
  expanding interaction horizon, but its public release omits trajectories and does not reproduce a clean paper-aligned split/configuration.
why_it_matters: It shows that the interaction budget changes which exploratory behaviors enter post-training data, and it
  provides a concrete case where terminal feedback, positive-only selection, evaluator identity, split integrity, and replay
  metadata must be audited together.
