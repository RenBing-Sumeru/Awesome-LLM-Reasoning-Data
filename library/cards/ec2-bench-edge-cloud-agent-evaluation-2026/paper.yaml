one_line_summary: EC2-Bench releases 128 executable workspace evaluation tasks, 100 with privacy annotations, jointly
  scoring agent task performance, cloud resource use, and annotated information exposed to cloud collaborators.
why_it_matters: It separates successful agent execution from resource use and cloud-visible sensitive information;
  its evaluation feedback should not be mistaken for a released agent-training dataset.
