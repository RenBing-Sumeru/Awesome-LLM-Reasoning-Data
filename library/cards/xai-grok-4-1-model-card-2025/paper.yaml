data_object:
  prompt_source: 'The six-page model card names only four broad pretraining categories: publicly available Internet data,
    third-party-produced data, data from users or contractors, and internally generated data. The report gives no source manifests,
    proportions, prompt provenance, revisions, rights mapping, or production-data boundary.'
  trace_author: xAI says Grok 4.1 was trained on demonstrations of appropriate benign and harmful-query responses, and that
    Grok systematically applies adversarial attacks for filter training. Demonstration authorship, annotator protocol, generator
    versions, thought-trace policy, and item lineage are unknown.
  answer_format: A concrete evaluation record is described as a single-turn policy-violating request, Grok response, and separate-model
    assisted-or-refused grade. Training record schemas, raw demonstrations, reward fields, evaluator outputs, and released
    examples are unknown.
  process_fields:
  - single_turn_request
  - model_response
  - assisted_or_refused_grade
  environment_or_substrate: Both Thinking and Non-Thinking configurations use a production system-message instruction for
    evaluation. The card names AgentHarm and AgentDojo; the release announcement evaluates non-reasoning with web search tools.
    Prompts, tools, versions, task instances, harnesses, containers, and replay logs are unknown.
  verifier_or_reward: The card names human feedback, verifiable rewards, and model-based graders for SFT/RL. The announcement
    says frontier agentic reasoning models act as reward models for non-verifiable signals. A separate model grades one refusal
    evaluation. Reward definitions, model identities/versions, calibration, thresholds, aggregation, coverage, and errors
    are unknown.
  terminal_predicate: unknown
recipe_metadata:
  base_model: Grok 4.1 checkpoint lineage, architecture, initialization, data allocation, and checkpoint selection are unknown.
  teacher: unknown
  generator: Grok supplies adversarial attacks for filter training; generators for demonstrations, SFT/RL records, reward-model
    data, and general training data are unknown.
  filtering_rule: The card names de-duplication and classification, and input filters trained on mixed synthetic and production
    data. Filter models, thresholds, ordering, yields, rejection records, and production-data governance are unknown.
  sampling_protocol: unknown
  rollout_count: null
  temperature: null
  inference_budget: The announcement states that Non-Thinking uses no thinking tokens for an immediate response; numeric training
    or evaluation budgets are unknown.
  optimizer_or_scaffold: Targeted mid-training, SFT, and RL with human feedback, verifiable rewards, and model graders are
    named. Objectives, reward mixing, optimizer, schedules, rollouts, samples, and RL infrastructure configuration are unknown.
audit:
  source_mixture: Four broad pretraining classes are disclosed with no weights, counts, manifests, revisions, source rights,
    or item-level provenance. Production traffic is explicitly named for input-filter training and some evaluations; the report
    does not say it trains the base/post-trained model.
  split: unknown
  decontamination: De-duplication is named but method, thresholds, efficacy, benchmark-overlap checks, and train/evaluation
    membership are unknown.
  license: Licenses, consent, retention, and reuse rights for Internet, third-party, user, contractor, internal, synthetic,
    production, demonstration, and evaluation records are unknown.
  lineage: The card gives high-level lineage from broad sources through filtering, targeted mid-training, SFT/RL feedback
    families, and mitigation/evaluation; it does not give source-to-prompt-to-response-to-feedback-to-checkpoint records.
  known_failure_modes:
  - Broad source/feedback labels do not establish record provenance, data rights, production-data boundaries, or benchmark
    overlap controls.
  - Reward/verifier/grader definitions, identities, calibration, coverage, false positive/negative behavior, and optimization
    weights are undisclosed.
  - Internal refusal/filter/jailbreak evaluations and separate-model grades lack public prompts, labels, model versions, instances,
    and logs.
  - Earlier cards evaluated English prompts only because of a setting error; multilingual results are not directly comparable.
  - Dual-use tests remove safeguards, while deployment evaluation uses a production system-message instruction and filters;
    the deployment/evaluation configuration is unreleased.
  - Live production traffic is used for silent-rollout pairwise evaluation and a sampled hallucination evaluation; use, consent,
    retention, and separation from training are not documented.
