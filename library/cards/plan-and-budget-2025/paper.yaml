why_it_matters: 'It makes an allocation policy part of the reasoning record: credits and schedules can affect both output
  quality and token cost. The release is useful for method inspection and evaluation replication, but absent trace/result
  manifests and contamination evidence prevent treating it as an auditable training-data release.'
