one_line_summary: LEAP combines Gemini 3.1 Pro, compiler-guided revision, and an AND-OR proof DAG to produce Lean-checked
  outcomes, but releases successful proofs rather than replayable agent trajectories.
why_it_matters: For Programmatically Verifiable Outcome Data, it separates the exact terminal label supplied by Lean from
  the heuristic LLM judgment used to allocate search, and makes inference budget part of any fair comparison.
