status: partial
one_line_summary: A paper-described 100K long-CoT recipe retrieves o1 flow/budget seeds to guide GPT-4o stepwise generation
  and answer judgment, but the publication's release target remains the literal text LINK and no paper-matched artifact is
  verified.
why_it_matters: It makes reasoning-flow shape and thought budget explicit construction variables for long-trace SFT before
  RLVR, while exposing how missing releases and row-level decisions prevent independent audit or reuse.
