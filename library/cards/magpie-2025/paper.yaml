data_object:
  prompt_source: An aligned open-weight model receives only its official chat template up to the position where a user message
    would begin; no seed instruction is supplied.
  trace_author: Llama-3-8B-Instruct writes Magpie-Air instructions and responses, while Llama-3-70B-Instruct writes Magpie-Pro;
    later releases also apply the recipe to Qwen2, Gemma-2, Phi-3, and domain models.
  answer_format: A conversation record with a UUID and one or more human/gpt turns; the audited filtered release contains
    a user instruction and a teacher response in each record.
  process_fields:
  - uuid
  - conversations.from
  - conversations.value
  - generated instruction
  - generated response
  environment_or_substrate: Static text generation through the aligned model's provider-defined chat template; no interactive
    environment is required.
  verifier_or_reward: Llama-3-8B-Instruct labels task category, input quality, and difficulty; a reward model scores responses,
    embedding distance detects near-duplicates, and Llama-Guard-2 audits safety.
  terminal_predicate: Instruction generation ends at the model end-of-sequence token; filtered releases retain records meeting
    configured quality, reward, similarity, completion, and response-length rules.
recipe_metadata:
  base_model: Llama-3-8B-Base is the main SFT evaluation backbone; Qwen1.5 and Qwen2 are additional consumers.
  teacher: Llama-3-8B-Instruct for Magpie-Air and Llama-3-70B-Instruct for Magpie-Pro.
  generator: Sample a user instruction from the pre-query chat-template prefix, then wrap that instruction in the normal full
    template and sample the assistant response.
  filtering_rule: Filter by input quality and difficulty, nearest-neighbor distance, response reward, reward difference, completion,
    repetition, and response length; the audited 300K Pro release requires input quality at least average and reward above
    -10.
  sampling_protocol: The paper generates 3M Air and 1M Pro raw conversations, evaluates 300K raw and 300K filtered subsets,
    and samples five responses per instruction for 100K preference sets.
  rollout_count: 4000000
  temperature: Generation configurations vary by release; the preference extension uses temperature 0.8 with five responses.
  inference_budget: On four A100-80GB GPUs, 3M Air takes 1.55 hours for instructions plus 50 hours for responses; 1M Pro takes
    3.5 plus 150 hours. The paper estimates $0.12 and $1.10 per 1,000 Air and Pro records.
  optimizer_or_scaffold: SFT uses a cosine schedule, initial learning rate 2e-5, and maximum sequence length 8192; DPO uses
    learning rate 5e-7.
audit:
  source_mixture: The original family contains 3M Llama-3-8B Air and 1M Llama-3-70B Pro records plus filtered, multi-turn,
    preference, domain, multilingual, and later model-specific variants.
  split: Magpie-Pro-300K-Filtered exposes one 300,000-record train split in three Parquet shards; the first shard has 100,000
    rows and 100 row groups.
  decontamination: Nearest-neighbor embedding distance is used for repetition filtering, but benchmark-specific semantic decontamination
    and memorization of hidden alignment data are not resolved.
  license: The audited dataset declares the Llama 3 license; the generation code is MIT. Reuse must also respect teacher-model
    and any source-model terms.
  lineage: Instructions and responses are sampled from the behavior embedded in aligned teacher weights, so the released data
    can reproduce unknown parts of the teachers' private alignment distribution.
  known_failure_modes:
  - Teacher errors, stylistic biases, and memorized private-alignment patterns can be copied at scale.
  - Reward, quality-label, and safety models can admit fluent but false or unsafe records.
  - Longer-response selection can reward verbosity and alter comparisons with shorter baseline data.
  citation_status: verified
  confidence: high
  notes: Full paper, DBLP ICLR 2025 record, OpenReview identifier, official project and repository, dataset card, one full
    187,600,397-byte Parquet shard, its schema, and a real conversation record were checked on 2026-07-14.
inclusion_reason: Magpie changes instruction-data construction itself by extracting seedless user queries and responses from
  aligned open-weight teachers, then releasing the resulting records and filtering recipe for SFT.
