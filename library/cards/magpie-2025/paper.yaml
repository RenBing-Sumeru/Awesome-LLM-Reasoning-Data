one_line_summary: Magpie samples seedless instructions from an aligned model's chat-template prefix and releases millions
  of instruction-response demonstrations plus filtered SFT subsets.
why_it_matters: It makes large-scale instruction generation possible without seed questions or commercial teacher APIs while
  exposing how teacher choice and filtering shape the resulting training distribution.
