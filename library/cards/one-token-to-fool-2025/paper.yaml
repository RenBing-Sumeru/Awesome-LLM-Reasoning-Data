data_object:
  prompt_source: Multi-subject RLVR, NaturalReasoning subset, GSM8K, MATH, and AIME 1983-2024 test examples.
  trace_author: Policy-model responses in the original 160K reward-model corpus; GPT-4o-mini regenerates responses for the
    20K truncated-negative augmentation.
  answer_format: A tuple of question, reference answer, candidate response, and binary YES/NO reward verdict.
  process_fields:
  - question and reference answer
  - candidate response
  - judge prompt/version
  - master-key type
  - binary verdict
  - false-positive rate
  - human or GPT-4o agreement
  environment_or_substrate: Reference-based LLM-as-a-judge/RLVR evaluation across specialized reward models and general-purpose
    proprietary/open models.
  verifier_or_reward: Generative judge J(question, reference, response) returns YES/NO; Master-RMs are supervised classifiers
    over this tuple.
  terminal_predicate: A master-key attack succeeds when a semantically empty response receives YES/positive reward; Master-RM
    training labels truncated lead-ins NO.
recipe_metadata:
  base_model: Qwen2.5-Instruct 7B and 32B for Master-RM; a broad set of existing specialized and general LLM judges for auditing.
  teacher: Qwen2.5-72B-Instruct provides labels for the original 160K Multi-sub RM dataset; GPT-4o is an agreement reference
    in evaluation.
  generator: Candidate-policy outputs, plus GPT-4o-mini chain-of-thought responses truncated to their first sentence.
  filtering_rule: Keep 20K first-sentence lead-ins as explicit NO negatives; remove any overlap with the ten master keys used
    for held-out attack evaluation.
  sampling_protocol: Ten fixed master-key responses are evaluated across five benchmarks; agreement analysis uses 2,500 GPT-4o-labeled
    and 500 human-judged mixed samples.
  rollout_count: null
  temperature: null
  inference_budget: null
  optimizer_or_scaffold: Cross-entropy SFT on 180K tuples, 160K original plus 20K targeted negative augmentations.
audit:
  source_mixture: 160K reference-based reward-model tuples plus 20K truncated-response adversarial negatives.
  split: Five attack benchmarks; held-out ten master keys are excluded from augmentation; agreement sets contain 2,500 GPT-4o
    and 500 human labels.
  decontamination: The paper checks augmentation does not overlap its selected master-key test strings, but does not establish
    coverage of all superficial or adaptive attack families.
  license: The paper says it will release the 180K dataset and Master-RMs; verify actual release status and licenses before
    reuse.
  lineage: Existing Multi-sub RM data -> regenerate 20K outputs -> truncate first sentence -> label NO -> SFT Qwen 7B/32B
    Master-RMs.
  known_failure_modes:
  - Generic cues and punctuation can obtain positive generative rewards.
  - Chain-of-thought prompting and majority voting do not reliably mitigate and can worsen attacks.
  - The proposed defense targets lead-in truncations, not all possible reward-model exploits.
  - Standard agreement with another judge can inherit that judge's weaknesses.
