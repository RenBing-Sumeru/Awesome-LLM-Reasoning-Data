one_line_summary: Superficial symbols or reasoning openers can make LLM judges award reference-conditioned positive rewards;
  truncated-lead-in negatives harden Master-RMs.
why_it_matters: It shows that supplying a reference answer does not make a generative verifier safe to use as an RL reward
  without adversarial auditing.
