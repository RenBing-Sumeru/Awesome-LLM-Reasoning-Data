  sampling_protocol: k=8 trajectories per problem; batches mix new curriculum with 25% historical replay
  rollout_count: 8
  temperature: null
  inference_budget: Generator validity evaluation uses 4,096 tokens and 600 seconds; training limits incomplete
  optimizer_or_scaffold: Online DPO for Solver plus offline value-weighted SFT for Generator over three stages
