one_line_summary: MobileWorldBench evaluates one-step Android future-state semantics with GPT-judged descriptions and yes/no
  QA, while MobileWorld supplies roughly 1.4M model-annotated transition items for SFT.
why_it_matters: It isolates the predictive component of mobile-agent reasoning into auditable state/action/next-state records,
  but also shows why source trajectories do not imply episode supervision and why judge versions, split hashes, replay support,
  licenses, and annotation lineage matter before reuse.
