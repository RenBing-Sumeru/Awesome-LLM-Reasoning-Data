one_line_summary: GLM-V discloses a broad multimodal pre-training, long-CoT SFT and GRPO/RLCS pipeline with domain-specific
  rewards, and releases weights plus reward/inference code while withholding the training records and curriculum ledger.
why_it_matters: It is a useful disclosure-ledger case because model and verifier availability can be audited separately from
  unreleased multimodal sources, long-CoT traces, difficulty labels, rollouts and selection decisions.
