one_line_summary: Gemini Robotics discloses thousands of hours of ALOHA 2 expert demonstrations, image-and-instruction inputs,
  action-chunk outputs, trajectory-relabelled reasoning data, and 2,000–5,000-episode specialization sets, but not the robot
  corpus, mixture, optimizer, or Gemini training-step count.
why_it_matters: It provides an unusually concrete disclosure ledger for moving from internet-scale multimodal reasoning to
  physical action, while showing that released ERQA evaluation records and proprietary action-training episodes have very
  different reuse and audit status.
