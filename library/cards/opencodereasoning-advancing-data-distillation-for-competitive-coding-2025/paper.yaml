one_line_summary: OpenCodeReasoning releases DeepSeek-R1 competitive-programming traces for Qwen2.5 SFT and shows a diversity-versus-execution-filtering
  trade-off, but the main rows are not functionally certified and the current recipe has moved toward OCR-2.
why_it_matters: It makes a large code-reasoning distillation pipeline inspectable and provides a concrete negative result
  about execution-only selection, while exposing why row-level verification, rights, decontamination logs, and revision pinning
  remain necessary.
