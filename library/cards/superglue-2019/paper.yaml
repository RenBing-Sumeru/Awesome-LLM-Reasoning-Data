data_object:
  prompt_source: SuperGLUE curates eight existing or adapted English NLU tasks after public task proposal, BERT-baseline,
    and human-baseline screening.
  trace_author: Official benchmark authors, annotators, validators, contest authors, or task curators as disclosed by the
    source.
  answer_format: task-specific classification, multiple-choice, coreference, and reading-comprehension predictions scored
    by official task metrics.
  data_scale: eight main tasks plus broad-coverage and Winogender diagnostics; paper Table 1 reports train/dev/test counts
    for BoolQ, CB, COPA, MultiRC, ReCoRD, RTE, WiC, and WSC.
  process_fields:
  - task input or prompt
  - reference answer, label, scorer, or evaluator
  - split/domain/version metadata
  - model output and score where evaluated
  environment_or_substrate: English NLU benchmark with private test labels, evaluation server, public leaderboard, diagnostic
    sets, and the jiant-based software toolkit described by the paper.
  verifier_or_reward: task metrics are accuracy, macro-F1, F1a, exact match, F1/EM, and MCC diagnostics, averaged into an
    overall SuperGLUE score after within-task metric averaging.
  terminal_predicate: official evaluator accepts task predictions, computes task-specific metrics, and aggregates non-diagnostic
    task scores for leaderboard comparison.
  benchmark_size: eight main tasks plus broad-coverage and Winogender diagnostics.
