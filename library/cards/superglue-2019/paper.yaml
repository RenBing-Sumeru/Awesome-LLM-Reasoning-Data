audit:
  source_mixture: 'Primary source and official artifacts listed in artifacts for SuperGLUE: A Stickier Benchmark for General-Purpose
    Language Understanding Systems.'
  split: Paper describes public train/dev data, private test data, evaluation-server submission limits, and task-specific
    train/dev/test sizes; reuse should pin the exact downloaded release and scorer revision.
  decontamination: Public benchmark records can leak into future training data; live, hidden, or post-cutoff claims require
    versioned evidence.
  license: SuperGLUE aggregates datasets with task-specific upstream terms; redistribution and data-use restrictions must
    be checked per task and against the current official site.
  lineage: 'Primary source: https://arxiv.org/abs/1905.00537'
