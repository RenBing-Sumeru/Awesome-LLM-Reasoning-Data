data_object:
  prompt_source: Versioned real repositories and selected components from seven repositories.
  trace_author: Qwen2.5-Coder-Instruct-32B repair-agent rollouts.
  answer_format: Repository state, synthetic bug, failed and preserved-passing tests, repair trajectory, and accepted patch.
  process_fields:
  - buggy component
  - failed test log
  - repair actions
  - candidate patch
  - execution result
  environment_or_substrate: Containerized repository environments.
  verifier_or_reward: Compilation and associated test execution.
  terminal_predicate: A candidate patch passes all associated tests.
recipe_metadata:
  base_model: Qwen2.5-Coder-Instruct-32B in reported synthesis and repair rollouts.
  teacher: Test execution and original repository behavior.
  generator: LLM-based component reimplementation, bug synthesis, and repair trajectory rollout.
  filtering_rule: Discard variants that compile and pass all tests or fail to compile; retain fixes that pass associated tests.
  sampling_protocol: One deterministic and two stochastic repair rounds in the reported trajectory collection.
  rollout_count: 3
  temperature: 0 then 1 for two stochastic rounds.
  inference_budget: Report agent scaffold and rollout configuration alongside any reproduction.
  optimizer_or_scaffold: MoatlessTool-style retrieval and repair rollout with test-based rejection sampling.
