one_line_summary: Z1 releases 107,173 Code Evol-Instruct-derived prompts with QwQ-32B-Preview response trajectories and pairs
  their SFT use with a token-capped Shifted Thinking Window for efficient inference.
why_it_matters: It makes the interaction between training-trace length and inference-time reasoning budget unusually concrete,
  while its absent verifier, short/long labels, generation/filtering code, license, and decontamination record define clear
  audit boundaries.
