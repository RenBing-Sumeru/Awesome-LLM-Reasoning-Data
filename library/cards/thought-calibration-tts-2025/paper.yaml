one_line_summary: Thought calibration uses lightweight hidden-state probes and risk control to stop a reasoning trace once
  further thought is unlikely to add useful work.
why_it_matters: It treats “when to stop thinking” as a measurable and calibrated test-time budget decision rather than a fixed
  length heuristic.
