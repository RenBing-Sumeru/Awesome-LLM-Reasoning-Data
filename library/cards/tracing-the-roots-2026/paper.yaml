one_line_summary: Reconstructs a 430-node, 971-edge post-training dataset lineage graph and uses 31 upstream QA sources plus
  exact/MinHash deduplication to report a 570K diversity-oriented corpus that is not included in the verified release.
why_it_matters: For the construction/open-release track, it turns upstream ancestry into a selection and audit layer, while
  showing why dataset-level edges, record-level provenance, benchmark overlap, and release licensing must be checked separately.
