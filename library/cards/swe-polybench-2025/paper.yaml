one_line: SWE-PolyBench releases 2,110 four-language repository repair tasks with base commits, patches, containers, and F2P/P2P
  tests, but not standardized agent trajectories.
one_line_summary: SWE-PolyBench expands executable repository repair beyond Python with 2,110 tasks and a binary F2P/P2P verifier,
  while release drift and absent agent trajectories limit replay auditability.
why_it_matters: It provides a concrete multi-language environment and terminal predicate for evaluating coding agents, while
  separating final-patch verification from the still-missing state/action/observation history needed for trajectory training.
