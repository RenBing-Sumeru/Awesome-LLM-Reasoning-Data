one_line_summary: SCoRe trains on the learner's own two-turn correction episodes, using a KL-constrained initialization followed
  by progress-shaped multi-turn RL with programmatic outcome rewards.
why_it_matters: It makes the collection-policy mismatch and correction-collapse problems explicit and gives this track a concrete
  schema for on-policy attempts, per-turn rewards, and sequential test-time traces.
