one_line_summary: VisualWebInstruct turns image-guided web search into 906,160 multimodal and text QA demonstrations through
  extraction, consistency filtering, and source-answer alignment.
why_it_matters: It provides a concrete large-scale recipe for obtaining visual reasoning supervision beyond narrow synthetic
  diagrams or small academic datasets.
