status: partial
one_line_summary: e3 releases staged math prompt/ground-truth data, code, and a Qwen3-1.7B checkpoint for an 8k-to-16k GRPO
  curriculum, but not the grouped on-policy rollouts or per-trace advantages used during training.
why_it_matters: For rollout and test-time trace data, e3 makes group composition, failed-response gradients, task difficulty,
  and token budget part of the training-data contract; without the grouped traces, its central feedback mechanism cannot be
  fully replayed or audited.
