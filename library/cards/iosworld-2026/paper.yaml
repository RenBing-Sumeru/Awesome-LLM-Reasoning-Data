one_line_summary: iOSWorld releases 26 connected SwiftUI apps and 133 rubric-scored tasks with reproducible reset/trajectory
  tooling, but its GPT-5.4 Mini feedback is judgment-based and only 16 curated runs, not the full success/failure corpus,
  are public.
why_it_matters: It turns a persistent fictional phone identity into an executable environment/data contract linking task,
  seeded state, screenshot or XML observation, GUI/MCP action, final answer, rubric labels, and pass/fail, while making simulator
  versioning, judge calibration, confirmation safety, split policy, and raw failure retention first-class audit concerns.
