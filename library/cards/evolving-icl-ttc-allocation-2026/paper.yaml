  environment_or_substrate: Round-based test-set-level adaptive inference loop with evolving in-context prompts.
  verifier_or_reward: Ground-truth correctness in the main coverage setting; reward-model, noisy-reward, and self-consistency
    variants are also evaluated.
  terminal_predicate: A correct response eliminates a question from the active set, or the prescribed generation rounds are
    exhausted.
recipe_metadata:
  base_model: Gemini-2.5-flash-lite with and without thinking, GPT-4.1 Mini, and GPT-5 Nano.
  teacher: Previously solved test questions used as retrieved in-context demonstrations.
  generator: The evaluated language model conditioned on zero-shot or evolving neighbor demonstrations.
  filtering_rule: Remove a question once its response meets the verifier threshold; concentrate later rounds on unresolved
    questions.
  sampling_protocol: One warm-up round samples every question, then unresolved questions receive further K-sized batches conditioned
    on up to three semantically closest solved neighbors.
  rollout_count: Four rounds by default; warm-up has one round; neighbor count is three.
  temperature: See paper appendix for model-specific API settings.
  inference_budget: Total generated samples and output tokens over all active questions.
  optimizer_or_scaffold: Self-Evolving Test-Time Allocation with similarity-based in-context demonstration retrieval.
