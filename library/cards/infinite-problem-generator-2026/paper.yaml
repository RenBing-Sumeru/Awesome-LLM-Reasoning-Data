one_line_summary: Infinite Problem Generator expands textbook physics seeds into 1,335 problem-code records whose predefined
  formulas and executed numeric solutions make generation verifiable.
why_it_matters: It provides an operational recipe and record schema for generating physics data with stronger checks than
  answer-only teacher generation.
