data_object:
  prompt_source: 165 expert-written question-solution pairs from undergraduate classical-mechanics chapters.
  trace_author: Gemini 2.5 Flash generates scenarios and executable solutions under a fixed formula library.
  answer_format: A physics word problem paired with formula IDs, variables, executable Python solution code, and a numeric
    result.
  process_fields:
  - seed question and solution
  - executable formula IDs and target variable
  - narrative problem and constrained variables
  - Python solve function and numeric result
  - execution and physical-sanity status
  environment_or_substrate: A sandboxed Python runtime with predefined domain-validated physics axioms.
  verifier_or_reward: Syntax, finite numeric output, range checks, signature uniqueness, and an independent Gemini 3 audit.
  terminal_predicate: Accept only executable, finite, physically sane records with a non-duplicate formula/target signature.
recipe_metadata:
  base_model: Gemini 2.5 Flash.
  teacher: Gemini 2.5 Pro digitizes formulas; Gemini 3 performs the independent semantic audit.
  generator: Expand each seed into scenario variants constrained to three to five executable physics axioms.
  filtering_rule: Reject runtime failures, non-finite outputs, physical-range failures, signature collisions, and records
    with fewer than two deductive steps in the final corpus.
  sampling_protocol: Target ten variants per seed through round-robin scenarios; retries use execution errors as feedback.
  rollout_count: null
  temperature: null
  inference_budget: Reported generation cost is 22-122 LLM calls per accepted problem.
  optimizer_or_scaffold: Generate-then-verify agent workflow; no controlled SFT experiment is reported.
audit:
  source_mixture: Classical mechanics Chapters 3-10 from Concepts of Physics plus a digitized formula compilation.
  split: 1,415 candidates are reported, with 80 shallow records pruned to a final 1,335-record corpus.
  decontamination: The paper does not report benchmark decontamination; the corpus originates from textbook seeds.
  license: Code repository states MIT; the dataset release license was not independently confirmed.
  lineage: Seed expansion is bounded by textbook questions and the predefined Formula-as-Code library.
  known_failure_modes:
  - Numerical execution does not guarantee physical semantics or conservation-law consistency.
  - Four-to-six-formula records show roughly 4-15% text/code or signature issues in the paper's audit.
  citation_status: verified
  confidence: high
  notes: arXiv PDF, official GitHub README, Hugging Face dataset link, and evaluation report link checked on 2026-07-13. The
    paper lists BITS Pilani, Pilani Campus; no peer-reviewed acceptance was found.
inclusion_reason: Releases physics problem records whose formula structure and executable solution make answer verification
  and failure auditing explicit.
