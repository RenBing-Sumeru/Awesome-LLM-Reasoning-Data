one_line_summary: AgentProcessBench supplies 1,000 tool-agent trajectories with 8,509 human ternary step labels for evaluating
  local process quality and first-error localization.
why_it_matters: It moves process supervision from closed-world reasoning to tool trajectories where a bad action can have
  irreversible effects.
