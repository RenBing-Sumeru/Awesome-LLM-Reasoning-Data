data_object:
  prompt_source: Agent trajectories sampled from HotpotQA, GAIA, BFCL, and tau2.
  trace_author: Five source models generate tool-use trajectories; human experts label their steps.
  answer_format: Multi-turn messages, tool definitions, tool-use traces, reference outputs, and ternary process labels.
