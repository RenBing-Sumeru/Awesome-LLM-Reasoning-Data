recipe_metadata:
  base_model: Five source models generate the released trajectories; evaluate other models with the official scripts.
  teacher: Human expert annotators using the authors' annotation platform.
  generator: Tool-using agents operating on four representative benchmarks.
  filtering_rule: A ternary scheme preserves exploration states and an error-propagation rule reduces labeling ambiguity.
  sampling_protocol: 1,000 trajectories, 250 per benchmark subset, in the released benchmark data.
  inference_budget: Model API settings and concurrency are configured by the official evaluation scripts.
  optimizer_or_scaffold: Step-level and first-error evaluation.
