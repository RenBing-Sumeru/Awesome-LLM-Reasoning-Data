one_line_summary: Alternates RM-ranked on-policy DPO with mixed reward-model self-training, using filtered updated-versus-previous
  policy pairs to refresh the RM without new human labels.
why_it_matters: Treats preference records, checkpoint selection, and reward-model refresh as one evolving construction pipeline
  while exposing a circular-label risk that static preference datasets hide.
