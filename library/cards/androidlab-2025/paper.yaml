data_object:
  object_type: 'A released Android state-action SFT subset paired with a live AVD benchmark: the training object is derived
    from manually executed traces, while the evaluation object is a task plus replayable initial phone state, interaction
    history, observations, actions, and a task-specific terminal judgment.'
  prompt_source: Academic datasets (the paper cites Android in the Wild and SNIPS) and manually written instructions seed
    task generation; undisclosed language models expand the seeds and humans review feasibility, realism, and executability.
    Source proportions, exact prompts, model snapshots, and record-level source tags are unknown.
  trace_author: Human annotators execute tasks on Android phones and record each step. A reward model and second annotator
    cross-verify traces. LLM/VLM self-exploration produced candidate traces but its operation data was explicitly removed
    from instruction fine-tuning.
  answer_format: The official release is described as LlamaFactory-format data with 6,208 XML-mode steps and 6,053 SoM-mode
    steps. Paper prompts show a task/system instruction followed by repeated XML or marked-screenshot observations and assistant
    analysis plus one function-call action. The archive could not be record-level inspected, so exact field names, image packing,
    episode IDs, and provenance columns are unknown.
  process_fields:
  - trace_id
  - step_index
  - task_instruction
  - system_prompt
  - interaction_history
  - screenshot_or_image_reference
  - page_xml_or_accessibility_xml
  - compressed_xml_or_set_of_marks_observation
  - current_activity
  - viewport
  - analysis_or_reasoning
  - parsed_action
  - action_arguments
  - finish_message_or_query_answer
  - cross_verification_status
  - terminal_result
  observation: XML mode exposes current compressed Android UI XML plus task and history. SoM mode exposes a screenshot with
    numbered selectable elements plus task and history. Annotation captures screenshots and XML before each action; special
    pages that could not be converted to SoM account for 155 fewer SoM than XML steps.
  action_space:
  - Tap
  - Type
  - Swipe
  - Long Press
  - Home
  - Back
  - Enter
  - Wait
  - Finish
  environment_or_substrate: AndroidLab uses pre-packaged Android Virtual Device state with fixed screen size, Android/API
    version, apps, and usage history. The current official configs target Pixel 7 Pro / Android API 33 and support a macOS
    arm64 AVD or Linux x86_64 Docker path. Human data collection instead uses annotators' physical Android phones, whose versions
    are not pinned.
  verifier_or_reward: Mixed contract. Operation tasks use hand-coded UI-tree and, for some tasks, device/ADB-state predicates
    for subgoals and completion. Query tasks compare a Finish answer with a standard answer using GPT-4o-2024-05-13 or GLM-4.
    Data collection uses a second annotator and a trajectory-level reward model trained on about 500 positive and negative
    traces; the paper reports over 98% completion-classification accuracy but releases neither its checkpoint nor test protocol.
  terminal_predicate: 'Agent-selected Finish or the 25-step cap stops generation, but benchmark success is separate: all operation
    subgoal predicates must be true, or an LLM judge must accept the query answer. Post-hoc code retains the last state whose
    `judge_page` is true. For SFT traces, successful completion is human/reward-model cross-verified, but serialized terminal
    labels in the public archive are unverified.'
  provenance: Academic/manual seed -> LM task expansion -> human feasibility review -> physical-phone execution with screenshot/XML
    capture -> reward-model and second-annotator cross-verification -> select 726 traces/6,208 XML steps from the nine benchmark
    apps -> derive 6,053 SoM steps -> LlamaFactory/Swift SFT. Record-level source, reviewer, rejection, and archive-version
    provenance are unknown.
recipe_metadata:
  base_model: Fine-tuned families are Llama-3.1-8B, GLM-4-9B, Qwen2-7B, Llama-3.2-11B-Vision, Qwen2-VL-7B, and CogVLM2 (cogvlm2-llama3-chat-19B).
    The paper uses base variants where available except Qwen2-VL-7B-Instruct; exact checkpoint revisions are unknown.
  teacher: Human annotators provide executed target actions. Undisclosed LLMs expand instructions; LLM/VLM explorers and a
    learned reward model assist collection, but self-exploration actions are excluded from the SFT set. No single model teacher
    supplies the released action targets.
  generator: Human Android execution recorded through an ADB/accessibility annotation tool, after mixed manual and LM-assisted
    task generation. The benchmark runner separately generates evaluation episodes from a tested model interacting with a
    fresh AVD/container.
  prompt_task_source: Hand-written instructions plus academic datasets with asserted available licenses, including Android
    in the Wild and SNIPS; exact dataset versions, task IDs, source weights, LM-expansion prompts, and accepted/rejected counts
    are unknown.
  sampling_protocol: Autonomous and manual processes produced 10.5K traces and 94.3K steps. Only 726 traces and 6,208 XML
    steps from apps included in the AndroidLab benchmark were used for training; 6,053 SoM steps remain after conversion.
    The selection rule beyond app membership and cross-verification is undisclosed.
  rollout_count: 10.5K total collection traces are reported, but counts by task, app, generator, success/failure, retry, annotator,
    and selection stage are unknown. The public SFT subset contains 726 traces.
  temperature: unknown
  inference_budget: Evaluation uses greedy decoding, at most 25 steps per task, a 3-second device response interval, and model-specific
    maximum generation settings such as 512 tokens in example configs. Data-generation decoding, retry, and token budgets
    are unknown.
  search_or_scaffold: Task expansion, LLM/VLM self-exploration, human execution, cross-verification, XML/SoM conversion, LlamaFactory
    or Swift SFT, and an AndroidLab runner that starts each formal evaluation inside the specified app.
  filtering_rule: Humans reject infeasible tasks, may skip sensitive tasks/screens/apps, and cross-verify executed traces
    with a reward model and second annotator. Self-exploration operation data is removed from SFT, sensitive content is masked
    or withheld, and special pages that fail SoM conversion are dropped. Thresholds, disagreement resolution, and rejected
    counts are unknown.
  selection_threshold: unknown
  optimizer_or_scaffold: Camera-ready paper reports batch size 32, maximum sequence length 4,096, learning rate 1e-5, and
    five epochs. Repository documentation reports LlamaFactory for four model families, Swift for CogVLM/Llama-3.2-Vision,
    learning rate 1e-5, and three epochs. This official-source 3-versus-5-epoch conflict blocks exact reproduction; optimizer,
    scheduler, seeds, hardware allocation, and checkpoint selection are unknown.
audit:
  source_mixture: Manual and academic task seeds expanded by undisclosed LMs, then physical-phone human demonstrations across
    apps that include the same nine apps as the benchmark. Exact source/app/language/persona proportions and record-level
    lineage are unknown.
  split: unknown
  decontamination: unknown
  benchmark_overlap: The paper explicitly selects all 726 SFT traces from apps included in AndroidLab. App-level train/evaluation
    overlap is therefore certain; no item-, instruction-, template-, or state-level overlap audit or held-out split is disclosed.
  license: 'Official code is MIT. Dataset license is unknown: the Google Drive archive has no verified data card or dataset-
    specific terms, and the code license does not establish rights for academic source tasks, annotations, screenshots/XML,
    model outputs, third-party apps/APKs, UI content, or preloaded records. ACL paper is CC BY 4.0.'
  lineage: Seed task -> LM expansion -> human feasibility check -> physical-phone state-action trace -> reward-model and second-
    annotator review -> nine-app 726-trace subset -> XML/SoM SFT examples -> six fine-tuned models -> AndroidLab evaluation.
    Self-exploration candidates, failures, rejected tasks, and reviewer decisions lack record-level public lineage.
  release_version: Canonical publication is ACL 2025 camera-ready. arXiv stops at v2 (2024-11-04) and contains wording/count
    presentation that should not override the camera-ready. Official GitHub main was checked at `4bfe108cf3883b710e8e5c6fba288161c830e504`
    (2025-08-18), with no tag/release. Google Drive data/AVD/Docker artifacts have no verified version, checksum, or common
    manifest.
  successful_and_failed_sample_retention: About 500 positive and negative trajectories train the completion reward model,
    while self-exploration operation data is removed and cross-verified human traces feed SFT. Public release of reward-model
    examples, failed/infeasible/skipped tasks, abandoned traces, privacy-filtered records, rejected expansions, and selection
    logs is unknown.
  privacy_or_consent: Authors report advance notice of fine-tuning/open-release use, opt-out and task/screen/app skipping,
    local-first storage, review before upload, masking/replacement of usernames and chat logs, formal contracts, and compensation.
    Consent text, compensation amounts, redaction logs, retention/deletion rules, app-content rights, and independent privacy
    audit are not released.
  replay: Formal runs create a fresh cloned AVD or Docker container per task, fix geolocation, set date except for Maps.me,
    launch directly into the specified app, and stop/delete the instance after the episode. Replay remains partial because
    image digests, complete APK/app versions, Android Studio/emulator versions, base-state hashes, random seeds, and evaluator
    API snapshots are not pinned; macOS docs warn that recent Android Studio updates may break setup.
  secret_risk: The official repository's `generate_result.py` contains a hard-coded default API-key-like value. The value
    is not reproduced here; it should be removed from code/history and rotated or revoked before reuse.
  experimental_evidence:
    benchmark_scale: '138 tasks across nine apps: 93 operation and 45 query tasks.'
    sft_subset: 726 traces; 6,208 XML steps; 6,053 SoM steps in the official data guide.
    broader_collection: 10.5K traces and 94.3K steps across autonomous and manual processes, not all used for SFT.
    average_success_rate: LLMs 4.59% -> 21.50%; VLMs 1.93% -> 13.28%.
    model_success_rates: Llama-3.1-8B 2.17->23.91, Qwen2-7B 4.35->19.57, GLM-4-9B 7.25->21.01, CogVLM2 0.72->11.59, Llama-3.2-11B-Vision
      1.45->10.14, Qwen2-VL-7B 3.62->18.12.
    reward_model: About 500 positive/negative trajectories; author-reported completion-classification accuracy above 98%.
  verifier_or_judge_failure_modes:
  - Hand-coded UI-tree predicates are brittle to XML omissions, app/version drift, localization, alternate valid states, and
    dynamic UI content.
  - Query success depends on GPT-4o-2024-05-13 or GLM-4 wording judgment and an unversioned prompt/API path, allowing false
    positives, false negatives, and future drift.
  - Agent Finish and task success are distinct; a model can stop without satisfying the evaluator, while a post-hoc last matching
    page can score an earlier transient state.
  - ROR treats screen change as reasonableness, so semantically harmful or irrelevant actions can be counted as reasonable.
  - The reward model's reported >98% accuracy lacks a disclosed split, class balance, calibration, error analysis, or public
    checkpoint.
  - Starting every formal task inside the target app removes app-launch difficulty and narrows end-to-end comparability.
  - Screen-size experiments show geometry sensitivity, so results cannot be transferred across devices without controlling
    viewport and UI layout.
  - Fixed 3-second waits can be too short or wasteful across devices, and the paper identifies this as a limitation.
  - Only a selected human-trace subset is visible; absent failures and rejected examples prevent audit of selection bias and
    recovery behavior.
  - The official paper and training guide conflict on five versus three epochs.
  - The Google Drive data and environment bundles are mutable and lack verified hashes/tags; macOS setup is already documented
    as unstable after Android Studio updates.
  citation_status: verified
  confidence: medium
  notes: ACL camera-ready including appendices, ACL/arXiv identity, official repository at a pinned commit, task/evaluator/logging
    code, setup/configuration docs, Google Drive links, and licenses were checked. The official dataset archive and large
    AVD/Docker bundles could not be downloaded in this environment; no experiment was replayed. `artifact_verified` below
    means official links/code were inspected, not that the SFT corpus or environment is immutably reproducible.
