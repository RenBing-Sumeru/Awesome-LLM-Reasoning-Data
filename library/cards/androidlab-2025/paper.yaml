inclusion_reason: AndroidLab joins an Android environment, a released state-action SFT subset, executable task-specific subgoal
  predicates, query judgments, and a documented collection pipeline. It is a core environment/trajectory-data entry because
  it makes observation modality, action schema, reset behavior, terminal feedback, selected-trace supervision, and release
  risks jointly auditable.
