one_line_summary: AndroidLab releases a 726-trajectory Android SFT subset and a 138-task AVD benchmark with UI/device-state
  and LLM-judged terminal feedback, while splits, failed traces, data rights, and immutable replay remain unresolved.
why_it_matters: It exposes how a mobile agent's training record connects task, XML or screenshot state, action, history, and
  completion feedback; it also shows why app/version pinning, alternate-valid-path verification, failure retention, train/eval
  overlap, and dataset licensing determine whether such trajectories can be safely reused.
