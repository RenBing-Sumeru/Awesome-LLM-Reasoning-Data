one_line_summary: A NeurIPS 2025 Best-of-N selector that scores each sampled response from its full token distributions and
  optionally combines confidence rank with answer frequency through Borda voting.
why_it_matters: For rollout/search/test-time trace curation, it specifies the candidates, token-distribution scores, ranks,
  extraction states, votes, and selected output, while exposing the gap between intrinsic confidence and verified correctness.
