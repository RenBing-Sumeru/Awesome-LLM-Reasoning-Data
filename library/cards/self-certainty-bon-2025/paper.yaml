data_object:
  prompt_source: LiveBench-Math, GSM8K validation, MATH test, CRUXEval-O, and LiveCodeBench; MATH Level 3 is also used for
    the DeepSeek-R1-Distill-Llama-8B trial.
  trace_author: Llama-3.1-8B-Instruct generates the main candidate sets; DeepSeek-R1-Distill-Llama-8B and Qwen-2.5-Coder-32B-Instruct
    provide additional generalization candidates.
  answer_format: Prompt, N candidate responses, full next-token probability distributions, one self-certainty scalar and rank
    per response, extracted answer when applicable, optional Borda vote, and selected response or answer.
  process_fields:
  - prompt
  - candidate_response
  - generator_model
  - token_probability_distribution
  - sampled_token_probability
  - response_length
  - self_certainty_score
  - confidence_rank
  - extracted_answer
  - extraction_validity
  - borda_exponent
  - borda_vote
  - answer_vote_total
  - selected_candidate
  - final_answer
  environment_or_substrate: Inference-time Best-of-N selection integrated as an extension to ZeroEval; LiveCodeBench code
    outputs are parsed into its expected format, but selection does not execute candidates.
  verifier_or_reward: Self-certainty is the response-average KL divergence KL(U||p) from a uniform distribution over the full
    vocabulary, computed from each next-token distribution. Pure Best-of-N selects the highest score; fixed-answer Borda voting
    assigns rank weight (N-r+1)^p and sums votes by extracted answer.
  terminal_predicate: For open-ended selection, return the highest-self-certainty candidate. For fixed-answer tasks, optionally
    return the answer with the largest Borda vote total; candidates without an extractable answer receive negative-infinity
    confidence in the released selector.
recipe_metadata:
  base_model: Llama-3.1-8B-Instruct is the main generator; DeepSeek-R1-Distill-Llama-8B and Qwen-2.5-Coder-32B-Instruct are
    additional evaluated generators.
  teacher: No teacher or auxiliary reward model is used by self-certainty selection.
  generator: Sample N responses, retain each full vocabulary distribution at every generated token, average tokenwise KL(U||p)
    into a response score, then select by score or combine confidence rank with answer frequency through Borda voting.
  filtering_rule: Responses without extractable fixed answers are masked for selection and assigned negative-infinity confidence
    by the released code. Borda voting groups valid responses by extracted answer; p controls confidence-rank influence.
  sampling_protocol: Generate 64 Llama-3.1-8B-Instruct responses per prompt at temperature 0.6 and top-p 0.9; form N=4, 8,
    16, 32, and 64 subsets from identical samples and average main results across five repetitions. The DeepSeek-R1-Distill-Llama-8B
    MATH Level 3 experiment is one trial.
  rollout_count: 64 candidates per prompt for main experiments, evaluated as Best-of-N subsets of 4, 8, 16, 32, and 64.
  temperature: 0.6 with top-p 0.9 for main candidate generation.
  inference_budget: N=4-64 candidate responses per prompt; full vocabulary probabilities are required for every generated
    token. Exact maximum generation lengths and complete runtime manifests are not disclosed in the paper.
  optimizer_or_scaffold: Inference-only scoring and selection using ZeroEval extensions; no fine-tuning or learned reward
    model is required.
audit:
  source_mixture: Named evaluation benchmarks only; no paper-specific candidate, token-distribution, score, or selection-log
    dataset was released.
  split: GSM8K validation, MATH test, MATH Level 3 test, CRUXEval-O, LiveBench-Math, and LiveCodeBench are named. Exact item
    revisions and candidate manifests are not released.
  decontamination: LiveBench-Math was released after Llama-3.1-8B-Instruct deployment and is used as a contamination-mitigation
    surface; contamination evidence for the remaining benchmarks and models is unknown.
  license: unknown
  lineage: Benchmark prompt -> 64 sampled responses and token distributions -> self-certainty per response -> rank -> either
    top-score selection or extracted-answer Borda aggregation -> selected response/answer. Raw candidates, logits, and scores
    are not released.
  known_failure_modes:
  - A single artificially high-confidence wrong response can win pure self-certainty selection; the paper gives an example
    where the highest score selects 12.5 instead of the correct answer 64.
  - On fixed-answer mathematics, pure self-certainty can underperform self-consistency; Borda gains depend on answer extraction
    and frequency.
  - The Borda exponent p is model-, task-, and N-dependent and is recommended to be tuned on task-specific validation queries,
    creating a tuning and leakage audit requirement.
  - Full vocabulary probabilities are required for every token, limiting applicability to closed APIs and increasing logit
    storage or recomputation cost.
  - Averaging token scores can obscure localized errors, and the uniform reference distribution is a design choice; an empirical
    reference showed distribution-shift degradation on GSM8K.
  - Some USC results are omitted because over 20 percent of examples exceed the context limit under the study settings.
  - The author repository publishes selector code but no release package, raw candidate traces, logits, score manifests, pinned
    environment, or repository license.
  citation_status: verified
  confidence: high
  notes: Official NeurIPS proceedings, arXiv v3, OpenReview record, and author repository checked. Repository dependency licenses
    do not establish a license for this repository or generated records.
inclusion_reason: The paper turns full token probability distributions into deterministic response-level selector scores and
  combines score ranks with answer-frequency votes, making a concrete Best-of-N feedback and trace schema.
