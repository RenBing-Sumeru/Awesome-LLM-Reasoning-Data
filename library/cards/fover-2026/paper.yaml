status: partial
one_line_summary: FOVER-40K pairs formal reasoning traces with Boolean step labels produced by Z3 and Isabelle, then trains
  Llama- and Qwen-based PRMs for process-level verification and Best-of-K selection.
why_it_matters: It demonstrates a low-LLM-call route to process supervision while making formalization fidelity, prover wrappers,
  step-dependency assumptions, dataset versioning and informal-domain transfer explicit audit boundaries.
