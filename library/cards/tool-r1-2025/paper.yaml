one_line: Tool-R1 trains full Python tool-use episodes with a judge-plus-execution reward and a reusable per-question queue,
  but its official repository still contains no implementation or training artifacts.
one_line_summary: Tool-R1 uses response-masked GRPO to train Thought-Code-Observation trajectories from mixed answer-judge
  and code rewards while a dynamic queue reuses recent episodes; the code, data, checkpoints, and replay records remain unreleased.
why_it_matters: It makes sample-efficient online trajectory reuse and mixed feedback concrete for agent RL, while demonstrating
  why an official repository URL must be audited separately from actual code/data availability.
