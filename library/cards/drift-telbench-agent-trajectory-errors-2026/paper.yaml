one_line_summary: TELBench labels harmful spans in deep-research trajectories, while DRIFT traces unsupported claims to localize
  where an agent first goes wrong.
why_it_matters: It turns opaque final-answer failures into localized, evidence-linked process errors that can supervise trajectory
  auditing.
