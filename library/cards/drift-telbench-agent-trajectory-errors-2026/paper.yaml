  rollout_count: null
  temperature: null
audit:
  source_mixture: 2,790 real agent trajectories from two frameworks, three backbone models, and three benchmarks.
  split: TELBench contains 1,000 expert-verified instances, with 600 easy and 400 hard instances.
  decontamination: The benchmark preserves normal exploration and harmless noise alongside harmful errors to prevent label
    shortcuts.
  license: Consult the official Hugging Face dataset card.
  lineage: arXiv paper, NJU-LINK DRIFT project page, and official TELBench dataset release.
  known_failure_modes:
  - Span labels can depend on evidence interpretation
  - First-error localization is harder than detecting any error
  - Coverage is limited to the included tasks and agent frameworks
