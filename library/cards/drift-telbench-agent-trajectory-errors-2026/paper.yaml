recipe_metadata:
  base_model: Three backbone models across two agent frameworks; see the paper for the model list.
  teacher: LLM-assisted expert review.
  generator: Collected deep-research agent trajectories segmented into semantic spans.
  filtering_rule: Retain trajectories and spans with verified harmful-error labels.
  sampling_protocol: Evaluate span-level error localization and first-error prediction over TELBench.
