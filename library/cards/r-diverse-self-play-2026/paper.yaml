data_object:
  prompt_source: Self-generated competition-mathematics questions. The Challenger prompt is disclosed, but no seed training
    corpus or fixed prompt pool is reported.
  trace_author: Qwen3 Challenger and Solver roles co-evolve. Qwen2.5-Coder-7B and Jina-Code-Embeddings-1.5B create the skill-similarity
    representation.
  answer_format: A generated question, multiple Solver reasoning responses and extracted final answers, answer-equivalence
    groups, consistency, a majority pseudo-label, canonical Python solver code, its embedding, historical similarities, memory
    membership, and replay provenance.
  process_fields:
  - iteration
  - question
  - solver_responses
  - extracted_answers
  - answer_groups
  - consistency
  - pseudo_label
  - canonical_code
  - embedding
  - max_historical_similarity
  - mean_historical_similarity
  - memory_membership
  - replay_membership
  environment_or_substrate: EasyR1 implementation of an R-Zero-style alternating Challenger-Solver GRPO loop with persistent
    cross-iteration memory.
  verifier_or_reward: Challenger reward combines Solver uncertainty with within-iteration and history-aware skill-similarity
    penalties. Solver reward is a binary match to a self-generated majority pseudo-label. GPT-4o is used for paper analyses
    and a disclosed answer-check prompt, but its exact training-time coverage is unknown.
  terminal_predicate: The reported study stops after five evolution iterations. Each rollout receives its scalar reward within
    the current optimization phase; valid questions may enter persistent memory, and 30 percent historical replay is mixed
    into Solver training. A natural convergence or memory termination rule is not disclosed.
recipe_metadata:
  base_model: Qwen3-4B-Base and Qwen3-8B-Base
  teacher: No external answer teacher is reported for the primary training loop; the previous Solver supplies majority pseudo-labels.
    GPT-4o supplies analysis labels and judge-based checks.
  generator: A competition-mathematics Challenger alternates with a Solver for five evolution iterations, with 5 Challenger
    and 15 Solver optimization steps per iteration.
  filtering_rule: Questions that satisfy the uncertainty criterion may enter memory; the paper illustrates the valid range
    as consistency 0.3 to 0.8. Exact answer normalization, equivalence grouping, tie handling, and malformed-output policy
    are unknown.
  sampling_protocol: Challenger training uses 4 rollouts and Solver training uses 5, both at temperature 1.0 and top-p 0.99.
    Canonical code generation uses temperature 0.
  rollout_count: 'Challenger: 4; Solver: 5 per question'
  temperature: 1.0
  inference_budget: Eight NVIDIA H20 GPUs with BF16 and FlashAttention 2. One Qwen3-4B evolution iteration is reported at
    about 6 hours; total token use, total run cost, and 8B timing are unknown.
  optimizer_or_scaffold: GRPO with global batch size 128, learning rate 1e-6, weight decay 1e-2, KL coefficient 1e-2, MAP
    weights alpha=1 and beta=1, max-mean mixing gamma=0.5, similarity thresholds 0.5 and 0.25, and replay ratio 0.3.
audit:
  source_mixture: Current self-generated competition-math questions plus historical replay. The paper does not publish per-iteration
    record counts or memory snapshots.
  split: Five evolution iterations with 30 percent historical replay. Unique counts, seeds, rejected-record counts, and train-evaluation
    overlap are unknown.
  decontamination: unknown
  license: The arXiv record uses the arXiv non-exclusive distribution license. Code, data, model, generated-record, and repository
    licensing are unknown because the official project repository has no LICENSE file.
  lineage: Challenger question -> Solver rollouts -> extracted answer groups -> consistency and majority pseudo-label -> canonical
    code and embedding -> novelty penalties and memory decision -> current or replay Solver update. No public record-level
    ledger, generated records, memory snapshots, or checkpoints instantiate this lineage.
  known_failure_modes:
  - Majority pseudo-labels can be confidently wrong, and replay can preserve those errors.
  - The SAM canonicalizer may change the intended task because its prompt tells the model to repair ambiguous or flawed inputs.
  - Generated canonical code is not reported as being executed; code-embedding similarity is an uncalibrated proxy for reasoning-skill
    equivalence.
  - Answer normalization, equivalence grouping, memory correction and eviction, contamination controls, random seeds, and
    repeated-run variance are undisclosed.
  - The official repository contains a README and figures but no executable pipeline, weights, generated records, or tagged
    release.
  citation_status: verified
  confidence: medium
  notes: ICML 2026 acceptance, arXiv paper, official BibTeX, and author repository are verified. Implementation and data artifacts
    remain unavailable.
inclusion_reason: Makes persistent memory and a program-level similarity proxy explicit controls in self-play reasoning-data
  construction while exposing pseudo-label and release risks.
