one_line_summary: Adds skill-aware historical diversity penalties and replay to Challenger-Solver self-play, but releases
  no executable pipeline or generated records.
why_it_matters: Shows how within-batch lexical novelty can hide repeated reasoning procedures and how persistent memory changes
  both the generated curriculum and its audit surface.
