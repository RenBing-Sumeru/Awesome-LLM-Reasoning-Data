one_line_summary: Grok 4's model card and release announcement disclose broad pretraining sources, de-duplication/classification,
  SFT/RL with human feedback, verifiable rewards and model grading, and tool-use RL, but not record-level data, reward, filter,
  or evaluator contracts.
why_it_matters: It makes a closed frontier model's post-training and safety pipeline partly legible while preserving the distinction
  between high-level disclosure and missing provenance, data rights, verifier/reward specifics, evaluation controls, and reproducibility
  evidence.
