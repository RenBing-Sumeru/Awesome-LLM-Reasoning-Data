one_line_summary: Open-Reasoner-Zero starts PPO directly from Qwen2.5 Base, samples 64 responses per prompt, scores boxed
  mathematical answers programmatically, and trains a token-value critic, while releasing prompts, code, and weights but withholding
  exact run trajectories, failures, and immutable manifests.
why_it_matters: 'It makes large-scale critic-based Reasoner-Zero training unusually concrete and accessible, yet shows why
  an open recipe is not a fully auditable data release: source rights, duplication, benchmark overlap, annealing/mixed-domain
  configs, compute, and exact rollout lineage remain unresolved.'
