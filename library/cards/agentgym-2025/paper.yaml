data_object:
  prompt_source: 20,494 gathered, rule-generated, or model-generated instructions across 14 interactive environments and 89
    task types.
  trace_author: Rule solvers and human traces provide some actions; GPT-4-Turbo adds thoughts or explores, with crowdsourcing
    for selected environments.
  answer_format: ReAct-style episodes containing task instruction, thought, environment action, observation, and terminal
    reward.
  process_fields:
  - environment
  - instruction
  - thought
  - action
  - observation
  - reward
  environment_or_substrate: Fourteen separately deployed environments behind standardized create, reset, observation, available-action,
    and step interfaces.
  verifier_or_reward: Environment-specific success rates or numeric rewards filter completed trajectories.
  terminal_predicate: Retain trajectories that pass reward and correctness filtering; the public AgentTraj-L set represents
    the larger high-quality SFT pool.
recipe_metadata:
  base_model: Llama-2-Chat 7B for the main trajectory SFT comparison
  teacher: GPT-4-Turbo, rule solvers, existing human traces, and crowdsourced annotators
  generator: Gather-and-filter collection over unified live environments, with rule-based or model-based instruction expansion.
  filtering_rule: Execute trajectories and filter by task reward and correctness; manually verify model-generated instructions
    for feasibility.
  sampling_protocol: Expand from 6,130 AgentTraj demonstrations to 14,485 AgentTraj-L demonstrations across 11 trainable environments.
  rollout_count: 14485
  temperature: null
  inference_budget: The paper reports environment and training hardware details but no complete teacher-call or collection-cost
    ledger.
  optimizer_or_scaffold: Three-epoch SFT on collected trajectories; the broader paper also studies online and offline reward-based
    improvement.
audit:
  source_mixture: AgentTraj-L contains 14,485 trajectories from 11 of 14 environments; WebShop, ALFWorld, SciWorld, and BIRD
    are the largest components.
  split: AgentEval contains 1,160 evaluation instructions; train and evaluation pools are sampled or inherited per environment.
  decontamination: No unified semantic decontamination audit across all inherited and generated instructions is reported.
  license: The dataset page does not declare a dedicated data license; the associated AgentGym repository is MIT licensed
    and upstream environments retain their own terms.
  lineage: This Card covers the static high-reward AgentTraj-L demonstrations used in SFT, not online AgentSTaR rollouts as
    the primary object.
  known_failure_modes:
  - Reward functions and action semantics differ sharply across environments.
  - Successful trajectories can overrepresent easy instances and teacher-specific styles.
  - The absence of a dedicated dataset license complicates redistribution decisions.
  citation_status: verified
  confidence: high
  notes: ACL paper, repository, project, public dataset page, environment statistics, reward filtering, and SFT experiments
    were checked.
inclusion_reason: AgentTraj-L releases 14,485 reward-filtered ReAct demonstrations from 11 interactive environments for cross-environment
  agent SFT.
