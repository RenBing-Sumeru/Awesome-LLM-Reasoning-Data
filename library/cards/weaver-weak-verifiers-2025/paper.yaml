one_line_summary: Weaver converts reward-model and LM-judge outputs over repeated candidates into posterior correctness scores
  for response selection, then distills those ensemble scores into compact verifiers.
why_it_matters: It makes verifier aggregation a separate test-time scaling axis and identifies the score, threshold, prior,
  filtering, candidate-pool, and lineage records needed to audit selected reasoning traces.
