data_object:
  prompt_source: MATH500, GPQA Diamond, MMLU College, and MMLU-Pro benchmark questions; appendix experiments additionally
    cover BBH and AIMO
  trace_author: Llama 3.1 8B/70B Instruct and Llama 3.3 70B Instruct, depending on the experiment
  answer_format: query-response candidates with heterogeneous verifier scores or binary votes, posterior correctness scores,
    and a selected response
  process_fields:
  - benchmark_query
  - candidate_response
  - extracted_answer_or_correctness_label
  - per_verifier_score_or_vote
  - verifier_threshold_and_filter_state
  - estimated_verifier_tpr_tnr
  - posterior_correctness_score
  - selected_response
  environment_or_substrate: repeated-sampling inference over fixed reasoning benchmarks, followed by reward-model and LM-judge
    scoring
  verifier_or_reward: weak-supervision aggregation of reward models, process reward models, and binary LM judges
  terminal_predicate: select the candidate with the highest Weaver posterior correctness score; benchmark ground truth is
    reserved for development or evaluation
recipe_metadata:
  base_model: Llama 3.1 8B/70B Instruct and Llama 3.3 70B Instruct as candidate generators; ModernBERT-Large (396M) for the
    distilled verifier
  teacher: Weaver ensemble posterior scores provide soft supervision for verifier distillation
  generator: Llama instruction models sampled repeatedly per benchmark query
  filtering_rule: normalize reward scores by robust 5th/95th percentiles, binarize them, and remove verifiers with extreme
    positive marginals conditioned on estimated class balance
  sampling_protocol: up to 100 candidate responses per query in the main repeated-sampling comparisons
  rollout_count: 100
  temperature: unknown
  inference_budget: generation count is scaled from 1 to 100; full verifier count and total FLOPs vary by experiment
  optimizer_or_scaffold: moment matching under conditional independence with gradient optimization; Naive-Bayes-style posterior
    inference; optional difficulty clustering is an oracle exploration
audit:
  source_mixture: MATH500, GPQA Diamond, MMLU College, MMLU-Pro, with appendix analyses on BBH and AIMO
  split: about 1% labeled development data estimates class balance, thresholds, and the correctness prior; test candidates
    remain unlabeled for Weaver fitting; verifier distillation uses an 80:20 split
  decontamination: unknown
  license: code is MIT; a single license and record-level lineage for the heterogeneous released datasets, benchmark prompts,
    generations, verifier outputs, and model artifacts is unknown
  lineage: official GitHub code covers generation, selection, and distillation; the official Hugging Face collection publishes
    benchmark generations with verifier scores and distilled verifier models
  known_failure_modes:
  - correlated verifiers violate the conditional-independence model and can produce overconfident posteriors
  - threshold, marginal-filter, and class-prior choices may shift across datasets or verifier revisions
  - selection cannot recover a correct answer when no correct candidate was generated
  - Weaver pseudo-label errors can be inherited by the distilled verifier
  - oracle difficulty clustering and ground-truth-based analyses must not be presented as deployable unlabeled selection
  - benchmark overlap, record-level license lineage, and complete release-to-table provenance are not disclosed
  citation_status: verified
  confidence: high
  notes: The NeurIPS proceedings title and abstract supersede the earlier arXiv-facing title. The official NeurIPS abstract
    reports 86.2% average accuracy, whereas the accessible arXiv version reports 87.7%; card evidence keeps these version-bound
    rather than merging them.
inclusion_reason: 'The work exposes a concrete Track 5 object: repeated candidate responses, heterogeneous verifier score
  vectors, fitted weak-supervision parameters, posterior selection scores, and selected answers under a scaled test-time-compute
  budget.'
