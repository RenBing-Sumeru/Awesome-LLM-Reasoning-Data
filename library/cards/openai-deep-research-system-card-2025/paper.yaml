  grading by a chain-of-thought model and added browsing safety data, but not the datasets, trajectories, graders, reward
  design, or reproducibility artifacts.
why_it_matters: 'It is a direct Track 12 disclosure of an agentic browsing post-training interface: it identifies the high-level
  task and feedback contracts while making the missing provenance, reward, environment, and contamination evidence explicit.'
