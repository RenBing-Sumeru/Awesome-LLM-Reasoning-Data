one_line_summary: A systems evaluation of five agent workflows that reports aggregate accuracy, latency, GPU-energy, and projected
  datacenter-power trade-offs, while its complete per-request measurement records remain unreleased.
why_it_matters: For rollout and test-time trace curation, it shows that branch count, iteration depth, tool latency, hardware,
  and serving configuration are part of trace provenance; aggregate benchmark gains cannot substitute for those raw lineage
  fields.
