status: partial
one_line_summary: SCOP refreshes reasoning-critique-correction episodes from the current policy and scores critiques through
  sampled repair success, but its official repository remains an implementation-free placeholder.
why_it_matters: It makes critique-data freshness and stage-specific feedback explicit construction variables while exposing
  how teacher initialization, model-relative prompt filtering, Monte Carlo noise, and missing trajectory lineage limit reuse.
