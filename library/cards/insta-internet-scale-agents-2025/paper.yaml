status: partial
one_line_summary: InSTA combines an LLM safety and task proposer, one live Playwright exploration loop, LLM-agent rollouts,
  and LLM success judgment to construct internet-scale web-agent SFT data.
why_it_matters: It demonstrates a scalable path from ranked websites to environment-grounded agent training while making release
  completeness, learned-judge error, live-site drift, side effects, privacy defaults, source rights, and versioned count lineage
  first-class data-quality concerns.
