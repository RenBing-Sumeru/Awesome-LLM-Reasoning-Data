one_line_summary: Qwen3Guard discloses a 1.19M-scale human/synthetic safety-classification mixture, Gen SFT and Stream token-label
  construction, and a separate safety-RL use case, while withholding record provenance, full label/reward calibration, and
  reproducible training artifacts.
why_it_matters: It lets the atlas distinguish a released guard model and partly described safety-data/feedback pipeline from
  a reusable, fully audited filtering or RL-reward recipe.
