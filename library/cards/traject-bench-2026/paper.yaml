one_line: TRAJECT-Bench releases synthetic query/reference-call pairs over 1,228 RapidAPI-derived tools and scores selection,
  arguments, sequential order, and final answers, but its unpinned artifacts do not reconcile row counts or preserve immutable
  API replay.
one_line_summary: TRAJECT-Bench releases synthetic query/reference-call pairs over 1,228 RapidAPI-derived tools and scores
  selection, arguments, sequential order, and final answers, but its unpinned artifacts do not reconcile row counts or preserve
  immutable API replay.
why_it_matters: It exposes the trajectory-level feedback contract that answer-only tool benchmarks miss, while showing why
  tool schema, API state, judge version, release manifest, and upstream rights must be frozen before public agent trajectories
  can be treated as reusable post-training data.
