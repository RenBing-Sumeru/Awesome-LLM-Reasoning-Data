one_line_summary: Releases factual-reasoning SFT and DPO data while online GRPO uses a mixed retrieval-and-judge reward whose
  rollouts are not released.
why_it_matters: Makes the data and feedback boundary visible for studying how factual precision, supported detail, relevance,
  and verifier error interact in long-form reasoning post-training.
