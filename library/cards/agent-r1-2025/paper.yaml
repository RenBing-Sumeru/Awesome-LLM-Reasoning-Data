data_object:
  prompt_source: The original arXiv v1 technical report says its Multi-hop QA training set has 51,200 samples equally and
    randomly drawn from HotpotQA and 2WikiMultihopQA training splits; evaluation uses full development sets of HotpotQA/2Wiki
    and out-of-domain MuSiQue. This is a paper-reported mixture, not an Agent-R1-released immutable split, source-ID manifest
    or rights ledger.
  trace_author: Agent policy rollouts generate multi-turn natural-language reasoning and tool actions. The v1 NousToolEnv
    executes the action, returns feedback, calculates reward and packages the next state; its agent trajectory is stored/replayed
    for RL. The official sources inspected do not release the paper-run tool queries/results, traces, reward events, token
    masks or rollout-to-update mapping.
  answer_format: 'A multi-turn structured trace: observation/context, model action (natural-language answer, tool call or
    mixed reasoning/action), environment feedback, reward, next observation and termination. Agent-R1 uses action/loss masks
    to select agent-generated tokens rather than environmental content for policy updates.'
  process_fields:
  - prompt
  - observation
  - action
  - reasoning
  - tool_call
  - tool_feedback
  - environment_state
  - reward
  - termination_flag
  - next_observation
  - action_mask
  - advantage_mask
  - trajectory
  environment_or_substrate: The v1 report defines Tool as an atomic executor and ToolEnv as the RL-state/reward/next-state
    orchestrator. Its Multi-hop QA case uses NousToolEnv with one wikisearch tool over a KILT Wikipedia corpus. The maintained
    repository now exposes step-level AgentEnv/ToolEnv interfaces and names recipes for GSM8K, HotpotQA, ALFWorld, WebShop
    and Paper Search; these evolving framework interfaces are not an immutable release of the v1 environment snapshot.
  verifier_or_reward: 'For the v1 Multi-hop QA experiment, a sparse final reward combines exact-match answer correctness with
    format: r_format averages binary correct-answer-presentation and valid-tool-call-syntax indicators; when r_format=1 the
    reward is r_answer=EM(predicted,gold), otherwise reward is r_format-1. The framework can support environment-defined intermediate
    process rewards, but no canonical cross-task reward implementation, decision log or paper-run verifier snapshot was verified.'
  terminal_predicate: ToolEnv's stop method may terminate on LLM output, task completion, errors or predefined limits. In
    the v1 experiment the reported reward is final outcome feedback; exact per-record stop reasons, maximum turns and paper-run
    terminal traces are unknown.
recipe_metadata:
  base_model: 'Original arXiv v1 experiment: Qwen2.5-3B-Instruct using native function calling. The substantially revised
    arXiv v2/current repository reports Qwen3-4B experiments and a new step-level architecture; it must not be treated as
    the same immutable v1 run.'
  teacher: null
  generator: The policy model performs tool-augmented multi-turn rollouts. ToolEnv calls tools, interprets results, forms
    next state/context and produces rewards. Current repository documentation allows environment-defined context operations
    such as append, truncate, summarize, rewrite or augment, but the v1 paper does not release its run-time context snapshots.
  filtering_rule: unknown
  sampling_protocol: The v1 report states the 51,200-example 50/50 HotpotQA/2WikiMultihopQA source composition but not a complete
    reproducible sampling seed, row IDs, rollout count, query/result snapshots, batch schedule, prompt templates or retained/rejected
    trace manifest.
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: V1 evaluates PPO, GRPO, REINFORCE++, REINFORCE++Baseline and RLOO, with action/loss masks and (for
    PPO) advantage masks. Current official repository additionally lists GAE, token-GAE, GiGPO and GSPO-capable StepPO recipes;
    GSPO/StepPO are later framework capabilities and are not evidence they were used in the 2025 v1 Multi-hop QA run.
audit:
  source_mixture: Paper discloses 51,200 Multi-hop QA prompts drawn equally/randomly from named HotpotQA and 2Wiki training
    splits, plus a KILT Wikipedia corpus with 36M passages and bge-large-en-v1.5 retrieval embeddings. It does not provide
    record IDs, exact source revisions, split/download hashes, sampling seed, prompt construction, KILT passage snapshot,
    retrieved top-5 outputs, exclusions or a dataset release manifest.
  split: V1 says it evaluates HotpotQA and 2Wiki development sets and MuSiQue as out-of-domain. The public framework sources
    do not verify a paper-run train/dev map, a semantic overlap/contamination audit, preprocessed parquet files used in the
    v1 run, or immutable task-environment snapshots.
  decontamination: No dedicated semantic train/evaluation overlap, Wikipedia/KILT corpus leakage, query-result drift, benchmark
    contamination or tool-result provenance audit was verified in the official arXiv/repository artifacts inspected here.
  license: Current and legacy Agent-R1 repository code is MIT. That license does not establish rights for HotpotQA, 2WikiMultihopQA,
    MuSiQue, KILT/Wikipedia passages, bge embeddings, tool/API outputs, generated reasoning traces, environment images or
    any 2026 processed-data release.
  lineage: Paper-reported upstream QA rows -> policy multi-turn tool rollouts -> NousToolEnv/ToolEnv feedback and final reward
    -> masked advantage/policy update under a selected RL algorithm. Per-record source, retrieved documents, prompts, action
    tokens, masks, rewards, stop states, policy versions, optimizer update and checkpoint lineage are not publicly connected.
  known_failure_modes:
  - Exact-match plus format reward can reward answer formatting/tool syntax while failing to establish factual grounding,
    correct retrieval, citation support or robust multi-hop reasoning.
  - Tool/environment feedback can be stochastic or time-varying; without a versioned KILT snapshot, retrieved-document logs
    and environment states, the reported agent rollouts are not replay-auditable.
  - Action and advantage masks are central to the reported v1 optimization but paper-run token/mask records are unavailable,
    preventing an independent audit of credit assignment.
  - The current repository and arXiv v2 substantially revise the v1 title, authors, architecture, task coverage and data-release
    notices; later GSPO/StepPO/ALFWorld/WebShop capabilities must not be conflated with the 2025 Multi-hop QA experiment.
  - Framework-level support for custom tools, process rewards and diverse algorithms does not prove the quality, security,
    privacy, rights or reward validity of any downstream task release.
  citation_status: verified
  confidence: high
  notes: Official arXiv v1 (2025-11-18), its v2 revision (2026-05-30), and the AgentR1 repository including current and official
    legacy branch documentation/license were inspected on 2026-07-16. The metadata preserves the 2025 v1 paper identity while
    explicitly recording later project drift. No v1 immutable data/trace/verifier/checkpoint release was verified.
inclusion_reason: A technical report and framework that makes tool-environment step transitions, masks and programmatic final
  feedback explicit for multi-turn agent RL, while its paper-to-code evolution highlights the need to separate framework claims
  from versioned data, environment and trajectory disclosure.
