one_line_summary: Agent-R1 discloses a tool-environment RL framework and a v1 Multi-hop QA reward contract across PPO/GRPO/REINFORCE++/RLOO,
  but no immutable v1 train split, environment/corpus snapshot, rollout/reward ledger or provenance-complete checkpoint package
  was verified.
why_it_matters: It makes the environment transition boundary and token-mask credit assignment explicit for agentic RL, yet
  shows why an open framework and named benchmark mixture do not establish replayable trajectories, data rights, verifier
  decisions or reproducible policy lineage.
