one_line_summary: ToolMaster releases trial-and-execution SFT conversations and trains tool-use policies with teacher-filtered
  demonstrations followed by GRPO using format and model-judged correctness rewards.
why_it_matters: It distinguishes reusable interaction demonstrations from online policy rollouts and makes the learned
  judge, behavior filter, and environment feedback part of the data contract.
