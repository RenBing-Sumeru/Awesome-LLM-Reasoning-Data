one_line_summary: OpenMathReasoning packages 5.68M rows across CoT, Python-interleaved TIR, GenSelect, and problem-only modes
  for answer-level mathematical-reasoning SFT and selection, but the official release corrects the paper's 540K problem figure
  to 306K unique solution-bearing problems.
why_it_matters: It exposes a rare end-to-end recipe from forum problems through teacher rollouts, answer judging, tool-use
  filtering, generative selection, and SFT. Its release correction and missing raw-scrape, rejection, verifier, and rights
  manifests also show why dataset lineage and acceptance semantics must be audited rather than inferred from aggregate scale.
