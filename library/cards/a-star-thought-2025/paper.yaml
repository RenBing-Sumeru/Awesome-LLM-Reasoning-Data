  decontamination: unknown
  license: unknown
  lineage: s1K-1.1 long CoT -> BIS-scored spans and A* path search with s1.1-32B validation -> AStar-Thought-1k compressed
    traces -> SFT models.
  known_failure_modes:
  - Validator judgments can select paths that look solution-directed without proving semantic correctness.
  - Compression can remove reasoning needed for difficult items.
