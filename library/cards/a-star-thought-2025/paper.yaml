data_object:
  prompt_source: Long-CoT examples inherited from s1K-1.1; upstream prompt provenance was not audited here.
  trace_author: unknown; compressed traces derive from s1K-1.1 long CoTs.
  answer_format: System prompt plus two-message conversations containing tagged thought and solution sections.
  process_fields:
  - system
  - conversations
  - search_steps
  environment_or_substrate: Offline long-CoT compression over s1K-1.1 mathematical reasoning data.
  verifier_or_reward: s1.1-32B validation model decides whether a candidate thought path can lead to the target solution.
  terminal_predicate: Validator acceptance after minimum search depth or return at configured maximum search depth; evaluation
    uses answer accuracy.
recipe_metadata:
  base_model: QwQ-32B, DeepSeek-R1-Distill-Qwen-32B, and s1.1-32B.
  teacher: unknown
  generator: BIS-guided A* search compresses s1K-1.1 long-CoT trajectories into compact thought paths.
  filtering_rule: Candidate paths are selected through BIS-guided A* search with s1.1-32B validation; complete rejection manifest
    unavailable.
  sampling_protocol: Official compression script sets alpha 0.5, beta 0.1, minimum depth 5, and maximum depth 20; generation
    sampling details unknown.
  rollout_count: unknown
  temperature: unknown
  inference_budget: Compression search depth 5 to 20; reported output budgets 512, 1024, 2048, and 4096 tokens.
  optimizer_or_scaffold: LLaMA-Factory full SFT; paper reports three training epochs.
audit:
  source_mixture: s1K-1.1 is the stated source; its broader mixture and rights are not audited by this work.
