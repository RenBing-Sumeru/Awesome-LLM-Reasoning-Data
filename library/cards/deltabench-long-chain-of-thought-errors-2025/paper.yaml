one_line_summary: DeltaBench pairs 1,236 long o1-like traces with fine-grained annotations to test whether critics can find
  process errors beyond final-answer accuracy.
why_it_matters: It exposes the failure of short-trace process evaluators on realistic long reasoning and provides a public
  diagnostic surface.
