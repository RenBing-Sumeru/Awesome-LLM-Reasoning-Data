one_line_summary: SWE-World trains a step-feedback simulator and a virtual test runner from Docker rollouts, then uses them
  to generate and reward repository-agent episodes without Docker, while the complete task and trajectory corpora remain unreleased.
why_it_matters: 'It exposes a concrete alternative feedback contract for SWE-agent post-training and shows both its scaling
  value and its audit hazard: learned execution can support SFT, RL and TTS, but imperfect rewards, gold-patch conditioning
  and missing release lineage can change what behavior is actually reinforced.'
