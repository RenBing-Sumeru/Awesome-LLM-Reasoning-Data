one_line: MacArena releases 421 executable macOS GUI tasks and two Apple-Silicon UTM environments with terminal state graders
  and local trace logging, but no canonical public rollouts and material verifier/reset/provenance gaps.
one_line_summary: MacArena releases 421 executable macOS GUI tasks and two Apple-Silicon UTM environments with terminal state
  graders and local trace logging, but no canonical public rollouts and material verifier/reset/provenance gaps.
why_it_matters: 'It makes macOS desktop-agent state, action, reset, and final-feedback interfaces inspectable for evaluation
  and audit, while showing why a runnable environment is not automatically a reusable training corpus: failures, replay metadata,
  splits, verifier tests, rights, and contamination evidence still determine whether trajectories can be trusted.'
