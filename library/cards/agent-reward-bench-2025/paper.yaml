one_line_summary: AgentRewardBench releases 1,302 web-agent episodes with expert success, side-effect, optimality, and repetition
  labels plus 15 automatic-evaluator outputs per episode, but it supports offline audit rather than licensed deterministic
  replay.
why_it_matters: It lets researchers measure false-positive and false-negative behavior in both LLM judges and task-specific
  rules before those signals are used to select agent trajectories or report success, while preserving failed examples and
  exposing release/replay risks.
