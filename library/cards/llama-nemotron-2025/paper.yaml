data_object:
  prompt_source: The report combines extracted and synthetic prompts. Math problems are extracted from Art of Problem Solving
    forums except Middle School Math; code aggregates 28,904 deduplicated questions from TACO, APPS, CodeContests, and CodeForces;
    science uses StackOverflow and synthetic questions; general prompts are synthetic or drawn from permissively licensed
    public datasets; instruction-following RL uses synthetic multi-constraint prompts. Complete record-level source identifiers
    are not published.
  trace_author: Reasoning and direct responses are generated by multiple public or open model families. The official dataset
    card lists Llama-3.3-70B-Instruct, Llama-3.1-Nemotron-70B-Instruct, Llama-3.3-Nemotron-70B-Feedback/Edit/Select, Mixtral-8x22B-Instruct-v0.1,
    DeepSeek-R1, and several Qwen-2.5 variants with reported generation counts; no single universal teacher applies.
  answer_format: The released SFT rows expose input chat messages, output text, category, per-record license, reasoning on/off,
    generator, models used in training, version, and system-message instruction. The RL instruction-following rows expose
    input messages, structured instruction arguments, category, license, reasoning mode, models used in training, version,
    and system-message instruction. Schema and fields differ by configuration and domain.
  process_fields:
  - input chat messages
  - output response
  - structured instruction arguments
  - category
  - license
  - reasoning mode
  - generator
  - used-in-training model list
  - dataset version
  - system-message instruction
  environment_or_substrate: Offline multi-stage post-training for LN-Nano, LN-Super, and LN-Ultra, combining reasoning-on/off
    SFT with LN-Ultra scientific-reasoning GRPO, instruction-following RL, and family-specific preference optimization.
  verifier_or_reward: The contract varies by stage. Math uses a Qwen2.5-32B-Instruct equivalence judge and majority-answer
    fallback when no answer can be extracted; code uses structural and syntax filters; general-domain generation uses Llama-3.1-Nemotron-70B-Reward
    for rejection sampling. LN-Ultra reasoning RL combines Llama-3.3-70B-Instruct answer judgments with think-tag format rewards.
    Instruction-following RL uses a constraint verifier, and chat alignment uses Llama-3.1-Nemotron-70B-Reward over HelpSteer2
    prompts.
  terminal_predicate: No universal terminal predicate exists. Depending on the subset or training stage, acceptance can require
    judged answer equivalence, expected-answer agreement, valid response structure or syntax, reward-model selection, instruction-constraint
    satisfaction, or correct reasoning-mode tag behavior. Exact thresholds and retained decision fields are not consistently
    released.
recipe_metadata:
  base_model: LN-Nano derives from Llama-3.1-8B-Instruct; LN-Super from Llama-3.3-70B-Instruct after NAS and recovery training;
    LN-Ultra from Llama-3.1-405B-Instruct after NAS, FFN Fusion, 65B-token distillation, and 88B-token continued pretraining.
  teacher: DeepSeek-R1 is the principal reasoning-trace teacher. Qwen2.5-Math-7B-Instruct produces many math reasoning-off
    solutions; Llama-3.1-Nemotron-70B-Instruct and Llama-3.3-70B-Instruct produce direct responses; Qwen2.5 and Nemotron models
    also generate, judge, edit, or select domain-specific data.
  generator: Domain-specific pipelines extract or synthesize prompts, generate multiple reasoning-on or reasoning-off responses,
    filter them with answer, format, syntax, reward-model, or constraint checks, and attach the system instruction 'detailed
    thinking on' or 'detailed thinking off'. A separate Feedback/Edit/Select pipeline refines 20,000 first-turn general prompts
    from ShareGPT and WildChat-1M.
  filtering_rule: Math removes proof, multiple-choice, binary, invalid, benchmark-similar, and answer-mismatched examples.
    Code applies exact deduplication, contamination checks, reasoning/code-format checks, and Tree Sitter syntax validation.
    Science decontaminates against GPQA, MMLU, and MMLU-Pro and uses majority voting when ground truth is absent. General
    responses use reward-model rejection sampling. LN-Ultra RL discards prompts whose LN-Super pass rate across eight responses
    is at least 0.75 and curricula batches from easier to harder prompts.
  sampling_protocol: Math generates 16 DeepSeek-R1 and 64 Qwen2.5-Math-7B-Instruct solutions per problem. Code generation
    uses temperature 0.6 and top-p 0.95. LN-Ultra reasoning RL uses 72 prompts per rollout, 16 responses per prompt, temperature
    1, top-p 1, global batch 576, and two gradient updates per rollout. Other decoding parameters and domain-level rejection
    statistics are incomplete.
  rollout_count: unknown
  temperature: unknown
  inference_budget: Generation budgets are stage-specific. The paper reports 16 and 64 candidates per math problem, multiple
    code/science/general responses without a universal count, eight LN-Super responses per prompt for RL difficulty filtering,
    and 16 policy responses per prompt during LN-Ultra reasoning GRPO. Aggregate attempted generations, rejected counts, and
    compute for dataset construction are not reported.
  optimizer_or_scaffold: SFT uses token-level cross-entropy and Adam with model-specific schedules. LN-Nano uses three stages;
    LN-Super uses one epoch at learning rate 5e-6, sequence length 16k, and global batch 256; LN-Ultra uses packed 24k sequences,
    global batch 256, warmup to 1e-5, and decay to 1e-6. LN-Ultra reasoning uses GRPO and approximately 140k H100 hours. Instruction-following
    uses short RLOO runs for Super and Ultra. Chat alignment uses online RPO for Super, GRPO for Ultra, and two offline RPO
    rounds for Nano.
audit:
  source_mixture: 'The report''s Table 2 totals 33,011,757 synthetic examples: 22,066,397 math, 10,108,883 code, 708,920 science,
    39,792 chat, 56,339 instruction-following, and 31,426 safety. It further separates reasoning-on and reasoning-off counts
    for math, code, science, and chat. The current official dataset viewer estimates about 3.91M SFT rows and cannot fully
    generate the RL viewer because of a schema-cast error; the relationship between reported generation counts, released rows,
    configurations, and versions is not reconciled.'
  split: The official artifact exposes SFT and RL configurations and domain splits rather than a conventional train/dev/test
    partition. The report describes model-specific data mixtures, but no immutable stage-by-stage manifest maps every released
    record to Nano, Super, or Ultra training runs, order, epoch, weight, or acceptance decision.
  decontamination: Math uses an LLM comparison method against popular math benchmarks. Code uses cosine similarity and LLM
    judges against named coding benchmarks, with a manual check reporting less than 0.3 percent overlap. Science applies the
    same family of checks against GPQA, MMLU, and MMLU-Pro. Thresholds, exact benchmark revisions, matched-record ledgers,
    and corpus-wide checks for general, chat, safety, and instruction-following data are not released.
  license: The Hugging Face dataset page is labeled CC-BY-4.0 and provides a per-record license field, while documenting ODC-BY
    records from WildChat and CC-BY-SA records from StackOverflow. It also warns that records generated by Llama-family models
    may trigger Llama 3.1 or 3.3 redistribution and use requirements. Released model weights use the NVIDIA Open Model License
    plus applicable Llama terms. Compatibility remains a record- and use-specific review rather than a single blanket conclusion.
  lineage: Public or synthetic prompt source -> extraction or prompt generation -> domain classification and quality/complexity
    filtering -> benchmark decontamination where specified -> multi-model response generation -> answer, syntax, format, reward-model,
    or constraint filtering -> reasoning-on/off SFT and RL configurations -> model-specific SFT mixtures -> LN-Ultra reasoning
    GRPO and family-specific instruction/preference alignment -> released LN-Nano, LN-Super, and LN-Ultra weights. Record-level
    source URLs, every rejected candidate, verifier outputs, and exact run membership are incomplete.
  known_failure_modes:
  - The official report's 33,011,757-example table, generator-count table, current Hugging Face row estimates, and configuration-specific
    files do not form a reconciled release ledger.
  - A per-record license label is valuable but does not replace source URL, source revision, attribution text, generator terms,
    or a complete rights chain.
  - Math majority voting and model-based answer-equivalence judgments can preserve consensus errors or accept a correct answer
    with flawed reasoning.
  - Code filtering documents syntax and format checks, but the report does not establish execution-based verification for
    every released code response.
  - Reward-model rejection sampling and RLHF inherit reward-model calibration, bias, and reward-hacking risks; thresholds
    and rejected candidates are not released.
  - LN-Ultra RL discards prompts with high LN-Super pass rates and uses pass-rate curricula, but the exact prompt pool and
    retained difficulty distribution are unavailable.
  - The RL release exposes instruction-following task arguments, not the complete policy rollout groups, rewards, log probabilities,
    rejected outputs, or optimizer state needed to replay training.
  - Benchmark-specific decontamination does not establish corpus-wide decontamination, and exact benchmark revisions and match
    ledgers are absent.
  - Dataset viewer schema failure and evolving repository versions complicate programmatic audit unless users pin an immutable
    revision and inspect raw files directly.
  - Benchmark performance measures released model behavior under stated evaluation settings; it does not prove provenance,
    verifier accuracy, license compatibility, or record-level data quality.
  citation_status: verified
  confidence: medium
  notes: Official arXiv report, arXiv BibTeX, NVIDIA Hugging Face dataset and model cards, model collection, and NVIDIA-NeMo
    repository were checked on 2026-07-19. Weights and a substantial data artifact are verified, while exact training-code
    revisions, complete release-count reconciliation, and stage-to-record lineage remain incomplete.
inclusion_reason: Llama-Nemotron is a high-value frontier disclosure because it pairs released model weights with an official
  post-training dataset and unusually detailed domain-specific SFT and RL recipes, while exposing unresolved count, lineage,
  verifier, and replay gaps.
