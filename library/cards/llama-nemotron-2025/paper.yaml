one_line_summary: Llama-Nemotron releases Nano, Super, and Ultra weights plus a versioned SFT/RL dataset and detailed domain
  pipelines, but the report's 33,011,757-example accounting is not reconciled with current released-row views or complete
  stage-to-record lineage.
why_it_matters: It demonstrates that frontier disclosure can include weights, data fields, domain generators, filters, and
  RL rewards while still leaving material gaps in release accounting, rejected candidates, verifier replay, rights lineage,
  and exact run composition.
