one_line_summary: Aegis converts deterministic successful multi-agent runs into 9,533 evaluator-confirmed faulty trajectories
  with agent/error-mode labels, while mixed verifiers and selective failure retention bound reuse.
why_it_matters: It makes the full MAS episode and injected agent/error map a concrete post-training object for SFT and GRPO,
  but also shows why synthetic intervention data must expose discarded attempts, grouped splits, verifier versions, baseline
  lineage, and immutable release manifests.
