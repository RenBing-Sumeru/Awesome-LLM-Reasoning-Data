one_line_summary: WebAgent-R1 combines a 9,460-trajectory behavior-cloning warm-up with asynchronous current-policy WebArena
  rollouts, M-GRPO, and binary terminal rewards, while the online trajectories and checkpoints remain unreleased.
why_it_matters: It makes grouped browser episodes and interaction budgets explicit post-training objects, allowing the atlas
  to separate BC data, online rollout generation, environmental verification, and test-time scaling.
