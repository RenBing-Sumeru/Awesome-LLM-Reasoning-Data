one_line_summary: Nemotron-Post-Training-Dataset-v2 releases 6,341,414 SFT-style records across technical reasoning, chat,
  and five target languages, with generator and license metadata but without row-level selection or RL-stage lineage.
why_it_matters: For the Data Construction & Open Release Recipes track, it is both a reusable SFT source and a concrete audit
  case showing that detailed report-level verifiers and post-training stages do not substitute for record-level provenance,
  decisions, and run mappings.
