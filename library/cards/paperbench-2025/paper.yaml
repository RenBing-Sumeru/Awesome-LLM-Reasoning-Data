one_line_summary: PaperBench evaluates 20 from-scratch ML-paper replications with 8,316 weighted rubric leaves, fresh-container
  execution, and an o3-mini judge, but releases no complete 646-run trajectory/submission corpus and remains exposed to judge,
  contamination, rights, replay, and secret-handling risks.
why_it_matters: 'It turns an open-ended research-replication episode into auditable Code Development, Execution, and Result
  Match checkpoints and separates agent work from clean reproduction. That same design shows why public task/rubric packages
  are evaluation assets, not automatically trajectory-training data: the actual rollouts are absent, result reproduction remains
  near zero, and judge/replay/ contamination/security boundaries materially affect any claimed capability.'
