data_object:
  prompt_source: 'A disclosed mixture: synthetic long-context prompts; math, STEM, instruction-following, safety, search,
    terminal, science, chat, code, CUDA, and other agentic tasks. Named sources include Wikidata walks, OpenResearcher, OpenCodeReasoning,
    OpenMathReasoning, SWE-bench-family resources, LMArena, WildChat, and competitive-programming sites; some sources are
    vendors or private/NVIDIA datasets. Item-level allocation and complete source manifests are unknown.'
  trace_author: Synthetic traces, solutions, translations, and agent trajectories are generated by named and unnamed strong
    teacher models and agent systems. The report names GPT-OSS-120B, MiniMax 2.1/2.5, GLM 5/5.1, DeepSeek-V3.2, DeepSeek-V3.2-Speciale,
    DeepSeek-R1, Qwen variants, and specialist Nemotron teachers for selected components; exhaustive component-to-teacher
    mapping is unknown.
  answer_format: Packed SFT prompt-response examples, reasoning traces, candidate solutions, multilingual translations, browser
    and terminal action-observation trajectories, code patches, structured outputs, and RL/MOPD rollouts; no single complete
    record schema is published.
  process_fields:
  - prompt_or_task
  - reasoning_trace
  - generated_answer_or_solution
  - tool_or_environment_interaction
  - verifier_or_teacher_signal
  - reward
  - selected_output
  environment_or_substrate: SFT uses browser/search, terminal, coding, CUDA, and other task substrates. Unified RLVR spans
    many environments; the report identifies harness variation, tool use, and an end-to-end SWE repository environment. Environment
    versions, configs, private/vendor environments, and raw logs are only partially released or unknown.
  verifier_or_reward: RLVR uses task/environment verification across multiple domains; the report specifies asynchronous GRPO
    and 16 rollouts per sample. MOPD supplies dense teacher signals. The SWE teacher uses hidden tests with a binary GRPO
    reward and adds masking/negative-advantage handling. Complete per-environment reward formulas, calibration, weights, and
    error rates are unknown.
  terminal_predicate: Task dependent. A documented SWE stage terminates after a patch is produced and hidden tests run; other
    task acceptance predicates and timeout policies are only partly described or unknown.
recipe_metadata:
  base_model: Nemotron 3 Ultra 550B total / 55B active hybrid Mamba-Attention Mixture-of-Experts base checkpoint; 20T-token
    pretraining and 1M-context extension are disclosed.
  teacher: Named selected teachers include GPT-OSS-120B, MiniMax 2.1/2.5, GLM 5/5.1, DeepSeek-V3.2, DeepSeek-V3.2-Speciale,
    DeepSeek-R1, Qwen variants, and specialized Nemotron teachers; an exhaustive version-to-dataset mapping remains unknown.
  generator: Synthetic data and trajectories are generated with named teachers/agent systems, plus real task/document seeds;
    full prompts, system messages, decoding settings, yields, revisions, and vendor-data processes are unknown.
  filtering_rule: Disclosed examples include commercial-licence filtering of OpenResearcher (about 21.7K kept), safety back-translation
    semantic similarity threshold 0.8 (about 10–15% removed per language), LLM-judge science filtering, code rejection sampling,
    strict code deduplication, and selected benchmark decontamination. Full filters, thresholds, yields, and coverage are
    unknown.
  sampling_protocol: SFT has two disclosed stages with packed sequences and sample counts. Unified asynchronous GRPO uses
    batch 8,192 and 16 rollouts/sample, with maximum generation length 48K then 64K. MOPD uses 1,024 prompts/batch, one rollout/prompt,
    and 192K maximum generation. Decoding settings and allocation across all environments are unknown.
  rollout_count: 16
  temperature: null
  inference_budget: 'The released model supports 1M context and reasoning-budget control. Reported training generation limits
    are stage-specific: RLVR 48K then 64K, MOPD 192K; final deployed policy/budget distributions are unknown.'
  optimizer_or_scaffold: SFT, unified multi-environment RLVR with asynchronous GRPO, two iterations of asynchronous MOPD,
    and MTP boosting are documented. Full optimizer hyperparameters, reward weights, environment schedules, training seeds,
    and checkpoint selection rules are unknown.
audit:
  source_mixture: Official model card declares 226 datasets and 14.8T tokens of data while the report says the model was pre-trained
    on 20T tokens; the relation between these figures is not explained in the checked sources. Source categories include public,
    crawled, synthetic, private third-party, private NVIDIA, and vendor data; the report and model card disclose many named
    components but not a complete immutable source-to-stage manifest.
  split: The official model card lists the overall dataset partition as training 100%, testing 0%, validation 0%. It also
    names evaluation/testing corpora, but complete task-level train/dev/test membership, revisions, and exclusion lists remain
    unknown.
  decontamination: The model card says Common Crawl data is deduplicated and filtered; the report states strict code deduplication
    and dataset-specific benchmark decontamination. A family-wide benchmark-overlap protocol, thresholds, residual-overlap
    measurements, and immutable exclusion manifests are unknown.
  license: 'The BF16 checkpoint is released under OpenMDW License Agreement v1.1. NVIDIA releases data collections, but source
    rights are mixed: the report filters OpenResearcher for commercial clearance, while the model card names private third-party,
    private NVIDIA, vendor, and undisclosed sources. A complete source-level rights and redistribution mapping is unknown.'
  lineage: The report gives stage-level lineage from named seeds/teachers through SFT, RLVR, specialist teachers, and two
    MOPD iterations, and NVIDIA releases recipe/data collections. Item-level source-to-prompt-to-trace-to-reward-to-checkpoint
    lineage, exact revisions, seeds, and private inputs are incomplete or unknown.
  known_failure_modes:
  - The report explicitly notes that final hidden-test reward may wrongly reward or penalize full SWE trajectories; it adds
    masks and negative advantages, but no reward-error rate or calibration audit is published.
  - Private, vendor, and undisclosed datasets/environments remain part of the model-card ledger, limiting complete reproduction
    and source-rights auditing despite broad public releases.
  - Model-card data total (14.8T) and report pretraining count (20T) are both disclosed but their relationship is not explained
    in the checked sources.
  - Dataset-specific deduplication/decontamination is described, but no complete family-wide benchmark-overlap protocol or
    raw residual-overlap results are identified.
  - Raw RL/MOPD rollouts, all reward logs, per-environment configuration pins, and full item-level provenance are not established
    by the checked official releases.
  citation_status: verified
  confidence: high
  notes: 'Evidence is limited to NVIDIA''s technical report, official NVIDIA project page, official NVIDIA GitHub repository,
    and `nvidia` Hugging Face releases. This is a Track-12 disclosure ledger: rich official release artifacts do not eliminate
    private-source, reward-calibration, or end-to-end lineage gaps.'
inclusion_reason: A frontier open-weight report that unusually releases checkpoints, data collections, and recipes while also
  documenting concrete SFT data construction, multi-environment RLVR, rollout counts, specialist-teacher distillation, license
  filtering, and selected verifier/leakage limitations.
