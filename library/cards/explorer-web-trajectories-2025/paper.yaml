one_line_summary: Synthesizes 175K GPT-4o-driven live-web episodes and retains 94K verifier-approved multimodal trajectories
  for web-agent training.
why_it_matters: Shows how exploration, environmental execution, multimodal state capture, and outcome filtering can scale
  agent data, while exposing why immutable snapshots and content rights are essential release metadata.
