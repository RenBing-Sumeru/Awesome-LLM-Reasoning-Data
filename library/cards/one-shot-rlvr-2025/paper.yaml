one_line_summary: Shows that one selected and batch-duplicated math problem with binary answer-matching reward can substantially
  improve several reasoning models under the reported RLVR settings.
why_it_matters: Turns an often-hidden RLVR prompt-selection decision into a small released data object, revealing both a concrete
  outcome-reward recipe and the missing provenance, equivalence-checking, and leakage controls needed to judge reuse.
