one_line_summary: Trains a 0.6B process selector on outcome-labeled Qwen3-8B math traces and ranks Best-of-N candidates by
  the mean of step-level right probabilities derived from sampler hidden states.
why_it_matters: For the rollout/search track, it makes candidate traces, latent step features, weak outcome labels, and the
  final selection rule explicit, while showing that the same selector can rank offline SFT data.
