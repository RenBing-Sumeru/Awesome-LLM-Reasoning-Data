one_line_summary: The GPT-5.1-Codex-Max System Card exposes synthetic malware and prompt-injection safety data plus RL rollouts
  where a user model makes conflicting edits and preservation earns positive reinforcement, but not the record corpus, reward
  implementation, source mixture, or train/evaluation lineage.
why_it_matters: It is an unusually concrete frontier-report ledger for coding-agent post-training because it links prompts,
  environment changes, episode behavior, rewards, compaction budgets, and executable evaluation predicates while clearly demonstrating
  how much remains unavailable for independent reuse or attribution.
