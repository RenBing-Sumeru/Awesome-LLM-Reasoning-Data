one_line_summary: Converts 16 on-policy trajectories into consistency, volatility, answer-group, and curiosity rewards for
  Reinforce++ without using correctness labels for optimization.
why_it_matters: Makes a self-generated reward recipe inspectable while showing why internal consistency must not be conflated
  with external correctness.
