data_object:
  prompt_source: Open-Reasoner-Zero training instructions, whose reported mixture includes AIME through 2023, MATH, NuminaMath,
    Tulu 3 MATH, OpenR1-Math-220k, other open datasets, and programmatically synthesized reasoning tasks; released records
    omit per-source identifiers.
  trace_author: The current policy samples 16 on-policy trajectories for each prompt.
  answer_format: Trajectories are split into newline-based states; extracted final answers define answer groups and candidates
    for state-to-answer likelihood distances.
  process_fields:
  - prompt
  - trajectory
  - intermediate_state
  - extracted_final_answer
  - distance_matrix
  - consistency
  - volatility
  - answer_group
  - intrinsic_reward
  - curiosity_reward
  - normalized_advantage
  environment_or_substrate: OpenRLHF with vLLM and Reinforce++ performs online rollout, self-scoring, and policy optimization.
  verifier_or_reward: A programmatic self-reward uses current-policy likelihood geometry to combine trajectory consistency,
    volatility, answer-group agreement, and optional curiosity; it is not an external correctness verifier. Math-Verify is
    used only for benchmark evaluation.
  terminal_predicate: A completed response yields an extracted final answer; prompts whose sampled answers are all identical
    provide no comparative reward signal and may be filtered.
recipe_metadata:
  base_model: Llama-3.2-3B-Instruct and Qwen2.5-3B/7B-Instruct, with an appendix scaling experiment on Qwen2.5-14B-Instruct.
  teacher: none
  generator: For each prompt, sample 16 trajectories, split them into states, score every state against distinct sampled final
    answers, compute trajectory and answer-group rewards, and update the same policy.
  filtering_rule: Optionally remove prompts whose sampled answers are all identical; group remaining trajectories by exact
    extracted final answer. The complete normalization and extraction specification is unknown.
  sampling_protocol: temperature 1.0, top-p 1.0, top-k disabled, maximum 4096 generated tokens, and 16 samples per prompt
    in the paper.
  rollout_count: 16
  temperature: 1.0
  inference_budget: The paper reports one epoch on eight A100-80GB GPUs; complete token counts, GPU-hours, and per-run seeds
    are unknown.
  optimizer_or_scaffold: Reinforce++ with clipped updates and normalized advantages; learning rate 5e-7 and initial KL coefficient
    1e-4.
audit:
  source_mixture: Open-Reasoner-Zero prompt mixture is described at dataset level, but record-level source identifiers are
    not released.
  split: The Hugging Face release contains train.jsonl and test.jsonl, but their fields differ and the hosted dataset builder
    reports a schema-cast error; no manifest maps the files to the paper's training and evaluation runs.
  decontamination: unknown; the paper gives a release-chronology argument for most prompts but reports no measured overlap
    audit against the evaluation suites.
  license: The Hugging Face dataset card declares MIT; code licensing scope and rights inherited from upstream prompt sources
    remain partial.
  lineage: Paper-run trajectories, extracted-answer groups, distance matrices, reward records, filtered prompts, seeds, logs,
    and checkpoints are not released.
  known_failure_modes:
  - A wrong but internally consistent trajectory can receive high reward
  - a shared misconception can strengthen a wrong answer group
  - reward calibration is self-referential to the current policy
  - newline segmentation and answer extraction change the score
  - exact-string grouping can separate equivalent answers
  - all-identical filtering removes both easy and uniformly failed prompts
  - reward computation scales with trajectories times states times candidate answers
  - the public script uses 2048 generated tokens and leaves curiosity disabled by default whereas the paper reports 4096 tokens
    and includes curiosity
  - the released train and test JSONL schemas are incompatible with the hosted builder
  citation_status: verified
  confidence: medium
  notes: Official paper, venue page, repository, script, and dataset repository were checked; benchmark accuracy is evaluation
    evidence, not evidence that the self-reward or released prompts are correct.
inclusion_reason: Exposes a concrete recipe for turning multiple on-policy reasoning traces into programmatic self-reward
  without correctness labels, together with important release and audit gaps.
