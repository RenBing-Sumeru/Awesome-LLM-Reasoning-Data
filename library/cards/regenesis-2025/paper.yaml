status: partial
one_line_summary: ReGenesis transforms 25 general reasoning guidelines into task-specific structures and answer-selected paths,
  retaining at most five trajectories per instruction for SFT.
why_it_matters: For the Data Construction track, it makes pre-trace planning objects and retry lineage explicit, while also
  showing why terminal-answer success, hidden upstream hints, and unreleased corpora require separate quality audits.
