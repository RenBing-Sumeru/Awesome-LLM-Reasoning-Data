inclusion_reason: ThinkBooster makes runtime test-time reasoning data unusually concrete by unifying nine search and sampling
  strategies, four scorer families, explicit model, candidate, and token budgets, mixed graders, config snapshots, and an
  inspectable step, candidate, and tree debugger, while its missing paper-run corpus exposes the difference between a trace-generating
  toolkit and a reusable trace release.
