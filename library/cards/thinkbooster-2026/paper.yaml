one_line_summary: ThinkBooster is an MIT-licensed toolkit and ACL 2026 demo that generates and inspects prompt, candidate,
  step-score, selection, token, TFLOP, latency, and config traces for nine test-time reasoning strategies, but does not release
  the historical paper-run trace corpus.
why_it_matters: It provides a common runtime data contract for comparing sampled trajectories, search trees, PRM, confidence,
  and critic selectors, and exact inference budgets, while making release completeness, scorer domain shift, step segmentation,
  systems accounting, API drift, and generated-output provenance auditable.
card: null
card_recommendation: High-priority core-only bilingual L4 Card centered on the runtime trace contract across all nine strategies,
  exact paper budgets and graders, the two-example persisted debugger cache, the absence of paper-run prompts, candidates,
  scorer logs, and config hashes, the unresolved ReProbe implementation path, and license, API, and dependency drift. ThinkBooster
  must not be described as an open paper-run reasoning-trace dataset.
