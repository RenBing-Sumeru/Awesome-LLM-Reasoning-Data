  notes: Official paper PDF checked on 2026-07-20. It lists The Hong Kong Polytechnic University, Shanghai Jiao Tong University,
    and SII; official linked project pages identify the LIMOPro code, models, and refined datasets.
inclusion_reason: It changes the training traces used to produce inference-time reasoning so that future test-time computation
  focuses on solution-progressing steps rather than redundant verification and correction text.
