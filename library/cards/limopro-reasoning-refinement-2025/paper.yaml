data_object:
  prompt_source: LIMO, LIMO-V2, and S1K reasoning datasets distilled respectively from DeepSeek-R1, QwQ, and Gemini Thinking.
  trace_author: Source large reasoning models generate chain-of-thought traces; Claude 3.7 Sonnet segments and classifies
    steps, and Qwen2.5-32B-Instruct computes answer perplexity.
  answer_format: Question, segmented reasoning steps, step-type labels, leave-one-step-out perplexity importance values, pruned
    trace, and final answer.
  process_fields:
  - question
  - reasoning_chain
  - step_boundaries
  - step_type
  - PIR_score
  - retained_steps
  - final_answer
  environment_or_substrate: Offline construction of refined reasoning-supervision traces followed by test-time evaluation
    of fine-tuned models.
  verifier_or_reward: Perplexity-based Importance Refinement measures the change in answer confidence when a functional step
    is removed; progressive steps are preserved.
  terminal_predicate: The refined trace retains the original final answer while reducing selected low-importance functional
    steps.
recipe_metadata:
  base_model: LIMO, LIMO-V2, and S1-derived fine-tuned reasoning models; Qwen2.5-32B-Instruct evaluates answer perplexity.
  teacher: DeepSeek-R1, QwQ, and Gemini Thinking data sources; Claude 3.7 Sonnet performs trace segmentation and contextual
    classification.
  generator: Fine-tuned language models generate concise reasoning chains at test time.
  filtering_rule: Keep all progressive reasoning; rank verification, multi-method validation, and error-correction steps by
    PIR and prune low-importance steps at the chosen ratio.
  sampling_protocol: Evaluate pass@1 and response-token cost over AIME, AMC, and GPQA Diamond under token budgets from 2k
    to 24k.
  rollout_count: Not stated as multi-rollout selection; each test-time response is evaluated for pass@1 and token use.
  temperature: See official repository/configuration for exact inference settings.
  inference_budget: Response-token budgets ranging from 2k to 24k in reported scaling curves.
  optimizer_or_scaffold: PIR, based on answer perplexity with and without each candidate functional reasoning step.
audit:
  source_mixture: Official NeurIPS paper, official GitHub repository, and official Hugging Face model/data pages.
  split: Training sources contain 1,000 S1K, 817 LIMO, and 800 LIMO-V2 examples; AIME24, AMC23, and GPQA Diamond are evaluation
    benchmarks.
  decontamination: No separate contamination audit is claimed; source-model and benchmark overlap should be checked before
    reuse.
  license: The model card states MIT for the project; validate each dataset, model, and benchmark license independently.
  lineage: https://arxiv.org/abs/2505.19187
  known_failure_modes:
