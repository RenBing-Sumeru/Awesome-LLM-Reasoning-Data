one_line_summary: EnvScaler releases 191 executable tool environments, 7,234 SFT/RL scenarios, and 9,022 SFT trajectories,
  but SFT success is not terminal-state verified and reproducible RL reuse still lacks rollout, version, and verifier-audit
  records.
why_it_matters: It makes environment scale a concrete post-training data variable—state, tools, rules, tasks, trajectories,
  and executable outcome checks—while showing why release shape, terminal-versus-success semantics, rejected samples, code
  safety, and version pins determine whether synthetic agent data can be trusted or replayed.
