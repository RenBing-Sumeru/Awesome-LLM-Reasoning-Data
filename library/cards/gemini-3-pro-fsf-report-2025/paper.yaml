data_object:
  prompt_source: The report says supervised fine-tuning uses thought traces generated by reasoning models, but does not disclose
    the upstream prompts or tasks. It separately reports an approximately 75k-prompt third-party harmful-manipulation evaluation;
    its prompt records, composition, and release status are unknown.
  trace_author: For SFT, thought traces are generated by unspecified reasoning models rather than manually written. Generator
    identities, checkpoints, prompt authors, selection, and human involvement are unknown.
  answer_format: Thought traces are used for SFT; the report does not disclose their record schema, accompanying answer fields,
    tool transcripts, or released examples as a data artifact.
  process_fields:
  - thought_trace
  environment_or_substrate: For cyber evaluation, a custom controller manages a multi-stage thinking and tool-use loop, retries
    parsing or validation errors up to five times, and uses model/task-specific tools. Training environments and their versions
    are unknown.
  verifier_or_reward: The report states that RL on thought traces includes length penalties and that, with minor exceptions,
    other rewards are computed without reference to thoughts. Reward definitions, verifiers, labelers, calibration, weights,
    and aggregation are unknown.
  terminal_predicate: In the reported cyber evaluation, a challenge is solved when the agent succeeds in at least one of N
    attempts. This is an evaluation predicate; post-training acceptance or terminal predicates are unknown.
recipe_metadata:
  base_model: Gemini 3 Pro; architecture, parameter count, checkpoint lineage, and allocation across post-training stages
    are unknown.
  teacher: Reasoning models generate SFT thought traces, but teacher identities, checkpoints, and mappings are unknown.
  generator: Reasoning models generate SFT thought traces; generation prompts, sampling, filtering, and provenance are unknown.
  filtering_rule: The report describes safety query filters, filtering and processing of inputs, and other guardrails, but
    does not disclose thought-trace selection or training-data filtering rules, thresholds, or yields.
  sampling_protocol: For a cyber evaluation only, Gemini 3 Pro is evaluated with 75 attempts and 40-step challenges; post-training
    trace-sampling protocol is unknown.
  rollout_count: null
  temperature: null
  inference_budget: Cyber evaluation uses 75 attempts for Gemini 3 Pro and 40-step challenges, with additional tools compared
    with earlier models. Training-time and deployed inference budgets are unknown.
  optimizer_or_scaffold: SFT and RL on thought traces are reported, including RL length penalties. Algorithm, optimizer, objective
    composition, schedules, rollout generation, and update rules are unknown.
audit:
  source_mixture: 'Only a stage-level source claim is disclosed: SFT thought traces are generated by reasoning models. Source
    prompts, generator mixture, data quantities, manifests, revisions, and rights are unknown.'
  split: The report describes internal, external, and third-party evaluations but does not release membership, split definitions,
    sizes beyond selected prompt counts, or overlaps with training.
  decontamination: unknown
  license: No released training data, thought traces, weights, code, or evaluation artifacts are identified in the official
    report; applicable data and artifact licenses are unknown.
  lineage: The report establishes report-level lineage from reasoning-model-generated thought traces to SFT and an RL stage
    with length penalties, but no item-level prompt-to-trace-to-reward-to-checkpoint lineage is released.
  known_failure_modes:
  - The report provides no post-training prompt dataset, thought-trace records, generator identities, reward implementation,
    or source-level rights information, preventing independent data and feedback audit.
  - Chain-of-thought monitorability claims rely on internal methods and an illustrative trace; raw training or evaluation
    traces are not released for independent verification.
  - Cyber-evaluation comparisons are not strictly apples-to-apples because Gemini 3 Pro receives increased attempt budgets,
    step limits, and tool affordances compared with earlier models.
  - Third-party test prompts, evaluator identity, SME-validation procedure, classifier/rubrics, splits, and reproducible environment
    pins are undisclosed.
  citation_status: verified
  confidence: high
  notes: Evidence is limited to the official Google DeepMind Gemini 3 Pro FSF report and official Gemini API release notes.
    This Track 12 entry records partial disclosure; it does not treat the report as a reusable reasoning-data or post-training
    recipe release.
inclusion_reason: A major-lab frontier safety report that unusually discloses SFT thought traces generated by reasoning models,
  RL length penalties on thoughts, non-thought reward boundaries, agent-evaluation scaffolds, and selected attempt budgets
  while retaining the underlying data, rewards, and artifacts as undisclosed.
