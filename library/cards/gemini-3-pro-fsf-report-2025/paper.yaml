one_line_summary: Google DeepMind's Gemini 3 Pro FSF report discloses model-generated thought traces for SFT, RL length penalties
  on thoughts, high-level guardrails, and concrete evaluation scaffolding, but not the underlying prompts, traces, rewards,
  or reproducibility artifacts.
why_it_matters: 'It makes a closed frontier post-training interface partially auditable: the report separates model-generated
  thought-trace SFT from reward handling and exposes evaluation-budget confounders, while making clear why data, reward, and
  audit reuse remains impossible.'
