- 'needs_versioning: field-level changelog, correction provenance, schema version, and stable IDs across living updates'
- 'needs_record_lineage: per-example source, creator, consent, transformation, license, and derivation mappings where legally
  possible'
- 'needs_release_docs: README and explorer documentation synchronized to the 2025 multimodal scope and a dedicated HF audit
  artifact if HF distribution is intended'
- 'needs_legal_scope: explicit reminder in downstream exports that taxonomy labels are informational and not legal clearance'
