one_line_summary: Releases a human-audited dataset-level catalogue covering 3,916 reported text, speech, and video datasets,
  with source, derivation, creator, representation, license, and source-terms metadata but no per-record provenance.
why_it_matters: For the construction/open-release track, it provides an operational rights and lineage review layer before
  composing reasoning-data mixtures, and shows that permissive dataset labels can conflict with upstream source restrictions.
