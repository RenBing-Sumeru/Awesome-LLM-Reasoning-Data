data_object:
  prompt_source: 15K human-annotated GSM8K and MATH question-solution pairs for augmentation, plus GPT-4 Code Interpreter
    seeds for code-integrated solving and verification.
  trace_author: GPT-4 Code Interpreter writes 81K seed code-integrated solutions and 30K verification rationales; Llama-2-70B
    augmentation, back-translation, and solution-verification models create and select 170K new pairs.
  answer_format: Nested messages contain system, user, and assistant roles; each content list carries typed text, code, and
    execution items, ending with a natural-language or compact final answer.
  process_fields:
  - system and user text
  - assistant natural-language reasoning
  - executable code and recorded execution outputs
  - terminal answer text
  - verification rationale records in the same release
  environment_or_substrate: Solution augmentation, solution-to-question back-translation, Python execution, answer-consistency
    filtering, code-integrated self-verification, SFT, and five-benchmark evaluation.
  verifier_or_reward: Mcode generates code-integrated verification rationales and labels candidate solutions correct or wrong
    after an initial answer-consistency filter; retained labels are model judgments, not kernel proofs.
  terminal_predicate: Reject a generated question when candidate solutions disagree on the answer, then retain only question-solution
    pairs that Mcode verifies as correct with a code-integrated rationale.
recipe_metadata:
  base_model: Llama-2, CodeLlama, Llemma, Mistral, Mixtral, and InternLM2 consumers from 7B to 70B are full-fine-tuned on
    MathGenieData.
  teacher: GPT-4 Code Interpreter creates seed solutions and verification rationales; Llama-2-70B derivatives serve as solution
    augmenter, question back-translator, solver, and verifier.
  generator: Iteratively transform seed solutions, back-translate each augmented solution into a constrained question, generate
    code-integrated solutions, and write verification rationales.
  filtering_rule: Remove questions whose candidate solutions produce inconsistent answers, then discard solutions that Mcode's
    code-integrated verification judges wrong.
  sampling_protocol: Iterative solution augmentation unions outputs from successive rounds; final AugData contains 110K GSM8K-derived
    and 60K MATH-derived pairs.
  rollout_count: null
  temperature: null
  inference_budget: Several specialized 70B-model passes per augmented item, plus code execution and a verification-rationale
    pass; the paper does not consolidate total generation cost.
  optimizer_or_scaffold: AdamW full-parameter SFT, batch 64, cosine schedule, 50 warmup steps, context length 4,096; up to
    32 A800 80GB GPUs for 34B and 70B consumers.
audit:
  source_mixture: 'Official release: 81K GPT-4 code-integrated solutions, 30K GPT-4 code-integrated verification rationales,
    and 170K pipeline-augmented pairs, for about 281K records; AugData is 110K GSM8K-derived plus 60K MATH-derived.'
  split: One anonymous, non-gated 810,337,193-byte JSONL file, `data/mathgenie_train.jsonl`, in the official Hugging Face
    dataset.
  decontamination: The paper uses GSM8K and MATH train data and tests on their held-out sets plus three external sets, but
    reports no broad semantic overlap scan for back-translated questions.
  license: Apache-2.0 on the official dataset and code repositories; GSM8K, MATH, OpenOrca, Alpaca-GPT4, GPT-4 outputs, and
    base-model terms still require lineage-aware review.
  lineage: seed solution -> iterative solution augmentation -> Llama-2 question back-translation -> candidate code-integrated
    solution -> answer-consistency filter -> model-written verification rationale -> accept/reject judgment -> typed JSONL
    demonstration -> SFT consumer.
  known_failure_modes:
  - The verifier's average precision is 82.6%, and MATH precision is 64.5%, so false-positive solutions remain possible.
  - Executable Python and recorded outputs require sandboxing and replay before reuse.
  - The public minimal messages schema does not expose source ID, augmentation round, generator revision, or verification
    score per record.
  citation_status: verified
  confidence: high
  notes: ACL main proceedings and DOI, full paper, official Apache-2.0 dataset and repository, non-gated file, anonymous byte-range
    reads of actual records, nested typed schema, scale, ablations, OpenAlex citations, and current adoption checked on 2026-07-14.
inclusion_reason: MathGenie releases reusable problem-solution and verification-rationale demonstrations and directly tests
  solution-first back-translation, iterative augmentation, filtering, and scale.
