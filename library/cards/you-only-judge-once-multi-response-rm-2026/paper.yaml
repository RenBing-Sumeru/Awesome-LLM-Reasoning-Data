data_object:
  prompt_source: Image prompts and video question-answering prompts paired with multiple candidate responses.
  trace_author: Paid human annotators for MR²Bench-Image and crowdsourced pairwise judgments aggregated for MR²Bench-Video.
  answer_format: Image or video prompt, multiple responses, and a ranking with ties allowed.
  process_fields:
  - prompt
  - image_or_video
  - responses
  - rankings
  environment_or_substrate: Multimodal reward-model evaluation.
  verifier_or_reward: Human rankings and a preference-graph ensemble provide comparison labels.
  terminal_predicate: The reward model ranks candidate responses in agreement with the human ordering.
recipe_metadata:
  base_model: Molmo2-4B or Qwen3-VL-4B reward-model backbones.
  teacher: Human annotators and crowdsourced preference judgments.
  generator: Candidate answers from diverse multimodal models.
  filtering_rule: Video judgments are denoised with a preference-graph ensemble.
  sampling_protocol: Pin the official MR²Bench dataset revision and evaluation split.
  inference_budget: One joint forward pass scores N candidates; the paper studies N from 2 to 16.
  optimizer_or_scaffold: Cross-entropy over scalar response scores; GRPO uses the reward model downstream.
audit:
  source_mixture: Human-ranked image examples and crowdsourced video-QA preference judgments.
  split: MR²Bench-Image has 240 prompts; MR²Bench-Video is derived from 94K pairwise judgments and the dataset release reports
    735 rows.
  decontamination: Keep public benchmark examples separate from reward-model training and report any overlap.
  license: ODC-BY on the official dataset card; proprietary-model outputs and source video terms also apply.
  lineage: arXiv paper, official GitHub code release, and yinuoy/MR2Bench dataset.
  known_failure_modes:
  - Video preference ranking remains difficult and may not transfer to unseen media.
  - Large-N scaling and ranking calibration need separate checks.
