one_line_summary: Rubric Rewards pairs mathematical problems with problem-specific scoring rubrics so a generative reward
  model can penalize trajectory-level logical shortcuts during RL.
why_it_matters: It makes the feedback contract explicit at the whole-trajectory level when final-answer correctness is insufficient
  to detect reasoning shortcuts.
