one_line_summary: AgentChangeBench evaluates 315 banking, airline, and retail goal-shift tasks through simulated tool-use
  episodes and mixed environment/LLM metrics, but its 2,835-sequence mapping and supplementary release remain insufficiently
  pinned for replay or training reuse.
why_it_matters: It separates final task progress, tool validity, repeated actions, and post-shift adaptation instead of collapsing
  an agent episode into pass/fail, while exposing the audit burden created by LLM judges, closed-model simulators, inherited
  public tasks, and unversioned environment artifacts.
