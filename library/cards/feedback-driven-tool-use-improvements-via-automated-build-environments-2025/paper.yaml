one_line_summary: FTRL turns 2,415 synthetic local tool environments into current-policy interaction states scored by executable
  feedback for GRPO or Reinforce++, while leaving sampled trajectories, data rights, and secure paper-exact replay unresolved.
why_it_matters: It exposes a concrete bridge from environment state and tool observations to scalar agent-training reward,
  and it also shows why an official code/data release must be audited for trajectory completeness, verifier brittleness, executable-code
  safety, licensing, and version replay before reuse.
