data_object:
  prompt_source: Image-text and instruction records from 153 public multimodal datasets, manually screened into 58 keep-as-is
    sources, 60 rewrite sources, and 35 discarded sources.
  trace_author: InternVL2-Llama3-76B rewrites non-caption records with visual access; Llama-3-70B-Instruct rewrites caption
    records into task-oriented instruction-response pairs.
  answer_format: An image or image sequence paired with a task-specific instruction and a detailed response containing intermediate
    rationale; video and text-only language records are also represented in the mixture.
  process_fields:
  - source dataset, category, and media reference
  - original instruction, answer, or caption
  - rewritten task instruction and rationale-rich response
  - model-judge relevance, consistency, and accuracy decision
  environment_or_substrate: Static single-image, multi-image, video, and language instruction records packaged in JSON manifests
    and media shards.
  verifier_or_reward: InternVL2-Llama3-76B judges whether each rewritten question-answer pair is relevant to the image, logically
    consistent, and visually accurate, returning Yes or No.
  terminal_predicate: Keep Group A records unchanged; keep Group B rewrites only when the model judge returns Yes; remove
    Group C sources and malformed media.
recipe_metadata:
  base_model: Qwen2.5-7B-Instruct with SigLIP-so400m-patch14-384 and a two-layer MLP projector for the released 8B consumer.
  teacher: InternVL2-Llama3-76B for visual rewriting/filtering and Llama-3-70B-Instruct for caption-derived tasks.
  generator: Apply category-specific prompts to turn terse VQA or captions into complex instructions and detailed rationale-bearing
    responses using only open-weight models.
  filtering_rule: Manually screen 1,000 records per source, reject 35 weak sources, standardize images, and apply a Yes/No
    visual relevance-consistency-accuracy judge to rewritten records.
  sampling_protocol: Group A keeps 58 sources; Group B rewrites 60; final model experiments mix 70% rewritten with 30% original
    data and train on 10M single-image plus 2M one-vision records.
  rollout_count: 1
  temperature: null
  inference_budget: Rewriting and judging 12M records with 70B/76B open models requires substantial compute, but total tokens,
    accelerators, wall time, and energy are not disclosed.
  optimizer_or_scaffold: Three one-epoch stages align the projector on 558k LCS records, tune the full 8B model on 10M single-image
    records, and tune it on 2M disjoint single/multi-image/video records.
audit:
  source_mixture: Ten categories cover Language 16.0%, General 15.4%, Chart 15.4%, OCR 13.7%, Caption 10.9%, Domain-specific
    8.9%, Code/Math 8.3%, Multi-Image 5.8%, Detection 3.2%, and Video 2.5%.
  split: The official release exposes mammoth_si_10M.json and mammoth_ov_2M.json plus single_image_data and multi_image_data
    shards; Stage 3 includes about 1M new single-image examples with no Stage-2 overlap and about 1M multi-image/video examples.
  decontamination: The paper does not report a benchmark-level exact or semantic overlap procedure across the 153 upstream
    datasets and 23 evaluation benchmarks.
  license: Official Hugging Face metadata identifies Apache-2.0 and WebDataset; the 153 upstream datasets and media assets
    retain source-specific terms that require lineage review.
  lineage: Public multimodal datasets are screened and categorized; weak records are rewritten by open models and judged for
    image consistency before being mixed with retained originals.
  known_failure_modes:
  - The same 76B model often writes and filters a record, so correlated visual hallucinations can survive the judge.
  - OCR and chart rewrites have very high rejection rates, revealing weak reliability in precisely the categories that most
    need rationales.
  - Source-license heterogeneity and undisclosed semantic decontamination complicate redistribution and evaluation claims.
  citation_status: verified
  confidence: high
  notes: Full official arXiv HTML, ACL Anthology Main record and DOI, official project/repository, 12M release manifests/shards,
    Apache-2.0 WebDataset metadata, impact signals, and exact ablations were checked on 2026-07-14.
inclusion_reason: MAmmoTH-VL-Instruct-12M publishes rationale-rich multimodal instruction-response records with explicit source
  screening, trace authors, model-judge selection, and staged SFT consumption.
