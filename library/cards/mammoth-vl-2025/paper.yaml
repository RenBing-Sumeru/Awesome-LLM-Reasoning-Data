one_line_summary: MAmmoTH-VL rewrites and filters 153 public multimodal sources into 12M rationale-rich instruction-response
  records using open models.
why_it_matters: It demonstrates a fully open-model path from heterogeneous visual corpora to a training-scale reasoning mixture
  with explicit filtering ablations.
