one_line_summary: HAL standardizes nine agent benchmarks into cost-aware run archives with task evaluator outputs and Weave
  call logs; the paper reports 21,730 rollouts/2.5B tokens, but the mutable 113 GB release lacks a dataset card, license,
  and frozen paper manifest.
why_it_matters: 'HAL shows what an auditable agent-trajectory corpus needs beyond final accuracy: task-linked action/call
  traces, environment and evaluator outputs, cost, errors, success/failure retention, and run lineage. It also demonstrates
  that public logs are not automatically training-ready when rights, privacy, replay, judge calibration, and paper-snapshot
  provenance remain unresolved.'
