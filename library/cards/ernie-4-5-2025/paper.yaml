one_line_summary: ERNIE 4.5 reports a 2.3M-sample LLM SFT corpus, heterogeneous verifier/reward stack, PPO-based progressive
  RL with UPO, and a three-stage VLM SFT-to-RLVR pipeline, but does not release the underlying post-training ledger.
why_it_matters: It is an unusually concrete frontier recipe for combining rule verification, learned judges, pairwise preference
  signals and multimodal environments, while showing where family-level disclosure still falls short of reproducible data
  lineage.
