data_object:
  prompt_source: 'LLM: ten topical domains spanning science and mathematics, coding, logic, information processing, creative
    writing, multilingual, knowledge QA, multi-turn/role play, and safety; VLM: text reasoning corpora, open and proprietary
    K-12 visual STEM, synthetic puzzles/geometry/functions, natural STEM images, UI2Code and Image2Struct. Exact manifests
    are undisclosed.'
  trace_author: 'Mixed: multiple reasoning responses are constructed for some LLM prompts; VLM captions/reasoning trajectories
    are model-generated and filtered, but most generator identities are undisclosed.'
  answer_format: Text answers with optional extended CoT; preference pairs and scalar rewards for LLM RL; image-question answers,
    verified puzzle solutions, and HTML generated from UI images for VLM RLVR.
  process_fields:
  - reasoning_chain
  - multiple_responses
  - preference_pair
  - verifier_score
  - reward_model_score
  - image_or_ui_input
  - generated_html
  - terminal_success
  environment_or_substrate: Rule-verifiable reasoning tasks, reference-guided judging, code sandbox, visual STEM/puzzle tasks,
    and a UI2Code renderer that compares generated-HTML renderings with reference images.
  verifier_or_reward: 'Unified LLM reward system: rule verifier, reference-guided LLM-as-judge, sandbox, RDRM, checklist-aware
    verifier, GRM and DRM; VLM uses answer verifiers, dual-LLM puzzle judging, UI rendering similarity, and a Bradley-Terry
    multimodal reward model.'
  terminal_predicate: 'Task-dependent: reference/rule correctness, executable code success, both puzzle judges positive, or
    rendered-UI visual fidelity; open-ended tasks use learned reward models.'
recipe_metadata:
  base_model: ERNIE 4.5 heterogeneous multimodal MoE family; text parameters produce ERNIE-4.5 LLMs and full multimodal parameters
    produce ERNIE-4.5-VL.
  teacher: unknown (the report describes model-generated captions/traces and text-only/VLM validation but does not identify
    most teacher checkpoints)
  generator: ERNIE-family policy/generator models for online sampling and VLM rejection sampling; exact checkpoints are mostly
    undisclosed.
  filtering_rule: LLM RL removes verifier prompts with accuracy 0 or 1 and low within-group reward variance, then normalizes
    rewards per source/domain. VLM keeps recaptions only when repeated text-only inference is consistently correct, removes
    OCR-solvable samples, applies agent/rule logic filters, and uses verifier-backed rejection sampling.
  sampling_protocol: Multiple responses per reasoning query; online-UPO rejection sampling or offline pre-generated pairs;
    VLM rejection sampling with successful trajectories recycled into SFT.
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: 'LLM: SFT then PPO-based three-stage PRL plus online/offline UPO (DPO loss inside PPO). VLM: three-stage
    SFT, then GRPO hybrid RLVR/RLHF with dynamic sampling and overlong filtering.'
audit:
  source_mixture: Partially disclosed by topical/task families; VLM includes open and proprietary K-12 sources, but item-level
    manifests and proportions are not published.
  split: unknown
  decontamination: unknown
  license: Official model weights and ERNIE repository are Apache-2.0; rights/licenses for the underlying SFT, preference,
    reward-model, proprietary K-12 and RL records are undisclosed.
  lineage: Report connects SFT, reward and RL stages at family level, but does not publish item-level lineage or a per-variant
    post-training manifest.
  known_failure_modes:
  - Mixed rule/judge/reward signals can have incompatible scales; the report mitigates this with per-source/domain normalization
    but does not publish calibration data
  - Online rejection-sampled preferences and learned judges can encode policy- or judge-specific bias
  - Proprietary K-12 inputs and unreleased post-training records limit auditability and exact reproduction
  - Family-level methods do not establish the exact data/objective allocation for every released variant
  citation_status: verified
  confidence: high
  notes: Official report, release, repo, and official weight page checked; training claims above come from report pp.14-19.
inclusion_reason: A detailed frontier-model disclosure of how reasoning/non-reasoning SFT, heterogeneous reward systems, preference
  optimization and multimodal RLVR are combined, while exposing important release and lineage gaps.
