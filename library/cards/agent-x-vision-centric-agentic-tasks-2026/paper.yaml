data_object:
  prompt_source: Human-authored vision-centric tasks with images, multi-image comparisons, video, and text instructions.
  trace_author: LMM-generated tool-use traces refined and manually reviewed by benchmark annotators.
  answer_format: Multimodal task, available-tool metadata, stepwise decisions, tool calls, intermediate outputs, and final
    answer.
  process_fields:
  - query
  - visual_context
  - tools
  - reasoning_steps
  - tool_calls
  - intermediate_outputs
  - answer
  environment_or_substrate: Vision-centric agent environments for web, surveillance, autonomous driving, sports, mathematics,
    and visual reasoning.
  verifier_or_reward: Step-by-step, full-chain, and outcome evaluation using GPT-4 and Qwen-15B judges in the reported protocol.
  terminal_predicate: Task success with correct tool use and a logically coherent completed chain.
recipe_metadata:
  base_model: Use the official Agent-X evaluation and integrated tool-server setup.
  teacher: Candidate queries and traces are generated by an LMM, then refined and reviewed by human annotators.
  generator: Vision-language model query and trace generation with the released tool environment.
  filtering_rule: Human review checks task clarity, solvability, trace consistency, and correctness.
  sampling_protocol: Use the official dataset release, tool metadata, and repository evaluation scripts.
  inference_budget: Model-specific settings are defined in the official evaluation scripts.
  optimizer_or_scaffold: Tool-use trajectory generation and three-mode process evaluation.
  rollout_count: null
  temperature: null
audit:
  source_mixture: Authentic visual contexts, human-authored tasks, LMM-generated traces, human review, and tool metadata.
  split: 828 tasks across six vision-centric domains.
  decontamination: Keep held-out Agent-X tasks and tool traces outside agent training when reporting benchmark performance.
  license: Refer to the official repository and Hugging Face dataset card for their terms.
  lineage: ICLR 2026 paper, official MBZUAI Oryx GitHub repository, and official Agent-X dataset page.
