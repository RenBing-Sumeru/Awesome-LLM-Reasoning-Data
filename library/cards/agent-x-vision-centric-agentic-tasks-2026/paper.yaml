one_line_summary: Agent-X provides 828 human-reviewed multimodal tool-use tasks with stepwise traces and judges that score
  local decisions, full-chain reasoning, and final success separately.
why_it_matters: It exposes agent failures that final task success alone cannot localize, especially where vision context and
  tool choice interact.
