one_line_summary: PRISM links 1,500 participants’ stated preferences and profiles to fine-grained ratings in 8,011 live conversations
  with 21 LLMs.
why_it_matters: It makes the question of which humans provide alignment data empirically auditable rather than collapsing
  disagreement into one reward.
