data_object:
  prompt_source: Participant-authored opening prompts in unguided, values-guided, and controversy-guided conversations.
  trace_author: 1,500 surveyed participants interact live with a backend of 21 LLMs.
  answer_format: Conversation trees, 1–100 cardinal ratings, fine-grained feedback, participant survey profiles, and metadata
    flags.
  process_fields:
  - user_id
  - conversation_id
  - conversation_history
  - utterance_score
  - survey_profile
  - feedback
  - metadata
  environment_or_substrate: Live multi-turn participant–LLM conversations.
  verifier_or_reward: Participant ratings and fine-grained feedback; four models are rated initially and highest-rated model
    continues.
  terminal_predicate: A released survey, conversation, utterance, or metadata record subject to terms of use.
recipe_metadata:
  base_model: 21 open-access and commercial LLMs in the PRISM interface
  teacher: Participatory human raters
  generator: Live participant prompts and LLM responses
  filtering_rule: Ethics-approved collection, PII/moderation metadata, and documented release processing
  sampling_protocol: 1,500 participants born in 75 countries; 1,396 reach conversation stage; 8,011 trees and 68,371 rated
    utterances
  rollout_count: 4
  temperature: non-deterministic for post-first-turn A/B responses
  inference_budget: 2–22 turns per conversation
  optimizer_or_scaffold: Participatory, representative, and individualized human-feedback analysis
audit:
  source_mixture: Survey profiles and live ratings from global participants, UK/US representative samples, 21 LLM backends.
  split: Survey, conversations, utterances, and metadata JSONL releases; inspect current HF revision.
  decontamination: Audit conversation/utterance overlap and prevent re-identification through linked survey information.
  license: Prompts CC-BY-4.0; model responses CC-BY-NC-4.0 and subject to original provider terms.
  lineage: NeurIPS 2024 paper, official OpenReview, GitHub, project page, and Hugging Face dataset.
  known_failure_modes:
  - Representative samples do not encode every perspective
  - Individualized feedback must not become a universal reward
  - Linked profiles create privacy and re-identification risks
