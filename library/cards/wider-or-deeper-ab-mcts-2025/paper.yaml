one_line_summary: AB-MCTS allocates a fixed inference budget between fresh response branches and feedback-conditioned revisions,
  producing scored answer trees that released code can persist even though the paper's realized trees are not public.
why_it_matters: It turns test-time compute into an auditable trace schema—prompts, candidate answers, revisions, scores, tree
  edges, and budgets—while showing why open algorithms alone are insufficient without raw trees, rejected branches, evaluator
  context, and stable API revisions.
