status: partial
one_line_summary: AgentTrek mines and structures RedPajama tutorials, executes them through GPT-4o-guided BrowserGym replay
  on 127 sites, and filters trajectories with a GPT-4o evaluator for GUI-agent SFT.
why_it_matters: It demonstrates a scalable bridge from procedural web text to grounded agent behavior while exposing why judge
  semantics, live-site drift, rejected data, source rights, privacy, unit mapping, and release manifests determine whether
  an open trajectory dataset is auditable.
