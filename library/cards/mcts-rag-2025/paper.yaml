data_object:
  prompt_source: ComplexWebQA multi-hop web questions, GPQA science questions, and FoolMeTwice fact-checking claims are used
    for the paper evaluation. The official repository bundles 100 CWEBQA, 100 GPQA, and 200 FMT input records, but does not
    publish an immutable row-to-table run manifest.
  trace_author: Qwen2.5-7B and Llama 3.1-8B generate the paper's reasoning trajectories. The public retrieval implementation
    additionally hard-codes GPT-4o for retrieval-query generation; whether that helper and the public retrieval stack exactly
    match every reported paper run is unknown.
  answer_format: Search nodes contain direct answers, quick-reasoning steps, decomposed subquestions and subanswers, retrieval-conditioned
    reasoning, or summaries. Runtime JSON can serialize terminal solution traces and one rollout node per rollout; benchmark
    answers are short-form CWEBQA answers, GPQA multiple-choice labels, and FMT yes/no judgments.
  process_fields:
  - source question and benchmark reference answer
  - MCTS action type among A1-A6
  - generated reasoning step or subquestion/subanswer
  - retrieval query and retrieved context embedded in generated trace text
  - per-node model-likelihood or self-consistency value
  - rollout identifier
  - runtime Q, N, V, and UCT statistics in optional text-tree output
  - terminal candidate answer and answer-cluster score
  - paper-level token and relative-latency aggregates
  environment_or_substrate: The paper interleaves six reasoning/retrieval actions in UCT-guided MCTS. Its reported setup uses
    Bing Search and LangChain, top-10 retrieved documents, maximum search depth 5, and at most two subquestions. The public
    code instead exposes Cohere/Azure/FAISS paths with unconfigured credentials and index locations, so the exact paper retrieval
    environment is not replayable from the repository alone.
  verifier_or_reward: At an action, K completions are grouped by answer equivalence; majority-cluster frequency supplies confidence
    and mean log-likelihood within that cluster supplies the reward backed up into Q and N. Final answers are grouped by semantic
    consistency and ranked by normalized accumulated trajectory reward. This is self-consistency/model scoring, not an independent
    factual verifier.
  terminal_predicate: A branch terminates when it yields a valid answer node or reaches the configured depth/preset limit.
    After search, the highest-scoring semantically grouped candidate answer is selected; gold answers are used only for benchmark
    evaluation.
recipe_metadata:
  base_model: Qwen2.5-7B and Llama 3.1-8B in the reported experiments.
  teacher: No parameter-training teacher is used because the method is inference-only. The public retrieval code uses GPT-4o
    as a retrieval-query helper, but the paper does not disclose a complete paper-run helper-model contract.
  generator: The selected 7B/8B model expands MCTS nodes with direct-answer, quick-reasoning, decomposition, retrieval-reasoning,
    retrieval-decomposition, and summary actions. Public code can emit terminal solution traces, per-rollout traces, optional
    potential-answer histories, and optional text trees.
  filtering_rule: Retrieval can be skipped when the current context is judged sufficient; candidates with abnormally low consistency
    can be pruned. The paper does not disclose numeric retrieval-necessity, similarity, or early-error thresholds.
  sampling_protocol: The paper's main setup uses four rollouts, maximum depth 5, at most two subquestions, concurrent action
    expansion, and top-10 documents per retrieval. The rollout ablation evaluates 4, 8, 12, and 16 rollouts.
  rollout_count: 'Paper main setting: 4; ablations: 8, 12, and 16. The public example script uses 16, while the Python parser
    default is 15.'
  temperature: unknown
  inference_budget: The paper reports 11,892 average generated tokens and 2.8x Standard-RAG latency at four rollouts for Qwen2.5-7B,
    rising to 28,972 tokens and 4.5x latency at 16 rollouts. It does not release per-example token, retrieval-call, wall-clock,
    hardware, or monetary-cost logs.
  optimizer_or_scaffold: UCT-guided inference-time MCTS with concurrent action expansion, model-gated retrieval skipping,
    candidate-consistency pruning, reward backpropagation, and reward-weighted answer voting; it is not a parameter-training
    optimizer.
audit:
  source_mixture: 'The paper describes about 100K Bing snippets for CWQA; 80K Wikipedia passages plus 60K Bing documents for
    GPQA; and about 30K benchmark-associated passages for FMT. The official repository instead bundles small evaluation inputs:
    100 CWEBQA records, 100 GPQA records, 200 FMT records, and 200 ScienceQA records. It does not release the paper retrieval
    corpora as immutable snapshots.'
  split: Repository files are named `test_all` or `test_all_with_evidence`. Exact upstream split selection, sample IDs used
    for every reported table, row-level result joins, and a deterministic paper-run manifest are undisclosed.
  decontamination: unknown
  license: The ACL paper is CC BY 4.0 and the repository code has an MIT license. The repository does not provide a consolidated
    per-dataset license/provenance card for bundled benchmark-derived inputs, retrieval corpora, or generated model outputs;
    those reuse rights remain source-dependent.
  lineage: Evaluation prompt and optional bundled evidence -> one of six MCTS reasoning/retrieval actions -> generated query
    and external retrieval -> reflection/integration into a reasoning node -> model-likelihood/self-consistency value -> UCT
    selection and reward backup -> terminal candidate traces -> semantic answer grouping and reward-weighted vote. The official
    release stops at code and small benchmark inputs; instantiated paper-run trees and result lineage are absent.
  known_failure_modes:
  - Early retrieval errors can be amplified through later search iterations and dominate the selected answer.
  - Semantic mismatches between retrieved passages and reasoning can cause factual confusion or hallucination.
  - Excess retrieval can overload the model and divert a branch from the original question.
  - Deep trees and multiple retrieval calls increase latency; heuristic A1-A6 action choice is not adaptive to every query.
  - The paper reports unnecessary branch expansion and lacks confidence-based or early-error-aware pruning.
  - The repository releases generator/discriminator code but no committed paper-run run_outputs, raw trees, terminal-trace
    bundle, or record-level result archive.
  - Runtime Final Solutions.json contains terminal solution nodes and Rollout Solutions.json one node per rollout; neither
    is a structured archive of every node and branch.
  - No paper-run structured query/document/rank/URL, reflection-decision, or retrieval-state ledger is released.
  - Confidence, survival, combined selector scores, and Q/N/V/UCT statistics are computed at runtime but no paper-run score
    bundle is released.
  - No paper-run seeds, configs, per-example budget logs, retrieval-call counts, latency logs, hardware ledger, or cost ledger
    are committed.
  - The public retrieval implementation requires external Cohere/Azure credentials and unshipped FAISS/evidence paths, hard-codes
    a GPT-4o query helper, and does not reproduce the paper's stated Bing/LangChain setup from a pinned environment.
  - Paper-run decoding temperature is undisclosed; the public example script uses 0.1, the common parser defaults to 0.4,
    and rollout defaults also differ from the paper's main four-rollout setting.
  - No explicit benchmark/pretraining overlap or search-time contamination analysis is reported.
  citation_status: verified
  confidence: medium
  notes: The accepted ACL paper and complete appendix, arXiv record, and official repository main commit 3b4c64ebc8192916c9e671ba7e97f18d1f7b9d74
    were checked on 2026-07-25. Citation identity, code, repository data files, and runtime writers are verified. Release
    completeness and exact paper/public-code execution parity remain partial.
inclusion_reason: MCTS-RAG is a concrete inference-time search-data recipe that interleaves reasoning and retrieval, assigns
  model-derived values to branches, and exposes rollout/latency trade-offs. It is especially useful for auditing the distinction
  between code capable of generating traces and paper-run search data actually released.
