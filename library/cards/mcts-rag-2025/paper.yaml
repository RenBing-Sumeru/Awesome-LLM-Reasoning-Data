status: partial
one_line_summary: MCTS-RAG interleaves six reasoning and retrieval actions in UCT-guided search, but releases code and benchmark
  inputs rather than the paper-run trees, score traces, retrieval states, or budget logs.
why_it_matters: It makes adaptive retrieval a branch-level test-time decision and quantifies rollout-cost scaling, while showing
  why a generator repository is not equivalent to an auditable release of generated search trajectories.
card: null
card_recommendation: 'High-priority L4 Card candidate: center the Card on the runtime trace/reward contract, the absence of
  raw paper-run trees and selector/budget logs, and the unresolved mismatch between the paper retrieval setup and public code.
  Do not describe this work as an open search-trace dataset.'
