    labels.
  terminal_predicate: The parsed final answer matches the dataset's gold answer under the task-specific checker.
recipe_metadata:
  base_model: GPT-J 6B for the reported CommonsenseQA experiment; other experiments use paper-specified models.
  teacher: The same current model supplies ordinary and answer-conditioned rationales.
  generator: Generates rationales, keeps those yielding correct answers, rationalizes failed questions while conditioning
    on the gold answer, fine-tunes, and repeats.
  filtering_rule: Exact or task-specific answer correctness filters traces; intermediate reasoning steps receive no direct
    labels.
  sampling_protocol: Sample a rationale and answer for each training question, retain correct traces, and rationalize failures
    with the gold answer.
  rollout_count: null
  temperature: null
  inference_budget: One ordinary rationale sample per question plus one answer-conditioned retry for failures in each training
    round.
  optimizer_or_scaffold: Iterative SFT on accepted ordinary and answer-conditioned rationale traces.
