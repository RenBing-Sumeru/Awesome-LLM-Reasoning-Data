one_line_summary: HelpSteer3-Preference is a CC-BY-4.0 human-annotated, multilingual and specialist preference dataset for
  reward modeling and RLHF.
why_it_matters: It specifies specialist recruitment, multi-annotator preference strength, disagreement filtering, multilingual
  coverage, and the release boundary needed to reuse preference data responsibly.
