data_object:
  prompt_source: General/STEM prompts from WildChat-1M; code and multilingual prompts from ShareGPT, sampled by topic, complexity,
    and language.
  trace_author: 17 commercially permissible LLMs generate two responses; specialist human annotators compare the final assistant
    turn.
  answer_format: Multi-turn context, response 1, response 2, 7-way preference strength (-3 to +3 plus neither valid), and
    short annotator justification.
  process_fields:
  - context
  - two model responses
  - task/language subset
  - 3-5 ratings
  - justifications
  - agreement
  - overall preference
  environment_or_substrate: General, STEM, code, and multilingual dialogue contexts capped at 2,000 words.
  verifier_or_reward: Independent specialist human preferences; overall score is the rounded mean of the three most agreeing
    ratings.
  terminal_predicate: A retained pair has valid responses and three sufficiently agreeing annotations; ties are released but
    excluded from RM training.
recipe_metadata:
  base_model: Llama-3.3-70B-Instruct reward-model backbone.
  teacher: Specialist annotators managed by Scale AI (General/STEM/Code) and Translated (Multilingual).
  generator: 17 released/permissively usable models generate paired responses.
  filtering_rule: Remove neither-valid cases and outliers; exclude cases with disagreement greater than 2 among three most
    agreeing ratings.
  sampling_protocol: 40,476 samples; 3-5 independent annotations; 6,400+ annotators across 77 countries/regions.
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: Scaled Bradley-Terry reward modeling, generative reward models, and RLHF policy alignment.
audit:
  source_mixture: WildChat-1M and ShareGPT prompts with outputs from 17 models; unsafe/PII/bias content is filtered.
  split: Verify dataset card splits before training/evaluation use.
  decontamination: WildChat/ShareGPT provenance and downstream RM-Bench/JudgeBench overlap require audit.
  license: Dataset is CC-BY-4.0; upstream prompt/source licenses are separately documented and must be respected.
  lineage: 'Primary source: https://arxiv.org/abs/2505.11475'
  known_failure_modes:
  - Preference is subjective despite high agreement.
  - Vendor and specialist selection may shift values across domains/languages.
  - Filtered unsafe cases limit direct safety coverage.
  citation_status: verified
  confidence: high
  notes: Primary paper HTML and official dataset/project links reviewed.
