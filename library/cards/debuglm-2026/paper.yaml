one_line_summary: DebugLM augments ordinary post-training records with dataset-level provenance and quarantine labels so a
  trained model can self-report a source tag or selectively refuse source-associated behavior.
why_it_matters: It is a concrete construction pattern for carrying source identity through post-training into deployment-time
  diagnosis, while exposing the audit gap between a trained self-report and independently replayable lineage.
