one_line_summary: GLM-5 combines a 28.5T-token base pipeline with multi-task SFT, reasoning/agentic/general RL, cross-stage
  distillation, and 10K+ executable SWE plus terminal/search environments, while releasing weights and slime infrastructure
  but not the training records, exact mixtures, budgets, or safety ledger.
why_it_matters: The report makes the frontier agent-training stack unusually legible—from issue/PR and web sources through
  executable environments, token-correct asynchronous rollouts, judges and rewards to long-horizon evaluation—yet also shows
  how much provenance, calibration, licensing, and record-level auditability remains missing even for an open-weight release.
