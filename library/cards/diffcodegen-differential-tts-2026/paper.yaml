one_line_summary: DiffCodeGen uses coverage-guided differential testing to select among diverse code candidates with almost
  no extra LLM-token cost beyond candidate generation.
why_it_matters: It turns the behavioral agreement of independently generated programs into an inexpensive verifier and shifts
  test-time budget from model calls to executable analysis.
