data_object:
  prompt_source: Natural-language code-generation tasks evaluated on LiveCodeBench.
  trace_author: Any code LLM generates multiple candidate programs through sampling, beam search, or prompt perturbation.
  answer_format: Programming prompt, candidate programs, fuzzed inputs, candidate execution outputs, behavior clusters, selected
    medoid, and benchmark pass result.
  process_fields:
  - prompt
  - candidates
  - generation_strategy
  - fuzz_inputs
  - coverage
  - execution_outputs
  - behavior_distance
  - cluster
  - selected_candidate
  environment_or_substrate: Coverage-guided fuzzing and dynamic execution of generated programs or library functions.
  verifier_or_reward: A pseudo-oracle based on behavioral consensus across candidates; official evaluation uses benchmark
    tests for pass@1.
  terminal_predicate: The selected program passes the hidden LiveCodeBench evaluation tests.
recipe_metadata:
  base_model: Four open-weight and proprietary code LLMs; exact model list is reported in the official paper.
  teacher: Not applicable for candidate selection; an optional single LLM call can generate a fuzz driver for library functions.
  generator: Candidates are produced by stochastic sampling, beam search, or 18 semantic-preserving prompt perturbations.
  filtering_rule: Coverage-guided fuzzing generates valid inputs, candidates are clustered by dynamic behavior, and the medoid
    of the largest cluster is returned.
  sampling_protocol: Temperature 0.7 and nucleus p 0.95 for repeated sampling; alternatives are beam search and prompt perturbations.
  rollout_count: Varies by differential-generation method and candidate count in the paper.
  temperature: 0.7 for stochastic sampling.
  inference_budget: Initial candidate generation plus no LLM calls for standard selection; library fuzz-driver generation
    may use one additional model call.
  optimizer_or_scaffold: AFL++ or py-afl for script fuzzing, libFuzzer or Atheris for library fuzzing, then distance-based
    behavior clustering.
audit:
  source_mixture: Official arXiv paper.
  split: LiveCodeBench evaluation; exact task and split protocol is described in the paper.
  decontamination: The method does not rely on public task tests for selection, but benchmark contamination is not formally
    audited.
  license: Validate the fuzzer, framework, model, and benchmark licenses before reuse.
