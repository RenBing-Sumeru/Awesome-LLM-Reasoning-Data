one_line_summary: Nemotron-CrossThink builds a 588,645-prompt multi-domain RLVR mixture with template and answer-space filters,
  releases 287,376 synthetic QA/math prompt records, and trains Qwen2.5 policies with exact answer-plus-format GRPO rewards.
why_it_matters: For frontier_reports_data_disclosure_ledger, it is a concrete case where the paper, public synthetic subsets,
  reward formula, blend study, and training settings are visible, while the exact mixed training manifest, online rollout/reward
  lineage, and record-level provenance remain incomplete.
