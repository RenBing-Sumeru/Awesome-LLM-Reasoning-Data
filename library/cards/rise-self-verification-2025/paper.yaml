one_line_summary: RISE jointly trains Qwen2.5 reasoning and self-verification trajectories with rule-based math outcome rewards,
  while only the verification score—not the prose critique—is checked against correctness.
why_it_matters: It is a concrete RLVR recipe with accepted venue and code, but its public disclosure still leaves data manifests,
  verifier coverage, leakage checks, and complete reproducibility details unresolved.
