  rejection-sampled reasoning, and SFT/DPO, while withholding reusable data, reward, lineage, and audit artifacts.
why_it_matters: 'It is a concrete frontier disclosure case: source categories and pipeline interfaces are reported, but enough
  prompt-, filter-, reward-, and provenance-level detail is absent that the model release and agent capability cannot be treated
  as a reproducible reasoning-data recipe.'
