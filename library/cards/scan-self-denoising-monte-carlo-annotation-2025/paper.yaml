data_object:
  prompt_source: MATH training questions with gold answers.
  trace_author: Model-generated mathematical solution trajectories.
  answer_format: Question, ordered reasoning steps, and one correctness score per step.
  process_fields:
  - question
  - steps
  - scores
  environment_or_substrate: Mathematical chain-of-thought reasoning.
  verifier_or_reward: Selective Monte Carlo step annotation with self-confidence-based denoising.
  terminal_predicate: Whether sampled continuations reach the gold answer.
recipe_metadata:
  base_model: Qwen2.5-Math-1.5B-Instruct; SCAN-Pro also uses Qwen2.5-Math-7B-Instruct and Llama-3.2-3B-Instruct.
  teacher: Monte Carlo completer models rather than a human or external judge.
  generator: The annotation model generates solution trajectories from MATH questions.
  filtering_rule: Retain high-self-confidence positives and selectively annotate informative negative trajectories.
  sampling_protocol: Use the released SCAN-Pro training split and report rollout settings.
  inference_budget: Eight rollouts per step in the reported SCAN-Base construction.
  optimizer_or_scaffold: Self-confidence reweighting and noise-tolerant labels near the predicted first error.
  rollout_count: Eight per step for the reported base construction.
  temperature: null
audit:
  source_mixture: MATH questions, model-generated reasoning steps, Monte Carlo scores, and self-confidence values.
  split: Official SCAN-Pro default train split with 197K rows.
  decontamination: Training on the release can contaminate ProcessBench and best-of-N comparisons; keep held-out evaluation
    separate.
  license: Apache-2.0 on the Hugging Face dataset and official repository.
  lineage: NeurIPS 2025 paper, author project page, official GitHub repository, and SCAN-Pro dataset page.
  known_failure_modes:
  - Monte Carlo labels inherit completer-model error
  - The corpus is restricted to mathematical reasoning
  - Label quality depends on rollout and confidence settings
