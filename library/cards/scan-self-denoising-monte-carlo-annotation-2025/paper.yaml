one_line_summary: SCAN-Pro releases 197K mathematical trajectories with step scores, using confidence-guided Monte Carlo denoising
  for robust PRM training.
why_it_matters: It makes the annotation noise model and the released step-score records explicit enough to reproduce a scalable
  PRM-training pipeline.
