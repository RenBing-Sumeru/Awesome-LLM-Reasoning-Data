recipe_metadata:
  base_model: Qwen2.5-Math-7B with additional scale/backbone checks
  teacher: LIMO expert solutions, including DeepSeek-R1/QwQ-derived solutions
  generator: Current policy conditioned on question and optional expert prefix
  filtering_rule: Prefix-augment zero-pass expert samples; exclude current-step 0%/100% pass samples and next-epoch solved
    samples; weight by EMA progress
  sampling_protocol: Roll out, measure pass rate, sample 30%-80% complete-line prefix for unsolved expert examples, re-roll
    out, update EMA, weight advantages, curate active set
  rollout_count: 32
  temperature: 1.0
  inference_budget: 5K prompt and response tokens; 32 rollouts; 300 steps
  optimizer_or_scaffold: GRPO plus Prefix-Guided Sampling and Learning-Progress Weighting
