one_line_summary: Phi-4 releases MIT model weights and reports a 9.8T-token synthetic-heavy pipeline, 8B-token SFT, 250,297
  token-local DPO examples, and about 850K judge-guided pairs, but no training corpus or stage-to-record lineage.
why_it_matters: It lets frontier-report readers separate report-level data disclosure, released weights, unavailable training
  records, mixed verifier and judge contracts, and downstream benchmark behavior instead of treating them as one evidence
  claim.
