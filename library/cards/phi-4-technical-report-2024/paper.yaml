- 'needs_source_ledger: disclose source names, revisions, proportions, licenses, attribution, collection dates, transformations,
  and final 9.8T-token mixture weights'
- 'needs_generator_ledger: identify generator and evaluator checkpoints, prompts, decoding settings, seeds, candidate counts,
  costs, and per-family acceptance rates'
- 'needs_pts_replay: publish oracle implementations, success-probability thresholds, rollout budgets, memoized estimates,
  token pairs, failures, and false-accept audits'
- 'needs_judge_audit: release GPT-4o pair prompts, order randomization, raw scores, disagreements, rejection reasons, and
  bias/calibration analysis'
- 'needs_decontamination: publish benchmark revisions, exact thresholds, matched and removed records, semantic-overlap checks,
  and a corpus-wide audit'
- 'needs_run_manifest: map source records and post-training pairs to exact training stages, checkpoints, mixture weights,
  optimizer settings, and immutable software revisions'
