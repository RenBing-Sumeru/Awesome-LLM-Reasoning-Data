data_object:
  prompt_source: '200 representative failed episodes: 100 ALFWorld, 50 WebShop, and 50 GAIA, selected after human analysis
    of more than 500 failed trajectories.'
  trace_author: LLM-agent rollouts from the three environments, then decision-step annotations by ten graduate annotators
    with NLP/LLM-agent experience.
  answer_format: Episode with task and environment trajectory, per-step memory/reflection/planning/action content, taxonomy
    labels, minimal critical root cause, evidence, actionable feedback, and recovery outcome.
  process_fields:
  - task_type
  - task_description
  - trajectory_steps
  - observation
  - memory
  - reflection
  - plan
  - action
  - module_error_type
  - critical_step
  - critical_failure_module
  - evidence
  - corrective_feedback
  - episode_outcome
  - rerollout_outcome
  environment_or_substrate: Vendored ALFWorld, WebShop, and GAIA adapters plus multi-provider LLM engines, trajectory collection,
    and step-to-episode conversion.
  verifier_or_reward: Environment task success is the terminal signal. Fine-grained error types, earliest/minimal root cause,
    evidence, and corrective feedback require annotator or LLM judgment under the 17-type taxonomy.
  terminal_predicate: ALFWorld/WebShop/GAIA success for the original or re-rolled episode, otherwise failure after the configured
    maximum debugging attempts.
recipe_metadata:
  base_model: GPT-4.1 at temperature 0 is reported for critical-error detection experiments; the repository supports several
    provider backends and rollout models.
  teacher: Human annotations define AgentErrorBench targets; AgentDebug uses LLM analysis and feedback generation rather than
    a disclosed teacher checkpoint.
  generator: 'Environment rollouts, ten expert annotators for the benchmark, and a three-stage AgentDebug loop: module analysis,
    critical-error detection, and feedback-conditioned re-rollout.'
  filtering_rule: Curate representative failures and label every decision step; select the minimal root-cause set instead
    of exhaustively preserving all downstream symptoms.
  sampling_protocol: More than 500 failures were analyzed and 200 retained. The exact sampling frame, provider/model mixture,
    selection yields, and benchmark revision are unknown.
  rollout_count: 200 annotated benchmark episodes; more than 500 failures were examined during taxonomy development.
  temperature: 0 for the reported GPT-4.1 critical-error detector; rollout temperatures otherwise unknown.
  inference_budget: Recovery attempts are token-matched to baselines in experiments, but the reusable per-episode attempt
    budget and complete retry histories are not specified as a data release contract.
  optimizer_or_scaffold: No policy optimizer; post-hoc diagnosis and iterative feedback-conditioned re-execution.
audit:
  source_mixture: 100 ALFWorld, 50 WebShop, and 50 GAIA selected failures; the generating model/provider mixture and selection
    denominator by environment are unknown.
  split: No immutable train/dev/test manifest was verified for the released 200 episodes.
  decontamination: unknown
  license: Repository code is MIT. The Google Drive dataset is officially linked, but a dataset-specific licence and upstream
    compatibility matrix were not verified.
  lineage: environment task -> failed rollout -> per-step/module annotation -> minimal critical root -> evidence and corrective
    feedback -> feedback-conditioned re-rollout -> environment outcome
  known_failure_modes:
  - The 200 representative failures are not a population sample and cannot support prevalence estimates.
  - Module-level Cohen's kappa of 0.55 shows material annotation variability despite training and adjudication.
  - Root-cause labels depend on causal/counterfactual judgment and may change with prompts, model, reset behavior, and tool
    state.
  - The paper's algorithm describes LLM critical-error detection while adjacent prose discusses counterfactual testing; released
    implementation semantics should be checked explicitly.
  - Environment and provider revisions can prevent exact replay.
  - Dataset licence, immutable revision, checksums, split manifest, and upstream rights remain unverified.
  - Recovery gains do not prove every taxonomy label or feedback item is correct.
  citation_status: verified
  confidence: high
  notes: Official paper, MIT repository, and repository-linked AgentErrorBench Google Drive were checked. Artifact availability
    does not resolve dataset licence or replay metadata.
inclusion_reason: A concrete failure-trace taxonomy and trace-to-root-cause-to-feedback audit pipeline.
