one_line_summary: AgentErrorBench releases 200 annotated failed ALFWorld, WebShop, and GAIA episodes with a 17-type taxonomy,
  minimal root causes, and feedback, while annotation agreement and replay metadata remain material audit limits.
why_it_matters: It turns failed agent rollouts into structured supervision for step/module detection, causal localization,
  feedback generation, and recovery, preserving the distinction between environment success and judgment-based diagnosis.
