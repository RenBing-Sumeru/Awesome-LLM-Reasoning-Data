one_line_summary: Planetarium pairs four textual descriptions with planning problems and uses object-renaming-aware PDDL equivalence
  to distinguish solvable outputs from semantically correct ones.
why_it_matters: It shows that executable plans can encode the wrong problem and makes semantic verification directly reusable
  for text-to-PDDL training and evaluation.
