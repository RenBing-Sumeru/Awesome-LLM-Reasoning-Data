one_line_summary: ContextualJudgeBench supplies 2,000 context-dependent response pairs that test whether LLM judges apply
  conditional factuality, completeness, refusal, and conciseness criteria.
why_it_matters: It makes explicit the evidence and conditional criteria a judge must use, rather than scoring isolated answers.
