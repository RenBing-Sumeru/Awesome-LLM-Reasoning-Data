one_line_summary: Shepherd turns agent execution into a reversible Git-like trace and uses meta-agent-selected forks for Tree-GRPO,
  while leaving generated trajectories, checkpoints, splits, and data-governance artifacts unreleased.
why_it_matters: It exposes the state, action, environment, branch, and reward relationships needed for auditable long-horizon
  agent supervision, while showing that rollback guarantees and dataset release guarantees are separate questions.
