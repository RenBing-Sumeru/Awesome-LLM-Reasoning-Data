data_object:
  prompt_source: MATH500, AMC23, and AIME24 prompts.
  trace_author: Qwen2.5 and Llama policy models generate short first-stage partial trajectories and selectively continued
    branches.
  answer_format: Prompt, partial branches, process-reward scores, difficulty indicator, easy/hard label, retained or expanded
    branches, final answer, and exact-match correctness.
  process_fields:
  - prompt
  - partial_trace
  - prm_score
  - difficulty_indicator
  - branch_action
  - final_answer
  - correctness
  - latency
  - token_count
  environment_or_substrate: Streaming batch-1 inference on NVIDIA A100-SXM4-40GB, with additional A5000 evaluation.
  verifier_or_reward: Qwen2.5-Math-PRM-7B or Llama3.1-8B PRM scores partial trajectories.
  terminal_predicate: Benchmark exact-answer accuracy.
recipe_metadata:
  base_model: Qwen2.5-1.5B-Instruct, Qwen2.5-3B-Instruct, and Llama3.2-3B-Instruct.
  teacher: Not applicable; an external process reward model guides the search.
  generator: THROW combines short parallel sampling with PRM-guided branch truncation or expansion.
  filtering_rule: The fraction of first-stage branches below a PRM threshold classifies a prompt as easy or hard; easy prompts
    keep top branches and hard prompts expand them.
  sampling_protocol: Compare Best-of-N, PRM beam search, and hybrid search at N=8, 16, and 32.
  rollout_count: Primary tables use 16 paths; full sweeps use 8, 16, and 32.
  temperature: 0.7.
  inference_budget: 350 first-stage tokens and up to 2,048 output tokens; second-stage budget depends on the difficulty classification.
  optimizer_or_scaffold: Two-stage adaptive branch truncation and expansion using PRM-based query difficulty.
audit:
