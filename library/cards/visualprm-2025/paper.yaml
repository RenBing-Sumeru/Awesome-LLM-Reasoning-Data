inclusion_reason: VisualPRM links multimodal solution prefixes to Monte Carlo process values and releases the derived training
  set, reward model, and a separate human-labeled benchmark. It belongs in rollout/search/test-time trace data because both
  label construction and Best-of-N depend on repeated samples, while the underlying continuations and selection logs remain
  an important missing layer.
