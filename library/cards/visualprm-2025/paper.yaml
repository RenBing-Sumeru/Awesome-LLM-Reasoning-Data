one_line_summary: VisualPRM400K converts 16-continuation prefix success rates into binary multimodal step labels for an 8B
  PRM, but the original release omits the continuation and decision ledger behind those labels.
why_it_matters: It is a concrete open example of how training-time rollout labels feed a process scorer and then a test-time
  Best-of-N selector, making rollout budget, terminal checking, version identity, and rejected traces central audit objects
  rather than implementation trivia.
