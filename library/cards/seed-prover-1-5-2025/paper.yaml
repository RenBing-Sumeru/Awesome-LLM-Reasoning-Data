one_line_summary: Seed-Prover 1.5 turns Lean, Mathlib search, Python calls, cached lemmas, and failure summaries into outcome-rewarded
  trajectories, then adds rubric-trained NL-to-Lean sketches and recursive proof search; 11 Putnam 2025 proofs are open, but
  training experience is not.
why_it_matters: It concretizes tool-use theorem-agent experience and natural-language-to-formal decomposition while showing
  why final Lean validity cannot settle contamination, judge-shaped decomposition, formalization fidelity, tool dependence,
  or compute comparability.
