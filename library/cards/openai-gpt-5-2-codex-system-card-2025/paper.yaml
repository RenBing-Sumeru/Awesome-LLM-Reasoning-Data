one_line_summary: The GPT-5.2-Codex addendum discloses RL rollouts where a user model makes conflicting edits and preserving
  them earns positive reinforcement, while separately documenting internal PR evaluations with human-written prompts/tests/hints
  and hidden unit tests but withholding the underlying training records and reward implementation.
why_it_matters: It is a high-value frontier disclosure ledger because it exposes one concrete state-changing coding-agent
  RL intervention and multiple executable evaluation contracts while making the train/eval boundary, missing lineage, and
  non-reproducibility explicit.
