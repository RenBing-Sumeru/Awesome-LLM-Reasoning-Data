status: partial
one_line_summary: Unified Data Selection ranks reasoning trajectories by entropy concentrated at their highest-uncertainty
  tokens and applies the score to SFT, correctness-filtered RFT and online GRPO rollout selection.
why_it_matters: It exposes a unified selection signal across three post-training stages and provides useful threshold, length
  and proxy-model ablations, but reuse still depends on undisclosed tokenizer details, correctness checks, record manifests
  and selected-data releases.
