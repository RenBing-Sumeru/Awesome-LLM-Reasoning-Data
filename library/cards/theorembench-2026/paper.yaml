data_object:
  prompt_source: Lean4 formalizations of classical mathematical theorems inspired by Wiedijk's list of 100 theorems, as described
    in arXiv:2606.09450v1
  trace_author: benchmark instances are extracted by the TheoremBench authors from Lean4 developments; model proofs are generated
    by evaluated Lean4-capable provers.
  answer_format: Lean4 theorem-proving task with theorem group ID, main theorem or subtheorem declaration, explicit premise
    binders, Lean context/imports, ground-truth proof, and generated proof evaluated by Lean4; candidate proof attempts, compile
    verdicts, and metrics are evaluation records rather than raw task fields.
  process_fields:
  - theorem group ID
  - plain-main or premised task view
  - Lean declaration name
  - explicit premise binders
  - Lean context/imports
  - ground-truth Lean proof
  - generated proof attempt
  - Lean4 compile verdict
  - pass@k / coverage / token-efficiency metrics
  environment_or_substrate: Lean4 proof assistant and mathlib-backed formal mathematics
  verifier_or_reward: Lean4 acceptance of candidate proofs; metrics include pass@k, fully proved parent theorem, theorem-level
    coverage, average subtheorems proved, and token-efficiency
  terminal_predicate: candidate proof compiles in Lean4; a parent theorem is fully proved only when the main theorem and required
    associated subtheorems are accepted
recipe_metadata:
  base_model: Not a training recipe; this Card treats the work as an evaluation or audit surface.
  teacher: existing Lean4 formalizations and ground-truth proofs of classical theorem developments
  generator: extraction pipeline that parses Lean4 source files into theorem groups, reconstructs context, converts dependencies
    to explicit premise binders, and keeps only Lean4-compilable snippets
  filtering_rule: retain only instances verified by Lean4; keep artifact/license/toolchain gaps in audit notes until a public
    release is confirmed
  sampling_protocol: Pin arXiv version, dataset release, Lean4/mathlib version, prompt/scaffold policy, timeout/resource limits,
    and kmax before comparing scores.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation budget is model- and harness-specific; do not infer a training-time budget from benchmark scores.
  optimizer_or_scaffold: code_executable_benchmark
