one_line_summary: WebExplorer synthesizes about 40K evolved web-search QA pairs and trains Qwen3-8B with correct ReAct trajectories
  plus judge-rewarded online episodes, but releases only 100 QA rows rather than the paper-scale trajectories or training
  pipeline.
why_it_matters: It shows how hard-query construction, full-trajectory imitation, live search/browse observations, and answer-level
  model judgment interact in long-horizon agent training, while exposing why release shape, judge calibration, replayability,
  and benchmark-overlap evidence must be audited separately.
