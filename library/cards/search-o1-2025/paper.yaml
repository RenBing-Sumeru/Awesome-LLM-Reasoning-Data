one_line_summary: Search-o1 interleaves QwQ-32B-Preview reasoning with live top-10 web retrieval and a separate Reason-in-Documents
  rewrite, but releases no versioned trajectory corpus or web snapshot.
why_it_matters: It exposes a useful test-time trace schema and transformation boundary between raw retrieval and model-written
  evidence, while making replay, provenance, and rights gaps explicit.
