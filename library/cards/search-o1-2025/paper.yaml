data_object:
  prompt_source: Evaluation prompts come from GPQA, MATH500, AMC2023, AIME2024, LiveCodeBench, Natural Questions, TriviaQA,
    HotpotQA, 2WikiMultiHopQA, MuSiQue, and Bamboogle; no training-prompt corpus is claimed.
  trace_author: QwQ-32B-Preview generates the main reasoning and queries; the same reasoning model is invoked separately as
    Reason-in-Documents to analyze retrieved pages and emit a refined knowledge block.
  answer_format: Inference episode containing task instruction, question, long reasoning, delimited search queries, retrieved
    snippets/pages, a Reason-in-Documents analysis and refined result, and final answer.
  process_fields:
  - instruction
  - question
  - reasoning_prefix
  - search_query
  - ranked_results
  - raw_page_content
  - reason_in_documents_analysis
  - refined_knowledge
  - final_answer
  environment_or_substrate: Bing Web Search API in US-EN, top-10 retrieval, and Jina Reader page fetching, orchestrated by
    a batch inference loop.
  verifier_or_reward: No training reward or trajectory-quality verifier is introduced. Retrieval output is transformed by
    the Reason-in-Documents model; benchmark answer metrics evaluate the final system.
  terminal_predicate: Generation ends at EOS/final response or the 32,768-token maximum; a back-off uses direct reasoning
    when no final answer is produced.
recipe_metadata:
  base_model: QwQ-32B-Preview
  teacher: No teacher is reported; Reason-in-Documents reuses the original reasoning model in a separate generation pass.
  generator: QwQ-32B-Preview plus the Search-o1 batch inference scaffold, Bing Web Search, Jina Reader, and Reason-in-Documents.
  filtering_rule: 'Raw retrieval is not accepted directly: the model analyzes the current reasoning, query, and pages and
    emits a concise knowledge block. No corpus-level trace filtering or human factuality audit is reported.'
  sampling_protocol: Main generation uses maximum 32,768 tokens, temperature 0.7, top-p 0.8, top-k 20, and repetition penalty
    1.05. Search uses US-EN and top 10; the reasoning model may trigger search repeatedly.
  rollout_count: unknown
  temperature: 0.7 for reported generation
  inference_budget: 32,768-token maximum and top-10 retrieval per search call; the maximum number of search calls is unknown.
  optimizer_or_scaffold: Inference-only agentic RAG scaffold with batched generation and a separate document-refinement pass;
    no Search-o1 policy training is reported.
audit:
  source_mixture: Evaluation benchmark mixture is named, but the live web source mixture is query- and time-dependent and
    no page manifest is released.
  split: Evaluation splits are described in the paper; no reusable trajectory split exists.
  decontamination: LiveCodeBench uses a recent date window, but no trace-level web/benchmark overlap ledger or retrieved-page
    contamination analysis is released.
  license: Repository code is MIT. Rights for search results, fetched pages, refined text, and any derivative trajectory redistribution
    are unknown.
  lineage: question -> reasoning prefix -> delimited query -> Bing ranked result -> Jina page content -> Reason-in-Documents
    analysis/refinement -> inserted result -> continued reasoning -> final answer
  known_failure_modes:
  - Live search and page content are not replayable without timestamps, result IDs, and snapshots.
  - Reason-in-Documents can omit, distort, or synthesize claims, and no human audit is reported.
  - Top-10 retrieval and page fetching can fail or miss evidence; failed-tool traces are not released.
  - The fallback to direct reasoning changes the terminal path and should be logged separately.
  - Benchmark performance does not establish provenance, licensing, factuality, or quality of intermediate traces.
  citation_status: verified
  confidence: high
  notes: Official ACL Anthology record, arXiv, project page, and canonical RUC-NLPIR repository checked. The repository releases
    inference code, not an immutable rollout dataset.
