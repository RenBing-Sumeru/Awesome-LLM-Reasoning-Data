one_line_summary: This work predicts each prompt’s marginal return from extra decoding and uses those predictions to allocate
  sampling or strong-model calls under a shared compute budget.
why_it_matters: It gives a general optimization formulation for deciding which inputs deserve more test-time compute, rather
  than treating difficulty as a post-hoc statistic.
