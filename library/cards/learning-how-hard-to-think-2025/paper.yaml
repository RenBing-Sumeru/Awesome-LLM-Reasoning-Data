data_object:
  prompt_source: TACO code problems, Numina-CoT mathematics problems, and chat prompts.
  trace_author: Base language models generate candidate responses under multiple sample or routing budgets.
  answer_format: Prompt, hidden representation, predicted marginal reward vector, allocated budget, candidate responses, reward,
    and final selection.
  process_fields:
  - prompt
  - hidden_state
  - marginal_reward
  - budget
  - samples
  - reward
  - final_answer
  environment_or_substrate: Batch or independent online language-model decoding.
  verifier_or_reward: Unit tests for code, a two-stage math oracle verifier, and reward-model preference for chat.
  terminal_predicate: Passing all code tests, verified mathematical correctness, or response reward.
recipe_metadata:
  base_model: StarCoder-15B for code, Mathstral-7B for math, and Gemma models or value-augmented sampling for routing.
  teacher: Not applicable; empirical rewards supervise a lightweight marginal-reward predictor.
  generator: Best-of-k sampling followed by reranking, or weak-versus-strong decoder routing.
  filtering_rule: Allocate each next budget unit to the query with the largest predicted marginal reward; offline allocation
    bins predictions.
  sampling_protocol: Compare online and offline adaptive best-of-k with fixed best-of-k and an oracle allocation.
  rollout_count: Budget-dependent; training labels are estimated by decoding at budgets up to Bmax.
  temperature: See official paper for task-specific decoding.
  inference_budget: Average budget constrained across a query batch, or matched in expectation for offline allocation.
  optimizer_or_scaffold: Two-layer hidden-state MLP or LoRA marginal-reward predictor plus greedy constrained allocation.
