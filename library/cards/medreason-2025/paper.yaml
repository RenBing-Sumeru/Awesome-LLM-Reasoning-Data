one_line_summary: MedReason maps medical QA entities through PrimeKG, uses GPT-4o to write grounded rationales, and releases
  32,682 answer-filtered step-by-step SFT records.
why_it_matters: It makes factual guidance an explicit input to medical rationale generation and exposes the resulting records,
  rather than relying only on an unconstrained reasoning teacher.
