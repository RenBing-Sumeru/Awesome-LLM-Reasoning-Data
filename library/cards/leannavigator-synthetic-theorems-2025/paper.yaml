one_line: LeanNavigator explores Lean proof-state graphs with retrieved tactic templates and environment verification, releasing
  about 4.7M flattened state/proof pairs rather than the underlying graphs and audit logs.
one_line_summary: LeanNavigator turns Lean-verified paths through Mathlib4 state-transition graphs into about 4.7M state/proof
  pairs, but the public archive flattens away graph ancestry, failures, verifier logs, and a release-bound environment.
why_it_matters: It demonstrates how a proof assistant can scale synthetic reasoning supervision through executable state exploration,
  while showing why environment pins, graph-aware splits, source lineage, and retained rejection records are essential for
  safe reuse and contamination auditing.
