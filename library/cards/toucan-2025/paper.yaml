one_line_summary: TOUCAN releases 1,527,259 synthetic task-tool episodes generated through 495 live MCP servers plus a 119,287-row
  SFT subset, while mixed heuristic/judge labels and mutable remote environments limit correctness guarantees and replay.
why_it_matters: It makes large-scale agent SFT data inspectable from task and tool declarations through calls, observations,
  filtering labels, and final responses, and shows why real execution, task correctness, historical release fidelity, and
  executable replay are four different audit claims.
