one_line_summary: TMAS coordinates parallel solution, verification, summarization, and two memory banks so later test-time
  iterations can reuse reliable progress without repeating strategies.
why_it_matters: It treats cross-trajectory information retention as a controllable test-time resource rather than leaving
  parallel rollouts independent.
