data_object:
  prompt_source: Alpaca's 52K instructions plus five depth-evolution prompts and a breadth-evolution prompt.
  trace_author: An OpenAI dialogue model rewrites the instruction and produces the target response; Alpaca seeds originate
    from Self-Instruct.
  answer_format: A single evolved instruction paired with a free-form teacher response.
  process_fields:
  - input or prompt
  - target, trace, or evaluated output
  - feedback or evaluation result
  environment_or_substrate: Offline instruction evolution and response generation followed by LLaMA supervised fine-tuning.
  verifier_or_reward: A teacher model creates instructions and responses; rule-based checks and benchmark or human evaluations
    assess the resulting student.
  terminal_predicate: Rule checks reject uninformative or malformed evolutions; benchmarks and human/model judges assess the
    trained student.
recipe_metadata:
  base_model: LLaMA 13B for the matched main experiment; later experiments also cover other LLaMA-family sizes and Mistral
    7B.
  teacher: An OpenAI dialogue model for instruction evolution and response generation.
  generator: Repeatedly rewrites instructions to add constraints, deepen reasoning, increase breadth, or replace weak items,
    then asks OpenAI dialogue model to produce responses.
  filtering_rule: A teacher model creates instructions and responses; rule-based checks and benchmark or human evaluations
    assess the resulting student.
  sampling_protocol: Four evolution rounds produce 250K candidates; the matched main experiment randomly samples 70K for SFT.
  rollout_count: null
  temperature: null
  inference_budget: Four instruction-evolution rounds plus one OpenAI-teacher response generation for each accepted evolved
    instruction.
  optimizer_or_scaffold: Repeatedly rewrites instructions to add constraints, deepen reasoning, increase breadth, or replace
    weak items, then asks OpenAI dialogue model to produce responses.
