one_line_summary: Qwen3.5 reports scaled multimodal and multi-turn RL with agent-oriented environments and releases a post-trained
  checkpoint, but not the tasks, traces, rewards, environment artifacts, or provenance needed to audit or reproduce that training.
why_it_matters: 'It is a clear disclosure-boundary case: systems-level RL scaling and released weights provide useful ledger
  evidence, but cannot be treated as an open agent-data, reward, or reproducible RL recipe release.'
