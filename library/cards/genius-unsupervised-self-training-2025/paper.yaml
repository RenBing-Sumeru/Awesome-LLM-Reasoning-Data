status: partial
one_line_summary: Genius converts general queries into same-policy foresight-ranked trajectory pairs for ACO, but the score
  is not a correctness verifier and the exact preference data is not released.
why_it_matters: It exposes a label-free construction path from queries to step-local preferences and a policy checkpoint,
  while showing why lineage, proxy validation, code-version pinning, and rejected-sample retention are necessary for reasoning-data
  reuse.
