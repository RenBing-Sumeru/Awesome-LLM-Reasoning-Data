data_object:
  prompt_source: Training questions from FOLIO, FOLIOv2, and LogicAsker. PRM-label generation uses random subsets of 1,003
    FOLIO, 1,000 FOLIOv2, and 300 LogicAsker training questions; neither the sampled-item manifest nor the random seed is
    released.
  trace_author: Llama3.3-70B-Instruct and Qwen2.5-72B-Instruct generate the PRM-training trajectories and Monte Carlo completions.
    Llama3.1-8B-Instruct and Qwen2.5-7B-Instruct generate the later candidate trajectories filtered into SFT and DPO data.
  answer_format: Symbolic ReAct text with variable-length Thought/Action/Observation steps, explicit first-order-logic-style
    formulas and rule applications, and a final Finish label. The repository step dataset stores input/value/label; the Hugging
    Face SFT release stores question_id/question/response; the DPO release stores question_id/question/positive/negative.
  process_fields:
  - question_or_context
  - symbolic_react_steps
  - thought
  - action
  - observation
  - final_answer
  - step_pseudo_label
  - step_positive_probability
  - trajectory_product_score
  - positive_trajectory
  - negative_trajectory
  environment_or_substrate: Offline LLM sampling over natural-language logic problems with one-shot Symbolic ReAct prompts.
    The reported verifier does not execute the generated formulas in a symbolic solver or proof assistant.
  verifier_or_reward: For each intermediate prefix, 10 LLM completions are compared with the ground-truth final answer; a
    step is positive if at least one completion is correct and negative otherwise. A Qwen2.5-7B-Instruct binary PRM learns
    these labels, predicts per-step positive probabilities, and the product of those probabilities scores a full trajectory.
  terminal_predicate: 'The generated final label must match the dataset ground truth: True/False/Uncertain for FOLIO-family
    examples and binary True/False or Yes/No for LogicAsker-style examples.'
recipe_metadata:
  base_model: Qwen2.5-7B-Instruct with a binary classification head for the PRM; Llama3.1-8B-Instruct and Qwen2.5-7B-Instruct
    for downstream SFT and DPO.
  teacher: Llama3.3-70B-Instruct and Qwen2.5-72B-Instruct provide the Monte Carlo completions used to create PRM pseudo-labels.
  generator: One-shot Symbolic ReAct prompting elicits explicit FOL formalization and Thought/Action/Observation trajectories;
    later candidate trajectories are generated by Llama3.1-8B-Instruct and Qwen2.5-7B-Instruct.
  filtering_rule: SFT keeps a trajectory only when every PRM step prediction is positive (the released script applies a probability
    threshold above 0.5) and the final answer matches ground truth. DPO scores each trajectory by the product of step-positive
    probabilities and forms a pair when the higher-minus-lower score exceeds 0.25.
  sampling_protocol: PRM pseudo-labeling samples 10 completions from every intermediate prefix and applies a hard at-least-one-success
    rule. The reported second-stage candidate count, decoding temperature, top-p, seeds, and per-model allocation are unknown.
  rollout_count: '10 completions per intermediate step for PRM pseudo-labeling; second-stage candidate trajectories per question:
    unknown.'
  temperature: unknown
  inference_budget: Monte Carlo estimation required approximately 250 AMD MI300X GPU-hours and later trajectory sampling approximately
    42 hours. Fine-tuning uses a maximum sequence length of 2,048; a complete generation-token budget is unknown.
  optimizer_or_scaffold: Full fine-tuning for 10 epochs with batch size 8, learning rate 5e-7, maximum sequence length 2,048,
    and adamw_torch_fused; development accuracy selects the checkpoint. DPO uses PRM-derived pairs at a 0.25 score-gap threshold,
    while DPO beta and complete scheduler and seed settings are unknown.
audit:
  source_mixture: PRM seeds come from random subsets of FOLIO (1,003), FOLIOv2 (1,000), and LogicAsker (300). Later SFT/DPO
    generation uses all training questions from those sources. The per-source composition of the 15,412 SFT rows and 21,472
    DPO pairs is not documented in the release.
  split: For evaluation, FOLIO development is used as test, FOLIOv2 development as development, and 900 generated LogicAsker
    examples are split evenly into train/development/test. Both Hugging Face derivatives expose only a train split; the repository
    step-label JSON has no source-item identifier.
  decontamination: unknown
  license: 'ACL paper: CC BY 4.0. Official code repository: GNU GPL v2.0. Hugging Face SFT and DPO dataset cards: CC BY-NC-SA
    4.0. Item-level provenance and compatibility with the terms of FOLIO, FOLIOv2, and LogicAsker are not analyzed in the
    release.'
  lineage: FOLIO/FOLIOv2/LogicAsker prompts -> Symbolic ReAct seed trajectories -> 10 answer-checked completions per prefix
    -> 1,505 trajectories and 12,448 hard-labeled steps -> Qwen2.5-7B PRM -> 7B/8B symbolic candidates -> all-positive-plus-correct
    SFT records and score-gap DPO pairs. Immutable item-to-source and candidate-to-release manifests are unavailable.
  known_failure_modes:
  - At-least-one successful completion is an answer-reachability proxy, not proof of the formal validity of a prefix; completer
    failures can also create false-negative labels.
  - The paper states that automatically trained PRMs cannot guarantee fully correct steps and that difficult suffixes can
    underestimate the correctness of earlier steps.
  - Products of uncalibrated step probabilities are length-sensitive and may not separate useful preference pairs; the paper
    reports that SFT generally outperforms DPO.
  - The SFT release omits discarded candidates; the DPO release contains relative lower-scored trajectories but not the raw
    candidate pool, score vectors, or candidates that were never paired.
  - No PRM checkpoint, calibration report, complete sampling manifest, decontamination analysis, or exact second-stage decoding
    recipe is released.
  - The checked generation scripts reference undefined args.data_path and a misspelled LogicAsker prompt path; dpo_training.py
    references undefined args.model_name, so the published pipeline needs code repair.
  - Repository generation defaults of 5 samples, temperature 1.0, and Qwen3-32B do not reproduce the paper-reported 10-completion
    70B/72B PRM-labeling setup and must not be treated as reported settings.
  citation_status: verified
  confidence: medium
  notes: The full ACL paper and appendices, ACL/arXiv metadata, official GitHub commit 2381154f755151226aff3375013b45609a09c59d,
    official Hugging Face collection, both dataset cards/APIs, code/configuration files, and licenses were inspected. Exact
    releases contain 15,412 SFT rows and 21,472 DPO rows; the repository labels contain 10,709 positive and 1,739 negative
    steps across 1,505 trajectories.
inclusion_reason: This work exposes a concrete offline rollout lineage from Monte Carlo answer-reaching pseudo-labels to a
  PRM, accepted SFT traces, and paired DPO traces. It directly fits the rollout/search track while making sampling budget,
  selection thresholds, and the retained-versus-rejected boundary central audit objects.
