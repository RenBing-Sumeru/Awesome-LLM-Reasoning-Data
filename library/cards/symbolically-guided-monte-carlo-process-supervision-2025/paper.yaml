one_line_summary: Releases 1,505 Symbolic ReAct trajectories with 12,448 Monte Carlo-derived step labels, plus 15,412 accepted
  SFT traces and 21,472 PRM-ranked DPO pairs derived from FOLIO, FOLIOv2, and LogicAsker.
why_it_matters: It makes the offline data transformation explicit—answer-checked rollouts become step supervision, a PRM filters
  and scores new traces, and those scores yield SFT and preference data—while exposing the gap between answer reachability
  and formally valid reasoning.
