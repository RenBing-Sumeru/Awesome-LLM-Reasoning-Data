one_line_summary: UI-TARS-2 discloses a continual-pre-training/SFT/PPO flywheel over stateful GUI episodes and three outcome-feedback
  paths, while leaving the training corpus, reward records, model weights, and replayable environments unreleased.
why_it_matters: 'For the frontier-report disclosure ledger, it is a strong example of method-level transparency without item-level
  data or environment reproducibility: the episode contract can be reconstructed conceptually, but the claimed pipeline cannot
  be independently audited end to end.'
