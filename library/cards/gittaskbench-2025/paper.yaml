one_line_summary: GitTaskBench releases 54 repository-linked multimodal tasks with inputs and custom final-output graders
  for autonomous repository understanding, environment setup, execution, and delivery, while withholding a canonical action-observation
  rollout corpus.
why_it_matters: It exposes the repository, dependency setup, final artifact, and task-specific terminal predicate as the evaluation
  data object, and its 65.04% environment-setup failure share shows why environment state and replay metadata are central
  to agent reasoning-data audits.
