one_line_summary: PGTS trains a GPS graph policy with PPO to navigate LLaMA 3.1 reasoning trees through expand, branch, backtrack,
  and paper-defined terminate decisions under explicit depth, breadth, and search-step budgets.
why_it_matters: It exposes the learned controller's state-action-reward contract and the compute tradeoff behind test-time
  tree search, while the absent raw trees, unchosen-action scores, checkpoints, and explicit code-level terminate action identify
  the exact evidence still needed for reuse and audit.
