one_line_summary: EnvFactory releases source-grounded stateful MCP sandboxes, step-expanded SFT records, and turn-level RL
  records whose feedback mixes reference-call coverage with exact final-state checks, but the public artifacts lack an immutable
  paper-run binding and rejected-trajectory ledger.
why_it_matters: It makes executable state, tool dependencies, simulated-user interaction, reference calls, and final-state
  feedback first-class post-training data, while exposing why row-unit reconciliation, reward semantics, source rights, failure
  retention, and version pinning must be audited separately from benchmark gains.
