one_line_summary: Magistral reports filtered math/code RL and Medium-to-Small trace transfer, but releases only Small model
  weights rather than the training corpus, traces, tests or reward logs.
why_it_matters: It shows how to audit a technically detailed frontier RL disclosure without mistaking a model-weight release
  or benchmark gain for a reusable data release.
