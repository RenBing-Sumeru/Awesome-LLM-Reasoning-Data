one_line_summary: Seed-Prover trains a lemma-first Lean policy with binary proof rewards and feedback-rich prompts, then scales
  from iterative repair to 5,000-conjecture search; Seed-Geometry adds a reported 230M-problem corpus, while only successful
  proof artifacts are open.
why_it_matters: It makes the reasoning-data object concrete—formal statements, lemmas, dependencies, failures, compiler feedback,
  summaries, conjectures, and verified terminal reward—while exposing missing membership, failed trajectories, judge-assisted
  selection, and search-compute accounting.
