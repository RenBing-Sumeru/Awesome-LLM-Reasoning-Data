one_line_summary: OmniAlign-V-DPO releases 150K image-grounded chosen-rejected pairs built from OmniAlign-V answers and model-sampled
  negative responses for MLLM preference optimization.
why_it_matters: 'It makes the preference contract explicit for multimodal alignment: a detailed image-grounded answer is positive,
  while an intent-divergent sampled response is negative.'
