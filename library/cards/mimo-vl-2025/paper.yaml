  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: Mixed On-policy Reinforcement Learning (MORL) integrates diverse signals across perception, grounding,
    reasoning, and preference alignment; optimizer and stage settings are undisclosed.
