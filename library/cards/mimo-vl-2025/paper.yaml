  environment_or_substrate: Vision-language pre-training followed by mixed on-policy reinforcement learning across text, image,
    and video modalities.
  verifier_or_reward: MORL combines reward signals for perception accuracy, visual-grounding precision, logical reasoning,
    and human/AI preferences; reward formulas, weights, calibrations, and per-sample decisions are undisclosed.
  terminal_predicate: Synthetic reasoning data is retained through rejection sampling, but acceptance criteria, yields, and
    rejected-sample records are undisclosed.
recipe_metadata:
  base_model: MiMo-VL-7B, comprising a native-resolution ViT encoder, MLP projector, and MiMo-7B language model; the report
    does not identify the initial checkpoint lineage in the inspected source.
  teacher: Large reasoning models for long-CoT regeneration; exact teacher checkpoints are unknown.
  generator: Four-stage pre-training includes projector warm-up, vision-language alignment, general multimodal pre-training,
    and long-context SFT; later pre-training incorporates regenerated long-CoT reasoning data, followed by MORL.
  filtering_rule: Rejection sampling is stated for synthetic long-CoT reasoning data; the rule, thresholds, reject rates,
    and deduplication procedure are unknown.
