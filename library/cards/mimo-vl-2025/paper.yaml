    MORL. Item-level provenance, teacher version, and retained/rejected lineage are not released.
  known_failure_modes:
  - The report states mixed RL across domains remains challenging because of cross-domain interference.
  - Reward components, weights, calibration, and per-sample feedback records are not disclosed, so MORL cannot be audited
