inclusion_reason: GUI-360° is directly useful to the environment-and-agent-trajectory track because it exposes a concrete
  multimodal Windows Office episode schema, a hybrid GUI/API action trace, successful and failed rollouts, a whole-trajectory
  judge, and derived step-level SFT/evaluation objects. Its missing replay stack, judge prompt, provenance controls, and RL
  contract are equally important audit boundaries.
