data_object:
  prompt_source: Natural-language Office tasks are mined from built-in application help/tutorials, online forums/Q&A/community
    sites, and search-engine queries for Word, Excel, and PowerPoint. An unspecified LLM matches them to one of 66 manually
    instantiated environment templates and rewrites them as concrete executable requests. Exact source URLs, crawl dates,
    per-record provenance, licenses, and deduplication are unknown.
  task_object: A task contains a concrete user request, application domain, environment-template reference, and an Office
    document or presentation state instantiated in a Windows VM. The released train/test corpus contains GPT-4.1-judged successful
    executions; unsuccessful executions are stored separately under `fail/`.
  trace_author: 'TrajAgent generates the trajectories: GPT-4o handles the first execution round and GPT-4.1 retries failures.
    A master agent decomposes the concrete request into subtasks, execution agents perceive the GUI, choose GUI or app-API
    actions, and a recorder logs each state-action transition.'
  trajectory_object: A raw episode is a sequence of JSON step records sharing `execution_id`, `app_domain`, `request`, and
    `template`. Each record includes `step_id/total_steps`, an evaluation object, synchronized screenshot paths, UI/accessibility
    state, textual subtask/observation/thought, the executed GUI or API action with arguments and spatial target, and a continuation
    or finish status. The current HF card documents two screenshot fields, while the paper lists four variants.
  released_training_object: The HF release also exposes four Qwen2.5-VL-7B-oriented processed views. Grounding maps a screenshot
    plus the agent's current-step thought to target coordinates; screen parsing maps a screenshot to actionable controls with
    names and bounding boxes; action prediction maps the user goal, screenshot, history, and optional accessibility context
    to the next function, arguments, and status.
  answer_format: Raw output is an environment-linked GUI/API action and status embedded in a full trajectory. Processed SFT
    output is a conversation-style target for coordinates, structured controls, or a structured next action. Static benchmark
    scorers compare those outputs with logged accessibility-derived labels; they do not replay predicted actions.
  process_fields:
  - execution_id
  - app_domain
  - request
  - template
  - step_id
  - total_steps
  - evaluation_reason
  - evaluation_evidence
  - evaluation_sub_scores
  - evaluation_complete
  - screenshot_clean
  - screenshot_annotated
  - ui_tree
  - application_windows_info
  - uia_controls_info
  - subtask
  - observation
  - thought
  - action_type
  - control_text
  - control_label
  - function
  - args
  - rectangle
  - coordinate_x
  - coordinate_y
  - status
  - task_tags
  observation: At each execution step, TrajAgent captures the current full-resolution application screenshot and Windows UI
    Automation accessibility tree/control metadata, renders a Set-of-Mark view, and records the environment response after
    the chosen GUI or MCP-backed app action. The current release does not pin a live observation server or VM image.
  reward_object: There is no verified RL reward object. Collection attaches EvaAgent's GPT-4.1 rationale, evidence, sub-scores,
    and binary completion judgment to an episode. Benchmark feedback is separately computed per step by point-in-box grounding,
    IoU/text-based screen parsing, or function/argument/status action matching.
  environment_or_substrate: Fifteen Windows 11 virtual machines with four CPU cores each execute Word, Excel, and PowerPoint
    tasks using 30 Word, 30 Excel, and 6 PowerPoint templates. Actions combine mouse/keyboard GUI operations with Word/Excel/PowerPoint
    APIs exposed through MCP servers. Windows build, Office versions, locale, resolution, VM image, credentials, and reset
    artifacts are unknown.
  verifier_or_reward: Mixed feedback boundary. EvaAgent is a GPT-4.1 LLM-as-judge that inspects the complete trajectory, screenshots,
    accessibility data, actions, thoughts, and final app state and accepts only trajectories satisfying all undisclosed fine-grained
    criteria; the paper reports 86% agreement with humans on 100 sampled trajectories. Released benchmark code supplies programmatic
    static metrics, not an executable environment-success reward.
  terminal_predicate: Raw steps carry `CONTINUE`, `FINISH`, or `OVERALL_FINISH`, while EvaAgent assigns final completeness
    after judging the terminal app state. No version-pinned executable terminal-state checker, judge prompt, rubric, timeout
    rule, or replay harness is released.
  provenance: Publicly sourced prototypical query -> template matching and LLM concretization -> five-way LLM task-quality
    filter -> GPT-4o TrajAgent execution -> GPT-4.1 retry of failures -> GPT-4.1 EvaAgent whole-trajectory judgment -> removal
    of incomplete steps -> successful 80/20 train/benchmark split plus separately retained failures -> task-specific SFT views
    and static evaluation.
recipe_metadata:
  base_model: Qwen2.5-VL-7B is the principal open model used for processed-data SFT and action-prediction experiments; the
    grounding table also reports a UI-TARS-1.5-7B SFT variant. Exact checkpoint revisions and paper-result mappings are unknown.
  teacher: GPT-4o generates first-round trajectories, GPT-4.1 retries failed tasks, and GPT-4.1 powers EvaAgent validation.
    The LLM used for query-template matching, concretization, and the five-way query-quality gate is not identified.
  generator: TrajAgent combines a master planner, execution agents, screenshot/accessibility perception, a hybrid GUI+MCP
    action executor, a Windows Office environment, and a recorder that emits temporally aligned episode records.
  prompt_task_source: Built-in application help/tutorial content, online forums/Q&A/community websites, and search-engine
    queries. Table 2 reports 27,903 Word, 28,552 Excel, and 21,698 PowerPoint raw queries, but these sum to 78,153 while the
    narrative states 79,075 candidates; source-level reconciliation is unknown.
  sampling_protocol: After LLM filtering, the paper states that 59,553 candidate tasks are retained. Each task is first attempted
    by GPT-4o; failures are attempted again by GPT-4.1. Successful/executable trajectories pass EvaAgent and sanitization
    before an 80/20 trajectory split; failed executions are retained separately. Task order, retry/timeout logic, seeds, and
    exact attempt manifests are unknown.
  rollout_count: The final release is reported as 17,189 successful trajectories with 131,652 steps plus 62,170 failed trajectories
    with 1,093,525 steps, for 79,359 trajectories and 1,225,177 steps in total. The number of model attempts, discarded attempts,
    timeouts, and multiple attempts per source task is unknown.
  temperature: Appendix D reports temperature 0.0 for GPT-4o and GPT-4.1 collection/evaluation calls. Top-p, max tokens, stop
    rules, response retries, and query-pipeline decoding settings are unknown.
  inference_budget: Collection uses 15 Windows 11 VMs with four CPU cores each and at most two described model stages per
    task. The paper does not disclose per-task step caps, token budgets, wall-clock time, API cost, or timeout policy.
  search_or_scaffold: Master-agent subtask decomposition, parallel execution-agent dispatch, screenshot plus accessibility/Set-of-Mark
    perception, GUI-or-MCP action selection, environment observation, and persistent recording. This is an orchestration scaffold,
    not tree search or best-of-N selection.
  filtering_rule: Reject tasks labeled non-executable, cross-application, version-management, template-missing, or otherwise
    invalid; retain `NORMAL`. After execution, EvaAgent keeps only whole trajectories satisfying all fine-grained criteria,
    and sanitization removes steps lacking an executed action, screenshot, or essential metadata. Exact prompts, thresholds,
    and stage-wise removal counts are unknown.
  selection_threshold: EvaAgent requires all fine-grained completion criteria, but the criteria, sub-score scale, threshold,
    disagreement policy, and human escalation rule are not disclosed. The query filter is categorical rather than a published
    numeric threshold.
  optimizer_or_scaffold: Reported SFT and stated RL experiments use 4 NVIDIA A100 40GB GPUs, FP16, gradient accumulation,
    checkpointing, and a learning-rate search over 1e-5, 5e-6, and 1e-6. Optimizer, batch size, epochs, scheduler, seeds,
    chosen setting per run, checkpoint IDs, and all RL algorithm/reward/rollout details are unknown; no RL training code was
    verified.
  release_scale: HF currently reports about 574 GB and exposes raw `train`, `test`, and `fail` trees, 66 Office templates,
    and four processed SFT directories. The full artifact was not downloaded or independently recounted, and HF's dataset
    viewer currently fails with an Arrow offset-overflow error.
audit:
  source_mixture: Query mixture combines application help, online community/Q&A content, and search queries across Word (41.0%),
    Excel (31.6%), and PowerPoint (27.4%), then instantiates tasks from 66 manually curated templates. Exact websites, query
    text ownership, language/geography, crawl dates, source weights after filtering, and record-level lineage are unknown.
  split: Successful trajectories are split 80% train (13,750 trajectories, 105,368 steps) and 20% GUI-360-Bench (3,439 trajectories,
    26,284 steps), and all three derived tasks share the partition. No immutable ID manifest, grouping key, random seed, template/source-family
    separation, validation split, or cross-split near-duplicate audit is disclosed.
  decontamination: unknown
  benchmark_overlap: No benchmark decontamination or semantic-duplicate audit is disclosed. Because task variants share a
    small set of 66 templates and are split by trajectory, train/bench leakage through template, source query, paraphrase,
    or near-identical UI state is plausible and unquantified.
  lineage: Public query source -> manually instantiated Office template family -> LLM match/concretization/filter label ->
    staged GPT-4o/GPT-4.1 TrajAgent attempt -> step screenshots/UI tree/reasoning/action/status -> GPT-4.1 EvaAgent judgment
    -> sanitization -> successful train/bench or released failure tree -> grounding/parsing/action SFT transformations.
  license: GitHub code is MIT licensed and the HF metadata/dataset card declares MIT. The HF root tree does not visibly include
    a separate dataset LICENSE file, and neither declaration resolves record-level rights for crawled query text, Microsoft
    Office screenshots/templates, fonts, icons, or other third-party UI content.
  release_version: arXiv v2 dated 2025-11-10 was reviewed. GitHub `main` commit `a9f9d2e6f125c8cbc176b46a74aeef76ed16f0f6`
    (2025-11-10) has no tag or release. HF mutable `main` was inspected on 2026-07-20; its dataset-card commit `1c46362efaae836c601004e77b98a1aba89a530f`
    is visible, but no immutable whole-dataset release tag or DOI was verified.
  version_drift: Appendix B lists clean, full-desktop, annotated, and selected-control screenshots. The current HF card documents
    only clean and annotated screenshots, and commit 1c46362 removes the other fields from the card. Reusers must inspect
    raw records and pin revisions rather than assuming the paper schema and current card are identical.
  experimental_evidence:
    grounding: Table 7 reports Qwen2.5-VL-7B 35.78% -> 82.30% after SFT and UI-TARS-1.5-7B 62.27% -> 82.49% after SFT.
    action_prediction: Table 9 reports Qwen2.5-VL-7B visual-only step success 17.52% -> 50.08% after SFT and visual+A11y 14.18%
      -> 25.78%. The A11y SFT score is much lower than visual-only SFT, so accessibility is not uniformly beneficial under
      this setup.
    screen_parsing: Table 8 reports OmniParser-v2 overall F1 0.408 / mean IoU 0.735 versus the strongest listed general model
      o3 at F1 0.128 / mean IoU 0.578.
    limitation: These are author-reported static benchmark results. The paper provides no human baseline protocol, uncertainty,
      independent reproduction, or isolated RL result despite abstract-level RL language.
  verifier_or_judge_failure_modes:
  - EvaAgent is a single GPT-4.1 judge with only a 100-trajectory calibration sample and 86% human agreement. The paper does
    not report confusion matrices, false-positive/false-negative rates, annotator agreement, or adversarial tests.
  - The judge observes generated reasoning traces as well as screenshots/actions, so persuasive or self-consistent text can
    influence a completeness judgment without constituting environment proof; the prompt/rubric is unavailable.
  - Static action prediction requires matching one logged function/argument/status tuple and does not model alternative valid
    actions or execute the prediction, creating false negatives for multi-path tasks and false confidence about end-to-end
    success.
  - Grounding uses accessibility-derived boxes, so missing/stale accessibility metadata or bounding-box errors become ground
    truth. The release does not quantify label error across apps.
  - Screen-parsing code uses greedy IoU matching and a separate generic `success` flag at recall >= 0.1; this flag should
    not be interpreted as task completion or substituted for the paper's macro F1/IoU metrics.
  - 'Query counts conflict internally: Table 2 sums to 78,153 while §3.1 states 79,075, and the published filter percentages
    do not transparently reproduce the stated 59,553 retained tasks.'
  - The abstract mentions RL gains, but no RL objective, reward, policy, rollout budget, result table, or code is released.
    Failed trajectories therefore cannot be assumed to provide a ready RLVR contract.
  - The GitHub evaluator defaults include environment-specific service endpoints/model paths and the repository omits the
    collection stack, so a clean checkout is not a complete reproduction of Tables 7-10 or trajectory generation.
  successful_and_failed_sample_retention: The official release retains 17,189 successful trajectories in train/test and reports
    62,170 failed trajectories in a separate HF `fail/` tree. This is unusually strong failure visibility, but the exact failure
    taxonomy, timeout/abort policy, rejected query set, attempt-to-task mapping, sanitizer drop log, and whether every failed
    attempt is preserved remain unknown.
  privacy_or_consent: The Ethics Statement says no human subjects were directly involved, no PII or sensitive user data is
    included, queries were derived from publicly accessible non-sensitive educational/tutorial sites, and data are limited
    to non-sensitive Word/Excel/PowerPoint contexts. No source URL list, consent/terms analysis, PII detector, redaction procedure,
    audit sample, or retention policy is released, so these remain author claims rather than independently auditable controls.
  safety_boundary: Construction filters cross-application and version-management tasks, and the paper says privacy/security/safety-risk
    scenarios were excluded. The resource therefore covers bounded Office productivity behavior, not general desktop or security-sensitive
    deployment. Hybrid API/file actions still require sandboxing when reused.
  environment_replay: Static JSON, images, templates, converters, and benchmark scorers are released. The confirmed GitHub
    tree does not contain TrajAgent/EvaAgent collection code, VM provisioning, Office/MCP version manifests, state reset scripts,
    timeout rules, or an executable terminal checker. Faithful environment replay is therefore unavailable from the verified
    artifacts.
