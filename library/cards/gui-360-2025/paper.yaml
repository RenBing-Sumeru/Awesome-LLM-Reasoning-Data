one_line_summary: GUI-360° releases 17,189 successful and 62,170 failed Windows Office trajectories with screenshots, accessibility
  state, reasoning, and GUI/API actions, then derives grounding, screen-parsing, and action-prediction SFT/benchmark data;
  the collector, replay environment, judge prompt, and claimed RL setup remain incomplete.
why_it_matters: It makes the full environment-data chain unusually visible - real-query sourcing, template instantiation,
  executed multimodal episodes, success/failure retention, whole-trajectory judgment, and step-level training views - while
  showing why static trajectory availability is not the same as replayable agent training or a verified RL feedback contract.
