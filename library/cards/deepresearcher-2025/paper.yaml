data_object:
  prompt_source: 80,000 filtered questions from Natural Questions, TriviaQA, HotpotQA, and 2WikiMultiHopQA in a 1:1:3:3 ratio;
    75% are multi-hop. The repository releases train/dev/test Parquet prompt files.
  trace_author: Qwen2.5-7B-Instruct policy rollouts under GRPO, interacting with search/browse tools and a page-reading multi-agent
    subsystem.
  answer_format: Episode alternating think spans with JSON search/browse actions and tool responses, followed by a tagged
    short answer; tool observations are loss-masked.
  process_fields:
  - prompt
  - dataset
  - split
  - policy_response
  - think
  - search_action
  - browse_action
  - tool_observation
  - url
  - final_answer
  - format_valid
  - word_f1_reward
  environment_or_substrate: Live search plus parallel Reading Agents and a Synthesis Agent for heterogeneous pages, served
    by concurrent handlers on a 50-node CPU cluster; query caching and retries affect state.
  verifier_or_reward: Incorrect format receives -1; valid format receives word-level F1 against the short reference answer.
    Tool observations are masked from the training loss.
  terminal_predicate: Tagged final answer after at most 10 tool calls; format validity and short-answer F1 determine terminal
    reward.
recipe_metadata:
  base_model: Qwen2.5-7B-Instruct
  teacher: unknown; no teacher-generated trajectory corpus is described
  generator: On-policy DeepResearcher agent with web search/browse tools, Reading Agents, and a Synthesis Agent.
  filtering_rule: Two stages remove low-quality questions and questions answerable by the base model without search; contamination
    screening samples 10 no-search responses and removes a question if any contains the ground-truth answer.
  sampling_protocol: Each training step samples 256 prompts and 16 rollouts per prompt; each rollout permits up to 10 tool
    calls; mini-batch size is 4,096.
  rollout_count: unknown total; 4,096 rollouts are sampled per reported training step
  temperature: unknown
  inference_budget: Up to 10 tool calls per rollout; search top-k such as 10; a seven-day identical-query cache is described
    in the system implementation.
  optimizer_or_scaffold: verl implementation of GRPO with live-web environment services and loss masking for tool observations.
audit:
  source_mixture: 80,000 prompts in NQ:TQ:HotpotQA:2Wiki = 1:1:3:3; live web observations are not represented by an immutable
    source manifest.
  split: Repository exposes train.parquet, dev.parquet, and test.parquet; exact immutable commit/checksums and relation to
    every paper experiment should be pinned.
  decontamination: A pass@10 no-search screen removes questions the base model can answer from parameters. This is not a general
    benchmark/web contamination audit.
  license: Code and released model are Apache-2.0. Rights for source benchmark questions, web pages, cached observations,
    and derivative rollouts require separate review.
  lineage: benchmark question -> quality and pass@10 filtering -> on-policy rollout -> live search/browse -> Reading Agents/Synthesis
    observation -> masked environment tokens -> tagged short answer -> format/F1 reward -> GRPO update
  known_failure_modes:
  - Short-answer F1 does not verify evidence, citations, intermediate reasoning, or long-form synthesis.
  - Live search, page revisions, cache state, rate limits, and anti-crawl behavior prevent exact replay without snapshots.
  - A seven-day query cache can couple rollouts and training steps.
  - Processed prompt Parquets and a model checkpoint are released, but the original training rollout corpus and rejected siblings
    are not verified as released.
  - Pass@10 filtering detects memorized answers only under one base-model sampling procedure.
  - Code/model licences do not settle rights for benchmark prompts or web content.
  - Benchmark improvements do not establish record-level trace quality.
  citation_status: verified
  confidence: high
  notes: ACL paper, official repository, released prompt Parquets, Apache-2.0 code, and GAIR/DeepResearcher-7b checkpoint
    checked. No immutable original training-rollout release was verified.
inclusion_reason: 'Approved Track 5 candidate with a concrete feedback/selection object: real-web search interactions reflection
