one_line_summary: DeepResearcher releases 80,000 filtered QA prompts, code, and a 7B checkpoint for live-web GRPO with 16
  rollouts per prompt and short-answer F1 reward, but not a verified corpus of the original training episodes.
why_it_matters: It makes live search, page reading, tool-observation masking, rollout allocation, and terminal reward explicit,
  while exposing how dynamic web state limits trajectory replay and audit.
