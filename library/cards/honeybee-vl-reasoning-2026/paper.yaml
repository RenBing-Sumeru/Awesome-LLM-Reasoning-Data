one_line_summary: HoneyBee reports 2.480M caption-plus-solution and text-only SFT records built with Llama-4 Scout around
  28K images and 350K questions; the live release is pointer-based, partially materialized, and governed by layered licenses.
why_it_matters: It turns context choice, auxiliary captions, image diversity, questions per image, and traces per question
  into separately tested construction variables, giving the open-release recipe track a concrete multimodal scaling study
  with visible audit boundaries.
