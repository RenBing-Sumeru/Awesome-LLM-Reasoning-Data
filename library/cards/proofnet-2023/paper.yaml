data_object:
  prompt_source: ProofNet authors select undergraduate textbook/exam mathematics problems, transcribe natural-language statements/proofs,
    and pair them with human-authored Lean 3 theorem statements.
  trace_author: ProofNet authors and Lean-proficient human annotators; natural-language proofs are adapted from solution manuals
    or written by annotators as disclosed by the paper.
  answer_format: each benchmark record pairs a natural-language theorem statement and proof with a Lean 3 formal theorem statement
    and source header; model outputs are judged by Lean typecheck plus expert semantic review.
  process_fields:
  - natural-language theorem statement
  - natural-language proof
  - Lean 3 formal theorem statement
  - source header/import context
  - model formalization or informalization output
  - Lean typecheck result
  - human semantic correctness judgment when reported
  environment_or_substrate: Lean 3 plus mathlib; the official repository now identifies itself as the original Lean 3 artifact.
  verifier_or_reward: Lean 3 typechecking supplies the programmatic well-formedness signal; human experts judge semantic equivalence
    for autoformalization accuracy.
  terminal_predicate: a candidate statement must typecheck for mechanical acceptance, and must be judged semantically equivalent
    to count as a correct autoformalization in the paper's evaluation.
recipe_metadata:
  base_model: Not a training recipe; this Card treats the work as an evaluation or audit surface.
  teacher: Official authors, annotators, validators, tests, judges, or verifier sources described by the paper.
  generator: official authors curate or construct informal-to-formal theorem statements/proofs in Lean; exact split, artifact,
    license, and evaluator details require source review.
  filtering_rule: Keep Lean typecheck, human semantic correctness, and BLEU separate; do not treat BLEU as a verifier reward.
  sampling_protocol: Pin Lean 3/mathlib versions, dataset revision, source headers, prompts, evaluator model/endpoints, and
    expert judging policy before comparing scores.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation budget is model- and harness-specific; do not infer a training-time budget from benchmark scores.
