data_object:
  prompt_source: Numina informal math problems plus Lean Workbook statements; the paper also uses a private 68K AOPS collection
    during formalization.
  trace_author: Two Qwen2.5-Coder-32B formalizers create Lean statements, then DeepSeek-Prover-V1.5-RL and eight generations
    of SFT provers write whole proofs.
  answer_format: Goedel-Pset-v1 stores problem_id, formal_statement, and informal_statement; Lean-workbook-proofs stores problem_id
    and a complete Lean 4 full_proof.
  process_fields:
  - informal statement
  - Lean 4 statement
  - stable problem identifier
  - compiler-verified whole proof
  environment_or_substrate: Lean 4.9.0 with Mathlib4, whole-proof sampling, compiler replay, and cumulative expert iteration.
  verifier_or_reward: Lean compilation checks syntax and proofs; a Qwen2.5-72B-Instruct faithfulness/completeness judge filters
    autoformalized statements after compilation.
  terminal_predicate: A proof is positive only when Lean compiles the complete theorem; a formalized statement must also pass
    compilation and the faithfulness threshold.
recipe_metadata:
  base_model: DeepSeek-Prover-V1.5-Base for each SFT prover; Qwen2.5-Coder-32B for both formalizers.
  teacher: Claude-3.5-Sonnet supplies 170K compiled training pairs for one formalizer; Qwen2.5-72B-Instruct judges faithfulness;
    successive provers supply proofs.
  generator: Two formalization styles generate Lean statements, and each expert-iteration prover samples whole proofs for
    the growing statement pool.
  filtering_rule: Require Lean statement compilation and faithfulness/completeness score at least 0.5, then retain one randomly
    selected compiler-valid proof per solved statement.
  sampling_protocol: Generate 16 proofs per statement in each expert iteration; accumulate solved statements across eight
    rounds.
  rollout_count: 16
  temperature: null
  inference_budget: Each 1.78M-statement Pass@16 sweep uses 64 H100 GPUs for about six hours plus about ten hours of verification
    on 8,000 CPUs.
  optimizer_or_scaffold: SFT from the same base each round, with learning rates 1e-4 or 5e-5, one or two epochs, packing,
    and batch size 8; DPO and GRPO are secondary explorations.
audit:
  source_mixture: The paper derives 1.64M formalizations from 860K public Numina problems using two styles, combines them
    with Lean Workbook and some private AOPS material for a 1.78M training pool, and releases 29,750 newly solved Lean Workbook
    proofs.
  split: The two official datasets expose train Parquet files. The first Goedel-Pset shard has 433,149 rows; Lean-workbook-proofs
    has 29,750 rows in one file.
  decontamination: NuminaTest is held out after formalization, but no broad text-level decontamination against every benchmark
    is documented. Lean Workbook is explicitly both training and monitored in-domain data.
  license: No dataset license tag was present in either official Hugging Face record on 2026-07-14; the code repository is
    MIT, which does not settle dataset, source-problem, or teacher-output rights.
  lineage: informal problem -> dual autoformalization -> Lean compile and faithfulness checks -> 16 proof samples -> compiler
    validation -> one retained proof -> cumulative expert iteration -> public statement/proof Parquet.
  known_failure_modes:
  - A Lean-compiling formal statement can be unfaithful to the original informal problem despite the model-based judge.
  - ProofNet and Mathlib4 have different distributions from olympiad-style data, and adding Mathlib4 helps one while hurting
    miniF2F.
  - DPO and GRPO improve Pass@32 but lengthen proofs, overproduce shortcut tactics, and yield less benefit at high inference
    budgets.
  citation_status: verified
  confidence: high
  notes: arXiv v3, official repository, two anonymous Parquet releases, their complete schemas and actual rows, scale, compiler
    contract, adoption metrics, and license absence were checked on 2026-07-14.
inclusion_reason: The paper releases compiler-verifiable statement and whole-proof supervision and documents how dual formalization
  plus expert iteration produces it.
