data_object:
  prompt_source: The report lists 85,267 agent prompts across code repair, search, general synthetic environments, and code
    interpretation. Sources mix extracted GitHub or reasoning tasks, web-derived entities, existing helpful-RL prompts, and
    fully synthetic tasks; record-level sources are not released.
  trace_author: Domain specialists generate distilled reasoning and direct-response data; DeepSeek-V3.2-based agents construct
    search questions, answers, code environments, and synthetic tool tasks. Exact checkpoint identities and human involvement
    per record are unknown.
  answer_format: Reported training objects include direct answers, reasoning responses, multi-turn tool calls and results,
    code patches, and structured task submissions. Only illustrative examples are published; no reusable training-row schema
    or corpus is released.
  process_fields:
  - task-level control instruction
  - task prompt
  - response or reasoning sequence
  - tool definitions, calls, and results
  - final answer or submitted patch
  - reference answer, gold patch, or solution function where applicable
  - verifier result, outcome reward, length penalty, and language-consistency reward where applicable
  environment_or_substrate: Real web-search APIs, multilingual executable code-repair environments, Jupyter Notebooks, and
    1,827 synthesized database-and-tool environments; packages, snapshots, APIs, and runnable environment bundles are not
    released.
  verifier_or_reward: Search uses a search-enabled verification agent and rubric-based generative reward; code repair uses
    JUnit-parsed F2P and P2F tests; general synthetic tasks use Python verification functions and non-zero pass@100 filtering;
    mixed RL also uses rule-based outcomes, length penalties, language consistency, and prompt-specific generative rubrics.
  terminal_predicate: No universal predicate exists. Search requires a validated reference answer and incorrect candidate
    answers; code environments require F2P greater than zero and P2F equal to zero after the gold patch; general tasks require
    the proposed solution to pass its verification function and later retain only tasks with non-zero pass@100.
recipe_metadata:
  base_model: DeepSeek-V3.1-Terminus with 128K context, followed by 2.1B-token indexer warm-up and 943.7B-token sparse continued
    pretraining to the DeepSeek-V3.2-Exp architecture.
  teacher: Task specialists fine-tuned from the same DeepSeek-V3.2 base generate domain data; different generators are used
    for long reasoning and direct responses. Specialist identities, versions, and per-record attribution are unknown.
  generator: DeepSeek-V3.2-based multi-agent search synthesis, automated code-environment setup, Jupyter-backed problem curation,
    and automatic database, tool, task, solution, and verifier synthesis for general agents.
  filtering_rule: Search retains questions with a verified reference answer and incorrect candidate answers; code repair requires
    issue, correlated gold patch, test patch, and executable F2P/P2F behavior; general tasks require solution-verifier agreement
    and non-zero pass@100. Other specialist and alignment filters are unknown.
  sampling_protocol: Distill reasoning and direct-response specialists, create cold-start tool-use examples, train an SFT
    checkpoint, then merge reasoning, agent, and human-alignment prompts into thousands of GRPO steps. Domain mixture weights,
    group sizes, sampling probabilities, and stage manifests are unknown.
  rollout_count: unknown
  temperature: unknown
  inference_budget: Post-training compute is reported to exceed 10 percent of pretraining cost and to include thousands of
    continued-RL steps. Exact rollout tokens, attempted and retained generations, per-domain budgets, and hardware accounting
    are unknown.
  optimizer_or_scaffold: GRPO with an importance-weighted unbiased KL estimate, masking of highly off-policy negative sequences,
    preservation of sampled MoE routing, and preservation of top-p or top-k sampling masks; actual clipping, KL, divergence,
    optimizer, batch, and schedule values are not disclosed.
audit:
  source_mixture: The agent table reports 24,667 extracted-prompt code-agent tasks, 50,275 synthetic-prompt search tasks,
    4,417 fully synthetic general-agent tasks, and 5,908 extracted-prompt code-interpreter tasks. The larger specialist-distillation,
    helpful-RL, human-alignment, and continued-pretraining mixtures are not quantified at record level.
  split: unknown
  decontamination: The authors state that evaluation environments and toolsets were not encountered in agent RL, but no train-evaluation
    match ledger, benchmark revisions, source manifest, thresholds, or broader pretraining and distillation audit is released.
  license: The official DeepSeek-V3.2 and DeepSeek-V3.2-Speciale repositories and weights are MIT, as is the DeepSeek-V3.2-Exp
    inference repository. No license or rights manifest is published for web corpora, GitHub issues and patches, helpful-RL
    prompts, specialist outputs, synthetic environments, or reward data.
  lineage: DeepSeek-V3.1-Terminus to DSA continued pretraining to DeepSeek-V3.2-Exp base to domain specialists and cold-start
    data to a distilled SFT checkpoint to mixed GRPO over reasoning, agent, and alignment tasks to DeepSeek-V3.2; reduced
    length penalty and reasoning-only RL produce Speciale.
  known_failure_modes:
  - No official V3.2 training dataset, task manifest, trajectory corpus, environment bundle, reward model, or training configuration
    is released.
  - The 85,267 task count describes prompts by category, not retained trajectories, rollout groups, reward records, or unique
    executable environments.
  - Search verification and prompt-specific generative rubrics depend on unreleased model judgments and calibration.
  - Code-environment success under a gold patch establishes test executability but not issue realism, license compatibility,
    or absence of leakage.
  - General tasks are co-synthesized with tools, solutions, and verifiers; correlated bugs or verifier shortcuts can survive
    non-zero pass@100 filtering.
  - Tool-use reasoning often repeats verification until trajectories exceed the 128K context limit; context management materially
    changes reported search results.
  - Several agent benchmarks use internal environments that may differ from official setups, limiting independent score reproduction.
  - Open weights and benchmark performance do not establish training-data provenance, verifier accuracy, or record-level quality.
  citation_status: verified
  confidence: high
  notes: Official arXiv v1, DeepSeek release note, Hugging Face model repositories, and DeepSeek-V3.2-Exp inference repository
    checked on 2026-07-19; no official V3.2 dataset was found under the DeepSeek-AI Hugging Face account.
inclusion_reason: A frontier disclosure with exact agent-task category counts, multiple environment and feedback contracts,
  specialist distillation, and a detailed scalable-GRPO design, paired with open weights but no open training data or replayable
  post-training stack.
