one_line_summary: DeepSeek-V3.2 reports 85,267 agent prompts, 1,827 synthetic tool environments, specialist distillation,
  and mixed GRPO, while releasing model weights and inference code but not training records, environments, or reward artifacts.
why_it_matters: It lets the frontier-report track compare unusually specific task and feedback descriptions against the much
  narrower set of artifacts that can actually be downloaded and replayed.
