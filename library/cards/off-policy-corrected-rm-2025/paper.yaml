one_line_summary: Retrains reward models on one fixed preference dataset using stage-specific current-to-SFT importance weights
  between blocks of policy optimization.
why_it_matters: Separates preference-data acquisition from effective-distribution construction and makes the support, variance,
  behavior-likelihood, cadence, and evaluator assumptions of off-policy reward-model correction auditable.
