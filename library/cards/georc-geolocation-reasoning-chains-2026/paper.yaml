one_line_summary: GeoRC pairs 800 expert geolocation chains with 500 scenes to expose the gap between accurate location guesses
  and auditable visual reasoning.
why_it_matters: It makes expert visual-evidence reasoning a reusable evaluation surface rather than trusting a correct final
  location alone.
