one_line_summary: GenSelect asks a reasoning model to compare indexed solution summaries, emit a chosen candidate index, and
  scale selection over 64-solution pools through repeated N-ary knockout tournaments; a related official release exposes 565,620
  packed selector rows.
why_it_matters: It separates candidate generation, comparative selector reasoning, chosen index, tournament budget, and final
  correctness, while the difference between the unreleased paper evaluation pools and the packed public training split shows
  exactly which rejected candidates, labels, and compute records remain auditable.
