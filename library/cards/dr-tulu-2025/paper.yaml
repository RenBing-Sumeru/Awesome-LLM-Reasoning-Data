data_object:
  prompt_source: SFT mixes filtered natural user information-seeking queries from SearchArena and OpenScholar with HotpotQA,
    TaskCraft, WebWalker-Silver, MegaScience and PopQA-inspired prompts. RL uses long-form filtered SearchArena/OpenScholar
    prompts plus RaR prompts. The public SFT release omits MegaScience, HotpotQA and ScholarQA subsets; public RL data omits
    the final-run RaR portion.
  trace_author: SFT trajectories are GPT-5-generated simulated reasoning, tool calls, tool outputs and cited final answers.
    RL rollouts are generated on-policy by the current DR Tulu policy with real tool calls; search-based and evolving rubrics
    are generated by LMs as documented, but full stage-by-stage rubric model/version lineage is incomplete.
  answer_format: Tool-augmented message trajectories using think, tool, answer and cite actions. Released SFT rows expose
    id, source_id, question, source, type, number of tool calls, tokenized length and conversations; released RL rows expose
    source, question_type, messages, ground_truth/rubric payload and dataset identifier.
  process_fields:
  - question
  - source_id
  - source
  - question_type
  - messages
  - conversations
  - think
  - tool_call
  - tool_observation
  - answer
  - citation
  - rubric_title
  - rubric_description
  - rubric_weight
  - rollout_score
  environment_or_substrate: dr-agent-lib with MCP-based web/paper search and browsing, asynchronous calls, caching and rate-limit
    management. Training documents Crawl4AI/browser and proxy use; demo/evaluation configurations identify Serper, Semantic
    Scholar and Jina services.
  verifier_or_reward: 'Mixed feedback: persistent search-grounded and positive/negative evolving natural-language rubrics
    scored by an LLM judge; citation claim-support/relevance and format rewards; a capped valid-search-query reward; plus
    programmatic tool/citation protocol checks.'
  terminal_predicate: A rollout terminates in a final answer and receives a composite rubric/auxiliary reward. No single objective
    success predicate is released for open-ended deep research; rubric and LLM-judge scoring remains the decisive terminal
    feedback.
recipe_metadata:
  base_model: Qwen3-8B; official model tree identifies Qwen3-8B-Base -> Qwen3-8B -> DR-Tulu-SFT-8B -> DR-Tulu-8B RL.
  teacher: GPT-5 for SFT simulated reasoning/tool/citation trajectories. The paper reports GPT-4.1-mini as LM judge and GPT-4.1
    as rubric generator in main training details, while Appendix F.2 names GPT-4.1-mini for initial released-rubric generation;
    complete per-stage version lineage is unknown.
  generator: Current policy samples multi-rollout, tool-using trajectories. A rubric LM uses external search documents, response/search
    context and existing rubric buffers to generate persistent and evolving positive/negative rubrics.
  filtering_rule: Prompt LM scores realistic long-form queries 1--5; SFT retains correctly formatted trajectories and requires
    exact final-answer match for short-form tasks. RL uses the same long-form filtering. Rubric buffers remove zero-variance
    items and retain top five by rollout-score standard deviation. Exact prompt filters and all online rubric/rollout decisions
    are not fully released.
  sampling_protocol: RL uses 32 unique prompts per batch and 8 rollouts per prompt. Persistent rubrics are initialized from
    question-seeded search; new rubrics are proposed from sampled responses and the current buffer. Final run uses approximately
    5K SearchArena/OpenScholar and 4K RaR prompts, but public RL data has only 4,881 SearchArena/OpenScholar rows and omits
    RaR.
  rollout_count: 8
  temperature: 1.0
  inference_budget: RL maximum response length 16,384 tokens; maximum 10 tool calls; maximum packed sequence 18,500 tokens;
    top-p 1.0. Tool/API rate limits, cache state and raw observations remain release-external.
  optimizer_or_scaffold: Customized GRPO with token-level aggregation, sample packing, 1-step asynchronous training, tool-output
    masking, asynchronous tool calling, KL coefficient 0.001, and dr-agent-lib concurrency/cache control.
audit:
  source_mixture: Paper reports 16K SFT trajectories from nine named prompt-source groups. Public SFT release has 13,062 rows
    and explicitly omits MegaScience, HotpotQA and ScholarQA subsets. Paper describes approximately 9K RL prompts (about 5K
    SearchArena/OpenScholar plus 4K RaR); public RL release has 4,881 SearchArena/OpenScholar rows and explicitly omits RaR.
  split: Both public data pages expose a train split only. Paper says RL prompts are partly out of distribution from evaluation
    data but does not publish a complete source-ID-level train/evaluation map or dedicated held-out split.
  decontamination: Format/exact-answer filters and prompt-quality filtering are reported, but no dedicated semantic overlap,
    benchmark contamination or web-source leakage audit was verified for the mixed prompt pools, teacher trajectories, search
    results or evolving rubrics.
  license: Repository code and final model are Apache-2.0; author-linked SFT and RL data pages are ODC-BY. Rights for user-interaction
    logs, omitted source subsets, RaR inputs, teacher outputs, crawled webpages, retrieved paper passages and citation stores
    are not established by the inspected releases.
  lineage: Named prompt sources -> LM prompt filtering -> GPT-5 SFT trajectories -> SFT checkpoint -> real-tool on-policy
    GRPO -> search-based persistent rubrics and online evolving buffers -> final RL checkpoint. The published data and checkpoints
    do not supply a full per-record/per-step source, tool-result, rubric-revision, reward and checkpoint lineage.
  known_failure_modes:
  - Rubric and citation support scores rely materially on LLM judgments; their calibration, agreement, prompt/version stability
    and adversarial robustness are not established by the release.
  - The public SFT and RL datasets explicitly omit portions used in the paper/final run, so the public files are not a complete
    training-data reproduction package.
  - Positive/negative rubric generation can encode search availability, model bias or policy-specific shortcuts; zero-variance
    pruning does not prove semantic validity.
  - Training used Crawl4AI and a proxy configuration while current demo/evaluation paths identify other APIs and browser tools;
    environment observations and rate limits are not pinned.
  - Citation-format, query-count and LLM-evaluated support rewards can improve protocol compliance without proving factual
    truth, source rights or long-horizon research quality.
  - The model page notes final step 4000 but says some intermediate checkpoints are unavailable.
  citation_status: verified
  confidence: high
  notes: Official arXiv v3, Ai2 release post, rlrsearch source repository and Apache license, author-linked Hugging Face collection,
    SFT/RL dataset cards and final model card were checked on 2026-07-16. Official artifact availability is high; data/feedback
    lineage is materially partial.
inclusion_reason: An unusually open deep-research training release that exposes an end-to-end SFT-to-agentic-RL recipe, rubric
  data, tools, code and checkpoints while making the distinction between released static rubric data and unexposed online
  evolving feedback essential for audit.
