one_line_summary: Releases SFT/RL datasets, code and checkpoints for a deep-research agent trained with GRPO and search-grounded
  evolving rubrics, while the final data mixture, online rubric history and evaluator calibration remain only partially disclosed.
why_it_matters: 'Makes a long-form, tool-using feedback contract concrete enough to audit: it separates programmatic protocol
  rewards from LLM-judged rubrics and shows why an open model/data release still needs per-step rubric, source-rights and
  environment provenance before reuse.'
