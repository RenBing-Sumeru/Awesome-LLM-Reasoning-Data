data_object:
  prompt_source: Training instances from 16 public tasks spanning reasoning, mathematics, programming, web navigation, and
    embodied interaction.
  trace_author: GPT-4 explores or answer-forces action sequences, heuristic search recovers discrete plans, and GPT-3.5-Turbo
    supplies most action rationales.
  answer_format: Chatbot-style episodes containing an instruction followed by rationale-bearing actions and environment observations
    through termination.
  process_fields:
  - instruction
  - thought
  - action
  - observation
  - final answer
  - task/config
  environment_or_substrate: Sixteen task environments with continuous language/code actions or discrete embodied and web actions.
  verifier_or_reward: Task-native execution, exact match, success rate, or average reward validates action sequences and terminal
    answers.
  terminal_predicate: Retain a gold or successfully executed trajectory; answer forcing may revise a failed exploration using
    the known final answer.
recipe_metadata:
  base_model: Llama-2-Chat 7B and 13B, with additional base-model scaling checks
  teacher: GPT-4 and GPT-3.5-Turbo, plus task-native heuristic search
  generator: Exploration, answer forcing, heuristic action search, and trajectory reformatting are selected by action-space
    type.
  filtering_rule: Execute candidate actions in the real environment, retain correct paths, downsample oversized sources, and
    re-annotate failures when a gold answer is available.
  sampling_protocol: Balance 51,287 paper-reported trajectories across 16 tasks, then mix 10% ShareGPT and 10% Evol-CodeAlpaca
    in the main SAMOYED recipe.
  rollout_count: 51287
  temperature: null
  inference_budget: Teacher call counts, tokens, monetary cost, and unified wall time are not reported.
  optimizer_or_scaffold: Mask instruction and observation tokens and apply autoregressive loss only to the ground-truth action
    responses.
audit:
  source_mixture: The paper reports 51,287 trajectories across 16 tasks; the current Hugging Face conversion exposes 19 configurations
    and 53,205 rows, so release revision must be pinned.
  split: Training trajectories come from public task training splits; evaluation includes nine held-in and five held-out tasks.
  decontamination: The paper reports 9-gram and 13-gram overlap checks against AGENT BANK, ShareGPT, and Evol-CodeAlpaca,
    but semantic duplication remains possible.
  license: The public Hugging Face dataset declares Apache-2.0; upstream task assets can retain their original terms.
  lineage: The released object is directly consumed by masked-loss trajectory SFT; task rewards validate paths but do not
    become per-token supervision.
  known_failure_modes:
  - Gold-answer forcing can make a path easier than genuine open-loop exploration.
  - Generated rationales need not faithfully explain the selected gold actions.
  - Current hosted row counts differ from the paper total and require revision-aware reporting.
  citation_status: verified
  confidence: high
  notes: Proceedings metadata, paper tables, annotation prompts, public configurations, one InterCode Bash record, and license
    were checked on 2026-07-14.
