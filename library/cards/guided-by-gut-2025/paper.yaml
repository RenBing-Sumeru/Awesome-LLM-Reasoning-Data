one_line_summary: Guided by Gut calibrates model confidence with correctness-conditioned GRPO, then uses token confidence
  and novelty to score step-level DVTS branches and confidence-vote final answers.
why_it_matters: For rollout/search/test-time trace curation, it specifies the branch scores, retained paths, budgets, stopping
  rules, and final selector, while showing why intrinsic confidence must remain distinct from verified correctness.
