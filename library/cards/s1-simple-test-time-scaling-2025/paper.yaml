one_line_summary: s1 filters a 59,029-question mixed-source pool by generation quality, Qwen difficulty, Claude-labeled diversity,
  and trace length into the 1,000-example Gemini-distilled s1K, then combines SFT with inference-time budget forcing.
why_it_matters: The work demonstrates that careful selection can match a 59K-data ablation with roughly 1/59 as many training
  examples, and it cleanly separates a reusable data recipe from a decoding intervention while revealing how much lineage,
  judgment evidence, and determinism an apparently open release can still omit.
