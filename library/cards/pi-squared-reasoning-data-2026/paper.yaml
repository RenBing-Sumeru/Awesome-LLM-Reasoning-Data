data_object:
  prompt_source: High-view and recent Wikipedia pages, their tables, linked pages, and web-search evidence.
  trace_author: GPT-OSS-120B or Qwen3.5-35B-A3B-FP8 back-translates reasoning according to the target student family.
  answer_format: Long unstructured context, multi-hop analytical question, structured reasoning trace, and short verified
    answer.
  process_fields:
  - Wikipedia table and metadata
  - generated question and SQL query
  - independent Python answer and consensus result
  - compacted web context
  - back-translated reasoning trace and final answer
  environment_or_substrate: SQL and Python execution over tables plus web-search context compacted to at most 96K tokens.
  verifier_or_reward: LLM quality ratings, SQL/Python dual execution, LLM consensus, and human review for π2-Bench.
  terminal_predicate: Retain QA only when SQL and Python answers agree; regenerate low-quality questions up to three times.
recipe_metadata:
  base_model: GPT-OSS-20B and Qwen3-4B-Instruct-2507.
  teacher: GPT-OSS-120B or Qwen3.5-35B-A3B-FP8.
  generator: Expand Wikipedia tables, generate executable QA, gather realistic documents, then back-translate reasoning from
    context and answer.
  filtering_rule: Table-size filters, Likert quality checks, SQL/Python consensus, evidence-retention checks, and benchmark
    human review.
  sampling_protocol: 6,614 pages yield 2,834 tables and 1,174 validated QA traces; 922 records form the training set.
  rollout_count: null
  temperature: null
  inference_budget: LoRA SFT takes about 2.5 hours on four H200 GPUs per model.
  optimizer_or_scaffold: LoRA rank 8 SFT on 922 examples.
audit:
  source_mixture: Wikipedia tables and pages plus ten web-search articles per validated QA context.
  split: 922 training records; π2-Bench has 228 human-validated items split into 178 test and 50 validation examples.
  decontamination: Training and π2-Bench are disjoint; broader benchmark-overlap checks are not reported.
  license: Official repository and Google Drive release do not state a dataset license in the inspected README.
  lineage: Questions originate from table structure, while traces are generated without exposing the table to the teacher.
  known_failure_modes:
  - Seventeen percent of selected benchmark candidates required human revision, showing residual automatic-quality errors.
  - Results cover context-provided QA up to 128K and small-model LoRA SFT, not million-token or free-form tasks.
  citation_status: verified
  confidence: high
  notes: arXiv PDF and official GitHub README were checked on 2026-07-13. The PDF says under review and lists Virginia Tech;
    no acceptance record was found.
inclusion_reason: Provides open long-context QA and reasoning traces whose answers are grounded by independent SQL and Python
  execution.
