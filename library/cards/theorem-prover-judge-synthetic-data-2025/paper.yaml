status: partial
one_line_summary: A Lean-grounded recipe for generating and selecting synthetic mathematical reasoning, with executable step
  checks, retry feedback, and explicit SFT/DPO routing.
why_it_matters: It makes an executable theorem prover part of the data-allocation contract while exposing formalisation fidelity,
  selection bias, and unavailable release artifacts as audit risks.
