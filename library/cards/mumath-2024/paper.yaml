one_line_summary: MuMath turns GSM8K and MATH into multi-perspective natural-language SFT data, with a 304K main recipe and
  a distinct approximately 751K scaled release.
why_it_matters: It tests whether diversifying both the problem and the visible solution structure improves tool-free math
  reasoning, while exposing a useful but easy-to-miss release-version boundary.
