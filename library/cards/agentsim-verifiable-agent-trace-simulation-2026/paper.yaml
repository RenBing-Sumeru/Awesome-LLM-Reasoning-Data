data_object:
  prompt_source: MS MARCO, Quasar-T, and CausalQA benchmark corpora.
  trace_author: Simulated RAG analysts with active validation and human review of ambiguous steps.
  answer_format: Step-level input, output, tool, rationale tag, decision label, evidence, token and latency metadata, and
    source provenance.
  process_fields:
  - step_id
  - input
  - output
  - tool
