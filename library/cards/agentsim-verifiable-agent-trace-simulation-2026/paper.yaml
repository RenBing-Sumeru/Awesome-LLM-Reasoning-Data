  - source_license
  environment_or_substrate: Simulated retrieval-augmented generation over document collections.
  verifier_or_reward: Multi-model Analyst-Critic-Judge active validation and per-step divergence score, with human review
    of disputed cases.
  terminal_predicate: Grounded substantive answer and validated agent trace.
recipe_metadata:
  base_model: GPT-4o, Mistral-Large, DeepSeek-V3, and other configurations described in the paper and repository.
  teacher: Multi-model Analyst-Critic-Judge validation pipeline.
  generator: AgentSim simulations using corpus-aware seed selection and RAG workflow components.
  filtering_rule: Flag high-disagreement steps for active validation and preserve provenance and source-license metadata.
  sampling_protocol: Corpus-aware seeding uses clustering, maximal marginal relevance, and retrieval-novelty filtering.
  inference_budget: 3,000 exploratory simulations for the published corpus; model and configuration should be pinned.
  optimizer_or_scaffold: RAG-agent simulation, process reward modeling, grounded fine-tuning, and distillation.
  rollout_count: null
  temperature: null
audit:
  source_mixture: 103,567 reasoning steps from MS MARCO, Quasar-T, and CausalQA, plus 20,548 supervised query-document-answer
    triples.
  split: Use the release's traces, trajectories, and supervised configurations and pin exact JSONL files.
  decontamination: Not stated as a benchmark-decontamination protocol; inspect source-corpus overlap for any target task.
  license: MIT for AgentSim-generated wrapper data; upstream per-row source licenses remain controlling.
  lineage: SIGIR 2026 paper, official AgentSim repository, and author organization dataset release.
