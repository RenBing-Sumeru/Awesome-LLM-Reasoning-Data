one_line_summary: DART-Math converts MATH and corrected GSM8K training prompts into answer-verified CoT pairs by allocating
  more DeepSeekMath-7B-RL trials to queries with lower pass rates.
why_it_matters: It turns a usually hidden rejection-sampling budget into an auditable data-construction choice and demonstrates
  that coverage and difficulty distribution can matter independently of final dataset size.
