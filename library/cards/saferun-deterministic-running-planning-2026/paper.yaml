data_object:
  prompt_source: Human-curated multi-week running requests paired with runner profiles.
  trace_author: Ten human experts curate requests; SafeRun produces solver-constrained plans.
  answer_format: Natural-language request, runner profile, constrained plan, and rule-based scores.
  process_fields:
  - runner_profile
  - planning_request
  - solver_api_calls
  - plan
  - safety_score
  environment_or_substrate: OR-Tools CP-SAT deterministic solver and predefined planning APIs.
  verifier_or_reward: Rule-based checks of intensity, rest, weekly mileage, and per-session mileage constraints.
  terminal_predicate: Every hard running-safety constraint is satisfied by the generated plan.
recipe_metadata:
  base_model: Five proprietary and open-source LLMs are evaluated as language interfaces.
  teacher: Ten human experts curate queries and profiles; the deterministic solver supplies validity feedback.
  generator: LLM parses a request into calls to predefined planning APIs; CP-SAT returns a plan or conflict.
  filtering_rule: Retain feasible profile-query pairs that conform to the prescribed safety rules.
  sampling_protocol: 100 curated queries, 10 profiles, and four random profile pairings per query yield 400 evaluation combinations.
  rollout_count: 5
  temperature: null
  inference_budget: Fix planning APIs, CP-SAT implementation, rules, model version, profiles, and iteration cap.
  optimizer_or_scaffold: Decoupled CodeAct-style generate-execute loop with deterministic constraint enforcement.
audit:
  source_mixture: Official arXiv paper and author Hugging Face benchmark release.
  split: 100 queries, 10 profiles, and 400 profile-query combinations; consult the release for file-level splits.
  decontamination: Audit potential overlap between public running plans and model pretraining data before use.
  license: Check the official dataset card before reuse.
  lineage: https://huggingface.co/datasets/zzp-seeker/SafeRun-RunPlanning-Benchmark
  known_failure_modes:
  - The benchmark includes feasible profile-query pairs only and does not test conflicting requests.
  - The hard constraints are manually designed for running and may not generalize to other domains.
  - A solver can only enforce constraints correctly parsed from the user request.
