data_object:
  prompt_source: OCR-derived mathematics books, NaturalReasoning questions, MATH failure cases and retrieved neighbors, and
    textbook chunks; exact source manifests are undisclosed.
  trace_author: Qwen2.5-72B writes Math-Cosmo explanations and QwQ-32B regenerates NaturalReasoning answers; several other
    generator/filter models are unnamed.
  answer_format: Educational rewrites, distilled reasoning answers, weakness-guided problems, and textbook question-solution
    pairs; no canonical released schema exists.
  process_fields:
  - source
  - generated_text
  - answer_consistency
  - retrieval_rank
  - quality_decision
  - deduplication_decision
  environment_or_substrate: Fixed 80% validated code/math plus 20% candidate-data training comparisons.
  verifier_or_reward: Benchmark deltas, answer agreement, unspecified LLM quality judgments, and MinHash deduplication.
  terminal_predicate: Candidate data are useful when the controlled mixture improves the baseline; record-level predicates
    remain partial.
recipe_metadata:
  base_model: DeepSeek-V2-Lite or Qwen2.5-3B; table-to-checkpoint mapping is incomplete.
  teacher: Qwen2.5-72B and QwQ-32B, with other models unknown.
  generator: OCR restructuring, strong-model distillation, failure-guided retrieval/augmentation, and textbook QA extraction.
  filtering_rule: Consistency checks, LLM filtering and MinHash; exact prompts, thresholds and rejects are unknown.
  sampling_protocol: Every candidate is evaluated at 20% mixture weight against 80% validated data.
  rollout_count: unknown
  temperature: unknown
  inference_budget: Math-Cosmo expands about 0.13B OCR tokens to 760M tokens; full generation/training cost is unknown.
  optimizer_or_scaffold: Controlled annealing-style comparison; exact optimizer and schedule are undisclosed.
audit:
  source_mixture: The validated baseline and record-level mixtures are not released.
  split: Item-level splits, seeds, source snapshots, and the separation between MATH failure seeds and MATH evaluation are
    unknown.
  decontamination: MinHash is reported for textbook QA deduplication, not benchmark decontamination; benchmark-wide overlap
    and MATH failure-seed separation are unknown.
  license: Paper is CC BY 4.0; constructed-data and source-book rights are unavailable.
  lineage: Aggregate pipelines are described without stable IDs, source pages, teacher logs or rejection records.
  known_failure_modes:
  - Agreement can preserve concordant wrong answers
  - candidate mixtures confound several factors
  - constructed corpora and code are unreleased
  - results lack repeated-run uncertainty
  - reasoning length is not a reliable difficulty proxy
  citation_status: verified
  confidence: medium
  notes: Publication is verified; no official construction artifact was identified.
inclusion_reason: Controlled comparison of math-data selection and synthesis, including useful negative results and release-audit
  lessons.
