one_line_summary: Compares math-data recipes under a fixed 80/20 scaffold, finding benefits from restructuring and strong-model
  distillation but releasing none of the constructed corpora.
why_it_matters: Separates practical data-recipe effects from simple scale while exposing missing controls, lineage and release
  artifacts.
