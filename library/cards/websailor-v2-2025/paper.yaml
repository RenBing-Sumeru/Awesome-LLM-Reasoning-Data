data_object:
  unit_of_record: 'The paper links three objects: a synthetic SailorFog-QA-V2 question-answer instruction pair, a successful
    rejection-sampled ReAct trajectory used for SFT, and a strictly on-policy ReAct rollout receiving one terminal scalar
    reward during RL. The final ICLR paper reports more than 30,000 SailorFog-QA-V2 instruction-tuning pairs used for SFT
    and RL, but does not establish that 30,000 complete trajectories were produced or retained, and no V2 records are publicly
    downloadable from the official project directory.'
  prompt_source: SailorFog-QA-V2 starts from seed entities and uses web tools to expand a dense graph of real-internet facts.
    V2 deliberately adds cyclic connections, preserves discovery queries and source URLs internally, and stores entity statistics.
    Random walks extract connected subgraphs; the Weisfeiler-Leman algorithm verifies non-isomorphism; orbit-node analysis
    distributes QA focus across structural roles. Final-paper uncertainty types include semantic ambiguity, plausible distractor
    noise, and structural constraints targeting bridges or cut vertices. Exact seeds, source manifest, prompts, generator
    identities, and record-level graph provenance are unknown.
  trace_author: Unspecified high-performing open-source models solve generated QA tasks to produce candidate SFT trajectories,
    with rejection sampling used for quality control. During RL, the current WebSailor-V2 policy generates strictly on-policy
    rollouts. Model names, revisions, prompts, decoding settings, candidate counts, acceptance rates, and retained/rejected
    trace identifiers are not disclosed.
  task_record:
  - synthetic question
  - reference answer
  - sampled connected subgraph, not publicly released
  - uncertainty type, record-level field not publicly verified
  - discovery queries and source URLs, internally preserved but not released
  episode_fields:
  - question and reference answer
  - thought
  - action name and arguments
  - observation
  - repeated thought-action-observation rounds
  - final-answer action
  - terminal scalar reward during RL
  context_or_state: At round t, the policy conditions on the entire preceding ReAct history of thoughts, actions, and observations.
    The maximum reported context is 128k; the paper does not release serialized V2 contexts, observation logs, or a state
    schema tied to the paper-scale corpus.
  trace_or_actions: The action space comprises Search, Visit, Google Scholar, Python interpreter, and a terminal Final Answer
    action. A complete episode interleaves free-form thought, one tool action, and the returned observation until Final Answer
    or a budget/failure condition. No V2 trajectory serialization specification is released.
  observation: Search queries Google and returns the top ten titles, snippets, and URLs per query. Visit retrieves pages with
    Jina and uses Qwen3-30B-A3B to produce a goal-conditioned summary. Google Scholar returns scholarly search results; Python
    runs model-generated code in a sandbox. The simulator instead uses an offline Wikipedia database and corresponding web
    tools. Exact snapshots, parser versions, cache contents, and tool-response schemas are unknown.
  answer_or_artifact: Each task has a reference answer, each SFT example is a successful tool-using solution selected by rejection
    sampling, and each RL rollout ends with a final answer or an incomplete/overlength failure. The repository does not release
    the V2 QA records, successful SFT trajectories, or RL rollouts.
  process_labels:
  - rejection-sampling acceptance for SFT, implementation undisclosed
  - terminal scalar reward for RL, verifier implementation undisclosed
  - selective exclusion of some negative trajectories from the RL loss
  verifier_or_reward: The RL objective consumes an episode reward R_i and forms a leave-one-out group-relative advantage by
    subtracting the other/group mean. The paper does not define how R_i is computed, name a verifier or judge, specify a correctness
    equivalence rule, or publish reward code. Benchmark accuracy is evaluated with LLM judges, but that evaluation statement
    does not establish the training reward contract. Accordingly the verification contract is recorded as unknown, not inferred
    as programmatic, environmental, or judgment-based.
  reward: One undisclosed scalar R_i per RL trajectory. It is used in a tailored GRPO objective with token-level policy gradients
    and leave-one-out advantage estimation. Reward scale, components, verifier model or rules, calibration, and behavior on
    alternative valid answers are unknown.
  terminal_predicate: A normal episode terminates when the model emits Final Answer. The paper also identifies negative trajectories
    that fail to emit a final answer after exceeding a length limit and selectively excludes some of them from the loss. The
    final-answer correctness predicate, timeout policy, and tool-failure accounting are not disclosed.
  provenance: Seed entity -> live-web graph expansion with denser cyclic links -> random-walk connected-subgraph extraction
    and Weisfeiler-Leman non-isomorphism check -> orbit-aware uncertainty-rich QA generation -> open-source-model rollout
    and rejection sampling for SFT -> Qwen3-30B-A3B-Thinking-2507 cold start -> current-policy simulator or managed-live-web
    rollout -> undisclosed terminal reward -> token-level tailored-GRPO update. Record-level lineage is not public.
  environment_or_substrate: A dual environment is reported. An offline Wikipedia simulator and matched tools support low-cost
    algorithm iteration and dedicated simulation train/test tasks. Final training uses a managed live environment with multiple
    search sources, page parsers, and a code sandbox behind QPS limits, caching, timeout/retry handling, graceful degradation,
    and backup sources. Neither environment implementation, offline snapshot, cache, nor replay fixture is released in the
    V2 directory.
  release_boundary: The official V2 GitHub directory contains only README.md and two image assets at both the 2025-09-17 release
    commit and the current inspected commit. Its README links the paper and the generic Hugging Face paper page but no V2
    dataset, V2 checkpoint, training code, simulator, reward service, or trajectory archive. The V1 sibling directory contains
    inference code and a 20-row SailorFog-QA example, and Alibaba-NLP publishes V1 WebSailor checkpoints; none of those V1
    artifacts are attributed to V2 here.
recipe_metadata:
  base_model: Qwen3-30B-A3B-Thinking-2507 is the reported SFT foundation model and Qwen3-30B-A3B-2507 is named in the experiment
    setup. The exact upstream revision and whether these labels denote one identical checkpoint are unknown.
  teacher: unknown
  generator: Undisclosed models expand the web graph and generate QAs; unspecified high-performing open-source models generate
    candidate SFT trajectories; the latest policy produces strictly on-policy RL rollouts. Qwen3-30B-A3B is the Visit summarizer,
    not established as the SFT trajectory teacher.
  prompt_task_source: Dense real-internet knowledge graphs seeded by entities, plus a separate SailorFog-QA-V2 adaptation
    built over an offline Wikipedia corpus for the simulator. The experiment section also says training data primarily includes
    SailorFog-QA and SailorFog-QA-V2 with IterBench supplementation; stage-level counts and mixture weights are not disclosed.
  paper_scale: More than 30,000 high-quality SailorFog-QA-V2 instruction-tuning pairs in the final ICLR paper. Connected components
    average approximately 30 nodes and average degree 2.5. The count of complete SFT trajectories, RL task prompts, simulator
    records, rollout episodes, and retained failure cases is unknown.
  filtering_rule: SFT uses rejection sampling, but success criteria and thresholds are undisclosed. RL selectively excludes
    certain negatives from the loss, including examples without a final answer because a length limit was exceeded; the full
    exclusion rule and retained-negative rate are unknown. Training data are also synthesized and filtered dynamically from
    training signals, but the data-policy feedback policy is not specified.
  selection_threshold: unknown
  sampling_protocol: Random walks sample connected subgraphs from dense graphs and the Weisfeiler-Leman algorithm checks non-isomorphism;
    QA focus is balanced across orbit-node roles. RL samples groups strictly on-policy. The paper says it does not use dynamic
    rollout sampling and instead relies on larger batches and groups, but group size, seeds, and per-task rollout counts are
    unknown.
  rollout_count: unknown
  temperature: RL rollout temperature 1.0 with top-p 1.0. Evaluation uses temperature 0.85 and top-p 0.95. SFT teacher, graph/QA
    generation, and Visit summarization decoding settings are unknown.
  inference_budget: WebSailor-V2 increases context length from V1's 32k to 128k and raises the maximum ReAct iterations to
    100. Total training tokens, per-tool response limits, wall-clock budget, hardware, API calls, retries, and monetary cost
    are not disclosed.
  search_or_scaffold: Vanilla ReAct with Search, Visit, Google Scholar, Python interpreter, and Final Answer. Search returns
    top-ten Google results; Visit uses Jina plus a Qwen3-30B-A3B goal-conditioned summarizer. A managed tool layer adds QPS
    control, caching, retry, graceful degradation, and backups.
  optimizer_or_training_scaffold: Megatron is used for SFT with batch size 64, learning rate 5e-6 decaying to 1e-10 after
    warmup, cosine decay, and weight decay 0.1. rLLM is used for a tailored GRPO RL objective with strict on-policy sampling,
    token-level policy gradients, leave-one-out advantage estimation, asymmetric clipping notation, batch size 128, and learning
    rate 1e-6. Clip bounds and group size are unknown.
  user_simulator: null
audit:
  source_mixture: SailorFog-QA-V2 combines real-web graph facts, synthetic uncertainty-rich QA, open-source-model solution
    trajectories, and on-policy simulator/live-web rollouts. The experiment section additionally lists V1 SailorFog-QA and
    IterBench. Source proportions, language/domain mix, source URLs, crawl dates, record-level mixture tags, and stage-specific
    allocations are not released.
  split: The paper mentions dedicated training and testing data for the offline Wikipedia simulator but gives no counts, split
    rule, stable IDs, or manifests. No public train/dev/test split exists for the reported 30K-plus V2 pairs or trajectory
    populations.
  decontamination: unknown
  benchmark_overlap: The paper evaluates on BrowseComp-EN, BrowseComp-ZH, GAIA, xbench-DeepSearch, HLE, and DeepResearch Bench
    and reports a direct experiment on the BrowseComp test set, but it provides no exact, semantic, entity, source-page, temporal,
    or tool-observation overlap audit between training data and those benchmarks. The failed direct-training comparison is
    not a decontamination analysis.
  lineage: Method-level lineage from web graph through QA, SFT trace, on-policy rollout, and reward update is described. Stable
    record IDs, source URLs, graph/subgraph objects, generation prompts, model snapshots, rejection decisions, rollout IDs,
    rewards, and checkpoint-example mappings are not public.
  license: arXiv v1 is posted under CC0 1.0 and the OpenReview record states CC BY 4.0 for the conference submission. The
    WebAgent subtree has an MIT license while the repository root has Apache-2.0. These paper/repository terms do not establish
    a license for the unreleased SailorFog-QA-V2 records, trajectories, offline Wikipedia snapshot, cached live-web content,
    or generated tool observations; their reuse and redistribution rights are unknown.
