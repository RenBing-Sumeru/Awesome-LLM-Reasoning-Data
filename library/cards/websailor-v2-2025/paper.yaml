one_line_summary: WebSailor-V2 reports 30K-plus synthetic instruction pairs, rejection-sampled ReAct SFT, and on-policy RL
  across offline-Wikipedia and managed live-web environments, but releases no V2 data, code, verifier, or complete trajectories.
why_it_matters: It is a strong construction-recipe case for how topology-aware web tasks, successful tool-use traces, and
  dual-environment RL can be coupled, while sharply demonstrating why paper scale, public release scale, reward reproducibility,
  V1/V2 provenance, and failure retention must be audited independently.
