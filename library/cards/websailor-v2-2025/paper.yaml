  version_and_v1_boundary: 'The final ICLR record has 21 authors and adds dataset statistics absent from the 17-author arXiv
    v1. V2 is explicitly a successor to WebSailor-V1: it uses denser cyclic graphs, random-walk rather than attempted exhaustive
    subgraph enumeration, additional uncertainty types, a Qwen3 30B-A3B MoE rather than V1''s 72B dense model, 128k rather
    than 32k context, up to 100 ReAct rounds, and a dual simulator/live-web RL setup. V1 code, 20 QA examples, and Alibaba-NLP
    WebSailor checkpoints are separate artifacts and are not evidence that V2 data, training code, or trajectories are released.'
  artifact_release_state: Paper, ICLR/OpenReview metadata, and a documentation-only V2 project directory are public. V2 QA
    data, successful SFT trajectories, RL prompts and complete rollouts, failed/timeout/tool-error episodes, synthesis code,
    training code, simulator, Wikipedia snapshot, reward implementation, and a V2-specific model link are not present in the
    official V2 directory or linked by its README.
  released_objects:
    paper_released: true
    documentation_readme_released: true
    v2_qa_records_released: false
    v2_sft_trajectories_released: false
    v2_rl_rollouts_released: false
    complete_successful_trajectories_released: false
    complete_failed_trajectories_released: false
    synthesis_code_released: false
    training_code_released: false
    simulator_code_released: false
    reward_code_released: false
    offline_wikipedia_snapshot_released: false
    v2_specific_model_link_released: false
  successful_and_failed_sample_retention: SFT uses rejection sampling, implying unsuccessful candidates are not part of the
    retained supervised set, but the paper does not state whether those candidates are archived. RL samples both positive
    and negative outcomes and selectively removes some negatives from the loss, including overlength runs without Final Answer,
    but it does not report whether excluded negatives, tool/API failures, timeouts, retries, or all successful and failed
    rollouts are preserved. No complete success/failure trajectory bundle is publicly available.
  environment_versioning: Neither the offline Wikipedia dump/date/index nor the live search providers, page-parser versions,
    cache keys/content, retry policy, backup-source routing, sandbox image, browser/network state, or service revisions are
    pinned. The environments therefore cannot be independently replayed from public artifacts.
  verifier_or_judge_failure_modes:
  - The training reward R_i is undefined beyond being a terminal scalar, so answer equivalence, alternative-valid-answer handling,
    reward hacking, and false-positive/false-negative rates cannot be audited.
  - Benchmark accuracy uses LLM judges, but judge models, snapshots, prompts, repetitions, calibration, human agreement, and
    robustness are not fully disclosed; this must not be conflated with the RL verifier.
  - Live search, Jina retrieval, summary-model compression, caching, retries, degradation, and backup sources can change observations
    and rewards across time even for nominally identical actions.
  - Selective negative exclusion can hide overlength or non-answering failure modes and changes the effective training distribution
    without a public exclusion ledger.
  - The final paper reports a 30K-plus pair scale without a public manifest, so duplicate, source-overlap, contamination,
    and per-record provenance claims cannot be independently checked.
  privacy_or_consent: The pipeline mines real-internet information and internally preserves source URLs, but the paper discloses
    no privacy review, personal-data policy, consent basis, source exclusion list, robots-policy handling, takedown process,
    or redaction procedure. Wikipedia and live-web content rights require separate review from the paper and repository licenses.
  known_failure_modes:
  - External API latency, failure, and inconsistent returns can contaminate trajectories.
  - Unfiltered negative trajectories can destabilize RL and cause format collapse.
  - Some trajectories exceed the length limit without producing a final answer.
  - Rewards are sparse enough that a weak pre-SFT policy may rarely obtain positive feedback.
  - Live-web observations are non-stationary and prevent deterministic replay.
  - Report-writing style is less optimized than information retrieval and synthesis.
  citation_status: verified
  confidence: medium
  notes: Audited arXiv v1 full text and appendix, the final ICLR/OpenReview record and final-paper dataset-statistics text,
    the official ICLR schedule, official V2 README, release/current GitHub trees, nested licenses, V1 sibling tree, and Hugging
    Face searches on 2026-07-20. Confidence is medium because material reward, corpus, mixture, environment, release, and
    replay details remain undisclosed despite strong bibliographic and high-level method evidence.
  remaining_unknowns:
  - exact 30K-plus record count, record schema, splits, stable IDs, checksums, languages, domains, duplicates, and stage-level
    mixture weights
  - QA/graph generator models, prompts, seed entities, crawl dates, source manifests, uncertainty labels, and per-record provenance
  - SFT trajectory teacher models, revisions, prompts, decoding, candidate counts, rejection criteria, acceptance rates, and
    retained/rejected traces
  - RL group size, rollout population, reward definition, verifier model or rules, terminal correctness predicate, clipping
    values, seeds, and checkpoint lineage
  - complete successful, incorrect, overlength, timed-out, retried, and tool-failed trajectory retention and release policy
  - simulator implementation, offline Wikipedia snapshot, tool versions, cache/retry/backup routing, dependency locks, sandbox
    image, and replay fixtures
  - exact allocation of SailorFog-QA, SailorFog-QA-V2, and IterBench across SFT and RL despite differing stage-level descriptions
  - decontamination and source-overlap audit against all six evaluation benchmarks
  - data-, trajectory-, cached-web-, and simulator-specific licenses, privacy review, and redistribution/training rights
  - whether an official V2-specific checkpoint exists and how it relates to the separately released Tongyi-DeepResearch model
inclusion_reason: 'WebSailor-V2 is directly relevant because it specifies a high-scale path from dense web-derived QA construction
  to complete ReAct supervision and on-policy agent RL across simulated and live environments. Its value to this atlas is
  equally the audit boundary: a paper-reported 30K-plus instruction-pair corpus and complete-episode training recipe coexist
  with a documentation-only V2 release, an undisclosed reward contract, and no public successful or failed trajectory archive.'
