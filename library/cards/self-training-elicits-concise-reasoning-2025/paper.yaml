status: partial
one_line_summary: Per-question self-training selects the shortest parser-correct target-model rollout—optionally from few-shot-conditioned
  candidates—and distills it with one-epoch SFT for shorter greedy math reasoning.
why_it_matters: It converts best-of-N search into concise SFT traces for the rollout-search track, while exposing the need
  to audit training-time compute, parser errors, dropped hard questions, and the unreleased accepted/rejected trajectory ledger.
