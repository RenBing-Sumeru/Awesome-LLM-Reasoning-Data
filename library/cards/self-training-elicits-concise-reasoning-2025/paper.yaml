data_object:
  prompt_source: Original GSM8K (7,473 train/1,319 test) and MATH (7,500 train/MATH-500 evaluation) splits.
  trace_author: Each target model generates its own candidates; optional few-shot exemplars are human, GPT-4o, or target-model
    generated.
  answer_format: Question plus reasoning path ending in an extractable final answer; a Python parser normalizes and compares
    the answer with the oracle.
  environment_or_substrate: Offline vLLM generation, per-question shortest-correct selection, one-epoch HuggingFace Trainer
    SFT, and greedy evaluation.
  verifier_or_reward: Programmatic final-answer parser; FS-Self additionally uses GPT-4o ACCEPT/REJECT judgment for eight
    exemplars.
  terminal_predicate: Select the shortest parser-correct candidate for each question; exclude questions with no correct candidate.
    FS-Self exemplars must also pass GPT-4o.
recipe_metadata:
  base_model: 'Main: Llama-3.2-3B, Gemma-2-2B, Qwen2.5-3B, Qwen2.5-Math-1.5B, DeepSeekMath-7B; scaling adds Llama-3.2-1B and
    Llama-3.1-8B.'
  teacher: No external teacher for naive BoN; few-shot variants use human, GPT-4o, or self-generated exemplars. GPT-4o revision
    is unknown.
  generator: Target-model stochastic candidates from default and/or few-shot-conditioned distributions.
  filtering_rule: Per question, parser-filter correct answers and select the shortest token sequence; FS-Self adds GPT-4o
    exemplar judgment.
  sampling_protocol: 'Naive BoN: 16 paths/question. FS-BoN: 16 conditioned + 16 default, plus matched 8+8. FS-Self: 128 paths
    for each of 128 random training questions, then select eight exemplars. T=0.7; caps 512 GSM8K/1,024 MATH.'
  rollout_count: 16 primary; 16+16 or 8+8 FS-BoN; 128 per selected question for FS-Self exemplar search.
  temperature: 0.7 for data generation; greedy evaluation.
  inference_budget: Search cost is paid during data construction so the fine-tuned model is evaluated greedily.
  optimizer_or_scaffold: HuggingFace Trainer, one epoch, batch 16, learning rate 1e-5, BF16; vLLM generation; main experiments
    approximately 1,000 H100 GPU-hours.
audit:
  source_mixture: GSM8K/MATH question+oracle -> target-model candidates under default/few-shot prompts -> parser correctness
    -> per-question shortest selection -> SFT; FS-Self adds GPT-4o exemplar judgment.
  split: Original dataset splits are used; no immutable retained/rejected trace manifest is verified.
  decontamination: unknown
  license: Paper reports original GSM8K and MATH licenses as MIT and repository code as MIT; generated trace corpus license
    is unknown because no complete corpus is released.
  lineage: Recipe is public, but per-row source ID, all candidates, parser outputs, selected ID, prompt/model revision and
    run seed are not released together.
  known_failure_modes:
  - Final-answer parser acceptance does not prove rationale validity or faithfulness.
  - Shortest-correct selection can favor terse shortcuts and parser exploits.
  - Questions without any correct candidate disappear, shifting difficulty coverage.
  - GPT-4o/manual exemplar filtering lacks a complete decision ledger.
  - Training-time search dominates fine-tuning time in the paper's timing example.
  - Evidence is task-specific mathematics; scaling beyond 8B and broader tasks remains limited.
inclusion_reason: 'A direct Track 5 construction recipe: it samples multiple target-model reasoning paths per math question,
  selects the shortest answer-verified path, and distills that search-selected trace behavior into SFT for lower-cost greedy
  inference.'
