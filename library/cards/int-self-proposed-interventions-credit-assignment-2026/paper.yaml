recipe_metadata:
  base_model: Qwen3-4B-Instruct-2507 in the official reproduction instructions.
  teacher: The same base model self-verifies failures and proposes localized corrective interventions.
  generator: On-policy reasoning rollouts sampled from the base model.
  filtering_rule: The optional guided-rollout stage retains interventions that lead to correct final outcomes.
  sampling_protocol: The project selects hard problems, samples incorrect rollouts, proposes interventions, then filters guided
    continuations.
  inference_budget: The release documents 64-rollout filtering for hard problems; evaluation budgets vary by benchmark.
  optimizer_or_scaffold: Intervention SFT followed by online reinforcement learning.
