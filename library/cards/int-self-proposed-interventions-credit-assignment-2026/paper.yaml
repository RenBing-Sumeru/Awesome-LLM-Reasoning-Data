one_line_summary: InT turns failed on-policy reasoning traces into localized corrective interventions, creating process-supervision
  records that patch the first error before downstream RL.
why_it_matters: It converts outcome-only failures into a reusable, localized intervention record rather than treating an entire
  failed trajectory as uniformly bad.
