one_line_summary: MiniMax-M1 releases 40K and 80K model weights and reports separate continual-pretraining, Long-CoT SFT,
  and mixed-feedback RL recipes, but not the training rows, reward traces, sandboxes, or training code needed for replay.
why_it_matters: It is a useful frontier-report ledger for comparing what is disclosed about source mixtures, filtering, verifiers,
  execution environments, curricula, weights, and evaluation against what remains unavailable.
