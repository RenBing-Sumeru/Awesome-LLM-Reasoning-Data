one_line_summary: START inserts diverse hints into long reasoning, filters Python-interleaved trajectories for corrective
  success, trains a 10K-seed intermediate model, and expands to a reported 40K self-training set, while releasing none of
  the records, code, environment, or checkpoints.
why_it_matters: It shows how tool feedback can become reusable supervised reasoning data without a separate teacher solver,
  but its unreleased verifier and environment, hidden rejected traces, licensing gaps, and inconsistent source totals make
  the recipe substantially less auditable than its aggregate results suggest.
