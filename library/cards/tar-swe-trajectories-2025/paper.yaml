one_line_summary: Releases and analyzes 120 RepairAgent, AutoCodeRover, and OpenHands episodes as 2,822 thought-action-result
  iterations with action and semantic-relation labels, while replay metadata and an immutable release remain incomplete.
why_it_matters: The work makes agent behavior auditable below the final patch by separating tool feedback, human semantic
  judgments, and episode success; it is evidence for evaluation and failure analysis, not evidence of a validated training
  recipe.
