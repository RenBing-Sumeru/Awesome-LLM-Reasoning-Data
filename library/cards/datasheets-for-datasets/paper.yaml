data_object:
  prompt_source: The dataset creator's documentation of motivation, composition, collection, and recommended use.
  trace_author: Dataset creators and maintainers; the paper proposes a documentation practice rather than a trace corpus.
  answer_format: A datasheet accompanying a dataset.
  process_fields:
  - motivation
  - composition
  - collection process
  - recommended uses
  - maintenance and distribution information
  environment_or_substrate: Dataset creation, release, maintenance, and downstream use.
  verifier_or_reward: No verifier or reward is introduced; the feedback surface is transparent documentation for dataset consumers.
  terminal_predicate: Documentation is complete enough for a consumer to assess intended use, limitations, and accountability;
    exact checklist completion remains release-specific.
recipe_metadata:
  base_model: Not applicable; this paper proposes a dataset-documentation framework.
  teacher: Dataset creators and maintainers.
  generator: Structured documentation authored alongside a dataset.
  filtering_rule: Not a filtering recipe; the framework asks creators to record dataset facts and recommended uses.
  sampling_protocol: Not applicable to the documentation framework.
  rollout_count: null
  temperature: null
  inference_budget: null
  optimizer_or_scaffold: Not applicable.
audit:
  source_mixture: Official arXiv record and publisher DOI/venue link.
  split: The framework asks a dataset release to document its composition and use; it does not prescribe one common split.
  decontamination: The 2021 paper predates modern LLM contamination practice; contamination evidence must be added by each
    current release.
  license: The paper is published in Communications of the ACM; no dataset license is supplied because the work is a documentation
    proposal, not a dataset release.
  lineage: 'Primary source: https://arxiv.org/abs/1803.09010'
  known_failure_modes:
  - A completed datasheet can still omit facts unknown to its creators.
  - Documentation quality depends on truthful, maintained answers by dataset owners.
  - Datasheets do not themselves demonstrate legal clearance, deduplication, or contamination testing.
  citation_status: verified
  confidence: high
  notes: The official arXiv abstract proposes that every dataset be accompanied by documentation of motivation, composition,
    collection process, recommended uses, and related information; arXiv notes CACM publication in December 2021.
inclusion_reason: The canonical documentation primer for asking the recurring Track0 audit questions that make a reasoning-data
  release more than a prompt-answer table.
