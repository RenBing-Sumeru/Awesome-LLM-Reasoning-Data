data_object:
  prompt_source: Filtered MuSiQue questions for training and GAIA-text, WebWalkerQA, and FRAMES evaluation queries.
  trace_author: A single Qwen3-14B-base instance plays planner and worker roles through role-specific prompts and tool calls.
  answer_format: Input, planner/worker trajectory output, step index, ground truth, tool-format reward, accuracy reward, and
    combined reward.
