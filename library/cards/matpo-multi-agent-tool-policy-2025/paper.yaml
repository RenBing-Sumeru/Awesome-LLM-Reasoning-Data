one_line_summary: MATPO trains planner and worker roles within one LLM by assigning joint tool-use rollout rewards across
  nested agent trajectories.
why_it_matters: It releases large-scale scored multi-agent and single-agent tool-use rollouts together with a practical credit-assignment
