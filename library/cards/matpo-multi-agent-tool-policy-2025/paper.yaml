  - tool_responses
  - score
  - accuracy_reward
  - tool_format_reward
  - combined_reward
  environment_or_substrate: Multi-turn web search and scraping tool-use environment.
  verifier_or_reward: GPT-4o-mini judge checks answer accuracy; tool-call format success contributes to the combined reward.
  terminal_predicate: Correct final answer and valid tool use under the specified reward function.
recipe_metadata:
  base_model: Qwen3-14B-base.
  teacher: GPT-4o-mini evaluates answer accuracy.
  generator: Nested planner and worker rollouts with search/scraping tools.
  filtering_rule: Training removes questions that repeatedly yield invalid rollouts; release preserves rollout scores.
  sampling_protocol: Official data lists about 1.03M multi-agent training rollout rows plus validation and single-agent comparisons.
  inference_budget: The paper trains on 128 A800 GPUs; exact rollout parameters are in the official training scripts.
  optimizer_or_scaffold: MATPO, a multi-agent extension of GRPO that broadcasts normalized planner advantage to associated
    worker rollouts.
