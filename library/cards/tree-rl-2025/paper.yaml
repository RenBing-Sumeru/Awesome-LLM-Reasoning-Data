data_object:
  prompt_source: The paper reports sampling RL prompts from public MATH-train and NuminaMath. The official repository exposes
    datasets/train/train_30k.jsonl as prompt-answer input; the launcher consumes text as the prompt, label as the reference
    answer, and data_type as a source key. A manifest connecting every released row to the two paper-named sources, their
    proportions, and rights is not disclosed.
  trace_author: The current on-policy policy generates EPTree response branches. The paper evaluates Qwen-2.5-14B, GLM4-9B,
    and DeepSeek-R1-Distill-Qwen-2.5-7B lines; the checked launcher targets qwen-14b-2.5-instruct.
  answer_format: 'A runtime episode is prompt-indexed: initial response chains; selected fork token positions; continued branches;
    terminal answers and binary correctness; parent/descendant relations; and step rewards derived from the tree. The released
    JSONL is prompt-answer input, not a verified release of raw trees, node values, rewards, selected paths, or rejected branches.'
  process_fields:
  - prompt and reference answer
  - initial and forked response continuations
  - fork position and parent-child relation
  - terminal answer and binary correctness result
  - descendant-leaf correctness value
  - global and local advantages
  - reweighted per-step reward
  environment_or_substrate: EPTree performs batched on-policy generation, token-uncertainty-driven forking, leaf checking,
    tree-value propagation, and policy-gradient updates. The code contains serializable token IDs, token strings, log probabilities,
    masks, finish reasons, and parent indices, but no public runtime-tree corpus was verified.
  verifier_or_reward: In the paper, a leaf receives rule-based reward 1 for a correct final answer and 0 otherwise. A node
    value is the proportion of correct descendant leaves; TreeRL combines global and local advantages and divides repeated
    non-leaf rewards by the square root of selected descendant traces. The public launcher calls private answer-extractor
    and binary-judge endpoints, so their deployed model revisions, prompts, normalization, and failure behavior are unknown.
  terminal_predicate: The paper defines correctness at the final answer. The checked launcher sends prompt, response, and
    label to remote services and expects a binary outcome. Exact answer extraction and equivalence semantics are not reproducible
    from the public artifact alone.
recipe_metadata:
  base_model: Paper experiments report Qwen-2.5-14B, GLM4-9B, and DeepSeek-R1-Distill-Qwen-2.5-7B. The checked launcher names
    qwen-14b-2.5-instruct. No TreeRL checkpoint release was verified.
  teacher: unknown
  generator: EPTree first samples M complete chains, selects high-uncertainty eligible token positions, forks T continuations
    from the top-N positions, and repeats expansion for L rounds.
  filtering_rule: Tokens near sequence ends are masked before forking. Repeated non-leaf steps are downweighted by the square
    root of selected descendant traces. The paper does not disclose a prompt-selection manifest or a released tree-retention
    policy.
  sampling_protocol: The main RL setting is (M,N,L,T)=(6,2,1,2), yielding 30 leaves per prompt; it is compared with 16 independent
    responses at similar generation-token budget. Each update uses 16 prompts, giving reported training batch sizes of 480
    for TreeRL and 256 for ChainRL.
  rollout_count: The paper's main EPTree setting has 30 leaves per prompt. The checked launcher sets NUM_TRACE=16 and num_trace_per_sample=16;
    the exact mapping from leaves to optimization traces needs runtime-log inspection.
  temperature: 1.2
  inference_budget: The paper reports top-p 0.95 and maximum sequence length 8192. On Omni-MATH-500, its selected (6,2,1,2)
    setting reports 30 leaves, 56.9 PassRate, and 22,268 generation tokens, versus multi-16 at 52.4 and 19,858.
  optimizer_or_scaffold: Policy-gradient RL consumes tree-derived process rewards. The paper reports learning rate 1.5e-6
    and KL coefficient 1e-4; the checked launcher uses the same learning rate but KL=0.0. Its exact relation to the reported
    runs is unknown.
audit:
  source_mixture: The paper names MATH-train and NuminaMath. The released JSONL is a 10,562,582 byte file in the official
    repository, but a row-level source manifest and upstream-license mapping were not verified.
  split: The paper says a subset of the named public training data is sampled for RL. Exact item identifiers, source proportions,
    split policy, and relationship between the experimental subset and train_30k.jsonl are unknown.
  decontamination: unknown
  license: The official repository declares Apache-2.0 for code. Licensing and reuse conditions for upstream prompt-answer
    records, train_30k.jsonl, and generated runtime trees are unknown.
  lineage: Public prompt-answer input -> current-policy EPTree -> remote terminal checking -> descendant correctness values
    -> global/local step advantages and square-root reweighting -> selected optimization traces -> updated policy. The raw
    tree, leaf-to-trace selection record, and rejected branches are not publicly verified.
  known_failure_modes:
  - Final-answer correctness does not establish that every intermediate reasoning step is valid.
  - A remote extractor or binary judge can introduce false positives, false negatives, or version drift; its implementation
    is not released.
  - The paper reports EPTree needs at least two generation rounds and is approximately twice as slow as multi-chain sampling
    without tree-specific inference optimization.
  - Changing search budget changes both sampled traces and tree-derived credit, so gains cannot be attributed to process rewards
    alone.
  - Source provenance, decontamination, benchmark overlap, and data-specific licensing are not disclosed.
  - Raw trees, rejected branches, and leaf-to-training-trace selection are absent, limiting lineage and failure audits.
  citation_status: verified
  confidence: medium
  notes: Official ACL proceedings, arXiv full text, the THUDM repository, Apache-2.0 license, repository tree, launcher, EPTree
    implementation, and remote-reward code were checked on 2026-07-23. Reported benchmark scores are method evidence, not
    validation of released data quality or verifier correctness.
inclusion_reason: 'TreeRL is an on-policy search-to-process-supervision recipe: it makes branch provenance, terminal checking,
  search budget, and credit assignment part of a reasoning-trace data contract, while exposing the absence of released runtime
  trees and self-contained verifier artifacts.'
