one_line_summary: BFS-PO builds training-time search trees around the shortest verifier-correct path and propagates terminal
  rewards into branch-local advantages to train shorter mathematical reasoning.
why_it_matters: It makes the rollout tree, selector, verifier, length signal, and branch-value construction explicit for Track
  5, while the trajectories and implementation remain unreleased.
