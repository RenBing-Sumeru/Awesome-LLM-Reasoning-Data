one_line_summary: LLM-First Search lets the runtime LLM decide when to backtrack and score candidate actions, while deterministic
  Countdown and Sudoku environments supply legal transitions and terminal outcomes.
why_it_matters: It exposes a test-time tree-search schema combining model-authored decisions, scalar values, frontier state,
  environment checks, and token budgets, but does not release the paper's observed search traces.
