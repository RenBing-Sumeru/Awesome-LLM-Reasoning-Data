  - pairwise_winner
  - human_annotation
  environment_or_substrate: Vision-language deepfake detection and rationale evaluation.
  verifier_or_reward: Human-annotated pointwise and pairwise meta-evaluation, used to assess an MLLM judge.
  terminal_predicate: A rationale is faithful, grounded, and useful for the image authenticity judgment.
