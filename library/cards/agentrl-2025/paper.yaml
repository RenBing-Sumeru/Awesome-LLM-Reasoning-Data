one_line_summary: Releases an MIT asynchronous GRPO framework and links an Apache-2.0 AgentBench-FC environment stack for
  five agent tasks, while the paper-level synthetic inputs, online trajectories, evaluator events and immutable mixture/split
  ledger remain incomplete.
why_it_matters: AgentRL makes the interface between policy rollouts and task-environment feedback inspectable at the framework
  level, but demonstrates that runnable agent infrastructure alone cannot establish training-data provenance, reward validity,
  evaluation separation, or reproducibility of a published RL run.
