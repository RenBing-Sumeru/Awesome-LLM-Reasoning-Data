  source_mixture: Official arXiv paper, Amazon Science GitHub repository, Amazon Science project page, AWS announcement, and
    Hugging Face dataset card.
  split: Full 2,110-task set, PB500, and a separately curated verified subset.
  decontamination: Audit public issue/PR leakage, Docker image version, tests that changed after the target commit, and cross-split
    repository overlap.
  license: Official code and Hugging Face dataset documentation list MIT; verify upstream repository terms before reuse.
