one_line_summary: SWE-PolyBench pairs 2,110 multi-language repository tasks with Dockerized F2P/P2P tests to measure whether
  coding-agent patches really resolve an issue.
why_it_matters: Its paired pass/fail test partitions and frozen environment make patch correctness auditable across different
  language ecosystems.
