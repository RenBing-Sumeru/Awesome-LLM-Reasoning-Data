data_object:
  prompt_source: GSM8K and MATH training questions, optionally paired with reference solutions whose intermediate computations
    are symbolically masked.
  trace_author: Mixtral-8x7B-base writes mixed natural-language and Python code-interpreter solutions under default, subject-specific,
    and masked-reference prompts.
  answer_format: A question paired with a generated solution containing prose, delimited Python code and outputs, a boxed
    final answer, expected/predicted answers, execution error, correctness, source dataset, and generation type.
  process_fields:
  - GSM8K or MATH question
  - generated text/code solution and execution output
  - expected and extracted predicted answer
  - execution error or timeout
  - correctness and prompt-generation type
  environment_or_substrate: Python interpreter with up to three code blocks, ten-second execution timeout, and a 4,096-token
    input/output budget.
  verifier_or_reward: Execute code blocks, extract the boxed final answer, and compare it with the benchmark ground-truth
    answer using the released grading scripts.
  terminal_predicate: Stop generation after an execution error or timeout; retain verified correct traces in the primary split
    and publish incorrect traces separately.
recipe_metadata:
  base_model: Mistral-7B, CodeLlama 7B/13B/34B/70B, and Llama-2-70B are fine-tuned as data consumers.
  teacher: Mixtral-8x7B-base under a permissive model license.
  generator: Five-shot prompts elicit code-interpreter traces; default, MATH subject-specific, and masked-reference prompts
    are merged and deduplicated after answer checking.
  filtering_rule: Require the extracted boxed answer to match ground truth; remove multiple boxed answers, unmatched code
    delimiters, and text after the final answer, while retaining incorrect records in separate files.
  sampling_protocol: Sample 128 default and 128 masked-reference traces per GSM8K problem; combine several 224-sample default,
    subject, and masked strategies for MATH, yielding 1.8M unique correct pairs.
  rollout_count: null
  temperature: 1.0
  inference_budget: top_p 0.95, 4,096 total tokens, 512 new tokens after each code block, at most three code blocks, and hundreds
    of candidates per source problem.
  optimizer_or_scaffold: Final models train on about 512K fair-sampled GSM8K plus 511,677 any-code-filtered MATH records using
    NeMo.
audit:
  source_mixture: 1.04M unique correct solutions for 7,469/7,473 GSM8K training problems and 787K for 6,978/7,500 MATH training
    problems.
  split: Correct and incorrect solutions each have train and validation JSONL files; the release reports 1.8M correct pairs
    and 6.6M incorrect trajectories, while train plus validation cover the full source training sets.
  decontamination: Synthesis starts from GSM8K and MATH training sets and evaluates on their test sets; no additional semantic
    decontamination against the broader evaluation suite is reported.
  license: The dataset uses the commercially permissive NVIDIA License; code is Apache-2.0, Mixtral is permissively licensed,
    and GSM8K/MATH source terms still require lineage review.
  lineage: Source question and optional masked reference lead to a prompt family, Mixtral trace, executed code outputs, extracted
    answer, correctness decision, post-processing, and correct/incorrect release split.
  known_failure_modes:
  - A trace can reach the correct final answer through flawed reasoning, copied structure, or code shortcuts that outcome
    grading cannot detect.
  - Hundreds of accepted traces per easy problem create severe problem-frequency imbalance unless fair sampling is used.
  - The corpus covers only GSM8K and MATH and can overfit their formats, subjects, and answer conventions.
  citation_status: verified
  confidence: high
  notes: Official NeurIPS proceedings/PDF, dataset card and file tree, NVIDIA License, paper counts, affiliation, current
    repository, and adoption counters checked on 2026-07-14.
inclusion_reason: OpenMathInstruct-1 publicly releases Mixtral-written, execution-bearing math rationales with explicit correctness
  labels and SFT consumers, rather than only reporting a model or inference prompt.
