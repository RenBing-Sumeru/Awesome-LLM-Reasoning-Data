status: partial
one_line_summary: OpenThoughts releases a 1.2M-row math/code/science SFT corpus and a controlled recipe showing that source
  choice, prompt filtering, repeated teacher sampling, and teacher selection matter more than the tested answer filters, while
  leaving row-level correctness and rights unresolved.
why_it_matters: It turns reasoning-data curation into an experimentally inspectable pipeline with unusually useful negative
  results, but also demonstrates that open code, data, and model weights do not by themselves establish safe reuse without
  source-level rights, provenance, rejection logs, and secret-safe configs.
card: null
needs:
- 'needs_license: reconcile the Apache-2.0 release label with every upstream source, especially all-rights-reserved and no-license
  organic-chemistry books, and publish row-level attribution and rights.'
- 'needs_security: remove and rotate the plaintext API credential embedded in the three official QwQ annotation YAMLs, replace
  it with environment-based secret injection, and publish a secret-scan result.'
- 'needs_provenance: attach upstream item IDs, source revisions, URLs, transformations, dedup groups, and decontamination
  decisions to each row.'
- 'needs_verifier: expose explicit unverified flags or row-level correctness checks, verifier versions, outputs, and failure
  codes where available.'
- 'needs_reproducibility: publish the exact final 1.2M run manifest, decoding settings, random seeds, per-source sample counts,
  accepted/failed yields, environment/container hashes, and checkpoint mapping.'
- 'needs_rejections: release removed prompts, failed/content-filtered generations, and decontamination match/removal ledgers
  where legally possible.'
