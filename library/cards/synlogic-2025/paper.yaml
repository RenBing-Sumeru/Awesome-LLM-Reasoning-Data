one_line_summary: SynLogic releases verifier-ready prompts and generator/verifier code for 35 logical tasks, with a 27-task
  Easy configuration and a 35-task Hard configuration, while online RL rollouts remain unreleased.
why_it_matters: It connects task sourcing, rule-based synthesis, model-calibrated difficulty, executable binary rewards, and
  DAPO-style RL beyond mathematics and code, while its release history illustrates why configuration identity, verifier behavior,
  and immutable revisions must be audited separately from benchmark gains.
