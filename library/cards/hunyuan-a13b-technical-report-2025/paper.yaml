data_object:
  prompt_source: Four distinct post-training mixtures are described. Reasoning SFT draws mathematics from educational sources,
    coding tasks from open-source resources, logic from copyrighted and public puzzle collections plus synthesis, and science
    questions selected by difficulty and quality. Reasoning RL uses 150,000 mathematics, coding, logic, and science problems
    in a 2:2:1:1 ratio, with 10% overlapping the SFT pool and 90% described as novel. All-scenarios SFT covers language, creative
    writing, multilinguality, complex instructions, role play, knowledge QA, multi-turn dialogue, and agents; agent records
    are synthesized by five roles using sandboxed, MCP, or synthetic tools. All-scenarios RL spans 16 subtopics. Exact item
    manifests, mixture counts outside reasoning RL, source URLs, and sampling distributions are unknown.
  trace_author: The report describes model-generated and human-reviewed/filter-assisted records, but does not identify the
    generating model/checkpoint for most SFT traces. The agent synthesis engine assigns user, planner, tool, agent, and checker
    roles. On-policy reasoning-RL trajectories are generated by the policy being optimized. Exact human/model attribution
    per released-or-internal record is unknown.
  answer_format: Reasoning and direct-answer responses are jointly supported. Reasoning mode uses a special <think> block
    and can be requested with /think; /no_think requests direct response mode. Training objects may also contain reference
    answers, unit tests, executable code, tool invocations and responses, candidate/reference comparisons, and scalar or component
    rewards. The serialized internal data schema is undisclosed.
  process_fields:
  - prompt
  - response
  - think
  - final_answer
  - reference_answer
  - unit_tests
  - tool_call
  - tool_response
  - candidate_response
  - verifier_feedback
  - format_reward
  - correctness_reward
  - domain_reward
  environment_or_substrate: Coding data uses an automated sandbox covering 36 programming languages, more than 1,000 concurrent
    instances, and file/network isolation. Agent synthesis invokes real sandbox tools, MCP servers, and synthetic tools; the
    report says more than 30 agent-system-instruction types and 20,000 combinations of tool/action/response formats were created.
    Environment images, tool snapshots, exact MCP endpoints, and episode logs are not released.
  verifier_or_reward: 'Reasoning SFT uses domain-specific quality controls: a generative reward model plus automated solution
    checking for mathematics; critics and sandbox execution for code; automated chain-of-thought evaluation plus human review
    for logic; and advanced-LLM verification with rejection sampling for science. Reasoning RL uses GRPO with outcome rewards:
    normalized final-answer/reference alignment for mathematics, logic, and science, and sandboxed unit-test execution for
    code. All-scenarios RL uses a general reward model that can compare a candidate with a reference, optionally consume chain-of-thought,
    invoke tools, and apply length/constraint checks; more than 30 scoring services cover 16 subtopics. Agent rewards combine
    output-format checks with reference-based tool-name, parameter, and value correctness. Exact verifier prompts, thresholds,
    models, service weights, and calibration sets are unknown.'
  terminal_predicate: For reasoning RL, an episode ends with a final answer or code submission that is scored by normalized
    answer matching or sandbox execution. For agent tasks, success is based on required special-marker ordering plus correctness
    of the tool call and its arguments against references. Timeouts, partial credit, retry limits, and all environment termination
    rules are not reported.
recipe_metadata:
  base_model: Hunyuan-A13B, an 80B-total/13B-active MoE model initialized through the reported Hunyuan-TurboS-family pretraining
    pipeline
  teacher: unknown
  generator: unknown for most offline SFT synthesis; the current policy generates on-policy reasoning-RL rollouts
  filtering_rule: 'Domain-specific construction and verification: generative reward plus automated solution checks for mathematics,
    critics plus sandbox execution for code, automated CoT evaluation plus human review for logic, and advanced-LLM verification
    plus rejection sampling for science. Exact thresholds and acceptance rates are unknown.'
  sampling_protocol: 'Four linked stages: reasoning SFT -> on-policy reasoning RL over a 150K problem pool -> all-scenarios
    SFT including five-role agent synthesis -> all-scenarios RL with a general reward model and domain scoring services.'
  rollout_count: unknown; the reasoning-RL prompt pool contains 150,000 problems, but the number of sampled trajectories per
    problem and retained rollouts is not disclosed
  temperature: 0.6-0.8 for reasoning RL; other generation temperatures are unknown
  inference_budget: Reasoning RL is staged from a 24K to 32K context setting. Pretraining extends context first to 32K and
    then 256K. The post-training report does not provide a per-example token budget for every stage.
  optimizer_or_scaffold: Reasoning RL uses on-policy GRPO, large batches, increased rollout sampling, and no KL penalty. Exact
    batch sizes, learning rates, rollout multiplicities, and training steps are unknown.
audit:
  source_mixture: The report names high-level source classes and several construction mechanisms but not exact datasets, item
    manifests, domain counts outside the 150K reasoning-RL pool, source licences, or record-level provenance. Logic SFT explicitly
    includes copyrighted and public puzzle collections without a source ledger.
  split: The 150K reasoning-RL pool is described as 10% overlapping reasoning SFT and 90% novel; train/validation/test manifests,
    deduplication boundaries, and immutable hashes are unknown. Other post-training split definitions are undisclosed.
  decontamination: Pretraining includes semantic deduplication and quality filtering, but the report does not publish benchmark-specific
    decontamination rules, overlap counts, or a post-training contamination ledger.
  license: Model weights and code are exposed through official repository and Hugging Face surfaces. No training-data release
    or training-data licence was verified; source-level rights, including for copyrighted logic puzzles, remain unknown.
  lineage: Named source classes -> quality/difficulty filtering and domain-specific verification -> reasoning/all-scenarios
    SFT -> 150K on-policy reasoning RL and multi-service all-scenarios RL -> dual-mode Hunyuan-A13B-Instruct. Record-level
    lineage and retained rollout artefacts are not available.
  known_failure_modes:
  - Aggregate corpus sizes do not reveal the exact post-training records or mixture weights.
  - Verifier identities, prompts, thresholds, false-positive rates, and cross-domain calibration are not disclosed.
  - Benchmark gains evaluate the trained model and do not establish data quality, source legality, or contamination control.
  - Agent synthesis depends on unreleased tool environments and references, limiting replayability.
  - No reasoning-RL rollout corpus, reward log, rejected sample set, or complete SFT dataset was verified as released.
  citation_status: provisional
  confidence: medium
  notes: Official Tencent Hunyuan report, repository, and Hugging Face model page are recorded. Claims are restricted to the
    accepted curator evidence; manifests, teacher identities, reward weights, and audit details remain unknown. Track 12 only.
inclusion_reason: A frontier technical report that discloses large-scale STEM data, four SFT/RL stages, GRPO, and sandbox/GRM
  feedback while leaving underlying data lineage and feedback implementation incompletely auditable.
