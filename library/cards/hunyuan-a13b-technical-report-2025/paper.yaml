one_line_summary: A frontier-model disclosure describing a >20T-token foundation corpus, a 250B-token STEM subset, four post-training
  stages, a 150K-problem reasoning-RL mixture, a five-role agent synthesis engine, and a multi-service reward stack, while
  leaving record-level data and rollout artefacts unreleased.
why_it_matters: 'For the frontier-reports data-disclosure track, Hunyuan-A13B provides unusually concrete stage-level counts
  and verifier/environment descriptions that can be separated into auditable claims. It is still a model report rather than
  a released dataset: exact records, provenance, splits, licences, verifier implementations, and RL trajectories remain unavailable.'
