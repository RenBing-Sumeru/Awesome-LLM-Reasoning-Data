status: partial
one_line_summary: The paper searches branch count and speculative-decoding draft length to maximize benchmark accuracy under
  wall-clock latency, but releases neither raw candidate traces nor the hardware/runtime record needed to replay its timing
  results.
why_it_matters: For rollout and test-time trace research, it shows that token count alone misses the interaction among branch
  multiplicity, output length, draft acceptance, aggregation, and system throughput. It also makes the missing raw traces
  and system metadata central audit boundaries.
