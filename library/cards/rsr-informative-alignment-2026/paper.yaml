one_line_summary: RSR scores each teacher trajectory under the target student and selects one of 33 candidates per math problem
  by balancing clipped token rank against surprisal.
why_it_matters: It operationalizes student-specific reasoning-data construction and releases both the candidate pool and five
  selected datasets, while showing why selection quality, correctness, contamination and decision-lineage records must be
  audited separately.
