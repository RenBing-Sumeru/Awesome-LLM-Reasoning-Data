data_object:
  prompt_source: Mathematical reasoning steps drawn from model-generated chain-of-thought responses.
  trace_author: Language-model reasoning outputs formalized retrospectively into Lean 4 claims.
  answer_format: Natural-language preceding and current steps, a Lean 4 statement, and formal-verification outcome.
  process_fields:
  - preceding_steps
  - current_step
  - lean_statement
  - proof_status
  environment_or_substrate: Lean 4 theorem proving for mathematical reasoning verification.
  verifier_or_reward: A formal-step verifier that seeks Lean 4 proofs for individual reasoning claims.
  terminal_predicate: Whether Lean 4 can establish the formalized current step under the retained context.
recipe_metadata:
  base_model: Use the models and prompts released in the official Safe repository.
  teacher: The framework generates Lean 4 formalizations and proofs rather than relying on scalar PRM labels.
  generator: LLM chain-of-thought steps and the formalization component.
  filtering_rule: Accept a step only when the retrospective formal verifier finds supporting evidence or a proof.
  sampling_protocol: Use the official FormalStep release and repository-defined evaluation procedure.
  inference_budget: The paper reports prover and model configurations; exact inference budgets should follow the official
