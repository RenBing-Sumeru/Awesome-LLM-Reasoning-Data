one_line_summary: QED-Nano couples 128-attempt difficulty statistics, 16-rollout rubric-reward GRPO, and three-turn Reasoning-Cache
  training, while FineProofs-RL releases prompts, rubrics, and score arrays but not the proofs behind them.
why_it_matters: The work makes rollout budgeting, curriculum selection, judgment-based proof rewards, and train/test-time
  scaffold coupling explicit for a small open model. It also demonstrates that score populations can support prompt selection
  and RL without constituting a reusable trace corpus.
