one_line_summary: AgenTracer turns successful and failed multi-agent episodes into decisive-agent/step labels through DeepSeek-R1-guided
  mutation or correction plus environment replay, but only a 127-row coding test subset of the reported 2,476 pairs is public
  and its license/replay contract is incomplete.
why_it_matters: It separates an environment's terminal pass/fail signal from the causal attribution target used for training
  a failure tracer, showing both how replay can create grounded process labels and why released trajectories need paired interventions,
  pinned environments, split lineage, and explicit rights before training reuse.
