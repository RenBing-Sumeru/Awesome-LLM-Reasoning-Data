one_line_summary: Reuses reasoning prefixes in an MCTS-inspired tree and backs up terminal LLM judgments to construct math
  SFT paths and step/branch preference pairs under a token budget.
why_it_matters: Connects search allocation, terminal verification, tree-derived process labels, SFT, and DPO while making
  the label assumptions and missing experimental data auditable.
