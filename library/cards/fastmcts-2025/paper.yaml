data_object:
  prompt_source: 46,000 English math problems from NuminaMath, MetaMath, and InternLM-Math train; 50,000 internet-collected
    Chinese high-school problems; smaller AIME and Chinese sets for efficiency tests
  trace_author: Qwen2.5-72B-Instruct with randomly combined domain-diverse few-shot demonstrations
  answer_format: Complete mathematical solutions segmented by generated Step 1, Step 2, and subsequent markers, with each
    segment stored as a tree node
  process_fields:
  - query
  - ground_truth
  - reasoning_step
  - parent_child_edges
  - visit_count
  - win_count
  - node_score
  - verifier_outcome
  - complete_trajectory
  - chosen_branch
  - rejected_branch
  - preference_granularity
  environment_or_substrate: Asynchronous MCTS-style tree of partial solutions that retains each simulated continuation as
    nodes
  verifier_or_reward: Qwen2.5-72B-Instruct terminal answer judge; binary outcomes backed up as win_count divided by visit_count
  terminal_predicate: All repeated judge samples agree that the final answer matches the standard answer and is not guessed
    or vague
recipe_metadata:
  base_model: Qwen2.5-7B for main SFT and Branch-DPO; Llama-3.2-3B-base and Qwen2.5-3B-base for additional transfer checks
  teacher: Qwen2.5-72B-Instruct for trajectory generation and terminal judgment; Qwen2.5-32B-Instruct for five-sample difficulty
    screening
  generator: Qwen2.5-72B-Instruct served with SGLang in the reported experiments
  filtering_rule: Remove 100%-pass questions, proof/find-all/image/URL/malformed/incomplete/ambiguous cases, hash duplicates,
    and stated evaluation overlaps; retain verifier-accepted paths and tree-derived pairs
  sampling_protocol: Random few-shot combinations, temperature 1, adaptive-stay UCT, dynamic exploration, retained simulations,
    and asynchronous expansion; main setting uses root degree 3, expansion degree 2, and 16 iterations
  rollout_count: null
  temperature: 1
  inference_budget: Main synthesis uses 16 tree iterations; comparisons account for average generated tokens and use 30 English
    or 24 Chinese RS samples
  optimizer_or_scaffold: Qwen2.5-7B SFT for three epochs at 4096 tokens, batch 32 and LR 1e-5; Branch-DPO for three epochs,
    batch 16, LR 1e-6, beta 0.4 and cosine scheduling
audit:
  source_mixture: English prompts mix NuminaMath, MetaMath, and InternLM-Math; Chinese prompts are internet-collected high-school
    math with undisclosed item-level provenance and rights
  split: Hash deduplication and stated test exclusion, but no released EN/CN Hard manifests, hashes, seeds, or train/validation/test
    splits
  decontamination: Hash duplicate removal and stated benchmark exclusion only; semantic near-duplicate and pretraining-corpus
    audits are not reported
  license: ACL paper is CC BY 4.0; official code and synthesized-data licenses are unknown
  lineage: Prompt to difficulty screen and heuristic filters to Qwen-72B tree generation and terminal judging to Monte Carlo
    backup to SFT paths and step/branch preference pairs
  known_failure_modes:
  - Verifier prompt emphasizes final-answer agreement rather than independent intermediate-step checking
  - Correct terminal outcomes are assumed to validate every intermediate step for preference construction
  - Zero node score can reflect sparse exploration rather than a semantically wrong step
  - Generator and verifier use the same Qwen2.5-72B model family and may share errors
  - Consensus verification repeats without a disclosed or implemented hard cap
  - Tree prefix reuse may reduce trajectory diversity
  - Headline 3.9-point average gain includes Branch-DPO; SFT-only gain is 2.9 points in that comparison
  - Experimental trees, synthesized corpora, preference pairs, checkpoints, and split manifests are not released
  - Repository example settings differ from the paper's main configuration and dependencies are unpinned
  - Official repository declares no software or data license
  citation_status: verified
  confidence: high
  notes: Official code was audited at tree SHA fe2c54de05be0503f78ac0cd01da01d3f7321f9e; it implements the recipe but is not
    a pinned reproduction package for the reported experiments.
inclusion_reason: Concrete tree-based recipe that converts terminally judged math rollouts into correct-path SFT records and
  backed-value step/branch preference pairs under explicit token accounting.
