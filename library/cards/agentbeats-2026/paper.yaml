data_object:
  prompt_source: Judge-agent-owned fixed or adaptive benchmark tasks and data. In the coding case, tasks come from the 731-instance
    SWE-Bench Pro public split, all 89 Terminal-Bench 2.0 tasks, and 1,222 DevEval instances retained after ground-truth-test
    validation.
  trace_author: Subject agents produce A2A/MCP assessment episodes under judge-controlled tasks and environments; no centralized
    released trajectory corpus is established.
  answer_format: A delegator request with participant role-endpoint mapping and configuration; judge-issued A2A tasks; optional
    MCP tool calls and environment observations; subject responses/artifacts; final environment state; judge metrics; and
    a JSON result report whose inner schema is assessment-specific.
  process_fields:
  - assessment_request
  - participant_roles
  - configuration
  - task_id
  - task_instruction
  - environment_access
  - a2a_message_or_update
  - mcp_tool_call
  - tool_or_environment_observation
  - subject_response
  - output_artifact
  - final_environment_state
  - metric
  - score
  - result_report
  observation: Judge/benchmark-specific A2A messages, MCP tool responses, logs, artifacts and environment state. The coding
    case uses isolated source-tree containers and terminal/filesystem interactions.
  action_space: Assessment-specific A2A responses and MCP calls. In the coding case, subject agents edit/read files and issue
    terminal or harness-native tool actions; no universal action vocabulary is imposed.
  environment_or_substrate: Judge-controlled benchmark data, tools and environments orchestrated in local, remote, hosted,
    proxy or CI mode; the coding case uses isolated containers and either runtime injection or remote shell over MCP.
  verifier_or_reward: Judge-agent-owned predefined metrics implemented programmatically, semantically through prompts/LLM
    judgment, or as a mixture. The coding case runs each benchmark's evaluation scripts over collected artifacts/environment
    state to produce final solve scores.
  terminal_predicate: Assessment-specific completion notification or timeout followed by judge-defined scoring. Coding tasks
    terminate when the subject signals completion or times out, after which the judge collects artifacts and runs benchmark
    tests.
  provenance: Delegator configuration -> judge/task/data/environment preparation -> subject A2A/MCP episode -> response/artifact/final
    state -> judge metrics and result report -> platform, CI or local output. Immutable record-level manifests are not released
    with the paper.
recipe_metadata:
  base_model: 'Coding case: Claude Opus 4.7, GPT-5.4, Gemini 3.1 Pro, and Qwen3.5-397B-A17B. Field-study agents use heterogeneous
    and incompletely enumerated models.'
  teacher: unknown
  generator: Community-authored judge and subject agents generate assessment interactions. The coding case pairs each named
    model with Claude Code, Codex CLI, OpenCode, or mini-SWE-agent.
  prompt_task_source: Judge-specific datasets/configuration. Main case study uses SWE-Bench Pro public, Terminal-Bench 2.0,
    and DevEval; exact meta-instruction text and complete configuration files are not released with the paper.
  filtering_rule: Field study excludes inaccessible or malformed repositories and deduplicates the rest. DevEval ground-truth
    solutions are executed in the authors' environment and failing instances are dropped, yielding 1,222 retained tasks.
  sampling_protocol: 'Field study snapshot: 298 judge agents in 12 categories and 467 subject agents. Main coding evaluation:
    731 SWE-Bench Pro public tasks, all 89 Terminal-Bench 2.0 tasks, and 1,222 filtered DevEval tasks. Harness-swap experiments
    use 20% subsamples of DevEval and SWE-Bench Pro and all Terminal-Bench tasks.'
  rollout_count: unknown
  temperature: unknown
  inference_budget: Agents use default prompts/inference settings; reported thinking efforts are xHigh for Opus 4.7, Medium
    for GPT-5.4, High for Gemini 3.1 Pro, and thinking enabled without another effort setting for Qwen3.5. Total main experiment
    cost is about $6,000; exact time limits, seeds and per-instance retry budgets are unknown.
  selection_threshold: DevEval instances must pass ground-truth tests before inclusion. Episode success thresholds are benchmark-specific
    test or metric predicates.
  optimizer_or_scaffold: No policy/reward-model training is performed. AgentBeats supplies A2A/MCP orchestration, judge-controlled
    environments and deployment modes; the coding case evaluates fixed model-harness pairings.
audit:
  source_mixture: Heterogeneous community-authored judge tasks, benchmark datasets, A2A/MCP interactions, environment states,
    CI outputs, platform metadata, and coding-agent runs on DevEval, SWE-Bench Pro and Terminal-Bench 2.0.
  split: There is no universal AgentBeats train/test split. The coding case uses SWE-Bench Pro's 731-instance public split,
    all 89 Terminal-Bench 2.0 instances, and 1,222 DevEval instances after ground-truth filtering; the harness-swap study
    subsamples 20% of DevEval and SWE-Bench Pro.
  decontamination: unknown
  benchmark_overlap: No platform-wide subject-model contamination or public-task exposure audit is disclosed. The paper explicitly
    does not reproduce Anthropic's SWE-Bench Pro memorization screen and cannot use Qwen's corrected unreleased benchmark
    form.
  license: The arXiv manuscript is CC BY-NC-ND 4.0. No detected repository license was found for the checked earlier SDK,
    docs, tau agentification example, current tutorial, or leaderboard template; benchmark-specific repositories may differ.
    No umbrella license covers tasks, trajectories, logs or results.
  lineage: Delegator request/config -> judge data/environment/tool setup -> subject-agent episode -> judge scoring -> local/platform/CI
    result. The paper does not publish a record-level lineage manifest tying field-study or coding-case records to immutable
    artifact versions.
  release_version: Paper evidence is arXiv:2606.13608v2 (2026-06-14). The linked earlier official SDK's latest release is
    v1.2.6 (2025-11-17) and its README marks it deprecated. Current tutorial/templates/dashboard are rolling artifacts updated
    independently of the paper; no commit/image/result manifest binds them to v2.
  successful_and_failed_sample_retention: Appendix A reports aggregate resource/tool statistics for both succeeded and failed
    coding runs, but no record-level success/failure trajectory archive or exclusion ledger is released.
  privacy_or_consent: Competition and remote/hosted modes can involve private services, credentials and execution logs. The
    checked paper and official artifacts do not provide a complete consent, retention, deletion or redistribution policy for
    submitted code and traces.
  known_failure_modes:
  - 'Judge semantics are heterogeneous: programmatic tests, environment predicates, prompts and LLM judges are not interchangeable,
    so scores across judges do not share one reward meaning.'
  - Semantic judge or user-simulation logic can be prompt-injected; the paper recommends isolating scoring in a sub-agent
    but does not audit all 298 judges for attacks or false positives.
  - Remote agents may lack observable logs and standardized reset behavior; authentication and control-plane support are necessary
    but not a proof of reproducibility.
  - Coding-agent runtime injection can fail or perturb the evaluation container, motivating a preflight and remote-shell fallback.
  - Several evaluated models and production harnesses are proprietary, and provider/API/model behavior may drift after the
    paper.
  - 'Public-score fidelity depends on configuration and benchmark version: memorization screens, corrected splits and reasoning-effort
    choices differ from vendor reports.'
  - 'Harness-level tool logs are not fully comparable: each harness exposes different tools, MSA omits token counts, and shell
    calls can hide read/edit/search actions.'
  - No paper-linked task/trajectory data card, immutable container/image manifest, result bundle or record-level replay archive
    was verified.
  - The earlier official SDK is deprecated and predates arXiv v2, while the current tutorial, gateway/template stack and live
    dashboard continue to change.
  - Core/reference repository licenses and an umbrella task/trace/result license are missing, blocking confident redistribution
    or training-data reuse.
  citation_status: verified
  confidence: medium
  notes: The arXiv v2 paper and appendices, official docs/dashboard/competition page, GitHub organizations, deprecated SDK
    and release metadata, current tutorial/local runner, leaderboard template, and tau agentification example were checked.
    Paper identity and protocol/experiment claims are verified; release completeness, licensing and exact replay remain partial.
  remaining_unknowns:
  - Exact commits, Docker digests, benchmark snapshots, model/API versions, prompts, secrets/configuration and time limits
    behind Tables 6-10.
  - Per-instance rollout counts, temperatures, random seeds, retries and failure handling.
  - Record-level trajectories, logs, artifacts, scores and failed-run reasons.
  - Frozen 298-judge/467-subject manifest, repository exclusion ledger, deduplication keys and prompt-scanner snapshot.
  - Universal result schema, platform-wide provenance, contamination checks and retention/deletion policy.
  - Common code/task/trace/result license and rights for cross-repository aggregation.
  - Author-confirmed mapping from the deprecated SDK to the June 2026 experiment stack.
inclusion_reason: 'AgentBeats makes the evaluation environment and feedback contract first-class agents: a judge packages
  tasks, tools, environment setup and scoring behind A2A/MCP, producing complete subject-agent episodes whose results can
  be compared and audited even though the paper does not release a reusable trajectory corpus.'
