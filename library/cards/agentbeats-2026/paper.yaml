one_line_summary: AgentBeats turns a benchmark into an A2A/MCP judge agent that owns tasks, environments and scoring, and
  validates the interface through a 298-judge/467-subject field study plus standardized coding-agent episodes.
why_it_matters: It exposes the missing contract around agent trajectories—who provides the environment, what the judge can
  observe, how terminal outcomes become metrics, and which deployment artifacts must be pinned—while also showing why protocol
  standardization alone does not make traces licensed or exactly replayable.
