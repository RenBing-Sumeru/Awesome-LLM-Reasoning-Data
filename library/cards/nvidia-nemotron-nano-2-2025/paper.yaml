one_line_summary: Nemotron Nano 2 aligns a 12B hybrid model with about 80B SFT tokens, rule- and reward-model feedback, on-policy
  DPO, GRPO and RLHF, then prunes/distills it to 9B while releasing the models and most training data.
why_it_matters: It connects concrete data records, verifiers, optimization stages and compression recovery, and exposes enough
  released artifacts to audit much of the reasoning-data pipeline.
