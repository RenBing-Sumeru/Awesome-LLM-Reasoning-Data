data_object:
  prompt_source: Tool-using agent tasks from four planning and safety task families.
  trace_author: Multiple agent models, rule-based perturbations, and minimal-edit LLM perturbations.
  answer_format: Task context, preferred trajectory, distractor trajectory, task family, and pairwise label.
  process_fields:
  - task
  - preferred_trajectory
  - distractor_trajectory
  - family
  - label
  environment_or_substrate: Tool-integrated agent planning scenarios.
  verifier_or_reward: Validated positive trajectories and hard negatives define the pairwise preference.
  terminal_predicate: A judge selects the trajectory that handles the task safely and correctly.
recipe_metadata:
  base_model: Generative, discriminative, and LLM-as-judge reward models.
  teacher: Validated positive trajectories provide the preferred side of each comparison.
  generator: Natural rollouts, rule perturbations, and minimal LLM edits create negatives.
  filtering_rule: Validation checks preserve task-family semantics while making negatives confusable.
  sampling_protocol: Use official seven splits and report trajectory length and task family.
  inference_budget: Longer trajectories raise judge context and evaluation cost.
  optimizer_or_scaffold: Unified pairwise reward-model evaluation protocol.
audit:
  source_mixture: Positive agent trajectories and adversarial or minimally edited distractor trajectories.
  split: 1,171 pairwise comparisons across seven splits and four task families.
  decontamination: Public tool trajectories should not be reused in a model’s held-out judge evaluation.
