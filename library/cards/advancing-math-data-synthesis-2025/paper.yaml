one_line_summary: Compares four math problem-synthesis operators and controlled CPT/SFT allocations, but releases MathGPT-8B
  rather than the source or synthetic corpora.
why_it_matters: Treats transformation semantics and training stage as separate reasoning-data choices and identifies provenance,
  judge, rejection, budget, and license records still required for audit or reuse.
