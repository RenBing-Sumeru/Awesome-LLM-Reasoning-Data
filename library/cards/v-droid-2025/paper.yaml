one_line_summary: V-Droid trains a Llama-3.1-8B action verifier on 110K human-agent-annotated P3 preference pairs derived
  from Android trajectories, using entropy to target corrections and a small reverse-action subset for self-correction; the
  full corpus, replay state, licenses, and exact experiment-to-artifact mapping remain unavailable.
why_it_matters: It makes the feedback interface for mobile reasoning explicit - task state plus history and a candidate action
  maps to a learned scalar score - while showing how alternative-action labeling, uncertainty triage, environment replay,
  external memory models, and release/version drift determine whether an agent trajectory recipe can actually be reused.
