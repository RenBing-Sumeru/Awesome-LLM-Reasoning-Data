data_object:
  prompt_source: Mobile task instructions are drawn from the paper's cited AndroidControl/On-the-Effects-of-Data-Scale source
    and Android in the Wild, then augmented with LLM-synthesized instructions based on App Store descriptions and manually
    verified. Exact item IDs, source versions, mixture weights, synthesis model, prompts, and acceptance rubric are unknown.
  task_object: A mobile task consists of a user goal, the current Android UI state, a working memory of prior actions and
    state changes, and an extracted candidate-action set containing UI-dependent actions plus default actions such as open
    app, wait, home, back, complete, and answer.
  trace_author: Round 1 trajectories are labeled by humans selecting the correct action at each step. In later rounds, the
    current V-Droid verifier executes out-of-domain tasks and marks stepwise correctness; humans inspect uncertain/error regions,
    correct actions, and allow execution to resume until successful completion.
  trajectory_object: The internal object is a successful multi-step Android execution trace with a task goal, per-step UI
    state, working memory, extracted candidate-action set, one labeled correct action, rejected alternatives, score distribution/entropy,
    executed action, next UI state, and occasional human correction. The full serialized schema and corpus are unreleased.
  released_pair_object: The official repository exposes five example JSON records. Each record has only `chosen` and `rejected`,
    both complete verifier prompt strings containing the user goal, action history, current UI description, and a candidate-action
    query. It does not serialize episode/task/app IDs, next observations, score vectors, annotator source, terminal evidence,
    or provenance.
  answer_format: P3 training consumes a chosen prompt for the labeled correct action and a rejected prompt for one alternative
    action. At inference the generative verifier projects first-token logits/probabilities through an MLP to a scalar action
    score; the highest-scoring candidate is selected, while open-app, type-text, and answer actions require separate LLM completion.
  process_fields:
  - user_goal
  - task_instruction_source
  - action_history_or_working_memory
  - current_ui_xml_or_html_description
  - candidate_action_set
  - labeled_correct_action
  - rejected_action
  - chosen_verification_prompt
  - rejected_verification_prompt
  - verifier_action_score
  - score_distribution_entropy
  - human_or_agent_annotation_source
  - executed_action
  - next_ui_state
  - self_correction_reverse_action
  - task_completion_signal
  observation: Executing the selected/completed action produces the next Android UI state. A step summary derived from the
    executed action and UI change updates working memory; the paper's current implementation uses GPT-4 for this memory update.
    Exact observation serialization and the GPT-4 snapshot/settings are unknown.
  reward_object: The learned feedback is a scalar helpfulness score for each candidate action. Training uses a logistic pairwise
    loss that increases the labeled correct-action score relative to each rejected alternative at the same step. This is a
    learned process score, not a direct environment-success reward or an RLVR policy reward.
  environment_or_substrate: Android applications executed on an emulator cluster with UI state obtained through Android Accessibility
    Service and actions executed through Android interactions/commands. Evaluation uses AndroidWorld, AndroidLab, and MobileAgentBench;
    the public preview documents only an AndroidWorld setup with Pixel 6, Android Tiramisu/API 33, and gRPC port 8554.
  verifier_or_reward: 'Mixed contract: humans/previous-round V-Droid label which action is correct at each trace step; P3
    converts this into pairwise preferences and a scalar learned verifier score; downstream agent quality is measured separately
    by each benchmark''s end-to-end task-success contract. The verifier cannot observe future terminal success when it scores
    an action.'
  terminal_predicate: V-Droid iterates until it selects the explicit `complete task` action, while benchmark evaluation assigns
    task success under AndroidWorld, AndroidLab, or MobileAgentBench. For the collected 90-plus-app training corpus, the exact
    external success checker, timeout, abandonment, retry, and human-adjudication rules are unknown.
  provenance: Public/source and LLM-synthesized task instructions -> manual instruction verification -> emulator execution
    -> per-step correct-action labeling by humans or current V-Droid with human correction -> all correct-versus-alternative
    P3 pairs plus a 2.5% self-correction subset -> Q-LoRA verifier training -> verifier-driven agent evaluation.
recipe_metadata:
  base_model: Llama-3.1-8B-Instruct-4-bit with an attached MLP action-score head. The released adapter config pins `unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit`
    as the base model.
  teacher: Human annotators provide the 9K cold-start labels and correct later trajectories; the verifier checkpoint from
    the preceding round acts as the agent annotator. GPT-4 constructs working memory in the evaluated implementation. The
    LLM used to synthesize task instructions and the LLM used for action completion are not disclosed.
  generator: Task instructions come from two cited public sources or are synthesized from App Store descriptions; the tasks
    are executed on an emulator cluster to generate stepwise trajectories. Human-agent joint annotation supplies one correct
    action per step and P3 expands a step with N candidates into N-1 preference pairs.
  prompt_task_source: The paper cites *On the Effects of Data Scale on Computer Control Agents* and *Android in the Wild*
    for public task instructions, plus manually verified LLM-generated instructions derived from App Store descriptions. Exact
    source counts, revisions, and prompt templates are unknown.
  sampling_protocol: Four cumulative annotation/training rounds expand from 9K to 27K to 55K to 110K pairs. Later-round tasks/apps
    are described as out of domain to the current verifier. Score entropy triages likely errors for human correction. Erroneous
    states are randomly subsampled so self-correction pairs form about 2.5% of the final training set.
  rollout_count: Reported cumulative pair counts are 9K, 27K, 55K, and 110K. Total tasks, episodes, raw states, candidate
    actions, agent attempts, retries, discarded rollouts, and per-round newly added counts are unknown.
  temperature: unknown
  inference_budget: The verifier scores one first-token output per candidate in batches with prefix caching and evaluates
    50.3 actions per step on average. Paper latency uses two RTX 4090 GPUs unless stated otherwise. Token limits, completion
    decoding, timeout/retry budgets, and exact serving concurrency are unknown; the public training preview sets max length
    2800.
  search_or_scaffold: Rule-based accessibility-tree action extraction, default-action supplementation, per-candidate prompt
    construction, batched prefilling-only scoring, vLLM automatic prefix caching, LLM completion for open/type/answer actions,
    Android execution, and working-memory update.
  filtering_rule: Task instructions synthesized from App Store descriptions are manually verified. A score-entropy heuristic
    filters steps likely to be wrong for human review. AndroidLab and MobileAgentBench applications are excluded from training.
    Excess erroneous states are randomly downsampled because too many reverse-action pairs collapse the policy toward repeated
    back actions. Exact instruction acceptance and entropy thresholds used in collection are unknown.
  selection_threshold: Table 1 evaluates entropy using the median entropy as threshold; the paper otherwise calls the operational
    threshold conservative but does not publish its exact per-round values.
  preference_objective: For each state, minimize the negative log-sigmoid of the correct-action score minus an incorrect-action
    score over all correct-versus-alternative pairs.
  optimizer_or_scaffold: Q-LoRA rank 16 with learning rate 1e-4, 10 warm-up steps, gradual reduction to 1e-6, and 20 epochs
    in round 4. The final 110K-pair run took about 90 hours on 16 Nvidia A100 40GB GPUs. The released adapter config records
    LoRA alpha 32 and dropout 0.05, but the paper does not establish that every current artifact default matches the reported
    run.
  cold_start: Humans manually selected correct actions from extracted lists for the initial 9K pairs; the paper reports roughly
    four minutes per task and five hours total for this round.
  release_preview: Current `train.sh` is a one-GPU demo and the repository provides only five example pairs. Its batch size
    and random 99/1 split behavior must not be attributed to the 16-GPU paper run without additional evidence.
  undisclosed_training_fields:
  - task_synthesis_model_and_decoding
  - action_completion_model_and_decoding
  - exact_GPT4_snapshot_and_memory_prompt
  - full_batch_and_gradient_accumulation_configuration
