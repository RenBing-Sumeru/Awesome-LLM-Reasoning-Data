inclusion_reason: V-Droid provides a concrete mobile-agent reasoning-data recipe in which full Android task traces are converted
  into step-level correct-versus-alternative preferences, a learned scalar verifier selects actions, and entropy-guided human-agent
  annotation scales the data over four rounds. Its incomplete release and version drift are themselves important audit lessons
  for trajectory and feedback datasets.
