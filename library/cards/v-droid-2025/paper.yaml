audit:
  source_mixture: Public task instructions from two cited sources plus manually checked LLM-synthesized App Store tasks, executed
    across more than 90 applications in seven categories. Exact task/app IDs, source counts, source revisions, mixture weights,
    app licenses, language distribution, and per-round membership are unknown.
  split: The paper reports four cumulative training-pair scales. AndroidWorld is an in-domain test benchmark; AndroidLab and
    MobileAgentBench are OOD and their applications are excluded from collection. No immutable train/validation/test manifest,
    task IDs, app/version split, or round-level split is released. The preview code's random 99/1 split is not confirmed as
    the paper split.
  decontamination: unknown
  benchmark_overlap: Application exclusion is stated only for AndroidLab and MobileAgentBench. No item-level or semantic overlap
    audit is disclosed for task instructions, generated paraphrases, supporting models, or AndroidWorld, which is explicitly
    designated in domain.
  lineage: Source/synthetic instruction -> manual verification -> Android emulator trace -> human or current-verifier action
    label plus human correction -> P3 chosen/rejected pairs and sampled reverse-action pairs -> round-specific Q-LoRA verifier
    -> action scoring in the deployed agent -> benchmark task-success and latency evaluation.
  license: The camera-ready paper states CC BY 4.0; the project website states CC BY-SA 4.0 for the site; the HF model card
    declares Apache-2.0. The official GitHub repository has no LICENSE/SPDX metadata, so code and the five example data records
    are license-unknown. None of these licenses establishes rights for source tasks, Android apps, UI content, annotations,
    or the unreleased 110K corpus.
  release_version: arXiv v5 dated 2026-02-21 was reviewed. GitHub `main` was inspected at `8d549027634abe65a5721fe6bc3b5e84475db2f6`
    (2026-02-02); it has no tag or GitHub release, calls itself a public preview, and exposes 211 tree paths but only five
    P3 example records. HF model revision `4b2ed82d9f10486dd02376b1ccbad92842e3dc7a` (2025-10-14) contains LoRA adapter weights,
    adapter config, tokenizer files, and `v_head.pth`, not a standalone full base checkpoint.
  version_drift: ArXiv v1 and the still-current project/README headline report the old title, a 9.5-point AndroidWorld margin,
    and 0.7 seconds per step. ArXiv v5/camera-ready changes the title and publication year and reports a 5.2-point margin,
    4.3 seconds total per step, and about 0.7 seconds per decision. V1 and the released examples/model card describe HTML
    UI input, while v5 describes XML. Results and replay claims must therefore pin paper and artifact revisions.
  experimental_evidence:
    task_success_rates: ArXiv v5 reports 59.5% on AndroidWorld, 38.3% on AndroidLab, and 49.0% on MobileAgentBench, with absolute
      margins of 5.2, 2.1, and 9.0 percentage points over the cited prior best values.
    latency: V5 reports 4.3 seconds total per step and about 0.7 seconds per decision; Table 2 lists 0.74-second decision
      latency. The breakdown attributes 3.03 seconds to GPT-4 working-memory construction.
    scale: AndroidWorld success rises 15.0 -> 37.5 -> 47.4 -> 59.5 across 9K -> 27K -> 55K -> 110K pairs, while MobileAgentBench
      rises 17.0 -> 49.0. Pair volume, data diversity, annotator mixture, and verifier checkpoint all change, so this is not
      an isolated data-volume causal estimate.
    self_correction: The paper reports AndroidWorld success 52.2% -> 59.5% with self-correction data and average trajectory
      length 10.3 -> 11.6 steps.
    entropy_triage: Table 1 gives median-threshold accuracies 0.51, 0.76, and 0.71 at 27K, 55K, and 110K; Fig. 13 gives AUC
      0.55, 0.83, and 0.78. Final-round quality is not monotonic.
  verifier_or_judge_failure_modes:
  - P3 marks the one labeled action positive and every other candidate negative. States with multiple valid/helpful paths
    can therefore create false-negative preference pairs; no alternative-valid-action audit is reported.
  - Entropy is an imperfect triage signal with both false positives and false negatives and non-monotonic final-round accuracy/AUC,
    so human review around flagged steps may miss confidently wrong actions.
  - Random reverse-action construction is heuristic. The paper directly observes that excessive self-correction data collapses
    behavior toward repeated navigate-back actions and limits these pairs to about 2.5%.
  - A high learned helpfulness score is not an environment proof. Hallucinated decisions remain a major failure category,
    and the rule-based action space can omit actions when accessibility information is inaccurate.
  - Text-only accessibility input cannot interpret image/video content; v1/artifacts say HTML while v5 says XML, leaving preprocessing
    and checkpoint compatibility ambiguous.
  - GPT-4 working-memory construction materially affects success and dominates step latency, but the exact snapshot, prompt,
    decoding, API, retries, and caching are unpinned. The separate action-completion LLM is also undisclosed.
  - The scaling curves conflate pair count with new tasks/apps, changing annotator mixture, and iterative model updates.
  - Public evaluation support is AndroidWorld-oriented; complete AndroidLab/MobileAgentBench adapters, app states, and table-reproduction
    scripts were not verified in the official preview.
  - The model release includes `v_head.pth`, a PyTorch serialized artifact. Reusers should inspect the loading path and use
    isolated infrastructure rather than treating the file as equivalent to safetensors.
  successful_and_failed_sample_retention: The core dataset is built from corrected trajectories carried to successful completion.
    Erroneous states are sampled only for an approximately 2.5% self-correction component. Exact failed-task/timeout counts,
    abandoned traces, unflagged verifier errors, rejected synthetic instructions, correction histories, and drop logs are
    unknown and unreleased.
  privacy_or_consent: Unknown. The paper says execution-time security/privacy checks follow prior work, while P3 safety-guideline
    training is future work. It does not disclose annotator consent, app-content rights, handling of phone numbers/messages/files
    or other sensitive UI text, redaction, retention, or a privacy review for training records.
