one_line_summary: rStar-Math turns answer-keyed math problems into code-executed MCTS trajectories and Q-ranked step preferences
  across four self-evolution rounds, releasing flattened SFT and PPM tables but not the underlying source/tree lineage.
why_it_matters: It is an operational example of jointly evolving a reasoning-data generator and process verifier without superior-model
  solution distillation, and it shows exactly which provenance is lost when rich search trees are flattened into training-ready
  SFT and preference rows.
