  while reporting staged, rule-verified on-policy GRPO; the consumed SFT subset, complete code-RL tasks/tests, and example-to-checkpoint
  lineage remain unavailable.
why_it_matters: For the frontier-report disclosure ledger, it lets readers compare a concrete public SFT object and several
  RL/verifier ablations with the missing artifacts that still block full reproduction and verifier audit.
