data_object:
  prompt_source: The paper reports 247K math prompts from AceMath, NuminaMath, and OpenMathReasoning plus 136K code prompts
    from TACO, APPS, OpenCoder-Stage2, and OpenCodeReasoning after filtering. The official AceReason-1.1-SFT release instead
    enumerates OpenMathReasoning, NuminaMath-CoT, OpenCodeReasoning, MagicoderEvolInstruct, opc-sft-stage2, leetcode, TACO,
    and apps. Its source counts sum to 514,807 questions and 3,970,332 samples, so it is not an immutable copy of the paper's
    383K-prompt, 2.2M-sample v7 blend. RL reuses math and code data from AceReason-Nemotron-1.0; AceReason-Math is a related
    official release, but no stage-to-record mapping or complete code-RL release is established.
  trace_author: Every output in the official AceReason-1.1-SFT release is stated to be generated by DeepSeek-R1; the paper
    later describes the teacher-forced SFT responses as DeepSeek-R1-671B outputs. RL rollouts are sampled on policy from the
    current checkpoint. Per-record upstream authorship and the accepted/rejected RL rollout groups are not released.
  answer_format: 'The released SFT train split has four string columns: category, source, input, and output. The output stores
    the teacher response, including the reasoning text and final response, but has no separate verifier result, reward, or
    acceptance field. The paper''s evaluation format asks for boxed math answers and fenced Python code; unreleased RL records
    are described as question, ground-truth answer, a group of 8 or 16 responses, and rule-derived group rewards.'
  process_fields:
  - 'released SFT columns: category, source, input, output'
  environment_or_substrate: Offline mathematics and code tasks. Math outputs are checked against ground-truth answers; code
    outputs are compiled and run against predefined tests. The answer normalizer, compiler/interpreter versions, test suites,
    sandbox, timeouts, and replay image are not released in the checked artifacts.
  verifier_or_reward: RL uses rule-based verification against ground-truth answers. Group scores are standardized into token-level
    GRPO advantages; the paper uses a token-level policy-gradient objective and removes the KL term. Exact math extraction/equivalence
    rules, code tests, reward code, calibration, and measured verifier error rates are unknown.
  terminal_predicate: 'Math: the parsed final answer matches the ground-truth answer under an undisclosed rule. Code: the
    generated program compiles and passes the predefined test cases. Truncated responses may be masked or negatively rewarded
    depending on the overlong-filtering setting; exact predicates are unavailable.'
recipe_metadata:
  base_model: Qwen2.5-Math-7B; rope_theta is changed from 10,000 to 1,000,000 to support a reported 128K context.
  teacher: DeepSeek-R1 generates the SFT responses; Section 4.5.4 identifies the teacher-forced responses as DeepSeek-R1-671B
    outputs. No separate teacher is reported for on-policy RL.
  generator: DeepSeek-R1 generates SFT outputs for collected prompts. During RL, the current policy samples 8 or 16 rollouts
    per question under strict on-policy training.
  filtering_rule: SFT prompts are deduplicated; samples with 9-gram overlap to math or code benchmark test samples are removed;
    simple prompts, proxied by short teacher-response length, are randomly downsampled. Later RL stages shift toward harder
    prompts. Code Stage-II removes problems for which every rollout from the previous epoch checkpoint passes every test;
    final math Stage-4 similarly removes questions solved by every rollout.
  sampling_protocol: The paper reports G=8 or 16 rollouts per question, a global batch of 128 prompts, and one policy-gradient
    update after each batch. Its curriculum is math-only RL at 8K, 16K, and 24K response budgets; code-only RL at 24K and
    32K; then math-only RL at 32K. The public SFT release has 3,970,332 samples, whereas the experimental v7 blend has 2.2M;
    the exact consumed subset and revisions are not pinned.
  rollout_count: 8 or 16
  temperature: The paper studies RL temperatures 0.6, 0.85, and 1.0 and gives a rule of thumb of keeping temperature-adjusted
    entropy around 0.3; a single complete per-stage training-temperature schedule is not disclosed. Evaluation defaults to
    temperature 0.6 and top-p 0.95.
  inference_budget: RL response-length budgets grow from 8K to 32K. Official evaluation uses a 32,768-token maximum by default,
    with benchmark-specific avg@n sampling; some overlong-filtering ablations also evaluate at 64K.
  optimizer_or_scaffold: Strictly on-policy GRPO in veRL, with a token-level policy-gradient loss, G=8 or 16 responses per
    question, 128 prompts per global batch, one update per batch, and no KL term. Optimizer, learning rate, clipping, hardware,
    seeds, exact stage temperatures, and full checkpoint schedule are not disclosed.
audit:
  source_mixture: The official SFT release exposes category/source/input/output and source-level question/sample counts, and
    says all outputs are DeepSeek-R1 generations. The paper's v1-v7 study uses a different 383K-prompt pool and a 2.2M-sample
    v7 blend. No immutable manifest maps release rows to experimental blends, filtering decisions, or the final checkpoint.
    The RL mixture is inherited from AceReason-Nemotron-1.0 and only partially represented by the related AceReason-Math release.
  split: Both checked NVIDIA datasets expose only a train split. The paper reports prompt deduplication and benchmark-overlap
    filtering but not a complete immutable train/validation/test manifest for the SFT blend or stage-specific math/code RL
    curricula.
  decontamination: The paper and SFT dataset card state that any sample with 9-gram overlap to a math or coding benchmark
    test sample is removed. The benchmark inventory, normalization, matching implementation, removal counts, generated-output
    checks, and residual-overlap audit are not disclosed.
  license: AceReason-1.1-SFT and AceReason-Math are licensed CC BY 4.0; AceReason-Nemotron-1.1-7B uses the NVIDIA Open Model
    License. Source-level rights and redistribution conditions for every upstream prompt, DeepSeek-R1 output, code test, and
    benchmark item still require review.
  lineage: Qwen2.5-Math-7B -> DeepSeek-R1-generated math/code SFT -> staged on-policy GRPO over AceReason-Nemotron-1.0 math/code
    tasks -> AceReason-Nemotron-1.1-7B. Public artifacts do not supply row-to-blend, task-to-stage, rollout-to-reward, or
    example-to-checkpoint lineage.
  known_failure_modes:
  - The official SFT release contains 3,970,332 samples and 514,807 source-counted questions, while the paper's final experimental
    blend contains 2.2M samples drawn from 383K prompts; treating them as identical would misstate training lineage.
  - The paper explicitly notes that incorrect code tests cause false-negative rewards and overly simple tests cause false
    positives; the tests and their error analysis are not released.
  - Long teacher outputs are used as a proxy for problem difficulty during SFT filtering, which can confound difficulty with
    teacher verbosity or style; the paper does not validate this proxy against independent difficulty labels.
  - Only successful/unsuccessful group rewards are described; rejected rollouts, truncated responses, reward logs, and stage-specific
    prompt manifests are unavailable, limiting reward-hacking and selection-bias audits.
  - The 9-gram decontamination procedure lacks a released benchmark list, normalization code, yields, and residual-leakage
    measurement.
  citation_status: verified
  confidence: medium
  notes: 'Checked arXiv v1/PDF and appendix, the NVIDIA model card, AceReason-1.1-SFT viewer/card, AceReason-Math viewer/card,
    NVIDIA collection, and official Hugging Face repository metadata. Snapshot identifiers observed on 2026-07-21: SFT 5ac692742de9f2481f8274d022dc78d5fc96c249;
    AceReason-Math a5cc41c5ecfc1d4a6571f98ade92d7fec100b2a8; model 2be9ed2fe532f39332ee47fd21899cab5fd6ec15. This is a Track
    12 disclosure ledger, not a claim that the full training pipeline is reproducible.'
inclusion_reason: An NVIDIA reasoning-model report with released weights, an inspectable DeepSeek-R1-generated SFT corpus,
  a related math RL dataset, and unusually concrete SFT/RL/verifier ablations, while leaving the exact SFT subset, code-RL
  data/tests, and complete source-to-checkpoint ledger unresolved.
