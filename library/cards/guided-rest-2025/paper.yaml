one_line_summary: Guided-ReST uses optimal solutions as training-time landmarks to repair, verify, and distill current-policy
  search traces.
why_it_matters: It makes the privileged construction view, the filtered or masked training view, and the unassisted inference
  view explicit, which is central to auditing search-generated reasoning data.
