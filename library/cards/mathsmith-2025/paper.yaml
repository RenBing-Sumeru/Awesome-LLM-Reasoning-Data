one_line_summary: Trains and releases Qwen3-8B problem synthesizers that turn PlanetMath-derived concepts into rationales
  and hard math problems using structural, trace-length, and same-teacher consistency rewards.
why_it_matters: It exposes a reusable generator-side SFT-to-GRPO pipeline and intermediate data objects while showing that
  its difficulty and availability signals remain teacher-dependent proxies rather than independent mathematical verification.
