data_object:
  prompt_source: AgentInstruct and ToolBench tasks, with additional negative queries that separate tool availability from
    user requests.
  trace_author: Existing AgentInstruct and ToolBench teachers supply source traces; the authors transform and decompose them
    into ReAct, conversation, CoT, capability, and negative records.
  answer_format: An id plus conversation turns containing user state/tool information and assistant reasoning, tool selection,
    arguments, or explicit non-use responses, with loss masks.
  process_fields:
  - id
  - conversation.role
  - conversation.content
  - conversation.loss
  - thought
  - action
  - tool response
  - negative condition
  environment_or_substrate: Seven held-in task families covering ALFWorld, WebShop, Mind2Web, knowledge graphs, operating
    systems, databases, and ToolBench APIs.
  verifier_or_reward: Source task outcomes and ToolBench FINAL ANSWER checks support source filtering; format and action-hallucination
    conditions create explicit negative supervision.
  terminal_predicate: Keep source records following required source format and, for ToolBench, containing FINAL ANSWER; reject
    DFSDT retry-preface records and supervise when tools should not be called.
recipe_metadata:
  base_model: Llama-2 7B, 13B, and 70B
  teacher: Teachers inherited from AgentInstruct and ToolBench; the paper focuses on transformation and mixture rather than
    one new teacher.
  generator: Convert ReAct/JSON into natural conversations, decompose examples by reasoning, retrieval, understanding, and
    instruction following, then add two families of tool-use negatives.
  filtering_rule: Remove records that violate Thought-Action-ActionInput; for ToolBench require FINAL ANSWER and remove DFSDT
    retry-preface samples; retain about 10 percent of ToolBench.
  sampling_protocol: Default mixture uses 10 percent ReAct and 90 percent conversation form, with reasoning:retrieval:understanding
    weights 1:0.25:0.75 plus 2,000 instruction-following samples.
  rollout_count: 24703
  temperature: null
  inference_budget: The paper reports 18.1M weighted-mixture training tokens and GPU counts for model scales, but not source-teacher
    generation cost or a total wall-clock budget.
  optimizer_or_scaffold: Llama-2 SFT with cosine schedule, learning rate 2e-5, batch size 32 for 7B/13B and 128 for 70B.
audit:
  source_mixture: 195 OS, 538 database, 300 knowledge-graph, 351 WebShop, 336 ALFWorld, 116 Mind2Web, and 22,867 ToolBench
    samples, totaling 24,703.
  split: The public release exposes seven JSONL splits for AgentInstruct ReAct/conversation forms, ToolBench instruction,
    negative, ReAct, conversation, and CoT forms.
  decontamination: The paper evaluates held-out tasks but does not document a release-wide semantic overlap audit across all
    inherited AgentInstruct, ToolBench, Agent-H, and evaluation prompts.
  license: The official dataset card and code repository declare Apache-2.0; inherited AgentInstruct and ToolBench source
    terms still require record-level review.
  lineage: Static conversations and rationale/tool traces explicitly consumed by SFT; Agent-H is an evaluation neighbor, but
    the release's central object is the redesigned training mixture.
  known_failure_modes:
  - Training formats and negative templates can become shortcut signals rather than robust tool-use judgment.
  - Only about ten percent of ToolBench is used, and the selection may bias API coverage.
  - Inherited teacher and source-dataset errors remain despite conversational reformatting.
  citation_status: verified
  confidence: high
  notes: ACL paper and affiliations, official Apache-2.0 repository and dataset, seven-file manifest, one actual JSONL record,
    mixture counts, training settings, and current adoption signals were checked on 2026-07-14.
inclusion_reason: Agent-FLAN openly releases a 24,703-record SFT mixture whose central contribution is the transformation,
  capability balancing, and negative supervision of serialized agent reasoning and tool traces.
