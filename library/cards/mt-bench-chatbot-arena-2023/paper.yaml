data_object:
  prompt_source: 80 manually designed two-turn MT-Bench questions plus crowdsourced Chatbot Arena prompts from anonymous model
    battles; the paper states that MT-Bench questions, about 3K expert votes, and about 30K human-preference conversations
    were released through the FastChat llm_judge artifacts.
  trace_author: LMSYS authors designed MT-Bench, collected expert pairwise preferences for controlled comparisons, and collected
    crowd votes through anonymous Chatbot Arena battles.
  answer_format: MT-Bench and Arena records expose prompts or conversation context, two candidate model answers, response
    order, human or GPT-4 judge preference, optional tie/win/loss outcome, and aggregate score or win-rate metadata.
  process_fields:
  - multi-turn prompt or arena user prompt
  - model A and model B responses
  - response ordering metadata
  - human vote, expert preference, GPT-4 pairwise judgment, or GPT-4 scalar grade
  - aggregate win-rate, agreement, or score table
  environment_or_substrate: GPT-4 pairwise/multi-turn judging and human arena votes
  verifier_or_reward: human preference is the reference signal for judge agreement; GPT-4 pairwise or single-answer prompts
    are the scalable judge being audited.
  terminal_predicate: preference outcome, agreement with human labels, average score, or arena-style win rate under a pinned
    judge prompt and data snapshot.
recipe_metadata:
  base_model: Not a training recipe; this Card treats the work as an evaluation or audit surface.
  teacher: expert human raters, Chatbot Arena crowd voters, and GPT-4 judge prompts used as the evaluated judge.
  generator: LMSYS/FastChat MT-Bench and Chatbot Arena release pipeline.
  filtering_rule: For pairwise judging, swap answer order and treat order-sensitive inconsistent decisions conservatively;
    audit position bias, verbosity bias, self-enhancement bias, and reasoning failures before reuse.
  sampling_protocol: Pin source version, split, evaluator revision, prompt/scaffold policy, and leaderboard date before comparing
    scores.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation budget is model- and harness-specific; do not infer a training-time budget from benchmark scores.
  optimizer_or_scaffold: judge_reward_meta_evaluation
audit:
