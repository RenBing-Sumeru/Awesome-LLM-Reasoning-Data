    artifacts before score reuse.
  decontamination: Public benchmark records can leak into future training data; live, hidden, or post-cutoff claims require
    versioned evidence.
  license: FastChat code license and each released judgment dataset or leaderboard artifact need separate reuse checks before
    redistribution or training use.
  lineage: 'Primary lead: https://arxiv.org/abs/2306.05685'
  known_failure_modes:
  - public release, hidden/public split, evaluator implementation, prompt/scaffold settings, and license can affect reuse.
  - Scores can change with prompt format, scaffold, evaluator version, hidden/public split, or dependency environment.
  - Evaluation-only evidence should not be reused as training reward without a separate feedback-contract audit.
