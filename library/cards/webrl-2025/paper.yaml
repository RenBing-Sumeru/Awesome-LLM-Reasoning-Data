one_line_summary: WebRL trains browser agents over 8 curriculum phases using failure-derived GPT-4o tasks, binary ORM-labeled
  rollouts, KL-constrained updates, and confidence-filtered successful replay, while releasing only a partial data corpus.
why_it_matters: It exposes how interactive agent trajectories become post-training records and shows that task generation,
  terminal reward modeling, and replay selection are inseparable parts of the feedback contract; it also illustrates why model/code
  release does not imply an auditable trajectory release.
