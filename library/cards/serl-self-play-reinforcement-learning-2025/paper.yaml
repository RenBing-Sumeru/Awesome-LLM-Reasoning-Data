status: partial
one_line_summary: SeRL generates questions from a 500-example seed, filters them by diversity and self-consensus difficulty,
  and trains on sixteen-response agreement rewards, while releasing code and prompt snapshots rather than complete paper-run
  trajectories.
why_it_matters: It operationalizes label-free reward construction for scarce-domain reasoning, but its wrong-consensus failure
  and paper-code-release mismatches show why self-rewarding data needs failures, equivalence traces, provenance, and immutable
  configurations.
