one_line_summary: Grok 4 Fast's model card and launch announcement disclose broad pretraining sources, de-duplication/classification,
  SFT and RL with human feedback, verifiable rewards and model grading, safety mitigations, and tool-use RL, but not record-level
  data, reward, filter, or evaluator contracts.
why_it_matters: It provides a closed-frontier disclosure baseline for separating report-level evidence about post-training,
  safety, tool use, and test-time behavior from missing provenance, data-rights, verifier, evaluation, and reproducibility
  evidence.
