one_line_summary: OS-Genesis explores virtual GUIs first, reverse-synthesizes executable tasks from state-action-state triples,
  and uses graded trajectory rewards to sample mobile and web agent trajectories for SFT.
why_it_matters: It reverses instruction-first collection and preserves incomplete but potentially useful interaction evidence
  through reward-weighted sampling instead of binary filtering.
