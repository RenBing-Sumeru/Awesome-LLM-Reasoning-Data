one_line_summary: QCoder combines human quantum-programming contest submissions with simulator feedback so LLMs can be judged
  beyond ordinary Python execution.
why_it_matters: It demonstrates a domain-expert feedback contract in which executable code must satisfy meaningful hardware-aware
  constraints.
