data_object:
  prompt_source: Quantum-programming problems from the public QCoder educational platform.
  trace_author: Human contest participants provide submitted Qiskit solutions and revision histories.
  answer_format: Natural-language problem and hardware constraints, Qiskit solve function, simulator verdict, and human solution
    history.
  process_fields:
  - problem
  - constraints
  - target_state
  - qiskit_code
  - simulator_feedback
  - human_revision
  environment_or_substrate: Quantum simulator representing domain-specific hardware constraints.
  verifier_or_reward: Simulator checks functional correctness, circuit depth, execution time, and unsupported-gate/error conditions.
  terminal_predicate: Generated code constructs a valid circuit satisfying the target state and hardware constraints.
recipe_metadata:
  base_model: GPT-4o, o3, and other code-generation models in the paper.
  teacher: Human programming-contest submissions.
  generator: QCoder problem and contest-submission collection with permission from the platform developers.
  filtering_rule: Simulator environment rejects invalid circuits and classifies errors.
  sampling_protocol: 58 problems, about 30 human solutions each, 1,740 problem-solution pairs, and about 20 intermediate revisions
    per submission on average.
  rollout_count: Iterative refinement is enabled by simulator feedback.
  temperature: null
  inference_budget: Repeated generation/refinement calls are evaluated using simulator feedback.
  optimizer_or_scaffold: Public evaluation API for feedback-driven iterative code generation.
audit:
  source_mixture: Official INLG paper and QCoder project site.
  split: Benchmark construction and evaluation API are documented by the project.
  decontamination: Contest data and public problems require strict separation from training/evaluation when reused.
  license: Inspect the project site and source-platform terms.
  lineage: QCoder platform problems + human contest submissions + simulator feedback.
  known_failure_modes:
  - Simulator is a proxy for actual hardware
  - Qiskit-specific API
  - public contest data can become a training leak.
  citation_status: verified
  confidence: high
  notes: Official ACL PDF and project page verify author order, affiliations, 58 problems, 1,740 pairs, and simulator feedback.
inclusion_reason: It grounds code-reasoning evaluation in a specialist simulator and real human implementation/revision data.
