one_line_summary: Releases exactly 366,154 train-only terminal SFT episodes from dataset adapters and skill-based synthesis,
  while the paper's no-filter recipe retains incomplete and failed behavior but the public rows expose no normalized outcome
  or reward.
why_it_matters: It provides unusually direct evidence that retaining realistic error states can outperform success-only filtering
  for terminal-agent SFT, while making count reconciliation, failure labels, verifier semantics, and container replayability
  first-class audit requirements.
