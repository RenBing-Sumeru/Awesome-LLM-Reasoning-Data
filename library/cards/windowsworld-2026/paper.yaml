one_line: WindowsWorld releases all 181 Windows task/checkpoint specifications and an executable Qwen-judged harness, but
  not the authors' complete success/failure trajectories, and its public review/setup/version contracts remain incomplete.
one_line_summary: WindowsWorld releases all 181 Windows task/checkpoint specifications and an executable Qwen-judged harness,
  but not the authors' complete success/failure trajectories, and its public review/setup/version contracts remain incomplete.
why_it_matters: It shows how partial-progress feedback can make long-horizon GUI failures diagnostically useful while also
  demonstrating that task scale, released trajectories, environment initialization, judge calibration, and exact replay are
  separate evidence claims that must not be collapsed into one “dataset released” label.
