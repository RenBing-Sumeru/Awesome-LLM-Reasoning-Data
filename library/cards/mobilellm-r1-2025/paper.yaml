one_line_summary: MobileLLM-R1 derives phase-specific mixtures with capability probes and influence estimates, then trains
  140M-950M models through 4T pretraining, 200B distillation mid-training, and staged SFT without releasing the sampled corpus
  or full curation pipeline.
why_it_matters: It exposes concrete source weights, phase budgets, and selection signals for small-model reasoning research
  while showing why an open recipe and model checkpoints are not equivalent to a frozen, replayable training corpus.
