data_object:
  prompt_source: Public web, educational, code, mathematics, science, academic, instruction, and benchmark-training corpora
    listed in Appendix Tables 5-7.
  trace_author: Upstream corpus authors and generators supply text and reasoning conversations; Llama-3.1-8B-Instruct supplies
    logits for mid-training distillation.
  answer_format: Pretraining and mid-training text records plus general-instruction and long-form math, science, and code
    conversations for SFT.
  process_fields:
  - source_dataset
  - capability_domain
  - educational_quality_score
  - Ask-LLM inclusion_probability
  - representative_subset_membership
  - semantic_deduplication_status
  - capability_probe_loss
  - checkpoint_influence_score
  - dataset_mixture_weight
  - training_phase
  - prompt
  - response
  environment_or_substrate: Offline representative-set construction, capability-probe evaluation, leave-one-out training,
    AutoMixer-style influence estimation, two-phase pretraining, two-phase distillation mid-training, general SFT, and reasoning
    SFT.
  verifier_or_reward: FineWeb-Edu educational-quality classification, Ask-LLM relevance judgments, capability-probe NLL, and
    estimated sample influence guide selection; KL divergence and token-level SFT losses train models. No unified answer-correctness
    verifier is disclosed.
  terminal_predicate: Mid-training retains a sample when its estimated influence is greater than zero; pretraining assigns
    dataset-level weights from aggregated influence. No unified terminal predicate covers upstream SFT conversations.
recipe_metadata:
  base_model: Randomly initialized MobileLLM-R1 models with 140.2M, 359.4M, and 949.2M parameters.
  teacher: Llama-3.1-8B-Instruct for mid-training logit distillation; the model used for Ask-LLM and the generators of all
    upstream SFT traces are not fully disclosed here.
  generator: Existing corpora are filtered and resampled rather than generated by one model; upstream post-training datasets
    contain externally generated reasoning traces.
  filtering_rule: Build representative subsets with FineWeb-Edu score above 4, generic and domain-specific Ask-LLM top-10%
    selection, and semantic deduplication; derive pretraining weights from influence; retain mid-training samples with positive
    estimated influence.
  sampling_protocol: Two pretraining phases sample 2T tokens each from a listed 1.8T-token source pool; two mid-training phases
    sample 100B tokens each; general SFT uses 866K examples for two epochs and reasoning SFT uses a reported 6.2M examples
    for four epochs.
  rollout_count: null
  temperature: null
  inference_budget: Ask-LLM and upstream trace-generation budgets are undisclosed; training sequence lengths are 2k for pretraining,
    4k for mid-training/general SFT, and 32k for reasoning SFT.
  optimizer_or_scaffold: Pretraining and SFT use Adam; mid-training also minimizes KL divergence to Llama-3.1-8B-Instruct.
    Influence is aggregated across ten checkpoints, with later checkpoints weighted more heavily.
audit:
  source_mixture: Appendix Table 5 lists a 1.8T-token pretraining pool, described approximately as 2T, and phase-specific
    weights. Mid-training adds Dolmino, Nemotron, StarCoder, and named benchmark training splits; post-training uses Tulu-3
    and three open reasoning datasets.
  split: Phase-2 mid-training includes training splits of TriviaQA, OBQA, NaturalQuestions, PIQA, GSM8K, BoolQ, ARC-Easy,
    and ARC-Challenge. Sampled manifests and an end-to-end split ledger are not released.
  decontamination: unknown
  license: The official code and model release uses the FAIR Noncommercial Research License. Upstream datasets retain separate
    licenses, and no mixture-wide redistribution determination is provided.
  lineage: Source corpus -> filtered representative subset -> capability-domain probe -> leave-one-out and checkpoint influence
    estimates -> dataset weights or positive-influence retention -> phase-specific sampled mixture -> pretraining/mid-training
    -> general and reasoning SFT. Per-record lineage is not released.
  known_failure_modes:
  - The listed 1.8T-token source pool, approximately 2T source claim, 4T pretraining exposure, and 4.2T pre-SFT exposure are
    different quantities.
  - FineWeb-Edu and Ask-LLM scores measure educational quality and perceived reasoning relevance, not factual or solution
    correctness.
  - Influence estimates depend on the probe distribution, model checkpoint, approximation, and undisclosed prompt and deduplication
    choices.
  - Negative-influence filtering can discard rare or delayed-benefit examples.
  - Benchmark training splits enter phase-2 mid-training, while no decontamination or overlap report is released.
  - The official repository lacks the capability-probe, Ask-LLM, semantic-deduplication, influence, and subsampling pipeline.
  - The example pretraining shell configuration differs from the paper's Table 4 settings.
  - No immutable combined corpus, sampled IDs, or tagged code release is available.
  - FAIR Noncommercial terms do not replace heterogeneous upstream dataset licenses.
  - Benchmark improvements do not by themselves establish data quality or causal attribution to one filtering component.
  citation_status: verified
  confidence: high
  notes: The ICLR 2026 paper v3, official repository at commit f518dc7e402876fc694a827385ed25de31242905, root license, training
    scripts, evaluation README, and official Hugging Face collection were checked on 2026-07-21. The release supports recipe-level
    audit but not exact corpus replay.
inclusion_reason: A data-centric, full-stack recipe that makes dataset-level source weights and stage budgets unusually explicit
  and connects hierarchical filtering and influence estimates to sub-billion reasoning-model training.
