status: partial
one_line_summary: An OmegaPRM-style multimodal pipeline that turns answer-judged rollout success rates into soft step labels
  and trains an 8B PRM, while releasing the seed data and checkpoint but not the reported annotation trees.
why_it_matters: It makes the chain from multimodal rollouts to step rewards explicit and shows why Monte Carlo value, final-answer
  judgment, learned PRM score, and Best-of-N selection must be audited as separate contracts.
