recipe_metadata:
  base_model: Multiple open and proprietary LLMs are evaluated through the official package.
  teacher: Rule-based cleaners and SQLite execution validation.
  generator: Classify WikiSQL defects, repair deterministically resolvable cases, and expand action labels into SQL text.
  filtering_rule: Remove records that cannot be reliably repaired or have no executable answer.
  sampling_protocol: About 80.3K cleaned single-table records released through Hugging Face.
  rollout_count: null
  temperature: 0
  inference_budget: Fix LLMSQL version, SQLite, few-shot examples, inference backend, and decoding parameters.
