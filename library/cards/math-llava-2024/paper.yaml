one_line_summary: Math-LLaVA turns 40k selected images into an open 360k-record multimodal mathematics instruction set and
  measures the contribution of selection and four synthesis operations.
why_it_matters: It exposes a compact, inspectable recipe for increasing questions per image and provides ablations that distinguish
  selection from synthetic record expansion.
