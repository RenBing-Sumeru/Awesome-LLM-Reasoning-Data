one_line_summary: SWE-MERA releases refreshable repository-repair records with commits, patches, tests, commands, and environment
  metadata, but its pinned public checker marks solved using PASS_TO_PASS only and does not enforce FAIL_TO_PASS.
why_it_matters: It shows why dynamic task freshness, dataset versioning, container replay, and exact terminal semantics must
  be audited independently of a benchmark's stated design.
