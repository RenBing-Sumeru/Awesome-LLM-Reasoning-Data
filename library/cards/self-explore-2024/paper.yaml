status: partial
one_line_summary: Self-Explore converts rejected math rationales into prompt/chosen/pit-step preferences by searching for
  the first prefix with no correct recovery among four samples; code is open, but paper-run generated pairs are not.
why_it_matters: It shows how answer-verifiable rejected traces can be recycled into step-local supervision while making finite-search
  labels, selective pair coverage, and unreleased generation ledgers central audit risks.
