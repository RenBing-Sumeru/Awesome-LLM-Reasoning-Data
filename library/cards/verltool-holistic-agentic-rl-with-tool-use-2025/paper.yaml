one_line_summary: VerlTool turns task prompts into on-policy, multi-turn action-observation episodes behind a stateful Tool
  Server, but releases no paper-pinned six-domain trajectory corpus or replay manifest.
why_it_matters: Its unified interface makes environment observations, validity/termination signals and terminal reward provenance
  comparable across math, search, SQL, visual, deep-search and SWE agents. The absent episode release and post-paper code
  drift sharply limit direct data reuse and exact replay.
