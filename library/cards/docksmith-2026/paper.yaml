one_line_summary: DockSmith converts test-backed GitHub pull requests into success-filtered, execution-grounded Docker-building
  conversations for agent SFT and releases 39,719 per-agent chat fragments linked to 2,876 instances.
why_it_matters: It makes environment construction itself a reusable supervision source and shows that success-filtered Docker
  traces can transfer to broader software-agent tasks, while exposing important selection, replay, licensing, and security
  audit gaps.
