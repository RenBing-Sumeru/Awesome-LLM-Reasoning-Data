one_line_summary: An ICML 2025 tree-search accelerator that accepts PRM-scored small-model thoughts above a history-based
  threshold and replaces rejected thoughts through lossless large-model speculative decoding.
why_it_matters: For rollout and test-time trace curation, it exposes the thought, score, dynamic threshold, accept-or-correct
  decision, and search state that should be retained, while the official release stops at code rather than auditable trace
  data.
