inclusion_reason: ThinkLite-VL is a high-relevance Track 8 recipe that converts a heterogeneous 70K visual-reasoning pool
  into model-specific RLVR subsets using search depth and failure-to-solve as difficulty signals, while its partial decision-lineage
  and licensing release expose concrete audit gaps.
