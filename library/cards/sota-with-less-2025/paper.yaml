status: partial
one_line_summary: ThinkLite-VL uses model-specific MCTS solve depth and unsolved-after-50 status to select 11K/7.5K visual-reasoning
  prompts from a 70K pool for one-stage GRPO self-improvement.
why_it_matters: It demonstrates a concrete search-budgeted alternative to accuracy-only filtering and releases the 70K pool
  plus the 7B-selected subset, while also showing why selection decisions, upstream licenses, failed traces, model revisions
  and rejected examples must be published for a difficulty-curation recipe to be reproducible and auditable.
