inclusion_reason: 'MACC is a direct long2short trace-search recipe: each original rationale becomes a sequential path of answer-conditioned
  revisions, a token-length rule selects one stopping point, and the selected full trace becomes SFT data. It is especially
  relevant to this track because original, intermediate, selected, rebound, and rejected records plus per-example budgets
  are all hidden behind aggregate tables.'
