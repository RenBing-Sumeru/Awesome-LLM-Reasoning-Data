one_line_summary: MACC sequentially rewrites each target-model math rationale with an answer-conditioned API compressor, stops
  on a token-length rebound, and SFTs the selected concise trace; the official repository currently releases neither the implementation
  nor the generated corpus.
why_it_matters: It makes long-to-short reasoning a trace-selection problem whose result depends on round budget, API model,
  answer exposure, tokenization, and stop rule, while the missing original/rejected revisions and an appendix selection inconsistency
  show why aggregate accuracy cannot substitute for auditable record-level lineage.
