  answer_format: Integer outcome categories for each question and repeated trial, with a category-weight
    vector.
  process_fields:
  - question
  - model
  - trial
  - category
  - rubric_weight
  environment_or_substrate: Fixed-benchmark repeated-sampling evaluation.
  verifier_or_reward: Correctness and formatting signals; some categorical rubrics also use calibrated
    CompassVerifier-3B label probabilities.
  terminal_predicate: A recorded correctness or rubric category per response; posterior performance is
    computed from category counts.
recipe_metadata:
  base_model: Twenty reasoning-model configurations; model list in Appendix G.2.
  teacher: null
  generator: Repeated stochastic model responses plus simulations with known success probabilities.
  filtering_rule: Outcomes are retained as categories; invalid/off-task responses can receive their own
    category.
  sampling_protocol: 'Appendix G.3: temperature 0.6, top-p 0.95, batch size 1, seeds 1234 through 1313.'
  rollout_count: 80
  temperature: 0.6
  inference_budget: Up to 80 trials per model and benchmark question.
  optimizer_or_scaffold: Closed-form Dirichlet-multinomial posterior calculation implemented in Scorio.
audit:
  source_mixture: Official ICLR 2026 poster record, arXiv v4, and the paper-linked Scorio repository.
