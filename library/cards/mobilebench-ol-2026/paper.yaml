one_line_summary: MobileBench-OL publishes 1,080 real-device Chinese-app evaluation cases with XPath-like success rules, noise
  injection and inverse-task resets, but not the paper's complete sampled trajectories or a frozen APK/device environment.
why_it_matters: It shows how screenshots, XML state, actions, terminal signaling, partial predicates and reset episodes form
  an auditable mobile-agent feedback contract, while demonstrating why public rules, app drift, imperfect resets and missing
  failed-rollout lineage constrain reuse to evaluation rather than training.
