one_line_summary: STEP prunes low-promise reasoning traces using step-end hidden states when KV-cache pressure rises, reducing
  parallel test-time latency without sacrificing accuracy.
why_it_matters: It connects trace-quality signals to an actual serving-system trigger, showing that compute allocation must
  consider KV-cache scheduling as well as model reasoning.
