one_line_summary: GPT-5-Codex discloses RL on real-world project building, feature and test work, debugging, refactoring,
  and code review plus synthetic malware and new prompt-injection safety data, but not the task records, preference or reward
  representation, trajectories, split, or reusable artifacts.
why_it_matters: It is a useful coding-agent disclosure ledger because it names concrete training task families and separates
  code-review training, experienced-engineer evaluation, executable tests, safety data, traffic observations, and product
  sandboxing that could otherwise be conflated into an unsupported reward or dataset claim.
