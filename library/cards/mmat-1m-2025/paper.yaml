data_object:
  prompt_source: Public multimodal QA datasets including Visual CoT, LLaVA-CoT, The Cauldron subsets, TabMWP, and Infoseek
  trace_author: GPT-4o generates rationales, tool/RAG interactions, and reflection-based refinements
  answer_format: Multi-turn Rationale-and-Reflection dialogue or compressed one-turn ORR record with image references and
    optional tool/RAG calls
  process_fields:
  - source_dataset
  - image
  - question
  - reference_answer
  - rationale
  - tool_call
  - tool_result
  - reflection
  - revised_rationale
  - compressed_dialogue
  environment_or_substrate: Offline multimodal QA enrichment with API calls and retrieval-augmented multi-turn dialogue
  verifier_or_reward: GPT-4o reflection checks/refines logical consistency and accuracy against source QA; no independent
    executable verifier
  terminal_predicate: Dialogue/reflection yields the intended reference answer in RR or ORR format
recipe_metadata:
  base_model: Open multimodal models such as InternVL2.5 are fine-tuned for evaluation
  teacher: GPT-4o
  generator: GPT-4o rationale, dynamic API/RAG, reflection, and compression pipeline
  filtering_rule: Curate public QA, generate rationale/tool evidence, reflect and revise for consistency, optionally compress
    to ORR
  sampling_protocol: 'Four stages: source curation; multi-turn rationale plus tool/RAG generation; reflection refinement into
    RR; optional one-turn compression into ORR'
  rollout_count: null
  temperature: null
  inference_budget: null
  optimizer_or_scaffold: Supervised multimodal agent tuning on RR/ORR records
audit:
  source_mixture: Visual CoT, LLaVA-CoT, The Cauldron subsets, TabMWP, Infoseek, and their component image/QA sources
  split: Current HF release has about 1.64M train and 16.6K validation rows (1.66M total); exact source-wise split and leakage
    controls are not documented in the card excerpt
  decontamination: unknown
  license: 'Composite: Apache-2.0, CC BY 4.0/subset-specific terms, and TabMWP CC BY-NC-SA 4.0; commercial use may require
    separate permission and share-alike obligations'
  lineage: Image paths often reveal source families, but the public schema shown exposes only messages/images; consistent
    per-record source ID, original QA ID, teacher call, tool result provenance, reflection revisions, and license are not
    verified
  known_failure_modes:
  - GPT-4o generates and validates its own rationales, creating correlated teacher errors
  - Tool/API and RAG results can be stale, unavailable, or incorrectly cited
  - Reflection can improve plausibility without guaranteeing faithfulness
  - ORR compression can drop failed calls, uncertainty, or corrective context
  - Heterogeneous source licenses prevent treating the whole mixture as uniformly Apache-2.0
  - Failed tool calls, rejected rationales, and teacher prompts are not released
  citation_status: verified
  confidence: high
  notes: Official ICCV 2025 CVF proceedings record verified. HF currently exposes 1.66M rows, so MMAT-1M is a family/name
    rather than an exact one-million row count. Repository contains documentation but no tagged release and no complete generation
    code was verified.
inclusion_reason: Releases a large multimodal agent-tuning mixture with explicit rationale, dynamic tool/RAG, reflection,
  and compression stages.
