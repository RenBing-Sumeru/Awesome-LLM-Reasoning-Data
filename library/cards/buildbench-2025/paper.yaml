  verifier_or_judge_failure_modes:
  - Unvalidated completion can be a false positive when a failed build leaves intermediate binaries or only a submodule/vendored
    package builds.
  - Strict/flexible filename matching does not establish binary functionality, semantic fidelity, security, or reproducibility
    and can be fooled by wrong or stale artifacts with expected names.
  - Online Success(f_k), numerical K, and the evaluator implementation are undisclosed; an agent may terminate before resolving
    root causes.
  - Agents can patch source code, so build success may refer to a modified program without a semantic-equivalence or allowed-change
    check.
  - LLM retrieval may follow different live-documentation paths, and model nondeterminism compounds over multi-turn execution.
  - Dependency resolution, wrong directories, incorrect flags, repository errors, and insufficient troubleshooting are documented
    failure modes; 69 inspected o3-mini cases recognized errors but failed to resolve them.
  successful_and_failed_sample_retention: The current test label file preserves 148 positive and 237 negative repository-level
    compilability labels, but only 126 negative rows have a non-empty failure reason. Complete successful/failed agent commands,
    observations, patches, binaries, execution logs, retry histories, and per-run terminal verdicts are not released.
  container_dependency_network_cache_timeout_replay: Fresh Ubuntu 22.04 per repository is disclosed. Exact image digest/Dockerfile,
    preinstalled packages, package and dependency locks, index snapshots, submodule policy, network allowlist, fetched-page
    snapshots, cache behavior, wall-clock timeout, numeric turn limit K, random seeds, and replay commands are unknown.
  security: The disclosed scaffold runs untrusted repositories and build scripts as root, installs packages, follows external
    URLs, and may edit source. No threat model, egress restriction, sandbox-hardening profile, secret policy, artifact malware
    scan, or supply-chain isolation procedure is reported. Reuse should occur only in disposable, network-restricted sandboxes.
  privacy_or_consent: unknown
  citation_status: verified
  confidence: high
  notes: The evidence supports an evaluation benchmark and release of task/terminal-label records. It does not support calling
    the release a trajectory-training corpus or broadening training_use beyond evaluation and audit.
  remaining_unknowns:
  - Public OSS-Build-Agent code, evaluator implementation, exact prompts/configs, and paper-linked commit
  - Complete successful and failed agent rollouts, logs, patches, binaries, and per-run identifiers
  - Dockerfile/image digest, exact dependencies, package-index snapshot, network/cache/timeout policy, numeric K, and seeds
  - Validation-repository commits and end-to-end lineage across submodules, docs, patches, binaries, and evaluator
  - Paper-to-current-data changelog explaining the post-paper test-label expansion
  - Instance-level benchmark overlap and model-pretraining contamination audit
  - Rights/attribution manifest for all repositories, documentation, dependencies, patches, and binaries
  - Threat model and safe execution policy for untrusted build inputs
inclusion_reason: 'BuildBench makes repository compilation an environment-grounded agent episode: a model retrieves documentation,
  emits shell-command batches, observes build errors, and is scored by expert-targeted binary predicates. Its unusually explicit
  terminal contract and released positive/negative task labels are valuable, while the absence of public rollouts, code, environment
  locks, and complete rights/security metadata is itself an important audit boundary.'
