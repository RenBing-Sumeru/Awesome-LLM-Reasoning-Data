one_line_summary: BuildBench turns real C/C++ repositories into executable build-agent tasks with README/web retrieval, iterative
  shell feedback, and strict/flexible target-binary checks; the current release retains 385 candidate labels but not full
  rollouts or a pinned public scaffold.
why_it_matters: It cleanly separates a repository task, an interactive execution episode, and a terminal verifier, while exposing
  how mutable dependencies, source patching, filename-only success, missing failure traces, and release drift can undermine
  reuse of environment-agent data.
