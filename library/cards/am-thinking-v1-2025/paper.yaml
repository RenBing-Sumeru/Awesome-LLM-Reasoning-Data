data_object:
  prompt_source: Public datasets spanning mathematics, code, science, instruction following, and general chat; the paper names
    the component datasets, and the released RL subset contains 54.8K train rows from 19 data-source labels.
  trace_author: Synthetic-response generator identity is undisclosed; DeepSeek-R1 and o4-mini are used specifically to validate
    or repair mathematical ground truths.
  answer_format: Assistant responses contain complete <think> and <answer> components; mathematics uses a final boxed answer,
    code uses fenced Python or C++ programs, and chat may be single-turn or multi-turn.
  process_fields:
  - data_source
  - prompt
  - ability
  - reward_model
  - extra_info
  - synthetic_response
  - pass_rate_or_reward_score
  - difficulty
  environment_or_substrate: Math-Verify for mathematics, a distributed secure code sandbox for test execution, strict IFEval
    for instruction following, and an LLM-based reward model for non-verifiable queries.
  verifier_or_reward: Binary exact-equivalence reward for math; binary all-tests-pass reward for code; binary all-instructions-pass
    reward for instruction following; mean helpfulness, correctness, and coherence score for non-verifiable responses.
  terminal_predicate: Math answer matches the reference, all code tests pass, or every required instruction passes; non-verifiable
    queries use a scalar reward rather than an objective terminal predicate.
recipe_metadata:
  base_model: Qwen2.5-32B base
  teacher: DeepSeek-R1 and o4-mini for mathematical ground-truth validation and correction; other teacher roles are unknown.
  generator: The generator of SFT synthetic responses is undisclosed.
  filtering_rule: Deduplicate; remove URL/image prompts; exact and semantic evaluation-set decontamination; filter incomplete
    math prompts; validate or repair math ground truth; remove proofs and multi-part problems; rewrite MCQs; filter responses
    by perplexity, repeated n-grams, and think/answer structure; retain RL math/code prompts with SFT pass rate strictly between
    0 and 1.
  sampling_protocol: SFT may retain multiple responses for hard prompts. RL uses strict on-policy sampling with 256 prompts
    per batch and 16 rollouts per prompt; Stage 2 removes math/code prompts solved in every Stage-1 rollout and adds 15K chat
    plus 5K instruction-following prompts.
  rollout_count: 16
  temperature: null
  inference_budget: SFT maximum sequence length 32K; RL maximum response length 24K in Stage 1 and 32K in Stage 2.
  optimizer_or_scaffold: Two-epoch SFT with learning rate 8e-5, global batch 64, packing and 5% cosine warmup, followed by
    two-stage GRPO without KL; overlong responses receive zero advantage.
audit:
  source_mixture: The paper names public source datasets for five task families. SFT uses about 2.84M responses; the official
    RL release contains 54.8K rows, while Stage 2 additionally uses 15K chat and 5K instruction-following prompts not represented
    as a complete released training manifest.
  split: The official RL dataset exposes one 54.8K-row train split; complete SFT and stage-specific split manifests are not
    released.
  decontamination: Exact-match and semantic deduplication against evaluation sets are reported, but thresholds, embedding
    model, and item-level removal logs are undisclosed.
  license: The official model and RL dataset pages declare Apache-2.0; this does not by itself resolve the licenses and redistribution
    conditions of every upstream source.
  lineage: Public source prompts are cleaned and, for math, ground truths are checked or repaired; synthetic responses are
    filtered for SFT; SFT pass rates select math/code prompts for two-stage on-policy GRPO. The released RL rows expose source
    and reward metadata, but full item-level SFT and stage lineage is unavailable.
  known_failure_modes:
  - Binary final-answer and all-tests-pass rewards can miss invalid reasoning or weaknesses in reference answers, parsers,
    and test coverage.
  - The LLM reward model for open-ended data is unnamed and its calibration or error rate is not reported.
  - Important filtering thresholds, the SFT response generator, exact RL learning rates, and full training code are not disclosed.
  - Reported benchmark scores do not establish upstream rights, complete decontamination, or reproducibility of the full pipeline.
  citation_status: verified
  confidence: high
  notes: Official arXiv v2, model release, and 54.8K-row RL dataset release checked on 2026-07-17.
inclusion_reason: A concrete open 32B reasoning-model recipe that discloses source families, query and response filtering,
  task-specific reward contracts, SFT/RL settings, a checkpoint, and an RL prompt release.
