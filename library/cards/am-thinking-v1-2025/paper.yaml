one_line_summary: AM-Thinking-v1 combines 2.84M-sample SFT with two-stage GRPO over difficulty-filtered public queries and
  task-specific math, code, instruction, and model-based rewards, and releases the 32B checkpoint plus a 54.8K-row RL dataset.
why_it_matters: It provides an unusually concrete mid-scale reasoning recipe linking public prompt sourcing, ground-truth
  repair, response filtering, reward contracts, curriculum selection, and on-policy rollout settings.
