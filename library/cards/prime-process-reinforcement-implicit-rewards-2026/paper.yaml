one_line_summary: PRIME trains an online implicit process reward model from verifier-derived outcome labels and releases response-level
  preference data for math and code reasoning.
why_it_matters: It makes a concrete connection between inexpensive outcome labels, dense token-level reward estimates, and
  publicly reusable response records.
