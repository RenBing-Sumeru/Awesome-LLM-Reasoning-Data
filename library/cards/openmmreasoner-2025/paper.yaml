one_line_summary: Separates an open 874K multimodal SFT conversation mixture from roughly 73K released RL training prompts
  and unreleased 16-way online GSPO rollouts, with mixed rule, learned-judge, and format rewards.
why_it_matters: It makes a two-stage multimodal reasoning recipe inspectable and shows why released prompts, generated trajectories,
  terminal rewards, and policy updates must remain distinct audit objects.
