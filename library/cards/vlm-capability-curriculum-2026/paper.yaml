card_recommendation: High-priority core-only bilingual Card. Center the Card on the eight-field released row, the full 16-answer
  correctness vector and pass-rate calculation, the capability-plus-difficulty schedule, the answer/format verifier, and the
  distinction between retained incorrect final answers and missing rejected reasoning traces. Include the train-only split,
  source-mixture discrepancy, and upstream-license boundary as blocking audit notes.
