inclusion_reason: Releases a reusable curriculum data object in which every problem carries 16 sampled final answers, a 16-bit
  correctness vector, and a pass rate used for easy-to-hard ordering inside perception, textual-reasoning, and visual-reasoning
  RLVR stages; it also exposes the construction and verifier scaffold while leaving full reasoning completions outside the
  release.
