one_line_summary: VLM-CapCurriculum releases 32,736 staged RLVR problems with 16 extracted Qwen3-VL-8B answers, per-answer
  correctness flags, and a pass rate per row, enabling capability-first and within-stage difficulty curricula without releasing
  the underlying full reasoning completions.
why_it_matters: 'It turns repeated sampling into an auditable curriculum signal across perception, text reasoning, and visual
  reasoning, while making the central reuse boundary explicit: answer-level success vectors and images are public, but raw
  correct and rejected chains of thought, decontamination, and source-level license resolution are not.'
