one_line_summary: IPT detects when an RLVR model passes an original logic-task verifier by enumerating labels yet fails under
  a logically isomorphic object renaming.
why_it_matters: It separates executable answer acceptance from the intended invariant rule-learning objective, and shows how
  verifier choice changes RLVR behavior.
