recipe_metadata:
  base_model: Not a training recipe; it is a third-party aggregate evaluation index.
  teacher: Artificial Analysis methodology and component benchmark verifiers define the scoring contract.
  generator: maintained benchmark runner and reporting pipeline.
  filtering_rule: Treat each component score and suite version as a separate audit item before using the aggregate number.
  sampling_protocol: Pin methodology version, component benchmark versions, repeats, model API snapshot, temperature, token
    limits, tool access, and leaderboard date.
  rollout_count: null
  temperature: null
  inference_budget: The methodology publishes general temperature and output-token settings, but component-specific budgets
    and API-provider changes must be pinned for reuse.
  optimizer_or_scaffold: benchmark_suite_index
audit:
  source_mixture: Official Artificial Analysis Intelligence Benchmarking methodology page.
  split: Public method page discloses components and weights; internal dataset copies and some AA variants are not fully downloadable.
  decontamination: Component benchmarks can be public, private, or internally modified; contamination claims require per-component
    evidence.
  license: Method page is public documentation; artifact redistribution and internal dataset copies are not automatically
    licensed.
  lineage: 'Primary source: https://artificialanalysis.ai/methodology/intelligence-benchmarking'
  known_failure_modes:
  - aggregate index can hide component-specific strengths and failures
  - methodology, weights, and included evaluations can change over time
  - private or internally modified component copies can limit reproducibility
  - judge-panel, equality-checker, API-provider, and tool-access changes can move scores
  - English text-only scope excludes image, speech, and multilingual performance
  citation_status: verified
  confidence: medium
  notes: Official methodology verifies v4.1 components, weights, general testing parameters, and confidence-interval claim;
    downloadable row-level data and exact internal dataset snapshots were not verified.
