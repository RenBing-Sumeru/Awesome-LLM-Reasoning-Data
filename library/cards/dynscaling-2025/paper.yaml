one_line_summary: DynScaling combines integrated parallel-sequential sampling with UCB-style inter-query allocation to spend
  a fixed inference budget using answer disagreement rather than an external verifier.
why_it_matters: It exposes a concrete batch-level test-time trace schema while making uncertainty heuristics, majority selection,
  and the lack of released traces explicit audit boundaries.
