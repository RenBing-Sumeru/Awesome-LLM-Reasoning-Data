one_line_summary: Reasoning Gym is an open library of more than 100 configurable procedural reasoning generators with task-specific
  executable rewards for dynamic RLVR training and evaluation.
why_it_matters: It makes the reusable reasoning-data object a versioned generator-verifier environment whose realized examples
  and rewards depend on code, configuration, seeds, scorer behavior, and curriculum state.
