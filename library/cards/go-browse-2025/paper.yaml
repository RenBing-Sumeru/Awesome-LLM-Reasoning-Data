one_line_summary: Go-Browse releases raw and processed WebArena-clone trajectories plus a Qwen checkpoint from graph-frontier
  task discovery, VLM feasibility judgment, and prefixed/unprefixed browser rollouts.
why_it_matters: It connects task sourcing, search-state reuse, environment interaction, judge-based filtering, and supervised
  agent training while leaving material release-rights and reproducibility gaps visible.
