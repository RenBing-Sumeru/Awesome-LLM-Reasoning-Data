one_line_summary: LG released EXAONE Deep 2.4B, 7.8B, and 32B weights for research and reports 1.6M SFT, 20K DPO, and 10K
  Online-RL instances, but does not release the records or disclose their provenance, filtering, splits, rights, or RL feedback
  contract.
why_it_matters: It is a clear test case for separating downloadable reasoning-model weights and aggregate training statistics
  from an auditable post-training dataset and reproducible reward pipeline.
