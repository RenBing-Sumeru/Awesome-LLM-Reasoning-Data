one_line_summary: CREST samples 16 rationales per multiple-choice item, scores originally correct candidates with option-wise
  consistency probes, and converts the scores into tolerance-filtered SFT records and mixed DPO pairs.
why_it_matters: It makes a denser label-derived rationale-selection recipe inspectable while showing that same-model probing,
  aggregate counts and an unreleased decision ledger limit auditability.
