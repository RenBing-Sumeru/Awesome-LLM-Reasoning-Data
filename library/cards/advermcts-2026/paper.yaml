status: partial
one_line_summary: AdverMCTS co-evolves a Solver code-search tree and an Attacker test-search tree, retaining Arbiter-labeled
  counterexamples as a growing hard verifier at inference time.
why_it_matters: It turns adversarial counterexample discovery into an explicit inference-time data pipeline, while making
  clear that test validity, sandboxing, retention policy, decision lineage and release completeness determine whether the
  resulting verifier can be trusted or reused.
