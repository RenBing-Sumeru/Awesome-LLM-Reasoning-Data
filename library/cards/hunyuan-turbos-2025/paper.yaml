one_line_summary: Hunyuan-TurboS reports 16T pre-training tokens, 3M SFT samples, adaptive teacher-generated traces, about
  200K human preference labels, more than 800K executable code samples, and 300K plus 160K two-stage GRPO inputs, but releases
  no training corpus, weights, construction code, reward checkpoints, or replay ledger.
why_it_matters: It shows how a frontier report can disclose substantial stage-level data and feedback contracts while a hosted
  model demo and report repository remain fundamentally different from open weights, reusable data, and a reproducible training
  pipeline.
