recipe_metadata:
  base_model: Twenty evaluated language models.
  teacher: Task templates, forked-chain state, and task-specific validators.
  generator: Dynamically instantiate instructions, execute scripts on fork snapshots, and validate terminal state.
  filtering_rule: Score only scripts whose observed terminal state satisfies the task validator.
  sampling_protocol: '107 tasks: 62 atomic scenarios and 45 composite workflows, evaluated in five independent rounds.'
  rollout_count: 5
  temperature: null
  inference_budget: Fix fork blocks, RPC providers, contract addresses, wallet permissions, and random seeds.
  optimizer_or_scaffold: TypeScript runner with Anvil snapshot isolation and validator-based scoring.
audit:
  source_mixture: Official ACL paper and authors' public GitHub release.
  split: 62 atomic tasks and 45 composite tasks; evaluation dynamically samples task instances.
  decontamination: Dynamic sampling reduces fixed-answer matching but does not rule out learning task-template structure.
  license: Consult the official repository before reuse.
  lineage: https://github.com/OpenEdgeHQ/EVM-quest-bench
  known_failure_modes:
  - Forked test wallets do not represent mainnet MEV, slippage, RPC failures, or malicious contracts.
