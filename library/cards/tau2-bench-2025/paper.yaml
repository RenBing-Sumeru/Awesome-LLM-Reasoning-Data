one_line_summary: tau2-bench releases a dual-control telecom environment with 114 sampled tasks from 2,285 generated compositions,
  state/action-grounded rewards, and full success/failure evaluation trajectories, but exact reuse requires a paper-era version
  pin.
why_it_matters: It turns agent-user coordination into an auditable data object—task state, messages, both parties’ tool actions,
  observations, verifier components, reward, and termination—while showing why public environments still need version, rights,
  simulator, and contamination review before trajectories become post-training data.
