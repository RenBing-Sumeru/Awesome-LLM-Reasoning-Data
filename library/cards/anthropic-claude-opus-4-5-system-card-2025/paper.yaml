one_line_summary: Claude Opus 4.5's system card discloses broad source categories, RLHF/RLAIF, prior-model reasoning text
  in earlier supervised learning, no RL reward on reasoning-text content, selected reward-hacking safeguards, and concrete
  decontamination rules, but not auditable records, rewards, or environments.
why_it_matters: It is a particularly informative Track 12 ledger item because it separates disclosed frontier post-training
  and monitoring mechanisms from the missing record-level provenance, feedback contract, reward implementation, and reproducibility
  artifacts.
