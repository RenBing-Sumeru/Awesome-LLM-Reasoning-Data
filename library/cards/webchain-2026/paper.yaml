- 'needs_privacy: consent basis, redaction procedure, per-record decisions, audit sample, and estimated false-negative rate'
- 'needs_rights: per-domain Terms of Service, robots/access-policy, copyright, and redistribution-rights review'
- 'needs_replay: collection timestamps, browser/OS/viewport/locale/account metadata, archived page state, and drift diagnostics'
- 'needs_release: corrected Hugging Face namespace instructions, complete schema documentation, file checksums, and full-page
  screenshot coverage map'
