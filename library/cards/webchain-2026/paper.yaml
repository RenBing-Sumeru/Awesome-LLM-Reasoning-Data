one_line_summary: Releases 31,725 human-verified live-web trajectories with 317,993 visually, structurally, and action-aligned
  steps, plus separate grounding and planning recipes, under a gated academic license.
why_it_matters: For the open-release-recipe track, WebChain makes the training unit and three-stage construction pipeline
  concrete, but also shows why artifact completeness, success semantics, source rights, privacy evidence, and replay metadata
  must be audited independently of benchmark gains.
