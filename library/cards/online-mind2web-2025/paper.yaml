one_line_summary: Online-Mind2Web releases 300 mutable live-site tasks, evaluation code and task-level labels plus WebJudge-7B,
  but not a complete immutable corpus of all paper trajectories or the external website states needed for exact replay.
why_it_matters: It couples realistic browser episodes with human and judge feedback while exposing how screenshot selection,
  task replacement, web drift, execution failures, judge choice, and incomplete trajectory retention affect evaluation and
  reward-model reuse.
