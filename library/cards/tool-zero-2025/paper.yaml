  - Author resolution of the rollout-count and reported-score inconsistencies.
inclusion_reason: 'Tool Zero makes the feedback contract for pure-RL function-calling explicit: an offline Thought/Action/Observation-style
  tool-use completion receives a scheduled scalar reward that moves from partial token overlap to exact reference-AST verification,
  enabling direct GRPO from base models while exposing important label, release, and replay boundaries.'
