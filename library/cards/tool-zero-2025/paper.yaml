one_line_summary: Tool Zero applies pure GRPO to offline ToolACE/xLAM function-calling records and dynamically tightens each
  completion's scalar rule reward from exploratory token overlap to strict reference-AST correctness.
why_it_matters: It is a concrete example of how trajectory-shaped tool-use data can support RLVR without SFT, while showing
  that 'pure RL' still depends on reference calls and that unreleased processed data, reward code, checkpoints, benchmark
  pins, and reporting inconsistencies materially limit reuse.
