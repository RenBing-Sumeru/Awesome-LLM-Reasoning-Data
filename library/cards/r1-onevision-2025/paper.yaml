one_line_summary: R1-Onevision formalizes images for a language reasoner, filters the resulting multimodal CoT, and releases
  more than 155K demonstrations for visual reasoning SFT.
why_it_matters: It exposes a concrete image-to-description-to-reasoning record rather than treating multimodal reasoning supervision
  as an opaque final answer.
