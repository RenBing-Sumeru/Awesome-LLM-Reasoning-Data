data_object:
  prompt_source: Multimodal questions and images spanning science, mathematics, general scenes, and documents, charts, and
    screens.
  trace_author: DeepSeek-R1 writes step-by-step reasoning from a formalized visual description, while a role-playing strategy
    lets the multimodal pipeline revisit the image.
  answer_format: Image, question, formal visual description, multimodal chain-of-thought, and final answer in a conversation-style
    record.
  process_fields:
  - image and task question
  - dense caption and formal visual representation
  - generated chain-of-thought and final answer
  - GPT-4o quality-filter result
  - source domain
  environment_or_substrate: Static image-question records; deterministic tasks also support rule-based final-answer checks
    during RL.
  verifier_or_reward: GPT-4o removes inaccurate, irrelevant, or inconsistent generated steps; RL uses answer accuracy and
    required think-tag format rewards.
  terminal_predicate: Retain a generated demonstration after quality filtering; during RL, reward final-answer correctness
    and correctly ordered reasoning tags.
recipe_metadata:
  base_model: Qwen2.5-VL-7B and Qwen2.5-VL-3B.
  teacher: DeepSeek-R1 for textual reasoning and GPT-4o for visual description and quality filtering.
  generator: Formalize the image, generate a textual reasoning chain, revisit the image through role-playing, then filter
    the completed trace.
  filtering_rule: GPT-4o removes inaccurate, irrelevant, or internally inconsistent CoT steps; exact thresholds are not disclosed.
  sampling_protocol: Assemble more than 155K demonstrations across science, mathematics, general scenes, and document/chart/screen
    tasks.
  rollout_count: null
  temperature: null
  inference_budget: Generation and filtering call counts and compute are not disclosed.
  optimizer_or_scaffold: One-epoch SFT with batch size 128 and learning rate 1e-5, followed by GRPO on a 10K CLEVR subset.
audit:
  source_mixture: More than 155K records from science, math, general, and document/chart/screen domains; exact per-source
    licenses and proportions are not fully disclosed.
  split: The paper reports the 155K training collection and a separate 942-question R1-Onevision-Bench; exact training split
    counts are not disclosed.
  decontamination: No corpus-level overlap or source-level decontamination procedure is reported for the 155K release.
  license: The official repository contains a top-level LICENSE file and public dataset access is governed by the Hugging
    Face platform terms, but a dataset-specific content license was not confirmed; platform access does not by itself establish
    redistribution rights.
  lineage: Images are converted to formal descriptions, expanded into reasoning traces, grounded again through role-playing,
    and filtered before SFT.
  known_failure_modes:
  - An incomplete or incorrect formal visual description can steer the language reasoner toward a coherent but visually unsupported
    trace.
  - GPT-4o filtering is a judgment contract whose false-positive rate and prompt sensitivity are not reported.
  - SFT and RL gains are combined in the final model, so final scores do not isolate every data-construction choice.
  citation_status: verified
  confidence: high
  notes: arXiv v2 HTML, official GitHub tree, official dataset and benchmark URLs, author affiliations, 155K scale, construction
    stages, and main ablations were checked on 2026-07-13. No peer-reviewed venue was confirmed.
inclusion_reason: Releases 155K image-question-reasoning-answer demonstrations whose teacher, visual formalization, quality
  filter, and SFT consumer are explicit.
