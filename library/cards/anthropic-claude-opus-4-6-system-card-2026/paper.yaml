one_line_summary: Claude Opus 4.6's system card partially discloses source categories, RLHF/RLAIF, prior-model reasoning-transcript
  initialization, a <0.01% reasoning workspace-reward error, and detailed safety/audit practice, but not the underlying data,
  reward, or reproducibility artifacts.
why_it_matters: It is a high-value Track 12 disclosure ledger item because it clearly separates a rare, source-specific implementation
  disclosure from the much larger body of unavailable records, reward specifications, and audit artifacts—and marks where
  the report merely refers to earlier 4.5 methods.
