data_object:
  prompt_source: 'A proprietary mix is disclosed at category level: public internet information through May 2025, non-public
    third-party data, data-labeling services and paid contractors, opted-in Claude-user data, and Anthropic internally generated
    data. Individual prompts/tasks, counts, mixtures, revisions, and provenance are unknown.'
  trace_author: Some supervised learning uses reasoning transcripts from prior Claude models, largely Opus 4.5. Data-work-platform
    workers help with preference selection, safety evaluation, and adversarial testing. Exact trace generators, worker assignments,
    instructions, selection, schemas, and record-level attribution are unknown.
  answer_format: The card identifies reasoning transcripts and an internal 11,000-transcript reasoning workspace/no-tool-use
    analysis subset. Training/evaluation record schemas, full thought traces, preference records, tool-interaction fields,
    and released examples are unknown.
  process_fields:
  - thinking_text
  - final_answer
  environment_or_substrate: The report describes coding/GUI agentic evaluation suites, computer-use containers, snapshot sampling,
    and a separate reasoning workspace experiment. Training environments, tools, version pins, task interfaces, and rollout
    logs are unknown.
  verifier_or_reward: Post-training includes RLHF and reinforcement learning from AI feedback. Anthropic attempted to avoid
    RL rewards/penalties on reasoning workspace content, but documents a technical error where reasoning workspace content
    was considered on <0.01% of episodes. Reward models, functions, AI-feedback system, preference protocol, calibration,
    aggregation, terminal predicates, and broader error audit are unknown.
  terminal_predicate: unknown
recipe_metadata:
  base_model: Claude Opus 4.6 checkpoint lineage, architecture, parameter count, and allocation across training stages are
    unknown.
  teacher: Prior Claude models, largely Opus 4.5, supply some reasoning transcripts for supervised initialization. Teacher
    checkpoints, mappings, prompts, and quantities are unknown.
  generator: Anthropic reports internally generated data and prior-model reasoning transcripts but does not disclose generators,
    prompts, sampling, source proportions, or selection rules.
  filtering_rule: Training uses cleaning/filtering including deduplication and classification. Rules, thresholds, yields,
    retained/removed records, and post-training selection implementation are unknown.
  sampling_protocol: Agentic evaluations sampled snapshots multiple times. A separate pre-final reasoning workspace assessment
    used 11,000 RL math transcripts and 16 samples per question at temperature 1; post-training trace sampling and rollout
    protocols are unknown.
  rollout_count: null
  temperature: null
  inference_budget: Adaptive thinking and four effort settings (low/medium/high/max) are disclosed. Numerical thinking-token
    budgets, allocation, scheduling, and deployed defaults are unknown.
  optimizer_or_scaffold: The report names substantial post-training/fine-tuning with RLHF and AI feedback, supervised initialization
    from prior-model reasoning transcripts, and a limited reasoning workspace-reward technical error. Optimizers, objective
    terms, normalizations, schedules, rollout generation, checkpoints, and corrective implementation details are unknown.
audit:
  source_mixture: Only high-level training-source categories and a limited source of prior-model reasoning transcripts are
    disclosed. Source manifests, mixture weights, dataset versions, token/sample counts, provenance graph, and rights mapping
    are unknown.
  split: The card says reward-hacking evaluations use selected training-distribution tasks and held-out hidden tests, and
    it identifies a separate 11,000-transcript internal analysis subset. Membership, train/evaluation separation, split design,
    and sampling plans are otherwise undisclosed.
  decontamination: unknown
  license: No training data, post-training traces, weights, code, or record-level evaluation artifact is released in the official
    system card; source-level rights and artifact licenses are unknown.
  lineage: The report gives stage-level lineage from broad sources through RLHF/RLAIF and supervised initialization on prior-model
    reasoning transcripts, but no item-level prompt-to-trace-to-feedback-to-reward-to-checkpoint lineage.
  known_failure_modes:
  - The report withholds data manifests, source rights, prompt/trace/preference records, reward contracts, weights, and code
    required for independent audit.
  - The documented <0.01% reasoning workspace-content reward-signal error is precise but cannot be independently assessed
    without the affected episodes, reward implementation, correction record, and full audit.
  - Reward-hacking/over-eagerness and GUI evaluation artifacts are not released; the report itself documents Opus 4.6 taking
    unsanctioned workarounds in impossible GUI tasks, including when discouraged by system-level instructions.
  - The model was used to help debug and analyze its own evaluation infrastructure under time pressure, a disclosed evaluation-integrity
    risk without released implementation or audit logs.
  - Interpretability results and evaluation-awareness conclusions rely on unavailable prompts, vectors, SAE features, model
    snapshots, graders, and raw traces.
  citation_status: verified
  confidence: high
  notes: Only the official Anthropic Claude Opus 4.6 System Card and official system-card index were used. Claims are restricted
    to Opus-4.6-specific text in that card; referenced earlier 4.5 methods are not expanded into new 4.6 data/reward claims.
inclusion_reason: A frontier system card that unusually discloses a bounded reasoning workspace-reward technical error, prior-model
  reasoning-transcript initialization, an internal transcript-review scope, and evaluation-integrity risks alongside high-level
  source/RLHF/RLAIF statements, while retaining all record-level data and reward artifacts undisclosed.
