data_object:
  prompt_source: About 350K internally developed blocked-topic examples are constructed by collecting/filtering query keywords
    and converting them into questions, then translating questions into multiple languages. A separate 110K safety/non-compliance
    component comes from Tulu3 SFT (CoCoNot, WildJailbreak, and WildGuardMix). Exact prompts, selected record IDs, language
    allocation, and source provenance are unknown.
  trace_author: For the ~350K component, answers and respective Chain of Thought are bootstrapped with DeepSeek R1 and internal
    models. Internal model identities, versions, prompt templates, selection, editing, and record-level generator mapping
    are unknown.
  answer_format: Question, bootstrapped answer, and respective CoT are disclosed at a high level. The exact record schema,
    whether all records include CoT, safety-label fields, and publicly inspectable examples are unknown.
  process_fields:
  - query_keyword
  - question
  - answer
  - chain_of_thought
  environment_or_substrate: unknown
  verifier_or_reward: No post-training reward model, verifier, preference-pair construction, RL stage, reward aggregation,
    calibration, or outcome predicate is disclosed.
  terminal_predicate: unknown
recipe_metadata:
  base_model: DeepSeek-R1 (671B), as stated in the official Microsoft model card.
  teacher: DeepSeek R1 and unspecified internal models bootstrap answers and CoT for the ~350K blocked-topic component.
  generator: Keyword collection/filtering, question expansion, multilingual translation, and answer/CoT bootstrapping are
    disclosed. Generator models and implementation details for each operation are unknown except for DeepSeek R1 and unnamed
    internal models used for bootstrapping.
  filtering_rule: Microsoft reports collecting and filtering query keywords before question expansion. Criteria, thresholds,
    human review, deduplication, yields, and safety-selection process are unknown.
  sampling_protocol: unknown
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: Microsoft describes the model as post-trained/fine-tuned for responsiveness and harm protection.
    Objective, loss, optimizer, schedule, batch size, RL use, and checkpoint selection are unknown.
audit:
  source_mixture: Official Microsoft sources disclose about 350K internally developed multilingual examples plus 110K Tulu3
    safety/non-compliance examples. The data summary says publicly available datasets were used and synthetic AI-generated
    data was used, but it does not provide source weights, manifests, exact record IDs, or a complete provenance map.
  split: unknown
  decontamination: unknown
  license: The released MAI-DS-R1 model card lists an MIT model licence. Microsoft does not publish a complete training-data
    licence/provenance or redistribution mapping; the data summary supplies general legal-compliance statements only.
  lineage: 'Report-level lineage is disclosed: DeepSeek-R1 base model; keyword-derived multilingual questions; DeepSeek R1/internal-model
    bootstrapped answers and CoT; plus selected Tulu3 safety/non-compliance examples. Item-level lineage, internal-teacher
    versions, transformations, and checkpoint mapping are unknown.'
  known_failure_modes:
  - The release does not expose the 350K records, bootstrapped CoT, internal-teacher identities, filtering criteria, or any
    train/dev/test split, preventing independent data or trace provenance audit.
  - No training reward/verifier, preference, RL, calibration, or rollout details are disclosed; safety/responsiveness evaluation
    metrics cannot establish a reusable feedback contract.
  - Microsoft warns that MAI-DS-R1 can retain biases from training data and DeepSeek-R1, hallucinate, remain vulnerable to
    adversarial prompts, or generate unsafe/biased/harmful content in some conditions.
  - The published rights statements do not provide source-level licence, consent, provenance, or opt-out information for internally
    developed multilingual material.
  citation_status: verified
  confidence: high
  notes: Evidence is limited to Microsoft's official Azure AI Foundry Blog release and official `microsoft` Hugging Face model/data-summary
    card. The record treats only explicitly disclosed construction facts as known; it does not infer a reward, verifier, split,
    data release, or teacher detail.
inclusion_reason: A Microsoft open-weight frontier post-training report that discloses a concrete 350K keyword-to-multilingual-question-to-bootstrapped-CoT
  construction path and a 110K named safety-data addition, while making the missing provenance and feedback-contract details
  auditable.
