status: partial
one_line_summary: GURU filters about 684.9K public and synthetic candidates into 91,909 training rows spanning mathematics,
  code, science, logic, simulation, and tables, with rule, execution, or model-based rewards.
why_it_matters: It exposes a comparatively complete cross-domain RL data contract while leaving material uncertainty around
  semantic contamination, verifier error, mixed-license lineage, rejected candidates, and absent policy rollouts.
