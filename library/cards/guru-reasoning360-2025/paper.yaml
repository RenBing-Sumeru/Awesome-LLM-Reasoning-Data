data_object:
  prompt_source: GURU combines OR1, DAPO, and DeepScaler mathematics prompts; LeetCode, TACO-Verified, PrimeIntellect, and
    historical LiveCodeBench code tasks; WebInstruct-Verified science questions; ARC-AGI, BARC, and three synthesized logic
    families; Code I/O/PyEdu simulation tasks; and HiTab and MultiHierTT table questions.
  trace_author: The release contains prompts, verifier payloads, and some upstream or reference completion/response fields.
    It is not an archive of the on-policy responses sampled during the reported GRPO runs; those policy rollouts are unknown.
  answer_format: The pinned Parquet release stores message-list prompts plus task-specific references and verifier inputs.
    Expected outputs include boxed or tagged answers, JSON, executable Python, and open-ended science responses.
  process_fields:
  - task_id
  - prompt
  - completion
  - entry_point
  - test
  - query
  - response
  - input_output
  - meta
  - data_source
  - ability
  - apply_chat_template
  - reward_model
  - extra_info
  - is_unique
  - qwen2.5_7b_pass_rate
  - qwen3_30b_pass_rate
  environment_or_substrate: Offline multi-domain RLVR in veRL. Code candidates are checked by Python execution in a sandbox;
    the current repository documents SandboxFusion integration, while rule matchers and a served model verifier handle the
    other domains.
  verifier_or_reward: Every training response receives a binary domain-routed reward. Mathematics, logic, simulation, and
    tables use extraction plus rule or symbolic matching; code requires all retained tests to pass; science uses a 1.5B general
    verifier to judge entailment of the reference answer.
  terminal_predicate: A sampled answer succeeds when its routed checker returns correct through normalized answer match, successful
    test execution, or positive science-entailment judgment.
recipe_metadata:
  base_model: Qwen2.5-7B-Base and Qwen2.5-32B-Base for the reported GURU-7B and GURU-32B runs.
  teacher: Qwen2.5-7B-Instruct and Qwen3-30B-A8B estimate difficulty; TIGER-Lab/general-verifier, a 1.5B model, judges open-ended
    science responses. Generators inside all upstream datasets are not uniformly disclosed.
  generator: The Qwen2.5 base policies sample responses on-policy during GRPO. The released training corpus preserves prompts,
    references, and reward inputs but not those sampled policy responses or rejected rollouts.
  filtering_rule: A shorter question is removed when it is a strict substring of another. Domain heuristics remove overlong,
    malformed, weakly verified, or trivial tasks. Difficulty filtering excludes weak-model pass rate at least 15/16, strong-model
    pass rate zero, and weak pass rate above strong pass rate, with additional mathematics and science gap thresholds.
  sampling_protocol: Difficulty estimation uses 16 trials per candidate from each screening model. RL samples 16 responses
    per prompt. Seeds and the order of candidates through all filtering stages are unknown.
  rollout_count: 16
  temperature: 1.0
  inference_budget: Training permits up to 4K prompt tokens and 8K generated tokens. Each RL step uses 512 prompts and 16
    responses per prompt, with mini-batches of 64. Evaluation uses temperature 0.6 and top-p 0.95.
  optimizer_or_scaffold: veRL GRPO with AdamW, a 10-step linear warmup, and two epochs. GURU-7B uses four eight-GPU nodes;
    GURU-32B uses sixteen eight-GPU nodes; each reported run lasts about 2.5 days.
audit:
  source_mixture: The pinned Hugging Face revision exposes 91,909 training rows. Paper-rounded domain counts are 54.4K mathematics,
    18.1K code, 3.6K science, 6.3K logic, 3.7K simulation, and 6.1K tabular records, retained from about 684.9K raw candidates.
  split: Dataset Viewer exposes one default train split with 91,909 rows and 17 columns. The Hub repository also stores online
    and offline evaluation Parquets, but the default builder does not expose them as additional splits.
  decontamination: Within-corpus strict-substring deduplication is reported; systematic semantic or exact overlap checks against
    all 17 paper evaluation tasks are unknown.
  license: The dataset repository is labeled MIT and the code repository is Apache-2.0. The paper names upstream MIT, Apache-2.0,
    CC BY 4.0, and CC BY-SA assets. Record-level compatibility of the aggregate label is not established.
  lineage: Public or synthesized tasks are normalized into domain prompts and reward inputs, substring-deduplicated, filtered
    with domain rules, scored in 16 trials by weak and strong models, and difficulty-filtered. Rows retain data_source and
    extra_info metadata, but a complete row-level source URL, license, and transformation manifest is unknown.
  known_failure_modes:
  - Strict-substring deduplication misses paraphrases, translations, templated variants, and semantic benchmark overlap.
  - Exact or symbolic matching can reject equivalent answers and does not verify intermediate reasoning.
  - Code checking uses at most eight selected tests per sample, so incorrect programs can receive reward.
  - The 1.5B science verifier can make false-positive or false-negative entailment judgments; calibration statistics are unknown.
  - Difficulty filtering can discard genuinely hard tasks when the strong model fails all trials and inherits both screening
    models' capability and memorization biases.
  - A Dataset Viewer spot-check showed mojibake in a LeetCode example; prevalence and effect across the corpus are unknown.
  - English-centric, STEM-heavy coverage limits language and discipline representativeness.
  - Mixed upstream licenses and absent row-level license fields make redistribution obligations difficult to audit.
  - Rejected candidates, stage-specific rejection reasons, on-policy rollouts, failed verifier traces, and reward distributions
    are not released.
  citation_status: verified
  confidence: high
  notes: Official NeurIPS paper and supplement, project site, pinned Hugging Face revision 2e2790a962a3c099bfb5ea61389cbf98a5ea439b,
    model repositories, and Reasoning360 main revision 13158341d2a0dfe5f3bb80e7126ff21de0d16676 were checked on 2026-07-21.
    The code main branch postdates the paper and has no release tag, so exact paper-run code identity remains unknown.
inclusion_reason: GURU is central to the open-release track because it joins a six-domain training mixture to explicit rule,
  execution, and model-verifier contracts, filtering thresholds, training code, checkpoints, and evaluation tooling.
