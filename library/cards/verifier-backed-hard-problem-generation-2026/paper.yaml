data_object:
  prompt_source: Textbook integral seeds and competition-math/MATH seeds without item-level manifests.
  trace_author: Qwen3-4B Setter writes problem-reference pairs; Qwen3-4B Solver estimates difficulty.
  answer_format: Seed, generated problem/solution, verifier decision, Solver rollouts/accuracy, gated hardness reward and
    disposition.
  process_fields:
  - seed
  - problem
  - reference
  - verifier_bit
  - solver_rollouts
  - accuracy
  - reward
  - filter_state
  - split
  environment_or_substrate: SymPy derivative checker for integrals or rule filters plus GPT-5.4 judge for general math.
  verifier_or_reward: Setter reward is verifier acceptance times one minus Solver accuracy.
  terminal_predicate: Rejected pairs get zero reward and do not train the Solver; accepted filtered pairs enter pools.
recipe_metadata:
  base_model: Qwen3-4B-Base
  teacher: Unnamed frontier model for 400 integral cold-SFT items; GPT-5.4 is the soft judge.
  generator: Cold SFT then GRPO-style Setter/Solver training.
  filtering_rule: Parsing, derivative equality or structural filters plus all-true GPT-5.4 rubric, then difficulty and deduplication.
  sampling_protocol: Eight Setter/Solver rollouts; ten local-difficulty samples; temperatures vary by stage.
  rollout_count: 8
  temperature: 1.0
  inference_budget: Responses up to 8,192 tokens; a full round takes about 60 hours on eight unspecified GPUs.
  optimizer_or_scaffold: Setter SFT then Setter/Solver GRPO-style RL at LR 2e-6.
audit:
