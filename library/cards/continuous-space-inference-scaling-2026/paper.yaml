one_line_summary: This paper shows that latent reasoning has unused Pass@N potential but weak reward-model separability, then
  tests geometric regularization to improve its test-time scaling.
why_it_matters: It establishes that standard verifier recipes cannot simply be assumed to transfer from text traces to continuous
  thoughts, a key boundary for generalizing test-time scaling.
