data_object:
  prompt_source: GSM8K prompts; Math-Shepherd is adapted for automatic step supervision.
  trace_author: COCONUT generates latent continuous reasoning trajectories with dropout-based sampling.
  answer_format: Prompt, latent-thought trajectory, generated answer, trajectory correctness, PRM/ORM score, geometric metrics,
    and reranking decision.
  process_fields:
  - prompt
  - latent_trajectory
  - answer
  - correctness
  - process_reward
  - outcome_reward
  - geometry
  - rerank_score
  environment_or_substrate: Continuous-space COCONUT reasoning model with dropout sampling and reward-model reranking.
  verifier_or_reward: PRM hard/soft estimation and ORM trained from automatically annotated trajectories; post-training uses
    answer-verifiable rollouts and geometric regularization.
  terminal_predicate: GSM8K ground-truth answer matching.
recipe_metadata:
  base_model: COCONUT continuous-space reasoning model.
  teacher: Not applicable; answer labels and automatic Monte-Carlo-style step annotations provide supervision.
  generator: Dropout-based sampling produces diverse latent reasoning trajectories.
  filtering_rule: Generated trajectories are deduplicated by final answer for training-data construction; reward models rerank
    un-deduplicated evaluation candidates.
  sampling_protocol: Evaluate Best-of-N at N=1, 2, 4, 8, 16, and 32; compare confidence, self-consistency, PRM, and ORM reranking.
  rollout_count: Five paths per prompt for reward-model training and ten completions for Monte Carlo step annotation; evaluation
    uses up to 32 candidates.
  temperature: See official code and paper for decoding configuration.
  inference_budget: Sampling budget N from 1 to 32.
  optimizer_or_scaffold: PRM/ORM reranking plus an answer-verified geometric regularization post-training intervention.
audit:
