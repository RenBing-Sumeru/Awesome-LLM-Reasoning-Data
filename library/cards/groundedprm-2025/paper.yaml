one_line_summary: GroundedPRM converts MATH MCTS trajectories into about 40K generative step-supervision records by combining
  Wolfram Alpha checks with final-answer outcomes, but releases no author-confirmed tree, data, code, model, or run manifest.
why_it_matters: It is a concrete example of turning local tool checks and global search outcomes into process-reward data,
  while exposing how verifier coverage, hybrid-credit parameters, filtered failures, and candidate budgets condition the resulting
  labels.
