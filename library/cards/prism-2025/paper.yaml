status: verified
one_line_summary: PRISM releases multimodal DPO pairs derived from four-stage MCTS reasoning paths selected with UCB and safety/helpfulness
  feedback, while releasing code and test-time search tooling but not the full search trees or node values.
why_it_matters: 'It makes the path from VLM search to pairwise safety alignment concrete: candidate traces are generated at
  several reasoning stages, selection depends on stage-sensitive rewards, and DPO consumes only the selected/rejected outputs.
  The missing trees, scores, visits, and source mappings show why a pairwise release is not a complete rollout-trace release.'
