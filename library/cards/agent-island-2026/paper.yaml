data_object:
  object_type: A frozen evaluation corpus of complete multiagent social-strategy game episodes plus a continuously updated
    live benchmark over the same game/log schema.
  prompt_source: A fixed Agent Island rules prompt configures seven-player games. The first five rounds contain private sidebars,
    public pitches, private elimination votes and rationales, elimination, and memory consolidation; round six contains finalist
    pitches and votes from the five eliminated players.
  trace_author: Seven randomly selected evaluated language-model agents jointly generate each episode. Raw logs map anonymized
    player labels to model identifiers and preserve provider-exposed reasoning where available.
  answer_format: One JSON file per game with top-level game configuration/status, player records, aggregate parser/usage statistics,
    and a six-round history ending in a selected winner.
  process_fields:
  - game.id
  - game.timestamp
  - game.num_players
  - game.num_rounds
  - game.phases
  - game.round_phase_overrides
  - game.round_type_overrides
  - game.phase_config
  - game.rules_prompt
  - game.status
  - game.error
  - players.<player_id>.player_id
  - players.<player_id>.character_prompt
  - players.<player_id>.model
  - players.<player_id>.client_kwargs
  - players.<player_id>.memory_strategy
  - players.<player_id>.player_type
  - stats.choice_parse_failures
  - stats.reasoning_extraction_failures
  - stats.responses
  - stats.cost
  - stats.usage
  - history.<round>.round_index
  - history.<round>.final_round
  - history.<round>.active_player_ids
  - history.<round>.eliminated_player_ids
  - history.<round>.vote_tally
  - history.<round>.selected_player
  - history.<round>.events
  - event.heading
  - event.role
  - event.prompt
  - event.content
  - event.visibility
  - event.active_visibility
  - event.reasoning
  - event.metadata
  - event.timestamp
  observation: Each agent receives a visibility-filtered history containing narrator events, sidebar messages, public pitches,
    vote prompts/results, elimination notifications, and its consolidated memory context. The released event object records
    visibility rather than only a flattened public transcript.
  action_space:
  - select a sidebar partner
  - send alternating private sidebar messages
  - make a public advancement or finalist pitch
  - submit a private elimination or winner vote
  - supply a vote rationale
  - consolidate memory
  environment_or_substrate: Agent Island's configurable Python game engine, closed model APIs accessed through OpenRouter,
    random player/order/tie draws seeded from the game ID, and a public GCS log/ranking surface.
  verifier_or_reward: A parser extracts sidebar choices and votes; the environment tallies votes, breaks ties uniformly at
    random, eliminates one player per early round, and names one final winner. A Bayesian Plackett-Luce model consumes each
    player set and winner to estimate posterior skills and uncertainty. Intermediate claims, persuasion quality, and reasoning
    correctness are not independently verified.
  terminal_predicate: After five eliminations, the two remaining players pitch and the five eliminated players vote; the finalist
    with the most parsed votes wins, with a uniform random tie break. Replication keeps only games whose status is completed
    and whose final round has a parsed selected player.
  provenance: Rules/config and seven sampled model IDs -> private/public model interactions and parser outputs -> five eliminations
    -> final jury vote and winner -> structured JSON log -> frozen 999-ID paper manifest or later live bucket -> Plackett-Luce
    ranking and behavioral vote analysis.
recipe_metadata:
  base_model: 'There is no single base model: the frozen paper dataset contains 49 evaluated model identifiers, and each game
    samples seven distinct models without replacement; exact provider checkpoint revisions are unknown.'
  teacher: unknown
  generator: The evaluated language models are both subjects and episode generators; other agents' adaptive messages and votes
    form the changing environment.
  prompt_task_source: One low-stakes, Survivor-inspired social-strategy rules prompt rather than a static task bank. The exact
    rules prompt is serialized in each inspected log.
  filtering_rule: For the paper analysis, keep completed games with a parsed final winner. For same-provider preference, keep
    final-round votes from games whose two finalists are from different providers and require parsed vote metadata.
  sampling_protocol: Seven models are drawn without replacement per game; the same provider may appear multiple times, but
    the same model cannot. Some low-performing, unreliable, or costly models were removed from the active pool over time,
    while their prior games remain in the dataset.
  rollout_count: 'Frozen paper manifest: 999 completed games. Live benchmark observed 2026-07-20: 1,270 games in the current
    ranking source; this live count is not a paper result.'
  temperature: unknown
  inference_budget: Per-event and aggregate token/cost fields are present in logs, but decoding budgets, complete provider
    settings, total generation compute, worker type, memory, and wall-clock time are not disclosed.
  optimizer_or_scaffold: Bayesian Plackett-Luce Gibbs sampling uses Gamma(1,1) priors, 2,000 iterations, 500 burn-in iterations,
    and seed 42. No policy optimizer or training scaffold is used.
audit:
  source_mixture: Synthetic interactions among 49 model identifiers in the frozen paper set, with model participation frequencies
    affected by model availability, provider reliability, performance-based disabling, and compute cost.
  split: No train/dev/test split is defined. Reproduction uses a frozen 999-game evaluation manifest; the live bucket is a
    growing continuation and must not be substituted for the paper set.
  decontamination: unknown
  benchmark_overlap: Agent Island avoids a reusable static item bank by matching adaptive agents, but the fixed public rules
    prompt, public engine, model APIs, and published logs remain visible. No model-pretraining or post-training overlap audit
    is reported.
  license: The arXiv paper and frozen game-log dataset metadata declare CC BY 4.0. The official game-engine repository is
    MIT at the pinned commit. The downloadable anonymous replication ZIP contains no license file and explicitly says the
    identifying repository license was excluded, so replication-code reuse terms are unknown.
  lineage: Agent Island config/engine and model APIs -> seven-agent episode -> parser metadata/vote tallies -> completed winner-bearing
    JSON -> 999-game manifest SHA-256 73ee6cc97ada604830e933131b19ed81839049b19dfcc1a3c970a72dfce862ad -> Plackett-Luce posterior
    and same-provider analysis. Exact engine commit and model snapshots are not bound per log.
  release_version: 'Paper: arXiv v1 (2026-05-05). Frozen dataset: version 1.0.0; manifest object generation 1778013927385888
    and SHA-256 73ee6cc97ada604830e933131b19ed81839049b19dfcc1a3c970a72dfce862ad. Replication ZIP: GCS generation 1778013803303358
    and SHA-256 5b2c7c5262a46c65b51b659b9c3c0b4edb7eb8cf443cb6d2a4489d2d673e8b2d. Engine: commit e0fa0ee3944f61c97f3d1e64bae8bbd0e9901742
    with no tag/release. Live ranking source: mutable, timestamped 2026-07-02 15:26:25.976235+00:00 when audited.'
