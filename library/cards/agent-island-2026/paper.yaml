  successful_and_failed_sample_retention: The paper set retains 999 completed games with parsed final winners. Croissant metadata
    says incomplete games, games without final selected players, and unparsed votes needed for vote analysis are excluded.
    Counts, IDs, logs, and reasons for all excluded/failed attempts are unknown.
  privacy_or_consent: Croissant metadata describes synthetic model-model interactions with no intentional human-subject or
    personal-sensitive-data collection. Provider terms and any incidental model-generated sensitive content were not independently
    audited.
  live_snapshot: On 2026-07-20, direct retrieval of rankings/latest.json returned num_games=1270 and 62 ranking rows; the
    official site code displays only games_played>=10, yielding 59 displayed models. The GCS log prefix contained exactly
    1,270 downloadable JSON objects totaling 4,708,720,924 bytes. Earlier 1,030-game/48-model states are historical live snapshots,
    not the current source and not paper results.
  known_failure_modes:
  - The Plackett-Luce model has no matchup effects, although the paper's same-provider analysis shows that opponent/provider
    composition changes final votes.
  - Vote and sidebar choices depend on parser extraction; parser failures can remove votes from analyses or block a game from
    the frozen paper set.
  - Uniform random tie breaks inject outcome variance that the winner-only model does not separately attribute.
  - Only the per-game winner enters skill estimation; persuasive intermediate behavior, deceptive claims, rationales, and
    near-wins are not directly scored.
  - The low-stakes game gives models no explicit reward and may not predict behavior in higher-stakes or real-world interactions.
  - The benchmark can still saturate if frontier models asymptote and repeatedly trade wins.
  - Models were disabled over time for performance, reliability, or cost, creating a changing and nonuniform matchup schedule.
  - Live ranks, normalization, model pool, and log count drift; citing the website without a retrieval date can silently change
    the evaluated object.
  - The frozen manifest does not bind exact engine commit, dependency environment, OpenRouter/provider settings, or immutable
    model snapshots to every log.
  - The replication ZIP reproduces analyses but has no included license and does not generate games; the engine repository
    has no release tag linked to the paper dataset.
  - Excluded failed/incomplete games and unparsed attempts are not exposed as an auditable rejection ledger.
  citation_status: verified
  confidence: high
  notes: The full arXiv v1 paper/source and appendices, project site and current client bundle, GCS paper dataset/index/manifest/Croissant
    metadata/replication ZIP/live rankings/log inventory, a frozen raw log, and the official engine repository/commit/license/tag/release
    state were inspected. Paper analyses and 1,270 full logs were not independently rerun or exhaustively decoded.
  remaining_unknowns:
  - Exact model checkpoint/API revisions, decoding settings, and provider-side behavior for each frozen game.
  - Exact game-engine commit, dependency lock, and runtime environment used for every paper log.
  - Total simulation compute, worker configuration, memory, wall-clock time, and generation retry budget.
  - Complete ledger of incomplete/failed games, parsing failures, dropped votes, and retention reasons.
  - License for the anonymous replication-code ZIP.
  - Any explicit decontamination or model-training-overlap audit beyond use of adaptive opponents.
inclusion_reason: Agent Island exposes a concrete, downloadable full-episode multiagent data object whose feedback is produced
  by adaptive agent votes, deterministic environmental aggregation, and Bayesian winner ranking; its frozen/live split also
  makes version drift, parser selection, and matchup effects first-class audit concerns.
