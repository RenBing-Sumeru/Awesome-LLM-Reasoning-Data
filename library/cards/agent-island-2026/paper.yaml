one_line_summary: Agent Island releases a frozen CC BY 4.0 manifest of 999 seven-agent social-strategy episodes and ranks
  winner outcomes with Bayesian Plackett-Luce, while its separate live leaderboard continues to drift.
why_it_matters: It turns persuasion, alliances, elimination votes, rationales, parser outputs, and final jury decisions into
  an auditable full-episode benchmark object, but also demonstrates why live counts, matchup effects, generator versions,
  discarded runs, and training/evaluation boundaries must remain explicit.
