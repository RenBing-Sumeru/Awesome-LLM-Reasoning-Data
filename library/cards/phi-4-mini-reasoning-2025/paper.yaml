one_line_summary: Phi-4-Mini-Reasoning documents a four-stage math-reasoning pipeline over about 10M rollouts, with correct-trace
  distillation, rejected-rollout DPO, and final-answer RLVR, but releases weights rather than the training data or verifier
  stack.
why_it_matters: It enables a stage-by-stage disclosure audit of data objects and feedback contracts for a 3.8B reasoning model,
  including a visible mismatch between the paper and later model-card descriptions of trajectory provenance.
