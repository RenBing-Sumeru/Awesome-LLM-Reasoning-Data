one_line_summary: Zebra-CoT serializes both textual thoughts and intermediate images so a model can learn to generate visual
  aids during multi-step reasoning.
why_it_matters: Text-only CoT cannot demonstrate sketching, visual search, or intermediate spatial transformations, and off-the-shelf
  VLMs are too weak to bootstrap such traces reliably.
