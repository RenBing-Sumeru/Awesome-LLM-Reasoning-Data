one_line_summary: ScienceBoard evaluates computer-use agents on 169 human-curated scientific workflows across six domains
  using a released Ubuntu VM, task-specific internal-state evaluators, and partially documented trajectory archives.
why_it_matters: It exposes professional scientific applications through GUI and CLI while validating workflow I/O and application-internal
  state, making verifier design and environment reproducibility central audit objects.
