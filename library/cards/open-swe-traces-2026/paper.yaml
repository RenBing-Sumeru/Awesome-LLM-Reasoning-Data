one_line_summary: Releases 207,489 multilingual software-agent episodes from 20,000 SWE-rebench-V2 pull-request tasks across
  two teachers and two harness families, retaining solved, unresolved, and unavailable outcomes.
why_it_matters: It makes large-scale SWE-agent distillation inspectable at episode level and provides direct evidence about
  the value and risks of training on non-success trajectories.
