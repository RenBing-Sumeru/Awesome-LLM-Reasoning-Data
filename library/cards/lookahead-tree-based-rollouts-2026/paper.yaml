one_line_summary: LATR generates diverse on-policy RLVR rollout groups by probability-gated branching, lookahead simulation,
  and similarity pruning, while its public data release contains processed Countdown and math prompt/reward rows rather than
  the raw rollout trees.
why_it_matters: It isolates rollout diversity as a training-data construction variable and reports faster, stronger GRPO/DAPO
  learning, but also shows why raw branch lineage, verifier decisions, paper-matching configurations, and release licenses
  are necessary to audit search-generated reasoning data.
