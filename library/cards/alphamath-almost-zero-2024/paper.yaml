one_line_summary: AlphaMath converts answer-labeled GSM8K and MATH prompts into selected positive and negative MCTS paths
  with backed-up step-value targets.
why_it_matters: It makes search configuration, terminal checking, failed-path retention, and value backup explicit parts of
  a process-supervision data recipe while exposing the limits of those constructed labels.
