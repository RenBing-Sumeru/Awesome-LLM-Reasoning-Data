one_line_summary: Generates an evolving online stream of multi-turn reasoning and action trajectories through shared-policy
  self-play in rule-scored zero-sum games.
why_it_matters: It turns game rules, transitions, and terminal outcomes into a post-training data construction loop while
  exposing the difference between an open recipe and a frozen, auditable rollout release.
