one_line_summary: MC-Search benchmarks multimodal agents on verified multi-hop image–text evidence chains and turns those
  chains into process supervision for better retrieval planning.
why_it_matters: It makes retrieval modality, supporting evidence, and intermediate answers explicit at every hop rather than
  supervising only final QA.
