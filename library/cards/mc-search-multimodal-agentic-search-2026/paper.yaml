data_object:
  prompt_source: Real-world image and textual evidence in an offline knowledge base.
  trace_author: Curated multi-hop agentic search chains verified by HAVE.
  answer_format: Question, image titles/images/IDs, answer, graph topology, and a chain of subquestions with evidence and
    intermediate answers.
  process_fields:
  - graph_type
  - subqa_chain
  - retrieval_modality
  - supporting_facts
  - intermediate_answer
  environment_or_substrate: 389K images and 784K documents for multimodal retrieval.
  verifier_or_reward: HAVE verifies hop-wise attribution and evidence; Search-Align uses the verified chains for process-supervised
    fine-tuning.
  terminal_predicate: The final answer is supported by the verified multimodal evidence chain.
recipe_metadata:
  base_model: The benchmark evaluates six MLLMs; Search-Align targets open-source MLLMs.
  teacher: Human/curated evidence construction and HAVE hop-wise verification.
  generator: Structured multimodal search trajectories.
  filtering_rule: HAVE retains chains whose evidence attribution and intermediate support are verified.
  sampling_protocol: Construct five reasoning topologies, annotate each hop's subquestion/modality/evidence/intermediate answer,
    and evaluate final and process fidelity.
  inference_budget: Average chain length is 3.7 hops; see the project for agent settings.
  optimizer_or_scaffold: Search-Align process-supervised fine-tuning.
  rollout_count: null
  temperature: null
audit:
  source_mixture: Image and text knowledge-base evidence plus verified multi-hop search annotations.
  split: The official Hugging Face release provides a 3,333-row train split; use the project's evaluation protocol for benchmark
    reporting.
  decontamination: Do not train on test evidence chains when using MC-Search for held-out evaluation.
  license: Consult the official project and Hugging Face release for data and knowledge-base terms.
  lineage: ICLR 2026 Oral project, OpenReview paper, and YennNing Hugging Face release.
  known_failure_modes:
  - Retrieval errors compound over hops
  - Modality switches can cause planning mismatch
  - Knowledge-base coverage constrains answerability
