one_line_summary: WASP operationalizes realistic web-agent hijacking as 84 runtime-instantiated tasks with a GPT-4o any-compromised-action
  judge and task-specific environment or action-log predicates, exposing both security-by-incompetence and verifier-contract
  drift.
why_it_matters: 'It shows why an agent trajectory needs two distinct audit layers: a judge can detect that the policy started
  following an injection, while final-state checks reveal whether harm was actually completed; the released exfiltration checker,
  missing rollouts, mixed license, and environment drift also demonstrate why benchmark code is not automatically a reusable
  training corpus.'
