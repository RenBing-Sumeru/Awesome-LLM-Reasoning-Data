one_line_summary: SWE-Gym releases 2,438 unit-test-validated Python repository tasks plus OpenHands and Moatless trajectories,
  policies, and outcome verifiers built through rejection sampling and Best@k selection.
why_it_matters: It connects repository snapshots, tests, full agent episodes, success/failure selection, and learned trajectory
  rewards while exposing provenance, license, failure-retention, and image-pinning risks.
