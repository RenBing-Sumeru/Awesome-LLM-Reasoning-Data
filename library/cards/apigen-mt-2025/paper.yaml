one_line_summary: APIGen-MT releases 5,000 success-filtered Retail/Airline tool-use dialogues from a blueprint-and-simulation
  pipeline, but omits failed runs, replay state, verifier logs, and the complete xLAM training mixture.
why_it_matters: It connects API schemas, policies, latent environment state, mixed validation, simulated users, and assistant-token
  behavioral cloning in one auditable construction chain, while showing why a conversation-only success subset cannot by itself
  reproduce the environment or establish unrestricted training reuse.
