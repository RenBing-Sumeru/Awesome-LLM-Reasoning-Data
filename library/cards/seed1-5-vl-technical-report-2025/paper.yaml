one_line_summary: Seed1.5-VL discloses a 3T-scale multimodal pipeline and hybrid RLHF/RLVR recipe, while releasing API access
  and sample code rather than model weights or training records.
why_it_matters: It is a high-information disclosure ledger for multimodal post-training because it connects images, prompts,
  LongCoT traces, preference rewards and rule verifiers without making the hidden data reusable.
