one_line_summary: MobileWorld evaluates 201 long-horizon mobile tasks in a containerized, snapshot-reset environment with
  GUI, simulated-user, and MCP actions plus task-specific programmatic terminal checks.
why_it_matters: It makes hybrid mobile episodes and deterministic environment feedback auditable, while exposing replay drift,
  verifier scope, external-tool mutability, and privacy/licensing boundaries that block unqualified training reuse.
