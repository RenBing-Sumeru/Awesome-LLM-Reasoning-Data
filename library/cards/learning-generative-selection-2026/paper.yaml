one_line_summary: Automatically verified math and code candidate sets train a 1.7B DAPO policy to reason over Best-of-N solutions
  and return the index of a verified-correct candidate.
why_it_matters: It exposes candidate-pool composition, verifier labels, selector rollouts, and selection reward as distinct
  data objects for the rollout/search/test-time trace track.
