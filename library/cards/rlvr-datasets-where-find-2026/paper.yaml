one_line_summary: ATLAS traces 1.45M RLVR instances to atomic sources and uses leakage and source-utility signals to construct
  the released 17K-row DAPO++, while the lineage and selection ledgers remain unreleased.
why_it_matters: It links provenance evidence to an explicit RLVR construction and benchmarking recipe, and shows why a final
  Parquet cannot support full reuse auditing when atomic-source labels, SCA decisions, random replacement history, licenses,
  and immutable release metadata are missing.
