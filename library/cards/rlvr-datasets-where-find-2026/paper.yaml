inclusion_reason: This work makes atomic-source lineage, contamination, source-conditioned learnability, dataset scoring,
  and lineage-guided DAPO++ construction part of one RLVR data workflow, while its partial release exposes concrete provenance
  and reproducibility gaps relevant to open-recipe auditing.
