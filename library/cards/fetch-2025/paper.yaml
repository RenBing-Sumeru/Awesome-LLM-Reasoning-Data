one_line_summary: FETCH reduces redundant tree expansion by clustering equivalent reasoning states and stabilizes verifier-guided
  search with TD-trained, ensembled scores.
why_it_matters: It identifies the internal trace objects and score variance that determine whether additional test-time search
  compute is useful, while exposing missing rollout and label-release evidence.
