one_line: TensorBench evaluates seven coding agents on 199 pinned Scorch feature/refactor tasks using fresh-container pytest
  outcomes and trajectory audits, but its self-authored feature tests and currently inaccessible run artifacts limit correctness
  and replay claims.
one_line_summary: TensorBench evaluates seven coding agents on 199 pinned Scorch feature/refactor tasks using fresh-container
  pytest outcomes and trajectory audits, but its self-authored feature tests and currently inaccessible run artifacts limit
  correctness and replay claims.
why_it_matters: It turns repository modification into a concrete environment episode with a reproducible terminal predicate
  and preserves enough process structure to compare tool use, regressions, and near-misses; it also demonstrates that an executable
  verifier can remain incomplete when the evaluated agent authors the tests for the new behavior.
