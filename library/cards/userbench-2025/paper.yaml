one_line_summary: UserBench releases 3,122 unique travel-planning tasks and a mixed GPT-4o/rule Gym environment for preference
  elicitation, but not the paper's rollout trajectories, and its counts, judge labels, randomness, and best-option ties require
  a pinned audit.
why_it_matters: It shows how an interactive agent benchmark can turn clarifying questions, searches, implicit user responses,
  and option choices into state/action rewards, while also demonstrating why prospective train splits are not training evidence
  and why judge, label, split, and replay metadata determine reuse safety.
