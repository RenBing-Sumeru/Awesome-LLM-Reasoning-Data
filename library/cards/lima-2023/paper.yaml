data_object:
  prompt_source: About 750 training prompts come from Stack Exchange and wikiHow; the remainder were written by the authors
    or sourced from community Q&A.
  trace_author: Community contributors and the paper authors.
  answer_format: One user instruction paired with one curated natural-language answer.
  process_fields:
  - instruction
  - response
  - source provenance
  environment_or_substrate: Static instruction-response records consumed by supervised fine-tuning.
  verifier_or_reward: Human preference evaluation of helpfulness and writing quality; no per-record factual verifier is provided.
  terminal_predicate: A demonstration is retained through author curation, and model quality is judged through pairwise human
    preference.
recipe_metadata:
  base_model: LLaMA-65B.
  teacher: Community contributors and paper authors; no single teacher model writes the training set.
  generator: Curate 1,000 high-quality instruction-response pairs and fine-tune LLaMA-65B on them.
  filtering_rule: Author selection for quality, diversity, and response style.
  sampling_protocol: The paper's human-preference protocol; unreported decoding details remain unknown.
  rollout_count: null
  temperature: null
  inference_budget: Not reported as a reusable construction budget.
  optimizer_or_scaffold: Supervised fine-tuning without a new optimizer or reward model.
audit:
  source_mixture: About 750 community examples plus author-written and other curated examples, totaling 1,000 training demonstrations.
  split: The official gated Hugging Face repository provides train.jsonl and test.jsonl; pin the accessed revision before
    reuse.
  decontamination: The paper does not establish semantic non-overlap with all downstream evaluations.
  license: The official Hugging Face card marks the dataset license as other and requires access approval; redistribution
    rights must be checked separately.
  lineage: 'practical alignment and data-quality primers lineage; closest comparisons: false-promise-imitation-2023, tulu-2-2023.'
  known_failure_modes:
  - The result depends on a capable base model, narrow curated sources, and a preference signal that does not verify factual
    correctness.
  citation_status: verified
  confidence: high
  notes: Paper, author affiliations, NeurIPS 2023 venue, and official gated dataset page checked; institution evidence comes
    from the paper PDF affiliation block.
inclusion_reason: LIMA isolates curation quality as the main variable in small-data supervised alignment and exposes the limits
  of preference-only data evaluation.
