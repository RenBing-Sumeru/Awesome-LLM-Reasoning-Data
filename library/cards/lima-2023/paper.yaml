one_line_summary: LIMA uses 1,000 curated instruction-response pairs to test whether a capable base model needs data quality
  more than data volume to learn an assistant style.
why_it_matters: It turns the quality-versus-quantity claim into a concrete small-data SFT comparison while keeping the preference-only
  evidence boundary visible.
