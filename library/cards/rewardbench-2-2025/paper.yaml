  split: Public Hugging Face dataset has six subsets and 1K-10K size class; no hidden split is stated on the dataset card,
    so pin dataset revision and result snapshot.
  decontamination: Public benchmark records can leak into future training data; live, hidden, or post-cutoff claims require
    versioned evidence.
  license: Dataset card states ODC-BY and research/educational intended use under Ai2 Responsible Use Guidelines; third-party
    generated outputs retain separate model-provider terms.
  lineage: 'Primary lead: https://arxiv.org/abs/2506.01937'
  known_failure_modes:
  - public release, dataset revision, judge/evaluator implementation, reward-model prompt format, scaffold settings, and output
    licenses can affect reuse.
  - Scores can change with prompt format, scaffold, evaluator version, hidden/public split, or dependency environment.
  - Evaluation-only evidence should not be reused as training reward without a separate feedback-contract audit.
