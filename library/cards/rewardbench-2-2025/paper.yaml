data_object:
  prompt_source: 1,865 final prompts curated from about 3,000 high-quality prompts, using new human prompts for most subsets
    and manual prompts for Ties after decontamination against twenty downstream evaluations.
  trace_author: Official benchmark authors, annotators, validators, or task curators as disclosed by the source.
  answer_format: single-turn records with prompt, chosen response list, rejected response list, counts, total completions,
    generating models, subset, and id.
  process_fields:
  - prompt or task input
  - reference answer/evaluator/environment state
  - metadata for split/domain/version
  - model output and score
  environment_or_substrate: multi-skill reward-model accuracy tied to downstream utility
  verifier_or_reward: five domains score whether a reward model ranks the chosen completion above three rejected completions;
    Ties combines correct-over-incorrect accuracy with a reward-margin calibration condition.
  terminal_predicate: per-domain accuracy with unweighted averaging across Factuality, Precise IF, Math, Safety, Focus, and
    Ties.
recipe_metadata:
  base_model: Not a training recipe; this Card treats the work as an evaluation or audit surface.
  teacher: Official authors, annotators, validators, tests, judges, or verifier sources described by the paper.
  generator: completions are generated from a 20-model/human pool with subset-specific pipelines, including LLM judges, verifier
    functions, majority voting, rubrics, system-prompt variation, and manual checks.
  filtering_rule: subset-specific verification keeps one chosen and three rejected completions for most domains; Math, Safety,
    and Ties include manual verification, while Factuality uses two agreeing LLM judges plus spot checks.
  sampling_protocol: pin dataset revision, leaderboard/results revision, reward-model inference template, score extraction
    method, generative-judge prompt if used, and leaderboard date.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation budget is model- and harness-specific; do not infer a training-time budget from benchmark scores.
  optimizer_or_scaffold: judge_reward_meta_evaluation
audit:
  source_mixture: 'Official sources checked for author, institution, and venue metadata: https://arxiv.org/abs/2506.01937;
