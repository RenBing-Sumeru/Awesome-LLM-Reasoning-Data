one_line_summary: Updates a reference-based reward model after every GRPO policy step using rule-accepted on-policy positives
  and assistant-generated rule-rejected negatives.
why_it_matters: Makes verifier refresh cadence and pair construction explicit while showing the limits of static reward models.
