data_object:
  prompt_source: VerifyRM starts from seven mathematical reasoning datasets; Cooper RL uses a random 10K subset of DeepMath
  trace_author: Eleven mainstream LLMs generate initial VerifyRM completions; the current policy generates on-policy rollouts;
    a same-family assistant model corrupts correct reasoning into hard negative responses
  answer_format: Question, reference answer, completion, binary correctness label for VerifyRM; during Cooper, question/reference
    with on-policy positive response and assistant-generated negative response
  process_fields:
  - question
  - reference_answer
  - completion
  - correctness_label
  - policy_rollouts
  - rule_positive
  - assistant_negative
  - reward_model_score
  environment_or_substrate: GRPO over mathematical reasoning with a reference-conditioned VerifyRM updated after each policy
    update
  verifier_or_reward: Math-Verify high-precision rule anchor for selecting positives and validating negatives; Qwen3-4B agreement
    labels initial VerifyRM data; VerifyRM scores policy rollouts
  terminal_predicate: Policy reward is VerifyRM score; RM pair is usable when Math-Verify accepts a positive and rejects the
    assistant-corrupted negative
recipe_metadata:
  base_model: Qwen2.5-1.5B-Instruct and Llama-3.2-1B-Instruct policies; VerifyRM initialized from Qwen2.5-Math-1.5B-Instruct
  teacher: Qwen3-4B non-thinking mode for initial hybrid annotation; same policy model family is used as the assistant negative
    generator
  generator: Current policy samples 16 rollouts per prompt; assistant LLM repeatedly corrupts one rule-accepted correct trajectory
    until rule rejection
  filtering_rule: Initial VerifyRM retains Math-Verify/Qwen3-4B agreement from 65K triples, yielding 58.7K examples; Cooper
    selects a random rule-accepted positive, generates a rule-rejected negative, and masks samples when no valid pair is constructed
  sampling_protocol: 'For each RL iteration/batch: generate 16 policy rollouts -> VerifyRM scoring and GRPO policy update
    -> choose rule-positive -> generate/retry rule-negative -> contrastive RM update -> repeat'
  rollout_count: 16
  temperature: 0.7 for initial completion collection and evaluation; RL rollout temperature not explicitly established in
    inspected public prose
  inference_budget: 'Initial data: one completion from each of 11 LLMs per selected problem, 65K triples; RL: 16 rollouts
    per prompt for 10 epochs; negative generation retries until valid or masks the sample'
  optimizer_or_scaffold: GRPO with KL coefficient 0.001 for policy; contrastive score-difference loss for RM; each training
    step contains policy then RM optimization
audit:
  source_mixture: Seven math datasets for VerifyRM and 10K DeepMath prompts for Cooper; exact record IDs are available only
    through released files/configuration inspection
  split: VerifyBench-overlapping queries are removed from VerifyRM training; policy evaluation uses GSM8K, SVAMP, MATH500,
    OlympiadBench-EN, and Math Odyssey
  decontamination: VerifyBench query overlap is explicitly removed; complete semantic overlap across DeepMath and five evaluation
    benchmarks is unknown
  license: Apache-2.0 repository; included training data and upstream math datasets retain their own terms
  lineage: Seven datasets -> 11-model completions -> Math-Verify/Qwen3 agreement -> 58.7K VerifyRM data -> initial VerifyRM
    -> DeepMath on-policy rollouts -> rule-positive/assistant-negative pairs -> per-step RM refresh
  known_failure_modes:
  - Rule anchors have high precision but low recall and may favor parseable answer formats.
  - Assistant-generated negatives can contain superficial corruption artifacts that the RM learns as shortcuts.
  - Using the same model family as policy and assistant can preserve shared blind spots.
  - Policy and RM still co-adapt; rule anchoring reduces but does not eliminate shared drift or reward hacking.
  - Dynamic positive-negative pairs, failed construction attempts, retry counts, and complete per-step RM checkpoints are
    not released as a versioned stream.
  - 'Project page and README disagree on the headline gain: abstract/table imply 0.54 absolute average points, while README
    highlights 3.09%, so use table values.'
  citation_status: verified
  confidence: high
  notes: Official arXiv v1, project page, Apache-2.0 code, and 58.7K VerifyRM training parquet checked 2026-07-12. Project
    remains a preprint under review.
inclusion_reason: Provides a concrete per-training-step recipe for refreshing a reward model from rule-anchored on-policy
  positives and generated hard negatives.
