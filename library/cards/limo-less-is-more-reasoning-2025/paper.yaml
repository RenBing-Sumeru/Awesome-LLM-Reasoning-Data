card: null
one_line_summary: LIMO-v2 distills a massive mixed mathematics pool into 800 long-reasoning SFT triples using model solve-rate
  difficulty filters and a lexical quality score, achieving data-efficient elicitation while leaving the original pool, item
  lineage, rejects, and construction implementation unreleased.
why_it_matters: 'It offers a concrete, influential argument that carefully chosen reasoning demonstrations can matter more
  than raw SFT volume. It also shows why final row count is an incomplete measure of data efficiency: hidden cost, provenance,
  verifier semantics, version alignment, and rejected examples determine whether the recipe can be trusted and reproduced.'
