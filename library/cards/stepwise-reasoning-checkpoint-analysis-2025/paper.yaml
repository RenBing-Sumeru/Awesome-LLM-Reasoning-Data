one_line_summary: SRCA probes a reasoning prefix with a temporary answer cue, uses checkpoint answers to diversify PRM-guided
  search and augment final candidates, but releases no code, traces, or replay ledger.
why_it_matters: It gives the rollout-search track an explicit intermediate-state object and selection contract, while showing
  that test-time accuracy cannot establish checkpoint-label quality, PRM calibration, or reproducibility.
