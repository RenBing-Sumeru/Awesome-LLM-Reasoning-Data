one_line_summary: MoB estimates the modal answer of a reward-ranked Best-of-m distribution from a fixed completion pool and
  releases prompts, generations, extracted answers, correctness scores, and reward scores for offline selection studies.
why_it_matters: It exposes a reusable test-time selection object for Track 5 and separates generation budget, reward ranking,
  answer aggregation, and final benchmark correctness, while provenance and data-rights questions remain.
