one_line_summary: AgentHER relabels recoverable failed WebArena and ToolBench episodes with LLM-synthesized hindsight goals
  and packages them as severity-weighted SFT, DPO, or ShareGPT records, while the public code and experiment release remain
  materially incomplete.
why_it_matters: It treats failed agent interaction logs as reusable post-training data instead of waste and makes the relabeling
  judge, confidence gate, and failure-severity policy part of the data contract; those same learned components can also introduce
  false positives, false negatives, and unreproducible selection bias.
