data_object:
  prompt_source: WebArena WA-TRAIN (612 collection-only tasks from a 612/200 task-disjoint split) and the official ToolBench
    training splits. The paper reports 500 successful and 3,000 failed WebArena trajectories and 2,000 successful and 5,000
    failed ToolBench trajectories, but no record-level corpus or split manifest was found in the public repository.
  trace_author: gpt-3.5-turbo-0125 collects the failed and successful environment trajectories in the reported experiments.
    gpt-4o-mini extracts outcomes and proposes hindsight goals; Qwen2.5-72B-Instruct is the paper's independent second judge.
  answer_format: An accepted failed episode is paired with a new hindsight prompt and serialized as either an SFT conversation,
    a DPO chosen/rejected record, or a ShareGPT multi-turn conversation. The trajectory itself is not regenerated by the paper
    method.
  process_fields:
  - trajectory_id
  - original_prompt
  - thought
  - action_name
  - action_input
  - observation
  - final_answer
  - failure_reason
  - failure_type
  - recoverable
  - severity_weight
  - actual_achievements
  - key_observations
  - hindsight_prompt
  - relabel_rationale
  - relabel_confidence
  - second_judge_confidence
  - output_format
  - chosen
  - rejected
  environment_or_substrate: Offline WebArena web-navigation and ToolBench API/tool-use episodes. The released package consumes
    JSON/JSONL trajectory text; it does not include environment adapters, reset logic, executable terminal predicates, or
    replay manifests.
  verifier_or_reward: Initial failure and terminal success originate from the benchmark environments. For a hindsight pair,
    the paper requires a gpt-4o-mini relabeler and an independently trained Qwen2.5-72B-Instruct verifier to each assign confidence
    at least theta=0.5; a failure-severity weight scales SFT loss or the DPO margin. This learned contract checks support
    in recorded observations, not live replay of the environment.
  terminal_predicate: 'Original-task success is benchmark-specific. Relabeled-pair acceptance is judge-based: both paper judges
    must clear theta=0.5, with up to three attempts, although Algorithm 1 also permits a best single-judge fallback at 0.8*theta.
    A version-pinned executable predicate for each episode is not released.'
recipe_metadata:
  base_model: Reported fine-tuned/evaluated models are GPT-4o, Qwen2.5-72B/7B, LLaMA-3.1-8B, and Qwen2.5 checkpoints from
    1.5B to 72B for the scaling study.
  teacher: gpt-4o-mini is the LLM failure detector when enabled, outcome extractor, and hindsight prompt relabeler; Qwen2.5-72B-Instruct
    is the paper's cross-model verifier.
  generator: gpt-3.5-turbo-0125 generates environment trajectories; the four-stage offline pipeline performs failure classification,
    factual outcome extraction, hindsight-prompt synthesis and verification, then deterministic SFT/DPO/ShareGPT packaging.
  filtering_rule: Reject irrecoverable or major-flaw runs with severity weight below delta=0.3. Retry relabeling at most three
    times and accept when both paper judges reach theta=0.5; Algorithm 1 retains a best single-judge fallback at confidence
    at least 0.4.
  sampling_protocol: WebArena uses 3,000 failed and 500 successful WA-TRAIN trajectories; ToolBench uses 5,000 failed and
    2,000 successful trajectories from official training splits. Reported MJ-X acceptance is 71.5% and 75.5%, respectively.
  rollout_count: 3,000 WebArena failures plus 500 successes; 5,000 ToolBench failures plus 2,000 successes. Per-task rollout
    budgets and the complete raw rollout corpus are unknown.
  temperature: gpt-4o-mini relabeler T=0.3 on the first attempt and T=0.7 on retries; Qwen2.5-72B-Instruct verifier T=0. Failure
    detector and outcome extractor are reported at T=0 in Appendix A.
  inference_budget: At most three relabeling attempts; Table 2 reports 4.27 LLM calls per input trajectory for MJ-X. Environment
    step/token limits are unknown. Open-weight training uses maximum sequence length 4,096.
  optimizer_or_scaffold: Open-weight models use LoRA SFT for 3 epochs and LoRA DPO for 1 epoch in ms-swift on 8 A100-80G GPUs;
    the paper reports rank 16, alpha 32, and DPO beta 0.1. GPT-4o uses the OpenAI fine-tuning API; an 8-shot ICL variant is
    also evaluated without fine-tuning.
audit:
  source_mixture: Failed and successful trajectories from WebArena and ToolBench, collected by gpt-3.5-turbo-0125. Record-level
    task IDs, selection yields before the reported totals, and raw accepted/rejected relabelings are not publicly released.
  split: WebArena is split into 612 WA-TRAIN tasks and 200 WA-HELDOUT evaluation tasks, stratified by category with seed 0.
    ToolBench uses official training and G1/G2/G3 test splits. The paper says the WebArena split JSON is released, but it
    is absent from the inspected repository snapshot.
  decontamination: The task-disjoint WebArena split and environment reset reduce within-WebArena overlap. The paper explicitly
    says cross-environment contamination is not removed; no broader text-, task-, or model-pretraining decontamination procedure
    is disclosed.
  benchmark_overlap: Training uses WebArena and ToolBench training tasks and evaluates on WA-HELDOUT and ToolBench official
    test splits. Appendix D.1 reports that the standard full WebArena evaluation has modest task-overlap leakage; cross-environment
    contamination remains unknown.
  license: The current arXiv submission links to CC0-1.0 and the code repository declares Apache-2.0. No dataset-specific
    license or compatibility/rights analysis for WebArena, ToolBench, generated prompts, observations, or model-produced thoughts
    is released.
  lineage: benchmark task -> gpt-3.5-turbo-0125 environment episode -> failure type and severity -> factual outcome summary
    -> gpt-4o-mini hindsight goal -> Qwen2.5-72B-Instruct judgment -> confidence/severity filtering -> SFT, DPO, or ShareGPT
    record -> LoRA fine-tuning.
  release_version: arXiv v4 dated 2026-05-10 is the canonical paper version. The inspected GitHub main snapshot is commit
    98072c34db5ee65a22e43f8621b5ec76a9c995e1 dated 2026-03-25; pyproject.toml declares 0.1.0, and GitHub reports no tags or
    releases. The repository PDF predates and differs from arXiv v4.
  successful_and_failed_sample_retention: The experiments retain successful demonstrations and accepted relabeled failures
    for training. Major/irrecoverable failures and confidence-filtered relabelings are rejected; the public repository contains
    examples only, not the complete retained/rejected sets.
  replay: The method reuses serialized trajectories without extra environment interaction, but the release has no environment
    version, state snapshot, task manifest, reset seed, tool/API version, terminal-predicate implementation, or deterministic
    replay log.
  known_failure_modes:
  - Learned judges can approve hindsight prompts that are observation-supported yet still biased toward frequent task types;
    the paper reports 2.9% invalid MJ-X labels on WebArena and 4.0% on ToolBench under human majority vote.
  - The confidence filter rejects pairs of which 38.7% on WebArena and 35.8% on ToolBench are judged valid by humans, creating
    substantial false-negative selection bias.
  - The paper's theoretical bound assumes perfect judges or i.i.d. bounded judge errors and is explicitly a plausibility argument,
    not a deployment guarantee.
  - The released PipelineConfig injects one LLMClient into all stages, so it cannot reproduce the paper's gpt-4o-mini plus
    Qwen2.5-72B-Instruct cross-model contract without code changes.
  - The released second-judge acceptance path compares only confidence and does not check SecondJudgeVerdict.is_valid; a high-confidence
    rejection can therefore pass in the inspected implementation.
  - FailureAnalysis.severity is documented in code as 0=mild and 1=catastrophic, whereas the paper's severity weight gives
    major errors values below 0.3. The pipeline thresholds and propagates the code severity directly, so release semantics
    do not match the paper recipe.
  - SFT and DPO serialization truncate every observation to 300 characters; the released records are not full replayable trajectories.
    DPO also changes the prompt between chosen and rejected conversations, which downstream trainers must handle explicitly.
  - The repository lacks the reported experiment datasets, WA split JSON, annotation interface/guidelines/sample IDs, environment
    adapters, and fine-tuning/evaluation scripts; reported scores cannot be reproduced from the public package alone.
  citation_status: verified
  confidence: medium
  notes: Citation, arXiv v4, OpenReview entry, code repository, code license, and package metadata were checked. Experimental
    numbers are author-reported and not independently reproduced. Recommend upgrading the existing generic Card in place rather
    than creating a duplicate.
inclusion_reason: 'AgentHER is a direct reasoning-data construction recipe: it converts recoverable failed agent episodes
  into positive full-episode supervision and preference records under an explicit learned-judge and severity-filter contract.'
