status: partial
one_line_summary: GRIP reports expanding 7.5K MATH seeds into 2,123,345 graph-conditioned question-solution pairs and officially
  releases 24,957 four-field rows, while code, the full corpus, judge weights, lineage, and licenses remain unavailable.
why_it_matters: The work makes graph relationship type, difficulty-routed generation, and separate question/solution gates
  explicit construction variables; its partial release also exposes the difference between a documented recipe, an inspectable
  sample, and an audit-ready corpus.
