one_line_summary: AndroidControl-Curated releases five static Android step-data views and screenshot archives, couples box-aligned
  scoring with LLM-human task and label correction, and uses 2,400 selected samples for GRPO agent training.
why_it_matters: It demonstrates that the evaluation contract and label quality can move GUI-agent success rates by double
  digits, while its released records and scorer make those effects auditable enough to study—provided users preserve the unresolved
  licensing, replay, split, and checkpoint boundaries.
