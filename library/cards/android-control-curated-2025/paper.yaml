inclusion_reason: This work exposes a concrete Android state-action benchmark object and shows how point-versus-box scoring,
  alternative valid actions, and task/label correction change GUI-agent evaluation; it is therefore directly useful for both
  trajectory-data audit and benchmark-construction practice.
