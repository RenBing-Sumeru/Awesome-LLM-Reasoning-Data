one_line_summary: CDG generates one-step Prover–Critic–revision episodes and converts correctness- thresholded helpful, misleading,
  corrected, and resistant outcomes into role-specific training data.
why_it_matters: It provides a concrete open recipe for constructing reasoning-feedback data while exposing how answer-only
  verification, exact-phrase rewards, correlated self-play, and incomplete release lineage can shape the resulting supervision.
