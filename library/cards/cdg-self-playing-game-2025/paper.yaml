data_object:
  unit_of_record: The semantic self-play unit is one episode containing a question, the Prover's initial solution, one Helpful-
    or Misleading-Critic message, and the Prover's revised solution. Ground-truth answer, initial/final correctness, routed
    role, loop, selection outcome, and training conversion are required to audit that episode, although the exact Google Drive
    serialization was not independently inspected.
  prompt_source: 7,473 GSM8K training questions and a 12,000-question subset of the MATH training set form the main self-play
    pool. The checked repository embeds 19,473 raw input rows with prompts, answers, indices, and source metadata; this is
    not the released rollout corpus.
  trace_author: Llama-3.1-8B-Instruct or Qwen2.5-1.5B-Instruct instantiates the Prover, Helpful Critic, and Misleading Critic
    roles. A Llama-3.1-8B-Base experiment first imitates 30,000 examples generated by Llama-3.1-8B-Instruct.
  context_or_state: A reasoning question, reference answer, initial Prover solution, its verifier correctness, an assigned
    critic role, and—at revision time—the extracted critique. The Prover is not told whether the critique was intended to
    help or mislead.
  trace_or_actions: The Prover writes an initial chain of reasoning; a critic identifies a real first error or fabricates
    a plausible error; the Prover accepts the feedback and revises or rejects it and retains the answer. Each episode stops
    after this single critique–revision exchange.
  answer_or_artifact: Selected Prover conversations and role-specific critic instruction/output records are converted to SFT
    data. The official scripts expose intermediate fields such as prompt, responses/response, metadata, round1_response, critic,
    conversations, instruction, input, output, system, and mask_history.
  answer_format: Final mathematical answers are requested inside `\\boxed{}`. Rejection of an invalid critique is taught with
    the exact phrase `\\boxed{This critic is not critical.}`.
  process_fields:
  - question
  - gold_answer
  - initial_solution
  - initial_correctness
  - critic_role
  - critique
  - revised_solution
  - final_correctness
  - loop
  - selection_outcome
  - prompt
  - response
  - metadata
  - round1_response
  - critic
  - conversations
  observation: The pipeline observes extracted final answers, SymPy-based equivalence decisions, critique text ending in a
    claimed first mistake, revised answer text, and exact rejection markers. It does not independently observe whether the
    reasoning trace is faithful or whether the cited first mistake is actually the first causal error.
  verifier_output: A regex extractor and SymPy grader label initial and revised answers correct or incorrect. Helpful-Critic
    selection uses how often four Prover revisions become correct; Misleading-Critic selection uses how often revisions abandon
    a correct answer without emitting the rejection phrase.
  reward: The Prover succeeds by correcting an initially wrong answer after helpful feedback or by resisting misleading feedback
    on an initially correct answer, with the latter weighted by eta in the formal reward. A Helpful Critic succeeds when it
    causes a wrong answer to become correct; a Misleading Critic succeeds when it causes a correct answer to become incorrect.
    ReST turns thresholded successes into role-specific SFT data.
  terminal_predicate: 'An episode ends after one critique and one revision. Selection is answer- and phrase-based: helpful
    critiques need at least two correct revisions among four; misleading critiques need at least three failed/reversed revisions
    among four; Prover examples must satisfy the corresponding correctness or exact-rejection test.'
  provenance: GSM8K/MATH training question -> four initial solutions -> answer verification -> role routing -> four or eight
    critique samples -> four revisions per critique -> threshold selection -> balanced role datasets -> role fine-tuning ->
    next self-play loop.
  environment_or_substrate: Offline text self-play among three language-model roles, with regex answer extraction and SymPy
    comparison as the environment feedback. There is no proof assistant, external simulator, human adjudicator, or independently
    trained process verifier.
  release_boundary: The official repository publishes generation, selection, conversion, training, and evaluation code plus
    the 19,473-row raw question pool; Google Drive is linked for rollout data and Hugging Face for Llama_CDG weights. No immutable
    Drive snapshot, joined schema manifest, checksums, rejection log, or tagged repository release was verified.
recipe_metadata:
  base_model: Main experiments use Llama-3.1-8B-Instruct and Qwen2.5-1.5B-Instruct. A separate Llama-3.1-8B-Base setting receives
    30,000 instruction-model imitation examples before CDG. The public checkpoint is PinzhengWang/Llama_CDG.
  teacher: No human or stronger-model teacher labels the main CDG episodes. The same model family plays Prover and both critics;
    ground-truth final answers supply outcome supervision. GPT-4o and QwQ-32B-Preview appear only in separate downstream stepwise-error
    and long-chain data constructions, not as main CDG judges.
  generator: Role-conditioned copies of the current policy sample initial solutions, critiques, and revisions. The Helpful
    Critic is prompted to identify the first error without solving; the Misleading Critic receives a correct solution and
    generates a false criticism.
  prompt_or_task_source: GSM8K train (7,473) and 12,000 MATH train questions. Evaluation uses GSM8K test (1,319) and MATH500
    (500), plus separately constructed data for error detection, self-correction, long-chain reasoning, and repository-only
    transfer evaluations.
  sampling_protocol: Four initial Prover responses are drawn per question. Helpful critics generate eight critiques for each
    incorrect question–solution pair and Misleading critics generate four for each correct pair. The Prover then generates
    four revisions for each question–solution–critique triplet.
  filtering_rule: Balance the Prover set at 10,000 initially correct, 10,000 misleading-resistant, and 10,000 helpful-corrected
    examples. Retain a helpful critique when at least two of four revisions are correct; retain a misleading critique when
    at least three of four revisions fail to reject it and change a correct answer to incorrect.
  selection_threshold: The paper states tau_pi=0.5, tau_rho=0.75, and tau_mu=0.5. Selection scripts also enforce parser-visible
    answer correctness, the exact critique marker, and the exact invalid-critique rejection phrase.
  rollout_count: 'Per problem: four initial solutions; per routed solution: eight helpful or four misleading critiques; per
    critique: four Prover revisions. Aggregate retained and rejected counts for the public Drive release are unknown.'
  temperature: 0.95
  inference_budget: Rollout decoding uses temperature 0.95, top-p 0.95, top-k 5, and maximum length 4,096. The paper reports
    two self-play/training iterations; random seeds and an exact end-to-end run manifest are not disclosed.
  search_or_scaffold: Three-role Critic Discernment Game with correctness-based routing, adversarial and constructive feedback,
    multi-sample revision tests, thresholded selection, and loop-wise dataset accumulation.
  optimizer_or_scaffold: ReST is the main optimizer. The paper reports learning rates 5e-6 in loop 1 and 1e-6 in loop 2, batch
    sizes 32 and 256, one epoch for Prover and Misleading Critic, and two for Helpful Critic. DPO and PPO are ablations, not
    the release's main recipe.
audit:
  source_mixture: GSM8K and MATH training questions, self-generated Prover solutions, self-generated helpful/misleading critiques,
    and self-generated revisions. Separate experiments add GPT-4o annotations, self-correction traces, or QwQ-32B-Preview
    long-chain traces.
  split: The question sources identify train/test pools, but the exact 12,000-question MATH subset membership, episode-level
    split fields, duplicate handling, and selected rollout counts in Google Drive were not independently verified.
  decontamination: No released lexical, semantic, or manually adjudicated overlap analysis was found between the training
    questions/traces and reported evaluation tasks. Using official training splits is provenance information, not evidence
    of trace-level decontamination.
  benchmark_overlap: GSM8K training and test are named separately, and MATH training questions are distinct from MATH500 by
    stated source split. No item-level overlap or near-duplicate report was verified for the main or transfer evaluations.
  license: OpenReview exposes the paper under CC BY 4.0. No top-level license was found at official repository commit b3a531e5f2bd0cff22fdb62cc3f35e9bf16e667a;
    a vendored dependency license is not the project license. Code, Google Drive data, and the Hugging Face checkpoint therefore
    have unknown reuse terms in this Card.
  lineage: Official scripts preserve several intermediate identifiers and metadata fields, but no immutable record-level manifest
    joins raw question, every sampled episode, verifier decision, selection reason, SFT conversion, checkpoint, loop, and
    evaluation result.
  release_version: PMLR volume 267, arXiv 2506.22920 v2, OpenReview forum PPsiS5nSlv, Google Drive, Hugging Face Llama_CDG,
    and GitHub commit b3a531e5f2bd0cff22fdb62cc3f35e9bf16e667a were checked on 2026-07-22. GitHub had no tagged release.
  successful_and_failed_sample_retention: Selection code is available, but the checked release boundary does not provide a
    versioned joined log of all accepted and rejected initial solutions, critiques, revisions, thresholds, and failure reasons.
    Google Drive contents were not independently enumerated.
  verifier_or_judge_failure_modes:
  - Final-answer equivalence can accept an incorrect or unfaithful derivation and miss parser or algebraic equivalents.
  - Correctness-based role routing does not verify that a Helpful Critic found the first causal mistake.
  - The exact rejection phrase makes part of the reward sensitive to formatting and memorized surface behavior.
  - A critic can exploit correlated errors in a Prover from the same model family.
  - Identical critic prompts reduce obvious style cues but do not eliminate lexical or semantic role leakage.
  environment_failure_modes:
  - self-play roles can co-adapt to private conventions rather than general critique discernment
  - official main.sh defaults to three loops while the paper reports two and leaves environment-specific paths unconfigured
  - official selection scripts use Python hash and random sampling without a complete pinned run manifest
  - tracked evaluation filenames containing vertical bars prevent ordinary checkout on Windows
  - separate data pipelines for downstream tasks complicate attribution to CDG episodes alone
  privacy_or_consent: The released objects are benchmark questions and model-generated reasoning text; no personal-data collection
    is described. Upstream dataset and generated-output licensing obligations remain separate from privacy risk.
  known_failure_modes:
  - first-round gains are mixed and several reported metrics decline
  - Qwen CDG-2 is weaker than CDG-1 on some MATH500 metrics
  - benchmark changes do not establish per-record correctness, diversity, or data quality
  - one-step answer repair may reward shortcut behavior instead of faithful process understanding
  - phrase-based rejection can be gamed without evaluating the critique
  - the public rollout artifact lacks an immutable schema and count manifest
  citation_status: verified
  confidence: high
  notes: Verified against the ICML/PMLR paper with appendices, OpenReview record, official repository and scripts, linked
    Google Drive release, and linked Hugging Face model. Data-folder contents and checkpoint license were not independently
    inspectable.
  remaining_unknowns:
  - exact Google Drive file inventory, schema, record counts, checksums, and immutable revision
  - item-level provenance and checkpoint/loop linkage for every selected episode
  - random seeds, exact MATH subset membership, and full rejection yields
  - code, data, and checkpoint licenses
  - decontamination, near-duplicate, critic-calibration, and phrase-ablation results
inclusion_reason: CDG is an open self-play construction recipe that turns correctness-routed reasoning episodes into Prover
  and critic supervision, with explicit selection thresholds, official code, linked rollout data, and auditable verifier and
  release limitations.
