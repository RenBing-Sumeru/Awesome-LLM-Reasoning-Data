one_line_summary: DEER probes trial answers at reasoning transitions and exits when model self-confidence is high, while the
  official repository releases only part of the paper's implementation and no reusable rollout corpus.
why_it_matters: It makes adaptive trace truncation auditable as a sequence of transition detection, answer induction, confidence
  estimation, and branch selection rather than treating reduced benchmark token counts as data-quality evidence.
