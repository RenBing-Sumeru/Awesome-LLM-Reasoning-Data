data_object:
  prompt_source: Ten named reasoning benchmarks used for evaluation; no standalone rollout corpus is released.
  trace_author: The evaluated target model generates its own CoT, transition candidates, trial answers, token probabilities,
    and exit decision online.
  answer_format: Think-delimited CoT prefix plus transition event, induced boxed trial answer, token-level confidence, and
    exit-or-continue action.
  process_fields:
  - transition_point
  - trial_answer
  - self_confidence
  - exit_decision
  - branch_state
  environment_or_substrate: Hugging Face Transformers and vLLM decoding; the paper also describes branch-parallel decoding
    with dynamic KV-cache pruning.
  verifier_or_reward: Model-internal trial-answer token probabilities, optionally calibrated across prompts; this is self-confidence
    rather than an external correctness verifier.
  terminal_predicate: Exit when calibrated trial-answer confidence exceeds lambda; the reported default is 0.95, with an additional
    end-of-thinking condition in the released Qwen3 implementation.
recipe_metadata:
  base_model: Eleven reported open reasoning models from DeepSeek-R1-Distill-Qwen, Qwen3, QwQ-32B, and DeepSeek-R1 families;
    DEER trains no new policy.
  teacher: unknown
  generator: The target model's own online CoT and answer inductions.
  filtering_rule: Linguistic action-transition markers or high-entropy step boundaries trigger trial branches; confidence
    thresholding selects exit versus continuation.
  sampling_protocol: Main correctness experiments use zero-shot CoT and greedy single-sample decoding; small AMC/AIME sets
    are evaluated over repeated rounds.
  rollout_count: One greedy sample per main correctness evaluation; four rounds are reported for AMC 2023, AIME 2024, and
    AIME 2025, with additional repeated runs for confidence intervals.
  temperature: Greedy decoding in main experiments; a Qwen3 supplementary setting uses top-p 0.95 and temperature 0.6.
  inference_budget: Main experiments use a 16,384-token maximum; selected Qwen3 supplementary runs use 32,768 tokens.
  optimizer_or_scaffold: Training-free inference wrapper with DEER, multi-prompt DEER-PRo, and a paper-described branch-parallel
    acceleration variant.
audit:
  source_mixture: Raw CoTs, trial branches, confidence sequences, candidate events, and exit logs are not released as a versioned
    corpus.
  split: Benchmark-native evaluation splits; no derived trace split or replay manifest is published.
  decontamination: unknown
  license: The official code repository is MIT; no separate trace or data release license exists because no rollout corpus
    is documented.
  lineage: prompt -> online CoT prefix -> transition monitor -> induced trial answer -> model self-confidence -> exit or continuation
    -> benchmark-scored final answer
  known_failure_modes:
  - model self-confidence can be miscalibrated and is not independent correctness verification
  - linguistic transition markers and confidence thresholds can be model- and language-specific
  - trial-answer branches add latency and memory overhead, especially for code outputs
  - premature exit can preserve a confident wrong answer or truncate an unfaithful rationale
  citation_status: verified
  confidence: high
  notes: Final ICLR/OpenReview and arXiv v3 metadata plus the official MIT repository were checked. The repository currently
    releases mathematical-task Hugging Face/vLLM code, while code generation, branch-parallel acceleration, and versioned
    rollout data remain unavailable.
inclusion_reason: A model-internal trace selector that turns transition events, trial answers, and self-confidence into an
  explicit test-time exit decision with concrete calibration and replay risks.
