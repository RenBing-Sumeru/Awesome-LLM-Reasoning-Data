one_line_summary: SciInstruct turns answer-only science questions into open worked-solution records through staged generation,
  self-reflection, outcome checking, and learned quality filtering.
why_it_matters: It makes the transition from scarce answer-only scientific problems to reusable rationale SFT data explicit
  and evaluates both mixture components and filtering decisions.
