data_object:
  dataset_scale: 87 public skill-oriented tasks across 8 domains in the arXiv v4 abstract; official GitHub exposes tasks/,
    tasks-extra/, registry.json, taxonomy, experiments, and harness code.
  prompt_source: human-authored task.md instructions in the public SkillsBench task modules; task data live inside containerized
    task directories.
  trace_author: 142 contributors submitted candidate tasks; benchmark authors and maintainers curated the public release.
  answer_format: task, model output, skill label, checker/judge result, and score.
  process_fields:
  - skill label
  - prompt
  - model response
  - expected answer or rubric
  - score
  environment_or_substrate: skill-level benchmark suite.
  verifier_or_reward: deterministic task verifiers, primarily executable tests/checkers, under matched no-Skills and curated-Skills
    conditions.
  terminal_predicate: task passes its pinned deterministic verifier or receives the corresponding verifier score.
recipe_metadata:
  base_model: Not a training recipe; benchmark surface.
  teacher: task/rubric authors.
  generator: skill taxonomy and task construction.
  filtering_rule: human-authored tasks, oracle-pass requirement, structural checks, skill-to-solution leakage checks, and
    maintainer review before inclusion.
  sampling_protocol: Pin arXiv v4, GitHub commit or release snapshot, 87-task inventory, model harness, no-Skills versus curated-Skills
    condition, and selected trials.
  rollout_count: null
  temperature: null
  inference_budget: model-specific
  optimizer_or_scaffold: skill_benchmark_eval
