data_object:
  prompt_source: OpenAI reports that o3-mini was pre-trained on diverse datasets mixing publicly available data and custom
    in-house datasets; it also reports public and internally constructed safety evaluations. Source identities, proportions,
    manifests, licenses, and record-level provenance are unknown.
  trace_author: The report says reasoning models can produce a long chain of thought before responding. Whether training records
    include, retain, or release such traces, and who authored any training traces, is unknown.
  answer_format: No training-record or released evaluation-record schema is disclosed. The report describes model completions
    in several safety and Preparedness evaluations, but their retained fields and formats are unknown.
  process_fields: []
  environment_or_substrate: The report describes evaluation/red-team settings with browsing, code execution, custom model
    training, scaffolding, prompting, and named task scaffolds. The post-training environment, tool interfaces, task distribution,
    and trajectory-retention policy are unknown.
  verifier_or_reward: Large-scale reinforcement learning is reported, but its reward/verifier contract is unknown. Separately,
    the card reports evaluation autograders (including not_unsafe/not_overrefuse), human/expert safety judgments, and a Gray
    Swan success criterion using the Moderation API plus a harmful-content classifier; it does not state that these are training
    rewards.
  terminal_predicate: unknown
recipe_metadata:
  base_model: The report distinguishes o3-mini-near-final-checkpoint and launched o3-mini, and says they share a base model.
    Architecture, pretraining checkpoint lineage, parameterization, and stage allocation are unknown.
  teacher: unknown
  generator: unknown
  filtering_rule: OpenAI reports rigorous quality/risk filtering, processes to reduce personal information, and use of the
    Moderation API and safety classifiers to prevent harmful or sensitive pretraining content. It also reports harmful-data
    filtering and a PII input filter as o-series mitigations. Thresholds, implementation, yields, and stage allocation are
    unknown.
  sampling_protocol: unknown
  rollout_count: null
  temperature: null
  inference_budget: The official release exposes low, medium, and high reasoning-effort options, and the system card says
    the o-series leverages test-time compute. Token, wall-clock, allocation, and decoding budgets are unknown.
  optimizer_or_scaffold: The report identifies large-scale reinforcement learning, deliberative alignment, generated new safety
    data, and additional safety training for launched models. RL objective/algorithm, reward or verifier, optimizer, safety-data
    provenance, rollout policy, schedule, and compute are unknown.
audit:
  source_mixture: 'Only high-level source categories are disclosed: publicly available data and custom in-house datasets.
    Source identities, proportions, counts, acquisition terms, rights, revisions, and manifests are unknown.'
  split: unknown
  decontamination: unknown
  license: unknown
  lineage: 'The card supports only coarse lineage: broad pretraining sources and filtering, followed by reasoning-model reinforcement
    learning and deliberative-alignment/safety stages. Source-to-record-to-feedback-to-checkpoint lineage is unknown.'
  known_failure_modes:
  - Broad data-source categories do not establish provenance, licensing, mixture composition, benchmark-overlap controls,
    or reproducible training data.
  - The reinforcement-learning objective, reward/verifier, safety-data provenance, sampling, rollout policy, and optimization
    schedule are undisclosed.
  - Autograders, moderation/classifier criteria, and human/expert judgments are reported for evaluation; treating them as
    training rewards would be unsupported.
  - Production performance may vary with system updates, final parameters, and system-level instructions; Preparedness results
    are lower bounds that can change with elicitation, fine-tuning, rollouts, interactions, and scaffolding.
  citation_status: verified
  confidence: medium
  notes: Official OpenAI publication and PDF are directly verified. This Track 12 record preserves only category-level data
    and alignment disclosures; it is not a claim that o3-mini training data, reward contracts, or a reproducible RL recipe
    are released.
inclusion_reason: An official frontier system card that discloses broad pretraining sources, filtering, large-scale reasoning
  RL, deliberative alignment, generated safety data, and safety evaluation procedures while leaving the underlying data, reward,
  and post-training ledger materially undisclosed.
