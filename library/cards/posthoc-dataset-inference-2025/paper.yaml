one_line_summary: Shared-prefix synthetic suffixes and calibrated paired tests enable post-hoc set-level training-data inference
  without a pre-existing matched holdout.
why_it_matters: The method turns a missing-heldout problem in provenance audits into an explicit data-construction and calibration
  recipe, while its result remains conditional aggregate evidence rather than record-level lineage or legal proof.
