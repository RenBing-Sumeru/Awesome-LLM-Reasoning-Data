data_object:
  prompt_source: 99k image-question-answer pairs sampled from ten general and science-focused VQA datasets, led by ShareGPT4V,
    ChartQA, A-OKVQA, AI2D, and GeoQA+.
  trace_author: GPT-4o writes the summary, image-focused caption, step-by-step reasoning, and conclusion for each source question.
  answer_format: An image and question paired with four tagged text spans named SUMMARY, CAPTION, REASONING, and CONCLUSION;
    the conclusion must agree with the source answer.
  process_fields:
  - image reference and source dataset
  - question and original standard answer
  - tagged summary, caption, reasoning, and conclusion
  - format-validity and answer-alignment decisions
  environment_or_substrate: Static multimodal supervised records; SWIRES is a separate inference-time search over stage outputs.
  verifier_or_reward: A format parser rejects missing stage tags, then a GPT-4o judge rejects refusals or conclusions that
    differ meaningfully from the source answer.
  terminal_predicate: Retain a generated record only when all four tagged spans are present and the conclusion is judged non-refusal
    and semantically aligned with the standard answer.
recipe_metadata:
  base_model: Llama-3.2-11B-Vision-Instruct.
  teacher: GPT-4o generates all four reasoning stages and judges answer alignment; InternLM-XComposer2.5-Reward is used only
    for SWIRES experiments.
  generator: Prompt GPT-4o with the image, question, and source answer and require four ordered tagged stages in one response.
  filtering_rule: Enforce the exact tag structure, extract CONCLUSION, and reject refusals or conclusions that do not match
    the standard answer in meaning.
  sampling_protocol: Select 99k pairs from ten VQA sources; the paper does not report multiple generation rollouts per training
    item.
  rollout_count: 1
  temperature: null
  inference_budget: Dataset generation uses one structured GPT-4o response plus one answer-verification pass per candidate;
    total tokens and cost are not reported.
  optimizer_or_scaffold: Full-parameter SFT for three epochs on eight H100 GPUs with FSDP, context length 4096, train batch
    size 4, mixed precision, and seed 42.
audit:
  source_mixture: 31.3k ShareGPT4V, 17.2k ChartQA, 16.1k A-OKVQA, 11.4k AI2D, 11.4k GeoQA+, 5.6k ScienceQA, 4.0k DocVQA, 1.0k
    PISC, and 0.5k each from CLEVR and CLEVR-Math.
  split: The paper reports 99k training pairs but does not disclose a dedicated reusable validation/test split for LLaVA-CoT-100k.
  decontamination: Source benchmarks overlap the multimodal evaluation ecosystem; the paper does not report a semantic decontamination
    algorithm or overlap counts for the released training set.
  license: The official Hugging Face dataset metadata identifies Apache-2.0 and JSON records; users must also review the terms
    of the ten upstream image/VQA sources.
  lineage: Ten existing VQA sources provide image-question-answer seeds; GPT-4o adds ordered rationale spans and performs
    answer-alignment filtering before Llama-3.2-Vision SFT.
  known_failure_modes:
  - Agreement with the source final answer cannot establish that the intermediate caption or rationale is faithful.
  - A single GPT-4o family supplies both traces and semantic filtering, allowing correlated errors to survive.
  - SWIRES can hallucinate or get lost when the image exceeds the model's visual understanding, as the authors state.
  citation_status: verified
  confidence: high
  notes: Full 17-page arXiv paper, official ICCV 2025 CVF record, public repository, Apache-2.0 JSON dataset metadata, release
    usage, and exact ablations were checked on 2026-07-14.
inclusion_reason: LLaVA-CoT-100k serializes multimodal target behavior into four explicit rationale stages, publishes the
  records, and shows how they are filtered and consumed by SFT.
