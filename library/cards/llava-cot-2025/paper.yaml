one_line_summary: LLaVA-CoT-100k turns 99k VQA pairs into four-stage summary-caption-reasoning-conclusion demonstrations for
  multimodal SFT.
why_it_matters: It exposes a compact, inspectable target schema for teaching a VLM to organize perception and reasoning before
  answering.
