data_object:
  prompt_source: 260K image-question records drawn from public mathematical, chart/document, science, medical, natural-world,
    and general visual-question-answering datasets.
  trace_author: GPT-4o, Qwen2-VL-7B, Llama-3.2-11B-Vision-Instruct, and Qwen2-VL-72B jointly propose and score nodes through
    Collective Monte Carlo Tree Search.
  answer_format: A ShareGPT-style image conversation whose assistant target contains an image description, rationales, numbered
    reasoning steps, and a final answer; the search substrate also represents positive and negative reasoning nodes.
  process_fields:
  - image references and user question
  - assistant image description and rationales
  - numbered reasoning steps and final answer
  - effective path, reflective path, and searched reasoning tree in the construction procedure
  environment_or_substrate: Static multimodal questions expanded into a question-dependent reasoning tree by CoMCTS.
  verifier_or_reward: Four MLLMs jointly score candidate nodes; nodes below threshold t=0 are pruned, UCB selects the next
    leaf, and the search stops when a ground-truth-correct path is found or the iteration cap is reached.
  terminal_predicate: Keep an effective path when it reaches the correct answer; otherwise stop after at most 20 search iterations.
recipe_metadata:
  base_model: Qwen2-VL-2B/7B, LLaVA-NeXT-8B, and Llama-3.2-11B-Vision-Instruct are separately fine-tuned as Mulberry consumers.
  teacher: GPT-4o, Qwen2-VL-7B, Llama-3.2-11B-Vision-Instruct, and Qwen2-VL-72B form the collective search group.
  generator: Each teacher expands one complete candidate continuation from the selected leaf per search iteration.
  filtering_rule: Average collective node judgments, prune nodes scoring below zero and their descendants, backpropagate values,
    and choose the highest-UCB surviving leaf.
  sampling_protocol: Search one effective path for each of 260K raw questions; sample 15K records for reflective-path training.
  rollout_count: null
  temperature: null
  inference_budget: At most 20 iterations per question, with four candidate continuations and collective node scoring each
    iteration.
  optimizer_or_scaffold: Collective SFT for two epochs, batch size 128, learning rate 1e-5 except 5e-6 for Qwen2-VL-7B.
audit:
  source_mixture: 55K mathematical, 116K figure-understanding, 41K math-word-problem, 2K medical, 17K science, and 24K natural-world
    visual questions from the sources listed in Appendix A.
  split: The release is a 260K SFT corpus; the paper does not disclose a reusable train/validation split for Mulberry-260K.
  decontamination: No semantic benchmark decontamination procedure or overlap counts are reported for the many reused source
    datasets.
  license: The official Hugging Face release is Apache-2.0; upstream image and question sources retain their own terms.
  lineage: Public multimodal questions are expanded by four-model CoMCTS, converted into effective and optional reflective
    paths, serialized as ShareGPT image conversations, and consumed by collective SFT.
  known_failure_modes:
  - Collective model judgments can share correlated visual or reasoning errors, so a positive node score is not step-level
    proof.
  - Reflective paths insert a sampled negative sibling and a fixed rethink prompt, which can teach a reflection style without
    faithful error diagnosis.
  - Reused benchmark-like sources and undisclosed semantic decontamination make evaluation overlap a material audit risk.
  citation_status: verified
  confidence: high
  notes: The full paper, official NeurIPS 2025 proceedings page, official repository, Apache-2.0 Hugging Face release metadata,
    ShareGPT field mapping, source mixture, exact ablations, and current adoption signals were checked on 2026-07-14.
inclusion_reason: Mulberry-260K publishes multimodal rationale and reflection demonstrations authored by collective tree search,
  exposes their SFT record format, and measures both search selection and downstream training effects.
