one_line_summary: Goedel-Prover-V2 builds Lean proof models through verified whole-proof SFT, compiler-error self-correction
  data, scaffolded theorem synthesis, hybrid GRPO, and model averaging; public models and evaluation artifacts exist, but
  the core S1/S2/S3 training records are not released.
why_it_matters: For the frontier disclosure track, it exposes how theorem statements, long proof traces, compiler feedback,
  and verifier rewards enter distinct post-training stages while preserving the gap between formal acceptance, semantic faithfulness,
  and release completeness.
