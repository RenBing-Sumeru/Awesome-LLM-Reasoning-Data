one_line_summary: ModeX selects an existing open-ended response by recursively isolating a dense n-gram-similarity cluster
  and returning its maximum-degree centroid; ModeX-Lite applies the same idea during decoding.
why_it_matters: It supplies the rollout/search/test-time trace track with a deterministic selection recipe whose graph and
  pruning decisions can be audited separately from task scores, while modal consensus remains weaker than correctness verification.
