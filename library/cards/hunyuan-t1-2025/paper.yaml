one_line_summary: Hunyuan-T1 reports that 96.7% of post-training compute went to RL over broad science-and-reasoning problems,
  with curriculum, replay/reset, ground-truth feedback, and T1-preview-plus-reward-model preference scoring, but releases
  none of the underlying training records or reward implementation.
why_it_matters: 'It is a compact disclosure-ledger case: several system-level post-training components are named, yet the
  data object, verifier semantics, reward aggregation, stage accounting, rights, and reproducibility artifacts remain unknown.'
