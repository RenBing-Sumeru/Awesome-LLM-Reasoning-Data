one_line_summary: DeepDiver trains 7B policies on WebPuzzle with live-web iterative-RAG GRPO, using answer judgments and a
  conditional search bonus to study how search depth changes with information demand.
why_it_matters: It makes search queries, retrieved evidence, stopping decisions, and episode rewards relevant rollout data
  for the rollout/search/test-time trace track, while leaving live-web drift and artifact availability as explicit audit limits.
