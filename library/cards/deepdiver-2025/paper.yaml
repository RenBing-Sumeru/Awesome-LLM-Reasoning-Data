data_object:
  prompt_source: Wiki-corpus pages and real-user queries with retrieved webpages from a deployed smart-assistant service;
    open-web pages support Cross-Page QA and Open Riddle generation, while Wiki pages support Wiki Riddle generation.
  trace_author: LLMs generate WebPuzzle questions, answers, checklists, and difficulty labels; five experts curate the 275-example
    test set; DeepDiver policies generate iterative-RAG RL rollouts.
  answer_format: A question followed by alternating reasoning, one-to-five search queries per tool-call round, top-two retrieved
    results per query, and a final answer.
  process_fields:
  - question
  - reference_answer
  - checklist
  - difficulty_label
  - reasoning
  - search_queries
  - retrieved_documents
  - final_answer
  - grader_outcome
  - format_reward
  - accuracy_reward
  - extra_search_reward
  environment_or_substrate: Live open-web iterative RAG using Bocha for Chinese settings and LangSearch for English settings;
    only the top two results per query are retained.
  verifier_or_reward: Qwen-Turbo loose and strict answer graders use the reference answer and checklist; GRPO combines their
    accuracy judgment with format reward and a conditional +1.0 reward for successful search-enabled rollouts.
  terminal_predicate: The policy emits the answer action or reaches the maximum of seven tool-call rounds.
recipe_metadata:
  base_model: Qwen2.5-7B-Instruct and Pangu-7B-Reasoner.
  teacher: DeepSeek-R1 supplies cold-start SFT responses and four-trial pass@4 difficulty labels.
  generator: LLM-based Cross-Page QA and riddle generation for WebPuzzle, followed by policy-generated iterative reasoning/search
    rollouts in the live-web environment.
  filtering_rule: LLM filtering removes offensive, politically sensitive, ethically concerning, NSFW, ambiguous, controversial,
    multiple-choice, boolean, and unsolvable candidates; the 7,000-example training mixture is sampled by pass@4 difficulty
    category.
  sampling_protocol: Each RL sample receives 14 rollouts at temperature 0.9; each rollout permits at most seven tool-call
    rounds, each round emits one to five queries, and only the top two search results per query are retained.
  rollout_count: 14 per RL sample
  temperature: '0.9'
  inference_budget: Maximum seven tool-call rounds and 20k-token sequence length in the reported 7B experiments.
  optimizer_or_scaffold: Cold-start SFT followed by one epoch of iterative-RAG GRPO; batch size 32, learning rate 1e-6, KL
    coefficient 0.001, with retrieved tokens masked from the policy loss.
audit:
  source_mixture: WebPuzzle contains 23,684 training and 275 expert-curated test examples; cold-start SFT also uses 300 real-user
    questions, 2,200 general-reasoning problems, and 1,000 real-user queries concatenated with retrieved documents.
  split: Of 7,000 selected WebPuzzle examples, 2,000 enter the 5,500-example cold-start SFT mixture and 5,000 are reserved
    for RL; the 275-example test set is curated from 500 seeds by five experts.
  decontamination: unknown
  license: unknown; the paper says WebPuzzle will be released after privacy and safety review, but no released dataset or
    license was verified.
  lineage: Wiki/open-web pages and deployed-assistant queries -> LLM-generated questions, answers, and checklists -> LLM safety/quality
    filtering -> DeepSeek-R1 pass@4 difficulty tags -> selected SFT/RL mixtures -> live-web iterative-RAG rollouts -> Qwen-Turbo/format/extra-search
    rewards -> GRPO updates.
  known_failure_modes:
  - Live search results and engine behavior can drift; no retrieval snapshot was verified.
  - Qwen-Turbo judgments depend on prompts, reference answers, and checklists and are not correctness proofs.
  - DeepSeek-R1 pass@4 difficulty tags can inherit teacher and grader errors.
  - Real-user-query consent, webpage provenance, decontamination, and redistribution rights are undisclosed.
  - Experiments are limited to 7B models and 20k-token sequences, and DeepDiver can over-search even on simple questions.
  - No reusable code, WebPuzzle release, trained model, or rollout corpus was verified.
  citation_status: verified
  confidence: high
  notes: The final NeurIPS proceedings title, nine-author list, and Huawei Language Model Lab affiliation supersede the differing
    arXiv v1 metadata.
inclusion_reason: WebPuzzle and DeepDiver expose a concrete live-web trajectory object and a judgment-based RL feedback contract
  for studying adaptive search intensity.
