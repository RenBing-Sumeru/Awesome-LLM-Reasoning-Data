data_object:
  prompt_source: 1,147 difficult pairwise preference cases re-curated from public sources including HelpSteer3, PPE, and RewardBench2,
    covering IF, STEM, CODE, SAFE, and CHAT.
  trace_author: RubricBench authors and expert rubric annotators as described in arXiv:2603.01562 and the official repository.
  answer_format: Each record contains case_id, instruction, response_a, response_b, A/B label, domain, source, and expert
    atomic rubrics derived from the instruction.
  process_fields:
  - case_id
  - instruction
  - response_a
  - response_b
  - label
  - domain
  - source
  - rubrics
  environment_or_substrate: Rubric-aware pairwise preference evaluation over text/code/math/safety/chat responses.
  verifier_or_reward: Official evaluator script compares a submitted A/B prediction with the gold label and reports overall
    and grouped accuracy.
  terminal_predicate: Prediction equals the benchmark gold A/B label; missing or invalid prediction handling follows the official
    evaluator.
recipe_metadata:
  base_model: Not a training recipe; this Card treats RubricBench as an evaluation and rubric-audit surface.
  teacher: Expert human rubrics and benchmark gold A/B labels supplied by the official RubricBench release.
  generator: Candidate cases are selected from existing preference benchmarks; rubrics are written from the instruction and
    decomposed into atomic criteria.
  filtering_rule: Filter for hard preference cases involving complex inputs, output surface bias, and process failures; exclude
    response-aware rubric writing.
  sampling_protocol: Pin arXiv version, Git commit or Hugging Face snapshot, domain grouping, prompts, model versions, and
    evaluator revision before score comparison.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation budget is model/prompt specific; do not infer a training budget from benchmark scores.
  optimizer_or_scaffold: rubric-aware judge/reward-model meta-evaluation
audit:
  source_mixture: 'Official sources checked: arXiv abstract/HTML for paper metadata; official GitHub repository for schema,
    evaluator, examples, and MIT code license; official Hugging Face dataset page for released data artifact.'
  split: Official repository exposes the benchmark records and reports grouped accuracy by IF/STEM/CODE/SAFE/CHAT; downstream
    comparisons should pin snapshot and any train/dev/test or public split policy used by the artifact.
  decontamination: The benchmark is public and re-curated from public preference sources, so future model training contamination
    and upstream benchmark overlap must be audited before leaderboard-style claims.
  license: Official GitHub repository is MIT licensed; dataset and upstream-source redistribution terms still require artifact-level
    review before reuse beyond evaluation.
  lineage: 'Primary paper: https://arxiv.org/abs/2603.01562 ; code/evaluator: https://github.com/planepig/rubricbench ; data:
    https://huggingface.co/datasets/DonJoey/rubricbench'
  known_failure_modes:
  - A/B accuracy can be high even when generated rubrics are incomplete or not faithfully executed.
  - Scores change with prompt wording, model version, rubric formatting, invalid-output policy, and evaluator snapshot.
  - Evaluation-only labels and rubrics should not be reused as reward-training data without separate license, contamination,
    and feedback-contract checks.
  citation_status: verified
  confidence: medium
  notes: Official sources verify 1,147 cases, public code/evaluator, Hugging Face data artifact, and MIT code license. Dataset-level
    license/upstream redistribution terms and exact split/version policy remain reuse checks.
