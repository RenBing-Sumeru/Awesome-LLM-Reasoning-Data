one_line_summary: ScaleEnv synthesizes 16 database-backed domains and 2,560 verifiable tasks for large-batch GRPO, but the
  environments, rollouts, rewards, code, checkpoints, reset mechanism, and replay manifests are not verified as released.
why_it_matters: It links scalable environment generation to executable verification and OOD agent training while exposing
  the distinction between a documented recipe and a reusable, licensed, replayable environment/trajectory corpus.
