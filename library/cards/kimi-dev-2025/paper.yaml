data_object:
  prompt_source: Mid-training mines merged GitHub pull requests from repositories with at least five stars and removes repositories
    overlapping SWE-bench. Cold-start and RL use SWE-Gym, SWE-bench-extra, and R2E-Gym tasks; agent adaptation uses a reported
    5,016 public SWE-smith trajectories.
  trace_author: Qwen2.5-72B-Instruct, lightly tuned on 2,000 DeepSeek-R1 trajectories, writes exact-localization reasoning.
    Synthetic agent interactions simulate file-tool observations without shell execution. DeepSeek-R1 20250120 produces BugFixer/TestWriter
    cold-start traces; Kimi-Dev generates RL rollouts.
  answer_format: Training objects include issue/PR context paired with SEARCH/REPLACE patches, commit packs, localization
    rationales, simulated file-tool conversations, BugFixer patches, TestWriter tests, Docker execution outcomes, binary rewards,
    and agent trajectories.
  process_fields:
  - repository
  - base_commit
  - issue_text
  - pull_request_title
  - discussion
  - changed_files
  - patch
  - search_replace_blocks
  - localization_reasoning
  - opened_files
  - simulated_observation
  - reflection
  - task_role
  - generated_test
  - rollout
  - unit_test_result
  - binary_reward
  - positive_replay_status
  - agent_message
  - tool_call
  - tool_observation
  environment_or_substrate: The main RL substrate snapshots a repository at a task revision and runs generated patches or
    tests in Docker sandboxes on an internal Kubernetes platform. The paper reports more than 10,000 concurrent sandboxes
    and more than 25,000 images, but releases no paper-run image manifest, digests, reset/network policy, or proprietary image
    builder.
  verifier_or_reward: BugFixer receives reward 1 only when all available ground-truth unit tests pass. TestWriter receives
    reward 1 only when its test fails on the buggy repository and passes after the ground-truth fix. There is no format or
    process reward.
  terminal_predicate: A rollout is scored by the corresponding full available task test condition. Timeout, infrastructure-error,
    flaky-test, retry, partial-credit, exploit-detection, and failed-rollout archival rules are undisclosed.
recipe_metadata:
  base_model: Mid-training starts from Qwen2.5-72B-Base. The reported schedule exposes about 150B tokens, followed by DeepSeek-R1
    cold-start SFT and Agentless RL; an additional agent-trajectory adaptation study bridges the skill prior to SWE-Agent
    interaction.
  teacher: DeepSeek-R1 supplies 2,000 localization seed trajectories and cold-start BugFixer/TestWriter trajectories. Qwen2.5-72B-Instruct
    generates localization reasoning. Claude 3.7 Sonnet authored the reported public SWE-smith agent trajectories.
  generator: Qwen2.5-72B-Instruct generates exact localization; a simulated non-executing tool process generates synthetic
    interactions; DeepSeek-R1 20250120 generates cold-start traces; Kimi-Dev generates multi-rollout RL outputs.
  filtering_rule: GitHub sources require merged PRs and repositories with at least five stars; natural diffs restrict Python-centric
    files and patch size; localization traces require exact modified-file match; synthetic interactions require at least one
    correct localized file. RL initially keeps 1,200 tasks with pass@16 above zero and periodically retests 500 previously
    unsolved tasks.
  sampling_protocol: Mid-training uses batch 256, 32K maximum length, and cosine learning rate 2e-5 to 2e-6 after about 3B
    warmup tokens. Each RL iteration has five training steps and samples 1,024 problems with 10 rollouts each; the prompt
    pool changes every 20 iterations and later training replays recent positives.
  rollout_count: 10,240 rollouts per reported RL iteration. The total iteration count, total rollouts, cold-start sample count,
    and failure-retention count are unknown.
  temperature: Agent-adaptation evaluation uses temperature 0 for pass@1 and temperature 1 for pass@2/pass@3. Test-time self-play
    uses temperature 0 for the first patch/test and temperature 1 for the remaining 39. Training rollout temperature is unknown.
  inference_budget: Main Agentless RL uses 64K context. Agent adaptation trains at 64K and evaluates up to 128K or 100 turns.
    Test-time self-play samples 40 patches and 40 tests per issue.
  optimizer_or_scaffold: Mid-training uses next-token prediction over about 150B token exposures. RL uses the Kimi k1.5 REINFORCE-like
    policy-gradient formulation with an average multi-rollout reward baseline; other optimizer, clipping, KL, and compute
    details are unknown.
audit:
  source_mixture: About 90B pre-upsampling tokens comprise 50B natural diffs, 20B PR commit packs, 10B exact-localization
    reasoning, and 10B synthetic agent interactions; the 20B synthetic components are upsampled four times to yield about
    150B exposures. Cold-start and RL mixture counts are incomplete.
  split: 'The Docker development pool totals 9,873 tasks: 2,356 SWE-Gym, 3,846 SWE-bench-extra, and 3,671 R2E-Gym-Lite. Exact
    task IDs, repository revisions, train/validation partitions, and the immutable 5,016-trajectory adaptation split are not
    released.'
  decontamination: The report excludes repositories overlapping SWE-bench from GitHub mid-training, but gives no repository
    list, matching normalization, fork/mirror handling, semantic-clone audit, base-model exposure audit, or equivalent cold-start/RL/teacher-output
    analysis.
  license: The repository and released weights are MIT subject to the Qwen2.5-72B license; public SWE-smith trajectories are
    labeled MIT. These labels do not resolve rights or attribution for GitHub issues, PRs, commits, tests, dependencies, or
    teacher-generated derivatives.
  lineage: Stage-level lineage is described, but immutable source revision -> filtered record -> generated trace -> Docker
    image/test result -> reward -> replay decision -> checkpoint identifiers are absent.
  known_failure_modes:
  - Passing all available task tests is a binary observable, not proof of semantic correctness.
  - Generated tests and patches from one model family can create correlated self-play bias.
  - The 200-trajectory skill-prior adaptation point degrades, which the authors attribute to possible mode collapse.
  - Initial pass@16 filtering and late positive replay bias training toward already-solvable successes.
  - Synthetic mid-training interactions use simulated observations and cannot certify executable repository behavior.
  - Missing image digests, dependency locks, runtime policies, and flaky-test rules prevent exact Docker reproduction.
  - Repository-level SWE-bench exclusion does not address forks, mirrors, semantic clones, base-model exposure, or task-derived
    teacher traces.
  - The reported 5,016 SWE-smith rows lack an immutable revision, while the current mutable release has a different row count.
  - Failed rollout retention and infrastructure-failure treatment are unknown.
  - Removing contributor signatures and GitHub IDs reduces attribution and provenance.
  citation_status: verified
  confidence: high
  notes: Verified from the official arXiv report, Moonshot project, official repository/resources, and official Hugging Face
    release. Evaluation JSONL files are not represented as the training corpus, and the benchmark harness is not represented
    as the unreleased paper-run environment.
inclusion_reason: Kimi-Dev provides an unusually concrete bridge from patch-centered skill-prior data to Docker-verified repository
  RL and later agent adaptation, while exposing major environment, split, lineage, licensing, and release-completeness gaps.
