one_line_summary: Kimi-Dev turns GitHub patch and simulated file-tool data into an Agentless skill prior, then applies full-test-suite
  binary RLVR and a reported 5,016-trajectory agent bridge, but withholds the training corpus, Docker provenance, exact splits,
  failures, and adapted checkpoint.
why_it_matters: It separates patch skill acquisition from environment-grounded RL and agent adaptation, making the paper useful
  both as a construction recipe and as an audit case for executable software-engineering data.
