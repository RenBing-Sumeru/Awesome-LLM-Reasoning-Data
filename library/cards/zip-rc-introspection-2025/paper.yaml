one_line_summary: ZIP-RC reuses reserved logits to predict reward and remaining length without an extra inference pass, then
  allocates prefix-tree search by utility.
why_it_matters: It makes the reward–cost estimate itself an in-model inference object instead of paying for a separate verifier
  pass at every search decision.
