data_object:
  prompt_source: DeepScaleR, MATH training split, and GSM8K training split; evaluations use AIME 2024, AMC 2023, MATH-500,
    and GSM8K.
  trace_author: Qwen3-1.7B, LFM2-1.2B Math, and LFM2-350M Math.
  answer_format: Token prefixes with a predicted joint distribution over terminal reward and remaining length, plus prefix-tree
    search actions.
  process_fields:
  - prompt
  - prefix
  - reward_bin
  - remaining_length_bin
  - joint_prediction
  - meta_action
  - selected_completion
  - compute_cost
  environment_or_substrate: Parallel prefix-tree decoding with a compute-and-latency-aware meta-MDP.
  verifier_or_reward: A learned verifier supplies rollout reward labels; the ZIP head predicts reward and remaining length
    from reserved logits.
  terminal_predicate: A completed sample is selected at the search horizon under a chosen utility trade-off.
recipe_metadata:
  base_model: Qwen3-1.7B, LFM2-1.2B Math, and LFM2-350M Math.
  teacher: On-policy rollout labels scored by a learned verifier.
  generator: The ZIP-RC augmented language model.
  filtering_rule: Maximize a utility combining expected best reward, expected total compute, and expected latency; prune or
    branch prefixes accordingly.
  sampling_protocol: Reserve output-vocabulary logits for a reward-length grid, predict the grid at each prefix, then choose
    a multiset of prefixes to expand.
  rollout_count: Roughly 100k labeled on-policy rollouts across models for training; evaluation caps ZIP-RC sampling at eight
    samples in matched-cost comparisons.
  temperature: See official repository and paper for model-specific decoding.
  inference_budget: Normalized compute and best-case latency, combined by a configurable generation-cost coefficient.
  optimizer_or_scaffold: ZIP auxiliary prediction plus ZIP-RC sampling utility over a prefix-tree meta-MDP.
