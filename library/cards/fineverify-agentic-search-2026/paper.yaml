one_line_summary: FineVerify turns each sampled agent trajectory into sub-question-level checks, enabling a more reliable
  selection policy as the test-time trajectory budget grows.
why_it_matters: It shows that adding trajectories is useful only when the selector can inspect their multi-claim evidence
  rather than rely on a single confidence score.
