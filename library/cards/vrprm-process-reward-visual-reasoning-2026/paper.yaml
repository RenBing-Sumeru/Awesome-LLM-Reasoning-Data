one_line_summary: VRPRM uses a small set of teacher-written visual CoT reviews to initialize process reasoning, then scales
  with ordinary step labels through RL for efficient multimodal reward modeling.
why_it_matters: It cleanly separates expensive explanatory supervision from cheaper process labels and releases the former
  as a reusable training set.
