data_object:
  prompt_source: Visual reasoning problems, images, candidate rationales, and process annotations.
  trace_author: Claude-3.7-Sonnet generates long-horizon CoT PRM reviews over selected VisualPRM400K examples.
  answer_format: A visual problem, candidate solution, explicit review reasoning, stepwise scores, and a terminal judgment.
  process_fields:
  - image
  - candidate_rationale
  - stepwise_scores
  - terminal_judgment
  environment_or_substrate: Multimodal PRM training and Best-of-N response selection.
  verifier_or_reward: Structured step-score labels support SFT; format and process-accuracy rewards support GRPO on non-CoT
    PRM data.
  terminal_predicate: The final process judgment and step scores match the reference annotations.
recipe_metadata:
  base_model: Qwen2.5-VL-7B in the original reported setup; later release includes other VRPRM checkpoints.
  teacher: Claude-3.7-Sonnet for synthetic CoT-PRM reviews.
  generator: Strong-model visual reasoning reviews over candidate solutions.
  filtering_rule: Discard outputs that fail the required format or disagree with reference labels.
  sampling_protocol: Select roughly 10K labeled examples, synthesize and filter 3.6K CoT-PRM records for SFT, then use about
    50K non-CoT process-labeled examples for RL.
  inference_budget: The paper reports temperature 0.2 and 4096 maximum tokens for reasoning, then temperature 0 for final
    scoring.
  optimizer_or_scaffold: LoRA SFT followed by GRPO reinforcement learning.
  rollout_count: null
  temperature: 0.2
audit:
  source_mixture: VisualPRM400K-derived visual problems, candidate rationales, Claude-generated CoT reviews, and ordinary
    process labels.
  split: VRPRM3.6K is the released CoT SFT dataset; consult the official collection for its file layout.
  decontamination: Keep test benchmark images and questions out of the corresponding training examples.
