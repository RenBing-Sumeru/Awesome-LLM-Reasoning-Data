one_line_summary: NVIDIA Nemotron Nano V2 VL discloses a five-stage multimodal SFT schedule, weights, an 8.15M-row dataset,
  and OCR tooling, but the public release is not reconciled with the 39.49M-sample inventory or exact stage lineage.
why_it_matters: It shows how to audit a frontier report by separating reported training consumption, model-card inventory,
  released artifacts, and evaluation evidence instead of treating a broad release statement or benchmark result as a complete
  data recipe.
