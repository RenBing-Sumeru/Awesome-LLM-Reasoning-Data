one_line_summary: SiriuS turns terminally successful interactions into per-role SFT records and repairs failed QA episodes
  through critique, regeneration, rephrasing, and downstream replay, but does not release the libraries.
why_it_matters: It operationalizes outcome-supervised multi-agent self-improvement while exposing coarse credit assignment
  and absent failure/library provenance.
