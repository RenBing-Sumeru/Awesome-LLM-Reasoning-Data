data_object:
  record_type: Successful multi-agent episodes decomposed into role-conditioned SFT records; successfully repaired failures
    contribute regenerated selected-role and downstream messages.
  prompt_source: College Physics from MMLU/GPQA/TheoremQA, Chemistry from MMLU/GPQA, PubMedQA labeled data, and three configured
    negotiation games; exact row manifests are absent.
  trace_author: Specialized GPT-3.5-turbo-0125, GPT-4o-mini-2024-07-18, or Llama-3.2-3B-Instruct agents; an external LLM critic
    writes ground-truth-conditioned repair feedback.
  answer_format: Free-form role messages ending in parsed multiple-choice, numeric, yes/no, or game moves.
  process_fields:
  - task_input
  - agent_role
  - role_instruction
  - predecessor_messages
  - original_response
  - terminal_outcome
  - selected_agent
  - critic_feedback
  - regenerated_response
  - rephrased_response
  - successor_messages
  - repaired_outcome
  environment_or_substrate: Python orchestration for sequential QA, Actor-Judgment-Critic, and negotiation games with provider-hosted
    inference and OpenAI SFT.
  verifier_or_reward: Mixed final-answer/game-utility checks plus LLM critic and learned Judgment feedback.
  terminal_predicate: QA parsed answer equals ground truth; repaired trajectory retained only after successor replay succeeds;
    games use utility and terminal state.
  provenance: benchmark/game input -> multi-agent rollout -> terminal evaluation -> direct success or feedback repair -> role
    SFT -> next iteration.
  release_surface: Current repository releases code, prompts, games, and five MMLU-physics input rows, but no paper-run experience
    libraries, full trajectories, failures, feedback, logs, or checkpoints.
recipe_metadata:
  base_model: GPT-3.5-turbo-0125, GPT-4o-mini-2024-07-18, and Llama-3.2-3B-Instruct.
  teacher: No teacher for direct successes; repaired failures use a critic privileged with the correct answer.
  generator: Each role samples from task and predecessor outputs; repair regenerates one selected role then all successors.
  filtering_rule: All role messages from terminal successes are retained; repaired selected/downstream roles are retained
    only if final correctness is restored.
  sampling_protocol: Full directed graph at temperature 0; retry maxima maxsol, maxf, and maxre are symbolic but undisclosed.
  rollout_count: Paper reports outcomes for 212 physics, 128 chemistry, and 500 PubMedQA training tasks per backbone; exact
    role-row counts are unknown.
  temperature: 0
  top_p: unknown
  inference_budget: Current code commonly caps 4,096 response tokens; total compute/cost and retries are unknown.
  selection_threshold: Symbolic epsilon is undisclosed; released QA code operationalizes parsed final-answer equality.
  seed_protocol: unknown
  buffer_policy: Separate per-role/per-iteration success libraries; deduplication, balancing, persistence, and exact cardinalities
    are unknown.
  optimizer_or_scaffold: Independent role-specific SFT through OpenAI Fine-tuning API; complete hyperparameters and provider
    defaults are unknown.
audit:
  source_mixture: Public benchmark pools and configured games; no row-level immutable source ledger.
  split: Physics 212/107, chemistry 128/65, PubMedQA 500/500; IDs, revisions, seed, ordering, and duplicate policy absent.
  decontamination: unknown
  benchmark_overlap: No exact/semantic train-test or pretraining-contamination audit.
  license: Current code MIT; supplement unlicensed; upstream repositories currently MIT but revisions unpinned; derived trajectories
    and fine-tuned models have no stated license.
  lineage: Exact paper-run records, feedback, iteration membership, provider fine-tune IDs, and models are not released.
  release_version: Inspected commit 16643cdc484b07d4d20419ba785a32a9845639b7 postdates proceedings; no tags/releases or paper
    commit.
  trajectory_scale: 1,446 initial successes plus 444 repaired failures across nine QA cells equals 1,890 case-level episodes,
    not role-row count.
  successful_and_failed_sample_retention: Only successes and successfully repaired failures train; unrepaired failures and
    paper-run provenance are absent.
  privacy_or_consent: unknown
  known_failure_modes:
  - Terminal success labels every upstream role message good despite lucky or flawed reasoning.
  - Credit assignment across agents is unresolved.
  - Rephrasing erases mistake and feedback provenance.
  - Judgment false decisions can damage correct answers or preserve wrong ones.
  - Parsers are format brittle.
  - Splits and contamination evidence are unpinned.
  - Retry budgets, epsilon, SFT settings, seeds, IDs, and cost are incomplete.
  - Scripts contain placeholder paths and inconsistent conventions.
  - No experience library, failure ledger, weights, logs, dataset card, tag, or immutable manifest is public.
  citation_status: verified
  confidence: high
  notes: Verified against NeurIPS final paper, supplement, arXiv, OpenReview ID, current repository, license, code, and five-row
    sample.
  remaining_unknowns:
  - exact source IDs and revisions
  - retry limits and epsilon
  - per-role rows and iteration membership
  - paper code commit
  - fine-tuned model identifiers and compute
  - derived-data license and contamination audit
inclusion_reason: SiriuS is a strong multi-agent construction recipe converting terminal outcomes into role-specific SFT libraries
  and repairing failed episodes, with a central gap between its selection contract and absent trajectory release.
