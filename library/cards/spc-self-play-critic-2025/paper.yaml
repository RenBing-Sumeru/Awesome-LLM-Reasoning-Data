status: partial
one_line_summary: SPC bootstraps a step critic and error generator, then creates solver-filtered adversarial traces and binary
  rewards over two self-play rounds.
why_it_matters: It turns model-generated corruptions and game outcomes into renewable verifier-training data, while exposing
  solver dependence, co-adaptation, and gated-release risks.
