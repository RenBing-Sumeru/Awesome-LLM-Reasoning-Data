data_object:
  prompt_source: Pre-training is described by modality-pair categories; Thinker instruction fine-tuning uses text, visual,
    audio, and mixed-modality conversations. Sources, prompts, counts, and rights are unknown.
  trace_author: The report describes generated good and bad speech sequences for Talker preference tuples but does not identify
    their generator, checkpoint, or decoding procedure.
  answer_format: Thinker uses ChatML user/assistant conversations with multimodal context. The disclosed Talker preference
    tuple contains input text x, good generated speech y_w, bad generated speech y_l, and reference speech.
  process_fields:
  - input_text
  - multimodal_context
  - assistant_text_response
  - reference_speech
  - preferred_generated_speech
  - dispreferred_generated_speech
  environment_or_substrate: Three-stage multimodal pre-training; Thinker instruction fine-tuning; and Talker context continuation,
    DPO, and multi-speaker instruction fine-tuning.
  verifier_or_reward: Talker preference samples are ranked using reward scores associated with word error rate and punctuation-pause
    error; computation, weights, thresholds, calibration, and errors are undisclosed.
  terminal_predicate: The report discloses the ranking signals but not acceptance thresholds, pair-retention rules, or released
    preference records.
recipe_metadata:
  base_model: The LLM is initialized from Qwen2.5, the vision encoder from Qwen2.5-VL, and the audio encoder from Whisper-large-v3;
    exact checkpoint versions and all training settings are incomplete.
  teacher: unknown
  generator: Generated good and bad Talker speech sequences are named, but their generator/model, prompts, and decoding settings
    are unknown.
  filtering_rule: For Talker DPO, pairs are ranked by reward scores associated with WER and punctuation-pause error. Other
    filtering and selection rules are unknown.
  sampling_protocol: Phase-2 pre-training reports 800B image/video, 300B audio, and 100B video-with-audio tokens. Preceding
    stages use a maximum length of 8,192 and the final stage uses 32,768; post-training counts and sampling settings are unknown.
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: Thinker instruction fine-tuning; Talker context continuation, DPO, and multi-speaker instruction
    fine-tuning. Optimizer settings and DPO hyperparameters are unknown.
audit:
  source_mixture: The report names image-text, video-text, video-audio, audio-text, and text corpora, and gives Phase-2 modality-token
    totals. Source names, proportions, manifests, licences, and provenance are unknown.
  split: No training, validation, test, or preference-pair split membership is disclosed for the reported construction data.
  decontamination: No decontamination or overlap protocol is disclosed for the reported pre-training or post-training data.
  license: The official code repository is Apache-2.0. The report does not disclose rights or licences for pre-training, instruction,
    reference-speech, or preference-pair data.
  lineage: Initialization lineage for the LLM and encoders is disclosed. Item-level data lineage, generated-speech lineage,
    and the relation of public weights to the reported data are unknown.
  known_failure_modes:
  - The report says label noise and pronunciation errors in pre-training data can lead to hallucinations.
  - Training, instruction, preference, reference-speech, and rejected-output records are not released.
  - WER and punctuation-pause reward scoring cannot be independently audited without its formula, calibration, and false-ranking
    analysis.
  - Source provenance, per-source rights, splits, and contamination controls are undisclosed.
  citation_status: verified
  confidence: medium
  notes: Official technical report, Qwen release blog, and Qwen repository verified. This is a partial data-disclosure record,
    not a released multimodal post-training recipe.
inclusion_reason: Frontier multimodal technical report that discloses modality-level pre-training totals, ChatML instruction
  data types, and a WER/punctuation-ranked DPO interface while leaving source, reward, and audit details incomplete.
