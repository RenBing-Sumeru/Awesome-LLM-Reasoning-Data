one_line_summary: A 47,198-prompt synthetic constraint suite is used to compare independent RS pairs with shared-prefix MCTS
  pairs and isolate the effects of pair contrast and prompt difficulty on DPO.
why_it_matters: It converts preference-data design choices into controlled experimental variables, while the absence of released
  prompts, pairs, verifiers, trees, and rejects demonstrates the gap between a documented recipe and an auditable open release.
