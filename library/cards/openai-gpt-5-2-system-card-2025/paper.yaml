data_object:
  prompt_source: 'Training repeats GPT-5''s three broad source classes: public internet, partner-accessed information, and
    information provided or generated by users, trainers, and researchers. Evaluation objects include production-derived conversations,
    pre-release A/B traffic, prompt-injection attacks, biological questions, cyber challenges, internal PRs, Kaggle tasks,
    paper replications, and research bottlenecks. Agent JSK and PlugInject are training-data splits; cyber-safety evaluation
    is explicitly non-overlapping.'
  trace_author: GPT-5.2-specific training CoT generation, retention, selection, and use are unknown. Evaluation-only records
    include internal CoTs, responses, tool/action trajectories, CoT-monitorability rollouts, and pre-release A/B traffic.
  answer_format: No training schema is released. Evaluation records may contain prompt/conversation, response, internal CoT,
    tools/actions, final artifact, grader/monitor result, and hidden-test, secret-flag, rubric, policy, or pass/fail outcome.
  process_fields:
  - broad_training_source_class
  - prompt_or_conversation
  - model_response
  - internal_chain_of_thought
  - tool_output
  - agent_action_or_command
  - final_answer_or_artifact
  - policy_or_llm_grader_result
  - cot_monitor_label
  - hidden_test_or_environment_outcome
  - evaluation_sampling_stratum
  environment_or_substrate: Training substrate is unknown. Evaluation uses simulated connectors/function calls, browsing and
    blocklists, cyber sandboxes/ranges, internal repositories with hidden tests, Kaggle GPUs, paper-replication environments,
    and internal-code containers. Deployment safeguards are not training environments.
  verifier_or_reward: Reasoning RL and purpose-level cyber-safety training are named without reward/verifier details. Evaluation
    separately uses policy/LLM graders, classifiers, rubrics, CoT monitors, humans, secret flags, hidden tests, pass metrics,
    and medal thresholds; none is established as a training reward.
  terminal_predicate: Training termination is unknown. Evaluation predicates include all hidden tests passing, at least one
    of 16 Cyber Range trials succeeding, secret-flag retrieval, pass@1/pass@12, and rubric completion.
recipe_metadata:
  base_model: GPT-5.2 family includes Instant, Thinking, and Pro; architecture, parameters, checkpoints, corpus, stage allocation,
    and variant differences are unknown.
  teacher: unknown
  generator: unknown
  filtering_rule: Training filtering repeats GPT-5-level quality/risk, personal-information reduction, and safety-classifier
    language without rules or yields. Evaluation has task-specific hard-case selection, saturation removal, cheating checks,
    and subsets.
  sampling_protocol: Training sampling is unknown. Evaluation includes hard production cases, pre-release A/B traffic, 16
    cyber rollouts/trials, a 30-competition MLE subset, and a 10-paper PaperBench subset.
  rollout_count: Training rollouts unknown; selected cyber evaluations use 16 attempts.
  temperature: unknown
  inference_budget: Training compute unknown. Evaluation includes xhigh reasoning, a 1,000-token CoT-Control boundary, 1,000-turn
    external cyber tasks, 24-hour MLE-Bench with some 100-hour experiments, and tool-enabled agents.
  optimizer_or_scaffold: Reasoning RL and cyber-safety training are disclosed only at purpose level; algorithm, reward, verifier,
    optimizer, stages, weights, rollouts, schedules, compute, and lineage are unknown.
audit:
  source_mixture: No GPT-5.2 source granularity beyond GPT-5's three classes; manifests, weights, counts, dates, provenance,
    consent, yields, and rights are unknown.
  split: No global ledger. Prompt-injection evals overlap training; cyber-safety is non-overlapping; selected virology/Gryphon/TroubleshootingBench
    claims are narrowly held out or uncontaminated.
  decontamination: No global corpus, benchmark, traffic, code, or internal-evaluation audit; narrow overlap/non-overlap claims
    cannot be generalized.
  license: No training data, CoTs, cyber corpus, traffic sample, internal tasks, hidden tests, graders, weights, or full suite
    is released with reuse terms.
  lineage: Only broad sources -> filtering -> reasoning RL -> cyber-safety training -> evaluations -> deployment safeguards
    is visible; item and checkpoint lineage is unknown.
  known_failure_modes:
  - Training source and RL disclosure mostly repeats GPT-5 rather than adding a GPT-5.2 recipe.
  - Prompt-injection evals are training-data splits and do not test unseen attacks.
  - Cyber non-overlap and biological held-out claims are narrow, not global.
  - Hard production sampling is not average prevalence.
  - CoT monitors and graders have calibration, label-mismatch, false-positive/negative, and length-confounding risks.
  - Preparedness environments, graders, budgets, and hidden tests are evaluation contracts, not training signals.
  - Deployment safeguards cannot be attributed to model training alone.
  - The living page adds 2026 CoT evidence absent from the immutable 2025 PDF.
  citation_status: verified
  confidence: high
  notes: Verified from the 27-page 2025 PDF, launch page, and living Safety Hub retrieved 2026-07-24. The CoT section is explicitly
    a 2026-04-24 update and is not backdated.
inclusion_reason: A disclosure-delta entry adding explicit prompt-injection overlap, narrow non-overlap/held-out claims, production
  and agent evaluation contracts, and a later CoT-monitorability audit without releasing training records or rewards.
