one_line_summary: GPT-5.2 repeats GPT-5's coarse source/reasoning-RL disclosure but adds explicit overlap boundaries, production
  and agent evaluation contracts, and a dated CoT-monitorability audit without releasing training records or rewards.
why_it_matters: It prevents production samples, hidden tests, graders, CoT monitors, and deployment safeguards from being
  mistaken for GPT-5.2 training data.
