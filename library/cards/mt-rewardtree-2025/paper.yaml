one_line_summary: MT-RewardTree turns top-2 translation-token branches and three COMETKiwi-scored rollouts per node into 8,652
  prefixed training pairs and a 1,200-pair benchmark, while releasing only selected pairs rather than the raw search trees.
why_it_matters: It exposes a concrete recipe for converting token-level search and trajectory values into PRM preference supervision
  and reward-guided decoding, while showing that metric dependence, hidden rejected rollouts, split ambiguity, and unresolved
  source/model licensing can bound reuse.
card: null
card_recommendation: Recommended for an evidence-backed bilingual L4_chinese_review_ready Card centered on token-level approximate
  MCTS, sibling preferences, released pair/benchmark schemas, and PRM/test-time use; preserve raw-tree absence, COMET-family
  judge risk, split/lineage/license gaps, and final-ACL versus preprint authorship drift. Keep Review state new and do not
  promote beyond L4 before human review.
