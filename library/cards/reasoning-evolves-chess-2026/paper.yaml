one_line_summary: Releases a 120M-token chess SFT dataset and code spanning filtered Llama 4 Maverick responses, programmatic
  alpha-beta-style search traces, and engine-derived best-move and best-line targets, then studies their downstream RL behavior.
why_it_matters: It exposes concrete Track 5 data objects—accepted teacher responses and verbalized, engine-valued search paths—while
  documenting the selection contract and the boundary that rejected pools, sampling parameters, and raw-position provenance
  are still incomplete.
