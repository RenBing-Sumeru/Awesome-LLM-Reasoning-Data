one_line_summary: Releases 54,845 full terminal-search RL rollouts for CodeScout-14B and CodeScout-4B, preserving grouped
  attempts, component localization rewards, and 8,281 zero-reward failures rather than publishing only successful trajectories.
why_it_matters: It exposes how repository-search attempts, a patch-derived terminal verifier, multiple rollouts, and asynchronous
  GSPO interact, while the count mismatch, incomplete groups, missing replay lineage, and absent data license show exactly
  what an auditable agent-trajectory release still needs.
