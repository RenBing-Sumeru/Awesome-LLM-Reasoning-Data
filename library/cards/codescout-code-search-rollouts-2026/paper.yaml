  notes: Full arXiv v1 and Appendices A-H, official non-archival workshop page and OpenReview attachment, GitHub commit 34789dcb21cc9e6595c2d27ad832f69ab146006f,
    HF rollout commit 65a3599683b901be691621f9eab7cd932a9a2c5f, processed task commit b1e6864f1c847455ea64c7ebdb4164da2b902bb6,
    all Parquet metadata, and all released scalar reward/group columns were checked on 2026-07-25. Reported benchmark gains
    are author-reported and not independently reproduced.
inclusion_reason: 'CodeScout releases a rare auditable RL agent data object: grouped repository-search attempts with full
  terminal conversations, structured terminal predictions, component rewards, training-step indices, and both successful and
  zero-reward siblings, making rollout retention, verifier design, training budgets, and replay gaps directly inspectable.'
