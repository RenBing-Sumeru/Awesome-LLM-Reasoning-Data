one_line: RACE-bench describes 528 Docker-backed feature-addition tasks with FTP/PTP patch tests and five structured reasoning
  references, but no official benchmark artifact release, split/decontamination audit, or reusable judge package was verified.
one_line_summary: RACE-bench describes 528 Docker-backed feature-addition tasks with FTP/PTP patch tests and five structured
  reasoning references, but no official benchmark artifact release, split/decontamination audit, or reusable judge package
  was verified.
why_it_matters: It evaluates both what a repository agent changes and how its run maps to issue understanding, localization,
  tasks, and implementation steps, exposing a richer feedback contract than pass/fail tests alone. The same design also shows
  why synthetic references, post-hoc trace normalization, single-reference alignment, and missing release controls must be
  audited before treating benchmark records as training data.
