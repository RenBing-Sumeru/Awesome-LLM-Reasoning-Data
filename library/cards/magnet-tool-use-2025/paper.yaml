status: partial
one_line_summary: MAGNET synthesizes graph-derived multi-turn function-call episodes and positive/negative trajectory pairs
  for SFT and mDPO, but the paper does not release the traces, executable environment, or replay metadata needed to audit
  the recipe end to end.
why_it_matters: 'It makes the data-construction interface unusually explicit: function dependencies, calls, outputs, teacher
  hints, SFT errors, and preference pairs are separate objects. The absence of released episodes, API versions, prompts-as-executed,
  licenses, and full verifier audits prevents treating the published scores as evidence of a reusable dataset.'
