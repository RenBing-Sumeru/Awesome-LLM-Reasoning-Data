inclusion_reason: 'MAGNET is a documented construction recipe for multi-turn function-call trajectories: it exposes a graph-derived
  tool substrate, executable reference calls, teacher-conditioned positive episodes, and contrastive negative episodes for
  SFT plus mDPO. It belongs to environment and agent trajectory data because the unit is a multi-turn interaction with calls
  and observations.'
