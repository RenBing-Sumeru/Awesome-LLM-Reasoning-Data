one_line_summary: The paper shows that stratifying a limited verification budget by cost can outperform stronger globally
  shared adaptive policies when uncertainty signals are not comparable across strata.
why_it_matters: 'It gives a negative result with a practical remedy: optimizing a stronger global allocator cannot fix feedback
  signals whose reliability differs systematically by cost regime.'
