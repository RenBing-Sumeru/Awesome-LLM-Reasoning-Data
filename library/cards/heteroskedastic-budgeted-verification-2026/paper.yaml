data_object:
  prompt_source: MBPP programming problems and MATH mathematical reasoning problems.
  trace_author: Qwen3-8B, LLaMA3-8B, and GPT-4o-mini produce answers whose uncertainty signals and verification outcomes are
    logged.
  answer_format: Each record combines token-level uncertainty proxies, an ex-ante cost proxy, a realized verification cost,
    an error label, a verification decision, and a budgeted hit-rate outcome.
  process_fields:
  - prompt
  - answer
  - uncertainty_proxies
  - cost_proxy
  - realized_cost
  - error_label
  - allocation_decision
  - hit_rate
  environment_or_substrate: Budgeted execution-based verification for MBPP and answer-matching verification for MATH.
  verifier_or_reward: Unit-test feedback on MBPP and answer matching on MATH; policies are assessed by error hit rate under
    a fixed verification-cost budget.
  terminal_predicate: A candidate is selected for costly verification only when its policy score passes the applicable budget-aware
    threshold.
recipe_metadata:
  base_model: Qwen3-8B, LLaMA3-8B, and GPT-4o-mini.
  teacher: No teacher model; verified error labels provide online feedback to adaptive policies.
  generator: The evaluated language model generates the candidate answer and token-level confidence signals.
  filtering_rule: Compare global and cost-stratified policies that select candidates for verification under the same budget
    cap.
  sampling_protocol: Evaluate 10 random seeds at verification-budget fractions of 10%, 20%, 30%, and 50%.
  rollout_count: Not presented as multi-rollout generation; each allocation decision concerns whether to spend verification
    compute on an observed candidate.
  temperature: Not specified in the paper.
  inference_budget: A fraction beta of the total realized verification cost, with policies sharing the same cap.
  optimizer_or_scaffold: Threshold, mirror-prox global adaptation, partially stratified mirror-prox adaptation, and cost-stratified
    thresholding.
