one_line_summary: DAPO couples a 17K integer-answer math prompt recipe with rule-scored online rollouts, dynamic group filtering,
  token-level loss, and length shaping, but the current public split and source lineage require audit before reuse.
why_it_matters: 'For the Data Construction and Open Release track, DAPO shows that the effective RLVR dataset is not only
  the prompt file: answer transformation, verifier behavior, rollout multiplicity, prompt-group filtering, sequence-length
  shaping, and release version jointly decide which tokens receive gradient.'
