one_line_summary: Agent-RLVR collects test-verified software-agent trajectories and teacher-guided reattempts, then reuses
  same-task positive/negative pairs for SFT, offline DPO, and a test-time patch reward model.
why_it_matters: For the rollout/search/test-time trace track, it exposes how repository states, execution outcomes, guidance,
  reattempts, and pairwise patch feedback can be joined into training and selection records, while leaving the underlying
  dataset and trajectories unreleased.
