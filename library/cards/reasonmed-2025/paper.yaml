one_line_summary: Routes nine candidate paths per medical MCQ through answer-key-conditioned verification and easy/medium/difficult
  repair, then releases three unequal SFT views totaling 1,111,555 rows.
why_it_matters: Provides a concrete high-risk-domain construction recipe whose open rows also expose judge dependence, missing
  lineage, count reconciliation, and medical-validity limits.
