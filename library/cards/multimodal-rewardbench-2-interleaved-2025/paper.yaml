data_object:
  prompt_source: Twenty-one source tasks and newly created practical prompts.
  trace_author: Twenty-three models and agents generate candidates; human experts annotate preferences.
  answer_format: Interleaved text/image prompt, two multimodal responses, chosen side, source metadata, and human annotations.
  process_fields:
  - pair_id
  - prompt_content
  - response_a
  - response_b
  - chosen
  - human_annotations
  environment_or_substrate: Text-to-image, image editing, interleaved generation, and multimodal reasoning.
  verifier_or_reward: Human-expert consensus, curated with ensemble filtering, selects the preferred response.
  terminal_predicate: A reward model selects the human-preferred multimodal response.
recipe_metadata:
  base_model: Multimodal LLM judges and reward models under a standardized evaluation protocol.
  teacher: Human experts provide consensus preference labels.
  generator: Twenty-three frontier models and agents supply candidate outputs.
  filtering_rule: Ensemble filtering retains pairs with strong human-expert agreement.
  sampling_protocol: Use all four 1,000-pair test subsets and retain task-specific modality structure.
  inference_budget: Interleaved images and text increase evaluation context and judge cost.
  optimizer_or_scaffold: Official scripts generate judgments and compute task and aggregate accuracy.
audit:
  source_mixture: 4,000 expert-annotated preference pairs across four task categories.
  split: Each of text-to-image, image editing, interleaved generation, and reasoning has a 1,000-pair test subset.
  decontamination: The release is benchmark-only and explicitly should not be used for training models.
  license: CC BY-NC 4.0; third-party prompt and image content carries separate terms.
  lineage: CVPR 2026 paper, Meta FAIR MMRB2 repository, and hosted Hugging Face dataset.
