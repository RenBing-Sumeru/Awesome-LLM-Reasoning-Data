one_line_summary: MobileRL combines 97.9k action-only SFT steps, 23.6k reasoning-SFT steps, and online Android rollouts over
  3,103 training tasks with mixed terminal verification, length shaping, positive replay, and failure filtering.
why_it_matters: 'It turns the trajectory distribution itself into a dynamic post-training object: scarce difficult successes
  are replayed, low-advantage failures are pruned, repeatedly unsolved tasks are removed, and two different verifier regimes
  determine which mobile behaviors receive policy gradients.'
