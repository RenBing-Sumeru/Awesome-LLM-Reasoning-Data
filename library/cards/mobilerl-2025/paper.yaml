data_object:
  object_type: A three-stage mobile-agent training recipe combining action-only expert demonstrations, reasoning-augmented
    SFT records, and online Android state-action trajectories with terminal binary outcomes, length-shaped rewards, replay
    flags, and task-difficulty histories.
  prompt_source: Reasoning-free and reasoning SFT use AndroidControl plus human-annotated/mobile self-exploration records.
    Online RL uses 2,000 AndroidWorld training tasks created by varying task content and initial state and 1,103 model-expanded
    AndroidLab training tasks manually checked for feasibility and test non-overlap.
  trace_author: Human annotators and selected model-driven exploration supply action-only demonstrations; an off-the-shelf
    Instruct model bootstraps and iteratively refines reasoning-action candidates that must match expert actions; the current
    policy generates online RL rollouts. The identities and revisions of the reasoning bootstrap model and proprietary reward-labeling
    VLMs are undisclosed.
  task_record:
  - natural-language instruction
  - initial Android application state
  - source benchmark and partition
  - screenshot and compressed XML observation
  - available atomic GUI actions
  - task-specific success mechanism or learned reward path
  episode_fields:
  - task instruction
  - current screenshot
  - compressed XML hierarchy
  - optional reasoning text
  - action type and arguments
  - next screenshot and XML state
  - ordered interaction history
  - terminal Finish or horizon outcome
  - binary task success
  - SPA-adjusted trajectory reward
  - group-relative advantage
  - replay-buffer membership or failure history during training
  action_space: Bounding-box-aligned Tap and Long Press, Type, directional Swipe, Launch, Back, Home, Wait, and terminating
    Finish operations over AndroidLab/AndroidControl-style mobile interfaces.
  observation: At every turn the policy receives the current device screenshot and a compressed XML accessibility hierarchy.
    XML preprocessing removes off-screen or redundant nodes, simplifies attributes, merges text and content descriptions,
    and retains bounds; this representation can omit interactable elements in some public apps.
  answer_format: A multi-turn trajectory of screenshot/XML states, optional reasoning, and structured GUI actions ending in
    Finish or the 50-turn horizon, followed by an environment or VLM-derived binary outcome and an SPA-shaped reward.
  process_fields:
  - observation state
  - reasoning and action
  - environment transition
  - terminal binary reward
  - trajectory length
  - shortest successful length within the task group
  - SPA reward
  - group-relative advantage
  - AdaPR replay selection
  - FCF task failure count and sampling status
  verifier_or_reward: AndroidWorld training tasks use rule-based verifiable rewards. AndroidLab generated training tasks lack
    ground-truth tests, so a VLM reward model fine-tuned from strong proprietary-VLM majority labels over task descriptions,
    screenshot sequences, XML/page states, and action descriptions supplies a binary outcome. SPA rescales successful trajectory
    rewards by relative path length before GRPO.
  verifier_output: Binary success/failure at the episode level; AndroidLab's selected GLM-4.1V-9B-Thinking reward model reports
    86% accuracy on a curated 1,000-trace verified set. SPA converts successful outcomes into length-adjusted scalar rewards,
    while failures remain zero.
  reward: Sparse terminal `0/1` task outcome, transformed for successful trajectories by SPA using the ratio between each
    path length and the shortest successful path for the task; group-relative advantages are then attached to the trajectory's
    action tokens for policy optimization.
  terminal_predicate: An episode ends when the agent chooses Finish in a successful state or when the configured horizon is
    reached; rollout configuration sets a maximum of 50 turns. The reward verifier, rather than Finish alone, determines success.
  provenance: AndroidControl and sanitized human/mobile exploration records -> reasoning-free SFT (97.9k steps) -> action-matching
    reasoning bootstrap and refinement -> reasoning SFT (23.6k steps) -> online rollouts on 2,000 AndroidWorld and 1,103 AndroidLab
    tasks -> rule-based or learned binary outcome -> SPA reward shaping -> AdaPR positive replay and negative pruning plus
    FCF task cooldown/removal -> GRPO policy updates.
  environment_or_substrate: Interactive AndroidWorld and AndroidLab environments running through hundreds of Dockerized Android
    virtual devices across multiple machines. The paper reports support for over 1,000 environments but stable concurrent
    sampling up to 256 rollouts under its hardware setup.
  release_shape: The official repository currently exposes an MIT-licensed evaluation framework, patched/pinned AndroidWorld
    dependencies, AndroidLab evaluation code, Docker configuration, and scripts; Hugging Face exposes the MobileRL-9B checkpoint
    under Apache-2.0. The SFT corpora, 3,103 RL training tasks, training implementation, replay buffer, reward-model checkpoint/data,
    and complete successful/failed rollout corpus are not released.
recipe_metadata:
  base_model: Qwen2.5-VL-7B-Instruct for MobileRL-7B and GLM-4.1V-9B-Base for MobileRL-9B.
  teacher: An undisclosed off-the-shelf Instruct model generates reasoning-action candidates; undisclosed strong proprietary
    VLMs produce three binary labels and reasoning traces for AndroidLab reward-model training.
  generator: Human annotation and model-driven mobile self-exploration create action demonstrations; the Instruct teacher
    adds reasoning candidates; the warmed-up policy generates online rollouts in AndroidWorld and AndroidLab.
  prompt_task_source: AndroidControl training partitions and sanitized human/mobile exploration for SFT; randomized AndroidWorld
    task templates and initial states for 2,000 RL tasks; model-expanded and manually verified AndroidLab tasks for 1,103
    RL tasks.
  sampling_protocol: Online RL samples 16 trajectories per task group at temperature 1.0 with a 50-turn cap and 4,096 maximum
    new tokens. AndroidWorld complexity analysis uses eight test trials at temperature 1.0; reported test and ablation results
    are averaged over three runs.
  temperature: 1.0
  rollout_count: 16 samples per RL task group; total generated rollout count and retained/rejected episode counts across training
    are not disclosed.
  inference_budget: Maximum prompt length 16,384 tokens, maximum response/new-token length 4,096, maximum 50 turns, image
    bounds 65,536 to 5,000,000 pixels in the reported full-resolution configuration. Stable sampling reached 256 parallel
    rollouts; the paper reports more than 10 minutes per step and more than 25 hours for 100 training steps.
  search_or_scaffold: Two-stage warm-up followed by AdaGRPO in a Verl-based multi-task, multi-turn framework with Dockerized
    AVD sampling. Policy input combines screenshot and compressed XML; actions use bounding-box grounding.
  filtering_rule: Reasoning candidates are retained only when their action matches the expert action, then iteratively refined.
    AndroidLab tasks are manually checked for feasibility and test non-overlap; AndroidWorld training tasks with test-identical
    content and initial state are removed. AdaPR inserts top-advantage trajectories, negative pruning randomly discards lowest-advantage
    rollouts to cap the positive-to-negative ratio at 1:2, and FCF down-weights or removes persistently all-zero tasks.
  selection_threshold: AdaPR replay buffer size is 256 with mixture coefficient gamma=1.0 and top-trajectory fraction kappa=0.25.
    An FCF task with all-zero rewards for two consecutive epochs enters a three-epoch cooldown with weight exp(-f) and is
    then permanently removed if failure persists.
  optimizer_or_training_scaffold: AdaGRPO/GRPO with FSDP, learning rate 1e-6, PPO micro-batch size 4 per GPU, train/validation
    batch size 256, one PPO epoch, gradient clipping 1.0, clip ratio 0.2, KL coefficient 0.001, and SPA alpha=1.0.
  user_simulator: null
audit:
  source_mixture: 'Reasoning-free SFT has 97.9k steps: AndroidControl Low 21.3k, AndroidControl High 14.3k, and human annotation/self-exploration
    62.2k. Reasoning SFT has 23.6k steps: 7.2k, 4.1k, and 12.2k from the same source groups. RL uses 2,000 AndroidWorld and
    1,103 AndroidLab tasks; exact rollout counts and mixture schedules by backbone are not released.'
  split: AndroidWorld derives 2,000 training tasks after removing instances whose specific content and initial state coincide
    with 116 evaluation tasks. AndroidLab manually verifies 1,103 generated training tasks for feasibility and non-overlap
    with 138 evaluation tasks. AndroidControl exposes 74,714 train, 690 validation, and 8,444 test samples, with subsets transformed
    for the two SFT stages.
  decontamination: The paper reports AndroidWorld removal of exact content-plus-initial-state collisions and manual AndroidLab
    test non-overlap checks. It does not report semantic/template deduplication, cross-source overlap, evaluated-model pretraining
    overlap, or contamination checks against other public GUI datasets.
  benchmark_overlap: AndroidControl training data enters both SFT stages and its distinct test split is used for offline evaluation;
    AndroidControl is not used in the RL stage. AndroidWorld and AndroidLab provide both constructed training tasks and separate
    evaluation tasks, making the disclosed split controls central to interpreting results.
  lineage: Stage-level source counts, task-construction rules, reward paths, and major filtering rules are disclosed. Record-level
    SFT/task ancestry, teacher request metadata, generated candidate sets, replay membership, failure/removal histories, environment
    snapshots, and immutable training manifests are not public.
  license: The arXiv v2 manuscript is CC BY 4.0, the official repository is MIT at inspected HEAD 82f3b7e9028098f0683b97dbe228bad300a55fb1,
    and the Hugging Face model card marks MobileRL-9B Apache-2.0 at revision 3415b64eb7ba1289475d7a93e96a26276f644ba9. These
    licenses do not establish reuse rights for unreleased SFT data, RL tasks, rollouts, reward labels, or third-party app
    content.
  release_version: Official repository HEAD 82f3b7e9028098f0683b97dbe228bad300a55fb1 and Hugging Face model revision 3415b64eb7ba1289475d7a93e96a26276f644ba9
    were inspected on 2026-07-20. The GitHub repository has no formal release/tag connected to the paper training run and
    publishes evaluation rather than the paper's training pipeline.
  version_drift: Current arXiv v2 reports full-resolution MobileRL-9B results of 80.2% on AndroidWorld and 53.6% on AndroidLab;
    Table 6 also preserves earlier compressed-image results of 75.8% and 46.8%. Artifact-based reproduction must state the
    image-resolution configuration.
  verifier_or_judge_failure_modes:
  - The AndroidLab reward model reaches 86% accuracy on 1,000 verified traces, leaving a measured 14% error rate on that set
    and no disclosed class-conditional false-positive/false-negative breakdown.
  - Strong proprietary VLM majority labels can transfer correlated judge bias into the GLM-4.1V-9B-Thinking reward model;
    the authors explicitly report less stable AndroidLab curves and unsatisfactory cases.
  - SPA rewards short successful paths but can favor verifier-satisfying shortcuts if the binary terminal judge misses collateral
    changes, unsafe actions, or incomplete user intent.
  - AdaPR selectively amplifies high-advantage successes, while negative pruning and FCF suppress failures and persistently
    unsolved tasks; this improves efficiency but can narrow task/behavior coverage and hide important failure modes.
  - Screenshot/XML state, app/version drift, emulator timing, image compression, inference engine, and judge/API revisions
    can change both rollouts and outcomes; the repository warns that 1–2 percentage-point evaluation fluctuations are common.
  successful_and_failed_sample_retention: Training uses fresh on-policy trajectories, replays selected high-advantage successes,
    prunes low-advantage negatives to maintain at most a 1:2 positive-to-negative ratio, and cools down/removes persistently
    failing tasks. The public artifacts do not retain the complete successful, failed, pruned, replayed, truncated, or removed
    episode population.
  privacy_or_consent: 'The paper describes pre-storage sanitation of screenshots and XML: regex masking of textual identifiers
    plus face, QR-code, and OCR-text detection/obfuscation in images. Detection accuracy, residual-risk evaluation, annotator
    recruitment/consent/compensation, and the sanitized corpus itself are not released.'
  security: Training/evaluation occurs in Android emulators, but no comprehensive permission, credential, network, malicious-content,
    prompt-injection, collateral-action, or data-exfiltration audit is reported. Public-use apps with login and unreliable
    reset are excluded, so real-device safety and state-restoration behavior remain untested.
  citation_status: verified
  confidence: high
  notes: Treat MobileRL as an evidenced online-training recipe with released evaluation code and a model checkpoint, not as
    an open trajectory/replay/training-code release. Current v2 supersedes the earlier 500k/71.4k data-count wording and separates
    full-resolution 80.2/53.6 results from compressed-image 75.8/46.8 results.
  remaining_unknowns:
  - exact identities, revisions, prompts, decoding settings, and request manifests for the reasoning bootstrap teacher and
    proprietary reward-labeling VLMs
  - complete record-level provenance and licenses for human annotations, self-exploration records, transformed AndroidControl
    items, and generated AndroidLab tasks
  - complete online rollout counts, replay-buffer contents, per-task difficulty histories, rejection/pruning/removal logs,
    and policy/environment checkpoints
  - training implementation, exact paper-era code commit, optimizer state, distributed topology, environment images, APK/app
    versions, emulator/OS hashes, random seeds, and result manifests
  - AndroidLab reward-model training data, checkpoint, calibration split, confusion matrix, robustness tests, and independent
    false-positive/false-negative audit
  - semantic/template-level cross-source deduplication and evaluated-model pretraining contamination analysis
  - data- and trajectory-specific reuse terms plus rights for screenshots, XML, app content, and proprietary-VLM labels
  - privacy-filter recall, residual sensitive-data audit, annotator governance, mobile permission boundaries, and prompt-injection/security
    evaluation
inclusion_reason: 'MobileRL makes trajectory selection and task sampling part of the learning signal: online Android episodes
  receive programmatic or learned terminal outcomes, SPA length shaping, AdaPR positive replay, negative pruning, and FCF
  failure-driven curriculum decisions. It belongs in the environment-agent track because environment state, action history,
  verifier type, replay policy, and dropped failures jointly determine what behavior is reinforced.'
