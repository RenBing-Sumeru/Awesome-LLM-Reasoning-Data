data_object:
  prompt_source: Mathematical reasoning tasks drawn from the training corpus described in the paper.
  trace_author: Teacher and student models produce incorrect, repaired, and freshly restarted solutions.
  answer_format: An erroneous solution, its first erroneous step, a reflection connection, and a correct continuation or fresh
    correct solution.
  process_fields:
  - incorrect_solution
  - error_step
  - reflection_connection
  - correct_solution
  environment_or_substrate: Mathematical CoT fine-tuning.
  verifier_or_reward: Final-answer correctness and an error-type-grounded augmentation procedure select error-correction pairs.
  terminal_predicate: A corrected or restarted solution reaches the correct mathematical answer.
recipe_metadata:
  base_model: See the official paper and repository for released training configurations.
  teacher: Teacher-generated correct solutions and error-aware augmentation.
  generator: Model-generated incorrect solutions, fixes, and fresh restarts.
  filtering_rule: The corpus truncates at an error and connects an error trajectory to a correct solution through model-aware
    reflection.
  sampling_protocol: Analyze error types, augment representative mistakes, then generate a repair or fresh correct solution.
  inference_budget: See the official release for sampling details.
  optimizer_or_scaffold: Supervised fine-tuning on incorrect-correct reflection connections.
