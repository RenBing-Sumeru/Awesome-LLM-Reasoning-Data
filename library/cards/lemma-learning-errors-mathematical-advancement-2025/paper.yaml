one_line_summary: LEMMA turns diverse model mistakes into error-to-correction training pairs, teaching mathematical LLMs to
  repair their own reasoning without an external critique model.
why_it_matters: It preserves the first error and its repair path, making negative reasoning evidence directly usable for training
  rather than discarding it.
