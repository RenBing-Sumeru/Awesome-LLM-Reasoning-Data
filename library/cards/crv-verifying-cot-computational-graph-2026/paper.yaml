data_object:
  prompt_source: Synthetic arithmetic and Boolean expressions plus GSM8K questions.
  trace_author: Llama 3.1 8B Instruct generates chain-of-thought traces that are segmented into steps.
  answer_format: Raw and annotated CoT traces with original problem, predicted and correct values, and step-level context.
  process_fields:
  - step_content
  - step_label
  - assistant_content_before
  - assistant_content_after
  - attribution_graph
  environment_or_substrate: White-box analysis of Llama 3.1 8B Instruct with trained Top-K transcoders.
  verifier_or_reward: A strict intersection of LLM-as-a-Judge and programmatic verification labels steps; graph features train
    a diagnostic classifier.
  terminal_predicate: The trace's predicted value matches the ground-truth arithmetic, Boolean, or GSM8K answer.
recipe_metadata:
  base_model: Llama 3.1 8B Instruct with MLPs replaced by trained Top-K transcoders.
  teacher: LLM-as-a-Judge plus a programmatic verifier for the released step labels.
  generator: Autoregressive CoT generations segmented into individual reasoning steps.
  filtering_rule: Only labels on which the LLM judge and programmatic verifier agree are retained for annotated synthetic
    data.
  sampling_protocol: Generate traces, segment steps, construct attribution graphs, extract graph features, and fit a diagnostic
    classifier.
  inference_budget: See the official paper and repository for attribution-graph and classifier settings.
  optimizer_or_scaffold: Circuit Tracer attribution graphs, structural feature extraction, and scikit-learn diagnostic classification.
  rollout_count: null
  temperature: null
audit:
  source_mixture: Synthetic arithmetic and Boolean tasks, GSM8K test questions, Llama CoT traces, dual verifier labels, and
    released transcoders.
  split: Raw and annotated files are organized by domain and synthetic-task complexity; preserve the provided test data for
    evaluation.
  decontamination: Do not train on the GSM8K test items used for the released verifier evaluation.
  license: The official Hugging Face dataset and GitHub repository state CC-BY-NC-4.0.
  lineage: ICLR 2026 paper, Meta FAIR official GitHub repository, and the facebook/crv Hugging Face dataset.
  known_failure_modes:
  - Attribution-graph construction is computationally intensive rather than a drop-in online verifier
  - The paper finds error signatures are domain-specific
  - The released data and evidence center on Llama 3.1 8B and structured reasoning tasks
