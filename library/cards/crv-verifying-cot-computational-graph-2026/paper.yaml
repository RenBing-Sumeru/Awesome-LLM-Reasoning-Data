one_line_summary: CRV treats a reasoning step's attribution graph as an execution trace, using its structural features to
  identify and causally repair chain-of-thought errors.
why_it_matters: It releases step-labeled traces and an explicit computational substrate, making verifier evidence traceable
  to internal graph structure rather than text alone.
