one_line_summary: DORA uses PRM quality and embedding-derived semantic uniqueness to allocate a fixed rollout budget across
  soft reasoning directions during parallel test-time search.
why_it_matters: For rollout_search_test_time_trace_data, DORA specifies which per-step scores, embeddings, affinities, allocations,
  continuations, and final votes must be logged to audit how test-time trace reuse converts a fixed budget into search outcomes.
