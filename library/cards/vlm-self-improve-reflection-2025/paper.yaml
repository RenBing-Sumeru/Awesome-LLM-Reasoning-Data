one_line_summary: R3V repeatedly samples answer-labelled multimodal CoT, trains on a latest positive, a negative-to-positive
  refinement, and three-candidate answer selection, then reuses the selector for test-time compute.
why_it_matters: It connects iterative rollout refresh, negative-context SFT and candidate-conditioned inference in one inspectable
  recipe, while showing directly that gold-answer correctness can retain unfaithful multimodal rationales and that missing
  frozen rollout/decision ledgers limit reuse.
