  notes: Verified on 2026-07-25 against the complete NAACL paper and appendices, ACL metadata/BibTeX/DOI, arXiv v1, the complete
    main-repository tree at commit 9bb4ae5820eca4f2cb3b4f6ee7e0cce4abbad6c0, all released warm-up/QA JSON files, construction/evaluation/training
