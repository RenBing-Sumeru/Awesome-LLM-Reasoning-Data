    verification are high confidence; reusable derived-data completeness remains partial.
inclusion_reason: R3V is an auditable multimodal rollout recipe that refreshes self-generated positive and negative full solutions
  across iterations, turns selected failures into refinement and three-candidate comparison contexts, and reuses the learned
  selector for test-time compute. Its own fidelity audit makes the gap between gold-answer verification and faithful rationale
  supervision a first-class Atlas risk.
