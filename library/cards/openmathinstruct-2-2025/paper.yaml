one_line_summary: OpenMathInstruct-2 packages original and augmented GSM8K/MATH problems with teacher-written solutions and
  source-or-majority proxy answers, alongside reproducible generation, decontamination, downsampling, and SFT recipes.
why_it_matters: It is a high-scale worked example of how open reasoning demonstrations are sourced, expanded, answer-filtered,
  and trained, and it shows why majority answers and dataset-level licenses still need vote, rejection, contamination, and
  provenance ledgers for trustworthy reuse.
