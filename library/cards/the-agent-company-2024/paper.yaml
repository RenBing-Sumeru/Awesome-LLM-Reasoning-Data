one_line_summary: TheAgentCompany pairs 175 simulated-company tasks with mixed checkpoint evaluators and releases model-generated
  results, screenshots, and full evaluation trajectories.
why_it_matters: It makes the full agent-data loop inspectable—prompt, environment state, action history, checkpoint feedback,
  and terminal outcome—while also exposing version drift, judge dependence, and release-rights gaps that matter before trajectories
  are reused.
