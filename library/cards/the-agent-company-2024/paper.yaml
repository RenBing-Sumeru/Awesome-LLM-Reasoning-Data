data_object:
  object_type: Versioned interactive workplace benchmark tasks plus model-generated evaluation episodes and checkpoint outcomes.
  prompt_source: Task ideas draw on O*NET 29.1 job-task lists, U.S. labor statistics, contributor domain experience, and undisclosed
    LLM brainstorming; authors manually turn them into benchmark tasks.
  trace_author: Evaluated model backbones acting through an agent harness; released trajectories are evaluation logs, not
    human demonstrations.
  task_record:
  - English task intent in `task.md`
  - weighted checkpoint specification in `checkpoints.md`
  - task-specific evaluator
  - initialization and finalization logic
  - dependency and container configuration
  episode_fields:
  - task id
  - ordered agent steps and observations
  - optional system thoughts or comments emitted by the harness
  - per-step screenshots
  - evaluator records and checkpoint scores
  - terminal result
  answer_format: A multi-step computer-use episode that may browse internal web apps, edit files/code, run terminal commands,
    and communicate with simulated colleagues before terminating.
  process_fields:
  - observation
  - action
  - environment transition
  - communication event
  - checkpoint outcome
  - screenshot
  observation: Browser/UI, terminal, code/workspace, and RocketChat-mediated colleague observations in a sandboxed local workspace
    and self-hosted intranet.
  verifier_or_reward: Mostly deterministic Python evaluators inspect final/intermediate environment state or trajectory; 51
    tasks (29%) use an LLM judge for complex or unstructured outputs, with rubrics/reference outputs.
  reward: Weighted checkpoint partial-completion score plus a binary full-completion indicator when every checkpoint passes.
  terminal_predicate: Task-specific evaluators determine checkpoint success; full completion requires all checkpoints. Agent
    exit or budget exhaustion ends an episode without implying success.
  provenance: 175 manually curated version-1.0.0 tasks; intranet content mixes manually curated mock-company material with
    real-world software-project data. Official experiment runs publish model/harness-specific episodes.
  environment_or_substrate: Dockerized local Linux workspace plus self-hosted GitLab, ownCloud, Plane, and RocketChat, with
    Sotopia-based simulated colleagues.
  release_shape: Official experiment runs under `evaluation/1.0.0/<run>/` contain a run README, per-task result JSON, per-step
    screenshots, and compressed trajectory JSON.
recipe_metadata:
  base_model: Multiple closed and open model backbones; the archival paper evaluates twelve models.
  teacher: unknown
  generator: Evaluated agents generate trajectories in the benchmark environment; paper baselines use OpenHands CodeAct +
    Browsing, with an additional OWL RolePlay comparison.
  prompt_task_source: O*NET 29.1 and labor-statistics motivation, contributor/domain-expert experience, and undisclosed LLM
    brainstorming, followed by manual task/evaluator implementation.
  sampling_protocol: One model-task execution yields one episode record in an official run; no repeated-rollout sampling protocol
    is disclosed for the primary paper tables.
  temperature: unknown
  rollout_count: One released trajectory per task instance in an experiment run; aggregate runs cover 175 tasks, but repeat
    seeds are not specified as a standard protocol.
  inference_budget: Steps are measured as LLM calls and costs use API token prices without prompt caching; a single uniform
    step/token cap across all reported harness/model configurations is unknown.
  search_or_scaffold: OpenHands CodeAct + Browsing versions 0.14.2 and 0.28.1 in the main baselines; environment access combines
    browser, terminal, code, files, and RocketChat.
  filtering_rule: No trajectory-quality filter is reported for the official baseline release; inspected results retain successful,
    partial, and zero-score episodes. Task construction includes manual review, evaluator tests, screenshot evidence, lead-author
    code review, and final double-checks.
  selection_threshold: Full success requires every checkpoint; partial score uses weighted checkpoint completion. No threshold
    selects released episodes for training.
  optimizer_or_training_scaffold: null
  environment_llm: Claude-3-5-Sonnet-20241022 for simulated colleagues and LLM-based evaluators in the paper baselines.
  construction_effort: Twenty CS students, software engineers, and project managers over two months, about 3,000 person-hours;
    some tasks required more than ten hours.
audit:
  source_mixture: Task prompts combine O*NET/labor-market motivation, contributor expertise, undisclosed LLM brainstorming,
    manual implementation, manually curated mock-company material, and real-world software-project data. Released episodes
    come from evaluated models and harnesses.
  split: No train/validation/test partition is disclosed; version 1.0.0 is presented as one 175-task evaluation set.
  decontamination: unknown
  benchmark_overlap: The paper compares with existing agent benchmarks, but no systematic prompt/code overlap or model-pretraining
    contamination audit is disclosed. Public prompts and evaluator sources create future benchmark-exposure risk.
  lineage: Paper/project -> benchmark release 1.0.0 -> task image and service backups -> model/harness run -> results, screenshots,
    and trajectory files. Per-record source ancestry and immutable image/run manifests are incomplete.
  license: Current arXiv manuscript is CC BY 4.0. Main benchmark code and environment-backup repositories declare MIT. The
    official experiments repository exposes no license; third-party services, seeded content, and screenshots require separate
    rights review.
  release_version: Benchmark release 1.0.0 was published 2024-12-20. Paper results span arXiv v1 (2024) through archival NeurIPS
    2025, while the experiments repository is a living leaderboard and should be pinned by commit/run path.
  version_drift: The 2024 v1 headline was 24.0% full success for OpenHands 0.14.2 + Claude 3.5 Sonnet; the archival paper
    reports 30.3% for OpenHands 0.28.1 + Gemini 2.5 Pro. The task count remains 175, but the evaluated model/harness set changed.
  verifier_or_judge_failure_modes:
  - LLM-judged outputs can vary with evaluator-model behavior; no independent judge-calibration corpus is released.
  - Environment/evaluator predicates may reward unintended state changes or shortcuts.
  - Published task/evaluator source can enable benchmark-specific gaming or contamination despite runtime evaluator encryption.
  - Forty-one tasks use model-simulated colleagues; the paper reports repairing an earlier ambiguous role-play behavior.
  - Service images, backups, NPC models, and judge models are additional reproducibility dependencies beyond task code.
  successful_and_failed_sample_retention: The inspected official 2024-12-17 baseline run retains trajectories/results for
    successful, partial, and zero-score tasks. Leaderboard submission instructions require trajectories, results, screenshots,
    and a README; completeness of every historical third-party run is not independently established.
  privacy_or_consent: unknown
  citation_status: verified
  confidence: high
  notes: Use 2024 as first-publication year and NeurIPS 2025 as archival venue. Do not read the living leaderboard's latest
    score as the paper's fixed result or infer labor-market automation from this non-representative task set.
  remaining_unknowns:
  - experiment-repository license and rights for trajectories/screenshots
  - immutable container and service-image digests for each published run
  - task-level source lineage and rights for real-world software-project data
  - LLM brainstorming model, prompt, rejection rate, and random seeds
  - train/dev/test split and decontamination protocol
  - independent calibration and variance of LLM-based evaluators
  - consent/redaction documentation for seeded and captured content
inclusion_reason: 'TheAgentCompany exposes an unusually complete environment-feedback boundary for long-horizon workplace
  agents: 175 task prompts, a self-hosted multi-service state space, checkpoint evaluators, terminal scores, and official
  successful/failed episode logs.'
