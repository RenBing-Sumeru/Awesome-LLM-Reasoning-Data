data_object:
  prompt_source: GSM8K-Test, GSM8K-Hard, MultiArith, and MATH500 prompts.
  trace_author: Latent reasoning backbones generate continuous hidden-state thought trajectories under stochastic dropout
    or injected Gaussian noise.
  answer_format: Question, latent thought sequence, stochastic perturbation setting, step scores, trajectory score, final
    decoded answer, and correctness label.
  process_fields:
  - question
  - latent_thoughts
  - dropout_mask
  - gaussian_noise
  - trajectory
  - step_scores
  - latent_reward
  - final_answer
  - correctness
  environment_or_substrate: Autoregressive reasoning in continuous hidden-vector space, followed by explicit final-answer
    decoding.
  verifier_or_reward: LatentRM assigns step-wise contrastive scores to latent thoughts; benchmark exact-match answers label
    rollouts.
  terminal_predicate: The decoded final answer matches the benchmark answer.
recipe_metadata:
  base_model: COCONUT and CODI with GPT-2 124M backbones, CoLaR and Latent-SFT with Llama-3.2-1B, and Render-of-Thought with
    Qwen3-VL 2B and 4B.
  teacher: Not applicable; LatentRM labels intermediate thoughts through stochastic completion outcomes.
  generator: MC Dropout samples different weight masks; additive Gaussian noise perturbs latent thoughts at every step.
  filtering_rule: LatentRM scores candidate thoughts with step-wise contrastive supervision and ranks trajectories by cumulative
    logits.
  sampling_protocol: Vary parallel samples N from 1 to 64; compare MC dropout and Gaussian noise; use best-of-N, beam search,
    and majority vote under matched budgets.
  rollout_count: N ranges from 1 to 64 for coverage curves; M stochastic completions estimate intermediate thought quality
    for LatentRM data.
  temperature: Not applicable to continuous latent sampling; control uses dropout rate p and Gaussian noise scale sigma.
  inference_budget: Parallel latent trajectories; beam size sqrt(N) is used for matched-cost beam-search comparisons.
  optimizer_or_scaffold: LatentRM scoring head trained by a step-wise contrastive objective over rollout-derived thought-quality
    labels.
audit:
