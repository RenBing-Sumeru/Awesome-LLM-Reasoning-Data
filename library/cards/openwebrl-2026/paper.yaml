one_line_summary: OpenWebRL releases 412 success-only SFT trajectories, 2,198 RL task specifications, live-browser MM-GRPO
  code, hybrid trajectory judging and model weights, while its roughly 54K online training rollouts and exact live-web replay
  remain unavailable.
why_it_matters: It makes the full causal chain from browser task and observation through actions, environment feedback, terminal
  judgment and policy optimization inspectable, while showing why task prompts, selected demonstrations and runtime online
  rollouts must be tracked as different data objects with different success balance, replay and rights risks.
