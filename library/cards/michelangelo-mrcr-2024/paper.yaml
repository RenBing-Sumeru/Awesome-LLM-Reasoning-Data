  environment_or_substrate: synthetic long-context natural-language benchmark with controlled latent structure.
  verifier_or_reward: automatic answer checking against the generated target answer.
  terminal_predicate: model answer matches the generated ground truth for the queried latent structure under the pinned prompt
    and scorer.
recipe_metadata:
  base_model: Not a training recipe; the work is a long-context evaluation framework and benchmark suite.
  teacher: synthetic generator and exact target answer define the feedback contract.
  generator: Latent Structure Queries constructs contexts that require filtering irrelevant information to recover latent
    structure.
  filtering_rule: avoid tasks that can be solved by single-needle retrieval or leaked background knowledge; pin context length
    and task generator.
  sampling_protocol: Pin arXiv version, task type, context-length buckets, prompt template, model decoding settings, and scorer.
