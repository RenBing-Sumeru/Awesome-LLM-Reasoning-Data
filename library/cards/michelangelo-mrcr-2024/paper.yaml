  prompt_source: Michelangelo Latent Structure Queries framework; MRCR is the Multi-Round Co-reference Resolution task.
  trace_author: benchmark generator creates long contexts with repeated references; evaluated models answer queries about
    latent co-reference structure.
  answer_format: long synthetic context, query about a referenced entity or structure, and exact expected answer.
  process_fields:
  - context length
  - latent-structure task type
  - synthetic context and distractors
  - query
  - model answer
