one_line_summary: A longitudinal Android benchmark of human state-action episodes for intent anticipation and preference-conditioned
  execution, with a verified gap between the paper's 21,437-episode corpus and the public 20,000-row index.
why_it_matters: It shows how user profiles, time, location, intent history, screenshots, accessibility trees, and human action
  traces can become both supervised agent data and a benchmark surface; it also exposes why episode counts, manual terminal
  judgments, privacy filtering, and live-app replay metadata must be audited before reuse.
