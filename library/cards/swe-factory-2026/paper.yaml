one_line_summary: SWE-Factory converts issue and pull-request pairs into runnable coding-agent tasks through binary-test recovery,
  four-agent Docker and test-script generation, execution feedback, and gold-patch fail-to-pass validation, then samples Kimi-K2
  trajectories for supervised fine-tuning.
why_it_matters: It demonstrates a bridge from real software changes to executable agent supervision while showing why verifier
  semantics, immutable containers, source rights, contamination checks, and row-level release lineage are part of data quality
  rather than optional documentation.
