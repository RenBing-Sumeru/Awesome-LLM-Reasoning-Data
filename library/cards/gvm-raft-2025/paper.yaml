one_line_summary: GVM-RAFT estimates per-prompt Math-Verify acceptance and accepted-response gradient magnitude from pilot
  rollouts, then reallocates a fixed online sampling budget before RAFT++ or GRPO updates.
why_it_matters: It turns rollout allocation into an auditable construction layer rather than a uniform default, while also
  showing why reproducing the result requires prompt, verifier, gradient, allocation, accepted/rejected trace, and checkpoint
  lineage that the code release does not package.
