one_line_summary: macOSWorld releases 202 resettable macOS GUI tasks with multilingual instructions, VNC screenshot/action
  episodes, task-specific executable graders, and an overlapping 29-task context-deception safety subset.
why_it_matters: It makes the environment and feedback contract auditable at task level—prompt, snapshot, preparation, action
  surface, terminal predicate, and safety event—while revealing that binary evaluators, public graders, cloud/version drift,
  and missing rollout/split provenance constrain training reuse.
