data_object:
  prompt_source: LogiQA 2.0-NLI major-premise, minor-premise, and conclusion triplets.
  trace_author: DeepSeek-R1 writes a colloquial chain of thought and final entailment answer; MegaTTS 3 synthesizes the prompt
    and response audio.
  answer_format: A sample directory with JSON fields id, user_content, answer, and label, plus aligned question.wav and answer_<label>.wav
    files.
  process_fields:
  - sample id
  - colloquialized user content
  - long chain-of-thought answer with final entailment decision
  - binary label
  - input speech audio
  - output reasoning speech audio
  environment_or_substrate: Static spoken natural-language-inference problems with text and audio inputs and text or audio
    outputs.
  verifier_or_reward: Rule rewards check final-answer formatting, exact agreement with the entailed/not-entailed label, and
    response length relative to the reference annotation.
  terminal_predicate: A rollout receives the correctness component only when its extracted final answer matches the ground-truth
    entailment label; format and length components are scored separately.
recipe_metadata:
  base_model: Qwen2.5-Omni-7B.
  teacher: DeepSeek-R1 generates the text reasoning target and MegaTTS 3 renders both sides as speech.
  generator: Colloquialize each logical triplet, generate a detailed reasoning answer, then synthesize aligned input and output
    audio.
  filtering_rule: Preserve the known LogiQA label, require a complete JSON/audio bundle, and use explicit answer-format, label-correctness,
    and length rules during reinforcement learning.
  sampling_protocol: The paper reports one released reasoning/audio target per logical instance and does not disclose alternative
    teacher rollouts per item.
  rollout_count: null
  temperature: null
  inference_budget: Dataset-generation token, sampling, and synthesis budgets are not reported; reproduction must pin the
    teacher and TTS revisions.
  optimizer_or_scaffold: Supervised fine-tuning followed by REINFORCE++ with clipped policy updates, normalized advantages,
    and a KL penalty to the SFT reference.
audit:
  source_mixture: 6,446 LogiQA 2.0-NLI instances converted from structured logical triplets into colloquial text and paired
    speech.
  split: 5,184 training, 656 test, and 606 validation samples; class counts are reported for every split.
  decontamination: Splits inherit the selected logical examples; the paper does not report a separate semantic decontamination
    audit against external audio or language benchmarks.
  license: MIT for the official Hugging Face release and repository.
  lineage: LogiQA 2.0-NLI triplet -> colloquialized prompt -> DeepSeek-R1 reasoning and final label -> MegaTTS 3 prompt/answer
    audio -> SoundMind records -> SFT and rule-reward reinforcement learning.
  known_failure_modes:
  - Synthetic speech and teacher-written chains of thought can carry artifacts that do not occur in natural spoken reasoning.
  - Exact final-label agreement and response length do not establish that each intermediate reasoning statement is faithful.
  - Reinforcement learning improves accuracy while increasing output word error rate in both speech-output settings.
  citation_status: verified
  confidence: high
  notes: Full paper, ACL Anthology record, official repository, MIT dataset metadata, an actual JSON/audio record layout,
    split counts, and exact result tables were checked on 2026-07-27.
inclusion_reason: SoundMind releases aligned spoken prompts, long reasoning targets, and final entailment labels that can
  be consumed directly by audio-language SFT and rule-reward training.
