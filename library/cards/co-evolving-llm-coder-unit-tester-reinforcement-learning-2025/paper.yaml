one_line_summary: CURE alternates one policy between coder and tester roles, using a code-by-test execution matrix and private
  gold-test anchors to train both capabilities and to rank code at test time.
why_it_matters: 'It makes the feedback lineage of code self-play unusually concrete while exposing the key boundary that no
  gold code does not mean no gold supervision: hidden tests still define coder correctness and tester rewards.'
