status: partial
one_line_summary: The study selects 10K or 50K OpenHermes and English WildChat conversations with gradient, loss, uncertainty,
  diversity, compression, random, or token-length rules, then compares Qwen2-7B and Llama3-8B SFT across five benchmark families.
why_it_matters: It tests whether sophisticated self-scoring survives million-scale pools and real compute limits, while the
  missing subset IDs, code/recipe mismatch, contamination audit, license reconciliation, and run manifest show what a credible
  negative scaling claim must release.
