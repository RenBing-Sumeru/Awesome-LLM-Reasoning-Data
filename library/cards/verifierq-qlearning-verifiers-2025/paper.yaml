one_line_summary: VerifierQ trains an utterance-level Q-value verifier offline, aiming to select stronger multistep mathematical
  solutions under a test-time compute budget.
why_it_matters: It exposes verifier training, not just generator sampling, as a scaling lever and tests it against PRM and
  majority voting.
