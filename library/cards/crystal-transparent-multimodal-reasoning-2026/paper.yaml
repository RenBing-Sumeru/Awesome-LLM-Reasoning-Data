data_object:
  prompt_source: Multimodal questions from established vision-language reasoning benchmarks.
  trace_author: Four independent MLLM generators, then a fifth-model and human quality-gated aggregation process.
  answer_format: Image, question, answer, and an ordered reference sequence of atomic reasoning steps.
  process_fields:
  - image
  - question
  - answer
  - reference_steps
  - complexity
  environment_or_substrate: Multimodal question answering and visual reasoning.
  verifier_or_reward: Match F1 and Ordered Match F1 compare generated steps to validated reference sequences.
  terminal_predicate: Correct answer together with aligned, ordered reasoning steps.
recipe_metadata:
  base_model: Four diverse MLLM families generate references; Qwen2.5-VL-3B-Instruct is used in the reported GRPO experiment.
  teacher: Four independent MLLM generators followed by a fifth model and trained human reviewers.
  generator: MLLM step generators under the Delphi-inspired reference-construction pipeline.
  filtering_rule: Semantic clustering selects representative steps; model validation and human review reject weak sequences.
  sampling_protocol: Use the official CRYSTAL dataset and repository metric implementation.
  inference_budget: Four generators produce candidate steps; exact per-instance budget is documented in the paper appendix.
  optimizer_or_scaffold: Match-F1-based causal process reward and curriculum for GRPO.
  rollout_count: null
  temperature: 1.0 for the reference generators.
audit:
  source_mixture: Multimodal benchmark items, MLLM-generated reasoning steps, model validation, and human quality gates.
  split: CRYSTAL contains 6,372 diagnostic instances.
  decontamination: The paper evaluates models not used in construction; keep CRYSTAL test items outside process-reward training.
  license: MIT for the official crystal-metrics package; confirm data-release terms on the Hugging Face dataset page before
    redistribution.
  lineage: arXiv paper, author project/repository, author academic page reporting ECCV 2026, and official Hugging Face dataset.
