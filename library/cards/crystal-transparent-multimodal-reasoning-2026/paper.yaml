one_line_summary: CRYSTAL supplies 6,372 quality-gated multimodal reference chains and order-sensitive metrics that expose
  correct answers reached through incomplete or disordered reasoning.
why_it_matters: It makes step coverage and ordering observable in multimodal evaluation instead of treating a correct final
  answer as sufficient evidence of reasoning.
