one_line_summary: MLGym releases 13 containerized ML-research tasks and a current 676-run action/observation corpus with task-specific
  evaluator scores and replay code, but repeated validation exposes test feedback, native Gym reward remains zero, and the
  release is untagged and license-mixed.
why_it_matters: It connects task/data configuration, container state, one-command agent actions, observations, intermediate
  evaluator feedback, flexible research artifacts, failures, and replay into one auditable episode object, while showing why
  a Gym interface and public trajectories do not by themselves establish a clean RL reward, held-out evaluation, deterministic
  replay, or training-safe release.
