data_object:
  prompt_source: 'OpenAI discloses only three broad training-source classes: publicly available internet information, information
    accessed through third-party partnerships, and information provided or generated by users, human trainers, and researchers.
    Prompt-level sources, proportions, dates, counts, and records are unknown.'
  trace_author: Reasoning models can produce an internal chain of thought before answering, but the authorship, generation,
    retention, and selection of any training traces are unknown.
  answer_format: The report describes model responses, internal reasoning before the final response, router decisions informed
    by model switches, response-preference rates, and measured correctness, and safe-completion outputs constrained by safety
    policy. Exact record schemas and released examples are unknown.
  process_fields:
  - training_source_class
  - model_switch
  - response_preference_rate
  - measured_correctness
  - router_decision
  - internal_chain_of_thought
  - final_response
  - safety_policy_constraint
  - evaluation_result
  environment_or_substrate: The hosted chat product uses a real-time router across gpt-5-main and gpt-5-thinking variants;
    gpt-5-thinking-pro uses parallel test-time compute. API access exposes thinking variants directly. Routing infrastructure,
    execution environments, allocation policy, tools, and numerical compute budgets are unknown.
  verifier_or_reward: The router is continuously trained on model switches, response-preference rates, and measured correctness.
    Safe-completions maximize helpfulness subject to safety-policy constraints, and a sycophancy score is reported as a training
    reward signal. Exact graders, labels, reward functions or models, weights, calibration, aggregation, and thresholds are
    unknown.
  terminal_predicate: unknown
recipe_metadata:
  base_model: GPT-5 model-family checkpoints, architecture, parameter counts, and stage allocations are unknown.
  teacher: unknown
  generator: unknown
  filtering_rule: OpenAI reports rigorous quality and risk filtering, advanced filtering to reduce personal information, and
    use of the Moderation API and safety classifiers to help exclude harmful or sensitive content. Rules, thresholds, yields,
    and retained or removed records are unknown.
  sampling_protocol: unknown
  rollout_count: unknown
  temperature: unknown
  inference_budget: gpt-5-thinking-pro uses parallel test-time compute; the number of samples, scheduling, selection, aggregation,
    and per-query budget are unknown.
  optimizer_or_scaffold: The report states that GPT-5 reasoning variants learn to reason through reinforcement learning and
    that the router is continuously trained on model switches, response-preference rates, and measured correctness. It also
    names safe-completions and targeted post-training for sycophancy and graceful failure. Optimizers, objective weights,
    rollout generation, schedules, update cadence, and checkpoint lineage are unknown.
audit:
  source_mixture: Only three broad source classes are disclosed. Source manifests, mixture weights, sample or token counts,
    time ranges, versions, opt-in handling, and source-level rights are unknown.
  split: The report identifies evaluation sets, including production-representative conversations, public benchmarks, internal
    evaluations, and red-team tasks, but does not disclose their membership or a complete training/evaluation split.
  decontamination: unknown
  license: No training dataset, router dataset, safe-completion dataset, weights, code, or item-level evaluation artifact
    is released with the official system card; source-level licenses and artifact rights are unknown.
  lineage: The report gives only stage-level lineage from broad source classes and filtering to reinforcement-learning reasoning,
    safe-completions, router signals, evaluations, and deployment safeguards. It does not provide item-level prompt-to-trace-to-feedback-to-reward-to-checkpoint
    lineage.
  known_failure_modes:
  - Training-source categories are coarse; records, proportions, provenance, rights, dates, and filtering yields are unavailable.
  - Router signals are named, but the examples, collection policy, measured-correctness procedure, objectives, update cadence,
    failure cases, and routing logs are unavailable.
  - Safe-completions and targeted post-training are described without their training examples, feedback records, graders,
    reward functions, calibration, or optimization artifacts.
  - Safety and capability evaluations are not training-data disclosure; most item-level prompts, graders, splits, and complete
    outputs are not released, and benchmark performance does not establish data quality.
  - The report does not rerun its ordinary safety evaluations for gpt-5-thinking-pro and instead treats gpt-5-thinking results
    as proxies, despite the parallel test-time-compute setting.
  - Biological and Chemical safeguards combine model training, system-level protections, account enforcement, and API controls,
    so deployment mitigation outcomes cannot be attributed to training alone.
  citation_status: verified
  confidence: high
  notes: Only official OpenAI sources for the August 7, 2025 GPT-5 launch were used. Later GPT-5 addenda and successor system
    cards are outside scope. Track 12 records partial disclosure and does not convert evaluations, benchmark scores, or deployment
    mitigations into a reusable training-data claim.
inclusion_reason: A frontier-system report that discloses broad training-source classes, reinforcement-learning reasoning,
  real-time router feedback signals, safe-completions, and parallel test-time compute while leaving the underlying records,
  reward contracts, split, and lineage unavailable.
