one_line_summary: The GPT-5 System Card discloses broad source classes, reinforcement-learning reasoning, continuous router
  training on model switches, preference rates, and measured correctness, safe-completions, and parallel test-time compute,
  but not the underlying records or reproducible reward and data contracts.
why_it_matters: It offers a useful Track 12 ledger of a routed frontier system while making visible the boundary between post-training
  disclosure, safety evaluation, deployment safeguards, and benchmark evidence.
