one_line_summary: The paper formalizes when Best-of-N overoptimizes imperfect reward models and proposes InferenceTimePessimism,
  a chi-squared-regularized rejection sampler evaluated across math, science, and instruction-following tasks.
why_it_matters: It separates rollout coverage, proxy reward, true evaluation, candidate budget, and rejection decisions, exposing
  the fields needed to audit test-time selection traces instead of treating a final benchmark score as data-quality evidence.
