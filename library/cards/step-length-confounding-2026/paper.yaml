status: partial
one_line: ASLEC corrects first-token-driven step-length confounding in probability-ranked reasoning-data selection and tests
  the corrected 4K/10K subsets across multiple target models.
one_line_summary: ASLEC corrects first-token-driven step-length confounding in probability-ranked reasoning-data selection
  and tests the corrected 4K/10K subsets across multiple target models.
why_it_matters: It shows that a widely used naturalness score can encode a structural length artifact rather than reasoning
  quality, while its official code and data make the correction inspectable even though exact experiment manifests and decision
  lineage remain incomplete.
