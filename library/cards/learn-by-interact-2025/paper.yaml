data_object:
  record_type: Environment-specific instruction-subtrajectory pairs, where each trajectory is an alternating sequence of observations
    and actions; no official serialized corpus was found.
  prompt_source: Human-authored documentation, tutorials, FAQs, and SWE-bench-Lite Python files are crawled as seed resources.
    Claude-3.5-Sonnet samples three task instructions per document.
  trace_author: Claude-3.5-Sonnet acts in each benchmark environment to produce raw trajectories. The same model constructs
    new summary-style or purpose-abstraction instructions from contiguous subtrajectories.
  context_state:
  - environment and current observation
  - generated task instruction
  - complete action-observation interaction history
  - environment-specific action space and stopping condition
  record_schema:
    instruction: A backward-constructed natural-language summary or abstracted purpose for the observed subtrajectory, which
      may differ from the initial task.
    trajectory: A contiguous sequence (observation_i, action_i+1, observation_i+1, ..., action_j, observation_j).
    provenance: Environment family and source documentation are described at aggregate level; per-record document URLs, crawl
      timestamps, environment versions, generator revisions, and stable record IDs are undisclosed.
    quality_metadata: Adjacent duplicate-state removal and unanimous Claude/Gemini committee acceptance are described, but
      per-record judge rationales, votes, scores, rejection reasons, and original-task success labels are unavailable.
  record_counts:
    documents:
      swe_bench: 6464
      webarena: 3578
      osworld: 7362
      spider2_v: 11231
      total: 28635
    raw_trajectories:
