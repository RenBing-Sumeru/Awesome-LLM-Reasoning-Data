      total: 1456808
    filtered_examples:
      swe_bench: 101523
      webarena: 109276
      osworld: 103526
      spider2_v: 125683
      total: 440008
  rejected_records: Counts can be derived from Table 1, and the appendix shows selected detour and repeated-state cases, but
    the complete rejected set is not released.
  downstream_conversion: For SFT, each instruction-trajectory pair is converted to next-action prediction examples. For training-free
    use, whole examples are retrieved as demonstrations at each agent step.
  released_payload: The paper reports aggregate counts and selected examples and prompts; no official machine-readable trajectories,
    training examples, rejected examples, or record manifest were found.
recipe_metadata:
  source_resources: SWE-bench-Lite non-repeated Python files plus public documentation for GitLab, Google Maps, Amazon, Reddit,
    Chrome, GIMP, LibreOffice, Ubuntu, Thunderbird, VLC, VS Code, dbt, Dagster, Astronomer, Airbyte, Superset, Metabase, Snowflake,
    BigQuery, and JupyterLab.
  environment_families:
  - SWE-bench-Lite
  - WebArena
  - OSWorld
  - Spider2-V
  generator_model: Claude-3.5-Sonnet
  generator_revision: unknown
  instruction_budget: three task instructions per source document
  interaction_budget: One raw trajectory per generated instruction, terminated by the agent's stop action or the environment
    maximum-step limit; benchmark-specific maximum steps are undisclosed.
  backward_construction: Enumerate every contiguous observation-action subtrajectory and ask the LLM to produce either a step
    summary or an abstraction of its purpose, yielding quadratic candidate growth in trajectory length.
  verifier: Remove consecutive repeated action-observation states, then retain a pair only when both Claude-3.5-Sonnet and
    Gemini-1.5-Pro judge it coherent, natural, reasonable, and aligned with its constructed instruction.
  verifier_revisions: unknown
  selection_threshold: unanimous two-model committee acceptance
  sampling:
    temperature: 0
    top_p: unknown
    random_seed: unknown
  icl_retrieval: Retrieve up to five observation-based matches and five model-based dense matches per step. An LLM writes
    the dense query from the current instruction, history, and observation; stella_en_1.5B_v5 is the retriever.
  sft_format: Convert accepted instruction-subtrajectory pairs into action-prediction inputs and targets.
  optimizer_or_scaffold: LoRA fine-tuning of CodeGemma-7B and Codestral-22B with batch size 128, learning rate 2e-5, warmup
    ratio 0.03, maximum length 8192, and three epochs. LoRA rank and other adapter settings are undisclosed.
  compute: Experiments used 80GB H100 machines. GPU count, synthesis and training runtime, total tokens, total cost, and failed-run
    compute are undisclosed.
  evaluation: SWE-bench uses executed-patch pass@1; WebArena mixes Claude fuzzy matching and string matching; OSWorld uses
    task-specific environment-state scripts; Spider2-V combines file, information, and execution checks.
  reported_results: In the ICLR final, the largest ICL gain is +11.1 points for Claude on OSWorld, and Codestral-22B rises
    from 4.7 to 27.8 on WebArena after SFT (+23.1 points). These are author-reported and not independently reproduced.
audit:
  source_mixture: 'Inputs are not annotation-free in a literal provenance sense: the recipe consumes human-authored software,
    documentation, tutorials, FAQs, and benchmark environments, then uses proprietary LLMs for generation and filtering. Exact
    source snapshots and rights lineage are not packaged.'
  split: A separate synthetic pool is constructed for each evaluation environment. No immutable train/validation split, group
    binding from raw trajectories to subtrajectories, or record-level manifest is released.
  decontamination: unknown
  benchmark_overlap: Synthesis deliberately uses resources associated with the four downstream benchmark environments. No
    task-level, instruction-level, or semantic overlap analysis against evaluation instances is reported.
  license: The paper is CC BY 4.0 through OpenReview/arXiv. The unreleased generated corpus, code, model checkpoints, third-party
    documentation snapshots, and environment-derived observations have no disclosed artifact license.
  lineage: Human-authored resources -> three self-instruct tasks per document -> Claude environment interactions -> all contiguous
    subtrajectories -> backward-constructed instructions -> duplicate-state removal -> unanimous Claude/Gemini committee filter
    -> agentic ICL retrieval or next-action SFT.
  release_version: unknown
  successful_and_failed_sample_retention: The original trajectory need not solve its initial task; backward construction can
    relabel its observed behavior. The final corpus lacks released original-task success flags, per-judge votes, rejection
    reasons, raw-to-derived lineage, and failed interaction logs.
  privacy_or_consent: unknown
  known_failure_modes:
  - Backward construction may turn a failed or accidental path into a superficially aligned record by changing the goal, without
    proving the behavior is necessary, safe, or successful for the original task.
  - Filtering depends on two proprietary LLM judges without exact API revisions, calibration, inter-judge agreement, or an
    independently labeled quality audit.
  - Quadratic extraction creates many correlated subtrajectories from the same raw episode; no group-aware splitting, near-duplicate
    analysis, or trajectory-family leakage control is reported.
  - Documentation can be incomplete or unavailable, and related-domain resources are sometimes substituted for the target
    environment.
  - Live external documentation and benchmark environments are not snapshot-pinned, making exact replay and rights auditing
    difficult.
  - No generated corpus, rejected set, implementation, environment lockfile, trained checkpoint, source snapshot, or immutable
    release manifest was found.
  - No confidence intervals, independent synthesis/training reruns, random seeds, total compute accounting, or task-overlap
    study is reported.
  - The arXiv v1 and ICLR final report different headline deltas; downstream citations must use the venue-final values.
  citation_status: verified
  confidence: high
  notes: Verified against the ICLR proceedings page and all 54 pages of the final paper, OpenReview, arXiv v1, and the first-author
    publication page. Official release searches found no code/data/model package.
  remaining_unknowns:
  - Official code, generated data, rejected records, model checkpoints, and immutable release
  - Exact Claude and Gemini API revisions, prompts as executable files, and per-record committee outputs
  - Environment/container versions, document snapshots, crawl dates, record-level provenance, and artifact licenses
  - Train/validation grouping, random seeds, LoRA rank, GPU count, runtime, total tokens, and cost
  - Decontamination, task overlap, privacy review, committee accuracy, and independent reruns
inclusion_reason: 'Learn-by-interact is a concrete construction recipe for reasoning-bearing agent data: documentation-seeded
  tasks produce executable environment interactions, backward construction converts every subtrajectory into an aligned instruction
  pair, and a mixed duplicate/LLM-committee filter prepares examples for agentic ICL and SFT.'
