one_line_summary: The recipe expands 85,905 documentation-seeded agent episodes into 1,456,808 instruction-subtrajectory candidates
  and reports 440,008 committee-filtered examples, but releases neither the corpus nor its implementation.
why_it_matters: It exposes a reusable pattern for turning imperfect environment exploration into post-training data, while
  making clear that instruction-behavior alignment, original-task success, provenance, and open release are separate audit
  questions.
