status: partial
one_line_summary: L1 trains DeepScaleR-based policies with programmatic final-answer and token-budget rewards so a prompt
  can request either an exact reasoning length or a maximum token ceiling.
why_it_matters: 'It makes inference budget a first-class field of the rollout and reward contract: each source problem is
  paired with a requested length, the policy generates an on-policy trace, and correctness plus realized length determine
  reward. For Track 5, this separates learned budget-conditioned trajectories from hard truncation, while the missing complete
  rollout/reward ledger limits data-level reuse and audit.'
