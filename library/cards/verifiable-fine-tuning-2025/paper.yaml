one_line_summary: VFT commits instruction data and per-example provenance metadata to a manifest, then recursively proves
  that a LoRA/AdamW training trajectory obeyed the committed sampler, approximation, and quota policy.
why_it_matters: It turns lineage and release-policy claims into machine-checkable training certificates, while making clear
  that cryptographic consistency with a manifest is not evidence that the manifest's source, license, quality, or consent
  assertions are true.
