one_line_summary: MetaScale searches over query-specific cognitive strategies with UCB and LLM-mediated evolution, using an
  outcome reward model to select the final response under a fixed inference budget.
why_it_matters: It provides a concrete schema for auditing strategy-level test-time traces—retrieval source, arm statistics,
  rewards, evolution lineage, budget, and final selection—without treating benchmark gains as evidence that the hidden traces
  are reusable or high quality.
