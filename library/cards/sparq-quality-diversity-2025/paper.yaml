one_line_summary: SPARQ recursively mutates MATH problems, scores each child with 16 student rollouts, and turns successful
  student solutions from nontrivial children into SFT tuples organized by learned skill cells.
why_it_matters: It makes problem generation, difficulty filtering, diversity sampling, and tuple assembly explicit while exposing
  invalid-problem propagation, verifier dependence, yield, and missing-release risks.
