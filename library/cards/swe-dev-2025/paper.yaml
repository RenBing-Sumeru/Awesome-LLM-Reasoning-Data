one_line_summary: SWE-Dev constructs repository repair tasks and fail-to-pass tests, releases 20,147 SFT/RFT-format OpenHands
  records, and studies trajectory and iteration scaling, while row-level lineage and replay remain incomplete.
why_it_matters: It makes an executable-feedback pipeline for software-agent post-training inspectable, but also shows why
  released message traces, scores, and benchmark gains are insufficient without source, environment, and contamination evidence.
