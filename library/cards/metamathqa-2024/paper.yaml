data_object:
  prompt_source: GSM8K and MATH training questions, transformed through answer augmentation, rephrasing, self-verification,
    and forward-backward reasoning.
  trace_author: GPT-3.5-Turbo writes augmented questions and worked solutions; the authors design transformation prompts and
    final-answer filtering.
  answer_format: An instruction containing a math question plus a worked rationale ending in a tagged final answer.
  process_fields:
  - type
  - query
  - response
  - original_question
  - original_response
  environment_or_substrate: Static mathematical instruction-response records released for causal-language-model supervised
    fine-tuning.
  verifier_or_reward: Generated rationales are retained when their extracted final answers match known GSM8K or MATH answers;
    question transformations preserve or derive answer constraints.
  terminal_predicate: Merge answer augmentation and three question-bootstrapping views into the 395k-record MetaMathQA training
    set.
recipe_metadata:
  base_model: LLaMA-2 7B, 13B, and 70B; additional Mistral-7B and Llemma-7B transfer checks appear in the appendix.
  teacher: GPT-3.5-Turbo.
  generator: Generate multiple reasoning paths and multiple forward/backward reformulations of seed math problems.
  filtering_rule: Keep answer-augmented reasoning paths with correct final answers and construct rephrasing, self-verification,
    and FOBAR examples around known answers.
  sampling_protocol: The four released subsets contain 155k answer-augmentation, 130k rephrasing, 55k self-verification, and
    55k FOBAR examples.
  rollout_count: null
  temperature: null
  inference_budget: Teacher-call totals and reproducible dollar cost are not fully reported as a single reusable figure.
  optimizer_or_scaffold: Standard supervised fine-tuning on Alpaca-style instruction-output records.
audit:
  source_mixture: 240k GSM8K-derived and 155k MATH-derived examples, totaling 395k.
  split: The official dataset release exposes one training split with transformation type and links to the original prompt/response
    lineage.
  decontamination: The paper uses training questions from evaluation families and does not establish broad semantic deduplication
    against unrelated math benchmarks.
  license: The official MetaMath repository declares Apache-2.0; downstream users must also honor GSM8K, MATH, and teacher-service
    terms.
  lineage: 'instruction / demonstration / rationale data; closest comparisons: RFT, WizardMath, MAmmoTH, DART-Math, and vanilla
    answer augmentation.'
  known_failure_modes:
  - GPT-3.5-generated rationales can contain locally invalid steps even when their final answers match.
  - Rephrasing may create near-duplicates, and backward transformations may leak answer structure into the prompt.
  - Results are concentrated on elementary and competition mathematics rather than general reasoning.
  citation_status: verified
  confidence: high
  notes: Official ICLR paper, OpenReview forum, affiliations, 395k composition, record transformations, repository license,
    and public dataset link checked.
inclusion_reason: MetaMathQA is a large, public worked-solution SFT dataset whose central contribution is explicit question
  and rationale bootstrapping.
