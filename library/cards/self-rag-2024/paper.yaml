data_object:
  prompt_source: 145,619 instruction-output pairs sampled from Open-Instruct, KILT knowledge-intensive datasets, ASQA, OpenBookQA,
    and ARC-Easy, rounded to 150K in the paper and dataset card.
  trace_author: Original source authors or instruction teachers provide task outputs; a Llama2-7B critic distilled from GPT-4
    judgments inserts retrieval and critique tokens plus retrieved passages.
  answer_format: JSONL records with instruction, optional input, output, id, and dataset_name; output interleaves retrieval
    decisions, passages, relevance/support judgments, task text, and a terminal utility token.
  process_fields:
  - instruction, optional input, id, and source dataset
  - retrieval/no-retrieval token
  - retrieved passage and relevance judgment
  - generated segment and support judgment
  - terminal utility score
  environment_or_substrate: Static instruction records augmented with Contriever passages and segment-level reflection tokens.
  verifier_or_reward: GPT-4 labels train a critic for Retrieve, ISREL, ISSUP, and ISUSE; the critic annotates the generator
    corpus offline, and the generator later predicts the same tokens itself.
  terminal_predicate: End a target with a utility token; when retrieval is requested, prefer passages labeled relevant and
    fully or partially supported, falling back to a sampled passage if none satisfy the rule.
recipe_metadata:
  base_model: Llama2-7B and Llama2-13B generator models; Llama2-7B critic.
  teacher: GPT-4 supplies 3,831-19,317 labels per reflection-token type, which are distilled into the local critic.
  generator: The critic inserts retrieval, relevance, support, and utility tokens into existing instruction outputs; the final
    LM predicts augmented text autoregressively.
  filtering_rule: Discard malformed GPT-4 labels; retrieve up to ten passages, keep a relevant and supported candidate when
    available, and mask passage tokens from generator loss.
  sampling_protocol: Combine eleven source subsets into 145,619 input-output pairs and augment each output segment according
    to critic retrieval decisions.
  rollout_count: null
  temperature: null
  inference_budget: Training retrieves up to ten passages; default inference uses top five passages, segment beam width two,
    greedy token decoding, and retrieval threshold 0.2 except zero for citation-required ASQA.
  optimizer_or_scaffold: Standard next-token training for the critic and generator; the generator vocabulary is expanded with
    reflection tokens.
audit:
  source_mixture: GPT-4 Alpaca 26,168; Stanford Alpaca 25,153; FLAN-V2 17,817; ShareGPT 13,406; OpenAssistant 9,464; Wizard
    of Wikipedia 17,367; Natural Questions 15,535; FEVER 9,966; OpenBookQA 4,699; ARC-Easy 2,147; ASQA 3,897.
  split: The release exposes one 150K train JSONL; critic labels use train/development/test splits, but no reusable generator
    validation split is disclosed.
  decontamination: The paper does not report semantic overlap counts between the mixed instruction sources and all six downstream
    evaluations.
  license: The official Hugging Face release and repository identify MIT; component datasets and retrieved passages retain
    their own terms.
  lineage: Public instruction outputs are judged by a GPT-4-distilled critic, augmented with Contriever passages and reflection
    tokens, serialized as JSONL, and consumed by standard generator SFT.
  known_failure_modes:
  - GPT-4 provides the target judgments and the critic reproduces them, so agreement is not independent evidence of factual
    correctness.
  - Self-predicted relevance/support/utility tokens can be miscalibrated or gamed during decoding.
  - Mixed source licenses, retrieval-corpus provenance, and undisclosed semantic decontamination complicate redistribution
    and evaluation attribution.
  citation_status: verified
  confidence: high
  notes: Full paper and appendix, official ICLR 2024 OpenReview record, MIT repository and Hugging Face 150K JSONL release,
    actual reflection-token record, source counts, controlled ablations, and current adoption signals were checked on 2026-07-14.
inclusion_reason: Self-RAG releases the exact 150K instruction-output records interleaved with passages and reflection tokens
  that train its generator, making the serialized target and critic selection contract central rather than incidental to retrieval.
