one_line_summary: RandomCalculation releases 20 levels of procedurally generated arithmetic prompt-answer pairs and uses two
  levels to test whether RLVR gains survive a lower-contamination control.
why_it_matters: The work joins a reusable construction recipe, a programmatic answer contract, reward-control ablations, and
  explicit contamination risks, while leaving seeds, exact splits, structural decontamination, and release licensing unresolved.
