one_line_summary: The method turns step-local student likelihood into an offline selector for mixed-teacher reasoning traces,
  improving reported SFT results while releasing neither the selected corpus nor a currently usable implementation.
why_it_matters: It distinguishes useful local reasoning transitions from global fluency and self-copying, but also shows that
  a data-quality score can be student-specific, segmentation-sensitive, non-verifying, and difficult to audit without the
  candidate and score ledger.
