  remaining_unknowns:
  - Exact answer-matching implementation, rejected-candidate ledger, duplicate policy, and main per-prompt candidate count
  - Exact run-to-window, sampling, SFT, and evaluation hyperparameter mapping
  - Embedding model and normalization or preprocessing used for trajectory and step coverage analysis
  - Immutable code, selected responses, candidate traces, segmentations, scores, configurations, seeds, dependencies, checkpoints,
    and logs
  - Derived-output license and teacher-output provenance or license compatibility
  - Row-level benchmark overlap, base-model pretraining contamination, privacy review, and consent provenance
  - Independent reruns, variance, confidence intervals, checkpoint selection, runtime, and total compute
inclusion_reason: 'LALP is a concrete step-aware response-selection recipe for reasoning distillation: it exposes why full-prefix
  average likelihood can reward style and self-copying, then replaces it with equal-weight local step scores that choose complete
  answer-correct traces for SFT.'
