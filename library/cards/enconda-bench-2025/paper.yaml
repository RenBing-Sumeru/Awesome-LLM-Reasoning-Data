data_object:
  object_type: Environment-configuration benchmark task built from a pinned Python repository, an error-injected README, structured
    per-error gold diagnosis/repair labels, a generated setup script, and a mixed process-plus-execution evaluation contract;
    the public release is not a state-action-observation trajectory corpus.
  prompt_source: High-quality GitHub Python repositories, including repositories drawn from existing manually verified environment
    benchmarks, filtered for at least 10 stars, more than 1,000 commits, and more than 10 closed issues; professional annotators
    remove originals with faulty README instructions or incomplete dependencies.
  trace_author: Claude-4-Sonnet and Gemini 2.5 Pro synthesize README errors and gold repair metadata. Evaluated LLMs/agents
    produce error analyses and shell scripts. Complete successful and failed agent trajectories are not released.
  released_task_fields:
  - readme
  - repo_name
  - level
  - errors
  released_error_fields:
  - error_type
  - error_description
  - correction_candidates
  - golden_answer
  context_or_state: README text plus repository file structure and a separately released repository/revision manifest. Paper
    evaluation uses an Ubuntu 22.04 Docker environment with Python/Conda prerequisites; the main task row does not carry repository
    URL, revision, Dockerfile, split, or state snapshot.
  action_or_trace: The model emits detected-error JSON and a corrected Bash setup script; code-agent frameworks may interact
    with the repository/environment. The official corpus contains no structured action, tool-call, observation, retry, patch,
    or state-transition sequence.
  answer_or_artifact: Predicted error types/descriptions/fix suggestions and a final shell script intended to repair all injected
    errors, configure the environment, and run verification tests.
  process_labels:
  - Per-error categorical label in {E1,E2,E4,E6,E7,E8}
  - Natural-language gold error description
  - Candidate correction commands or operational suggestions
  - Golden repair answer
  - No released step-level correctness, state-action reward, or trajectory-value label
  observation: Paper experiments use environment feedback and execution output, but full stdout/stderr, container states,
    tool observations, and test logs are not published. Current inference records can retain raw model output, which is not
    equivalent to environment observations.
  verifier_output: Error-type precision/recall/F1; LLM-judged semantic accuracy for error descriptions and fixes; and Pass@1
    from Docker build, test execution, and normal process exit.
  reward: No training reward is reported or released. Metrics and terminal pass/fail are evaluation feedback only.
  terminal_predicate: A run passes only when its generated shell script builds the environment successfully, the test files
    execute correctly, and the process exits normally. Numeric timeout, partial-credit, and replay semantics for the paper
    experiments are not disclosed.
  provenance: Filtered and manually checked repository/README -> minimal LLM injection of two errors -> GPT-4.1-mini README-faithful
    script execution in Docker -> LLM-assisted validity/type/fix filtering -> human validation -> split/merge of retained
    error sets into difficulty levels -> public README plus JSON gold record.
  environment_or_substrate: Ubuntu 22.04 Dockerfile with Python standalone builds, Miniconda, Poetry, uv, pipenv, Pyright,
    Node 20, jq, build tools, and live apt/GitHub/Anaconda/PyPI/conda access. Base-image digest, per-task image, package/channel
    lock, cache state, and network capture are not released.
  release_shape: Checked commit contains 4,201 main JSONL rows, 4,201 per-task JSON files, 4,201 matching README texts (3,216
    Markdown, 978 RST, 6 AsciiDoc, 1 Org), and 9,471 error objects. The JSONL has 320 distinct repository names, the data
    tree has 321 repository directories, and repo_info.jsonl has 329 repository/revision rows, versus 323 repositories reported
    in the paper.
recipe_metadata:
  base_model: Paper experiments evaluate GPT-4.1, Claude-4-Sonnet-20250514, Gemini 2.5 Pro, and DeepSeek-V3-0324 under zero-shot,
    SWE-Agent, OpenHands, INSTALLAMATIC, and Repo2Run settings. Exact API snapshots are not disclosed for every model/framework
    combination.
  teacher: Claude-4-Sonnet and Gemini 2.5 Pro generate injected errors and gold annotations; GPT-4.1-mini generates strict
    README-following validation scripts and acts as the construction filter.
  generator: Minimal README error injection followed by Docker execution validation, GPT-4.1-mini validity/type/fix judging,
    human validation, and error subset splitting/merging.
  prompt_task_source: Python repositories selected from GitHub and existing environment-configuration benchmarks; source-mixture
    counts and rejected-repository manifest are not disclosed.
  sampling_protocol: Generate 1,772 README variants with exactly two errors; retain 1,230 validated two-error READMEs; split
    and merge errors into 4,201 tasks spanning released levels 0-10 and 9,471 total errors. Per-model allocation, random seed,
    retries, and error-type sampling distribution are unknown.
  temperature: unknown
  rollout_count: unknown
  inference_budget: 'Paper experiment token, turn, wall-clock, and cost budgets are not disclosed. Current repository defaults
    are not confirmed experiment settings: max_tokens 4,000, API timeout 120 s, environment timeout 300 s, Bash timeout 60
    s, max iterations 5, and retries 3.'
  search_or_scaffold: README and repository-structure prompting; code-agent or environment-agent scaffold; Docker execution;
    unit-test verification; process evaluator combining exact/set metrics with an OpenAI-compatible LLM judge.
  filtering_rule: Reject generated errors when erroneous instructions do not cause failure, the error is absent from the README,
    the label is incorrect, or the golden repair does not resolve the root cause; retain items after GPT-4.1-mini and human
    review under the same criteria.
  selection_threshold: An error must block an environment-configuration step until fixed. Reported LLM-human agreement is
    98.5%; annotator count, adjudication, and agreement formula are unknown.
  optimizer_or_scaffold: Evaluation and synthetic-data generation scaffold only; no policy optimizer, SFT objective, preference
    objective, reward-model training, or RL procedure is reported.
  reset_protocol: Paper says each script is run in Docker on a fixed repository revision. Per-run image digest, container
    reset command, cache clearing, network state, and filesystem snapshot are unknown; the checked end-to-end execution directory
    is an unresolved gitlink.
  final_release_scale: 4,201 tasks and 9,471 injected-error labels in the checked release; no successful/failed agent rollout
    corpus is present.
audit:
  source_mixture: Real Python GitHub repositories and original READMEs; synthetic README edits and gold fixes from Claude-4-Sonnet/Gemini
    2.5 Pro; GPT-4.1-mini validation/judgment; professional human review; Docker/test execution. Exact per-source counts are
    undisclosed.
  split: No train/dev/test, public/private, or hidden split is reported or encoded. `level` denotes injected-error difficulty/count,
    not a data split.
  decontamination: No model-training-corpus contamination or memorization audit is reported. Public repositories, README text,
    benchmark source reuse, and public gold repairs create overlap risk; commit pinning is not decontamination.
  benchmark_overlap: The source pool includes existing manually verified environment benchmarks and the paper compares EnvBench,
    INSTALLAMATIC, ExecutionAgent, and SetupBench, but no instance-level source/overlap/deduplication manifest is released.
  lineage: The release separates 4,201 task rows from 329 `{repository, revision}` records. Main task rows omit repository
    URL and commit, and current counts differ across the JSONL (320 repository names), expanded tree (321 directories), manifest
    (329 revisions), and paper (323 repositories). No immutable task-to-container-to-run-to-verdict lineage is published.
  license: Official repository code is Apache-2.0. The paper says source repositories were checked for permissive, copyleft,
    or suitable custom licenses, but task rows/repo_info expose no record-level license or attribution manifest; the license
    scope for modified README content and downstream redistribution remains unclear.
  release_version: arXiv:2510.25694v1 was submitted 2025-10-29; formal venue is ICLR 2026 Poster. Official repository snapshot
    checked at main commit 86ab7858613b85f4a8316f3cda3c83086b8cf7c2 dated 2025-10-30. No tags/releases or changelog map that
    snapshot to the final 2026 OpenReview revision.
  artifact_hashes:
    repository_commit: 86ab7858613b85f4a8316f3cda3c83086b8cf7c2
    benchmark_jsonl_git_blob_sha1: 9270ac48002b2d228d904889536ca707bb872659
    benchmark_jsonl_sha256: 5d34903b3667a49a61d040bb86a48628cfeff7664adb629afe016d58f8f88e60
    repo_info_sha256: f145b829393a1da17aced5cf96d28173c2b4a9ebc7dcb9a849fa7a6f8031b01e
    dockerfile_sha256: a12f96c4bd5528e3345e31cd03e1929e53c20efd82fe0e3443d29787fe1794b1
    execution_gitlink: 99729fb0454fb5ef3d031a7b62cb7532fe8fc114
    note: SHA-256 values are curator-computed from official Git blobs; they are not author-published checksums.
  verifier_or_judge_failure_modes:
  - The process evaluator mixes exact/set error-type scoring with an LLM semantic judge, so judge version, prompt sensitivity,
    stochasticity, and API drift can change description/fix accuracy.
  - Current code defaults to gpt-4o-mini while the paper names GPT-4.1-mini; no calibration set or version-reconciliation
    report is released.
  - The declared 0.7 similarity threshold is not used by the inspected evaluator; matching instead uses a hard-coded score
    threshold above 0.5 and the judge's own boolean.
  - Error-type precision/recall uses sets of error types, collapsing multiplicity when a README contains multiple errors of
    the same category.
  - A shell script can pass mutable dependency/test execution while relying on live package state; success does not prove
    future replay, security, or that every diagnosis was semantically correct.
  - 'Multi-error tasks compound failures: agents may identify types but miss the exact command, omit suggested fixes from
    the final script, fail to repair every error, or introduce new faults.'
  successful_and_failed_sample_retention: The corpus preserves erroneous README tasks and gold repair annotations, but not
    complete successful or failed agent commands, actions, observations, stdout/stderr, filesystem states, retry histories,
    patches, test logs, or terminal verdicts. Current processing records distinguish pipeline success/failure, not benchmark
    environment success, and no paper experiment outputs are committed.
  container_dependency_network_cache_timeout_replay: Ubuntu 22.04 is named and a Dockerfile is released, but `ubuntu:22.04`
    is not digest-pinned; pyenv is cloned without a commit; apt/PyPI/conda/installer endpoints are live; Miniconda installer
    has no checksum; conda channels, package locks, cache policy, network allowlist, paper-time timeout/turn budgets, per-task
    reset, and replay commands are unknown.
  security: The container defaults to root and installs/runs untrusted repository and model-generated shell content with live
    network access. No threat model, privilege drop, egress restriction, secret isolation, malware scan, package-supply-chain
    policy, or artifact quarantine is documented. Reuse requires disposable, network-restricted sandboxes.
  privacy_or_consent: The paper asserts permission, anonymization, desensitization, and cleaning, but no record-level consent/privacy
    procedure or manifest is released.
  citation_status: verified
  confidence: high
  notes: Official arXiv full text and appendix, ICLR 2026 OpenReview venue record, official repository tree/code/data/license,
    full corpus counts/schema, and immutable commit/blob hashes were checked. Evidence supports evaluation use, not a released
    trajectory-training dataset.
  remaining_unknowns:
  - Paper-to-release reconciliation for 323 vs 320/321/329 repository counts and paper levels 1-10 vs released level0 records
  - Resolvable source for the Evaluation/Execution gitlink and exact end-to-end executor used for reported Pass@1
  - Complete successful and failed state-action-observation trajectories, logs, scripts, patches, test results, and run IDs
  - Paper-experiment model snapshots, prompts, seeds, sampling settings, turn/token/time budgets, retries, and framework commits
  - Per-task Docker image/digest, package/channel/index locks, network/cache/reset policy, and replay manifest
  - Train/dev/test or hidden split and model-corpus decontamination/benchmark-overlap audit
  - Record-level license/attribution manifest and scope of Apache-2.0 over modified README data
  - Threat model and secure execution policy for untrusted repositories and generated shell scripts
inclusion_reason: EnConda-Bench makes environment configuration diagnosable at both the error/repair level and the executable
  terminal level, and it releases a large task corpus plus its construction and process-evaluation code. Its missing rollout
  corpus, unresolved execution gitlink, count/version drift, and environment-security gaps are also important audit lessons
  for environment-agent reasoning data.
