one_line_summary: EnConda-Bench turns pinned Python repositories and minimally corrupted READMEs into 4,201 environment-repair
  tasks scored by error labels, LLM-judged fixes, and Docker build/test success; the public release contains task records
  rather than replayable agent episodes.
why_it_matters: It shows how environment-agent evaluation can expose the gap between diagnosing a dependency/setup error and
  executing a robust repair, while making clear that repository pins, containers, package/network state, terminal predicates,
  and retained failures all belong to the reasoning-data contract.
