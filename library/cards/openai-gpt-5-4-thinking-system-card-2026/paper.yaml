data_object:
  prompt_source: 'Training-source disclosure repeats three broad classes: public internet information, third-party partner-accessed
    information, and information provided or generated by users, human trainers, and researchers. GPT-5.4-specific training
    objects additionally include undisclosed long-rollout tasks with implicit simulated user work, platform and developer
    confirmation policies supplied through privileged messages, known prompt-injection attacks, and cyber safety scenarios.
    Evaluation-only prompts include hard production-derived conversations, adversarial dynamic conversations, deidentified
    recent GPT-5.2 traffic with final-turn resampling, CoT-Control benchmark problems, monitorability environments, hidden-test
    software tasks, held-out biological items, and cyber environments. Counts, source manifests, task identities, mixture
    weights, dates, and rights are unknown.'
  trace_author: GPT-5.4 Thinking produces internal CoTs and agent action or tool trajectories. For long-rollout safety training,
    agents act in complex workspaces containing implicit simulated user work and are trained to revert their own changes while
    preserving that work; the simulated-user or work generator, retained traces, and selection are unknown. Evaluation traces
    include dynamically generated user-assistant safety conversations, resampled final turns, CoT-Control traces, monitorability
    rollouts, software and cyber episodes, and third-party audit transcripts. GPT-5 Thinking serves as the CoT monitor in
    the monitorability suite, not as a disclosed training reward.
  answer_format: No serialized training schema is released. Disclosed records may contain conversation history, assistant
    messages, internal CoT, developer or system confirmation policy, workspace state, user and agent file changes, commands
    or tool calls, final response or artifact, policy labels, task-specific grader outputs, CoT-monitor labels, hidden-test
    results, flags, pass or fail outcomes, or human and expert rubric scores.
  process_fields:
  - broad_training_source_class
  - conversation_or_task_prompt
  - dynamic_user_simulation_turn
  - developer_or_platform_policy
  - internal_chain_of_thought
  - agent_action_or_tool_call
  - workspace_state_and_change_ownership
  - model_response_or_artifact
  - policy_or_task_grader_label
  - cot_monitor_observation_and_label
  - programmatic_test_or_environment_outcome
  environment_or_substrate: Training substrate is mostly unknown; the report specifically implies changing workspaces for
    long-rollout self-reversion and computer-use contexts governed by platform or developer confirmation policy. Evaluation-only
    substrates include production-like conversations, simulated multi-turn safety interactions, connector and function-call
    prompt injection, 24 monitorability environments, CoT-Control tasks, browser and computer-use scenarios, pre-change monorepositories
    with command-line and Python tools and hidden tests, GPU Kaggle tasks, cyber sandboxes, headless tool boxes, emulated
    networks, and containers with internal code or run artifacts. Deployed cyber classifiers, system-message policies, access
    controls, and message or account blocking are safeguards rather than training environments.
  verifier_or_reward: 'Generic reasoning RL is disclosed, but its reward or verifier is unknown. Long-rollout self-reversion
    and preservation of simulated user work are stated training objectives without a disclosed detector, reward scale, aggregation,
    or terminal rule; confirmation and cyber training similarly disclose desired policy behavior but not feedback implementation.
    Evaluation contracts are separate: policy compliance and not_unsafe; automatic labels on resampled completions; task-specific
    answer graders; GPT-4o fairness grading; example-specific rubrics; GPT-5 Thinking CoT monitoring with g-mean-squared;
    CoT instruction following; hidden unit tests; flags and pass or fail; medal thresholds; pass@1; and expert or manual review.
    Deployment uses a topical classifier followed by a safety-reasoner monitor, which is not the training reward.'
  terminal_predicate: Training termination is unknown. Evaluation terminal conditions include checking every assistant message
    in a dynamic conversation, completing a resampled final turn, all hidden Monorepo-Bench tests passing, retrieving a cyber
    flag, at least one success across Cyber Range trials, pass@1 for CVE-Bench or OPQA, a bronze-medal threshold for MLE-Bench,
    and task-specific policy or rubric outcomes.
recipe_metadata:
  base_model: GPT-5.4 Thinking is a GPT-5-series reasoning model that incorporates frontier coding and computer-use capabilities.
    Architecture, parameter count, exact checkpoint, pretraining corpus, and stage allocation are unknown.
  teacher: unknown
  generator: Adversarial user simulators generate varied dynamic safety trajectories, and implicit simulated user work is
    inserted into long-rollout workspaces; generator models, prompts, policies, versions, and sampling are unknown. The production-like
    evaluation resamples final turns with GPT-5.4 Thinking. These evaluation generators must not be assumed to generate training
    data unless explicitly stated.
  filtering_rule: General training uses high-level quality and risk filtering, personal-information reduction, and safety
    classifiers without disclosed rules or yields. Evaluation filtering and sampling includes hard-case selection around prior
    failures, deidentification, classifier-flagged cyber cases, embedding clustering, MITRE ATT&CK coverage, narrow task subsets,
    and cross-fit filtering for monitorability. These evaluation procedures are not a training filtering recipe.
  sampling_protocol: Training sampling is unknown. Evaluation sampling includes deidentified conversations broadly representative
    of recent GPT-5.2 Thinking traffic with only the last turn resampled; dynamic adversarial conversations; more than 13,000
    CoT-Control problem and instruction pairs; 13 monitorability evaluations across 24 environments; three CVE-Bench rollouts;
    16 Cyber Range trials; selected 30-task MLE-Bench and held-out or non-public bio sets. Production-like estimates are point-in-time
    and subject to distribution and pipeline drift.
  rollout_count: Training rollout counts are unknown, including for the long-rollout preservation intervention. Evaluation-only
    counts include three CVE-Bench rollouts, 16 Cyber Range trials per scenario, and third-party cyber runs with up to 1,000
    turns; dynamic-conversation and production-like sample counts are not disclosed.
  temperature: unknown
  inference_budget: Training budgets are unknown. Evaluation and deployment settings include over 13,000 CoT-Control tasks
    stratified by CoT length, 1,000-turn external cyber episodes with compaction every 100K tokens, multiple reasoning-effort
    settings, and experimental 1M-context support in Codex. These are inference or evaluation disclosures, not a training
    rollout budget.
  optimizer_or_scaffold: The report states that reasoning models use reinforcement learning and describes long-rollout self-reversion,
    confirmation-policy, prompt-injection, and cyber-safety training interventions. It does not disclose the RL algorithm,
    optimizer, reward or objective mixture, label production, batch sizes, rollout grouping, schedules, compute, checkpoint
    selection, or causal stage attribution.
audit:
  source_mixture: The same three broad source classes as earlier GPT-5 reports are disclosed, without a GPT-5.4-specific manifest,
    mixture weights, sample or token counts, date ranges, revisions, consent handling, or source-level rights. Evaluation
    production traffic, simulated conversations, benchmark tasks, hidden tests, and cyber data must not substitute for the
    missing training mixture.
  split: No global train, development, and test ledger is provided. Both connector and function-call prompt-injection evaluations
    are training-data splits. Cyber safety evaluation data are explicitly non-overlapping with training. SecureBio is fully
    held out and selected in-house biology sets are described as unpublished or uncontaminated. These statements are narrow
    and cannot be generalized across the corpus.
  decontamination: No global training-corpus, benchmark, code-repository, production-traffic, or environment overlap audit
    is disclosed. Prompt-injection overlap is affirmative; cyber non-overlap and selected bio held-out claims are scoped.
    Membership hashes, revision pins, contamination procedures, and false-negative audits are absent.
  license: The system card and launch page are public, but no training corpus, long-rollout trajectory set, simulated user
    work, dynamic conversations, resampled traffic, prompt-injection or cyber dataset, CoT traces, hidden tests, graders,
    monitors, model weights, or complete evaluation suite is released with reusable terms. Source-level rights are unknown.
  lineage: Stage-level lineage connects broad sources and filtering to reasoning RL plus long-rollout, confirmation, prompt-injection,
    and cyber-safety interventions, then to production-like, dynamic, CoT, programmatic, expert, and environmental evaluations
    and finally deployment safeguards. Prompt-to-trace-to-feedback-to-reward-to-checkpoint lineage, dataset versions, record
    IDs, and checkpoint hashes are unavailable.
  known_failure_modes:
  - Training-source and reasoning-RL language repeats prior GPT-5 cards and adds no reward, verifier, optimizer, trace-retention,
    or quantitative mixture detail.
  - The long-rollout intervention names self-reversion and preservation of simulated user work but omits task sources, simulated-work
    generator, trajectory schema, counts, detector or reward, false positives, false negatives, and superficial preservation
    failure modes.
  - Dynamic adversarial conversations and production-like final-turn resampling are evaluations; treating them as safety-training
    trajectories would cross an unsupported boundary.
  - Production-like estimates are point-in-time, affected by traffic and pipeline drift, reconstruct only sampled context,
    measure model outputs without the full safety stack, and do not equal deployed prevalence.
  - Prompt-injection evaluations are splits of training data and cannot support generalization claims; the slight function-call
    regression also shows saturation does not eliminate attack-surface risk.
  - CoT monitorability depends on GPT-5 Thinking, task-specific or model answer graders, positive-sample counts, CoT length,
    and label alignment; Anti-Scheming and Memory were sufficiently problematic that OpenAI plans to drop them until revised.
  - CoT-Control uses synthetic format instructions paired with established benchmarks and is heavily confounded by CoT length;
    low controllability is an audit signal, not proof that reasoning cannot be hidden.
  - Hidden tests, flags, pass or fail, medal thresholds, programmatic tests, expert rubrics, policy graders, and automatic
    labels belong to distinct evaluations and are not evidence of RLVR or the training reward.
  - Cyber safety non-overlap applies only to that evaluation, whose production and synthetic mix is intentionally challenging
    and not representative of normal traffic.
  - The two-tier cyber conversation monitor, asynchronous blocks, actor enforcement, trusted access, and system-message policies
    are deployment controls and can change independently of model training.
  - 'The current PDF is mutable: its March 5 cover includes a March 17 mini appendix and an April 24 CoT update, so retrieval
    date and section revision are required for reproducibility.'
  - No reusable data, weights, reward code, source-license ledger, global decontamination audit, or item-level lineage is
    released.
  citation_status: verified
  confidence: high
  notes: The complete official Safety Hub page, current 38-page PDF, and official launch page were read directly on 2026-07-24.
    The report was published 2026-03-05; the mini appendix was added 2026-03-17 and the CoT section updated 2026-04-24. The
    current PDF contains both later changes despite its March 5 cover. This entry separates training interventions, evaluation
    data and scoring, CoT monitors, and deployment safeguards.
inclusion_reason: A frontier general-purpose reasoning report that adds concrete long-rollout self-reversion, confirmation-policy,
  prompt-injection, and cyber-safety training disclosures alongside dynamic and production-like conversations, CoT audit suites,
  and programmatic agent evaluations, while leaving the underlying records, rewards, source mixture, licenses, and global
  split hidden.
