one_line_summary: GPT-5.4 Thinking adds long-rollout self-reversion, configurable confirmation, prompt-injection, and cyber-safety
  training disclosures plus dynamic and production-like safety trajectories, CoT audits, and hidden-test agent evaluations,
  but not the training records, rewards, global split, or stable versioned artifacts.
why_it_matters: It is a high-value disclosure ledger because it exposes several concrete reasoning-agent data and feedback
  surfaces while making it possible to separate training interventions from resampled traffic, policy and task graders, CoT
  monitors, programmatic tests, and deployment controls.
