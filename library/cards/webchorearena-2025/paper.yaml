data_object:
  unit_of_record: One released benchmark row is a task configuration with `task_id`, one or more `sites`, `start_url`, `start_url_lite`,
    `storage_state`, an intent template and instantiated intent, required observation modality, main and optional sub-type,
    an execution description, template instantiation values, and an `eval` object containing evaluator types and task-specific
    references. The pinned merged JSON contains 532 such rows; it is not a rollout corpus.
  prompt_source: Ten annotators selected from the paper authors explored the self-hosted sites, authored 117 task templates
    and their instantiations, and refined the tasks over more than 300 hours. The paper reports 25 Shopping, 29 Shopping Admin,
    20 Reddit, 28 GitLab, and 15 cross-site templates, averaging about 4.5 task instances per template.
  trace_author: AgentOccam or BrowserGym agents backed by GPT-4o, Claude 3.7 Sonnet, or Gemini 2.5 Pro generate state-action-observation
    episodes at evaluation time. The official release contains task and evaluator code, not the paper-run successful and failed
    trajectories.
  task_record:
  - task_id
  - sites
  - start_url
  - start_url_lite
  - storage_state
  - intent_template
  - intent
  - required_obs
  - type_main
  - type_sub
  - description
  - instantiation_dict
  - eval
  task_distribution:
    shopping: 117
    shopping_admin: 132
    reddit: 91
    gitlab: 127
    cross_site: 65
  required_observation_distribution:
    any: 451
    text_accessibility_tree: 69
    image_screenshot: 12
  reasoning_type_distribution:
    long_term_memory: 222
    massive_memory: 168
    calculation: 100
    others: 42
  context_or_state: A task begins from the configured URL and authenticated storage state in a self-hosted WebArena deployment.
    At each step the agent receives a partial page observation, maintains agent-specific memory/history, acts on the page,
    and receives the next observation. Core sites are Shopping, Shopping Admin, Reddit, and GitLab; some released cross-site
    rows also reference Wikipedia.
  trace_or_actions: BrowserGym exposes 15 browser, tab, navigation, messaging, and infeasibility actions and can issue multiple
    actions per step. AgentOccam uses eight basic, page, note/stop, and branch/prune actions with one action per step. Both
    paper configurations cap episodes at 50 steps.
  observation: Accessibility-tree text for tasks marked `any` or `text`, with screenshots additionally supplied for tasks
    marked `image`; agent-specific histories and memory representations are maintained during execution. No canonical episode
    observation log is released.
  answer_or_artifact: A task ends in a textual answer, a target URL, and/or a changed webpage state specified by the task's
    evaluator configuration. The benchmark scores the final answer or final live page state, not a stepwise reasoning annotation.
  process_labels:
  - required_observation_modality
  - main_task_type
  - optional_sub_task_type
  - task_specific_terminal_score
  verifier_output: Each configured evaluator returns a numeric score. `string_match` uses exact, must-include, or GPT-4o fuzzy
    equivalence; `url_match` checks the final URL; `program_html` extracts designated page elements and compares them with
    reference content. When multiple evaluators apply, their scores are multiplied.
  reward: Evaluation-only terminal scalar produced by the configured evaluator or product of evaluator scores. No evidence
    supports use of this score for policy optimization in the paper.
  terminal_predicate: The agent stops with an answer or infeasibility report, or reaches the 50-step cap. Success is then
    determined by the configured final-answer, URL, and/or webpage-state checks; no step-level correctness label is provided.
  provenance: WebArena simulated sites -> author exploration and task proposals -> Claude-based early-agent challenge probing
    -> template and instance creation -> ambiguity/output-format refinement -> three-annotator cross-checks per site and repeated
    inference/error-analysis/revision -> released JSON task/evaluator records -> runtime agent episode -> terminal score.
  environment_or_substrate: A self-hosted WebArena-compatible deployment plus the released AgentOccam and BrowserGym wrappers.
    The repository requires site setup, URL replacement, authentication state, prescribed task order, and environment resets
    after each website before cross-site evaluation.
  release_boundary: The official GitHub repository releases the 532 task JSON, a 102-task analysis subset, task generators,
    AgentOccam and BrowserGym integration code, evaluator implementations, and an Apache-2.0 license. It does not release
    paper-run trajectories, observations, result bundles, reset snapshots, or a fully pinned WebArena deployment image.
recipe_metadata:
  base_model: Not applicable to task construction as a training base model. Evaluation uses GPT-4o-2024-05-13, claude-3-7-sonnet-20250219,
    and gemini-2.5-pro-preview-03-25 inside AgentOccam and BrowserGym.
  teacher: A Claude-based agent was used during early task prototyping to identify model limitations and refine difficulty.
    The paper does not describe teacher-trace distillation or release those construction-stage runs.
  generator: Ten author annotators manually create task templates and instantiations; AgentOccam and BrowserGym agents generate
    evaluation episodes at runtime.
  prompt_or_task_source: Human-authored intents grounded in functions and seeded content of the four principal self-hosted
    WebArena sites, plus cross-site combinations. Map tasks were excluded because of functionality and server-availability
    problems.
  filtering_rule: Favor memory-intensive analytical chores; use a Claude-based agent to reject or refine overly simple prototypes;
    reduce ambiguity in task wording and evaluator expectations; standardize answer formats; cross-check each site's tasks
    with three annotators; and iterate through inference, error analysis, and revision. A record-level rejection ledger is
    not released.
  selection_threshold: unknown
  sampling_protocol: Annotators expand 117 templates into 532 instances. The exact instantiation selection policy, randomization,
    rejected candidates, and per-task author lineage are not disclosed.
  rollout_count: unknown
  temperature: BrowserGym uses temperature 0.1 for all three evaluated models. AgentOccam uses 0.5 for GPT-4o, 0.95 for Claude
    3.7 Sonnet, and an unspecified default for Gemini 2.5 Pro; the latter settings are described by the paper as unofficial.
  inference_budget: All WebChoreArena runs use a 50-step cap. BrowserGym max-new-token limits are 2,000 for GPT-4o and Claude
    and 8,000 for Gemini; AgentOccam max-token limits are 128,000 for GPT-4o and 4,096 for Claude, while Gemini uses defaults.
  search_or_scaffold: 'Two evaluation scaffolds are released: BrowserGym with accessibility-tree and optional screenshot observations,
    and AgentOccam with explicit note, branch, and prune memory/planning actions. Exact upstream commits and deployment images
    used for the paper experiments are not disclosed.'
  optimizer_or_scaffold: No optimizer or post-training recipe is used. WebChoreArena evaluates frozen model-backed agents;
    the paper does not claim SFT, RLVR, or agent training on the released tasks.
  reset_protocol: The official README instructs evaluators to preserve task order because later tasks can alter environment
    state, reset after each website, then run cross-site tasks, and reset before rerunning failed tasks. A machine-readable
    reset manifest and immutable site snapshot are not released.
audit:
  source_mixture: Human-authored templates and instantiations over Shopping, Shopping Admin, Reddit, GitLab, and cross-site
    WebArena states, with Claude-based difficulty probing and author cross-checks. Item-level authorship, rejected proposals,
    and exact source-state lineage are unavailable.
  split: The release presents one 532-task evaluation benchmark and a 102-task analysis subset containing one task from each
    non-cross-site template. No train/dev/test split or hidden holdout is specified; training use must not be inferred.
  decontamination: No model-pretraining contamination analysis, public-benchmark exposure policy, string or semantic overlap
    report, or future test-refresh protocol is disclosed.
  benchmark_overlap: WebChoreArena intentionally reuses the WebArena sites, environment design, and evaluator family while
    contributing newly human-curated harder tasks. No record-level overlap audit against WebArena or other web-agent benchmarks
    is released.
  lineage: Aggregate template/task counts and the high-level construction process are documented, but task-level annotator
    identity, prototype and revision history, Claude trial outputs, cross-check decisions, and rejected-task manifests are
    not public.
  license: The official GitHub repository and Kaggle dataset report Apache-2.0. The project website separately uses CC BY-SA
    4.0. Rights and version obligations for adopted upstream WebArena, BrowserGym, AgentOccam, website databases, screenshots,
    and generated interaction logs require separate review and are not established by the top-level repository license alone.
