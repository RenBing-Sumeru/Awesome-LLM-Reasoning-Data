one_line_summary: WebChoreArena releases 532 author-curated WebArena tasks with answer-, URL-, and DOM-based terminal evaluators,
  but not paper-run trajectories or a fully pinned environment snapshot.
why_it_matters: It turns memory-heavy browser chores into reusable task/evaluator records whose feedback can be inspected
  at the terminal boundary, while making clear that an executable benchmark is not automatically a trajectory dataset or a
  training release.
