    environment_image: unknown
  artifact_release_state: Paper, project page, code, task data, evaluator code, small-set IDs, and license are public. Full
    paper-run results and successful/failed trajectories, immutable environment images and databases, paper-bound dependency
    commits, and task construction records are not public.
