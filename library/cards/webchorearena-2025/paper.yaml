    complete_model_trajectories_released: false
    complete_success_and_failure_results_released: false
    immutable_environment_snapshot_released: false
  environment_versioning:
    substrate: self-hosted WebArena-compatible sites
    upstream_commit: unknown
    database_snapshot_hashes: unknown
    browser_version: BrowserGym README pins Playwright 1.50.0, but the paper-bound Chromium build and AgentOccam browser stack
      are not fully pinned.
    authentication_state: runtime_local
    reset_semantics: partially documented in README
    deterministic_replay: not verified
  successful_and_failed_sample_retention: The paper reports aggregate success scores and selected failure examples but does
    not release the underlying run corpus. BrowserGym tooling records API and environment errors locally and recommends moving
    erroneous results aside before reruns, but the exact paper-run retry, exclusion, crash, and timeout accounting is not
    disclosed.
  privacy_or_consent: Task annotators are paper authors and sites are self-hosted simulations; the paper does not report external
    human-subject data collection. A privacy review of seeded website content, authentication states, screenshots, or any
    future released trajectories is not disclosed.
  verifier_or_judge_failure_modes:
  - Exact and must-include string checks can reject semantically correct answers because of formatting or accept answers containing
    a required substring without establishing full correctness.
  - GPT-4o fuzzy matching introduces model-version, prompt, and judge error; no frozen judge-response bundle, calibration
    set, or adversarial robustness audit is released.
  - URL and DOM-element checks observe only configured final-page evidence and can miss hidden state, unintended side effects,
    or alternative valid completions.
  - Multiplication across evaluator components can make one false negative collapse the whole task score and does not expose
    which intermediate agent step failed.
  - Task-order dependence, authenticated state, and incomplete reset/version manifests can change outcomes even in nominally
    self-hosted environments.
  - The README documents `affect_environment`, `required_wait`, and misspelled `strage_state` columns, while the pinned 532-row
    JSON instead exposes `storage_state` and omits the first two fields, weakening machine-readable replay and mutation auditing.
  known_failure_modes:
  - Agents miscount when aggregating items over multiple pages.
  - Calculation errors become more frequent when more than fifteen numbers must be combined.
  - Agents forget task constraints or required output formats.
  - Agents lose page/action state, hallucinate nonexistent products, stop early, or abandon complex searches.
  - Visual inputs can reduce accuracy relative to accessibility-tree-only inputs for some models and tasks.
  - A provided calculator does not reliably help because agents seldom choose to use it.
  - Simulated sites preserve reproducibility better than the live web but leave a reality gap.
  citation_status: verified
  confidence: high
  notes: Audited arXiv v1 including appendices, the official project page, the COLM 2026 accepted-paper list, GitHub commit
    `542abc5...`, the 532-row merged task JSON, evaluator code, READMEs, license, and Kaggle dataset v1 on 2026-07-20. Artifact
    verification establishes the benchmark release, not a public trajectory corpus or deterministic end-to-end replay package.
  remaining_unknowns:
  - Paper-bound commits for WebArena, BrowserGym, AgentOccam, dependencies, browser image, and site/database snapshots
  - Task-level annotator, prototype, revision, rejection, and Claude challenge-probing lineage
  - Exact paper-run seeds, retries, API failures, timeouts, exclusions, and complete result/trajectory bundles
  - Formal benchmark-overlap, model-exposure, and future public-test contamination audit
  - Machine-readable state-mutation, wait, reset, and cross-task dependency manifest
  - Calibration, stability, and adversarial error analysis for GPT-4o fuzzy evaluation
  - Rights review for upstream code, simulated website content, screenshots, authentication state, and future trajectories
inclusion_reason: WebChoreArena releases a concrete environment-facing task object and mixed terminal feedback contract for
  long, memory- and calculation-heavy browser episodes. Its value to the environment-and-agent-trajectory track is the inspectable
  task/evaluator boundary, while absent trajectories, paper-bound environment snapshots, and complete run accounting remain
  explicit audit limits.
