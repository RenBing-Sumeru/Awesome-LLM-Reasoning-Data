inclusion_reason: 'Tree-GRPO makes an online agent-RL rollout forest an explicit training-data object: complete ReAct steps
  form shared-prefix branches, programmatic outcome labels score leaves, and tree-relative groups convert terminal feedback
  into implicit process supervision under disclosed rollout budgets. Its in-memory-only trees and missing branch/reward release
  make it especially useful for auditing the boundary between a search recipe and reusable trace data.'
