one_line_summary: Tree-GRPO builds shared-prefix forests of complete ReAct agent steps during online RL, scores terminal leaves
  with EM/F1 and format rules, and derives intra-/inter-tree process signals, but it releases code rather than the raw trees,
  discarded branches, or reward lineage.
why_it_matters: It shows how search structure itself can turn a fixed token/tool budget into more agent trajectories and finer
  credit assignment, while exposing why parent-child lineage, all leaf outcomes, environment snapshots, split manifests, and
  retention decisions are necessary before such runtime trees can be treated as auditable reasoning data.
