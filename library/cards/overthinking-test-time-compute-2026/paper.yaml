one_line_summary: This study shows that longer reasoning can reverse correct answers and proposes marginal-utility and flip-event
  analysis for selecting test-time budgets.
why_it_matters: It supplies a concrete failure mode for indiscriminate test-time scaling and turns “when to stop” into a measurable
  allocation decision.
