  sampling_protocol: Temperature-zero evaluations compare accuracy, marginal utility, flip events, and cost-aware utility
    across budgets.
  rollout_count: One deterministic trace per problem and budget; 32 budget points per problem.
  temperature: '0.'
  inference_budget: 500 to 16,000 reasoning tokens in 500-token increments.
