data_object:
  prompt_source: MATH training-set questions used to construct the preference data.
  trace_author: The respective backbone reasoning model, DeepSeek-R1-Distill-Qwen-7B or DeepSeek-R1-Distill-Qwen-32B, generates
    candidate responses.
  answer_format: A question with sampled Chain-of-Thought response candidates, ranked winner and loser responses, and answer-correctness-derived
    preference labels.
  process_fields:
  - question
  - candidate_response
  - final_answer_correctness
  - response_token_length
  - token_length_budget
  - calibrated_reward
  - pair_type
  - winner_response
  - loser_response
  environment_or_substrate: Offline rollout collection from the MATH training set; each candidate response is capped at 4096
    tokens during preference-data construction.
  verifier_or_reward: Rule-based correctness reward calibrated by each response's relative deviation from the Token Length
    Budget; the exact answer-extraction and checking implementation is undisclosed.
  terminal_predicate: The paper classifies candidates as correct or incorrect for reward calibration, but does not disclose
    the exact correctness-checking procedure.
recipe_metadata:
  base_model: DeepSeek-R1-Distill-Qwen-7B (DS-7B) and DeepSeek-R1-Distill-Qwen-32B (DS-32B).
  teacher: The current backbone reasoning model supplies self-rollouts; no external teacher is reported for construction.
  generator: Sample responses per MATH training question, compute a Token Length Budget from sampling accuracy and correct-response
    length, calibrate rewards, rank candidates, and form contrastive pairs.
  filtering_rule: Select maximal-margin dual-correct and dual-incorrect pairs per question, remove the bottom delta fraction
    by margin, then retain at most one pair of each class per question.
  sampling_protocol: 20 candidate responses per MATH training question, maximum sequence length 4096 tokens; delta is 0.18
    for DS-7B and 0.15 for DS-32B.
  rollout_count: 20
  temperature: unknown
  inference_budget: Preference-data rollouts use a 4096-token maximum; evaluation uses greedy decoding with a 32768-token
    maximum generation length.
  optimizer_or_scaffold: SimPO fine-tuning for one epoch with AdamW at 5e-6; beta=200 and gamma=1. The retained training sets
    contain 10295 DS-7B pairs and 9813 DS-32B pairs.
audit:
  source_mixture: MATH training questions plus 20 self-generated candidate responses per question from the respective backbone;
    retained datasets contain 10295 DS-7B and 9813 DS-32B contrastive pairs.
  split: MATH training set is used for construction; MATH-500, AIME2024, and GPQA are reported only as evaluation benchmarks.
  decontamination: unknown
  license: unknown
  lineage: MATH training question -> 20 backbone rollouts -> correctness and token-length statistics -> Token Length Budget
    -> calibrated rule-based rewards -> ranked dual-correct or dual-incorrect pairs -> margin filtering -> SimPO.
  known_failure_modes:
  - exact correctness-checking and answer extraction are undisclosed
  - preference pairs and complete rollout records are not released
  - code repository provides evaluation utilities rather than the documented construction pipeline
  - truncation threshold is sensitivity-critical
  - low-discriminability long dual-incorrect pairs can cause reward hacking
  - evaluation is restricted to STEM domains
  - off-policy preference learning may limit performance relative to online RL
  citation_status: verified
  confidence: medium
  notes: Official ACL and arXiv records verify the bibliographic facts and paper method. The paper-linked public GitHub repository
    supplies evaluation instructions and points to a ModelScope model clone, but does not release the constructed preference
    pairs, rollout corpus, reward/checker implementation, training code, licenses, or immutable data revision.
inclusion_reason: DAST is a directly relevant rollout-to-preference recipe that converts multiple self-generated reasoning
  traces into difficulty-conditioned ranked pairs for efficient test-time reasoning behavior.
