status: partial
one_line_summary: DAST samples 20 self-rollouts per MATH question, uses correctness and a difficulty-conditioned token budget
  to rank candidates, and trains SimPO on the resulting preference pairs.
why_it_matters: It makes the rollout budget, token-budget construction, reward-shaped pair ranking, and length-sensitive preference
  optimization visible, while leaving the reusable records and checker implementation unavailable.
