data_object:
  prompt_source: Agent Lightning is a framework whose tasks/datasets are supplied by users rather than a canonical corpus.
    The paper's three demonstrations use Spider for text-to-SQL, MuSiQue with a Wikipedia retriever for open-domain QA, and
    Calc-X for calculator-assisted math QA. Microsoft Responsible AI documentation directs users to convert their own dataset
    into a parquet file with data ID, input and expected-output columns.
  trace_author: The client-side agent runtime captures run-specific agent executions through OpenTelemetry/AgentOps instrumentation
    or a basic tracer in the OpenAI-like API endpoint. In the released framework, users may emit prompts, tool calls and rewards
    as structured spans that flow to LightningStore; no paper-wide rollout/trace corpus is linked as an artifact.
  answer_format: The unified interface represents an execution as component calls with metadata, inputs and outputs. RL extracts
    policy-LLM transitions of (current LLM input/context, LLM output/action, scalar reward); state may include semantic variables
    such as program counter, variables, call stack and resource context.
  process_fields:
  - task
  - execution
  - semantic_variable
  - component_call
  - call_metadata
  - llm_input
  - llm_output
  - tool_input
  - tool_output
  - resource_context
  - state
  - action
  - reward
  - transition
  - trace_span
  environment_or_substrate: 'A Training-Agent Disaggregation architecture: a server coordinates user-uploaded task batches,
    agent clients execute agents, LightningStore synchronizes tasks/resources/traces, and the training backend updates resources/models.
    Environments and reward functions may run locally in a worker or as pooled shared services, but the framework does not
    publish a canonical training environment or benchmark stack.'
  verifier_or_reward: The framework accepts task-defined scalar rewards and can turn monitoring signals such as tool-call
    return status into optional intermediate rewards (AIR). Paper demonstrations use final-answer correctness for text-to-SQL
    and Calc-X math; the RAG demonstration uses 0.9 word-level answer F1 plus 0.1 format score. These are three application
    examples, not a framework-wide default reward, a released reward dataset, or evidence that every future Agent Lightning
    trace is programmatically verifiable.
  terminal_predicate: The task/agent runtime determines when an execution is complete. The paper's examples score a final
    answer; intermediate rewards are optional and may be absent. A universal terminal predicate, task completion schema and
    released terminal-event ledger are unknown.
recipe_metadata:
  base_model: Llama-3.2-3B-Instruct is the base model in the paper's three demonstrations. The framework is designed to optimize
    user-selected LLMs through an OpenAI-like endpoint; it does not claim a universal base model or a released general agent
    checkpoint.
  teacher: null
  generator: User-provided agents execute against user-supplied tasks/environments; the client collects LLM calls and optional
    tool/environment interactions as trace spans. In the reported examples, agents are implemented with LangChain, OpenAI
    Agents SDK and AutoGen.
  filtering_rule: unknown
  sampling_protocol: Each task may be run multiple times to generate executions; LightningRL groups transitions by task for
    advantage estimation. The paper does not disclose a unified cross-task corpus sampling protocol, prompt filter, rollout
    count, or immutable transition-release manifest.
  rollout_count: null
  temperature: null
  inference_budget: unknown
  optimizer_or_scaffold: LightningRL extracts input-output-reward transitions from agent executions, assigns episode return
    across calls, then delegates token-level optimization to existing single-turn methods such as PPO, GRPO or REINFORCE++.
    The current implementation assigns every action in an episode the same value as its final return. Server/client disaggregation,
    LightningStore, tracing, resource updates and data-parallel runners provide the framework scaffold.
audit:
  source_mixture: No canonical Agent Lightning training mixture is disclosed. The technical report describes three task demonstrations
    (Spider, MuSiQue/Wikipedia and Calc-X); Microsoft Responsible AI documentation says the user provides the dataset. Counts,
    source versions, prompt transformations, task weights, trace volumes and retained/rejected records are not published as
    a common corpus manifest.
  split: The report describes benchmark/task demonstrations and test metrics, but no immutable paper-run, record-level train/dev/test
    mapping, trace-to-split file or cross-task split manifest is released by Agent Lightning. Upstream benchmark split details
    are outside this framework release and were not inferred here.
  decontamination: No dedicated semantic contamination, benchmark-overlap, tool-corpus leakage, agent-trace memorization,
    or train/evaluation separation audit was verified in the official paper, project, repository or Responsible AI documentation
    inspected here.
  license: The Agent Lightning source repository is MIT. The framework's license does not establish redistribution rights
    for user-provided datasets, Spider, MuSiQue, Calc-X, Wikipedia/retriever data, external tools, captured prompts/responses,
    trace spans, rewards or model weights.
  lineage: User task/dataset and agent implementation -> client-side OpenTelemetry/API tracing of executions -> LightningStore
    task/resource/trace handling -> transition extraction and credit assignment -> selected RL backend/resource update. The
    release does not supply a paper-run record-level link from source task through trace/reward/credit assignment to model
    checkpoint.
  known_failure_modes:
  - The paper's current LightningRL assigns the same final return to every action in an episode, so credit can be misattributed
    in long, branching or multi-agent workflows.
  - The transition extractor explicitly omits the detailed reasons and sources that produced an LLM input; a training tuple
    alone may not establish full provenance, tool context or semantic reproducibility.
  - AIR can turn monitoring signals such as tool-return status into intermediate rewards, but such operational signals need
    not measure task correctness, safety or real-world utility.
  - The framework's flexible user-supplied task, agent, environment and reward interfaces mean paper examples cannot establish
    the quality, rights, privacy, safety or verifiability of downstream traces.
  - OpenTelemetry/API tracing can capture sensitive prompts, tool outputs and resources; the inspected public sources do not
    provide a general trace-redaction, consent, retention or release ledger for user runs.
  - The evolving repository and documentation demonstrate framework availability but are not an immutable reproduction package
    for the paper's exact data, tool services, spans, reward events, seeds or checkpoints.
  citation_status: verified
  confidence: high
  notes: Official arXiv report, Microsoft Research project URL, microsoft/agent-lightning repository, MIT license and Responsible
    AI Transparency Documentation were checked on 2026-07-16. They verify code and trace-schema/framework disclosures, not
    a canonical frontier training corpus, reward ledger, environment bundle or benchmark release.
inclusion_reason: A Microsoft 2025 agent-optimization framework that formalizes how arbitrary agent executions are converted
  into state/action/reward transitions and operational traces, making its data interface and disclosure boundary highly relevant
  to an audit ledger even though it does not release a unified training corpus.
