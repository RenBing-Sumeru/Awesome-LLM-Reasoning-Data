one_line_summary: Microsoft's MIT framework converts user-run agent executions into state/action/reward transitions and trace
  spans for LightningRL, but its official release is framework code and examples—not a canonical corpus, reward ledger, environment
  bundle or benchmark data release.
why_it_matters: It exposes a reusable transition and observability contract for training agents while sharply separating framework-level
  trace capture from the missing provenance, rights, reward validity, split and privacy evidence needed to audit any concrete
  downstream training run.
