one_line_summary: Controlled RLVR audit showing that GRPO can raise Qwen math scores under random or incorrect rewards by
  amplifying pretrained behaviors, while the effect often fails outside Qwen.
why_it_matters: It makes random and format-only reward baselines, model-family transfer, and optimizer details necessary checks
  before interpreting an RLVR gain as new reasoning ability.
