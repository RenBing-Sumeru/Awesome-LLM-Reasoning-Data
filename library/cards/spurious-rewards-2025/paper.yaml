data_object:
  prompt_source: DeepScaleR training questions; the public repository includes filtered and majority-labeled variants under
    code/data.
  trace_author: Online rollouts from each base model during GRPO; majority labels are produced from 64 pre-RL samples per
    prompt.
  answer_format: Mathematical response with a final answer; some reward conditions require a non-empty boxed expression or
    the string python.
  process_fields:
  - prompt
  - model rollout
  - binary reward
  - group-relative advantage
  - answer label or majority-vote pseudo-label
  environment_or_substrate: GRPO implementation based on TTRL/OpenRLHF; main runs use 8 A100 GPUs.
  verifier_or_reward: Ground-truth equivalence, 64-rollout majority-vote pseudo-label, boxed format, Bernoulli random reward,
    or a selected incorrect majority label.
  terminal_predicate: A rollout receives its specified binary reward; this is deliberately not always a correctness predicate.
recipe_metadata:
  base_model: Qwen2.5-Math-7B is the main model; Qwen2.5, Llama3, and OLMo2 variants test family dependence.
  teacher: No external teacher for random/format rewards; majority-vote labels are generated by the pre-RL base model.
  generator: The current policy generates online mathematical rollouts for GRPO.
  filtering_rule: Reward condition assigns binary 0/1 feedback; incorrect-label training retains prompts with a majority-voted
    wrong label.
  sampling_protocol: 16 rollouts per prompt; majority labels use 64 pre-RL samples per prompt.
  rollout_count: 16
  temperature: 1.0 for training; 0.0 for pass@1 and 0.6 for avg@8 evaluation.
  inference_budget: Main RLVR runs use 300 steps; each run is approximately 24 hours on 8 A100 GPUs.
  optimizer_or_scaffold: GRPO with learning rate 5e-7, minibatch 128, rollout batch 64, clipping enabled, and no KL or entropy
    loss.
audit:
  source_mixture: Official arXiv v2 and the authors' public GitHub repository.
  split: Training uses DeepScaleR; evaluation reports MATH-500 pass@1 and AMC/AIME avg@8.
  decontamination: AIME 2025 is used as a post-cutoff check, but no comprehensive training-data decontamination audit is reported.
  license: The paper is under arXiv's CC BY 4.0 license; inspect repository and upstream-data licenses before redistribution.
  lineage: 'Primary paper: https://arxiv.org/abs/2506.10947 ; official code and included data: https://github.com/ruixin31/Spurious_Rewards'
  known_failure_modes:
  - Spurious reward gains are strong for Qwen2.5 but often flat or harmful for Llama3 and OLMo2.
  - Prompt wording changes Qwen2.5-Math-7B's initial performance and can confound comparisons.
  - The clipping-bias explanation is established for the tested GRPO configuration, not every RL algorithm.
  citation_status: verified
  confidence: high
  notes: arXiv v2 and official repository reviewed. The repository exposes code and filtered/majority-labeled data; no independent
    dataset card or license was found.
  metadata_status: complete
inclusion_reason: Controlled RLVR audit showing that apparent reasoning gains can arise from GRPO's amplification of useful
  pretrained behaviors rather than informative rewards.
