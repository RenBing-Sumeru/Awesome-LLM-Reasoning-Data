  version_drift:
    bibliographic: arXiv v1 (2025) has an older title and 20 authors; ACL 2026 has the canonical title and 21 authors.
    judge: Archival scores use GPT-4.1; current code defaults to Qwen3-32B.
    code: The mutable repository postdates the first arXiv release and has no GitHub Release tag.
  verifier_or_judge_failure_modes:
  - LLM semantic-equivalence decisions depend on judge family/version and prompting.
  - Appendix G reports non-identical substring, GPT-4.1, and Qwen3 scores.
  - Citation scoring checks document IDs, not whether the cited text entails the claim.
  - Incomplete qrels create false negatives, especially after corpus expansion.
  - Non-completed status and missing output are collapsed to failure/parse-error treatment.
  successful_and_failed_sample_retention:
    released_successful_and_incomplete_responses: Current OpenAI producer code can serialize returned responses with status,
      including non-completed statuses.
    exception_failures: Query-level exceptions may terminate before a record is persisted.
    construction_rejections: Only aggregate counts are published for generation, scrape, and human-review rejects.
    released_run_coverage: unknown
    note: Four full-trajectory archives are visible, but their per-file row counts and success/failure distributions were
      not exhaustively decrypted and audited.
  privacy_or_consent:
    source_pages: Publicly accessible web pages according to the paper.
    pii_scan: unknown
    robots_or_terms_audit: unknown
    takedown_process: unknown
    annotator_compensation: unknown
    annotator_consent: unknown
  replay:
    strengths: Fixed corpus, public indexes, executable clients, qrels, prompts, evaluator, dependency lock, and four trajectory
      archives improve controlled replay.
    limits: No unified manifest binds all revisions; proprietary API snapshots, seeds, retry state, some package/service versions,
      and full trajectory coverage are undisclosed.
    exact_replay: false
  known_failure_modes:
  - Evidence qrels are incomplete and can mark genuinely relevant new documents as negatives.
  - o3-generated candidate URLs bias the evidence pool.
  - Text extraction omits interactive pages, dynamic layouts, multimedia, and some PDF content.
  - The task evaluates short answers and document citations rather than a full deep-research report.
  - Some original questions were map/distance-dependent, ambiguous, or lacked recoverable evidence and were removed.
  - Public release introduces future model-contamination risk.
