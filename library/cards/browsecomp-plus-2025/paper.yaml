inclusion_reason: BrowseComp-Plus makes deep-search evaluation materially more auditable than a live-web QA score by fixing
  the corpus, releasing query/answer and human evidence/gold-document labels, defining retrieval/citation/answer verification,
  publishing executable agent clients and indexes, and releasing four representative full-trajectory archives. It belongs
  in the environment/agent-trajectory track as an evaluation substrate and partial trajectory release, not as evidence of
  post-training use.
