one_line_summary: A fixed-corpus BrowseComp derivative with 830 answerable queries, 100,195 web documents, human evidence/gold
  qrels, mixed answer/retrieval/citation grading, and four released frontier-agent trajectory archives.
why_it_matters: It disentangles the search agent from live-web drift and exposes whether failures arise from retrieval, citation,
  terminal status, or answer synthesis. The fixed substrate and partial episode release support replay and audit, while judge
  drift, incomplete qrels, public reversible obfuscation, and unresolved web-content licensing remain important limits.
