data_object:
  object_type: fixed-corpus deep-search benchmark with document supervision and a partially released set of full agent episodes
  benchmark_record:
    unit: one filtered BrowseComp query
    count: 830
    split: test
    fields:
    - query_id
    - query
    - answer
    - evidence_docs
    - gold_docs
    - negative_docs
    disclosure: All payload fields except query_id are reversibly obfuscated in the public query release.
  corpus_record:
    unit: one scraped web document
    count: 100195
    fields:
    - docid
    - text
    - url
    hf_split_label: train
    split_interpretation: Packaging label only; it is not evidence of model training use.
  qrel_record:
    evidence_definition: A human-labeled passage/document span supporting one or more clues needed for the answer.
    gold_definition: A human-labeled document that semantically contains the final answer.
    hard_negative_definition: A scraped result from GPT-4o-decomposed subqueries that was not retained as positive after deduplication
      and labeling.
  released_episode_record:
    availability: partial
    released_combinations:
    - retriever: BM25
      agent: GPT-5
      file: bm25/gpt5.jsonl
    - retriever: BM25
      agent: o3
      file: bm25/o3.jsonl
    - retriever: Qwen3-Embedding-8B
      agent: GPT-5
      file: qwen3-embed-8b/gpt5.jsonl
    - retriever: Qwen3-Embedding-8B
      agent: o3
      file: qwen3-embed-8b/o3.jsonl
    fields:
    - metadata
    - query_id
    - tool_call_counts
    - usage
    - status
    - retrieved_docids
    - result
    event_types:
    - tool_call
    - reasoning
    - output_text
    coverage_verified: false
  prompt_source: The 830 retained questions are filtered from BrowseComp's 1,266 question-answer pairs.
  trace_author: Evaluated search agents; only four GPT-5/o3 trajectory combinations are publicly archived.
  answer_format: Short final answer plus explanation with numeric document citations and confidence.
  process_fields: Ordered tool calls, tool outputs, reasoning summaries when exposed, usage, retrieved document IDs, terminal
    status, and final output.
  observation: Top-5 fixed-corpus search results truncated to the first 512 tokens; optional full-document retrieval is available
    in get_document experiments.
  action_space:
  - search
  - get_document_optional
  - final_answer
  environment_or_substrate: A frozen 100,195-document corpus with released BM25 and Qwen3-Embedding indexes; ReasonIR and
    Jina-ColBERT are also evaluated.
  verifier_or_reward:
    answer: 'LLM semantic-equivalence judge: GPT-4.1 in the archival paper; Qwen/Qwen3-32B in current public evaluation code.'
    retrieval: Programmatic Recall@k and nDCG@k against human evidence/gold qrels.
    citation: Programmatic cited-document-ID match against evidence qrels; not sentence-level entailment.
    terminal: status must equal completed and a final answer must be present before answer judging.
  reward_or_evaluation_outputs:
  - answer_accuracy
  - recall_at_k
  - ndcg_at_k
  - citation_recall
  - cited_ratio
  - calibration
  - tool_call_counts
  provenance: BrowseComp questions; o3 web-search evidence mining; Selenium/Trafilatura scraping; 14-student human verification;
    GPT-4o/SerpAPI hard-negative mining.
  release_shape: Query labels, fixed corpus, indexes, code, and four encrypted trajectory files are separate official repositories
    without one binding release manifest.
