audit:
  source_mixture: Questions and answers originate in BrowseComp; evidence/corpus text comes from scraped public web pages;
    hard negatives come from GPT-4o-decomposed Google/SerpAPI searches.
  split:
    benchmark_questions: 830-row test-only release
    corpus: 100,195 rows labeled train by Hugging Face for packaging
    train_dev_test_policy: No benchmark train or development split is released.
    selection_lineage: 830 filtered from 1,266 BrowseComp questions
  decontamination:
    mechanism: Public canary plus reversible base64/XOR obfuscation derived from a public SHA-256 key.
    strength: deterrence_only
    limitation: The key and decryptor are public; this cannot remove benchmark knowledge from model weights.
  benchmark_overlap:
    direct_parent: BrowseComp
    overlap: Questions are reused, then filtered and augmented with a fixed corpus, evidence/gold qrels, negatives, and controlled
      retrieval.
    post_release_risk: 'High: public questions, answers, decryption instructions, and trajectories may enter future model
      corpora.'
    parametric_only_signal: The paper reports roughly 20% o3 and 26% GPT-5 parametric-only accuracy and discusses possible
      BrowseComp exposure.
  lineage:
    parent_entry: browsecomp-2025
    do_not_merge: true
    distinction: BrowseComp-Plus contributes retrieval environment, document labels, corpus, indexes, graders, and selected
      trajectories; BrowseComp remains the source QA benchmark.
