data_object:
  prompt_source: Aggregated public STEM questions plus document-derived synthetic questions.
  trace_author: Qwen3-235B-A22B-Thinking-2507 distills long-CoT responses after Qwen3-235B-Instruct annotation.
  answer_format: Question, metadata, long-CoT response, and a final answer or verifiable-answer field.
  process_fields:
  - source question and provenance
  - domain, level, answer type, and validity annotations
  - distilled long reasoning response
  - final answer and optional verification result
  - sampling stratum
  environment_or_substrate: Static STEM corpora and educational documents parsed by Logics-Parsing.
  verifier_or_reward: Validity annotation, exact/near deduplication, benchmark decontamination, optional Math-Verify, and
    RLVR answer reward.
  terminal_predicate: Invalid or ambiguous questions and repetitive responses are removed; incorrect distilled answers may
    be regenerated once but are not categorically discarded.
recipe_metadata:
  base_model: Qwen3-8B and Qwen3-32B.
  teacher: Qwen3-235B-Instruct-2507 for annotation and Qwen3-235B-A22B-Thinking-2507 for response distillation.
  generator: Aggregate, annotate, deduplicate, decontaminate, distill, then stratify by response length; second-stage data
    target model failures through document retrieval.
  filtering_rule: MD5 and MinHash deduplication, 13-gram benchmark decontamination, repetition filtering, and length-based
    stratified sampling.
  sampling_protocol: Keep all records above the 75th response-length percentile, 50% of the 50th-75th band, and 10% of the
    20th-50th band.
  rollout_count: 16
  temperature: null
  inference_budget: Competition benchmarks use 16 generations; larger or easier sets use up to four.
  optimizer_or_scaffold: First-stage SFT followed by failure-driven SFT or RLVR with retrieved document synthesis.
audit:
  source_mixture: Public Hugging Face sources and document-derived questions; early synthetic and multimodal subsets are excluded.
  split: 7.2M curated records before stratified sampling, 2.2M selected for SFT; open releases contain 5.3M and 1.6M records
    after private exclusions/downsampling.
  decontamination: MinHash-bucket and identical 13-gram overlap with evaluation samples are removed.
  license: Hugging Face dataset card declares CC BY-NC 4.0.
  lineage: Source aggregation is reduced from 15.25M questions through curation and teacher distillation.
  known_failure_modes:
  - The open release excludes a private portion, so the exact training mixture is not fully reproducible.
  - Incorrect teacher responses are not always filtered, and failure-driven synthesis can overfit benchmark-shaped regions.
  citation_status: verified
  confidence: high
  notes: arXiv v3 PDF and the official Hugging Face dataset/model links embedded in the PDF were checked on 2026-07-13. PDF
    affiliations were used; no peer-reviewed acceptance was found.
inclusion_reason: Provides a large long-CoT corpus and a failure-driven recipe that turns model errors plus retrieved documents
  into targeted second-stage data.
