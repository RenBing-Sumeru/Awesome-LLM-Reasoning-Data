one_line_summary: Logics-STEM curates millions of long-CoT STEM records and uses model failures to retrieve documents and
  synthesize targeted data for a second SFT or RLVR stage.
why_it_matters: It links large-scale data curation, explicit decontamination, sampling, and failure-targeted post-training
  in one disclosed pipeline.
