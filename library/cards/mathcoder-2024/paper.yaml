one_line_summary: MathCoder turns math problems into open trajectories that alternate reasoning, executable Python, execution
  feedback, and continued reasoning, then trains models to consume that contract.
why_it_matters: It makes execution feedback a serialized post-training data object and tests which gains come from interpolated
  problems, live execution, and loss placement.
