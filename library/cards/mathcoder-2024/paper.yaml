data_object:
  prompt_source: GSM8K and MATH training problems seed the first stage; GPT-4 also interpolates new problems whose difficulty
    should fall between paired GSM8K and MATH examples.
  trace_author: GPT-4 writes the 49k seed LCE solutions, while a CodeLlama-34B MathCoder-Initial model writes three candidate
    LCE solutions for each interpolated problem.
  answer_format: A system instruction and user math problem followed by assistant content blocks that interleave natural-language
    reasoning, Python code, execution output, continued reasoning, and a final answer.
  process_fields:
  - messages.role
  - messages.content.type
  - messages.content.content
  environment_or_substrate: Python execution in a persistent Jupyter Notebook provides results that are appended between reasoning
    blocks; the public release serializes the resulting trajectory as nested JSON messages.
  verifier_or_reward: Seed solutions must end in the GSM8K or MATH ground-truth answer. Interpolated problems retain solutions
    only when three MathCoder-Initial generations agree on the answer; GPT-4 separately judges relative problem difficulty.
  terminal_predicate: Finish when the LCE sequence reaches a final answer after at most 32 generated blocks; retain seed traces
    on ground-truth answer match and interpolated traces on three-answer agreement.
recipe_metadata:
  base_model: Llama-2 7B/13B/70B and CodeLlama 7B/13B/34B are the reported SFT consumers.
  teacher: GPT-4 authors seed LCE traces and interpolated questions; MathCoder-Initial, obtained by fine-tuning CodeLlama-34B
    on seed traces, authors interpolated-question solutions.
  generator: Generate LCE blocks in the order natural-language reasoning, Python code when needed, execution output, and continued
    reasoning; special tokens identify text, code, execution, block end, and message end.
  filtering_rule: Require seed final answers to match source ground truth; for questions without ground truth, generate three
    solutions and keep only groups whose final answers all agree.
  sampling_protocol: Build 49k GPT-4-annotated GSM8K/MATH records, then add 31k self-distilled records from GPT-4-interpolated
    questions for a reported 80k-record mixture.
  rollout_count: 80000
  temperature: null
  inference_budget: At most 32 LCE blocks and 512 new tokens per block are reported for model inference; GPT-4 sampling temperature,
    generation retries, total tokens, and construction cost are not disclosed.
  optimizer_or_scaffold: Fine-tune for three epochs with learning rate 2e-5, context length 2048, batch size 128, cosine scheduling,
    50 warmup steps, DeepSpeed ZeRO-3, flash attention, and 8 to 32 A800-80GB GPUs depending on model size.
audit:
  source_mixture: The reported mixture contains 49k ground-truth-filtered GPT-4 LCE solutions for GSM8K and MATH training
    problems plus 31k answer-consistent MathCoder-Initial LCE solutions for GPT-4-interpolated problems.
  split: The public non-gated release exposes one `train_80k.jsonl` file. Hugging Face metadata reports about 243.4 MB of
    stored data; a checked 256 KiB range contained 82 complete JSONL records with nested system, user, and assistant messages.
  decontamination: The paper uses official GSM8K/MATH training splits and evaluates out of domain, but reports no semantic
    deduplication or explicit train-test contamination scan for interpolated questions.
  license: The MathCodeInstruct dataset and MathCoder code repository declare Apache-2.0. Records do not expose per-item source
    or interpolation provenance, so downstream redistribution still requires reviewing GSM8K, MATH, and generated-data terms.
  lineage: 'instruction / demonstration / rationale data; closest comparisons: MAmmoTH/MathInstruct, WizardMath, RFT, Program-of-Thoughts,
    PAL, and GPT-4 Code Interpreter trajectories.'
  known_failure_modes:
  - Three generated answers can agree on the same wrong result, so self-consistency is weaker than ground-truth or formal
    verification.
  - Public records contain executable Python and must be sandboxed; serialized execution outputs are evidence from construction,
    not a guarantee that reruns remain deterministic or safe.
  - The public schema omits per-record source, seed/interpolation label, teacher identity, and filter outcome, limiting mixture
    and provenance audits.
  citation_status: verified
  confidence: high
  notes: Official OpenReview forum z8TW0ttBPp and the author repository confirm ICLR 2024 acceptance. The paper PDF, affiliation
    block, 49k/31k construction stages, LCE special-token contract, filtering rules, ablations, Apache-2.0 repository, public
    dataset metadata, 256 KiB of the actual JSONL file, and current adoption signals were checked on 2026-07-14.
inclusion_reason: MathCoder centrally constructs and releases step-level mathematical trajectories in which reasoning, executable
  code, execution feedback, and continued reasoning form one supervised target.
