one_line_summary: FastTTS accelerates verifier-guided test-time reasoning on a single edge GPU through speculative beam extension,
  prefix-aware scheduling, and asymmetric generator-verifier memory allocation.
why_it_matters: It treats test-time scaling as a systems scheduling problem and shows that the same search policy can be substantially
  faster without changing its algorithmic output.
