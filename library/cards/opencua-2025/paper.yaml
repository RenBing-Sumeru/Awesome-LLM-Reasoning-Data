one_line_summary: OpenCUA turns 22,625 human desktop tasks into aligned screenshot-action traces with Claude-generated reflective
  supervision and releases the data, models, tools, and offline evaluator, while leaving full training and environment replay
  incomplete.
why_it_matters: For the Data Construction track, it makes collection, action reduction, visual-state matching, synthetic reflection,
  filtering, source mixing, and deployment evaluation separable audit objects instead of treating model benchmark gains as
  data quality.
