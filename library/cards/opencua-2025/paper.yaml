    dataset card/files, and OpenCUA-7B model card were checked on 2026-07-21. Artifact verification confirms a substantial
    release, not paper-exact training or environment replay and not stepwise rationale validity.
inclusion_reason: 'OpenCUA exposes an unusually complete human-demonstration-to-training pipeline for computer-use data: cross-platform
  collection, event reduction, state-action alignment, reflective trace synthesis, mixed supervision, open artifacts, and
  explicit audit boundaries around privacy, replay, and post-hoc reasoning.'
