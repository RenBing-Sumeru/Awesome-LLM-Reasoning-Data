one_line_summary: Claude Sonnet 4.5's system card discloses broad source categories, RLHF/RLAIF, safety-pipeline changes,
  reward-hacking stress tests, and a white-box evaluation-awareness audit, but not the associated training data, reward functions,
  model internals, or reproducibility artifacts.
why_it_matters: It is a high-value Track 12 report because it makes the difference between disclosed frontier evaluation practice
  and undisclosed post-training data/reward contracts unusually legible, including a concrete warning that evaluation awareness
  can confound safety evidence.
