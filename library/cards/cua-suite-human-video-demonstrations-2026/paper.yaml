one_line_summary: CUA-Suite releases about 10,000 expert desktop videos with timestamped actions and dense UI links, preserving
  full interaction trajectories for computer-use training and process evaluation.
why_it_matters: It preserves temporal interaction evidence that sparse screenshots and final clicks discard.
