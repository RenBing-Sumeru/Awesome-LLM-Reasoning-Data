one_line_summary: Legal-R1 retains legal reasoning traces whose answers match gold labels within up to three DeepSeek-R1 attempts,
  reporting 96,533 bilingual SFT records while the verified official repository remains empty.
why_it_matters: The paper makes its rejection-distillation and staged-training logic inspectable, while exposing the answer-level
  verifier, lineage, legal-validity, licensing, and release gaps that must be resolved before the data can be audited or reused.
