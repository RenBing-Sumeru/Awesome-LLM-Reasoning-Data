one_line_summary: WeaveBench packages 114 English Ubuntu desktop tasks that require interleaved GUI and CLI/code actions and
  scores each full episode with an evidence-fetching trajectory judge that audits deliverables, traces, and shortcut behavior.
why_it_matters: 'It turns agent evaluation into an auditable episode-level data contract rather than a final-file check: the
  paper shows outcome-only grading would inflate GPT-5.5 PassRate from 33.3% to 53.5%, while the release exposes task bundles,
  environment assets, judge outputs, and a paper-pinned dataset revision.'
