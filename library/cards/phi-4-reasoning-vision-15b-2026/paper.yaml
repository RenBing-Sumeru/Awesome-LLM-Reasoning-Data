one_line_summary: Phi-4-reasoning-vision-15B reports a 200B-token, three-stage mixed-reasoning SFT pipeline with public source
  families and data-quality transformations, but withholds training records, internal/acquired data, verification details,
  and full audit artifacts.
why_it_matters: It shows how a frontier report can disclose useful construction interfaces without turning public weights,
  aggregate counts, or a source list into evidence of reproducible data lineage, feedback, rights, or auditability.
