data_object:
  prompt_source: Reasoning tasks in four domains, including AQuA, LogiQA, TruthfulQA, and HLE-BIO.
  trace_author: Four representative LLMs generate trajectories; experts annotate unfaithfulness status, causes, and step-level
    evidence.
  answer_format: Question, CoT trajectory, answer, instance faithfulness label, unfaithfulness cause, and supporting step
    evidence.
  process_fields:
  - cot_steps
  - faithfulness_label
  - unfaithfulness_cause
  - step_evidence
  - model_family
  - domain
  environment_or_substrate: Chain-of-thought reasoning and interventions on reasoning steps.
  verifier_or_reward: Expert labels define instance-level unfaithfulness; evaluation also uses counterfactual, logit-based,
    and LLM-as-judge methods.
  terminal_predicate: A detector decides whether an observed trajectory faithfully reflects the model's internal reasoning
    process.
recipe_metadata:
  base_model: Four source LLMs and eleven evaluated detection methods; see the paper for full configurations.
  teacher: Expert annotation of unfaithfulness causes and step-level evidence.
  generator: CoT trajectories produced by representative LLMs across four domains.
  filtering_rule: Curate trajectories and expert labels under a multi-round protocol for instance-level faithfulness.
  sampling_protocol: Evaluate counterfactual, logit-based, and LLM-as-judge detectors on faithful and unfaithful instances.
  inference_budget: Repository configurations specify model, seed, temperature, and token settings for evaluation runs.
  optimizer_or_scaffold: Step-removal and counterfactual faithfulness evaluation; the repository also supports ICL and fine-tuning
    configurations.
  rollout_count: null
  temperature: null
audit:
  source_mixture: CoT trajectories from four LLMs in four domains with expert annotations and released evaluation assets.
  split: FINE-CoT has more than 1,000 trajectories, including more than 300 unfaithful instances; inspect faithcot.zip for
    exact partitions.
  decontamination: Use the provided benchmark split and do not evaluate models trained on the public instance labels without
    a held-out protocol.
