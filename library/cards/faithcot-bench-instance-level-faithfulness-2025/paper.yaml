one_line_summary: FaithCoT-Bench pairs expert-annotated CoT trajectories with step evidence to test whether a specific explanation
  reflects a model's internal reasoning.
why_it_matters: It operationalizes instance-level CoT faithfulness with expert evidence instead of inferring trustworthiness
  from final-answer correctness.
