data_object:
  prompt_source: Approximately 15,000 mathematics problems, primarily from GSM8K and MATH, augmented with MathShepherd and
    RLHFlow process-reward data; PRM800k is excluded to reduce evaluation leakage.
  trace_author: OmegaPRM MCTS generates initial rollouts; DeepSeek-V3 judges agreement with proposed error locations; DeepSeek-R1-Distill-Qwen-32B
    synthesizes stepwise fast or explanatory targets.
  answer_format: The public release stores a conversations list whose prompts contain a problem and cumulative reasoning-step
    context, paired with an assistant target that is either a one-token plus verdict or a think-tag explanation ending in
    a plus or minus verdict.
  process_fields:
  - conversations
  environment_or_substrate: OmegaPRM divide-and-conquer MCTS with UCB-style state selection, followed by full-trace judge
    filtering, positive/negative rebalancing, and stepwise target synthesis.
  verifier_or_reward: DeepSeek-V3 accepts or rejects OmegaPRM error hypotheses during filtering; the trained Dyve verifier
    emits a stepwise binary verdict, optionally preceded by a detailed analysis.
  terminal_predicate: A construction rollout survives when DeepSeek-V3 confirms the proposed assessment. At inference, Dyve
    returns the first step parsed as negative, or accepts the full trace if no negative verdict occurs.
recipe_metadata:
  base_model: DeepSeek-R1-Distill-Qwen-14B is the main Dyve base; Qwen2.5-14B, Qwen3-8B, and Llama-3.1-8B variants appear
    in transfer experiments or ablations.
  teacher: DeepSeek-V3 supplies trace-level consensus filtering; DeepSeek-R1-Distill-Qwen-32B supplies step analyses and fast/slow
    targets.
  generator: OmegaPRM MCTS generates approximately 20 reasoning rollouts per source problem.
  filtering_rule: Keep rollouts whose OmegaPRM error hypothesis is confirmed by DeepSeek-V3, discard contradictions, then
    rebalance correct and incorrect steps before target synthesis.
  sampling_protocol: Approximately 20 MCTS rollouts per problem over about 15,000 source problems. Exact source allocation,
    exploration constant, decoding temperatures, seeds, and search limits are not fully reported.
  rollout_count: 20
  temperature: unknown
  inference_budget: Dyve verifies prefixes sequentially, allowing one to 8192 output tokens per step and stopping at the first
    negative verdict; the reported model input limit is 2048 tokens. The MCTS search budget beyond about 20 rollouts per problem
    is unknown.
  optimizer_or_scaffold: Supervised next-token training with LoRA rank 16, alpha 16, dropout 0.1, three epochs, per-device
    batch size 2, gradient accumulation 8, learning rate 2e-5, weight decay 0.01, and FP16 on eight NVIDIA A800-SXM4-80GB
    GPUs.
audit:
  source_mixture: GSM8K and MATH problems plus MathShepherd and RLHFlow process-reward data, OmegaPRM-generated rollouts,
    and two DeepSeek-family teacher roles.
  split: The current Hugging Face release exposes only a default train split with 156,321 rows. Exact source splits and released
    train/evaluation manifests are not disclosed.
  decontamination: PRM800k is explicitly excluded to reduce ProcessBench leakage; broader semantic deduplication, ProcessBench
    overlap checks, and base-model pretraining overlap are unknown.
  license: The released model card declares MIT. No license is displayed on the checked dataset page or code repository. The
    ACL paper is CC BY 4.0; this does not determine rights for the data or code.
  lineage: Source problems and imported process data lead to about 1.2 million noisy rollouts, DeepSeek-V3 agreement filtering
    and rebalancing, then DeepSeek-R1-Distill-Qwen-32B target synthesis and SFT of a DeepSeek-R1-Distill-Qwen-14B verifier.
    The paper reports about 117,000 curated traces, while the current Hugging Face train split contains 156,321 rows.
  known_failure_modes:
  - DeepSeek-V3 agreement is not independent ground truth and can preserve correlated judge errors.
  - The release provides no retained-label precision, recall, calibration, or human-agreement study.
  - Positive/negative rebalancing changes natural error prevalence, but the target ratio and sampling rule are not quantified.
  - The approximately 117,000 paper traces are not reconciled with the 156,321 current Hugging Face rows or an immutable release
    revision.
  - The public row schema exposes only conversations, not source identity, error hypotheses, judge decisions, rejection logs,
    or rebalancing provenance.
  - Dataset and code licenses are not displayed, and inherited source licenses are not consolidated.
  - PRM800k exclusion covers one leakage route, not broader benchmark or pretraining contamination.
  - MCTS constants, decoding settings, seeds, teacher prompts, model revisions, and end-to-end release manifests are incomplete.
  - System-2 explanations may be plausible post-hoc rationales rather than faithful error localization.
  - First-error stopping omits supervision for later steps after the detected divergence.
  - Evaluation is mathematics-only, and System-2-only scoring is more accurate on all four ProcessBench domains reported,
    so Dyve primarily establishes an accuracy-efficiency tradeoff.
  citation_status: verified
  confidence: high
  notes: ACL paper and appendix, arXiv, official GitHub, Hugging Face data, and Hugging Face model were checked on 2026-07-22.
    Release-count reconciliation, immutable revisions, and dataset/code licensing remain unresolved.
inclusion_reason: Dyve gives an open, auditable example of refreshing process-verifier supervision by filtering noisy MCTS
  rollouts and synthesizing adaptive fast verdicts or detailed step analyses.
