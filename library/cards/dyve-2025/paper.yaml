one_line_summary: An open process-supervision recipe that filters noisy MCTS traces and converts retained steps into mixed
  one-token and explanatory verifier targets.
why_it_matters: The work exposes a reusable verifier-data refresh pipeline while making judge correlation, rebalancing, release
  mismatch, and license risks central to reuse decisions.
