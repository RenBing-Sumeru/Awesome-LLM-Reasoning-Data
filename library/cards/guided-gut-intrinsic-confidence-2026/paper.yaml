data_object:
  prompt_source: AIME 2024/2025, AMC 2023, MATH500, and LiveCodeBench prompts; LIMO is used only for confidence-calibration
    training.
  trace_author: DeepSeek-R1-Distill-Qwen and Qwen2.5-Math models generate step-delimited reasoning branches.
  answer_format: Prompt, step candidates, token-probability-derived confidence, novelty score, retained branch, final answer,
    and benchmark correctness.
  process_fields:
  - prompt
  - reasoning_step
  - intrinsic_confidence
  - novelty
  - branch_score
  - final_answer
  - correctness
  environment_or_substrate: Lightweight DVTS-style tree search over local reasoning models.
  verifier_or_reward: No external verifier is used at inference; GRPO calibrates intrinsic confidence with correctness- and
    confidence-aware reward terms.
  terminal_predicate: Benchmark-specific exact answer matching or code benchmark scoring determines final correctness.
recipe_metadata:
  base_model: DeepSeek-R1-Distill-Qwen-1.5B and 7B; Qwen2.5-Math-1.5B-Instruct for verifier comparison.
  teacher: Not applicable; the model internalizes a confidence signal rather than consulting a separate PRM.
  generator: A confidence- and novelty-guided diverse verifier tree search expands reasoning steps.
  filtering_rule: Search ranking prefers high intrinsic confidence while retaining novelty; termination follows depth, length,
    degeneration, or final-answer conditions.
  sampling_protocol: Compare chain-of-thought, Best-of-N, PRM-guided DVTS, and Guided by Gut at matched search budgets.
  rollout_count: 32 or 64 total paths in the primary comparison; model- and benchmark-specific settings are reported in the
    paper.
  temperature: 0.6 during GRPO generation; see the paper for inference configuration.
  inference_budget: 16K token budget for tree search in primary comparisons, with up to 200 reasoning steps for R1 models.
  optimizer_or_scaffold: GRPO confidence calibration followed by intrinsic-confidence and novelty-guided DVTS.
