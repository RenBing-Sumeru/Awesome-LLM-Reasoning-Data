one_line_summary: ReFInE converts grounded long-form QA into expert-validated sentence-level (document, sentence, relation)
  provenance records, then GenProve trains Qwen3 with SFT and composite-reward GRPO.
why_it_matters: It makes evidence-use type and sentence pointer part of the generated training target and reward, while its
  count, configuration, lineage, and license gaps illustrate why an available repository is not automatically a reproducible
  open release.
