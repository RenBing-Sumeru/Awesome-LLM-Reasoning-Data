one_line_summary: An RLVR method that tree-samples reasoning rollouts, back-propagates verifiable leaf rewards, and optimizes
  sibling step groups with dense relative advantages.
why_it_matters: 'It makes a concrete test-time trace-to-training contract auditable: leaf correctness signals are transformed
  into intermediate rewards and filtered sibling groups, while the lack of released raw trees limits independent trace analysis.'
