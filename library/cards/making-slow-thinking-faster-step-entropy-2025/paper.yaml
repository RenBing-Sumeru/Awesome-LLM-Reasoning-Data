status: partial
one_line_summary: The paper ranks newline-delimited CoT steps by model-derived entropy, replaces low-entropy steps with [SKIP],
  and trains SFT-plus-GRPO models to generate shorter reasoning traces.
why_it_matters: 'It operationalizes Track 5''s core distinction between a full rollout trace and a selected trace: a model-derived
  step score chooses what to hide, and the selected compressed trace becomes an SFT target before GRPO further trades off
  answer correctness and token use. The unavailable generated corpus and selector/reward logs prevent independent assessment
  of lineage, selection bias, and reusable training data.'
