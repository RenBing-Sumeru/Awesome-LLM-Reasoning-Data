inclusion_reason: 'A direct Track 5 long-to-short trace-construction recipe: it converts model-generated full CoTs into step-entropy-ranked
  compressed traces, then uses SFT and GRPO to transfer selective [SKIP]-based reasoning to lower-token inference.'
