inclusion_reason: 'PORTool exposes a useful trajectory-data contract: multiple tool-use episodes share prefixes, terminal
  success/failure propagates through descendant branches, execution feedback remains auxiliary, and local fork comparisons
  are blended with global trajectory advantages for agentic RL.'
