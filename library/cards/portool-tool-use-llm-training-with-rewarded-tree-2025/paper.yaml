one_line_summary: PORTool turns 8 shared-prefix tool-use rollouts per query into correctness-dominant step importance for
  SFT-warm-started agentic RL, but its 3,607 production queries, trajectory trees, rewards, code, checkpoints, and 21-tool
  backend remain private.
why_it_matters: It makes credit assignment across successful, failed, and unable-to-answer tool paths explicit while showing
  that a training recipe can be well described yet remain non-replayable and unavailable as a reusable public dataset.
