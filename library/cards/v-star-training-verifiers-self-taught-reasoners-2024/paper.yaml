inclusion_reason: 'V-STaR is a clean verifier-data recipe: it preserves rejected self-generated reasoning, converts programmatic
  outcomes into synthetic same-query preferences, refreshes the negative distribution through iterative generators, and uses
  the resulting verifier for adaptive test-time selection while exposing outcome-label and pairing risks.'
