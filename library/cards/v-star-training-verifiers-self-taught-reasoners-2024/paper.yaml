one_line_summary: V-STaR keeps correct self-generated solutions for iterative generator SFT and converts correct-versus-incorrect
  outcomes into DPO verifier pairs for Best-of-k ranking.
why_it_matters: It shows how rejected generations can become reusable verifier supervision and how generator refresh changes
  negative examples, while making terminal-label noise, Cartesian-pair correlation, score gaming, and inference budget explicit
  audit objects.
