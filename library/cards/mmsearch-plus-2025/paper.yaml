one_line_summary: MMSearch-Plus releases 311 image-grounded QA rows and evaluates agents over SerpAPI/Gemini search with answer-level
  GPT-4o judgment, but does not release the agent framework, SoM boxes, complete trajectories, or replay snapshots.
why_it_matters: It makes weak visual cues, region-level crop/search decisions, noisy live-web retrieval, and provenance checking
  part of the agent evaluation contract while showing why a public question/image table alone is insufficient for trajectory
  reuse, verifier audit, or deterministic comparison.
