data_object:
  prompt_source: Procedurally generated bottleneck-computation tasks and diversionary-hint tasks across 13 settings.
  trace_author: Ten open-weight LMs generate CoTs; an automated retrieval-and-validation pipeline derives step and CoT labels
    from known required computations.
  answer_format: Task, CoT steps, answer, required computation or hint condition, step label, and CoT label.
  process_fields:
  - cot_steps
  - bottleneck_steps
  - hint_acknowledgment
  - faithfulness_label
  - step_type
  - cot_label
  environment_or_substrate: Controlled tasks whose outputs reveal required intermediate computation.
  verifier_or_reward: Automated label extraction, validated against human annotations at 98.9% precision.
  terminal_predicate: A CoT contains the required faithful computations and no unfaithful step.
recipe_metadata:
  base_model: Ten open-weight models from Qwen3, OLMo 3, DeepSeek-R1-Distill, and Llama 3.3 families.
  teacher: Gemini 3 Flash retrieval judge and Gemini 3 Pro validation judge.
  generator: Procedural task generation plus CoT sampling.
  filtering_rule: Keep outright cases with correct answers and diversionary cases following the hint, then extract labels
    with precision-oriented multi-track judges.
  sampling_protocol: Evaluate existing faithfulness metrics at step and CoT level over balanced labels.
  inference_budget: The paper reports metric costs; consult the released resources for exact settings.
  optimizer_or_scaffold: Ground-truth meta-evaluation benchmark.
  rollout_count: null
  temperature: null
audit:
  source_mixture: 13 controlled task types, ten model families, automated labels, and a larger unfiltered release.
  split: BonaFide has 3,066 labeled CoTs across 13 tasks and ten models; the paper also reports 1,946 labeled CoT steps.
  decontamination: Procedural task generation aims to preclude memorization shortcuts; public labels should not be reused
    for evaluation without held-out generation.
  license: arXiv manuscript is CC BY 4.0; check the official dataset release for data terms.
  lineage: arXiv paper, author GitHub repository, and official BonaFide Hugging Face release.
  known_failure_modes:
  - Task designs only recover selected necessary computations
  - Automated labels prioritize precision and may omit faithful details
  - Controlled tasks may not represent natural deployment CoTs
