one_line_summary: BonaFide creates CoTs with recoverable ground-truth computation labels to show that common faithfulness
  metrics often measure neither step nor whole-trace faithfulness reliably.
why_it_matters: It replaces plausibility and importance proxies with task designs that expose a known required computation
  for direct metric validation.
