one_line_summary: Qwen3-Next releases Instruct and Thinking weights and reports 15T pretraining plus GSPO-assisted RL, but
  does not disclose post-training prompts, rewards or verifiers, rollout groups, filters, or audit records.
why_it_matters: It is a high-impact disclosure case in which architecture, inference code, and model weights are inspectable
  while the data and feedback required to reproduce or audit reasoning post-training remain unavailable.
