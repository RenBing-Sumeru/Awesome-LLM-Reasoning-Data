  process_fields: []
  environment_or_substrate: The public objects are the Qwen3-Next Instruct and Thinking model repositories, configurations,
    and inference instructions. Training environments, task interfaces, tools, and retained training-record schemas are unknown.
  verifier_or_reward: The release says GSPO was used for RL stability and efficiency. The linked generic GSPO source defines
    sequence-level optimization over grouped responses and group-relative advantages, but Qwen3-Next-specific rewards, verifiers,
    judges, feedback sources, calibration, and error analysis are unknown.
  terminal_predicate: unknown
recipe_metadata:
  base_model: Qwen3-Next-80B-A3B-Base; 80B total parameters with about 3B activated.
  teacher: unknown
  generator: unknown
  filtering_rule: unknown
  sampling_protocol: The base model is reported to use a uniformly sampled 15T-token subset of Qwen3's 36T-token corpus. Post-training
    sample construction, mixture, response grouping, rollout allocation, and decoding are unknown.
  rollout_count: unknown
  temperature: unknown
  inference_budget: The Thinking model card recommends a maximum output length of 32,768 tokens for most queries and 81,920
    for complex mathematics or programming benchmarks. This is deployment guidance, not a disclosed training rollout budget.
  optimizer_or_scaffold: Qwen names GSPO and links its generic sequence-level objective, but Qwen3-Next-specific loss terms,
    reward computation, group size, optimizer, schedule, coefficients, checkpoints, and training budget are unknown.
audit:
  source_mixture: Only a uniformly sampled 15T-token subset of Qwen3's 36T-token pretraining corpus is disclosed. Source proportions,
    manifests, revisions, rights, and the complete post-training mixture are unknown.
  split: unknown
  decontamination: unknown
  license: Official Qwen3-Next model repositories state Apache-2.0 for released weights and code files. Rights and licenses
    for pretraining and post-training sources are unknown.
  lineage: Qwen3 36T corpus -> uniform 15T pretraining subset -> Qwen3-Next-80B-A3B-Base -> post-trained Instruct and Thinking
    variants. Item-level lineage, stage manifests, intermediate checkpoints, and retained or rejected records are unavailable.
  known_failure_modes:
  - No post-training prompts, responses, thinking traces, rollout groups, rejected outputs, or source manifests are released.
  - GSPO is named without a Qwen3-Next-specific reward, verifier, judge, feedback, rollout, or calibration contract.
  - The 15T sampling statement does not disclose corpus composition, source rights, filters, deduplication, or contamination
    controls.
  - Architecture and benchmark results cannot isolate the effects of post-training data, RL, reward design, or test-time budget.
  - Training and evaluation splits and benchmark-overlap controls are undisclosed.
