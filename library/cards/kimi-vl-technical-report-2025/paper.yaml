one_line_summary: Kimi-VL reports a mixed multimodal pipeline from human and model-generated SFT to Kimi k1.5 long-CoT filtering
  and ground-truth-centered RL, while releasing weights and inference material but not the training data, reward artifacts,
  agent environment, or audit records.
why_it_matters: It separates a detailed frontier-model narrative from the missing source manifests, validator specifications,
  licenses, splits, decontamination evidence, and replayable environments that Track 12 readers need to assess reuse and auditability.
