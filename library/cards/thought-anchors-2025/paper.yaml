one_line_summary: Thought Anchors releases MATH reasoning traces with sentence-level keep/remove continuation banks, correct
  and incorrect outcomes, answer- distribution importance metrics, and LLM-labeled dependencies for auditing which steps steer
  downstream reasoning.
why_it_matters: The release turns a reasoning sentence into an auditable intervention unit and preserves downstream continuations
  rather than only a scalar score, enabling trace attribution and failure analysis; it also demonstrates why file counts,
  nested rollout counts, generator lineage, and semantic filtering must be reconciled before reusing large rollout corpora.
