status: partial
one_line_summary: TokenSqueeze self-samples answer-checked traces, selects depth-adaptive correct positives against longer
  incorrect responses, KL-filters step rewrites, and trains concise reasoners with SFT plus length-aware DPO; the final generated
  corpus remains unreleased.
why_it_matters: 'It makes long-to-short reasoning a data-construction and feedback-contract problem: its efficiency depends
  on rollout budget, answer extraction, selector, negative-pair rule, KL approximation, and objective. Missing lineage, split,
  license, generated records, and decontamination evidence block data-level reuse claims.'
