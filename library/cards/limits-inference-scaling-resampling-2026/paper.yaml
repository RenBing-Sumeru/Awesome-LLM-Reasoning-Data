one_line_summary: Audits verifier-gated code resampling with weak and extended unit tests, showing that more attempts can
  preserve false positives and make a finite or zero budget optimal.
why_it_matters: Rejection-sampled reasoning data are only as reliable as their acceptance gate; this work makes verifier precision,
  generator capability, task difficulty, and sampling budget explicit audit dimensions.
