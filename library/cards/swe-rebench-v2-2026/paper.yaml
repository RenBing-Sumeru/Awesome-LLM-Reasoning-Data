one_line_summary: SWE-rebench V2 releases 32,079 prebuilt, test-verifiable repository repair environments across 20 languages
  plus 126,300 PR-derived training tasks, built by an automated setup, oracle-extraction, LLM-filtering, and metadata pipeline.
why_it_matters: It exposes the environment and terminal test contract needed to turn real repository changes into post-training
  tasks, while also surfacing the parser, specification, licensing, and replay risks that determine whether those tasks are
  trustworthy learning signals.
