one_line_summary: Gemini 2.5 Computer Use exposes a screenshot-action loop, human whole-trajectory judgments, partial environment
  details, and high-stakes safety gating, but not UI training data, reward, rollouts, or reproducible web pins.
why_it_matters: A public agent API and benchmark scores make deployment and evaluation concrete without revealing training
  trajectories, feedback objectives, or environment lineage.
