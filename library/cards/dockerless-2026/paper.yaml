one_line_summary: Dockerless replaces per-repository test execution during SWE-agent post-training with a golden-patch-conditioned
  verifier that asks 2-4 questions, gathers read-only repository evidence, and scores final patches for SFT filtering and
  GRPO.
why_it_matters: It exposes a concrete environment-free trajectory-to-reward recipe and strong controlled results, while showing
  that learned patch rewards remain dependent on reference solutions, compiler/dependency signals, calibration, replay metadata,
  and safety controls that are not released.
