  verifier_or_judge_failure_modes:
  - Dockerless requires a golden/reference patch for both question generation and final scoring, so the reported method does
    not directly cover new tasks lacking a known correct patch.
  - The final learned judge can produce false positives or false negatives even when repository evidence is plausible; AUC
    does not establish reward calibration or a safe operating threshold.
  - The final judge sees the golden patch, creating a leakage/similarity channel despite repository grounding and making alternative-but-correct
    solutions a key stress case.
  - Increasing questions beyond four degrades or fluctuates in AUC because redundant/noisy evidence can mislead the judge.
  - Candidate patches and rendered Q+A context are truncated to 10,000 characters, which can remove decisive long-repository
    evidence.
  - Compilation-heavy Rust and C show 7.0- and 13.3-point env-free SFT deficits, consistent with missing compiler diagnostics
    and dependency state.
  - Failed Dockerless passes are discarded before averaging; behavior when both M=2 passes fail is unknown and may introduce
    selection/reward bias.
  - Reward hacking and adversarial verifier gaming are not evaluated; a policy may optimize golden-patch/style cues or evidence-agent
    blind spots rather than functional correctness.
  successful_and_failed_sample_retention: Verifier training keeps correctly judged positives and negatives after a 4:1 negative
    cap, but discards teacher misjudgments, malformed/interrupted exchanges, and answer traces outside 4-30 turns. SFT keeps
    only top 4K of 16K and drops failed scoring passes; RL also drops failed scoring passes. No accepted, rejected, interrupted,
    timeout, or all-failed trajectories and no drop manifest are released.
  container_dependency_network_cache_timeout_replay: The paper pins `ubuntu:jammy-20260109` and conceptually uses repository
    base commits. Image digest, installed-package list, package-index snapshot, repository/submodule commit manifest, dependency
    installation policy, network/egress allowlist, cache behavior, filesystem reset, privilege/resource limits, numeric hard
    timeout, seeds, command logs, and replay scripts are unknown.
  security: Dockerless evidence sub-agents are prompt-restricted to read-only shell commands, but downstream OpenHands agents
    may issue arbitrary shell commands and receive real tool feedback. No threat model, sandbox hardening, privilege boundary,
    egress restriction, secret policy, package-supply-chain control, or malicious-repository defense is reported. Reproduction
    should use disposable, network-restricted infrastructure.
  privacy_or_consent: unknown
  citation_status: verified
  confidence: high
  notes: ArXiv v1 directly supports a verifier/reward and construction recipe using full-episode trajectories for SFT and
    a learned final-patch score for GRPO. Headline env-based results are Dockerless-RL-9B 62.0/50.0/35.2 on SWE-bench Verified/Multilingual/Pro
    versus 59.6/41.3/32.3 for Qwen3.5-9B and 62.4/51.3/35.7 for test-execution RL. These are author-reported and not independently
    reproduced. No open training corpus or reusable verifier implementation was verified.
  remaining_unknowns:
  - Official code, Dockerless/Dockerless-SFT-9B/Dockerless-RL-9B weights, verifier data, 16K/4K rollout data, 776-sample benchmark,
    and project page
  - Exact verifier trajectory count, train/validation split, task IDs, source-mixture weights, and GLM-5/Qwen3.5 revisions
  - SWE-Rebench-v2 task count, SFT/RL split, evaluation overlap, semantic deduplication, and pretraining-contamination audit
  - All-failed M=2 handling, score calibration, threshold/FPR/FNR, adversarial gaming, and reward-clipping policy
  - Image/repository/dependency/network/cache/reset/timeout/seed/replay manifest and sandbox security policy
  - Licenses, provenance, privacy, and consent for repositories, issues, patches, teacher traces, and rollouts
inclusion_reason: 'Dockerless makes the feedback boundary of environment-free SWE-agent post-training explicit: issue/repository
  rollouts produce final patches, read-only evidence agents inspect the codebase, and a learned patch-level score filters
  SFT trajectories and rewards GRPO. It is valuable as a verifier and trajectory-construction recipe, while its golden-patch
  dependency, compiler-state blind spots, missing calibration, and absent code/data/replay/rights artifacts are central audit
  constraints.'
