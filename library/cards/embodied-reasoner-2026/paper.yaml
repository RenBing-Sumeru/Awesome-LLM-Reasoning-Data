status: partial
one_line_summary: Embodied-Reasoner releases 9,390 AI2-THOR Observation-Thought-Action episodes built from GPT-4o imitation
  traces, environment-filtered self-exploration, and failure-aware reflection tuning, with about 64K images and 8M thought
  tokens.
why_it_matters: It provides an auditable example of turning simulator state checks and failed prefixes into multimodal process
  supervision, while showing why candidate attrition, alternative valid paths, trace faithfulness, replay, and release loadability
  must be checked separately from benchmark gains.
