data_object:
  prompt_source: The 7500-problem training split of MATH spanning seven mathematics topics.
  trace_author: QwQ-32B-Preview generates long CoT and Qwen2.5-32B-Instruct generates short CoT; large-small teacher pairs
    are Qwen2.5-72B/3B-Instruct, Llama-3.1-70B/8B-Instruct, and Gemma-2-27B/9B-it.
  answer_format: A MATH problem paired with a teacher-generated chain-of-thought response and final answer.
  process_fields:
  - problem
  - teacher_identity
  - teacher_size
  - cot_type
  - reasoning_trace
  - final_answer
  - correctness
  environment_or_substrate: Offline teacher generation, answer-based rejection sampling, controlled trace-mixture construction,
    and student supervised fine-tuning.
  verifier_or_reward: Teacher responses are retained through rejection sampling; paired comparisons use problems for which
    both compared teachers produce correct answers. Evaluation first uses exact answer matching and then Qwen2.5-32B-Instruct
    judgment for unmatched forms.
  terminal_predicate: A generated response yields a final answer judged correct against the MATH solution.
recipe_metadata:
  base_model: Qwen2.5-0.5B/1.5B/3B/7B/14B/32B-Instruct and Llama-3.2-1B/3B, Llama-3.1-8B, and Llama-3.3-70B students; Mix
    Distillation focuses on Qwen2.5-3B-Instruct and Llama-3.2-3B-Instruct.
  teacher: QwQ-32B-Preview for long CoT, Qwen2.5-32B-Instruct for short CoT, plus size-controlled Qwen2.5, Llama, and Gemma
    teacher pairs.
  generator: Each teacher greedily generates a reasoning response for a MATH prompt; the response and problem form an SFT
    pair after correctness filtering.
  filtering_rule: Rejection sampling retains correct responses; pairwise teacher comparisons restrict training to problem-solution
    pairs correct for both compared teachers.
  sampling_protocol: Default teacher decoding is greedy. Mix-Long uses long and short CoT in a 1:4 ratio; Mix-Large uses strong-
    and weak-teacher responses in the same 1:4 ratio.
  rollout_count: null
  temperature: null
  inference_budget: Maximum SFT sequence length 16384; evaluation maximum generation length 16000 tokens.
  optimizer_or_scaffold: LLaMA-Factory SFT for two epochs; students below 14B use full-parameter AdamW with maximum learning
    rate 1e-5, while larger students use LoRA with learning rate 1e-4.
audit:
  source_mixture: MATH prompts combined with long/short traces and strong/weak teacher traces from QwQ, Qwen2.5, Llama, and
    Gemma model families.
  split: The 7500-example MATH training split is used for construction; exact retained row counts and released split manifests
    are unavailable.
  decontamination: unknown
  license: The ACL paper is CC BY 4.0; licenses and redistribution terms for generated traces and upstream model outputs are
    not reported as a unified data release.
  lineage: MATH training prompt -> greedy teacher response -> answer-correctness rejection sampling -> matched correct teacher-pair
    pool -> long/short or strong/weak 1:4 mixture -> student SFT -> multi-benchmark evaluation.
  known_failure_modes:
  - Correct final answers do not prove that intermediate reasoning is valid
  - Qwen2.5-32B-Instruct judgment can introduce evaluator bias
  - the 1:4 mixture is tuned on 3B students and may not transfer to other capacities
  - conclusions are limited primarily to mathematical reasoning
  - teacher model versions and immutable generation snapshots are not pinned
  - exact paper-to-dataset and checkpoint mappings require release-level verification
  - decontamination is unreported.
  citation_status: verified
  confidence: high
  notes: Official Findings of ACL 2025 proceedings, DOI, arXiv, project page, MIT code repository, and UWNSL Hugging Face
    organization were verified on 2026-07-11. Exact paper-matched trace datasets, checkpoints, and immutable revisions still
    require artifact-level mapping.
inclusion_reason: Controlled teacher-trace construction study showing that reasoning length and teacher capacity must be matched
  to student learnability, with a concrete long-short and strong-weak mixing recipe.
