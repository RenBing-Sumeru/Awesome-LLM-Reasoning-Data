status: partial
one_line: The paper constructs matched long-short and strong-weak teacher-trace mixtures to show that small students often
  learn better from simpler or smaller-teacher reasoning.
one_line_summary: The paper constructs matched long-short and strong-weak teacher-trace mixtures to show that small students
  often learn better from simpler or smaller-teacher reasoning.
why_it_matters: It turns teacher identity, trace complexity, correctness matching, and student capacity into explicit data-selection
  variables while documenting a failure of naive strongest-teacher distillation.
