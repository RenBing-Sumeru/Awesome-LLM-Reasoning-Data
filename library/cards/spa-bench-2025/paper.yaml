one_line: SPA-Bench releases 340 bilingual Android task records and a mixed OCR/GPT-4o evaluation harness, but not the human
  screenshot demonstrations, paper-run traces, emulator snapshots, or immutable environment needed for training reuse and
  deterministic replay.
one_line_summary: SPA-Bench releases 340 bilingual Android task records and a mixed OCR/GPT-4o evaluation harness, but not
  the human screenshot demonstrations, paper-run traces, emulator snapshots, or immutable environment needed for training
  reuse and deterministic replay.
why_it_matters: It exposes how mobile-agent success depends on live app state, screenshots/actions, termination decisions,
  human task references, OCR gates, and model-mediated judgments rather than a simple offline action match. Its partial release
  also shows why task tables alone do not establish trajectory availability, safe agent training, stable replay, or cleared
  rights for side-effecting third-party app interactions.
