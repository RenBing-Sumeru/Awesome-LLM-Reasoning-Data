one_line_summary: ReST-MCTS* uses value-guided tree search and terminal-answer verification to create positive policy trajectories
  and scalar partial-solution targets for mutual self-training.
why_it_matters: For the Data Construction and Open Release Recipes track, the paper exposes a loop from prompt sourcing through
  tree search, terminal feedback, trajectory selection, value-label inference, and iterative reuse; its flattened public tables
  also make the missing lineage needed for process-level audit explicit.
