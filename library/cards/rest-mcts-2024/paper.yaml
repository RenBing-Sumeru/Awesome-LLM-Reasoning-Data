data_object:
  prompt_source: Answer-keyed mathematics and science questions. Initial value data use MATH training questions and 11,554
    lean-science questions from SciInstruct. The policy-generation pool is selected from the training sets of MATH, GSM8K,
    and TheoremQA; exact item IDs, proportions, and release-to-source mappings are unknown.
  trace_author: 'The current policy model generates reasoning steps inside MCTS*. Reported policy backbones are Llama3-8B-Instruct,
    Mistral-7B: MetaMATH, and SciGLM-6B.'
  answer_format: The construction object is a question with a reference answer and a tree of partial solutions and completed
    trajectories. Public policy data flatten a selected complete trajectory into instruction/output; public value data flatten
    a problem-plus-partial-solution and scalar target into prompt_answer/label.
  process_fields:
  - question and reference final answer
  - partial solution / MCTS* node state
  - generated next reasoning step
  - parent-child tree relation
  - node visit count
  - predicted quality value
  - minimum observed reasoning distance to a correct answer
  - terminal-answer verdict
  - selected complete trajectory
  - released policy fields instruction and output
  - released value fields prompt_answer and label
  environment_or_substrate: Offline MCTS* over reasoning-step nodes, followed by unfinished-branch pruning, terminal-answer
    verification, search-derived value-target inference, and iterative policy/value-model training.
  verifier_or_reward: A learned process value model guides selection, expansion, greedy rollout, backup, and early stopping.
    Completed traces are checked against reference answers by string matching or, when learned equivalence judgment is used,
    GPT-4. The exact judge revision, complete judging instruction, and error analysis are unknown.
  terminal_predicate: A completed trajectory enters positive policy data only when its extracted final answer matches or is
    judged equivalent to the reference answer. Separately, search can stop before that acceptance check when a node value
    reaches the reported 0.9 threshold.
recipe_metadata:
  base_model: 'Policy backbones are Llama3-8B-Instruct, Mistral-7B: MetaMATH, and SciGLM-6B. Mistral-7B is the value-model
    backbone for the Llama3 and Mistral policy lines, and ChatGLM3-6B is used for the SciGLM line.'
  teacher: There is no single teacher for all signals. Reference answers supply terminal feedback; GPT-4 is reported for terminal
    cases requiring learned equivalence judgment; the current policy supplies self-critique; and tree reachability plus observed
    reasoning distance produce scalar value targets.
  generator: The current policy expands reasoning-step branches and performs greedy rollouts within MCTS*, guided by the current
    process value model.
  filtering_rule: Remove unfinished branches, verify the remaining terminal answers, and use verified-correct complete trajectories
    as positive SFT data. Derive value data from partial solutions in the pruned search tree according to observed reachability
    and distance to a verified-correct terminal.
  sampling_protocol: Each search iteration uses a value-and-visit upper-confidence rule, expands b candidate next steps, greedily
    rolls out the best-valued continuation for at most m steps, and backs values up with a weighted average. Appendix E.2
    reports evaluation defaults T=50, b=3, m=2, alpha=0.5, and an ending threshold of 0.9. Exact settings for every released
    dataset are unknown.
  rollout_count: unknown
  temperature: unknown
  inference_budget: The reported default evaluation budget is 50 search iterations, expansion branch factor 3, and rollout
    depth cap 2. Per-example token totals and exact construction budgets for the public datasets are not disclosed.
  optimizer_or_scaffold: Mutual iterative self-training updates the policy on verified positive trajectories and the value
    model on search-derived partial-solution targets. Appendix E.1 reports MSE, AdamW, and learning rate 1e-6 for initial
    value training; the repository README lists different backbone-specific learning rates, so the paper-matched configuration
    requires reconciliation.
audit:
  source_mixture: 'Initial science value data use 11,554 lean-science SciInstruct questions; initial math value data use MATH
    train with breadth-first-search traces from Mistral-7B: MetaMATH. Policy generation uses questions selected from MATH,
    GSM8K, and TheoremQA train. Exact item IDs, proportions, and the mapping into each released iteration are unknown.'
  split: At verified Hub revisions, ReST-MCTS-PRM-0th has 473,833 rows (426,449 train / 23,692 validation / 23,692 test),
    the Llama3 first-iteration policy release has 33,722 train rows, and the Llama3 first-iteration PRM release has 673,492
    rows (626,108 train / 23,692 validation / 23,692 test). Split rationale and question-level disjointness are unknown.
  decontamination: unknown
  license: Hugging Face metadata tags ReST-MCTS-PRM-0th as Apache-2.0 and the checked Llama3 first-iteration policy data,
    PRM data, and policy checkpoint as CC-BY-4.0. The official code repository has no visible software license at the verified
    revision. Compatibility with upstream question, model, and generated-derivative terms remains unaudited.
  lineage: Answer-keyed question -> policy-generated MCTS* tree -> unfinished-branch pruning -> terminal-answer verification
    -> verified complete trajectories for policy SFT plus search-derived partial-solution values for value-model training
    -> next policy/value-model iteration.
  known_failure_modes:
  - A correct terminal answer does not establish that every retained intermediate step is valid.
  - Search-derived values measure observed reachability and progress under one policy and finite budget, not policy-independent
    logical truth.
  - A falsely high learned value can stop search at the 0.9 threshold; self-critique comes from the current inference model
    and is not an independent verifier.
  - String matching can mishandle equivalent formats, while the learned terminal judge revision and complete instruction are
    undisclosed.
  - The first visible public policy row reaches the correct answer through unsupported geometric claims, providing a concrete
    single-sample warning about terminal-only acceptance.
  - Public two-column policy and value tables omit tree topology, rejected branches, visits, terminal-verdict provenance,
    and per-example search settings.
  - Initial science labels assume supplied solutions are reliable and concise and treat added steps from a weaker generator
    as incorrect.
  - Policy and value models train on each other's searched outputs, so early search or value errors can be reinforced across
    iterations.
  - Search cost grows with iteration and branching; the paper reports 108 seconds per question for its basic MCTS* setting.
  - No decontamination analysis or question-level split provenance is reported for the released artifacts.
