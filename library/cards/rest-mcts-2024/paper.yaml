inclusion_reason: ReST-MCTS* is an open construction recipe that converts answer-keyed reasoning questions into both selected
  policy trajectories and search-derived partial-solution value targets, directly serving the Data Construction track's focus
  on auditable generation, feedback, selection, and release boundaries.
