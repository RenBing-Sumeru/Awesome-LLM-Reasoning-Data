data_object:
  unit_of_record: One public task record contains a SHA-1 task ID, conversational long-horizon instruction, starting URL,
    reference step count, easy/medium/hard level, SimilarWeb categories, and 3-12 rubric checkpoints. Each rubric has a requirement
    and a verification description. A generated evaluation episode separately contains ordered actions and screenshots, but
    the paper-run episodes are not released.
  prompt_source: Ninety tasks are composed from 696 filtered Prolific Chrome journeys, thirty are manually authored from real
    personal queries, and eighty hard tasks are generated by GPT-5.4 from journey-inspired seeds and human-reviewed.
  trace_author: Evaluated computer-use agents generate browser/VM interaction episodes at evaluation time. The paper tests
    Opus 4.6, GPT-5.4, Sonnet 4.6, GPT-5.4 Mini, Qwen-3.5-VL variants, and UI-TARS-1.5-7B; their complete episodes are not
    in the official repository.
  task_record:
  - task_id
  - confirmed_task
  - website
  - reference_length
  - level
  - rubrics
  - categories
  - num_categories
  rubric_record:
  - requirement
  - verification
  osworld_record:
  - id
  - snapshot
  - instruction
  - source
  - config
  - trajectory
  - related_apps
  - evaluator
  - proxy
  - fixed_ip
  - possibility_of_env_change
  - metadata
  context_or_state: A live Ubuntu/OSWorld VM, Chrome tabs and pages, optional files/applications, the initial instruction,
    and the sequence of screenshots and prior actions. Site state and content are not snapshotted in the release.
  trace_or_actions: OSWorld observation-action loop steps over GUI/browser and VM operations. Agents may navigate, click,
    type, manage tabs, save files, and use other VM capabilities; GPT-5.4 can emit multiple actions in one model call.
  observation: Chronological screenshots plus action records stored in a run's `steps.jsonl` or `traj.jsonl`. The released
    scorer consumes these files, but no complete experiment run directory is publicly bundled.
  answer_format: Task-specific browser state, kept-open evidence tabs, requested text summary, spreadsheet/document, or other
    observable deliverable described by the prompt.
  answer_or_artifact: The final live browser/VM state and any produced deliverable, evidenced only through the run's screenshots/actions
    for rubric scoring.
  process_labels:
  - per_rubric_binary_success
  - rubric_average
  - perfect_all_rubrics
  - environment_step_count
  - trajectory_efficiency
  verifier_output: One Gemini 3.1 Flash Lite Preview judgment per rubric with textual rationale and binary success/failure,
    followed by per-task average, perfect indicator, step count, and trajectory efficiency.
  reward: 'Evaluation-only scalar feedback: each rubric scores 0/1; unweighted rubric mean gives partial credit, perfect is
    1 only when all rubrics pass, and trajectory efficiency is mean rubric score divided by environment steps.'
  terminal_predicate: The agent terminates voluntarily or reaches the step cap. Benchmark perfect success requires every rubric
    to be judged satisfied; blocked access is a failure under the released judge prompt. Default experiments cap at 100 steps,
    with selected 200-step scaling runs.
  provenance: Consented raw Chrome journeys -> participant labels/key URL/feasibility -> LLM screening and author review ->
    696 retained journey labels -> clustered composition or journey-inspired hard generation plus manual authoring -> CUA
    prompt/rubric rewrite and two-pass QA -> public task/rubric record -> OSWorld live-web episode -> per-rubric multimodal
    LLM judgments.
  environment_or_substrate: OSWorld2 runner with an Ubuntu VM, Chrome, live Internet, and task-dependent starting URL. Released
    per-task configs launch Chrome and socat but set the native OSWorld evaluator to `infeasible`; external rubric scoring
    is required.
  release_boundary: Repository releases 200 task/rubric rows, 200 generated OSWorld task configs, a converter, an evaluation
    script, README, and MIT license. It does not release raw/retained human journeys, source URL histories, model run directories,
    complete successful or failed trajectories, screenshots, result files, human-agreement labels, or a frozen live-web replay
    package.
recipe_metadata:
  base_model: Not applicable to benchmark use. GPT-5.4 is the principal task-composition, hard-task generation, rewrite, and
    judging model during construction.
  teacher: GPT-5.4 generates structured tasks/rubrics and provides construction-stage judgments; authors and hired annotators
    review outputs. This is not trajectory distillation and no teacher trajectory corpus is released.
  generator: Prolific participants supply annotated Chrome journeys; GPT-5.4 composes and rewrites tasks/rubrics; authors
    manually author 30 tasks and review all final tasks; an LLM with web search cross-checks feasibility and rubric criteria.
  prompt_or_task_source: 2,380 labeled journeys from 248 consenting US/UK participants, filtered to 696 usable journey labels;
    real personal author queries; and journey-inspired hard task seeds. Raw URL histories are not released.
  filtering_rule: Screen label accuracy, feasibility, login requirements, and quality; manually verify URLs and live feasibility;
    remove login-gated/low-quality tasks; require at least two sites, complete rubrics, coherence >=2/5, natural CUA wording,
    observable evidence, no PII, and author adjudication of flagged issues.
  selection_threshold:
    retained_journeys: 696
    retained_fraction: 29.2%
    minimum_sites: 2
    minimum_coherence_score: 2/5
    source_journey_max_reuse: 3
    hard_generation_final_shortlist: 80
  sampling_protocol: For composed tasks, randomly select a seed cluster, traverse 1-2 BFS hops, collect 3-6 related clusters
    and 3-4 representative journeys per cluster, then let GPT-5.4 select/order a subset. Exact seeds, embedding/UMAP/HDBSCAN
    parameters, cluster assignments, and item-level source mapping are unavailable.
  rollout_count: unknown
  temperature: unknown
  inference_budget: Primary evaluation uses at most 100 environment steps and maximum reasoning effort. Opus 4.6 is also run
    to 200 steps across all 200 tasks; Qwen-3.5-9B has 200-step runs for a 76-task hard subset. Model-call/action batching
    differs.
  search_or_scaffold: Model-specific official OSWorld computer-use implementations in a common Ubuntu VM; Qwen receives an
    extra final-summary prompt. Exact OSWorld commit, VM image, dependencies, browser build, and model API snapshots are not
    pinned.
  optimizer_or_scaffold: No training optimizer is used. Odysseys evaluates frozen computer-use agents; using rubric scores
    for RL is described only as future work.
audit:
  source_mixture: Prolific Chrome-journey annotations, author personal queries, and GPT-5.4 journey-inspired task synthesis.
    Final tasks span 22 top-level and 88 fine-grained SimilarWeb categories, but the record-level mapping back to raw journeys/URLs
    is intentionally not released.
  split: All 200 public tasks form one evaluation set; no train/dev/test or hidden holdout split is specified. Difficulty
    partitions are 45 easy, 46 medium, and 109 hard. Human-agreement analysis uses 120 Opus 4.6 trajectories, whose IDs and
    labels are not released.
  decontamination: Authors cap journey reuse at three, manually deduplicate similar final tasks, and exclude PII/login-gated
    flows. No model-pretraining contamination screen, semantic overlap measurement against other web benchmarks, or future
    public- benchmark exposure protocol is disclosed.
  benchmark_overlap: Tasks are derived from participant behavior and model/author composition rather than copied from another
    benchmark, but no item-level overlap audit against Online-Mind2Web, WebVoyager, OSWorld, BrowseComp, or other public tasks
    is released.
  lineage: Aggregate construction counts and prompts are documented, but raw journey IDs, URLs, filter decisions, cluster
    memberships, source-to-composed-task mappings, and rejection manifests are unavailable. Appendix A.5's “2,380 refined
    journeys” conflicts with the reported 696 retained/refined journeys, leaving the exact 80-task hard-generation seed pool
    ambiguous.
  license: The official repository is MIT licensed; the arXiv manuscript uses arXiv's non-exclusive distribution license.
    The repository license does not grant rights to third-party live-site content/screenshots or unreleased participant histories,
    and no per-site terms/robots/license manifest is provided.
  release_version:
    paper: arXiv:2604.24964v1
    paper_date: '2026-04-27'
    repository_commit: 837814633ef948479abb3d142458f0acdb73fa65
    repository_tree: 86a335b83b5a18f24993baafb9b81f20bf59d802
    end_to_end_environment_tag: null
  artifact_release_state: Tasks, rubrics, OSWorld-format configs, converter, scorer, project task viewer, selected trajectory
    recordings, and MIT license are public. Full paper-run trajectories/results, raw participant histories, human agreement
    labels, source lineage, pinned VM/runtime, and frozen site states are not.
  released_objects:
