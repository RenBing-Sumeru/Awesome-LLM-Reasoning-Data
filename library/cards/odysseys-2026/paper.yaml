one_line_summary: Odysseys releases 200 live-web tasks with 1,225 rubric checkpoints and an OSWorld/Gemini scoring pipeline,
  but not the 2,380 source histories, complete model trajectories, human labels, frozen sites, or deterministic replay state.
why_it_matters: It replaces one holistic pass/fail judgment with checkpoint-level episode feedback over screenshots and actions,
  exposing partial progress and efficiency on multi-site tasks while making environment drift, judge dependence, incomplete-
  run handling, and absent rollout lineage explicit reuse risks.
