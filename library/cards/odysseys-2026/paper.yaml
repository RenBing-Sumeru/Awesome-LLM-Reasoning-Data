    rubric_records: 1225
    osworld_task_configs: 200
    raw_participant_journeys_released: false
    refined_journeys_released: false
    complete_model_trajectories_released: false
    complete_success_and_failure_results_released: false
    human_agreement_labels_released: false
  environment_versioning:
    runner: OSWorld2, exact revision unknown
    vm_image: unknown
    browser_version: unknown
    site_snapshots: null
    proxy: false
    fixed_ip: false
    reset_semantics: unknown
    possibility_of_env_change: high
  successful_and_failed_sample_retention: The paper analyzes successes and failures, but the full run corpus is not released.
    The public scorer skips directories lacking numeric `result.txt` unless `--include-incomplete` is passed, so incomplete/aborted
    episodes can be excluded from summaries by default. Paper-specific handling of every crash, timeout, empty action, and
    missing screenshot is not fully auditable.
  replayability: 'Not deterministic: live websites change; no site snapshots, OSWorld commit, VM/browser image, API/model
    revision lock, network locale/IP, credentials, action/screenshot corpus, or reset manifest is published. Public task configs
    explicitly mark high environment-change risk and disable proxy/fixed IP.'
  verifier_or_judge_failure_modes:
  - The preview Gemini judge can drift or be retired, and no exact API snapshot, temperature, seed, or cached judge response
    bundle is released.
  - Screenshots/actions may not expose hidden DOM/application state, saved-file correctness, off-screen content, or whether
    live facts remain valid.
  - Rubric-by-rubric binary calls reduce holistic overload but can produce inconsistent partial judgments across mutually
    dependent checkpoints.
  - The public JSON omits generation-time rubric weights, so released evaluation is effectively unweighted and cannot reproduce
    any weighted internal QA state.
  - Default omission of incomplete runs can inflate aggregates if crashes, timeouts, or absent result files are not explicitly
    counted as failures.
  - Observable-tab requirements may reward leaving pages open rather than robust evidence provenance, and judge-visible screenshots
    can miss citation quality.
  privacy_or_consent: Authors report informed participation through Prolific, participant self- annotation, PII rewriting/removal,
    and non-release of raw browser histories. Consent form, compensation, IRB/ethics review status, retention/deletion policy,
    participant withdrawal procedure, and a privacy audit are not disclosed.
  security: Tasks are intended to be read-only/low-impact and avoid completing purchases or submitting forms, but agents run
    with broad browser/VM abilities, can save files, inspect page source, access archives, and contact arbitrary public sites.
    Network allowlists, credential isolation, download/malware controls, robots/ToS enforcement, and incident containment
    are not documented in the release.
  known_failure_modes:
  - Opus often researches until the step cap without creating the requested deliverable.
  - GPT-5.4 can produce a correct plan but terminate with an empty action before meaningful browser execution.
  - High-fanout tasks stall after a subset of items and leave later phases untouched.
  - Programmatic shortcuts can abandon useful browser progress and end with zero completed rubrics.
  - Live-site blocking, CAPTCHA, stale prices/schedules, regional content, and page redesign change feasibility and scores.
  - README's always-Google start claim conflicts with 70 released tasks using another start URL.
  - The exact seed denominator for hard-task generation is inconsistent between the main paper and Appendix A.5.
  - Reported results are author runs; no complete pinned replay or independent reproduction was verified.
  citation_status: verified
  confidence: high
  notes: Audited arXiv v1 and appendices, project page, repository commit `8378146...`, all 200 task records/configs, converter,
    scorer, and license on 2026-07-20. Artifact verification covers task/rubric/evaluation code, not source journeys, complete
    trajectories, results, human labels, or deterministic environment replay.
  remaining_unknowns:
  - Exact seed pool behind Appendix A.5's 2,380-versus-696 refined-journey inconsistency.
  - Participant consent text, compensation, demographics beyond country, retention/deletion/withdrawal policy, and IRB status.
  - Source URL/journey-to-task lineage, filter/rejection decisions, cluster assignments, and task-generation random seeds.
  - Exact GPT-5.4 construction prompts beyond excerpts, temperatures, API snapshots, judge retries, and adjudication logs.
  - OSWorld commit, VM/browser/dependency images, network locale/IP, reset semantics, and site snapshots.
  - Complete successful, failed, incomplete, and crashed runs with screenshots/actions/results plus human-agreement labels.
  - Formal benchmark overlap, public-exposure contamination, and site-drift refresh policy.
  - Per-site legal/ToS/robots review and sandbox/network/download/credential security controls.
inclusion_reason: Odysseys defines a long-horizon live-web environment object, a released state/action-compatible task schema,
  and a fine-grained episode feedback contract based on per-rubric screenshot/action judgment; its missing source journeys,
  complete rollouts, reset state, and replay bundle are central audit boundaries.
