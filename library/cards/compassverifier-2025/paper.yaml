data_object:
  prompt_source: OpenCompass collects question/reference-answer pairs and more than 1,325,293 responses from 53 commercial,
    open, and reasoning model variants across 16 named benchmarks spanning mathematics, general reasoning, knowledge, and
    science. The released 2,817-row VerifierBench test set contains 14 represented source groups.
  trace_author: Fifty-three model variants generate the response pool. Qwen2.5-Instruct models, Math-Verify, DeepSeek-V3 prompt
    voting, and domain experts assign or adjudicate verification labels; DeepSeek-V3 also produces error-driven and complex-formula
    augmentation data.
  answer_format: Each released VerifierBench row contains question, gold_answer, llm_response, gold_judgment, data_source,
    domain, and answer_type. Gold judgment is A/Correct, B/Incorrect, or C/Invalid-quality-problem. Paper-internal annotation
    rationales, votes, filter decisions, and meta-error tags are not present in the released row schema.
  process_fields:
  - question and reference answer
  - source-model response
  - source benchmark, domain, and answer type
  - multi-expert and multi-prompt judgments during construction
  - human final judgment and rationale during annotation
  - deduplication, problem filtering, similarity filtering, and train/test route
  - error-pattern and augmentation provenance for verifier training
  environment_or_substrate: OpenCompass performs response collection and verifier evaluation; Qwen2.5 judges, Math-Verify,
    DeepSeek-V3 prompts, rule-based duplicate detection, symbolic algebra checks, and human annotation form the construction
    environment. The released repository provides inference prompts and an evaluation notebook, not the full construction
    or training pipeline.
  verifier_or_reward: CompassVerifier consumes a question, reference answer, and candidate response and emits A/Correct, B/Incorrect,
    or C/Invalid. The paper's binary benchmark evaluation and RL reward experiments merge B and C as incorrect; the GRPO experiment
    maps A to reward 1 and B/C to reward 0.
  terminal_predicate: For evaluation, the parsed A/B/C judgment is compared with the human gold label. For RL, a parsed Correct
    judgment supplies terminal reward 1 and any error supplies 0; this binary use discards the benchmark's Incorrect-versus-Invalid
    distinction.
recipe_metadata:
  base_model: CompassVerifier-3B, CompassVerifier-7B, and CompassVerifier-32B are fully fine-tuned from Qwen2.5-series causal
    language models. The paper and current model cards do not identify immutable base-checkpoint revisions.
  teacher: Qwen2.5-7B/14B/32B-Instruct and Math-Verify handle first-stage voting; DeepSeek-V3 performs multi-prompt voting,
    problematic-case filtering, answer-type classification, prompt/response augmentation, and targeted synthesis; domain experts
    resolve remaining disputes.
  generator: The original pool is generated by 53 model variants. DeepSeek-V3 generates error-driven decision-boundary cases
    and one to three equivalent variants per complex formula; prompts and long reasoning responses are also rewritten, truncated,
    tag-perturbed, shuffled, and mixed for generalization.
  filtering_rule: Remove easy first-stage consensus from the benchmark, retain second-stage consensus as base training data,
    string-deduplicate mainly Invalid responses, filter open-ended/proof/incomplete-reference cases, human-label remaining
    disputes, similarity-filter redundant Incorrect cases, balance the test set, and enforce paper-stated train/test non-overlap.
  sampling_protocol: OpenCompass uses dataset- and model-specific zero-shot, few-shot, and formatting configurations. Appendix
    A.3 states temperature 1.0 for synthesis and 0.0 for evaluation, but decoding settings, seeds, and immutable revisions
    for all 53 source models are not consolidated.
  rollout_count: unknown
  temperature: 1.0 for synthesis and 0.0 for evaluation/verification in Appendix A.3
  inference_budget: More than 1.325 million collected responses are reduced to 2,817 benchmark rows. Verifier fine-tuning
    uses maximum sequence length 32,768; released inference examples use up to 2,048 new tokens. The exact source-generation
    budget is unknown.
  optimizer_or_scaffold: 'The verifier training corpus totals 96,832 examples: 54,420 base consensus samples, 24,294 error-driven
    adversarial samples, and 18,118 complex-formula samples. Qwen2.5-series models are fully fine-tuned for one epoch with
    learning rate 2e-5, batch size 32, maximum sequence length 32,768, and multiplicative epoch decay gamma 0.85 on eight
    80 GB A100 GPUs. A separate two-epoch GRPO experiment trains Qwen3-4B-Base on a non-integer-answer subset of Open-S1 with
    group size 8 and no KL penalty.'
audit:
  source_mixture: The collection pool spans 16 benchmarks and 53 model variants with heterogeneous languages, answer formats,
    model/API revisions, prompts, and upstream licenses. The final 2,817-row test table contains 14 source groups, four domains,
    seven answer types, and labels A=1,092, B=1,526, C=199.
  split: The paper states that VerifierBench test rows do not overlap with CompassVerifier training data. The public Hugging
    Face release exposes only one approximately 2.82k-row test split; no item-level 96,832-row training manifest or executable
    overlap report is released.
  decontamination: Paper-level train/test non-overlap is stated, but semantic cross-source deduplication, source-model pretraining
    contamination, and overlap with external evaluation benchmarks are unknown.
  license: The ACL paper is CC BY 4.0. The VerifierBench page declares CC-BY-SA-4.0, and each released model page declares
    Apache-2.0. The checked GitHub commit 2d7cba6df0b21f9c6121786ac1e5770c68473598 advertises Apache 2.0 in a badge but contains
    no LICENSE, COPYING, or NOTICE file. Compatibility and inherited rights for all upstream questions, references, and model
    outputs remain unverified.
  lineage: Benchmark question/reference -> 53-model OpenCompass response pool -> Qwen2.5/Math-Verify first-stage voting ->
    DeepSeek-V3 multi-prompt and dataset-specific voting -> deduplication/problem filtering -> expert label and rationale
    -> similarity balancing -> 2,817-row VerifierBench test set; base consensus plus DeepSeek-V3 error-driven/formula augmentation
    -> 96,832-example internal training corpus -> 3B/7B/32B checkpoints.
  known_failure_modes:
  - Consensus among related model judges can preserve correlated errors; human annotation is the final reference but annotator
    counts, agreement, assignment, and adjudication protocol are undisclosed.
  - DeepSeek-V3 performs several filtering, classification, prompting, and synthesis roles, concentrating teacher and hidden-objective
    risk.
  - The A/B boundary is policy-sensitive for formatting, simplification, numerical tolerance, and multi-answer completeness;
    the paper explicitly reports divergent human-versus-model penalty thresholds.
  - Invalid combines flawed questions or references with truncated, repetitive, refused, or garbled responses; merging B and
    C for binary evaluation or reward removes that diagnostic distinction.
  - Excluding proof-based, open-ended, incomplete-reference, and ambiguous-threshold questions narrows coverage to reference-answer-verifiable
    outcome tasks.
  - String deduplication disproportionately removes Invalid responses, and similarity filtering removes redundant Incorrect
    responses, reshaping the natural label and error distribution.
  - The paper describes over 30 meta error patterns, over 40 high-impact categories, and 34 generated templates without releasing
    one versioned row-level taxonomy and mapping.
  - Appendix A.8 says 224,294 error-driven examples in prose, while Table 13 reports 24,294 and the 96,832 total requires
    24,294; the larger figure is treated as an unresolved typo.
  - The public dataset contains the benchmark only; the 96,832 training examples, votes, rationales, meta-error tags, filter
    decisions, and rejected records are not released.
  - The repository contains prompts and an inference/evaluation notebook but no construction scripts, verifier-training code,
    RL recipe implementation, or license file at the checked commit.
  - Source-model decoding parameters, seeds, benchmark versions, API snapshots, and collection dates are not consolidated
    into an immutable manifest.
  - Main benchmark and RL results are single reported point estimates without confidence intervals or independent reproduction;
    downstream performance does not prove label correctness or release completeness.
  citation_status: verified
  confidence: high
  notes: The complete ACL paper and appendices, ACL/arXiv metadata, project page, GitHub commit 2d7cba6df0b21f9c6121786ac1e5770c68473598,
    VerifierBench viewer/schema, three model pages, and Hugging Face collection were checked on 2026-07-22.
inclusion_reason: CompassVerifier exposes a practical outcome-verification data recipe combining large response collection,
  staged model voting, expert adjudication, explicit Invalid labels, error-driven augmentation, released test data, and released
  verifier checkpoints.
