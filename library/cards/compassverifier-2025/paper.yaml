status: partial
one_line_summary: A staged outcome-verifier pipeline with ternary human labels, error-driven synthesis, a public benchmark,
  and three public Qwen2.5-based checkpoints.
why_it_matters: It makes answer verification itself a trainable and testable data object for evaluation and RL rewards, while
  exposing label-policy, teacher concentration, binary-collapse, and release-completeness risks.
