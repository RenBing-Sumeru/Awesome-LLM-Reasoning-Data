data_object:
  prompt_source: Categorized Countdown, Zebra, ARC-1D, MATH, and mixed-domain problems
  trace_author: Current Qwen2.5 policy produces on-policy rollouts
  answer_format: Task-specific reasoning trajectory and verifiable final answer or state
  process_fields:
  - problem
  - category
  - rollout
  - task_reward
  - advantage
  - absolute_advantage
  - category_value
  - sampling_probability
  environment_or_substrate: Non-stationary category-bandit curriculum coupled to online GRPO
  verifier_or_reward: Task-specific outcome reward; mean absolute policy advantage per category drives curriculum
  terminal_predicate: Task-dependent correct answer, valid plan, puzzle assignment, or ARC transformation
recipe_metadata:
  base_model: Qwen2.5-3B and Qwen2.5-7B
  teacher: unknown
  generator: Current policy under GRPO
  filtering_rule: No static item filter; Boltzmann-sample categories from TD(0)-updated expected learning gains, then sample
    uniformly within category
  sampling_protocol: Partition by difficulty/type/domain, initialize values, softmax-sample category, sample problem, roll
    out and score, update policy, average absolute advantages, TD(0)-update category
  rollout_count: null
  temperature: null
  inference_budget: pass@1 uses eight generations; training rollout count configuration-specific
  optimizer_or_scaffold: SEC scheduler integrated with GRPO/verl
audit:
  source_mixture: Synthetic planning and inductive puzzles, MATH-style problems, labels, and on-policy Qwen rollouts
  split: Task-specific in-distribution categories and harder OOD evaluations
  decontamination: unknown
  license: MIT code repository; component data and generated-rollout licenses task-dependent or unknown
  lineage: Problem/category to bandit sampling, rollout, reward/advantage, category update, and next distribution
  known_failure_modes:
  - Absolute advantage can prioritize noisy high-variance categories
  - Results depend on curator-defined category boundaries
  - Distribution is seed- and checkpoint-dependent
  - Heterogeneous outcome verifiers do not validate traces
  - No tagged release or frozen curriculum/rollout logs
  - ICLR 2026 submission was withdrawn and is not accepted
  citation_status: verified
  confidence: high
  notes: arXiv v4, official MIT repository, and withdrawn OpenReview status verified.
inclusion_reason: Makes the changing category-level sampling distribution an explicit learned component of RLVR data construction.
