  known_failure_modes:
  - 'Step segmentation is an input requirement: the model card recommends double line breaks and insertion of `<extra_0>`
    after each step, so formatting choices can alter the computed reward sequence.'
  - The checked release sources do not disclose PRM training prompts, traces, labels, source provenance, filters, retained/rejected
    examples, or item-level lineage.
  - Reward-label semantics, calibration, aggregation, thresholds, and error analysis are not released, so independent verification
    of the 0–1 reward scale is unavailable.
  - The announcement's Best-of-N context scores candidate responses from step scores; Qwen's linked report warns that response-level
    BoN alone can be biased for process verification.
