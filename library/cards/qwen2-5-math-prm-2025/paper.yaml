one_line_summary: Qwen released 7B and 72B mathematical process reward models that score segmented reasoning steps through
  a 0–1 positive-class probability interface, but not their training data, labels, calibration, or construction/audit records.
why_it_matters: It separates a usable open PRM interface from the unreleased data and verifier evidence needed to reproduce,
  calibrate, or independently audit process supervision.
