    step boundaries and the `<extra_0>` separator-token interface; no training or replay environment is released.
  verifier_or_reward: The official 7B model card extracts the probability of the positive class at each `<extra_0>` separator
    as a reward between 0 and 1. Label semantics, calibration, aggregation, thresholds, error rates, and training-time verification
    are unknown.
