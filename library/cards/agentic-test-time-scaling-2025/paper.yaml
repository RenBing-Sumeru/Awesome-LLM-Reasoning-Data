one_line_summary: This study maps which test-time scaling mechanisms improve tool-using language agents and finds selective
  reflection, list-wise comparison, and diverse rollouts effective.
why_it_matters: It shows that test-time scaling choices interact with agent trajectories, tool actions, and result merging
  rather than transferring mechanically from single-answer reasoning.
