one_line_summary: COGS decomposes a few difficult visual questions into reusable perception and reasoning factors, then recomposes
  them with new images to synthesize QA data with factor-level process rewards.
why_it_matters: It releases a practical path from scarce seed supervision to image-grounded intermediate-answer supervision
  without manually labeling every trajectory.
