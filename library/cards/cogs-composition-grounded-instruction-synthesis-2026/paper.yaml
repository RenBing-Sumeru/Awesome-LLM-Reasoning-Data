data_object:
  prompt_source: Small seed sets of chart and webpage reasoning questions plus new source images.
  trace_author: A multimodal LLM decomposes seed questions and generates recomposed questions with subquestions and intermediate
    answers.
  answer_format: Image-grounded complex QA paired with factors, subquestions, intermediate answers, and final answer.
  process_fields:
  - perception_factors
  - reasoning_factors
  - subquestions
  - intermediate_answers
  - final_answer
  environment_or_substrate: Chart, document, and webpage visual reasoning.
  verifier_or_reward: Factor-level subquestion correctness shapes GRPO rewards alongside final-answer correctness.
  terminal_predicate: The generated final answer is correct for the composed visual question.
recipe_metadata:
  base_model: Qwen2.5-VL-7B in the reported experiments.
  teacher: A multimodal LLM performs factor decomposition and grounded question synthesis.
  generator: Recomposition of sampled perception and reasoning factors with a new image.
  filtering_rule: Grounded generation retains examples with subquestions, intermediate answers, and final answers suitable
    for process rewards.
  sampling_protocol: Decompose seeds, aggregate factors, sample and recompose them with images, then train with GRPO and factor-level
    reward models.
  inference_budget: See the official project and code for generation budgets.
  optimizer_or_scaffold: GRPO with StandardRM, ProcessRM-sum, or ProcessRM-max.
  rollout_count: null
  temperature: null
