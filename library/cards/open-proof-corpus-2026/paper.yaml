one_line: Open Proof Corpus releases thousands of frontier-model competition proofs with expert correctness labels, written
  feedback, optional error spans, provenance metadata, and best-of-N analysis splits.
one_line_summary: Open Proof Corpus releases thousands of frontier-model competition proofs with expert correctness labels,
  written feedback, optional error spans, provenance metadata, and best-of-N analysis splits.
why_it_matters: It provides unusually rich positive and negative proof supervision for training and auditing proof judges
  while exposing the limits of final-answer verification, selective best-of-N labeling, and single-judge proof assessment.
