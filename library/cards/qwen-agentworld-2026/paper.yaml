one_line_summary: Qwen-AgentWorld reports CPT, SFT, and GSPO RL over more than 10M seven-domain environment trajectories,
  releases 35B weights and the separate 2,170-sample AgentWorldBench test set, and leaves the training corpus and reward stack
  only partially auditable.
why_it_matters: It exposes enough of a frontier agent-world-model pipeline to distinguish trajectory sources, next-state targets,
  SFT curation, and RL feedback, while showing why an open benchmark and checkpoint do not make the underlying training data
  reproducible.
