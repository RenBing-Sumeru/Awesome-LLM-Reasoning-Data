audit:
  source_mixture: 'Primary source and official artifacts listed in artifacts for Spider: A Large-Scale Human-Labeled Dataset
    for Complex and Cross-Domain Semantic Parsing and Text-to-SQL Task.'
  split: Spider 1.0 uses train/dev/test splits over different databases; exact data zip, public/hidden test policy, and correction
    date must be pinned before score reuse.
  decontamination: Public benchmark records can leak into future training data; live, hidden, or post-cutoff claims require
    versioned evidence.
  license: Official site states the Spider dataset follows CC BY-SA 4.0; GitHub code is Apache-2.0. Downstream redistribution
    should still check the exact downloaded artifact.
  lineage: 'Primary source: https://arxiv.org/abs/1809.08887'
  known_failure_modes:
