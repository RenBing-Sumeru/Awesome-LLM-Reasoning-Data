one_line_summary: ThinkPRM trains generative process verifiers on 1,000 QwQ-generated, PRM800K-label-filtered verification
  CoTs and spends additional verifier compute to score or select reasoning paths.
why_it_matters: It makes verifier reasoning a first-class test-time trace and shows how process-label filtering, score extraction,
  repeated verification, and search aggregation jointly determine candidate selection, while leaving rationale validity and
  release lineage as separate audit questions.
