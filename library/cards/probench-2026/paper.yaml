one_line_summary: ProBench evaluates 217 bilingual mobile-GUI tasks by feeding action-level process descriptions and the final
  screen to a terminal Gemini judge, but releases neither a confirmed executable benchmark package nor a trajectory corpus.
why_it_matters: It demonstrates how a final-state benchmark can detect missed sorting, filtering and other invisible intermediate
  requirements without prescribing one gold path, while also exposing the audit cost of model-based judging, manual reset,
  mutable apps and absent record-level releases.
