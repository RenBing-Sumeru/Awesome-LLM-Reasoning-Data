one_line_summary: Generative Verifiers turns answer verification into next-token SFT over direct verdicts or generated critiques
  and releases GSM8K feedback records, but full license scope, code, checkpoints, and decontamination remain unresolved.
why_it_matters: It makes the verifier's language target, teacher, reference guidance, filtering rule, and inference budget
  explicit data-design choices that can be audited independently of Best-of-N scores.
