one_line_summary: HoWToBench evaluates 1,302 Chinese writing instructions with a transparent Tree-of-Writing rubric that makes
  score aggregation explicit.
why_it_matters: It addresses opaque rubric aggregation and tests robustness to disturbance rather than equating quality with
  fluent long text.
