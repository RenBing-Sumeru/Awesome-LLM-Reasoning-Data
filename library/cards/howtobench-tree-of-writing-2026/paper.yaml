data_object:
  prompt_source: Publicly licensed, human-written Chinese writing from specialized literary and writing-guide sites.
  trace_author: Human writers and expert annotators; models generate candidate writings for evaluation.
  answer_format: Instruction, optional grounding, human reference, tree-structured rubric plan, leaf scores, and aggregate
    score.
  process_fields:
  - instruction
  - grounding
  - reference
  - rubric_tree
  - leaf_score
  - edge_weight
  - overall_score
  environment_or_substrate: Open-ended Chinese writing across completion, guided, and open tasks.
  verifier_or_reward: Tree-of-Writing combines rubric LLM judges, rule/regex checks, and explicit aggregation weights.
  terminal_predicate: Weighted overall writing score plus interpretable sub-feature scores.
recipe_metadata:
  base_model: Ten flagship LLMs are evaluated.
  teacher: Human writing experts, GPT-4o tagger/back-constructor, and an LLM quality filter.
  generator: Web collection and reverse instruction construction.
  filtering_rule: Genre-specific 1–5 filtering retains examples scored at least 4; human check pass rate is 96.85%.
  sampling_protocol: 1,302 instructions, 12 genres, three task formats.
  rollout_count: null
  temperature: null
  inference_budget: Per-instruction tree planning and depth-first rubric scoring.
  optimizer_or_scaffold: Evaluation framework, not a released training objective.
