one_line_summary: Ada-RS filters multiple tool-use rollouts by an adaptive correctness-and-length reward, converting retained
  candidates into DPO preference pairs or DAPO training groups for selective reasoning.
why_it_matters: 'It makes the selection policy over multiple sampled reasoning traces explicit: correctness, reasoning length,
  prompt difficulty, and stochastic acceptance jointly determine which trajectories train the next policy, separating data-selection
  effects from the underlying DPO or DAPO optimizer.'
