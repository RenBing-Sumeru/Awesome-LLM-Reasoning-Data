one_line_summary: AReaL releases Apache-2.0 infrastructure and a NeurIPS asynchronous PPO recipe for math/code RL, but no
  canonical reasoning corpus, paper-run rollout/reward ledger, immutable data split or final-checkpoint provenance package
  was verified.
why_it_matters: It makes asynchronous RL's operational feedback contract inspectable—especially stale and cross-version rollouts—while
  demonstrating that high-throughput code and reported hyperparameters do not by themselves disclose source rights, reward
  decisions, trajectory lineage or evaluator validity.
