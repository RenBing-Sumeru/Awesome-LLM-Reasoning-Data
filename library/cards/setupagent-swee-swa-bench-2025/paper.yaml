one_line_summary: SetUpAgent turns issue-resolving GitHub pull requests into executable repository tasks by reconstructing
  historical dependencies and parsing tests; paper-time SWA/SWEE scales are 535/885 tasks, while current Hub releases expose
  450/798.
why_it_matters: It shows how an agent benchmark's real data object includes pinned repository state, setup commands, tests,
  parsers, containers, and a terminal predicate, and why release drift can undermine otherwise programmatic evaluation.
