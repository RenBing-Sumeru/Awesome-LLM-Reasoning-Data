    safety verification.
inclusion_reason: A cross-embodiment report spanning affordance, spatial, action, driving, and trajectory objects in a four-stage
  SFT-to-CoT-to-rule-GRPO curriculum, with a separate NAVSIM planner path and major disclosure gaps around scale, splits,
  privacy, safety, and artifacts.
