one_line_summary: MiMo-Embodied stages embodied, driving, generated-CoT, and deterministic-GRPO supervision, then separately
  studies NAVSIM IL+DiffGRPO, but discloses no training scale, mixtures, immutable splits, sensor ledger, rollouts, or planner
  artifacts.
why_it_matters: It maps heterogeneous embodied data objects into one curriculum while showing why offline geometric rewards,
  open-loop planning, and open weights do not substitute for provenance, privacy, closed-loop safety, and environment verification.
