data_object:
  prompt_source: Stage 1 combines inherited MiMo-VL general data with embodied affordance, planning, and spatial sources.
    Stage 2 carries prior data forward and adds autonomous-driving perception, prediction, and planning sources. Stage 3 adds
    generated CoT over an undisclosed subset. Stage 4 uses an undisclosed curated rule-verifiable RL set. Selected counts,
    source ratios, versions, and rows are unknown.
  trace_author: Public dataset authors and human annotators supply media, grounding labels, actions, justifications, and trajectories.
    DeepSeek-R1 generates long physical reasoning in Cosmos-Reason1. Automatically generated QA contributes to several sources.
    The Stage-3 CoT teacher is unknown. Expert human drivers supply proprietary demonstrations under undisclosed protocols.
  answer_format: Objects include captions, free-text or multiple-choice answers, points, masks, 2D/3D boxes, spatial relations,
    route and action plans, traffic intent, meta-actions, justifications, CoT rationales, and continuous future ego trajectories
    in downstream planner experiments.
  process_fields:
  - source_dataset
  - source_media_id
  - image_or_video
  - camera_view
  - camera_parameters
  - rgb_d
  - ego_state
  - navigation_command
  - task_goal
  - history_observations
  - object_attributes
  - object_state
  - affordance
  - point_coordinate
  - bounding_box_2d
  - bounding_box_3d
  - segmentation_mask
  - placement_region
