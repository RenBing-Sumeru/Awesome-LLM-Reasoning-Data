  - chain_of_thought
  - future_trajectory
  - exact_match_reward
  - iou_reward
  - point_in_mask_reward
  - format_reward
  - navsim_subscores
  environment_or_substrate: Main SFT/GRPO operates on offline images, video, RGB-D, calibrated-camera, QA, grounding, and
    trajectory records, not an interactive robot or closed-loop driving environment. A separate downstream NAVSIM experiment
    trains a diffusion planner with imitation learning and DiffGRPO; proprietary trajectories are evaluated open loop.
  verifier_or_reward: Main GRPO uses exact answer match for multiple-choice reasoning, box IoU, point-in-mask, and strict
    format checks. Thresholds, weights, invalid-output policy, and code are unknown. NAVSIM reports collision, drivable-area,
    time-to-collision, comfort, progress, and PDMS metrics, but DiffGRPO reward code is unreleased. LingoQA evaluation depends
    on an unspecified local classifier judge.
  terminal_predicate: Main RL success depends on answer equality, geometric overlap or containment, and format compliance
    under undisclosed thresholds. NAVSIM uses weighted offline metrics, not a disclosed hard terminal predicate. No physical
    task-completion or closed-loop deployment-safety contract is released.
recipe_metadata:
  base_model: Vision encoder, projector, and LLM initialize from MiMo-VL 7B-SFT-2508. The checkpoint is branded 7B while Hugging
    Face displays 8B parameters. Intermediate Stage-1/2/3/4 and downstream planner checkpoints are not identified.
  teacher: DeepSeek-R1 supplies some long embodied reasoning. The Stage-3 CoT teacher is unknown. Expert drivers provide proprietary
    demonstrations. LingoQA evaluation uses an unspecified local text-classification judge, not a disclosed training teacher.
  generator: Public/proprietary media are transformed into QA, grounding, action, reasoning, and trajectory records. Some
    sources use automatic QA; self-curated data create camera-coordinate 3D grounding; Stage 3 generates CoT; the downstream
    planner generates diffusion trajectories. Production code is unreleased.
  filtering_rule: The report names curated/high-quality subsets, filters short Cosmos-Reason1 videos, selects an EgoPlan-IT
    subset, and directs Stage-4 RL toward corner cases and prior failures. Thresholds, deduplication, privacy/safety filters,
    failure-mining rules, and retained/rejected counts are unknown.
  sampling_protocol: Stage 1 mixes general and embodied data; Stage 2 carries them forward and adds driving; Stage 3 carries
    them forward and adds CoT; Stage 4 samples RL data. Ablations approximately equalize loss tokens. Exact mixtures, replay
    proportions, balancing, curricula, shuffle seeds, and total tokens are unknown.
  rollout_count: Main GRPO and DiffGRPO rollout group sizes, prompts, attempted/retained outputs, steps, and total counts
    are unknown.
  temperature: Data generation, Stage-3 CoT, main GRPO, and DiffGRPO decoding are unknown. Public LingoQA evaluation uses
    temperature 0 only in that adapter.
  inference_budget: All stages use 32,768 maximum sequence length. Current evaluation defaults include 4,096 image tokens,
    4,096 per-video, 16,384 total video tokens, 2 FPS, at most 256 frames, and up to 32,768 generated tokens. Exact paper-run
    budgets and control frequency are unknown.
  optimizer_or_scaffold: Stages 1-3 train all components with batch 512, AdamW, learning rate 2e-6, weight decay 0.05, cosine
    schedule, and 32,768 context. Stage 4 uses batch 32, AdamW, learning rate 1e-6, weight decay 0, cosine, and the same context.
    Steps, warmup, precision, KL, hardware, compute, and seeds are unknown.
audit:
  source_mixture: Many source families and stage order are named, but no selected samples, hours, frames, images, QA pairs,
    tokens, CoT traces, trajectories, RL rollouts, or per-source/domain ratios are disclosed. The proprietary driving set
    is merely called large scale.
  split: No immutable stage or benchmark row manifest exists. Training and evaluation families overlap or share derivatives,
    including RoboRefIt, RoboAfford, EgoPlan, Cosmos-Reason1, EmbSpatial, RefSpatial, CODA-LM, DriveLM, MME-RealWorld, IDKB,
    and nuScenes/egocentric sources. Row, video, scene, route, subject, geography, and near-duplicate separation are unknown.
  decontamination: No exact, perceptual, temporal, scene, route, translated, synthetic, or inherited MiMo-VL decontamination
    audit is disclosed. Shared media, derivative QA, benchmark variants, proprietary scenes, and development-time evaluation
    may overlap.
  license: Weights are labeled MIT; inherited evaluation code is MIT and Xiaomi additions Apache-2.0. These labels do not
    resolve rights to public/proprietary datasets, web or egocentric media, synthetic CoT, human annotation, camera records,
    trajectories, faces, plates, locations, or bystanders. No attribution, consent, privacy, retention, access, or takedown
    ledger is released.
  lineage: A four-stage graph plus separate planner training is recoverable, but source revision/media/row -> transformation/filter
    -> teacher output -> split -> reward/rollout -> batch -> checkpoint -> evaluation output joins are absent.
  known_failure_modes:
  - Training scale and mixture ratios are absent.
  - Training and evaluation families overlap or share media, so contamination and cross-domain leakage remain unresolved.
  - Inherited MiMo-VL exposures are unaudited.
  - Stage-3 CoT teacher, prompts, counts, correctness checks, and rejects are unknown.
  - Main rule rewards verify labels and formatting, not physical task success or safety.
  - NAVSIM IL+DiffGRPO reward, simulator revision, rollouts, code, and planner checkpoint are unreleased.
  - NAVSIM and proprietary trajectory results are offline/open-loop and do not establish closed-loop robustness or sim-to-real
    transfer.
  - Real-world robot evidence is qualitative target visualization, not controlled execution.
  - Proprietary sensor data omit scale, geography, dates, drivers, consent, faces/plates/location handling, retention, access,
    labor, and terms.
  - Open-loop L2 and limited front-frame inputs may hide multimodal futures and compounding control error.
  - LingoQA requires an unspecified Lingo-Judge-safetensors placeholder checkpoint and a 0.5 threshold.
  - The model is branded 7B while Hugging Face displays 8B.
  - Only final weights and evaluation code are public; training, failures, CoT/RL records, safety environments, and planner
    artifacts are closed.
  citation_status: verified
  confidence: high
  notes: Verified from arXiv v2 and appendix, official Xiaomi repository/evaluation suite and licenses, official checkpoint,
