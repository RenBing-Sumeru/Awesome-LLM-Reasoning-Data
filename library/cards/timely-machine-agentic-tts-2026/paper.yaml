data_object:
  prompt_source: Synthetic Timely Reasoning data, DataScience-Instruct-500K, 57 Jericho text games, MLEBench-Lite tasks, and
    AIME, MATH, GPQA Diamond evaluation prompts.
  trace_author: Qwen3-235B-2507-Instruct provides timed reasoning traces; DeepSeek-V3.2 provides game interaction traces;
    trained models generate tool-interaction trajectories.
  answer_format: Task, time budget, elapsed-time tool observations, reasoning and tool actions, tool latency, final answer
    or environment outcome, and task reward.
  process_fields:
  - task
  - time_budget
  - elapsed_time
  - generation_latency
  - tool_latency
  - tool_actions
  - trajectory
  - final_answer
  - reward
  environment_or_substrate: Timely-Eval combines interactive games, machine-learning code environments, and timer-equipped
    general reasoning tasks.
  verifier_or_reward: Task-specific correctness or environment reward, zero reward after timeout, and an on-time budget-utilization
    reward during Timely-RL.
  terminal_predicate: The task is completed with a correct answer or valid environment outcome before the wall-clock time
    budget expires.
recipe_metadata:
  base_model: Qwen3 models from 0.6B to 32B, with TimelyLM-8B as the trained model.
  teacher: Qwen3-235B-2507-Instruct for timed general-reasoning traces and DeepSeek-V3.2 for interactive-game traces.
  generator: An agent decides reasoning length and tool-interaction frequency conditioned on observed elapsed time and latency.
  filtering_rule: Timed synthetic traces must obey the task completion constraints; game distillation is limited to the first
    50 steps to avoid memorization.
  sampling_protocol: Vary tool latency and time budgets across games, machine-learning tasks, and timed general reasoning;
    RL uses eight rollouts per sample.
  rollout_count: Eight rollouts per RL sample.
  temperature: See official paper and training configuration.
  inference_budget: Wall-clock budget, with general-reasoning budgets 0.75x to 3x a baseline and interactive budgets covering
    roughly 30 to over 400 steps.
  optimizer_or_scaffold: Cold-start SFT followed by Timely-RL, a GRPO variant that rewards correctness, on-time completion,
    and time-budget utilization.
audit:
  source_mixture: Official ACL Anthology paper.
  split: Timely-Eval evaluates four selected interactive games, four ML tasks, and three general reasoning benchmarks; training
    and evaluation sources are distinct as described in the paper.
