one_line_summary: MindLoom extracts reusable thought modes from verified solutions, composes them under compatibility and
  scarcity control, and keeps 9,230 judged-correct SFT records.
why_it_matters: It makes reasoning-data composition auditable through mode tuples, retrieval scores, provenance filters, and
  rollout decisions.
