data_object:
  prompt_source: 58,526 verified source problems from 16 STEM and reasoning datasets.
  trace_author: DeepSeek V3.2 reverse-engineers and composes thought modes, generates rollouts, and judges correctness.
  answer_format: A generated question paired with a judged-correct reasoning response in chat-style SFT format.
  process_fields:
  - seed question, answer, solution, and provenance
  - thought-mode tuple and ordered thought-mode chain
  - compatibility and scarcity scores
  - evolved question and solution
  - rollout correctness and SFT conversion status
  environment_or_substrate: Embedding retrieval over a thought-mode bank plus LLM-based composition and judging.
  verifier_or_reward: Compatibility checks, source-provenance filters, three rollouts, and a strict LLM correctness judge.
  terminal_predicate: Stop on an incompatible later evolution step; retain SFT records only when at least one rollout is judged
    correct.
recipe_metadata:
  base_model: Qwen3-4B/8B and Qwen3.5-4B/9B.
  teacher: DeepSeek V3.2; Qwen3-Embedding-0.6B retrieval model.
  generator: Extract thought modes by reverse engineering, learn retrieval, compose under similarity/scarcity scoring, and
    filter rollouts.
  filtering_rule: Reject incoherent or unsolvable applications, held-out-source provenance, and questions with no judged-correct
    rollout.
  sampling_protocol: Top-20 retrieval, three evolution steps, 12 clusters, similarity weight 0.65, selector temperature 1.0,
    and three solution rollouts.
  rollout_count: 3
  temperature: 0.7
  inference_budget: 12,636 synthesis steps produce 7,515 candidate records and 11,433 rollout records before filtering.
  optimizer_or_scaffold: Full-parameter SFT for three epochs on 9,230 converted examples.
audit:
  source_mixture: 16 datasets; SuperGPQA supplies 69.1% of the final SFT set.
  split: 58,526 references, 8,322 reverse-engineered seeds, 10,854 provenance-filtered rollouts, and 9,230 final SFT records.
  decontamination: Records derived from HLE, SciBench, and AIME 2025 are removed; MATH-500 questions are excluded from Hendrycks-MATH.
  license: Official repository license was not confirmed.
  lineage: Each generated record stores its source ID and selected thought-mode provenance.
  known_failure_modes:
  - Output diversity cannot exceed the thought modes present in the reference corpus.
  - Correctness and compatibility depend on an LLM judge, and the final set remains dominated by SuperGPQA provenance.
  citation_status: verified
  confidence: high
  notes: arXiv PDF and its official GitHub link were checked on 2026-07-13. PDF affiliations are Peking University and Tsinghua
    University; no peer-reviewed acceptance was found.
inclusion_reason: Exposes thought modes as reusable data-construction objects and releases a provenance-filtered SFT conversion
  pipeline.
