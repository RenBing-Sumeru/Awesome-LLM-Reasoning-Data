one_line_summary: Sequential rejection sampling builds verifier-selected answer/evaluation/correction trajectories for SFT
  before correctness-reward PPO or DPO; the 31,990-row final release lacks complete construction lineage.
why_it_matters: For construction-recipe readers, it makes the control tokens, ground-truth filter, SFT object, and downstream
  RL contracts separable, while showing why accepted traces and benchmark gains do not substitute for candidate, rejection,
  license, and contamination records.
