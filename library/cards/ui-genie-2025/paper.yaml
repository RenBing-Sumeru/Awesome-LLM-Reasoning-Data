data_object:
  prompt_source: AndroidControl, AMEX, and AndroidLab tasks; later rounds add DeepSeek-V3-generated tasks and manually crafted
    long-horizon scenarios
  trace_author: Source datasets supply recorded actions; UI-Genie agents generate exploration trajectories; controlled corruption
    and hard-negative mining create negative reward examples
  answer_format: Reward records contain image-text message histories, image paths, and a binary positive label; agent records
    contain task/progress context, a screenshot, and one executable mobile action
  process_fields:
  - messages
  - images
  - positive
  - task_instruction
  - task_progress
  - action
  - action_desc
  - screenshot_path
  environment_or_substrate: Android mobile GUIs explored through an executable action interface; AndroidLab and Android Arena
    provide dynamic evaluation environments
  verifier_or_reward: Rule checks for action type, coordinates, and typed-text semantics; controlled corruptions; mined hard
    negatives; and UI-Genie-RM binary step/task judgments
  terminal_predicate: A terminate action is judged success or failure by task-level UI-Genie-RM/environment checks; exact
    per-task executable predicates are not released
recipe_metadata:
  base_model: Qwen2.5-VL-7B for UI-Genie-RM and the iterative agent; final agents are trained at 3B, 7B, and 72B scales
  teacher: Rule-verified source actions, environment outcomes, DeepSeek-V3 task/action-description generation, and the prior-round
    UI-Genie-RM
  generator: Current-round UI-Genie agent with reward-guided beam search
  filtering_rule: Keep rule-verified positives, synthesize controlled negatives, retain RM-misclassified hard negatives, accept
    RM-verified successful trajectories for SFT, and relabel explored steps with five continuation trials
  sampling_protocol: Build 458K initial reward examples, add 59K exploration examples, alternate reward-model training and
    reward-guided exploration for three rounds, then mix accepted UI-Genie data with AndroidControl, AMEX, and AndroidLab
    for agent SFT
  rollout_count: null
  temperature: null
  inference_budget: null
  optimizer_or_scaffold: RM and agent use AdamW/full fine-tuning at learning rate 1e-5 and global batch 160 in the paper;
    72B uses RSLoRA with rank 64 and alpha 256
audit:
  source_mixture: Paper Table 1 attributes nominal RM data to AndroidControl (263K), AMEX (170K), AndroidLab (24K), and exploration
    (59K); agent training mixes those three sources with UI-Genie-Agent-16k
  split: The RM Hub viewer exposes one train split; generation-wise, application-wise, task-wise, account-wise, and deduplication
    splits are not disclosed, and the Agent viewer does not build successfully
  decontamination: unknown
  license: Both Hugging Face dataset cards label their contents MIT; the repository README claims MIT but the root license
    file is absent, while bundled ms-swift code carries Apache-2.0; upstream dataset, app, screenshot, and account-state rights
    remain separate
  lineage: The RM release exposes messages, image paths, and a positive boolean, while the agent release preserves screenshot-directory
    identifiers; source dataset, corruption operator, generation, verifier version/score, environment image, and acceptance
    reason are not consistently present per record
  known_failure_modes:
  - Controlled corruptions can create shortcut artifacts rather than realistic mistakes
  - Hard-negative mining inherits blind spots from the initial reward model
  - Reward-model false positives can enter SFT and then influence later reward data
  - Task completion judgments can miss side effects or drift with app and Android versions
  - Screenshots and typed content can contain personal, account, or application-sensitive information
  - The paper's 517K/16K names do not match every released count or unit without qualification
  citation_status: verified
  confidence: high
  notes: Official NeurIPS proceedings, arXiv paper and appendix, supplemental demonstrations, author repository, and both
    official Hugging Face datasets were checked on 2026-07-21.
inclusion_reason: Releases binary GUI reward examples and accepted agent action data together with a controlled-corruption,
  hard-negative, and iterative reward-guided construction recipe.
