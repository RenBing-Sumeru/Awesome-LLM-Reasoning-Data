one_line_summary: Builds mobile-GUI reward data from rule checks, controlled corruptions, and mined hard negatives, then uses
  a learned verifier to collect step-level agent SFT data over three rounds.
why_it_matters: Makes an iterative verifier-guided mobile-agent data engine inspectable while exposing count drift, verifier
  feedback loops, privacy, licensing, and replay risks.
