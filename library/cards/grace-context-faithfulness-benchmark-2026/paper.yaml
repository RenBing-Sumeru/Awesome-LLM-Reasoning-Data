one_line_summary: GRACE supplies context-grounded reasoning traces with per-step faithfulness labels, error types, and explanations
  for training or testing process evaluators.
why_it_matters: It separates context faithfulness from final-answer accuracy and offers both scalable consensus labels and
  a human-annotated hard test set.
