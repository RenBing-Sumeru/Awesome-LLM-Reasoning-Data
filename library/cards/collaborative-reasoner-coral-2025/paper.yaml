status: partial
one_line_summary: Collaborative Reasoner uses symmetric same-model agents, five-way turn sampling, LLM belief extraction,
  and gold-answer matching to create next-turn SFT targets and DPO pairs for collaborative reasoning.
why_it_matters: It makes the conversational object and feedback contract explicit, while binary answer-only labels, absent
  rejects/data/checkpoints, and public-config gaps show why open code is not an auditable data release.
