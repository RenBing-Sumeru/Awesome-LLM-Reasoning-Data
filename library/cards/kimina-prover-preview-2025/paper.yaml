one_line_summary: Kimina-Prover discloses a 200K Lean prompt construction, about 20K cold starts, whole-proof compiler-terminal
  RL, and public distills/tooling, but not core prompts, rollouts, rewards, environment pins, or full lineage.
why_it_matters: It distinguishes whole-proof terminal programmatic feedback from imperfect LLM/human-reviewed autoformalization
  and from interactive step feedback, showing why released artifacts do not reproduce the full pipeline.
