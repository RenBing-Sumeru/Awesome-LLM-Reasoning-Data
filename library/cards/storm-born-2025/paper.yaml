one_line_summary: A 100-row expert-selected derivation dataset built from a 2,000-pair multi-agent pool, released with source
  IDs, long answers, a 73/27 split, and four-option variants but without full lineage or the candidate pool.
why_it_matters: STORM-BORN makes full scientific documents and expert judgment central to reasoning-data construction, while
  the live source mismatch, shared-source split, missing review history, partial code, and unresolved licensing show the audit
  cost of document-derived supervision.
