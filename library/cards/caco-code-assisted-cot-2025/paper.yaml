one_line_summary: Caco converts four source mixtures into 146K verified seed programs, samples about 5.3M new programs, and
  releases 1,348,799 reversed instruction-solution rows with their answers and code after multi-stage filtering.
why_it_matters: It makes executable code a scalable intermediate data contract, while showing why program execution, model
  agreement, incomplete lineage, and benchmark gains must be audited separately from semantic correctness and data quality.
