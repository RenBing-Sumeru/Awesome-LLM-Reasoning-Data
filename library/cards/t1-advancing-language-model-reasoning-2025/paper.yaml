one_line_summary: T1 synthesizes trial-and-error/self-verification math chains for SFT and applies answer-verified, high-temperature
  64-rollout RLOO to study training and inference scaling, but public release semantics, lineage, and replay remain incomplete.
why_it_matters: It is a concrete evidence source for coupling long reasoning traces with outcome verification and diversity-oriented
  RL; it is not yet a self-contained, auditable training dataset because the public files lack documented lineage, schema
  semantics, and verifier decisions.
