one_line_summary: OpenAI's Operator System Card reports specialized supervised computer-use data, broad public-data sources,
  and reinforcement learning for a GPT-4o-based CUA, but leaves task records, rewards/verifiers, training environments, and
  lineage undisclosed.
why_it_matters: 'It is a clear Track 12 boundary case: the report makes the existence and broad role of computer-use demonstrations
  and reinforcement learning auditable, yet does not provide enough data, feedback, or environment detail to reconstruct or
  safely reuse the recipe.'
