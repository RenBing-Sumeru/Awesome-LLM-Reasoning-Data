one_line_summary: Across 6,803 questions from six medical/clinical benchmarks, the study labels benchmark metadata, question
  context, and explicit answers inside deep-research search trajectories and shows that direct answer exposure can inflate
  accuracy and accelerate prediction convergence.
why_it_matters: 'It demonstrates that web observations are not neutral evidence: they can contain the evaluation item itself,
  so auditable search trajectories, controlled retrieval corpora, and contamination-aware scoring are necessary for credible
  agent evaluation.'
