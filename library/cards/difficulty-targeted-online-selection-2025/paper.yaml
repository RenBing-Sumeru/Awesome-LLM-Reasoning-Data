one_line_summary: DOTS predicts current-policy question difficulty from a small rollout-labeled reference set and combines
  near-0.5 selection with FIFO replay of recent mixed-reward rollout groups.
why_it_matters: It treats selection decisions and reusable rollout groups as first-class RL training data, while its partial
  release shows why buffers, selection histories, behavior probabilities, timing logs, and licenses matter for auditing efficiency
  claims.
