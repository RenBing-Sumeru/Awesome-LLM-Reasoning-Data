inclusion_reason: 'SWiRL exposes a concrete post-training data transformation that is easy to lose in a title-only entry:
  multi-step tool trajectories become action-ending prefix subtrajectories, receive model-based process selection and per-action
  rewards, and enter offline policy-gradient training. It belongs as a training recipe and trajectory-feedback contract, not
  as a benchmark.'
