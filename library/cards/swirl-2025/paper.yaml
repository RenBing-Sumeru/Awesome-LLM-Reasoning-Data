one_line_summary: SWiRL trains Gemma 2 from fixed search/calculator trajectories by turning every action and its full prefix
  into a reward-bearing RL sample; the recipe and prompts are public, but the trajectories, reward logs, implementation, and
  checkpoints are not.
why_it_matters: 'It makes the supervision boundary explicit: a full tool-use episode is the source object, yet optimization
  consumes overlapping action-prefix subtrajectories with model-judged scalar feedback. That distinction is essential for
  auditing sample weighting, process-label quality, incorrect-outcome retention, and replayability.'
