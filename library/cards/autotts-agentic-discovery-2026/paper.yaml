data_object:
  prompt_source: AIME24 for controller discovery and held-out AIME25 and HMMT25 mathematical reasoning problems.
  trace_author: Qwen3 base models pre-generate 128 reasoning trajectories and intermediate probe answers for each model-problem
    pair.
  answer_format: Question, branch prefixes at fixed token intervals, probe answers, controller actions, final aggregate answer,
    accuracy, and total token cost.
  process_fields:
  - question
  - branch_prefixes
  - probe_outputs
  - active_branches
  - action_history
  - beta
  - final_answer
  - accuracy
  - token_cost
  environment_or_substrate: Offline replay environment over pre-collected multi-branch reasoning trajectories.
  verifier_or_reward: Exact-answer task accuracy combined with total generation and probe cost; controller selection seeks
    a better accuracy-cost frontier.
  terminal_predicate: The aggregated final answer matches the benchmark reference answer.
recipe_metadata:
  base_model: Qwen3-0.6B, Qwen3-1.7B, Qwen3-4B, and Qwen3-8B; transfer tests include DeepSeek-R1-Distill-Llama-8B.
  teacher: Claude Code proposes controller code from the recorded discovery history.
  generator: Base reasoning models generate the replayed branch trajectories at temperature 0.7.
  filtering_rule: A controller chooses among branch, continue, probe, prune, and answer actions; beta determines the monotone
    accuracy-cost budget trade-off.
  sampling_protocol: Pre-sample 128 trajectories per model-problem pair, repeatedly evaluate candidate controllers on random
    subsets, and compare with SC@64, ASC, ESC, and Parallel-Probe.
  rollout_count: 128 pre-sampled trajectories per model-problem pair; each candidate controller is evaluated 64 times on random
    subsets.
  temperature: 0.7 for trajectory collection.
  inference_budget: Fixed-length 500-token intervals; beta controls the controller budget.
  optimizer_or_scaffold: AutoTTS uses an offline replay environment, one-dimensional beta parameterization, execution-trace
    feedback, and a five-round Claude Code discovery loop.
audit:
  source_mixture: Official arXiv paper and official AutoTTS GitHub repository.
  split: AIME24 is the search set; AIME25 and HMMT25 are held out for evaluation.
  decontamination: The paper separates discovery and held-out benchmarks, but does not provide a universal pretraining-contamination
    audit.
  license: Verify the repository license and each underlying benchmark license before reuse.
