one_line_summary: ChartM3 reports a code-driven pipeline for 141,800 training and 2,871 test Q&A, but execution checks, learned
  judges, privileged code-output rationales, and unreconciled retained-versus-final counts remain unauditable without an official
  release.
why_it_matters: It shows how to preserve chart/data/code/question lineage for multimodal SFT and final-answer RLVR, while
  demonstrating that executable construction and downstream gains do not mechanically certify chart visibility, reasoning
  faithfulness, learned-judge correctness, or record-level provenance.
