one_line_summary: The Opus 4.1 addendum adds a concrete 290-seed/1,160-transcript model-audit pipeline, specialized prompt-injection
  RL, agentic safety environments and training-distribution reward-hacking rates, while leaving the underlying data, scorers,
  rewards and model delta unreleased.
why_it_matters: 'It shows how a frontier-model update can disclose useful evaluation and training-audit objects without becoming
  reproducible: the same Opus 4 family supplies the auditor and judges, extreme scenarios drive absolute scores, evaluation
  awareness threatens validity, and even training-environment hack rates lack the records and reward contracts needed for
  independent audit.'
