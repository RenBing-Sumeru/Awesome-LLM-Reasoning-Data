data_object:
  prompt_source: 'This addendum does not restate an Opus 4.1-specific training-source mixture and instead directs readers
    to the May 2025 Claude 4 System Card for family-level context. Its incremental data disclosures are primarily evaluation/audit
    objects: a refreshed small subset and expanded policy coverage in English single-turn prompts; child-safety tests mixing
    human-generated and synthetic prompts; 290 extreme-scenario seed instructions; three Claude 4-family target models; three
    agentic-coding misuse evaluations inherited from the Claude 4 card; computer-use and prompt-injection cases; reward-hack-prone
    coding tasks from Anthropic''s training distribution; sandboxed impossible tasks; two undisclosed training environments;
    and automated RSP benchmarks. Prompt counts, synthetic generator, source manifests, and global train/eval membership are
    mostly unknown.'
  trace_author: A Claude Opus 4-based auditor agent expands 290 seeds into 1,160 simulated interaction transcripts for each
    of Claude Sonnet 4, Claude Opus 4, and Claude Opus 4.1, each 24–64 turns long. The target models produce the audited responses/actions.
    Four additional model scorers process the same transcripts for welfare-related attributes, and an Opus 4-based judge labels
    admirable behavior. Training-only traces are not released; the report discloses only that specialized reinforcement-learning
    training was used against prompt injection and that reward hacking was monitored in two training environments.
  answer_format: No Opus 4.1 training-record schema is released. Evaluation records can contain English single-turn prompts
    and responses, human- or synthetic-origin child-safety prompts, 24–64-turn simulated dialogues, computer-use screen/action
    sequences, multi-step coding/tool trajectories, sandbox state, generated code, visible and hidden test outcomes, monitor/classifier
    labels, eight alignment scores, four welfare scores, model-version identifiers, and episode terminal outcomes. The alignment
    scorer uses a 1–10 scale, with plotted averages rescaled to 0–1; one reported misuse comparison thresholds scores above
    5/10.
  process_fields:
