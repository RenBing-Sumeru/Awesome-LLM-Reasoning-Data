one_line: A generalist RGB-and-keyboard/mouse agent trained from human gameplay, Gemini process labels, online RLVR, and a
  Gemini task/reward self-improvement loop.
one_line_summary: SIMA 2 mixes human multi-game keyboard/mouse demonstrations and Gemini-generated process labels, then adds
  online verified RL and a Gemini task-setter/reward-model self-improvement loop, while withholding trajectories, verifier
  code, checkpoints, and reproducibility-critical environments.
why_it_matters: It concretizes multimodal demonstration, structured action, heterogeneous verification, and self-generated
  experience for virtual-world agents, while exposing rights, judge-bias, failure-retention, split, and environment-version
  gaps.
