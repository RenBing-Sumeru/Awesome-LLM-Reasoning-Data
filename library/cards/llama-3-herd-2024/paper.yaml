one_line_summary: Llama 3.1 discloses a 15.6T-token 50/25/17/8 pretraining mix and six rounds of reward modeling, best-of-10–30
  rejection sampling, SFT, and DPO, while releasing weights and guards but not corpora, preferences, reward models, candidates,
  or item lineage.
why_it_matters: It clearly connects aggregate corpus composition to post-training data objects and verifiers while exposing
  the gap between open weights and closed records, reward contracts, source rights, contamination controls, and generator-to-checkpoint
  lineage.
