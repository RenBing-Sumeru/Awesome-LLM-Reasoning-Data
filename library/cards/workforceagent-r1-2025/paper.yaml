one_line_summary: WorkForceAgent-R1 turns filtered WorkArena oracle trajectories into single-step action-verification problems
  for SFT and GRPO, but releases code without the trajectory corpus, rejection ledger, or trained checkpoints.
why_it_matters: It isolates a cheap rule-based feedback contract for workplace web-agent reasoning while showing why paper-scale
  configurations, derived records, public artifacts, proxy rewards, and complete success/failure retention must be audited
  separately.
