one_line_summary: Prolog-MATH translates 7,500 MATH training problems and CoTs into predicate-guided SWI-Prolog candidates,
  filters terminal answers symbolically, and applies SFT/GRPO recovery; the 97.4% paper union is not present as a reconciled
  public manifest.
why_it_matters: It makes predicate reuse, typed outputs, execution filtering, retries, and program-level RL feedback concrete
  while exposing the difference between terminal correctness and faithful reasoning.
