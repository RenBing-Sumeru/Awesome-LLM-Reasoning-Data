recipe_metadata:
  base_model: Not a training recipe; it is a live-web agent evaluation framework.
  teacher: task authors and production-site workflows define the expected final state.
  generator: curated everyday online tasks plus live-site execution and final-request interception.
  filtering_rule: Do not treat scores as stable unless platform state, task date, account setup, and interception logic are
    pinned.
  sampling_protocol: Pin task list, live-site date, account credentials, documents, browser runtime, model scaffold, action
    budget, and interception implementation.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation budget is agent- and task-specific; live-site latency and failure handling must be reported.
