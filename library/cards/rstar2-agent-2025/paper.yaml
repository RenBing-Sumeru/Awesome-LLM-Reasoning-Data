data_object:
  prompt_source: The repository names AIME2024 and DAPO preprocessing entry points; the complete training task inventory,
    sources, and splits are unknown.
  trace_author: The agent generates reasoning and Python-tool trajectories during RL; exact model versions and per-trajectory
    records are not released.
  answer_format: Multi-turn reasoning with Python code/tool calls and execution feedback; a stable released training-trace
    schema is not documented in the inspected repository.
  process_fields: []
  environment_or_substrate: A Python Code Judge server executes model-generated code. The repository warns that it executes
    arbitrary code and should be deployed in an isolated environment, preferably Docker, without external-network exposure.
  verifier_or_reward: GRPO-RoC uses Resample-on-Correct around a code-tool environment. The repository describes retaining
    higher-quality positive trajectories while preserving failures; exact reward scoring and full acceptance ledger are unknown.
  terminal_predicate: Resample-on-Correct and multi-stage RL are described, but item-level correctness criteria and trajectory
    retention logs are not released.
recipe_metadata:
  base_model: Qwen3-14B-Base is specified in the official repository.
  teacher: No separate teacher is disclosed for agentic RL; SFT provenance is unknown.
  generator: Non-reasoning SFT followed by multi-stage agentic RL, with concise maximum response lengths per stage and increasing
    dataset difficulty.
  filtering_rule: The repository exposes optional downsampling/resampling controls, including retaining minimum positive/negative
    traces; the paper-version complete filtering configuration is unknown.
  sampling_protocol: The release framework documents resampling/downsampling controls, but it explicitly says the migrated
    framework was not used to train a complete model; only the first 50 steps were compared with the original framework.
  rollout_count: null
  temperature: null
  inference_budget: The report states 510 RL steps within one week on 64 MI300X GPUs. Token budget, rollout counts, and per-task
    cost are unknown.
  optimizer_or_scaffold: GRPO-RoC, a scalable tool-execution RL infrastructure, and multi-stage curriculum training.
audit:
  source_mixture: unknown
  split: unknown
  decontamination: unknown
  license: The official microsoft/rStar repository declares MIT. Training data, model weights, generated traces, and Code
    Judge dependencies need separate rights review.
  lineage: Qwen3-14B-Base to non-reasoning SFT to multi-stage agentic RL with code execution and Resample-on-Correct. Released
    code does not include an item-level task/trajectory/reward/selection ledger.
  known_failure_modes:
  - Code Judge executes arbitrary code and must be isolated; it is not safe to expose directly to external networks.
  - The released framework was migrated from the original VERL v0.2 setup to VERL v0.5 and was not used to train a complete
    model; a 50-step comparison is not full reproducibility.
  - Training tasks, SFT data, execution sandbox policy, reward formula, rollout counts, and acceptance/rejection records remain
    incomplete.
  - Tool-environment noise is a stated motivation for GRPO-RoC, so correctness depends on an incompletely audited execution
    environment.
  citation_status: verified
  confidence: medium
  notes: Official arXiv report and Microsoft repository, including its license, Code Judge warning, base-model instruction,
    and migration note, were checked on 2026-07-14.
inclusion_reason: Official agentic-RL report and code release that exposes an execution-feedback loop and a concrete reproducibility/security
  caveat while leaving training data and trajectory audit records incomplete.
