data_object:
  object_type: A 47-task executable MCP benchmark with seeded mutable application state, accepted human-authored reference
    trajectories, tool observations, target final states, and a programmatic state-difference evaluator.
  prompt_source: The 47 natural-language instructions are manually curated to have deterministic outcomes and omit explicit
    tool names. Synthetic application entities are pre-generated by an undisclosed LLM to resemble real-world distributions;
    its identity, prompts, and source provenance are unknown.
  trace_author: Human experts manually authored one accepted ground-truth trajectory per task through the provided MCP interface.
    Their identities, number, agreement process, and relation to the separately reported three-person human baseline are unknown.
  task_record:
  - seed
  - natural-language query
  - application list
  - difficulty level
  - accepted reference trajectory
  - reference tool-call count
  - target final environment state
  episode_fields:
  - ordered model or annotator text
  - tool-call name and JSON arguments
  - tool response or error observation
  - implicit state transition through stateful tool execution
  - end marker
  - final captured environment state
  answer_format: A ReAct-style sequence of text, `<tool>` JSON calls, `<response>` observations, and a terminal `[END]` marker.
  process_fields:
  - seeded initial state
  - action
  - observation
  - mutable environment transition
  - ordered interaction history
  - final state
  - completion rate
  - misbehavior rate
  - binary success
  observation: Tools return structured response blocks, including simulated failures. The released gold `output` strings preserve
    these observations, but the complete evaluated model rollouts are not released.
  verifier_or_reward: The evaluator recursively compares final state with required target changes and collateral changes.
    Completion is matched required changes divided by required changes; misbehavior is collateral changes divided by required
    changes; success requires completion 1 and misbehavior 0. Content fields use fuzzy matching.
  reward: Episode-level completion and misbehavior rates plus a binary success outcome; this is an evaluation contract, not
    evidence of reward-model or RL training.
  terminal_predicate: The agent may emit `[END]`; the runner also stops after 100 turns or five consecutive non-tool responses.
    Task success is separately determined from the final environment state and action trajectory.
  provenance: Undisclosed-LLM synthetic knowledge-base population plus seeded perturbations -> manual task curation -> human
    tool-use trajectory authoring -> explicit yes/no acceptance -> released task, trajectory, and target-state row -> model
    evaluation -> programmatic state-diff metrics.
  environment_or_substrate: 'Fifteen MCP servers exposing 315 tools: seven stateful simulated applications and eight stateless
    services. Each episode creates a seeded process-local session and injects its session ID into stateful calls.'
  release_shape: Current main releases one parquet table with 47 rows and columns `seed`, `query`, `apps`, `level`, `output`,
    `tool_cnt`, and `gt_env`, plus environment, runner, human-authoring, and evaluator code. It does not release all successful
    and failed evaluated model trials.
recipe_metadata:
  base_model: unknown
  teacher: unknown
  generator: An undisclosed LLM pre-generates synthetic application entities. Human annotators manually write task instructions
    and accepted reference trajectories. Evaluated model rollouts are generated by the model under test with ReAct.
  prompt_task_source: Manually curated cross-application tasks over the synthetic sandbox; detailed real-world source ancestry
    and per-task drafting provenance are unknown.
  sampling_protocol: The paper evaluates all 47 tasks with three independent runs per model. The released table contains one
    accepted human-authored reference trajectory per task.
  temperature: unknown
  rollout_count: 3
  inference_budget: Paper reports approximately 29,964 tokens of full-context tool descriptions, an average of 11 tool rounds,
    and tasks requiring long multi-tool interaction. The current runner caps an episode at 100 turns; exact API token limits
    and wall-clock budgets are unknown.
  search_or_scaffold: ReAct with all tool descriptions in context for the primary results; fixed top-k RAG and iterative retrieval
    variants use all-MiniLM-L6-v2 for tool retrieval.
  filtering_rule: Manual curation requires deterministic unique outcomes, no explicit tool names/hints, and a ground-truth
    trajectory. The released construction script stores a row only after the annotator answers `y` to `Pass this query?`.
  selection_threshold: A yes/no human acceptance gate is visible in code; rejected attempt counts and a more detailed trajectory-quality
    threshold are unknown.
  optimizer_or_training_scaffold: null
  user_simulator: null
audit:
  source_mixture: Manually curated instructions and human-authored gold interactions over an LLM-populated synthetic knowledge
    base, combined with model-generated evaluation episodes that are reported in aggregate but not released in full.
  split: No train/dev/test split is disclosed or present in the released 47-row table; all 47 tasks are used for evaluation.
  decontamination: unknown
  benchmark_overlap: No prompt/pretraining-overlap audit is disclosed. Public instructions, gold trajectories, environment
    code, tool schemas, target states, and evaluator create future contamination and benchmark-gaming risk.
  lineage: The current release exposes task rows, gold tool interactions, observations, target states, environment code, evaluator,
    and construction script. It does not expose the synthetic-data generator identity/prompt, rejected candidates, per-record
    provenance, full evaluated rollouts, or an immutable paper-era code/data manifest.
  license: The arXiv paper is CC BY 4.0 and the repository root is MIT. No separate dataset/model-output rights statement
    clarifies reuse of benchmark rows, synthetic entities, or generated interaction text.
  release_version: No official release or tag exists. Audit inspected current main commit 617e963bd838bee5793a39e6b34165b79535828f
    on 2026-07-20.
  version_drift: The paper does not identify an exact repository commit. Current `data.parquet` records at most 59 calls per
    gold trajectory, while the paper says the hardest task requires more than 60 invocations; this unresolved mismatch may
    reflect version or counting differences.
  verifier_or_judge_failure_modes:
  - Fuzzy substring/Levenshtein matching for content can misclassify semantic equivalence or near-matches.
  - The current exclusion-key list appears to concatenate `rid` and `oid` because of a missing comma, potentially counting
    generated identifiers as collateral changes.
  - Seeded network failures return status `internel error`, while the aggregate runner counts only `ok`, `error`, and `failed`,
    potentially omitting these calls from status summaries.
  - State-diff checks can miss requirements not encoded in target state or trajectory rules and are not accompanied by a released
    adversarial calibration suite.
  - Synthetic chat histories can contain prompt-injection attacks, but the paper reports no dedicated security robustness
    metric.
  - Public task targets, reference trajectories, and evaluator code permit contamination or benchmark-specific optimization.
  successful_and_failed_sample_retention: The official parquet retains 47 accepted successful gold/reference demonstrations.
    It does not retain the complete successful and failed evaluation rollouts for all models and three trials; Appendix C
    publishes only three correct and two incorrect examples.
  privacy_or_consent: The environment is synthetic. Gold-trajectory annotator recruitment, compensation, consent, and agreement
    metadata are undisclosed.
  citation_status: verified
  confidence: high
  notes: Treat the benchmark as an evaluation artifact. Do not infer SFT, agent-training, reward-modeling, or RL use from
    the presence of gold trajectories or an executable environment.
  remaining_unknowns:
  - exact paper-era repository commit and immutable release manifest
  - synthetic knowledge-base generator model, prompts, and upstream source provenance
  - gold annotator identities, count, protocol, agreement, recruitment, compensation, and consent
  - rejected candidate count and full acceptance rubric
  - exact closed-model revisions and provider-default sampling parameters
  - complete evaluated success/failure rollout corpus with trial IDs and sampling seeds
  - dataset and generated-output rights beyond the repository root license
  - decontamination and future public-benchmark exposure controls
  - independent verifier and prompt-injection robustness calibration
inclusion_reason: 'ComplexMCP exposes a rare auditable environment-agent data object: seeded mutable state, interdependent
  tools, accepted action/observation traces, final-state targets, and explicit completion-versus-collateral-change checks.
  It is directly relevant to reasoning-data evaluation while illustrating version, verifier, security, and rollout-retention
  risks.'
