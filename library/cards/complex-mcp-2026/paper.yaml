one_line_summary: ComplexMCP pairs 47 manually curated tasks with seeded 315-tool environments, accepted gold tool trajectories,
  and final-state verification, while leaving full model rollouts and a paper-era release freeze unavailable.
why_it_matters: It makes long-horizon agent reasoning inspectable at the state-action level—queries, tool calls, observations,
  target state, collateral changes, and success—but also shows why executable benchmarks need immutable releases, verifier
  tests, security calibration, and complete rollout retention before reuse as post-training data.
