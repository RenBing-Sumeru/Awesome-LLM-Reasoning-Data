one_line_summary: Seed-OSS releases Apache-2.0 synthetic-augmented, woSyn and Instruct 36B checkpoints with a 12T-token coarse
  data ledger and controllable thinking-budget traces, but withholds the synthetic teacher, mixture controls, Instruct corpus
  and RLHF/PPO reward recipe.
why_it_matters: The paired Base checkpoints make synthetic instruction augmentation experimentally inspectable at the weight
  level, while the Instruct model exposes reasoning budget as explicit process metadata; together they offer unusually reusable
  artifacts, but the missing matched-training controls, reward contract and global decontamination prevent strong causal or
  reproducibility claims.
