data_object:
  prompt_source: 'Seed-OSS pretraining uses 12T text tokens from three broad source categories: publicly available internet
    data, purchased data obtained through external-vendor partnerships, and data generated by ByteDance Seed''s in-house teams;
    the knowledge cutoff is July 2024. `Seed-OSS-36B-Base` additionally includes synthetic instruction data during pretraining,
    while `Seed-OSS-36B-Base-woSyn` excludes that class. The official release does not identify source datasets, websites,
    vendors, generator/teacher, prompts, answers, category weights, token counts by source, languages/domains, or item-level
    provenance. Benchmark prompts are evaluation objects and are not treated as training data; only ArcAGI-V2''s official
    evaluation set is explicitly stated not to have been used in training.'
  trace_author: The synthetic-instruction author or teacher is unknown. The Instruct model generates visible reasoning between
    `<seed:think>` tags and periodic `<seed:cot_budget_reflect>` records that estimate consumed and remaining token budget
    before a final answer. The release says the model was extensively trained at budget intervals that are multiples of 512,
    but does not release those budget-conditioned traces, their authorship, selection or editing. General SFT authors, RLHF
    contributors, preference labels, reward-model traces and agent trajectories are unknown.
  answer_format: Released inference records can contain a user/chat prompt, optional integer thinking budget, a visible reasoning
    trace, periodic budget-reflection tags, a final answer, and optional tool-call structure. Budget 0 requests a direct response;
    no supplied budget defaults to unlimited thinking. No canonical pretraining, synthetic instruction, SFT, preference or
    PPO record schema is released. Evaluation records can additionally contain benchmark prompts, model outputs, tool/agent
    actions, environment outcomes and benchmark scores, but these raw records are not bundled.
  process_fields:
  - source_category
  - knowledge_cutoff
  - synthetic_instruction_indicator
  - prompt_or_messages
  - thinking_budget
  - visible_reasoning_trace
  - consumed_budget
  - remaining_budget
  - budget_reflection_marker
  - final_answer
  - tool_call
  - environment_or_test_outcome
  - benchmark_score
  environment_or_substrate: Pretraining is native up to 512K context, but the data pipeline, hardware and distributed substrate
    are unknown. Released inference supports Transformers and vLLM, configurable maximum new tokens, quantized loading, auto
    tool choice and the `seed_oss` tool-call parser. Evaluation-only substrates include TAU1 Retail/Airline, SWE-bench Verified
    under OpenHands and AgentLess, Multi-SWE-bench, 128K RULER and other static reasoning/code tests. The agent tools, environment
    versions, containers, trajectories and terminal predicates are not released.
  verifier_or_reward: The model card says safety fine-tuning occurs during SFT and RLHF/PPO stages, but it does not disclose
    the human-feedback format, preference comparison structure, annotators, reward model, reward values, PPO objective, KL
    control, aggregation, calibration or general Instruct training recipe. Budget compliance is behaviorally specified through
    reflection tags and direct-answer mode, but no training loss or verifier is given. Evaluation uses benchmark answer checking
    and agent-environment scores; exact graders and harnesses are mostly external or undisclosed and are not established as
    training rewards.
  terminal_predicate: Pretraining, SFT and PPO termination conditions are unknown. At inference, budgeted reasoning transitions
    to the final answer when the specified budget is exhausted or reasoning concludes; budget 0 requests an immediate direct
    response. Agent benchmark terminal conditions depend on TAU-bench, OpenHands, AgentLess and Multi-SWE-bench harnesses
    and are not specified in the release.
recipe_metadata:
  base_model: 'Seed-OSS is a 36B causal language model using RoPE, GQA, RMSNorm and SwiGLU, with 64 layers, 80/8/8 QKV heads,
    head size 128, hidden size 5,120, vocabulary 155K, RoPE base frequency 1e7 and native 512K context. Three checkpoints
    are released: synthetic-augmented Base, Base-woSyn and Instruct. Exact checkpoint derivation, initialization and Base-to-Instruct
    lineage identifiers are not disclosed.'
  teacher: The teacher or generator for synthetic pretraining instructions is unknown. Human-feedback providers and the RLHF
    reward model are also unknown.
  generator: ByteDance Seed lists in-house-generated data as one pretraining category and synthetic instruction data as the
    Base-versus-woSyn treatment, but does not identify generator checkpoints, prompt templates, decoding settings, answer
    types, filtering, generation dates, acceptance rates or volumes.
  filtering_rule: Preprocessing includes deduplication, desensitization, quality filtering, CSAM filtering and toxic-content
    filtering. PII removal combines algorithmic and manual checks. Rules, models, thresholds, yields, audit samples, near-duplicate
    handling, synthetic-quality filters and benchmark-exclusion lists are unknown.
  sampling_protocol: Training sampling and the 12T-token mixture are unknown. The with/without-synthetic release does not
    state whether total tokens, non-synthetic corpus, random seed, optimizer steps, compute and checkpoint selection were
    matched. Evaluation recommends temperature 1.1 and top-p 0.95, except TAU-bench uses temperature 1 and top-p 0.7; these
    are inference settings rather than training sampling.
  rollout_count: Pretraining, SFT, RLHF/PPO and agent-training rollout counts are unknown. Benchmark repetition counts are
    generally not disclosed in the README; `AgentLess 4*10` appears in a benchmark label but is not documented as a training
    rollout protocol.
  temperature: Training temperature is unknown. Reported Instruct evaluation and recommended inference use temperature 1.1/top-p
    0.95, while TAU-bench uses temperature 1/top-p 0.7.
  inference_budget: The model supports a user-controlled thinking budget. No specified budget defaults to unlimited reasoning;
    0 requests a direct answer; positive budgets are recommended at 512-token multiples such as 512, 1K, 2K, 4K, 8K and 16K
    because the model was extensively trained on those intervals. The released generator defaults to `max_new_tokens=4096`
    and `thinking_budget=-1`. The exact training distribution over budgets and maximum trained budget are unknown.
  optimizer_or_scaffold: The model card identifies safety SFT and RLHF/PPO but omits the general Instruct construction stages,
    PPO implementation, reward model, optimizer, learning rates, schedules, batch sizes, sequence curriculum, 512K-context
    curriculum, compute, hardware, checkpoint selection, loss mixing and tool/agent scaffold. Inference code and chat templates
    are released under Apache-2.0.
audit:
  source_mixture: The release discloses 12T total tokens, a July 2024 cutoff and three broad source categories, but no category
    weights, sample/token counts, named sources, vendor identities, in-house generator, language/domain distribution, synthetic-instruction
    share, temporal distribution, filtering yields, consent handling or item-level provenance. Predominantly public data is
    stated only at a broad level.
  split: No train/dev/test ledger is released. The only explicit negative-membership claim is that the ArcAGI-V2 official
    evaluation set was not involved in training. LiveCodeBench's table labels a February–May 2025 evaluation slice, but this
    alone does not establish absence from later SFT/RL stages or semantic contamination. The Base/woSyn pair does not document
    matched corpus membership beyond excluding synthetic instruction data from woSyn.
  decontamination: General deduplication is disclosed, but no benchmark-specific decontamination method, n-gram/membership
    test, code-repository overlap analysis, near-duplicate audit, hash ledger, revision pin or false-negative study is provided.
    ArcAGI-V2 non-use is narrow and cannot be generalized to MMLU, MATH, AIME, LiveCodeBench, SWE-bench, TAU-bench, RULER
    or other tests.
  license: The GitHub repository and all three official Hugging Face model pages identify Apache-2.0, covering the released
    project/model artifacts. The training datasets, purchased sources, in-house-generated data, synthetic instruction records,
    safety SFT data, RLHF preferences and evaluation bundles are not released; their source-level licenses and redistribution
    rights remain unknown. The model card's use limitations are guidance and explicitly do not modify the Apache-2.0 license.
  lineage: 'Coarse lineage is available: 12T-token pretraining yields two 36B bases that differ by inclusion of synthetic
    instruction data; an Instruct checkpoint is released and the model card names safety SFT and RLHF/PPO; the Instruct model
    supports budget-conditioned visible reasoning and agent/tool use. Exact checkpoint hashes, base selection, data snapshots,
    synthetic teacher, Base-to-Instruct initialization, stage order and sizes, reward lineage and artifact-to-training-run
    mapping are unknown.'
  known_failure_modes:
  - Seed-OSS is an official model release, not a formal paper; README/model-card claims are not accompanied by a complete
    methods report or peer-reviewed artifact.
  - The 12T-token corpus is summarized by only three source classes. Source names, proportions, provenance, authorization,
    vendor details and source-level licenses are missing.
  - The Base versus Base-woSyn comparison lacks synthetic teacher, content, proportion, matched-token policy, random seeds,
    equal-compute confirmation, uncertainty and significance; benchmark differences cannot be attributed solely to synthetic
    instructions with high confidence.
  - Synthetic augmentation improves many reported scores, especially MATH, but several knowledge benchmarks favor woSyn; the
    release does not analyze domain trade-offs or contamination.
  - Safety SFT and RLHF/PPO are disclosed only as stage names. Ordinary Instruct data, preference records, reward model, annotators,
    PPO settings, rollout counts and general reasoning/agent post-training remain hidden.
  - Thinking-budget intervals are said to be extensively trained, but no budget-conditioned records, interval mixture, compliance
    metric, loss/reward or CoT faithfulness audit is released.
  - Visible budget-reflection text may be useful process metadata but should not be assumed to expose faithful internal computation
    or exact token accounting in every case.
  - Agent scores depend on OpenHands, AgentLess, TAU-bench and Multi-SWE-bench scaffolds; tools, versions, prompts, environment
    states, run counts and raw trajectories are not bundled.
  - Only ArcAGI-V2 receives an explicit train-nonoverlap claim; there is no global benchmark decontamination or split ledger.
  - Some comparison results were omitted after evaluation failures, and benchmark tables mix reproduced and externally reported
    competitor scores, complicating direct comparisons.
  - Apache-2.0 applies to released weights/code, not automatically to unreleased public, purchased, vendor or generated training
    records.
  - The repository and Hugging Face cards are living artifacts on mutable branches/pages; the metadata draft records verification
    date but no immutable release tag or model-card revision.
  citation_status: verified
  confidence: high
  notes: The official ByteDance-Seed GitHub README, MODEL_CARD, Apache-2.0 LICENSE, official Hugging Face collection and all
    three checkpoint pages were checked on 2026-07-24. No exact ID/title duplicate exists in the target V2 Card library. No
    formal paper, arXiv, DOI, proceedings page or released training dataset is claimed.
inclusion_reason: A high-value open frontier release because it provides three Apache-2.0 36B checkpoints, including a rare
  Base/Base-woSyn pair for studying synthetic instruction augmentation, and an Instruct model with explicit budget-conditioned
  reasoning traces. It also discloses a 12T-token total, three source categories, cutoff and preprocessing classes, while
  leaving the synthetic teacher, mixture controls, Instruct data, reward model, PPO recipe, global split and provenance ledger
  unknown.
