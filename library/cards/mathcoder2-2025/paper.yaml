one_line_summary: MathCoder2 translates selected mathematical documents into conditions-expression-result-Python records,
  execution-filters and flattens them into MathCode-Pile, then uses the mixture for continued pretraining before separate
  supervised math post-training.
why_it_matters: It shows executable mathematical-code translation as a continued-pretraining recipe while exposing why partial
  data, self-consistency verification, weak execution sandboxing, broken code paths, and missing provenance must be audited
  separately from paper-scale results.
