data_object:
  record_type: MathCode-Pile is a document-level continued-pretraining mixture. A translated mathematical-code record pairs
    natural-language conditions and a LaTeX computation expression with a teacher-stated result and executable Python, then
    flattens the accepted block into one public text field.
  prompt_source: The basic corpus combines filtered OpenWebMath, filtered English Common Crawl, three synthetic math/science
    collections, StarCoderData Python and Jupyter records importing selected mathematical packages, and online mathematical
    textbooks converted from PDFs. Released translation code applies the translation stage to filtered OpenWebMath and CC-En-math.
  trace_author: Llama-3.1-70B-Instruct translates selected mathematical prose into conditions-expression-result-Python blocks.
    The public mathematical-code README names Mixtral-8x7B-Instruct, but the paper and deployment script identify Llama-3.1-70B-Instruct.
  context_state:
  - source title and mathematical text
  - conditions needed for computation
  - LaTeX computation expression
  - teacher-stated expected result
  - individually executable Python code
  answer_format: Generation uses a labelled Conditions Needed, expression, result, and fenced-Python block. After parsing
    and filtering, the release concatenates title, conditions, expression, result, and code into unstructured text.
  process_fields:
  - source_index_and_text
  - model_completion
  - conditions
  - latex_expression
  - teacher_expected_result
  - python_code
  - execution_stdout_or_error
  - acceptance_status
  - flattened_text
  observation: The executor captures stdout or an exception/timeout. These observations and rejection reasons are not retained
    in public one-field rows.
  verifier_output: The paper describes error-free execution plus expected-result matching. Released code only compares outputs
    when both short strings parse as complex numbers, accepting absolute error at most 0.01; otherwise an error-free execution
    is classified as correct without content comparison.
  environment_or_substrate: Python runs through raw exec in worker processes with a ten-second timeout. Regex blocks input(
    and os.system(, but the implementation is not a comprehensive filesystem, network, subprocess, or import sandbox.
  verifier_or_reward: A deterministic execution-and-comparison selection filter, not a learned reward. Because the same teacher
    completion authors expected result and program, passing demonstrates teacher-program self-consistency rather than independent
    verification of the source mathematics.
  terminal_predicate: 'Intended: Python runs without error and stdout matches expected result. Implemented: execution is error-free
    and, only for two short complex-parseable strings, absolute difference is at most 0.01.'
  provenance: Web, synthetic, code, and textbook sources -> source-specific filtering -> 16.5B-token basic corpus -> Llama-3.1-70B-Instruct
    translation -> parsing and Python execution filtering -> flattening -> exact/13-gram decontamination -> reported 19.184B-token
    MathCode-Pile -> continued pretraining of four 7B/8B bases.
  release_surface: The current Hugging Face revision exposes one train split of text-only rows. It explicitly releases only
    part of filtered OpenWebMath, filtered CC-En-math, and translated code; no identifiable textbook directory or row-level
    provenance is present.
recipe_metadata:
  base_model: Continued pretraining covers Llama-3-8B, DeepSeekMath-7B, Mistral-7B, and CodeLlama-7B. The paper later applies
    supervised fine-tuning.
  teacher: Llama-3.1-70B-Instruct authors translated mathematical-code blocks. Mixtral-8x7B-Instruct labels web documents
    and finer Common Crawl categories; two fastText classifiers implement scalable CC filtering.
  generator: Llama-3.1-70B-Instruct greedily emits conditions, a LaTeX expression, expected result, and executable Python
    for each source document.
  prompt_task_source: Selected filtered OpenWebMath and filtered CC-En-math records in the released file-preparation code.
  filtering_rule: OpenWebMath retains Mixtral-labelled mathematical problem/solution or concept/theory documents. CC uses
    two fastText stages with intermediate Mixtral categorization. Code must import selected math packages. Translated blocks
    are parsed, executed, filtered, then decontaminated.
  sampling_protocol: Translation uses greedy decoding, source truncation at 3,072 tokens, up to 3,072 new tokens, and Llama
    end-of-turn stopping. The script launches 12 local workers.
  rollout_count: unknown
  temperature: unknown
  top_p: unknown
  inference_budget: A 6,144-token serving limit is configured. Total requests, failures, retries, accepted records, and aggregate
    compute are unknown.
  search_or_scaffold: No tree search or repair loop; one teacher completion is structurally parsed and passed to an execution
    filter.
  selection_threshold: 'Paper: error-free execution with output matching expected result. Code: absolute error at most 0.01
    only for two short numeric-parseable strings; other error-free outputs are accepted without equality checking.'
  seed_protocol: Generation seeds are unknown. The Llama pretraining example uses seed 3407.
  buffer_policy: unknown
  reward_schedule: No reward optimization; verification is a binary corpus-selection filter.
  optimizer_or_scaffold: Continued pretraining runs three epochs with four-million-token global batch. Llama-3 uses context
    8,192 and other bases 4,096. The Llama example uses 32 A800 GPUs, learning rate 4e-5, cosine schedule, warmup 50, weight
    decay 0.1, BF16, gradient checkpointing, and seed 3407. Downstream validation uses two epochs general math-instruction
    SFT then three epochs NuminaMath CoT or TIR SFT; no RL or preference optimization is reported.
audit:
  source_mixture: 'Six Table 1 components are filtered OpenWebMath (4,826,902,621 tokens), filtered CC-En-math (6,341,745,645),
    synthetic data (2,193,189,314), code importing mathematical packages (1,703,226,005), online mathematical textbooks (1,390,268,773),
    and translated mathematical code (2,728,740,985). Total: 19,487,652 documents and 19,184,073,343 tokens.'
  split: Current Hugging Face exposes one train split with no validation/test or source-grouped partitions. Benchmark test
    files support decontamination, not dataset evaluation splits.
  decontamination: The paper reports exact matching plus 13-gram Jaccard similarity above 0.6 against evaluation questions.
    Per-match decisions are absent, and the public script's field assumptions/output shape do not align with current text-only
    rows.
  benchmark_overlap: Checked tests include GSM8K, MATH, MMLU-Math, OCW, SAT-Math, Hungarian, mathematics, OlympiadBench, and
    SVAMP. Exact revisions/checksums and a semantic-contamination audit are not documented.
  license: Dataset and four model cards are labelled Apache-2.0; OpenReview labels the submission CC BY 4.0. GitHub has no
    root license. No row-level source-license manifest reconciles web, StarCoderData, synthetic, or unlisted textbook sources,
    and model cards do not reconcile base terms.
  lineage: Filtered sources -> reported basic corpus -> Llama translation -> parser -> execution/output filter -> flattened
    text -> benchmark decontamination -> MathCode-Pile -> four continued-pretrained checkpoints -> separate NuminaMath CoT/TIR
    SFT. Public rows do not preserve item-level lineage.
  release_version: Code commit 70413a4f2f59929bc0ebd2f1640884222a993b89 and data revision df9a4417658cdbe8875e851fa908a50c98c8e247
    are dated 2024-10-16. Repository has no tags/releases, and the dataset card still promises a full release upon acceptance
    despite the ICLR 2025 Spotlight decision.
  release_count: Paper corpus totals 68,105 MB, 19,487,652 documents, and 19,184,073,343 tokens. Current 122-file HF repository
    serves 120 data files totalling 18,934,561,114 bytes but is explicitly partial; the viewer's roughly 719K estimate covers
    only a preview and is not a corpus count.
  successful_and_failed_sample_retention: Public records retain accepted flattened text only. Generation fields, stdout, exceptions,
    timeouts, comparison values, rejections, filter scores, and decontamination matches are unavailable.
  privacy_or_consent: unknown
  known_failure_modes:
  - Expected result and Python come from one teacher completion, so execution can verify self-consistency without proving
    the source interpretation.
  - Only short numeric-looking outputs receive equality comparison; other error-free outputs pass.
  - Raw exec plus timeout and two regex blocks is not a hardened sandbox.
  - The released pipeline is not end-to-end executable: scripts import an absent module, call an undefined entry point, and
      disagree about a required model field.
  - OpenWebMath filtering references undefined idx; training resume references new_learning_rate before assignment.
  - Decontamination expects output while release rows use text and emits a tuple-shaped accepted object.
  - Public data remains explicitly partial and has no identifiable release of 8,373 textbook documents.
  - Textbook titles, URLs, extraction outcomes, and rights are not released.
  - Mathematical-code README names Mixtral as translator, conflicting with paper/deployment Llama-3.1-70B-Instruct.
  - No immutable manifest binds source revisions, generation, verifier results, decontamination, training configs, and checkpoints.
  citation_status: verified
  confidence: medium
  notes: Verified against the 21-page ICLR final paper and appendices, official proceedings/OpenReview/arXiv/project pages,
    supplemental, pinned code, pinned partial dataset and rows, official collection, four model cards, and two fastText classifiers.
  remaining_unknowns:
  - Full source manifests, URLs, source licenses, and textbook provenance
  - Complete accepted/rejected translations, execution traces, and record-level acceptance rate
  - Generation seeds, total requests/retries, compute, and environment lockfile
  - Per-match decontamination ledger and exact benchmark revisions
  - Paper-run data snapshot and configs/checkpoint hashes for all four bases
  - Release status and provenance of downstream CoT/TIR SFT checkpoints
inclusion_reason: MathCoder2 is an open construction recipe for combining filtered mathematical pretraining sources with LLM-translated
  executable records at reported 19.2B-token scale, with a clear audit boundary between the paper's execution contract and
  a partial, weaker, non-end-to-end public release.
