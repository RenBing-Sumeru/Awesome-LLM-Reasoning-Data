one_line_summary: A synthetic-SFT-plus-PPO recipe trains an LLM agent to emit a natural-language plan only when its current
  state and plan call for additional test-time compute.
why_it_matters: It exposes planning frequency, plan tokens, environment actions, task rewards, and compute penalties as separable
  trace fields while the training data and runnable artifacts remain unreleased or inaccessible.
