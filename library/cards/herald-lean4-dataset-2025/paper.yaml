one_line_summary: Herald dependency-orders Mathlib informalization, retrieves from 1,000 manual examples, and augments statements
  through tactic states and LLM rewrites, but omits the construction code, exact source revision, row lineage, rejects, and
  decontamination evidence.
why_it_matters: It demonstrates how formal libraries can seed large parallel reasoning corpora while showing why compiler
  success must not be conflated with natural-language semantic correctness, proof availability, data quality, or complete
  release lineage.
