one_line_summary: Releases 88,991 bilingual multimodal SFT records and a 20,458-item evaluation set, and describes a 32-rollout
  process-verifier recipe whose training artifacts and decision lineage remain unreleased.
why_it_matters: It broadens reasoning post-training beyond mathematics and makes the separation among curated reference traces,
  benchmark outcomes, model-agreement filters, and learned process scores explicit enough to audit.
