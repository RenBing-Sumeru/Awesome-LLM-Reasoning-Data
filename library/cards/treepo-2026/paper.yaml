one_line_summary: TreePO replaces independent math rollouts with shared-prefix segment trees and trains on terminal answer
  rewards through hierarchical subgroup advantages, releasing code, prompts, and checkpoints but not complete paper-run trees.
why_it_matters: It exposes how rollout topology, branch allocation, fallback, token budgets, and outcome-reward credit assignment
  jointly shape RLVR efficiency, while showing why prompt releases alone are insufficient for branch-level reproducibility.
