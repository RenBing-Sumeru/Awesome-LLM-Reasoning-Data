one_line_summary: Sol-Ver uses one Llama 3.1 8B model to co-generate Python solutions and unit tests, turning execution agreement
  into Solver/Verifier SFT records and DPO pairs over three self-play rounds.
why_it_matters: It makes executable feedback a closed-loop data-construction contract while exposing how weak generated tests,
  correlated roles, and unreleased lineage can turn selection errors into training data.
