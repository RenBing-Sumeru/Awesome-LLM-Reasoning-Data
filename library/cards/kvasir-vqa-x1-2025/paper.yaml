data_object:
  prompt_source: Atomic Kvasir-VQA question-answer pairs grouped by each of 6,500 gastrointestinal endoscopy images.
  trace_author: Qwen3-30B-A3B naturalizes answers and merges one to three atomic questions; clinical experts validate the
    resulting pairs.
  answer_format: An image, complexity level, merged clinical question, naturalized answer, original atomic QA JSON, question-class
    list, and image id.
  process_fields:
  - image
  - complexity level from 1 to 3
  - merged clinical question
  - naturalized answer
  - original atomic QA provenance
  - question classes
  - image id
  environment_or_substrate: Static gastrointestinal endoscopy images evaluated in original and reproducibly transformed visual
    settings.
  verifier_or_reward: Trivial-prompt exclusion, strict JSON formatting, ambiguity checks, clinical-expert validation, text-similarity
    metrics, and aspect-wise Qwen3-30B-A3B adjudication.
  terminal_predicate: Retain a merged item only when its source QAs co-occur on one image and the question-answer composition
    is clinically relevant, unambiguous, structurally valid, and expert validated.
recipe_metadata:
  base_model: MedGemma-4B and Qwen2.5-VL-7B are the principal downstream consumers.
  teacher: A locally hosted Qwen3-30B-A3B naturalizes answers and merges questions; medical experts validate the generated
    data.
  generator: Group source QAs by image, sample one to three distinct pairs, merge the questions, naturalize the answer, and
    retain original atomic provenance.
  filtering_rule: Exclude predefined trivial items, reject ambiguous or clinically irrelevant merges, enforce JSON-encodable
    output, and perform expert validation.
  sampling_protocol: Combinatorial sampling balances levels 1, 2, and 3; construction pairs about 23% of examples with original
    images and 77% with weak augmentations.
  rollout_count: 1
  temperature: null
  inference_budget: The generation server and teacher are disclosed, but decoding temperature, token budget, and per-item
    regeneration count are not.
  optimizer_or_scaffold: LoRA fine-tuning with frozen vision encoders, DeepSpeed ZeRO Stage 2, and fixed clinical instruction
    prompts.
audit:
  source_mixture: 58,849 atomic Kvasir-VQA pairs over 6,500 gastrointestinal endoscopy images, expanded into 159,549 complexity-stratified
    records.
  split: 143,594 train and 15,955 test records; assignment follows the original image subsets, and no identical QA instance
    appears in both.
  decontamination: Source-image split inheritance and original-QA provenance reduce direct overlap; no broader semantic or
    model-pretraining contamination audit is reported.
  license: CC BY-NC 4.0; public and ungated, with non-commercial reuse restrictions.
  lineage: Kvasir-VQA image and atomic QAs -> per-image grouping and trivial-item removal -> one-to-three-way sampling ->
    Qwen3 question merging and answer naturalization -> expert validation -> Kvasir-VQA-x1 -> LoRA fine-tuning and robustness
    evaluation.
  known_failure_modes:
  - Teacher merging can change clinical meaning or make a supposedly harder question clearer through extra context.
  - The 6,500-image gastrointestinal domain and class imbalance limit transfer to other specialties and imaging systems.
  - Automated adjudication uses the same Qwen3 model family as generation and gives binary aspect scores, creating correlated
    and partial-credit errors.
  citation_status: verified
  confidence: high
  notes: Full paper, DOI citation, official repository, CC BY-NC 4.0 dataset metadata, actual Parquet schema and records,
    split counts, construction scripts, and result tables were checked on 2026-07-27.
inclusion_reason: Kvasir-VQA-x1 openly releases image-grounded clinical question-answer demonstrations whose complexity, source
  QA provenance, expert validation, and downstream SFT use are explicit.
