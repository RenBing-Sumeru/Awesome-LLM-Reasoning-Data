one_line_summary: Gemini Robotics 1.5 discloses ALOHA, Franka, and Apollo sensor/action data mixed with Internet text-image-video
  data, cross-embodiment Motion Transfer, natural-language thinking before action, and progress/success contracts, but not
  the mixture, record schema, labels, optimizer, rights, or released corpus.
why_it_matters: It is a high-value disclosure ledger for physical agents because it connects frontier-model fine-tuning to
  multi-robot trajectories, synthetic captioning, tool-using orchestration, inference-time thinking, environment feedback,
  and adversarial safety data while making the reproducibility and deployment gaps explicit.
