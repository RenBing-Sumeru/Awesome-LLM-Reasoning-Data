one_line_summary: Toolathlon pairs 108 fuzzy cross-application tasks with initialized software states, recorded tool-use episodes,
  and deterministic terminal evaluators; its gated Verified trajectories are explicitly evaluation/audit-only and must not
  be used for training.
why_it_matters: It makes the entire agent-data contract inspectable--task, tools, observations, environment mutation, terminal
  state check, run statistics, and failures--while illustrating why environment/evaluator version drift and contamination
  policy can dominate whether trajectory data is reproducible or reusable.
