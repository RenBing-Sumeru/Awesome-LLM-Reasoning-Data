one_line_summary: ZAYA1-8B reports reasoning-first pretraining, long-CoT midtraining/SFT, verifiable math/code RL, and behavioral
  RM/IF optimization with public Apache-2.0 weights, but not the data, teacher/RM artifacts, configured environments, reproduction
  stack, or audit records needed to independently validate that pipeline.
why_it_matters: 'It is a strong Track 12 example of partial frontier disclosure: the report specifies much more than model
  weights alone, including mixture categories and verifier interfaces, but withheld source manifests, data cards, reward/judge
  artifacts, runnable environments, and contamination evidence still prevent reproducibility and auditability.'
