one_line_summary: DeFAb turns public knowledge bases into more than 372,000 defeasible-abduction tasks whose hypotheses are
  checked for derivation, conservativity, and minimality.
why_it_matters: It makes minimal theory revision an executable acceptance condition instead of relying on a subjective language-model
  judge.
