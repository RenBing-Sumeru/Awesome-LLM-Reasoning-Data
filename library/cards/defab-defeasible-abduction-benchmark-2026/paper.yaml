data_object:
  prompt_source: Publicly funded taxonomic and behavioral knowledge bases, including OpenCyc, YAGO, Wikidata, ConceptNet,
    and UMLS.
  trace_author: The DeFAb construction pipeline and its rule-based solver.
  answer_format: A defeater-rule hypothesis for an anomalous observation.
  process_fields:
  - knowledge-base provenance
  - rules
  - anomaly
  - candidate hypothesis
  - level
  - surface rendering
  environment_or_substrate: Rule-based logical inference over materialized knowledge-base rules.
  verifier_or_reward: Polynomial-time checks of derivation, conservativity, and minimality.
  terminal_predicate: The submitted rule derives the anomaly while preserving unrelated consequences and meeting the minimality
    criterion.
recipe_metadata:
  base_model: Frontier language models are evaluated; the released construction is solver-driven.
  teacher: Rule-based logic solver.
  generator: Conversion of knowledge bases into defeasible-abduction instances.
  filtering_rule: Keep instances with valid programmatically checked gold hypotheses.
  sampling_protocol: Three difficulty levels and four equivalent renderings are released; consult the paper for the exact
    sampling procedure.
