one_line_summary: CRPS contrasts successful MCTS paths with high-confidence failures or inefficient successes, uses GPT-5-mini
  to synthesize verified reasoning traces, and releases 27,256 final math problem/solution pairs.
why_it_matters: It operationalizes failure-aware search-trace distillation and shows favorable SFT scaling, while its missing
  intermediate artifacts and count, cost, configuration, and license inconsistencies make it a useful release-audit case.
