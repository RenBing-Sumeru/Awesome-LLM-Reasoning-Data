one_line_summary: TraceElephant releases 220 fully observable failed Captain-Agent, Magentic-One, and SWE-Agent episodes with
  expert component/step attribution and replay code, while archive repair history and environment drift remain material audit
  limits.
why_it_matters: 'It turns agent debugging into a concrete post-training data surface: task outcomes, inputs, tool observations,
  agent actions, and step-level causal labels are co-located, enabling attribution evaluation without pretending that judgment
  labels or mutable environments are deterministic training rewards.'
