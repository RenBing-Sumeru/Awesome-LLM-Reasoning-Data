one_line_summary: Each 1-30-turn retail sandbox rollout carries interleaved agent/environment tokens, GPT-4.1 turn scores,
  and a rule-verified terminal outcome, but the promised sandbox, tasks, rollouts, and checkpoints are not linked as released
  artifacts.
why_it_matters: 'It makes a subtle supervision boundary auditable: fine-grained judge labels are generated per turn, yet the
  stable optimizer consumes a full-episode scalar. That distinction matters when comparing process supervision, reward shaping,
  and replayable agent-trajectory data.'
