  license: Apache-2.0 is declared for the code repository and both Hugging Face datasets; source-data licensing is not separately
    documented
  lineage: successful cold-start trajectories are generated by a reasoner, checked by an independent tool-using verifier against
    ground truth, and used for SFT before on-policy SRRL
  known_failure_modes:
  - verifier re-querying can select a lucky judgment rather than a calibrated verification process
  - dynamic retrieval services, parsers, indexes, and webpages make trajectories difficult to replay
  - smaller models can collapse into repetitive text or malformed tool-call JSON during RL
  - evaluation uses an LLM judge while SRRL uses task-specific answer scores, so the predicates are not identical
  citation_status: verified
  confidence: medium
  notes: Official ICLR, arXiv, GitHub, Hugging Face model, SFT-data, and RL-data records were checked; release revisions,
