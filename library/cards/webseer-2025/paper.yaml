one_line_summary: WebSeer constructs verified self-reflective SFT trajectories and trains a web-search agent with multi-submission
  RL feedback, while releasing code, two datasets, and a 14B checkpoint with incomplete evaluation tooling.
why_it_matters: It exposes how failed answer submissions can become continued search-and-reflection interactions, making the
  trajectory schema, feedback contract, environment drift, and replay risks concrete for rollout and test-time trace curation.
