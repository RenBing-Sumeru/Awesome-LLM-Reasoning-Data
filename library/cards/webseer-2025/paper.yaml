  sampling_protocol: 12 prompts per RL step, 8 candidate trajectories per prompt, up to 30 interaction turns, for 100 reported
    steps
  rollout_count: 8 candidate trajectories per prompt
  temperature: unknown
  inference_budget: up to 30 interaction turns during reported training; Figure 2 depicts up to 20 answer submissions
