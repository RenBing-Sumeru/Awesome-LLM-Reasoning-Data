data_object:
  prompt_source: Thousands of undisclosed cold-start prompts, curated reasoning prompts, and portions of DeepSeek-V3 SFT mixture;
    task families but not source membership/counts are disclosed.
  trace_author: Cold starts use several undisclosed methods including readable R1-Zero outputs and human post-processing;
    RL checkpoint writes rejection-sampled trajectories; DeepSeek-V3 participates in later generation/judgment; R1 creates
    distillation targets.
  answer_format: Long CoT followed by final summary/answer with a readable cold-start pattern; special-token schema and released
    records are unknown.
  process_fields:
  - prompt
  - chain_of_thought
  - final_summary_or_answer
  - accuracy_reward
  - format_reward
  - language_consistency_reward
  environment_or_substrate: Offline rule-evaluated math/code/logic tasks plus DeepSeek-V3 generative judgment for later SFT
    and reward-model general alignment; exact environments, tests, judges, and prompt distribution are unknown.
  verifier_or_reward: R1-Zero uses rule accuracy/format reward. R1 adds language-consistency reward; later data uses DeepSeek-V3
    judgment; final all-scenarios RL uses rules and general reward models. Formulas, coefficients, thresholds, calibration,
    and error rates are unknown.
  terminal_predicate: Eligible math/code/logic outputs pass task rule correctness and required format; extractors, compiler/test
    harnesses, and predicates are unknown.
recipe_metadata:
  base_model: DeepSeek-V3-Base
  teacher: R1 teaches released dense distills. Cold-start teachers are unknown; DeepSeek-V3 has later generation/judgment
    roles.
  generator: RL checkpoint produces rejection-sampled reasoning; DeepSeek-V3 produces/judges parts of general SFT.
  filtering_rule: Correct rejection-sampled responses retained; mixed-language, long-paragraph, and code-block CoT filtered.
    Full rule/judge thresholds, yields, and versions are unknown.
  sampling_protocol: Multiple responses sampled for later reasoning prompts and correct retained; training rollouts, temperature,
    top-p, seeds, and domain allocation are unknown. Evaluation temperature 0.6/top-p 0.95 is not training evidence.
  rollout_count: null
  temperature: null
  inference_budget: Evaluation caps 32,768 tokens and uses 4–64 samples by benchmark; training budgets are unknown.
  optimizer_or_scaffold: GRPO for R1-Zero; R1 uses cold-start SFT, reasoning RL, rejection-SFT, and all-scenarios RL. Optimizer,
    KL, learning rate, batches, and reward coefficients are unknown.
audit:
  source_mixture: Thousands of cold starts, about 600K rejection-sampled reasoning, 200K non-reasoning partly reused/generated
    via V3, and 800K R1 distillation rows; manifests, rights, and item provenance are not released.
  split: unknown
  decontamination: unknown
  license: Repository/weights are MIT. Qwen distills retain Apache lineage and Llama distills their base terms; rights for
    cold starts, V3 SFT, rewards, prompts, rollouts, and 800K samples are unknown.
  lineage: V3 Base to R1-Zero GRPO and R1 cold-start SFT to reasoning RL to rejection/V3 SFT to all-scenarios RL to R1 to
    800K rows to dense distills; item mappings/revisions are unavailable.
  known_failure_modes:
  - R1-Zero readability/language mixing and R1 language mixing beyond Chinese/English
  - Rule checks can accept flawed reasoning
  - Later neural/generative judgments lack calibration
  - Prompt sensitivity/few-shot degradation
  - Weaker function calling/multiturn/roleplay/JSON than V3
  - Released weights/counts do not reproduce pipeline
  citation_status: verified
  confidence: high
  notes: Track-12 frontier disclosure entry only; stage-level disclosure does not release primary data, feedback, or audit
    stack.
inclusion_reason: Canonical report with GRPO, rule reward, cold start, rejection sampling, alignment RL, distillation, weights,
  and explicit release boundaries.
