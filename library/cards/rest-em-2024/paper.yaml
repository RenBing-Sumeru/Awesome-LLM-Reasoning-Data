one_line_summary: ReST-EM samples math solutions or programs from the current policy, keeps only outputs that pass binary
  checks, and repeats SFT to turn verified self-generation into training data.
why_it_matters: It provides a simple iterative recipe and shows exactly where verifier quality and repeated-prompt overfitting
  limit self-training.
