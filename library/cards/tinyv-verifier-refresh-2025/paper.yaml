one_line_summary: TinyV refreshes a rule-based verifier by re-judging rejected answers with two large models, augmenting equivalent-answer
  variants, training a small binary judge, and querying it only after Prime rejection.
why_it_matters: It exposes verifier refresh as a concrete data lifecycle and shows that learned reward recovery must be audited
  for false positives, split leakage, license, missing lineage, and paper-code drift.
