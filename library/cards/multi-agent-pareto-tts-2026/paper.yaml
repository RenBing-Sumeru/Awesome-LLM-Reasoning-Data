data_object:
  prompt_source: A 1,000-question sample of MMLU-Pro and robustness experiments on BBH.
  trace_author: Llama 3.1 70B and 8B generate zero-shot chain-of-thought, refinement, debate, and mixture-of-agents trajectories.
  answer_format: Multiple-choice prompt, generated rationales, pipeline configuration, final option, accuracy, FLOP estimate,
    memory-transfer estimate, and per-task runtime.
  process_fields:
  - prompt
  - pipeline
  - model_size
  - sequences
  - agents
  - rounds
  - proposer_models
  - layers
  - final_choice
  - accuracy
  - compute_time
  environment_or_substrate: Offline multiple-choice benchmark evaluation with matched pipeline configurations.
  verifier_or_reward: Exact multiple-choice accuracy and estimated inference time that includes operations and memory-transfer
    costs.
  terminal_predicate: The final selected option equals the benchmark answer key.
recipe_metadata:
  base_model: Llama 3.1 70B for main experiments and Llama 3.1 8B for model-size comparison.
  teacher: Not applicable; all pipelines use the evaluated model under zero-shot prompting.
  generator: Self-consistency samples independent chains; self-refinement revises a solution; debate exchanges agent answers;
    mixture-of-agents aggregates proposer outputs.
  filtering_rule: Configurations are compared by Pareto fronts under accuracy and estimated time; the study does not construct
    training data.
  sampling_protocol: Vary sequences, refinement steps, agents, rounds, proposer models, layers, and model size across 34 configurations
    and more than 100 evaluations.
  rollout_count: Configuration-specific; self-consistency reaches ten sequences and the largest reported budgets approach
    20 times chain-of-thought compute.
  temperature: 0.7 with top-p 0.95.
  inference_budget: Approximately 1 to 20 times the chain-of-thought compute budget.
  optimizer_or_scaffold: Pareto-front analysis over accuracy and estimated runtime, including FLOPs and memory transfer.
audit:
  source_mixture: Official ACL Anthology paper and official GitHub repository.
  split: Primary MMLU-Pro evaluation uses 1,000 shuffled sampled tasks; BBH and Llama 3.1 8B provide robustness checks.
  decontamination: The paper does not claim a pretraining-contamination audit.
  license: Verify the code repository, MMLU-Pro, BBH, and model licenses before reuse.
