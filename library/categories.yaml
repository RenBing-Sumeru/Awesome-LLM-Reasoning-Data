- id: benchmarks_evaluation_surfaces
  order: 11
  group: data_lifecycle
  emoji: 🧰
  title: Benchmarks and Evaluation Surfaces
  file: 02_data_lifecycle/11_benchmarks_evaluation_surfaces.md
  summary: Math, code, proof, agent, rubric/domain, reward-model, live, hidden, and contamination-resistant benchmarks.
  reader_promise: Use this track to understand what an evaluation surface measures and whether it can safely become a feedback
    source.
  why:
  - Benchmarks are not just scoreboards. In post-training reasoning, a benchmark can become a verifier, a filtering tool,
    a reward source, a test-time selection criterion, or a contamination risk. This track organizes evaluation surfaces by
    feedback contract and audit risk.
  - A good benchmark page should identify whether scoring is programmatic, environmental, judgment-required, mixed, live,
    hidden, or expert-driven. It should also state what happens if the benchmark becomes part of training data or public prompt
    pools.
  - 'For contributors, the goal is to make benchmark entries useful to builders: what can be scored, what can leak, what can
    be replayed, and what should not be reused as reward without extra checks.'
  how_to_read:
  - Name the evaluation surface and scoring contract.
  - Check whether the benchmark is static, hidden, live, refreshed, or generated.
  - Inspect public/private split, contamination controls, and task-generation pipeline.
  - Decide whether the benchmark is evaluation-only or can support training feedback.
  open_questions:
  - Which benchmarks are still useful after becoming public training targets?
  - How should live benchmarks expose enough information for trust without leaking answers?
  - Can reward-model and PRM benchmarks predict downstream training value?
  - How should agent benchmarks standardize replay metadata?
