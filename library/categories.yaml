  reader_promise_zh: 这里是最干净的一类带验证器推理记录：最终答案或产物由代码、规则、测试或形式系统来检查。
- id: process_trace_supervision_data
  order: 4
  group: core_reasoning_data_types
  emoji: 🪜
  title: Process and Trace Supervision Data
  file: 01_core_reasoning_data_types/04_process_trace_supervision_data.md
  summary: Step-level labels, process reward models, rollout values, first-error localization, automatic process supervision,
    and PRM evaluation.
  reader_promise: Use this track to move from final-answer feedback to intermediate feedback attached to reasoning steps or
    trace states.
  why:
  - 'Process supervision asks where the reasoning path becomes right, wrong, uncertain, or useful. Its data objects are richer
    than outcome labels: a prompt, intermediate steps, labels or values over those steps, sometimes a first-error marker,
    and a process reward model or verifier trained to score partial progress.'
  - This track keeps human step labels, PRM training, rollout-value supervision, automatic process labels, and PRM benchmarks
    in one place. It is deliberately separate from generic CoT data because a trace is not process supervision unless there
    is a feedback contract attached to intermediate states.
  - Contributors should be skeptical. A process reward can improve search or reranking while failing to improve final correctness.
    It can reward plausible-looking traces or annotation style. Paper cards should therefore state label granularity, label
    source, use case, and failure modes.
  how_to_read:
  - Identify whether labels attach to steps, transitions, whole traces, rollout values, or first-error positions.
  - Check whether the label source is human annotation, verifier rollouts, judge models, code execution, or theorem proving.
  - Separate PRM training, reranking, search, evaluation, and diagnosis.
  - Look for experiments that connect process reward to final-answer correctness.
  open_questions:
  - When does a PRM add signal beyond an outcome verifier plus search?
  - How should uncertainty and annotator disagreement be represented in step labels?
  - Can process supervision scale to long agent trajectories?
  - What diagnostics reveal reward of trace style rather than causal progress?
  related_docs:
  - ../docs/06_verifiers_and_rewards.md
  - ../docs/03_reasoning_data_objects.md
  - ../docs/08_scaling_and_test_time_compute.md
  related_cards:
  - ../docs/paper_card_sop.md
  - ../docs/paper_card_sop.md
  subfields:
  - name: 🪜 Human step-level labels
    name_zh: 人工步骤级标注
    focus: human-labeled intermediate steps and first-error annotations
    focus_zh: 人工标注的中间步骤与首个错误位置
    key_risk: step boundaries and label policy are ambiguous
    key_risk_zh: 步骤边界与标注规范存在歧义
    keywords:
    - human step
    - first-error
    - prm800k
    - let's verify
  - name: 🧪 Process reward models
    name_zh: 过程奖励模型
