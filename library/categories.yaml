- id: judgment_rubric_domain_expert_data
  order: 7
  group: core_reasoning_data_types
  emoji: ⚖️
  title: Judgment, Rubric, and Domain-Expert Data
  file: 01_core_reasoning_data_types/07_judgment_rubric_domain_expert_data.md
  summary: LLM-as-judge data, human/expert judgment, medical and safety rubrics, factuality, legal and financial reasoning,
    and rubric reward models.
  reader_promise: Use this track when correctness needs a rubric, expert judgment, grounding evidence, or calibrated evaluator
    rather than a cheap programmatic checker.
  why:
  - Many important reasoning tasks cannot be checked by exact answers or unit tests. They require domain rubrics, experts,
    factual grounding, safety judgments, legal or medical caution, or LLM judges. This track collects the data where the feedback
    contract is judgment-required.
  - Judgment data can be highly valuable for post-training, but it is also easy to over-trust. A judge prompt can be attacked;
    a rubric can encode hidden values; an expert label can be expensive and inconsistent; a domain benchmark can leak templates.
    Paper cards should therefore make the judge, rubric, disagreement policy, and failure modes explicit.
  - This track gives researchers a place to compare high-stakes and rubric-driven reasoning data without mixing it into programmatic-verifier
    claims.
  how_to_read:
  - 'Identify the judge: expert human, crowd worker, LLM-as-judge, rubric model, retrieval/evidence checker, or hybrid evaluator.'
  - Record rubric source, prompt, domain expertise, disagreement handling, and calibration evidence.
  - Look for attacks, style bias, verbosity bias, position bias, and unsupported citation risks.
  - Separate benchmark labels from trainable reward signals.
  open_questions:
  - How can open projects audit LLM judges without exposing proprietary evaluation prompts?
  - What makes a medical or legal reasoning rubric reusable across datasets?
  - Can factuality and grounding scores be turned into robust post-training rewards?
  - How should paper cards report expert disagreement?
  related_docs:
  - ../docs/06_verifiers_and_rewards.md
  - ../docs/09_audit_and_failure_modes.md
  related_cards:
  - ../docs/paper_card_sop.md
  - ../docs/paper_card_sop.md
  subfields:
  - name: ⚖️ LLM-as-judge data
    name_zh: 大模型评审数据
    focus: model judges, preference judgments, judge prompts, and evaluator models
    focus_zh: 模型评审、偏好判定、评审提示词与评估模型
    key_risk: judge is sensitive to style, position, or prompt attacks
    key_risk_zh: 评审对文体、位置与提示词攻击敏感
    keywords:
