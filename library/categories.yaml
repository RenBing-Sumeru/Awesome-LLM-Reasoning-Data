  file: 02_data_lifecycle/08_data_construction_open_release_recipes.md
  summary: Prompt sourcing, teacher traces, rejection sampling, self-play, filtering, verifier refresh, open releases, lineage,
    and release metadata.
  reader_promise: Use this track to learn how reasoning datasets are actually built, filtered, packaged, and released.
  why:
  - 'A high-impact Awesome repo must teach recipes, not just cite papers. This track collects the construction pipeline: task
    sourcing, teacher trace generation, rollout/search expansion, rejection sampling, self-improvement, verifier refresh,
    filtering, deduplication, decontamination, release packaging, and metadata.'
  - 'Open releases vary widely. Some expose data and scripts; others expose only a report. Contributors should identify what
    is reproducible and what is hidden: teacher models, sampling rules, prompts, filters, accepted/rejected traces, splits,
    license, lineage, and known failures.'
  - 'This track is where students can turn a paper into operational knowledge: what should another lab do if it wants to build
    a similar dataset?'
  how_to_read:
  - Map the pipeline from prompt source to final released record.
  - Record teacher model, generator, sampling budget, filtering rule, verifier, deduplication, and release license.
  - Check whether rejected examples and ablations are visible.
  - Distinguish an open dataset from an open recipe.
  open_questions:
  - What is the minimum release metadata for safe reuse?
  - Should rejected traces be released as first-class data?
  - How can open projects document proprietary teacher effects?
  - Which filtering rules become hidden training objectives?
