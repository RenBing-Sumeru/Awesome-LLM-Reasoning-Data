  summary: DeepSeek-R1, Kimi, Qwen, Magistral, Phi, Nemotron, RLVR reports, and what each frontier-style report discloses
    or hides about data.
  reader_promise: Use this track to read frontier model reports as partial data-disclosure documents rather than only model-performance
    announcements.
  why:
  - Frontier reasoning reports shape the field even when they do not release full data. They disclose hints about SFT mixtures,
    distillation, RLVR rewards, verifier contracts, safety tuning, rejection sampling, inference budgets, and evaluation practices.
    This track turns those hints into a disclosure ledger.
  - The goal is not to overclaim hidden recipes. The page should separate what is disclosed, what is inferred, and what remains
    unknown. That distinction is essential for a trusted Awesome project.
  - Contributors should tag frontier reports across data types and lifecycle stages while using this track to summarize the
    report-level disclosure quality.
  how_to_read:
  - Separate SFT data, RL/RLVR data, distillation data, safety data, evaluation data, and inference-time methods.
  - Mark every claim as disclosed, inferred, or hidden.
  - Check whether the report exposes reward/verifier design, rollout budget, data source, filtering, and decontamination.
  - Avoid treating model performance as evidence of a reproducible data recipe.
