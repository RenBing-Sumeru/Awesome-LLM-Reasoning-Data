- id: training_usage_optimization_objectives
  order: 9
  group: data_lifecycle
  emoji: 🎯
  title: Training Usage and Optimization Objectives
  file: 02_data_lifecycle/09_training_usage_optimization_objectives.md
  summary: How data enters SFT, distillation, preference optimization, reward modeling, PRM training, RLVR, agent training,
    evaluation, reranking, and audit.
  reader_promise: Use this track to connect a data object to the objective or system component that consumes it.
  why:
  - The same paper can release examples, train a reward, evaluate a model, and disclose a model report. For builders, the
    crucial question is not only what the data is, but how it is consumed. This track organizes papers by training usage and
    optimization role.
  - It turns the atlas from a list into a design guide. A contributor should identify whether a record feeds SFT, distillation,
    DPO, reward modeling, PRM training, RLVR, agent training, reranking, evaluation, or audit. Those uses require different
    metadata and have different risks.
  - The track also prevents overclaiming. A benchmark score is not necessarily training data; a preference pair is not necessarily
    a robust reward; a verifier outcome is not necessarily a reusable RL signal without cost and false-positive analysis.
  how_to_read:
  - Name the objective or pipeline stage that consumes the data.
  - Check whether the same data appears in training, validation, reward modeling, and evaluation.
  - Record objective-specific fields such as chosen/rejected response, reward score, step label, environment action, or verifier
    outcome.
  - Look for ablations that isolate the data contribution from optimizer or inference-budget changes.
  open_questions:
  - Which objective-specific metadata should be mandatory in paper cards?
  - How can a repository detect unsafe reuse across training and evaluation?
  - When should a benchmark be treated as a feedback source rather than only an evaluation surface?
  - How should contributors tag multi-use frontier reports?
