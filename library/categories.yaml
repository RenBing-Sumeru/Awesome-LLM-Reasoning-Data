  file: 02_data_lifecycle/10_scaling_rlvr_test_time_compute.md
  summary: Data scaling, data reuse, RLVR optimization, verifier scaling, pass@k, sampling budgets, test-time compute, and
    scaling attribution.
  reader_promise: Use this track to interpret claims about how much data, verifier strength, RL, and inference budget contribute
    to reasoning gains.
  why:
  - Scaling claims are central to modern reasoning models. Papers report more data, stronger verifiers, larger rollout budgets,
    better RL optimization, longer thinking, and better pass@k. This track helps readers separate those factors instead of
    treating every gain as a generic reasoning-data improvement.
  - RLVR makes the data/verifier link especially visible. A verifier can generate reward, filter samples, guide search, and
    evaluate final answers. The same benchmark can also become a training target. Good curation records the reward contract,
    data reuse, rollout policy, and inference budget.
  - For high-impact use, this track should become the place readers visit before believing a scaling curve.
  how_to_read:
  - Record whether the paper scales data count, unique prompts, rollout attempts, verifier coverage, RL steps, model size,
    or inference budget.
  - Check whether pass@k and test-time compute are compared under equal budgets.
  - Look for data-reuse and contamination controls.
  - Separate verifier improvements from optimizer and scaffold improvements.
  open_questions:
  - 'What is the right unit of reasoning-data scale: prompt, trace, rollout, verified answer, or environment episode?'
  - How should RLVR reports disclose verifier false positives?
  - Can data scale and test-time compute scale be disentangled cleanly?
  - How much reuse is acceptable before benchmark claims become fragile?
