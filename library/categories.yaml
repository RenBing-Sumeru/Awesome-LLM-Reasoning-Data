  summary_zh: 人类偏好、AI 反馈、奖励模型、DPO 式偏好对、标量奖励、批判，以及基于评分标准的反馈记录。
  reader_promise_zh: 用这个方向对比各类偏好与奖励信号——在它们变成训练目标或评测替代指标之前。
- id: programmatically_verifiable_outcome_data
  order: 3
  group: core_reasoning_data_types
  emoji: 🧮
  title: Programmatically Verifiable Outcome Data
  file: 01_core_reasoning_data_types/03_programmatically_verifiable_outcome_data.md
  summary: Math answers, code execution, unit tests, proof checkers, symbolic predicates, answer extraction, and verifier
    robustness studies.
  reader_promise: 'Use this track for the cleanest verifier-bearing reasoning records: final answers or artifacts checked
    by code, rules, tests, or formal systems.'
  why:
  - Programmatic verification is central to post-training reasoning data because it can turn correctness into a relatively
    cheap feedback signal. Math answer checkers, code unit tests, compilers, and proof assistants make outcome supervision
    concrete enough for filtering, rejection sampling, RLVR, benchmark evaluation, and sometimes training rewards.
  - The clean surface is also dangerous. A model can learn answer-format shortcuts, leaked tests, brittle normalizers, proof-environment
    quirks, or benchmark-specific patterns. Good curation therefore records not just the dataset name but the verifier, false-positive
    risks, split policy, and whether the release exposes traces, failed attempts, or only accepted solutions.
  - This page is the natural assignment for contributors working on math, code, and proof papers, but many of those papers
    should also be tagged as construction recipes, scaling studies, benchmarks, or frontier disclosures when appropriate.
  how_to_read:
  - 'Write down the verifier: exact answer, symbolic checker, unit tests, compiler, hidden judge, proof assistant, or learned
    verifier.'
  - Check whether the paper releases prompts, solutions, traces, execution logs, proof scripts, and filtering code.
  - Separate trainable data from evaluation-only benchmarks.
  - Audit answer extraction, decontamination, public/private split, and benchmark reuse.
  open_questions:
  - How should math releases expose answer normalizers and edge cases?
  - Can public code benchmarks remain useful once they become training signals?
  - What metadata is needed to replay proof-checking environments?
  - How should accepted and rejected programmatic rollouts be released?
  related_docs:
  - ../docs/02_verifier_anchored_taxonomy.md
  - ../docs/03_reasoning_data_objects.md
  - ../docs/04_data_quality.md
  related_cards:
  - ../docs/paper_card_sop.md
  - ../docs/paper_card_sop.md
  subfields:
  - name: 📐 Math answer-verifiable data
    name_zh: 数学答案可验证数据
    focus: math problems, final answers, solution traces, and answer checkers
    focus_zh: 数学题、最终答案、解题轨迹与答案检查器
    key_risk: answer extraction and normalization inflate scores
    key_risk_zh: 答案抽取与归一化会虚高分数
    keywords:
    - gsm8k
    - math
    - numina
    - deepmath
    - openmath
    - frontiermath
  - name: 🧮 Math RLVR datasets
    name_zh: 数学 RLVR 数据集
    focus: math records used for rejection sampling, SFT, PRMs, and RLVR
    focus_zh: 用于拒绝采样、SFT、PRM 与 RLVR 的数学记录
    key_risk: data reuse and contamination are not reported
    key_risk_zh: 数据复用与污染情况未被报告
    keywords:
    - math rlvr
    - deepseekmath
    - openr1
    - big-math
    - math-prm
  - name: 💻 Code execution / unit-test data
    name_zh: 代码执行与单测数据
