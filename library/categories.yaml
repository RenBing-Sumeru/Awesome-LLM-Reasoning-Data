- id: preference_reward_feedback_data
  order: 2
  group: core_reasoning_data_types
  emoji: 🤝
  title: Preference and Reward Feedback Data
  file: 01_core_reasoning_data_types/02_preference_reward_feedback_data.md
  summary: Human preferences, AI feedback, reward models, DPO-style pairs, scalar rewards, critiques, and rubric-conditioned
    feedback records.
  reader_promise: Use this track to compare preference and reward signals before they become training objectives or evaluation
    proxies.
  why:
  - Preference and reward data is the bridge between demonstrations and optimization. It can appear as chosen/rejected pairs,
    scalar scores, critiques, reward-model labels, constitutional feedback, rubric scores, or judge outputs. Reasoning work
    often reuses these signals, but the meaning changes when the task also has a programmatic verifier or an environment predicate.
  - The practical question is whether the feedback contract is reusable. A reward model trained for helpfulness may not be
    a reliable verifier for math reasoning. A rubric score can be interpretable but brittle. A DPO pair can encode useful
    preferences while hiding annotator context. This track keeps those assumptions visible.
  - For high-quality curation, each paper card should state who produced the feedback, what alternatives were compared, what
    the reward optimizes, and where the feedback can fail or be gamed.
  how_to_read:
  - 'Name the feedback object: pairwise preference, scalar reward, critique, rubric score, judge vote, or reward-model output.'
  - 'Check who or what labels the data: humans, experts, frontier models, synthetic judges, or trained reward models.'
  - Ask whether the feedback trains a reward model, directly optimizes a policy, filters data, reranks candidates, or evaluates
    outputs.
  - Look for reward overoptimization, judge bias, position effects, and domain mismatch.
  open_questions:
  - Which preference signals remain useful once a cheap programmatic verifier exists?
  - How should reward datasets disclose annotator and judge assumptions?
  - Can AI feedback be made auditable enough for open reasoning-data releases?
  - What evidence shows a reward improves real reasoning rather than stylistic compliance?
  related_docs:
  - ../docs/06_verifiers_and_rewards.md
  - ../docs/04_data_quality.md
  related_cards:
  - ../docs/paper_card_sop.md
  - ../docs/paper_card_sop.md
  subfields:
  - name: 🤝 Human preference data / RLHF
    name_zh: 人类偏好数据与 RLHF
    focus: human comparison data, helpful/harmless feedback, and RLHF reward targets
    focus_zh: 人工对比数据、有用/无害反馈与 RLHF 奖励目标
    key_risk: annotator assumptions and disagreement are hidden
    key_risk_zh: 标注者的假设与分歧被隐去
    keywords:
    - preference
    - rlhf
    - human feedback
    - helpful
    - harmless
  - name: ⚖️ DPO / preference optimization
    name_zh: DPO 与偏好优化
    focus: pairwise data used directly for preference optimization
    focus_zh: 直接用于偏好优化的成对数据
    key_risk: preference pairs are reused outside collection context
    key_risk_zh: 偏好对被脱离采集语境复用
    keywords:
    - dpo
    - direct preference
    - preference optimization
    - ipo
    - kto
  - name: 🎚️ Scalar reward / ORM data
    name_zh: 标量奖励与结果奖励数据
    focus: outcome reward labels, scalar scores, and trained reward-model targets
    focus_zh: 结果奖励标签、标量分数与训练奖励模型的目标
    key_risk: scalar reward hides why an answer is better
    key_risk_zh: 标量奖励掩盖了「为什么这个答案更好」
    keywords:
    - outcome reward
    - orm
    - scalar reward
    - reward model
  - name: 🤖 RLAIF / synthetic feedback
    name_zh: RLAIF 与合成反馈
    focus: model-generated preferences, critiques, and constitutional feedback
    focus_zh: 模型生成的偏好、批判与 constitutional 反馈
    key_risk: synthetic judge behavior is treated as human preference
    key_risk_zh: 把合成评审的行为当作人类偏好
    keywords:
    - constitutional
    - rlaif
    - ai feedback
    - self-rewarding
    - ultrafeedback
  - name: 🧪 Reward-model benchmarks
    name_zh: 奖励模型基准
    focus: rewardbench-style evaluation data and reward-model stress tests
    focus_zh: RewardBench 式评测数据与奖励模型压力测试
    key_risk: benchmark preference does not predict downstream training value
    key_risk_zh: 基准上的偏好不能预测下游训练价值
    keywords:
