  summary_zh: 多次采样、搜索树、best-of-N 样本、自一致性轨迹、MCTS 记录、被选中与被拒绝的候选，以及推理时计算日志。
  reader_promise_zh: 当关键数据不是一个答案，而是一组采样尝试、搜索路径、选择器分数或推理预算轨迹时，用这个方向。
- id: environment_agent_trajectory_data
  order: 6
  group: core_reasoning_data_types
  emoji: 🌐
  title: Environment and Agent Trajectory Data
  file: 01_core_reasoning_data_types/06_environment_agent_trajectory_data.md
  summary: Tool calls, web/browser tasks, app and OS agents, repository-level SWE episodes, replayable trajectories, and terminal
    predicates.
  reader_promise: Use this track to understand how interactive environments become post-training data sources and feedback
    contracts.
  why:
  - Agent data turns reasoning from a static completion into an episode. The model observes state, chooses actions, calls
    tools, receives environment responses, and eventually succeeds, fails, or times out. The environment is therefore part
    of the verifier, not just a UI around the task.
  - This track covers tool-use data, browser and web agents, mobile/app tasks, desktop/OS tasks, SWE repository agents, terminal
    predicates, replay metadata, and agent benchmarks. It is designed for contributors who want to add papers without losing
    the crucial episode schema.
  - High-quality cards should state the state/action/observation format, tool schema, environment version, terminal predicate,
    failure preservation, and whether the same tasks are used for training and evaluation.
  how_to_read:
  - 'Write down the episode schema: observation, state, action, tool/environment response, reward, terminal predicate, and
    replay metadata.'
  - Check whether tasks are demonstrations, executable environments, generated training worlds, or evaluation benchmarks.
  - Inspect public GitHub issue, benchmark, and hidden-test contamination carefully.
  - Verify whether the environment can be reset and replayed.
  open_questions:
  - Which agent datasets are replayable enough for RL rather than only SFT?
  - How should failed and near-miss trajectories be released?
  - Can live web/app environments remain stable enough for benchmark claims?
  - What is the minimum metadata for a SWE episode to be auditable?
