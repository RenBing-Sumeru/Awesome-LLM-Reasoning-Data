- id: instruction_demonstration_rationale_data
  order: 1
  group: core_reasoning_data_types
  emoji: 🧱
  title: Instruction, Demonstration, and Rationale Data
  file: 01_core_reasoning_data_types/01_instruction_demonstration_rationale_data.md
  summary: Instruction-response examples, human demonstrations, synthetic instructions, rationales, chain-of-thought traces,
    and teacher-written reasoning targets.
  reader_promise: Use this track to understand how reasoning behavior is serialized before preference, verifier, or environment
    feedback is added.
  why:
  - 'Many reasoning-data systems still begin with demonstrations: a task, a target answer, and sometimes a rationale or chain-of-thought
    trace. This track collects the papers that teach how those targets are sourced, generated, filtered, distilled, and reused
    for SFT or bootstrapped reasoning improvement.'
  - The key distinction is fidelity. A rationale can be a useful teaching artifact, but it can also be a style target that
    merely looks like reasoning. For every paper, readers should ask who authored the trace, whether the final answer was
    checked, whether rejected traces are visible, and whether the training objective consumes the trace or only the final
    answer.
  - This track gives contributors a clear home for instruction tuning, self-instruction, CoT, STaR, long/short reasoning traces,
    and teacher-distilled demonstration releases without mixing them into preference rewards or programmatic-verifier work.
  how_to_read:
  - 'Identify the serialized target: answer only, rationale, long CoT, critique, tool trace, or teacher solution.'
  - 'Write down the trace author: human, base model, teacher model, self-training policy, or search procedure.'
  - Check whether the paper verifies final correctness before training on the rationale.
  - Distinguish demonstration quality from downstream reward or verifier quality.
  open_questions:
  - When does training on rationales teach transferable reasoning rather than trace style?
  - How much teacher identity and sampling metadata should an open rationale release disclose?
  - Can long-CoT distillation preserve useful uncertainty and failed attempts?
  - What should a paper card record when the demonstration source is partially hidden?
  related_docs:
  - ../docs/03_reasoning_data_objects.md
  - ../docs/05_construction_cookbook.md
  related_cards:
  - ../docs/paper_card_sop.md
  - ../docs/paper_card_sop.md
