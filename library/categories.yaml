paper_categories:
- id: foundations_and_primers
  order: 0
  group: background_foundations
  emoji: 🧭
  title: Foundations and Primers
  file: 00_background_foundations/00_foundations_and_primers.md
  summary: Surveys, primers, classic post-training lineages, data documentation, and evaluation background for readers entering
    the field.
  reader_promise: 'Use this track when you need the map before the terrain: vocabulary, taxonomies, historical lineages, and
    recurring audit questions.'
  why:
  - 'This track is the front door of the atlas. It gives new readers a controlled way to understand post-training reasoning
    data before opening dozens of specialized papers. The goal is not to flatten the field into a generic survey list; it
    is to teach the reader which objects repeat across the repo: prompts, traces, answers, verifiers, rewards, judges, environments,
    metadata, and audit evidence.'
  - The track combines field surveys with foundational alignment-data papers because modern reasoning-data work inherits older
    habits from instruction tuning, RLHF, preference optimization, chain-of-thought prompting, self-training, and data documentation.
    Those lineages explain why a reasoning-data release is more than a prompt-answer table and why every useful entry needs
    source, label, verifier, split, license, and contamination context.
  - Readers should treat this page as a routing layer. Extract the taxonomy first, then jump into the data-type tracks once
    you know whether you are studying demonstrations, preference pairs, programmatically verified outcomes, process labels,
    rollout traces, agent episodes, or rubric judgments.
  how_to_read:
  - Separate concept papers from primary data releases, benchmarks, and model reports.
  - 'Track which taxonomy each paper uses: data object, feedback contract, training objective, or audit risk.'
  - When a survey mentions a benchmark or dataset, follow the primary source before treating the claim as reusable evidence.
  - Record missing metadata explicitly instead of promoting uncertain entries as verified resources.
  open_questions:
  - Which taxonomy best predicts what a downstream builder should do next?
  - How should surveys represent partially disclosed frontier-model data recipes?
  - What metadata fields are essential for a living Awesome list to stay reproducible?
  - How can Chinese and English learning routes stay aligned as the field changes?
  related_docs:
  - ../docs/00_start_here.md
  - ../docs/01_what_is_post_training_reasoning_data.md
  - ../docs/02_verifier_anchored_taxonomy.md
