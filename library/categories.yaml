- id: rollout_search_test_time_trace_data
  order: 5
  group: core_reasoning_data_types
  emoji: 🔁
  title: Rollout, Search, and Test-Time Trace Data
  file: 01_core_reasoning_data_types/05_rollout_search_test_time_trace_data.md
  summary: Multiple rollouts, search trees, best-of-N samples, self-consistency traces, MCTS records, selected/rejected candidates,
    and test-time compute logs.
  reader_promise: Use this track when the important data is not one answer but a set of sampled attempts, search paths, selector
    scores, or inference-budget traces.
  why:
  - A growing part of reasoning data is produced by search. A model samples many attempts, a verifier or value function scores
    them, and the system keeps accepted candidates, sometimes with rejected traces, budgets, tree nodes, or pass-rate bands.
    These records connect data construction, process supervision, RLVR, and test-time compute.
  - This track exists because search traces are often hidden inside other categories. If a paper relies on best-of-N, self-consistency,
    MCTS, rejection sampling, long-to-short reasoning, or repeated sampling, contributors should record the rollout budget
    and selector, not just the final chosen answer.
  - 'For curation, the most important audit question is attribution: did performance improve because of better data, more
    samples, a stronger verifier, a different optimizer, or a larger inference budget?'
  how_to_read:
  - Record the sampling budget, temperature, verifier score, selector, and whether rejected traces are released.
  - Separate training-time search-generated data from test-time compute used only at inference.
  - Check whether pass@k or best-of-N comparisons use equal budgets.
  - Look for decontamination and duplicate-prompt controls in search-generated data.
  open_questions:
  - How much of a reasoning-data gain comes from search rather than the final dataset?
  - Should open releases include rejected rollouts and search trees by default?
  - How can pass@k and training-data scale be compared fairly?
  - Can selector behavior be audited without exposing proprietary verifier details?
  related_docs:
  - ../docs/05_construction_cookbook.md
  - ../docs/08_scaling_and_test_time_compute.md
  related_cards:
  - ../docs/paper_card_sop.md
  - ../docs/paper_card_sop.md
  subfields:
  - name: 🎲 Multiple rollouts / best-of-N
    name_zh: 多次采样与 best-of-N
    focus: sets of sampled attempts and selected accepted answers
    focus_zh: 多组采样尝试及最终被选中的答案
    key_risk: only accepted traces are visible
    key_risk_zh: 只有被接受的轨迹是可见的
    keywords:
    - best-of
    - best of
    - multiple rollouts
    - pass@k
    - sample
  - name: 🌳 Search trees / MCTS
    name_zh: 搜索树与 MCTS
    focus: tree search, MCTS, verifier-guided search, and path selection
    focus_zh: 树搜索、MCTS、验证器引导搜索与路径选择
    key_risk: tree policy or value model is hidden
    key_risk_zh: 树搜索策略或价值模型被隐去
    keywords:
    - mcts
    - tree search
    - search tree
    - rest-mcts
  - name: 🔎 Rejection sampling traces
    name_zh: 拒绝采样轨迹
    focus: accepted and rejected candidates produced during filtering
    focus_zh: 筛选过程中产生的被接受与被拒绝候选
    key_risk: rejected examples are not released
    key_risk_zh: 被拒绝的样本没有发布
    keywords:
    - rejection sampling
    - reject
    - accepted
    - filtered
  - name: 🧠 Self-consistency / repeated sampling
    name_zh: 自一致性与重复采样
    focus: vote-based or agreement-based reasoning from repeated samples
    focus_zh: 基于投票或一致性的重复采样推理
    key_risk: sampling budget is not comparable
    key_risk_zh: 采样预算不可比
    keywords:
    - self-consistency
