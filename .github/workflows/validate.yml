name: Validate atlas data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ask-atlas/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix apps/ask-atlas
      # Data legality first: the render checks below only prove the generated files match
      # the library, not that the library itself is well formed.
      - name: Validate the card library
        run: python scripts/validate_library.py --max-warnings 16
      # `library/` is the only source of truth; these checks re-render into a temporary
      # directory and fail if anything committed drifts from the cards.
      - name: Check published site
        run: python scripts/build_site.py --check
      - name: Check README and track pages
        run: python scripts/render_docs.py --check
      - name: Check exports
        run: python scripts/render_exports.py --check
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Check Ask backend URL config safety
        run: |
          set -euo pipefail
          python scripts/set_ask_backend_url.py --check
      - name: Check Ask entrypoints
        run: python scripts/check_ask_entrypoints.py
      - name: Check Ask production RAG corpus
        run: npm --prefix apps/ask-atlas run rag:check
      - name: Test Ask the Atlas backend
        run: npm --prefix apps/ask-atlas test
