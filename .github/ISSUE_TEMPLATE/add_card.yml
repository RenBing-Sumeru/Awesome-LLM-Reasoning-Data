name: Add or improve a card
about: Add a release, verifier, agent, or recipe card with audit fields.
title: "[Card] <work name>"
labels: ["card", "metadata"]
body:
  - type: input
    id: entry_id
    attributes:
      label: Proposed entry_id
      description: A lowercase slug ending in the publication year, for example math-shepherd-verify-and-reinforce-llm-math-reasoning-2024. The card becomes library/cards/<entry_id>/.
    validations:
      required: true
  - type: input
    id: tracks
    attributes:
      label: Research track(s)
      description: One or two ids from library/categories.yaml, for example process_trace_supervision_data.
    validations:
      required: true
  - type: textarea
    id: data_object
    attributes:
      label: Data object fields
      description: Prompt/source, trace/action, answer/artifact, feedback/verifier, and metadata. Use unknown for unverified fields.
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Audit notes
      description: Verification contract, supervision granularity, construction recipe, known limitations, and missing official sources.
    validations:
      required: true
